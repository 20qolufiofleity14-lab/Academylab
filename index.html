ng>（ためてから出す）習慣がつくと、膀胱が年齢相当の倍ほどにまで広がります。すると尿がうまく出きらず、<strong>水腎症</strong>から<strong>腎不全</strong>へと進みます。報告では約3割に尿路の拡張が見つかっています。</p>\n<ul><li><strong>がまんせず、頻回に排尿する</strong></li>\n<li><strong>二重排尿</strong>（一度出したあと、もう一度出しきる）の習慣をつける</li>\n<li>排尿の回数と1回の尿量を<strong>記録</strong>させる</li></ul>\n<p>冒頭の子のように、学校でトイレをがまんする年齢がいちばん危ない時期です。学校にも事情を伝えて、いつでもトイレに行ける環境を整えます。すでに広がってしまった子では、<strong>夜間に尿道カテーテルを入れて膀胱を空にしておく</strong>方法が選ばれた例もあります。</p>\n<h3>溶質を減らすと尿が減る理屈</h3>\n<p>最大でも尿を100 mOsm/Lまでしか濃くできない子が、1日600 mOsmの溶質（尿素・Na・K・Cl）を捨てるには、<strong>6,000 mL</strong>の尿が要ります。溶質を減らせば、必要な尿量は減ります。これが<strong>低塩・低蛋白</strong>の理屈です。ただし子どもでは、極端な制限は発育を損ねるので勧められません。</p>\n<p>塩分がどれだけとれているかは、蓄尿から推定できます。</p>\n<div class=\"formula\">食塩摂取量（g/日）≒ 尿中Na（mEq/L）× 蓄尿量（L/日）÷ 17</div>\n<p>数字で確かめると、家族と現実的な目標を相談できます。</p>\n<h3>薬の組み合わせ</h3>\n<p>サイアザイド（ヒドロクロロチアジド2〜4 mg/kg/日）に、作用の仕組みが違う<strong>NSAIDs（インドメタシン）</strong>を併用すると、さらに尿を減らせます。インドメタシンは2018年に腎性尿崩症で保険適用になりました。ほかのNSAIDsは有効性や安全性に不明な点があり、慎重に扱います。部分型で、バソプレシン負荷に少しでも反応がある子では、DDAVPが効くこともあります。</p>\n<h3>分子の話を少し</h3>\n<p>V2受容体からAQP2までの道は、<strong>Gs → cAMP → PKA → AQP2のリン酸化と膜への移動</strong>です。V2受容体の遺伝子はX染色体に、AQP2は12番染色体にあります。V2受容体の変異は280以上報告され、多くは小胞体で正しく折りたためずに膜まで届けないタイプです。折りたたみを助ける「化学シャペロン」の研究は、この仕組みに基づいています。</p>", "keys": ["腎不全への最大の経路は膀胱（ため込み→膀胱拡張→水腎症）", "頻回排尿・二重排尿・記録。学校の環境も整える", "溶質を減らすと必要な尿量が減る。ただし極端な制限はしない", "食塩摂取量≒尿Na×尿量÷17", "サイアザイド＋インドメタシン（2018年保険適用）"], "upd": null, "quiz": [{"v": "", "q": "腎性尿崩症で腎不全に至りうる最も重要な合併症の経路は。", "o": ["サイアザイドの長期投与による慢性間質性腎炎と、低K血症に伴う腎性尿崩症の増悪で濃縮能がさらに落ちる", "排尿回数が少ないこと（infrequent voiding）による膀胱拡張・水腎症", "反復する尿路感染症による慢性腎盂腎炎", "繰り返す高Na性脱水による急性尿細管壊死と、それに続く間質の線維化"], "a": 1, "e": "大量の尿を溜め込んでから出す習慣がつくと、膀胱容量が年齢相当の倍ほどに拡がり、水腎症から腎不全へ進む。排尿回数と1回尿量を必ず記録させる。", "r": "症例b p.102-103 / p.105"}, {"v": "", "q": "蓄尿から食塩摂取量を推定する式として正しいのは。", "o": ["尿中Na（mEq/L）×蓄尿量（L/日）÷17", "尿中Na（mEq/L）×蓄尿量（L/日）÷34", "尿中Na（mEq/L）＋蓄尿量（L/日）", "尿中Na（mEq/L）×体重÷17"], "a": 0, "e": "塩分制限が守れているかを数字で確かめる。成人なら家庭全体で続けられる1日8g程度が現実的な目標として挙げられている。", "r": "p.101"}, {"v": "", "q": "腎性尿崩症でサイアザイドに併用して尿量減少が期待できるのは。", "o": ["NSAIDs（インドメタシンなど、作用機序が異なるため相加効果が期待できる）", "ループ利尿薬（フロセミド）による髄質勾配の是正", "カリウム保持性利尿薬（アミロライド）による遠位尿細管でのNa再吸収促進（サイアザイドと同じ部位に働く）", "ACE阻害薬による糸球体内圧の低下と濾過量の減少"], "a": 0, "e": "日本では2018年にインドメタシンが腎性尿崩症に保険適用となった。他のNSAIDsは有効性・安全性に不明な点があり慎重に扱う。", "r": "治療 p.1084"}]}, {"id": "w6", "lv": 2, "t": "低Na血症：SIADHとCSWS", "min": 7, "cats": "低Na血症・SIADH", "src": "表3・4 p.94-95 ／ 小児内分泌学 p.279-281 ／ 治療 p.1088-1089", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>頭部外傷の術後3日目の子。Naが125まで下がった。尿量はかなり多く、体重も減っている。主治医は水分制限を指示しようとしています。</div><p>Naが低い、だからSIADH、だから水分制限。この流れで考えると、冒頭の子では大きな間違いになるかもしれません。尿が多く、体重が減っている。<strong>脱水がある</strong>のです。今日はこの分かれ道の話です。まず、SIADHと尿崩症は、ちょうど裏返しの関係にあります。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>血漿浸透圧</th><th>尿浸透圧</th></tr>\n<tr><td>SIADH</td><td>240〜260（薄い）</td><td>350〜650（濃い）</td></tr>\n<tr><td>尿崩症</td><td>305〜320（濃い）</td><td>35〜120（薄い）</td></tr></table></div>\n<p>尿量だけでは判断を誤ります。<strong>血漿と尿の浸透圧を対で</strong>読みます。</p>\n<h3>決め手は体液量</h3>\n<p>SIADHとCSWS（中枢性塩類喪失）は、Na値だけでは分けられません。決め手は<strong>脱水があるかどうか</strong>です。CSWSは尿量が10〜20倍にもなり脱水を伴います。治療は正反対で、<strong>SIADHは水分制限、CSWSはNa補充と輸液</strong>（足りなければフルドロコルチゾン）。頭部外傷や脳外科手術のあとはどちらも起こりうるので、冒頭の子のように尿量と体重を見ずに水分制限をかけると、脱水の子からさらに水を奪うことになります。</p>\n<p>尿中Naが20 mEq/Lを超えるときは、SIADH、利尿薬、ミネラルコルチコイド欠乏、CSWSなど腎からの喪失を考えます。下痢や嘔吐では20未満に下がります。</p>\n<h3>SIADHに生食を入れると</h3>\n<p>入れたNaはすぐ尿に出てしまい、結果として<strong>自由水を足したことになって悪化</strong>しえます。体液量を評価してから輸液を選びます。手術やストレスのあとにもSIADH様の低Naが起こります。尿量と体重が動いていないなら、脱水ではありません。</p>\n<h3>補正の速さ</h3>\n<p>急いで上げると浸透圧性脱髄症候群を起こします。安全域は<strong>24時間で12 mEq/L以下</strong>（できれば8〜10）です。けいれんや意識障害があるときだけ、<strong>3%食塩水2 mL/kg</strong>を10分以上かけて、Naが5〜6上がるまで繰り返します。</p>\n<p>SIADHもCSWSも一過性で治ることが多いので、漫然と続けず定期的に見直します。</p><p>低Na血症全体をどう分類するかは、次の回でまとめます。</p>", "keys": ["SIADHは薄い血に濃い尿、尿崩症はその逆", "SIADHとCSWSの決め手は体液量。治療は正反対", "SIADHに生食は悪化しうる", "補正は24時間で12 mEq/L以下。症状があれば3%を2 mL/kg", "一過性が多い。漫然と続けない"], "upd": null, "quiz": [{"v": "", "q": "SIADHの典型的な検査値の組み合わせは。", "o": ["血漿浸透圧305〜320、尿浸透圧35〜120", "血漿浸透圧240〜260、尿浸透圧350〜650", "血漿浸透圧正常、尿浸透圧低値（多飲型）", "血漿浸透圧305〜320、尿浸透圧35〜120（尿崩症型）"], "a": 1, "e": "薄い血に濃い尿。尿崩症はその裏返しで、濃い血に薄い尿（血漿305〜320、尿35〜120）。この2組を対にして覚える。", "r": "表3 p.94"}, {"v": "", "q": "SIADHとCSWSを鑑別するうえで決定的なのは。", "o": ["血清Na値の程度", "体液量（脱水があるか）", "血清Na値の程度（CSWSのほうが低い）", "尿量（SIADHでは減り、CSWSでは増える）"], "a": 1, "e": "Na値だけでは分けられない。CSWSでは尿量が通常の10〜20倍にもおよび脱水を認める。誤ると、脱水の子に水分制限をかけることになる。", "r": "表4 p.95"}, {"v": "", "q": "低ナトリウム血症の補正速度として安全域とされるのは。", "o": ["24時間で12 mEq/L以下", "24時間で20 mEq/L以下", "できるだけ速やかに正常化", "制限はない"], "a": 0, "e": "急ぐと浸透圧性脱髄症候群（ODS）を起こす。発症から48時間以内なら急性、それ以上経過していれば慢性として対処する。", "r": "小児内分泌学 p.281 / 治療 p.1088"}]}, {"id": "wB", "lv": 3, "t": "低Na血症を分類する", "min": 6, "cats": "低Na血症・SIADH", "src": "小児内分泌学 p.113-115, 266, 279-281 ／ 治療 p.1088", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>肺炎で入院した5歳の子のNaが128。点滴の指示を出す前に、まず何を見ますか。</div><p>低Na血症を見たとき、<strong>Naの数字だけで治療を決めてはいけません</strong>。最初に見るのは<strong>体液量</strong>です。今日は、低Na血症を地図の上に置く方法を整理します。</p>\n<h3>まず体液の前提</h3>\n<p>子どもの体は水が多く、新生児では体重の約80%が水です。年齢が低いほど細胞外液の割合が大きい。そして、細胞の内と外の水の移動を決める「有効浸透圧（張度）」を作るのは、<strong>Naとブドウ糖</strong>です。尿素は細胞膜を自由に通るので、張度には寄与しません。</p>\n<h3>体液量で3つに分ける</h3>\n<ul><li><strong>体液が減っている（hypovolemic）</strong>：下痢・嘔吐など。腎外からの喪失なら<strong>尿中Naは20 mEq/L未満</strong>に下がる。生理食塩水ですぐ良くなる</li>\n<li><strong>体液量は変わらず、水だけ増えた（euvolemic）</strong>：<strong>SIADH、副腎不全、甲状腺機能低下症</strong>。血圧や脈は正常で、むくみはない。BUNは低め</li>\n<li><strong>体液が増えている（hypervolemic）</strong>：心不全、ネフローゼなど。むくみがある</li></ul>\n<p>尿中Naが<strong>20を超える</strong>なら、腎からNaが失われています。SIADH、利尿薬、ミネラルコルチコイド欠乏、CSWSなどを考えます。</p>\n<h3>SIADHの診断の手引き</h3>\n<p>低Na・低浸透圧なのに、尿は濃く、尿中Naが出ている。<strong>腎機能と副腎機能が正常</strong>であることも条件です。レニンはむしろ低く（5 ng/mL/h以下）、BUNは5 mg/dL以下のことが多い。「レニンが高い」はSIADHではありません。</p>\n<h3>SIADHの中の「型」</h3>\n<ul><li><strong>reset osmostat</strong>：浸透圧の設定点が低い側にずれているだけで、調節そのものは働いている。だから水が多すぎなければ低Naにならない</li>\n<li><strong>NSIAD</strong>：V2受容体の<strong>機能亢進</strong>。AVPは低いのに濃い尿が出る。SIADHの診断にAVP測定が必須でない理由の一つ</li></ul>\n<h3>水分制限の考え方</h3>\n<p>SIADHの水分制限は、「尿として捨てるべき溶質の量から、必要な自由水を見積もる」考え方で組み立てます（不感蒸泄は500 mL/m²/日と仮定）。塩分や蛋白を増やすと尿素が増えて、溶質利尿で改善することもあります。逆に減らすと、さらに水が要ります。</p>\n<h3>補正のスピードは、上げるときも下げるときも</h3>\n<p>低Naを急いで上げると<strong>浸透圧性脱髄</strong>、高Naを急いで下げると<strong>脳浮腫</strong>。どちらも、Naの変化を<strong>24時間で12 mEq/L以内（できれば8〜10）</strong>に抑えます。けいれんなど重い症状があるときだけ、3%食塩水で数mEq/Lを速やかに上げます。冒頭の子では、まず体液量と尿中Naを見て、どの箱に入るかを決めてから輸液を選びます。</p>", "keys": ["低Naは数字より先に体液量を見る", "hypovolemic（尿Na<20）／euvolemic（SIADH・副腎不全・甲状腺機能低下）／hypervolemic", "尿Na>20は腎からの喪失", "SIADHはレニン低値・BUN低値、腎・副腎機能正常", "reset osmostatとNSIAD", "Naの変化は24時間で12以内（上げるのも下げるのも）"], "upd": null, "quiz": [{"v": "", "q": "低ナトリウム血症の分類で euvolemic hyponatremia に含まれるのは。", "o": ["SIADH、副腎不全、甲状腺機能低下症", "腎不全、心因性多飲、ビール多飲（水負荷型）", "下痢、嘔吐、利尿薬による脱水（腎外性・腎性のNa喪失）", "心不全、肝硬変、ネフローゼ症候群"], "a": 0, "e": "体内Na量は変わらず水のみが増える型。血圧・脈拍の異常や浮腫・腹水を欠き、血清BUNは低め。hypovolemicでは尿中Naが20 mEq/L未満に低下し、生理食塩水で速やかに改善する。", "r": "小児内分泌学 p.279"}, {"v": "", "q": "SIADHの診断の手引きの検査所見に含まれないのは。", "o": ["血清Na < 135 mEq/L、血漿浸透圧 < 280 mOsm/kg", "血漿AVPが抑制されていない", "尿浸透圧 > 100 mOsm/kg、尿中Na ≧ 20 mEq/L", "血漿レニン活性の上昇"], "a": 3, "e": "むしろレニン活性は5 ng/mL/h以下、BUNは5 mg/dL以下のことが多い。腎機能・副腎機能が正常であることも条件に入る。", "r": "小児内分泌学 表6 p.280"}, {"v": "", "q": "SIADHでAVP分泌が「過剰分泌」といえない型として知られるのは。", "o": ["reset osmostat（浸透圧調節の設定点が低い側にずれているが調節自体は働く型）", "薬剤によりV2受容体が持続的に活性化され、AVPが抑制されていても抗利尿が続く型（NSIAD）", "分泌が周期的に変動し、低Naと高Naを繰り返す型", "薬剤によりV2受容体が持続的に活性化される型（NSIAD）"], "a": 0, "e": "設定点がずれているだけなので、不感蒸泄を超える水分がなければ低Na血症を呈さない。AVPが血漿浸透圧の調節を受けない型とは区別される。", "r": "小児内分泌学 図 p.280"}]}, {"id": "wA", "lv": 3, "t": "新生児の水とNa", "min": 6, "cats": "新生児・複合型・低Na血症・SIADH", "src": "症例1 p.89-94 ／ 小児内分泌学 p.158, 267 ／ 治療 p.1079", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>NICUで中枢性尿崩症と診断された赤ちゃん。DDAVPを始めたら、Naが一日の中で大きく上下して、なかなか落ち着きません。</div><p>新生児の水とNaの管理は、大きい子と同じ考え方では通用しません。<strong>腎臓が未熟</strong>で、しかも<strong>自分で飲む量を決められない</strong>からです。</p>\n<h3>新生児の腎臓のくせ</h3>\n<ul><li><strong>GFRが低い</strong></li>\n<li>尿を濃くする力は<strong>最大700 mOsm/kg程度</strong>（大人よりずっと弱い）</li>\n<li>薄める力は大人並みだが、GFRが低いので、<strong>4 L/m²/日以上の水</strong>が入ると低Naになる</li>\n<li><strong>Kを捨てる力も弱い</strong>ので高K血症になりやすい</li>\n<li>FENaは早産児では1.5%ほどまでが正常</li></ul>\n<p>尿を濃くする力がもともと弱いので、<strong>軽い（部分型の）尿崩症の診断は慎重に</strong>します。</p>\n<h3>新生児の「多尿」は予想と比べる</h3>\n<p>新生児はもともとミルクの量が多いので、尿の量の絶対値だけでは多尿と言えません。<strong>不感蒸泄（約600 mL/m²）と哺乳量から予想される尿量</strong>を出して、実際の尿量と突き合わせます。</p>\n<h3>冒頭の赤ちゃん：Naが振れる理由</h3>\n<p>赤ちゃんは、のどが渇いても自分で飲めず、多すぎても飲むのをやめられません。<strong>飲水を自分で調節できない</strong>ので、DDAVPが効いている時間とミルクの時間がずれると、Naが大きく振れます。</p>\n<ul><li>DDAVPを<strong>分割</strong>して使う</li>\n<li>投与の前後で<strong>ミルクの量を調整</strong>する</li>\n<li><strong>体重とNaの推移</strong>を見ながら詰めていく</li></ul>\n<p>口腔内崩壊錠を溶かして経管で入れる方法も試みられています。</p>\n<h3>周術期はAVPの点滴で</h3>\n<p>手術の前後のように体液が大きく動く場面では、半減期が<strong>数分</strong>と短いAVP（バソプレシン）の持続点滴が向いています。尿量を見ながらすぐに調節できるからです。このとき、<strong>水とNaを分けて</strong>考え、それぞれの出入り（尿量と輸液量、輸液のNaと尿のNa）を突き合わせて血清Naを追います。</p>\n<h3>複合型下垂体機能低下症の赤ちゃん</h3>\n<p>第13話で見るように、ACTHも足りない子では、コルチゾールを補ったとたんに隠れていた尿崩症が出てきます。新生児期の水の管理は、<strong>副腎と一緒に</strong>考えることが欠かせません。</p>", "keys": ["新生児はGFRが低く、尿を濃くする力は最大700程度", "4 L/m²/日以上の水で低Na、K排泄も弱い", "部分型尿崩症の診断は慎重に", "多尿は不感蒸泄と哺乳量からの予想尿量と比べる", "飲水を自分で調節できないのでNaが振れる。分割投与とミルク量の調整", "周術期は半減期の短いAVP持続点滴で、水とNaを分けて管理"], "upd": null, "quiz": [{"v": "", "q": "新生児の腎機能で、水・電解質管理に影響する特徴として正しいのは。", "o": ["GFRが低く、尿濃縮能は最大700 mOsm/kg程度、K排泄能も低いため、高K血症や低Na血症になりやすい", "GFRは成人並みで濃縮能も1,200 mOsm/kgに達するが、K排泄能は成人より高く、低K血症になりやすい", "希釈能が低く、水負荷に弱いが濃縮は正常", "K排泄能は成人より高く、低K血症になりやすい"], "a": 0, "e": "希釈能は成人同様だがGFRが低いため、4 L/m²/日以上の水負荷で低Na血症になる。尿濃縮能が低いので、部分型尿崩症の診断は慎重に。FENaは早産児で1.5%程度まで正常。", "r": "小児内分泌学 p.158"}, {"v": "", "q": "新生児・乳児のDDAVP治療でNa値の日内変動が大きくなる理由は。", "o": ["DDAVPの代謝が速く、効果が数時間で切れるから", "自発的な飲水コントロールができないから", "腎の濃縮能が未熟で、DDAVPへの反応が不安定だから", "DDAVPの吸収が悪いから"], "a": 1, "e": "口渇に応じて飲む・控えるができない。分割投与や、投与前後のミルク量の調整でNaの振れを抑える。体重測定とNaプロフィールで詰めていく。", "r": "関連症例1 p.93-94"}, {"v": "", "q": "AVP持続点滴（バゾプレシン）が選択されるのはどんな場面か。", "o": ["外来で点鼻の効きが不安定なとき（半減期が長く安定するため）", "周術期など体液バランスが大きく動く場面（半減期が数分と短く尿量で調節できる）", "夜間の尿量が多く点鼻で抑えきれないとき（就寝前に単回静注すれば朝まで持続する）", "外来で点鼻の効きが不安定なとき（半減期が長く血中濃度が安定するため）"], "a": 1, "e": "水とNaを分けて、それぞれのin/outのバランスをとる。尿量と輸液量、輸液中Na投与量と尿中Na排泄量を突き合わせて血清Naを追う。", "r": "小児内分泌学 p.267 / 治療 p.1079"}]}, {"id": "w7", "lv": 3, "t": "下垂体機能低下症と水・Na", "min": 6, "cats": "新生児・複合型・低Na血症・SIADH", "src": "関連症例1・3 p.92-97 ／ 小児内分泌学 p.270-271", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>下垂体機能低下症の大人の患者。平日は問題ないのに、疲れた週末に全身がむくむ。今回は吐き気で朝食をとれずに受診し、Naは115でした。</div><p>冒頭の人に起きていたのは、DDAVPの効きすぎとコルチゾール不足の重なりでした。前葉と後葉の両方が障害されると、水とNaの管理は一段むずかしくなります。コルチゾールとAVPが<strong>互いに影響し合う</strong>からです。</p>\n<h3>新生児の複合型：補充の順番</h3>\n<p>低血糖、正中構造の異常（口唇口蓋裂など）、小陰茎の組み合わせは先天性複合下垂体機能低下症のサインです。補充は<strong>ヒドロコルチゾンから</strong>。副腎不全は命に直結するので、まずバイタルを安定させ、それから甲状腺、GHと積みます。</p>\n<h3>コルチゾールを入れると尿が増える</h3>\n<p>コルチゾールが足りないあいだは自由水が出せず、尿崩症が隠れています。補充すると多尿が出てきます。逆に言えば、<strong>コルチゾール不足は低Naの方向に働きます</strong>。</p>\n<h3>週末の浮腫と低Na</h3>\n<p>平日は問題ないのに、疲れがたまる週末に浮腫や低Naが出る人がいます。疲れると飲水と服薬の型が崩れ、<strong>DDAVPの効きすぎとコルチゾール不足が重なる</strong>からです。DDAVPを減らし、ストレス時にはヒドロコルチゾンを増やす方針で改善します。</p>\n<h3>シックデイは方向が逆</h3>\n<p>具合が悪いときに足りなくなるのは<strong>コルチゾール</strong>で、DDAVPはむしろ効きすぎが問題になります。<strong>ヒドロコルチゾンは増やし、DDAVPは切れる時間を確保する</strong>。この逆向きを本人と家族に伝えておきます。尿崩症の人が低Naで運ばれてきたら、まずDDAVPの量と、切れる時間があったかを確認します。</p>\n<h3>口渇がない尿崩症</h3>\n<p>頭蓋咽頭腫の術後などで、口渇中枢が壊れていると<strong>口渇を感じないまま高Naが続きます</strong>（adipsic尿崩症）。口渇に頼れないので、Naが正常なときの体重を基準に飲む量を決めます。高Naでは血栓症も増えるので注意します。</p>", "keys": ["新生児の複合型はヒドロコルチゾンから補充", "コルチゾール補充で隠れた尿崩症が出てくる", "疲労時はDDAVP過量とコルチゾール不足が重なる", "シックデイ：ヒドロコルチゾンは増やし、DDAVPは切らす", "adipsic尿崩症は体重で飲水量を決める。血栓症に注意"], "upd": null, "quiz": [{"v": "新生児。低血糖、口唇口蓋裂、小陰茎。ACTH<0.5 pg/mL、コルチゾール<1.16 μg/dL、GH<0.07 ng/mL、fT4<0.4 ng/dL。", "q": "補充を開始する順序として最も適切なのは。", "o": ["GH（低血糖の主因であり、新生児期から開始する）", "ヒドロコルチゾン（副腎皮質ホルモン）から開始する", "LT4（fT4が測定感度以下で、中枢神経の発達を優先する）", "テストステロン（小陰茎の改善は乳児期に限られる）"], "a": 1, "e": "副腎不全は生命に直結する。バイタルを安定させてから甲状腺、GHと積む。正中構造異常＋小陰茎＋低血糖の組は先天性複合下垂体機能低下症のサイン。", "r": "関連症例1 p.92-93"}, {"v": "", "q": "下垂体機能低下症の患者に対するシックデイの指導として適切なのは。", "o": ["ヒドロコルチゾンとDDAVPをともに増量する", "ヒドロコルチゾンを増量し、DDAVPは切れる時間を確保する", "ヒドロコルチゾンは据え置き、DDAVPを増量する", "ヒドロコルチゾンを増量し、DDAVPも切れないよう増量する"], "a": 1, "e": "ストレス時に足りなくなるのはコルチゾール。DDAVPはむしろ効きすぎが問題になる。方向が逆であることを患者に伝えておく。", "r": "関連症例3 p.96-97"}, {"v": "視床下部領域の術後。明らかな脱水がないのに高ナトリウム血症が続き、本人は口渇をまったく訴えない。", "q": "最も考えられるのは。", "o": ["adipsic（hypodipsic）尿崩症", "中枢性尿崩症（口渇中枢は保たれる）", "腎性尿崩症（術後の腎障害による）", "中枢性尿崩症（口渇中枢は保たれる）で、口渇を訴えないのは意識障害のため"], "a": 0, "e": "口渇中枢の欠如にAVP分泌の調節異常が加わって発症する。頭蓋咽頭腫の術後などで起こる。口渇に頼れないので、血清Naが正常のときの体重を基準に摂取水分を決めていく。", "r": "小児内分泌学 p.270-271"}]}];
const THY = [{"id": "t1", "lv": 1, "t": "甲状腺の軸と、検査の読みかた", "min": 5, "cats": "甲状腺検査の読みかた", "src": "p.114, 133 ／ 小児内分泌学 p.451-453", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>健診で「甲状腺の数値が少しおかしい」と紹介された子。TSHは8.5と高めで、FT4は正常、FT3も正常。お母さんは「甲状腺ホルモンは正常なんですよね」と聞きます。</div><p>原発性の機能低下では、どの数字がいちばん先に、いちばん大きく動くのか。それが分かると、このお母さんへの答えが見えてきます。甲状腺も、視床下部（TRH）→ 下垂体（TSH）→ 甲状腺（T4・T3）という軸で考えます。T4やT3が下がるとTSHが上がって補おうとするので、<strong>原発性の機能低下でいちばん鋭敏に動くのはTSH</strong>です。治療効果の目安としてもTSHが最良です。</p>\n<h3>fT4が先、fT3はあと</h3>\n<p>原発性の機能低下では、<strong>fT4が先に下がり、fT3は比較的保たれます</strong>。甲状腺の中でT4からT3への変換が強まり、限られた材料をT3に回すからです。だから<strong>fT3が正常でも機能低下症は否定できません</strong>。</p>\n<p>冒頭のお母さんへの答えはこうなります。「甲状腺ホルモンの値は今のところ保たれていますが、それはTSHが上がって甲状腺を頑張らせているからです。TSHがいちばん早く変化を知らせてくれるので、これからはTSHを目安に見ていきましょう」。数字が正常範囲でも、その裏で軸が無理をしている、という見方です。</p>\n<h3>TSHが上がっていない低fT4</h3>\n<p>fT4が低いのにTSHが正常〜低値なら、<strong>中枢性の甲状腺機能低下症</strong>か、全身の病気による<strong>euthyroid sick症候群</strong>を考えます。TSHが動いていないことが手がかりです。</p>\n<h3>ホルモンができるまで</h3>\n<p>ヨウ素はNISで濾胞細胞に取り込まれ、ペンドリンで内腔側へ運ばれ、<strong>TPOがDUOX2の作るH₂O₂を使って有機化</strong>します。TSH受容体はGsとGqの両方につながり、cAMPでホルモン産生と増殖、Ca系でヨウ素化を動かします。どの段階が壊れるかで、先天性甲状腺機能低下症の顔つきが変わります（次の話で使います）。</p>\n<h3>脱ヨウ素酵素の分担</h3>\n<ul><li><strong>DIO1</strong>：肝・腎でT4→T3</li>\n<li><strong>DIO2</strong>：脳・下垂体・褐色脂肪で、その場のT3を作る（TSHのフィードバックにも関わる）</li>\n<li><strong>DIO3</strong>：胎盤・皮膚・胎児組織でT4→rT3（不活化）。胎児期にrT3が高いのはこのため</li></ul>", "keys": ["原発性の機能低下で最も鋭敏なのはTSH", "fT4が先に下がり、fT3は保たれる。fT3正常でも否定できない", "低fT4でTSHが上がらないなら中枢性かeuthyroid sick", "NIS→ペンドリン→TPO（DUOX2のH₂O₂）で有機化"], "upd": null, "quiz": [{"v": "", "q": "原発性甲状腺機能低下症で最も鋭敏な診断マーカーは。", "o": ["fT4", "fT3", "TSH", "サイログロブリン"], "a": 2, "e": "T4の低下はTSH上昇で代償されるため、TSHが先に、かつ大きく動く。治療効果の判断マーカーとしてもTSHが最良とされる。", "r": "p.133"}, {"v": "", "q": "原発性甲状腺機能低下症で、fT4とfT3のどちらが先に低下するか。", "o": ["fT3が先に低下し、fT4は比較的保たれる（T3優先産生の破綻）", "fT4が先に低下し、fT3は比較的保たれる", "両者が同時に同程度低下する", "fT3が先に低下するが、TSHは正常にとどまる"], "a": 1, "e": "甲状腺内でT4からT3への変換が亢進し、限られた材料をT3に振り向ける。だからfT3が正常でも甲状腺機能低下症は否定できない。", "r": "p.133"}, {"v": "", "q": "TSHが正常〜低値で、かつfT4も低値のとき考えるべきは。", "o": ["原発性甲状腺機能低下症の初期（TSH上昇が遅れている）", "中枢性甲状腺機能低下症または euthyroid sick syndrome", "甲状腺ホルモン不応症（TSHとfT4がともに高くなる型の逆）", "破壊性甲状腺炎の回復期（TSHの回復がfT4より遅れるため一時的にこのパターンをとる）"], "a": 1, "e": "TSHが上がっていないことが手がかり。下垂体側の問題か、非甲状腺疾患による変化かを分ける。", "r": "診断アルゴリズム p.114"}]}, {"id": "tA", "lv": 1, "t": "甲状腺ができるまで、ホルモンができるまで", "min": 6, "cats": "甲状腺検査の読みかた・先天性甲状腺機能低下症", "src": "小児内分泌学 p.448-455", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>先天性甲状腺機能低下症の赤ちゃんの家族に「甲状腺が首の正しい場所にないと言われた」と聞かれました。なぜ甲状腺が「場所を間違える」ことがあるのでしょうか。</div><p>甲状腺の病気を「どこで壊れたか」で理解するために、今日は甲状腺が<strong>体の中でどう作られ</strong>、<strong>ホルモンをどう作るか</strong>を一本の道としてたどります。次の回からの先天性甲状腺機能低下症は、すべてこの道のどこかの故障です。</p>\n<h3>舌の根もとから、首まで降りてくる</h3>\n<p>甲状腺は、<strong>前腸の内胚葉</strong>（のどの奥、舌の根もとあたり）の正中から生まれ、そこから首の前まで<strong>降りてきます</strong>。この降りてくる途中で止まってしまったのが<strong>異所性甲状腺</strong>です。冒頭の「場所を間違える」は、この移動の故障です。</p>\n<p>分化には<strong>NKX2-1、PAX8、FOXE1、HHEX</strong>という転写因子が欠かせません。胎生10週ごろに濾胞の構造ができてコロイドを作りはじめます。カルシトニンを作るC細胞は別の場所（鰓後体）から来て合流します。</p>\n<h3>ホルモンができるまでの5段階</h3>\n<ol style=\"margin:0 0 12px;padding-left:1.4em\"><li><strong>取り込む</strong>：血中のヨウ素を<strong>NIS</strong>で濾胞細胞に取り込む</li>\n<li><strong>運ぶ</strong>：<strong>ペンドリン</strong>で濾胞の内腔側へ送る</li>\n<li><strong>くっつける（有機化）</strong>：<strong>TPO</strong>が、<strong>DUOX2</strong>の作るH₂O₂を使ってヨウ素をサイログロブリンに結合させる（DUOXA2はDUOX2の成熟に必要）</li>\n<li><strong>つなぐ（カップリング）</strong>：ヨウ素のついたチロシン同士をつないでT4・T3にする</li>\n<li><strong>回収する（脱ヨウ素）</strong>：使い終わったヨウ素を再利用する</li></ol>\n<p>先天性の<strong>合成障害</strong>は、この各段階に対応しています。どの段階かで検査の顔つきが変わることを、第4話で使います。</p>\n<h3>TSHは二つの経路でスイッチを入れる</h3>\n<p>TSH受容体は7回膜貫通型で、<strong>GsとGqの両方</strong>につながっています。Gs→cAMPの経路はホルモン産生と細胞の増殖を、Gq→Ca系の経路はヨウ素化とH₂O₂の産生を動かします。TSHが高いと甲状腺が腫れるのは、この増殖のスイッチが入りっぱなしになるからです。</p>\n<h3>二つの大きな分類</h3>\n<p>永続性の先天性甲状腺機能低下症は、この道を前半と後半で分けて、</p>\n<ul><li><strong>形成異常</strong>（作る臓器そのものの問題）：無形成・低形成・異所性</li>\n<li><strong>合成障害</strong>（臓器はあるのに作れない）：原則として常染色体潜性。TSHで刺激されて<strong>甲状腺腫</strong>になり、サイログロブリンは通常<strong>高値</strong></li></ul>\n<p>に大きく分かれます。甲状腺が「ない・場所が違う」のか、「あるのに作れない」のか。この二択が、次の回からの診断の出発点です。</p>", "keys": ["甲状腺は舌の根もとから首へ降りる。途中で止まると異所性", "分化にNKX2-1・PAX8・FOXE1・HHEX", "合成：NIS取り込み→ペンドリン→TPO（DUOX2のH₂O₂）で有機化→カップリング", "TSH受容体はGs（産生・増殖）とGq（ヨウ素化）につながる", "永続性CHは形成異常と合成障害（甲状腺腫・Tg高値）に分かれる"], "upd": null, "quiz": [{"v": "", "q": "甲状腺の発生と転写因子の関係として正しいのは。", "o": ["前腸内胚葉の正中部から発生し、NKX2-1・PAX8・FOXE1・HHEXが分化に必須。C細胞は鰓後体に由来し、両者が合流して濾胞構造を作る", "甲状腺は神経堤から発生してC細胞は内胚葉由来であり、転写因子は発生に関与せず、中胚葉からの誘導で濾胞が作られる", "転写因子は甲状腺の発生に関与しない", "甲状腺は中胚葉から発生する"], "a": 0, "e": "胎生10週ごろ（マウス胎生15.5日）に濾胞構造が形成されてコロイド産生が始まる。移動の異常が異所性甲状腺。", "r": "小児内分泌学 p.448-450"}, {"v": "", "q": "TSH受容体のシグナル伝達として正しいのは。", "o": ["7回膜貫通型でGsαとGqの両方に共役し、cAMP（ホルモン産生・細胞増殖）とホスホリパーゼC/Ca（ヨウ素化・H2O2産生）の2つの経路を動かす", "チロシンキナーゼ型で自己リン酸化し、Caチャネルを直接開いてヨウ素の取り込みを促し、核内でDNAに結合する", "イオンチャネル型でCaを直接通す", "核内受容体でDNAに結合する"], "a": 0, "e": "ヨウ素はNIS（13回膜貫通、basolateral）で取り込まれ、ペンドリンでapical側へ、TPOがDUOX2由来のH2O2を使って有機化する。DUOXA2はDUOX2の成熟因子。", "r": "小児内分泌学 p.451-452"}, {"v": "", "q": "永続性先天性甲状腺機能低下症の分類として正しいのは。", "o": ["甲状腺形成異常（無形成・低形成・異所性）と甲状腺ホルモン合成障害（dyshormonogenesis）に大別され、合成障害では甲状腺腫を呈しサイログロブリンは通常高値（TG異常症を除く）", "すべて形成異常で合成障害はなく、合成障害があるとしても甲状腺は萎縮して123I摂取率が低下する", "合成障害では甲状腺が萎縮する", "合成障害では123I摂取率が低下する（NIS欠損を除く）"], "a": 0, "e": "合成障害は原則として常染色体潜性。甲状腺腫はTSH上昇による濾胞細胞の増殖。123I摂取率はNIS欠損以外で上昇する。NKX2-1変異の頻度は約18万出生に1人と推定。", "r": "小児内分泌学 p.454-455"}]}, {"id": "t2", "lv": 1, "t": "新生児スクリーニングと先天性甲状腺機能低下症", "min": 6, "cats": "先天性甲状腺機能低下症・甲状腺検査の読みかた", "src": "治療 p.1185-1188 ／ 小児内分泌学 p.153, 173-179, 455-458", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>日齢5で採ったスクリーニングで、TSHが22 μU/mL。精密検査に来た赤ちゃんは元気そうで、FT4は少し低めです。すぐに薬を始めるべきでしょうか。</div><p>新生児マススクリーニングは、日本の小児医療が誇る仕組みの一つです。その基準と、すり抜けてしまう子の話をします。生まれて30分ほどで、寒冷刺激などで<strong>TSHが急上昇（TSHサージ）</strong>し、T4・T3が続いて上がります。新生児マススクリーニングを<strong>日齢4〜6</strong>に行うのは、このサージが落ち着くのを待つためです。</p>\n<h3>スクリーニングが変えたもの</h3>\n<p>導入前は生後3か月までに診断される子は1割ほどで、治療しても1/3がIQ 75未満でした。早期治療で、IQ 90以上が得られるようになっています。</p>\n<h3>すぐ補充を始める基準（2021年ガイドライン）</h3>\n<p><strong>TSH 30 μU/mL以上</strong>、または<strong>TSH 15〜30でFT4が低い</strong>とき。症状や甲状腺腫があるときも対象です。重症度はFT4で見て、0.4 ng/dL未満が最重症、0.4〜0.8が重症です。膝のX線の骨核も判断材料になります。</p>\n<div class=\"formula\">LT4 開始量 10〜15 μg/kg/日（新生児期の維持は 6〜8 μg/kg/日）</div>\n<p>体重あたりの必要量は成長とともに減っていきます。冒頭の赤ちゃんはTSH 15〜30の範囲でFT4が低めなので、基準に当てはまり、補充を始めます。迷って待つより、知能の予後を守るために早く始めるのがこの病気の原則です。</p>\n<h3>スクリーニングをすり抜けるもの</h3>\n<ul><li><strong>遅発性TSH上昇</strong>：初回は正常でも、あとからTSHが上がる。早産児や2,500 g未満で多いので、再採血の体制が要る</li>\n<li><strong>中枢性</strong>：TSHが上がらないのでTSHスクリーニングでは拾えない（1.5〜3万人に1人）</li>\n<li><strong>早産児の一過性低T4（THOP）</strong>：FT4は低いがTSHは上がらず、自然に回復する。補充するかは確立していない</li></ul>", "keys": ["スクリーニングは日齢4〜6（TSHサージ後）", "開始基準：TSH 30以上、または15〜30でFT4低値", "開始量 10〜15 μg/kg/日", "遅発性TSH上昇（早産・低体重）は再採血で拾う", "中枢性はTSHスクリーニングをすり抜ける"], "upd": "スクリーニングの基準値は自治体の運用で少し異なることがあります。所属地域の基準もあわせて確認してください。", "quiz": [{"v": "", "q": "先天性甲状腺機能低下症マススクリーニングガイドライン（2021年改訂版）で、速やかにLT4補充を開始する基準は。", "o": ["TSH 30 μU/mL以上、またはTSH 15〜30 μU/mLかつFT4低値", "TSH 10 μU/mL以上であればFT4は問わず", "TSH 50 μU/mL以上、またはFT4 0.8 ng/dL未満", "TSH 30 μU/mL以上、またはTSH 15〜30 μU/mLかつ甲状腺腫"], "a": 0, "e": "加えて症状や甲状腺腫がみられる場合も対象。基準を満たさない例も、遅発性TSH上昇を想定して再評価する。", "r": "治療 p.1185"}, {"v": "", "q": "日本のガイドラインにおける先天性甲状腺機能低下症のLT4開始量は。", "o": ["1〜3 μg/kg/日", "5〜8 μg/kg/日", "10〜15 μg/kg/日", "20〜25 μg/kg/日"], "a": 2, "e": "重症例では速やかに立ち上げる。ただし過剰投与で甲状腺中毒症の値をとらない治療法が望まれる、という但し書きもつく。", "r": "p.116"}, {"v": "", "q": "新生児マススクリーニングで拾えない甲状腺機能低下症として注意すべきなのは。", "o": ["重症の原発性CH（TSHが測定上限を超えて検出できない）", "遅発性TSH上昇例（スクリーニング時はTSH正常）", "甲状腺無形成（Tgが測定できないため）", "ヨード過剰による一過性CH（TSHが上がらない）"], "a": 1, "e": "スクリーニング時にTSHが正常でも、あとからTSHが上昇してくる症例がある。低出生体重児などで問題になり、再検の体制が要る。", "r": "p.117"}]}, {"id": "t3", "lv": 2, "t": "先天性の原因を絞る", "min": 6, "cats": "先天性甲状腺機能低下症", "src": "p.107-129 ／ 小児内分泌学 p.453-456", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>先天性甲状腺機能低下症の赤ちゃん。甲状腺は首の正しい位置にあり、むしろ少し大きい。サイログロブリンは1,000 ng/mLを超えています。</div><p>甲状腺が「ない」のではなく、「あるのに作れない」。冒頭の赤ちゃんは、こちらの可能性が高そうです。永続性の先天性甲状腺機能低下症は、<strong>形成異常</strong>（無形成・低形成・異所性）と、<strong>ホルモン合成障害</strong>に大きく分かれます。</p>\n<h3>画像とTgで当たりをつける</h3>\n<ul><li>甲状腺がない・取り込みがない → 無形成</li>\n<li>取り込みが別の場所 → 異所性甲状腺</li>\n<li><strong>腫れていて取り込みもある → 合成障害</strong>（作れないぶんTSHで刺激されて腫れる）</li></ul>\n<p>サイログロブリン（Tg）が<strong>著明に高い</strong>ときも合成障害を示します。組織はあって、作ろうとしているからです。</p>\n<h3>甲状腺の外に出るサイン</h3>\n<ul><li><strong>NKX2-1</strong>：脳・肺・甲状腺（舞踏病、反復する呼吸器感染）</li>\n<li><strong>PAX8</strong>：優性で浸透率が不完全。腎尿路の異常</li>\n<li><strong>FOXE1</strong>：口蓋裂と、硬い針のような毛髪</li>\n<li><strong>Pendred症候群</strong>：甲状腺腫＋<strong>感音難聴</strong>。パークロレート放出試験が陽性</li></ul>\n<h3>合成障害の検査の顔つき</h3>\n<p>有機化の障害（TPO欠損、Pendred）ではパークロレートで取り込んだヨウ素が放出されます（TPO完全欠損で90%以上）。<strong>NIS欠損</strong>は取り込みの段階なので、I-123摂取率が低く、唾液腺にもNISがあるので唾液/血漿ヨウ素比も下がります。向きが逆です。</p>\n<h3>DUOX2は「重症でも一過性」がある</h3>\n<p>東アジアに多く、約1.8万出生に1人。初回のTSHが50以上でも、経過で自然に軽快することが多いです。重症だから永続性とは限りません。</p>\n<h3>3歳前後で見直す</h3>\n<p>一過性と永続性は連続しています。3歳前後でいったん中止して再評価します。<strong>LT4が4.7 μg/kg/日以上必要なら永続性</strong>を示唆します。重症例では1/4量のT3（リオチロニン）に置き換えて約1か月後に評価すると、離脱期間を短くできます。</p>", "keys": ["腫大＋取り込みあり＋Tg高値なら合成障害", "NKX2-1は脳・肺・甲状腺、PAX8は腎、FOXE1は口蓋裂と硬い毛髪", "Pendredは難聴＋パークロレート陽性。NIS欠損は唾液のヨウ素比が下がる", "DUOX2は重症でも一過性がある", "3歳前後で再評価。4.7 μg/kg/日以上は永続性を示唆"], "upd": null, "quiz": [{"v": "先天性甲状腺機能低下症の児。良性遺伝性舞踏病があり、新生児期に呼吸障害を繰り返した。", "q": "考えられる遺伝子は。", "o": ["TSHR（受容体の機能喪失）", "NKX2-1", "PAX8（腎尿路系の異常）", "FOXE1（口蓋裂と硬い毛髪）"], "a": 1, "e": "脳・肺・甲状腺の3つが揃う（brain-lung-thyroid）。甲状腺だけを見ていると拾えない。 TITF1。", "r": "表 p.111"}, {"v": "甲状腺腫と感音難聴を伴う小児。パークロレート放出試験が陽性。", "q": "最も考えられるのは。", "o": ["Pendred症候群（PDS/SLC26A4異常）", "TG異常症（サイログロブリン合成障害で甲状腺腫を伴う）", "TPO欠損症（有機化障害でパークロレート放出試験が陽性）", "NKX2-1異常症（難聴ではなく舞踏病を伴う）"], "a": 0, "e": "ヨードの有機化障害なので、パークロレートで取り込んだヨードが放出される。難聴が並んだら思い出す。", "r": "表7 p.129"}, {"v": "", "q": "永続性の先天性甲状腺機能低下症を示唆する指標として報告されているのは。", "o": ["LT4投与量が4.7 μg/kg/日以上", "初回TSHが30 μU/mL以上", "出生体重が2,500 g未満であること", "初回スクリーニングのTSHが30 μU/mL以上"], "a": 0, "e": "一過性と永続性は明確に二分できるものではなく連続している。3歳前後で一度LT4を中止して再評価する。", "r": "小児内分泌学 p.456"}]}, {"id": "tB", "lv": 2, "t": "LT4の始め方と、3歳の再評価", "min": 6, "cats": "先天性甲状腺機能低下症", "src": "p.116-117 ／ 治療 p.1185-1188 ／ 小児内分泌学 p.455-456, 178-179", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>先天性甲状腺機能低下症でLT4を飲んでいる2歳10か月の子。お母さんが「この薬は一生飲むんですか」と聞きます。</div><p>答えは「まだ分かりません。だから、3歳ごろに一度確かめましょう」です。今日は、補充の始め方から、やめられるかどうかを確かめるところまでを通してみます。</p>\n<h3>始めは「速く、しっかり」</h3>\n<p>重症例では、<strong>10〜15 μg/kg/日</strong>で速やかに立ち上げます。知能の予後を守るためには、脳が急速に育つ時期に甲状腺ホルモンを十分に届けることがいちばん大事だからです。ただし、過量で甲状腺中毒症の値にならないように、という但し書きもつきます。</p>\n<h3>体が大きくなると、1 kgあたりの量は減る</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>時期</th><th>LT4の目安（μg/kg/日）</th></tr>\n<tr><td>新生児期</td><td>6〜8</td></tr>\n<tr><td>1〜5歳</td><td>5〜7</td></tr>\n<tr><td>それ以降</td><td>3〜5、4</td></tr>\n<tr><td>成人</td><td>1〜2</td></tr></table></div>\n<p>体重あたりの必要量は成長とともに減っていきます。量の調節は、原発性なのでTSHを目安にします。</p>\n<h3>家族に伝えておくこと</h3>\n<p>甲状腺の薬は長く飲むものなので、<strong>続けて飲むこと</strong>そのものが治療の中身になります。説明では、治療の大切さを分かってもらうことに重点を置き、ほとんど起こらない症状で不要な不安を与えないことも勧められています。早く治療すれば、知能も身長もほぼ追いつくと考えられていますが、発見が遅れた子では取り戻しきれないこともあります。</p>\n<h3>3歳前後で、一度やめて確かめる</h3>\n<p>一過性と永続性は、はっきり二つに分かれるのではなく、<strong>連続しています</strong>。だから3歳前後で一度LT4を中止して、自分の甲状腺で足りるかを再評価します。</p>\n<ul><li><strong>LT4が4.7 μg/kg/日以上必要</strong>だった子は、永続性の可能性が高い</li>\n<li>重症例では、LT4を<strong>1/4量のリオチロニン（T3）に置き換えて約1か月後</strong>に評価する方法がある。T3は半減期が短いので、ホルモンがない期間を短くできる</li>\n<li>軽症例は、LT4をやめて30日ほど待つ方法もある</li></ul>\n<p>冒頭のお母さんには、「この子に今どれくらいの量が必要だったか」と「3歳の再評価」が、一生飲むかどうかの答えを教えてくれる、と伝えられます。</p>\n<h3>早産児の「低いT4」は別もの</h3>\n<p>早産児では、生後1〜2週にFT4がとても低くなることがあります。<strong>TSHは上がらず</strong>、自然に回復します（一過性低サイロキシン血症、THOP）。在胎週数が短いほど低く、視床下部の未熟さや全身の病気が関わると考えられていますが、<strong>補充すべきかはまだ確立していません</strong>。TSHが上がらないので、原発性のCHとしては拾えない点にも注意します。</p>", "keys": ["重症例は10〜15 μg/kg/日で速やかに開始", "体重あたりの量は新生児6〜8から年齢とともに減る", "続けて飲むことが治療の中身。過度の不安は与えない", "3歳前後で再評価。4.7 μg/kg/日以上は永続性を示唆", "重症例はT3に置き換えて約1か月で評価", "早産児のTHOPはTSHが上がらず自然回復。補充の是非は未確立"], "upd": null, "quiz": [{"v": "", "q": "先天性甲状腺機能低下症のLT4補充量として、新生児期の目安は。", "o": ["1〜2 μg/kg/日", "6〜8 μg/kg/日", "15 μg/kg/日", "体重によらず25 μg/日"], "a": 1, "e": "月齢とともに減らしていく（1〜5歳 5〜7、以降 3〜5、4 μg/kg/日と下がり、成人は1〜2 μg/kg/日）。体重あたりの必要量は成長とともに減る。", "r": "治療 p.1185"}, {"v": "", "q": "重症CHでLT4を中止して機能を再評価するとき、本書が示す方法は。", "o": ["LT4を中止して1週間後にTSHを測り、10 μU/mL以上に上昇していれば永続性と判定する", "LT4を1/4量のリオチロニン（チロナミン）に置換して約1か月後に評価する", "LT4を中止して1週間後にTSHを測る", "LT4を同量のリオチロニンに置換して3か月後に評価する"], "a": 1, "e": "T3は半減期が短いので、離脱期間を短くできる。軽症例ではLT4を中止して30日程度待つ方法もある。", "r": "治療 p.1188"}, {"v": "", "q": "早産児の一過性低サイロキシン血症（THOP）について正しいのは。", "o": ["在胎週数が短いほどFT4が低く、生後1〜2週に著明低値をとるがTSHは上がらず自然に上昇する。視床下部の未熟性やnon-thyroidal illnessが関与し、補充の是非は確立していない", "TSHが著明に上昇して永続性CHと同じ治療を要し、補充療法が必須で全例にLT4を投与する", "FT4は正常で、TSHのみが低下する", "補充療法が必須で、全例にLT4を投与する"], "a": 0, "e": "TSHが低いままなので原発性CHとしては拾えない。rT3が低いことからnon-thyroidal illnessとは異なる可能性も指摘される。症例ごとの判断が求められる。", "r": "小児内分泌学 p.178-179"}]}, {"id": "t4", "lv": 1, "t": "一過性の原因：ヨウ素と母体", "min": 6, "cats": "ヨード関連・母体由来・新生児", "src": "p.121-132, 151 ／ 治療 p.808, 1187 ／ 小児内分泌学 p.165-166", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>スクリーニングでTSH高値だった赤ちゃん。お母さんに妊娠中の生活を聞くと、「体にいいと思って、昆布のお茶を毎日たくさん飲んでいました」。</div><p>冒頭の一言は、大きな手がかりです。先天性甲状腺機能低下症の一部は一過性で、原因によって<strong>治るまでの時間が違う</strong>ので、経過の長さ自体が手がかりになります。</p>\n<h3>ヨウ素の取りすぎ</h3>\n<p>ヨウ素が多すぎると、ホルモン合成が止まります（<strong>Wolff-Chaikoff効果</strong>）。大人は数日で抜け出せますが、<strong>胎児・新生児は抜け出せず</strong>機能低下になります。原因は造影剤、消毒薬、そして日本では海藻などの食事です。冒頭のお母さんのように、体によいと思って続けていたものが原因になることがあります。「妊娠中に毎日何を飲み食いしていたか」まで聞かないと拾えません。尿中ヨウ素で曝露を確かめます。ヨウ素過剰ではTgがあまり上がらないのも、合成障害との見分けに使えます。</p>\n<h3>母から来るもの</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>原因</th><th>続く期間の目安</th></tr>\n<tr><td>母の抗甲状腺薬</td><td>数日</td></tr>\n<tr><td>ヨウ素過剰</td><td>過剰が改善するまで</td></tr>\n<tr><td>母のTSBAb</td><td>生後3〜6か月</td></tr>\n<tr><td>DUOX2異常</td><td>年単位</td></tr></table></div>\n<h3>薬でも甲状腺は動く</h3>\n<p>ヨウ素を多く含む薬にも注意します。<strong>アミオダロン</strong>は1錠100 mgに37 mgものヨウ素を含み、機能亢進と機能低下のどちらも起こしえます。ほかに、チロシンキナーゼ阻害薬や免疫チェックポイント阻害薬（自己免疫性の甲状腺炎）、ソマトスタチンアナログ（TSHの分泌を抑える）なども、甲状腺の値を動かします。</p>\n<p>次の回では、母から子へ渡るもう一つのもの、<strong>抗体と抗甲状腺薬</strong>の話をします。</p>", "keys": ["新生児はWolff-Chaikoff効果から抜け出せない", "ヨウ素過剰は造影剤・消毒薬・海藻。尿中ヨウ素で確認", "ヨウ素過剰ではTgが上がりにくい（合成障害との違い）", "母のTSBAbは3〜6か月、抗甲状腺薬は数日", "アミオダロンなど薬でも甲状腺は動く"], "upd": null, "quiz": [{"v": "", "q": "ヨード過剰が甲状腺機能低下症を起こす機序は。", "o": ["脱ヨード酵素の飽和による活性化障害", "Wolff-Chaikoff効果", "Jod-Basedow現象（ヨードが有機化を促進する）", "TSH受容体のヨードによる直接阻害"], "a": 1, "e": "ヨード過剰は甲状腺ホルモン合成を抑える。成人は数日でescapeするが、胎児・新生児は甲状腺機能の成熟が不十分でescapeできず、機能低下症に至りうる。", "r": "p.125"}, {"v": "", "q": "母体のTSBAb（TSH刺激阻害抗体）が児に及ぼすのは。", "o": ["一過性の甲状腺機能亢進症", "一過性の甲状腺機能低下症", "永続性の甲状腺無形成", "影響しない"], "a": 1, "e": "抗体が消えるまでの一過性。症例では母のTSBAbが高値で、児のTRAbが月単位で低下し正常化した。", "r": "関連症例 p.130-131"}, {"v": "", "q": "ヨード過剰による機能低下症と、ホルモン合成障害を分ける補助的所見は。", "o": ["ヨード過剰ではTgが著明高値になりにくい", "ヨード過剰ではTgが1,000 ng/mLを超えることが多い", "ヨード過剰ではTSHの上昇が軽度にとどまりやすい", "ヨード過剰では甲状腺が描出されない"], "a": 0, "e": "合成障害では材料が詰まってTgが高くなる。ヨード過剰は抑制なので、そこまで上がらない。", "r": "p.127"}]}, {"id": "tC", "lv": 2, "t": "妊娠と甲状腺：母から子へ渡るもの", "min": 7, "cats": "母体由来・新生児・Basedow・亢進症", "src": "取り扱いマニュアル p.131-132 ／ p.151 ／ 小児内分泌学 p.165-166 ／ 治療 p.1186-1199", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>妊娠中にBasedow病の治療を受けていたお母さんから、元気に生まれた赤ちゃん。退院の日、助産師さんから「念のため、小児科で甲状腺を見てもらって」と言われてきました。</div><p>母と胎児は、胎盤を通していろいろなものをやり取りしています。甲状腺に関わるものの中には、<strong>通るもの</strong>と<strong>通らないもの</strong>があり、それが赤ちゃんの病気の形を決めます。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>胎盤を</th><th>もの</th></tr>\n<tr><td>通る</td><td>IgG（TRAb・TPO抗体）、抗甲状腺薬、ヨウ素、T4（一部）</td></tr>\n<tr><td>通らない</td><td>TSH</td></tr></table></div>\n<p>IgGは胎盤で積極的に運ばれ、<strong>妊娠後期には胎児の血中濃度が母を上回る</strong>ほどになります。母の抗体は、そのまま赤ちゃんに渡るのです。</p>\n<h3>新生児Basedow病</h3>\n<p>母の<strong>TRAb（刺激する抗体）</strong>が胎盤を通ると、赤ちゃんの甲状腺が刺激されて機能亢進になります。フォローすべき目安は、母のTRAb（第3世代）<strong>10 IU/L以上</strong>、TSAb 500%以上など。母の抗体価が分からないときも要注意として扱います。</p>\n<p>注意したいのは、<strong>発症が遅れる</strong>ことです。母が抗甲状腺薬を飲んでいると、薬も一緒に赤ちゃんに入っているので、生まれてすぐは抑えられています。<strong>薬が先に抜け、抗体が残る</strong>ので、生後数日〜数週たってから、<strong>体重が増えない・脈が速い</strong>という形で出てきます。冒頭の赤ちゃんが元気でも、数週間は見守る必要があるのはこのためです。</p>\n<p>もう一つの落とし穴が、<strong>母がすでに甲状腺を全摘したり、放射性ヨウ素で治療したりしていて、母の機能は落ち着いている</strong>場合です。母の甲状腺がなくても、<strong>TRAbは体に残っている</strong>ことがあり、赤ちゃんには胎児・新生児Basedow病が起こりえます。問診で既往を必ず聞きます。胎児期には、母のTRAbが高いとき（10 IU/L以上など）に胎児の超音波で甲状腺腫や心拍数を見て、亢進と低下を見分けます。</p>\n<h3>母の抗甲状腺薬と、胎児と、授乳</h3>\n<ul><li><strong>妊娠初期</strong>：チアマゾール（MMI）は胎児の奇形（MMI embryopathy）を起こしうるので、器官形成期にはプロピルチオウラシル（PTU）を使う</li>\n<li><strong>授乳</strong>：MMI 10 mg/日まで、PTUは低用量なら、赤ちゃんの甲状腺をチェックせずに授乳してよいとされる。それ以上の量なら、赤ちゃんの甲状腺機能に気を配る</li></ul>\n<h3>母が甲状腺機能低下症のとき</h3>\n<p>妊娠すると、LT4の必要量は<strong>約50%増えます</strong>。胎児の脳の発達には母のT4も寄与するので、<strong>TSH 2.5以下</strong>を目標に、妊娠が分かったら検査の間隔を短くしてこまめに調節します。思春期の患者には、将来の妊娠に向けて先に伝えておくとよい項目です。</p>\n<p>次の回では、母のBasedow病が<strong>うまくコントロールされていなかった</strong>ときに赤ちゃんに起こる、もう一つの病気を見ます。</p>", "keys": ["胎盤を通る：IgG（TRAb）・抗甲状腺薬・ヨウ素。通らない：TSH", "新生児Basedowは母の薬が先に抜けて、数日〜数週遅れて出る", "母が全摘・RI後でもTRAbが残っていれば起こる", "妊娠初期はPTU。授乳はMMI 10 mg/日までなら児のチェック不要", "母の機能低下は妊娠で必要量が約50%増。TSH 2.5以下を目標"], "upd": null, "quiz": [{"v": "", "q": "母体Basedow病の児をフォローすべき基準として挙げられているのは。", "o": ["母のTRAb（第1世代）≧50%、（第3世代）≧10 IU/L、TSAb≧500%", "母のTSHが抑制されていること（抗体価は問わない）", "母のTRAb（第3世代）≧2 IU/L、TSAb≧200%、または母に甲状腺腫があること", "母のTRAb（第3世代）≧2 IU/Lまたは甲状腺腫の存在"], "a": 0, "e": "抗体価が胎盤通過のリスクを示す。母体の抗体価が不明な場合も要注意群として扱う、というマニュアルになっている。", "r": "取り扱いマニュアル p.131-132"}, {"v": "", "q": "新生児Basedow病の発症時期として典型的なのは。", "o": ["出生直後に発症し、生後1週で自然軽快する", "母のTRAbが妊娠20週以降に高値であった児で、生後数日〜数週に発症", "母のTRAbが妊娠初期に高値であった児で、出生時から発症し生後1週で自然軽快する", "母のTRAbが妊娠初期に高値であった児で、出生時に発症"], "a": 1, "e": "抗甲状腺薬が先に抜けてから抗体作用が表に出るため、症状の出現が遅れることがある。体重増加不良と頻脈が主症状。", "r": "p.151"}, {"v": "", "q": "甲状腺関連物質の胎盤通過性として正しいのは。", "o": ["T4はMCT8などで調節されて一部通過、TSHは通過しない、IgG（TRAb・TPO抗体）と抗甲状腺薬・ヨウ素は通過する", "T4・T3は自由に通過しTSHも通過するが、TRAbは胎盤を通過せず、抗甲状腺薬も通過しないため妊娠中も安全", "TRAbは胎盤を通過しない", "抗甲状腺薬は胎盤を通過しないため、妊娠中も安全"], "a": 0, "e": "IgGはFcRnで能動輸送され、妊娠後期に胎児血中濃度が母体を超える。MMI embryopathyを避けるため妊娠4〜15週（器官形成期）はMMIを避けてPTUを用いる。", "r": "小児内分泌学 p.165"}]}, {"id": "tD", "lv": 2, "t": "中枢性甲状腺機能低下症", "min": 6, "cats": "甲状腺検査の読みかた・母体由来・新生児", "src": "p.151 ／ 小児内分泌学 p.457-458 ／ 治療 p.810", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>新生児スクリーニングは正常だった赤ちゃん。でも黄疸が長引き、FT4を測ると低い。TSHは正常範囲です。お母さんは妊娠中、Basedow病がなかなか落ち着きませんでした。</div><p>TSHが上がらない甲状腺機能低下症、<strong>中枢性甲状腺機能低下症</strong>の回です。TSHをものさしにする日本のスクリーニングでは<strong>拾えない</strong>という、構造的な弱点を持つ病気です。</p>\n<h3>頻度と、すり抜け</h3>\n<p>頻度は<strong>1.5万〜3万人に1人</strong>。FT4でスクリーニングをしているオランダでは、1.6万人に1人と報告されています。決してまれではないのに、TSHが上がらないので、日本のスクリーニングをすり抜けます。遷延する黄疸、低血糖、小陰茎など、ほかの下垂体ホルモンの不足のサインから見つかることが多いです。</p>\n<h3>冒頭の赤ちゃん：母のBasedowの影響</h3>\n<p>前の回の続きです。母のBasedow病が<strong>コントロール不良</strong>だと、胎児は甲状腺ホルモンを浴び続け、胎児の視床下部・下垂体が<strong>抑え込まれてしまいます</strong>。生まれたあともTSHが立ち上がらず、中枢性の甲状腺機能低下症になります。前の回の新生児Basedowとは逆向きの病気が、同じ「母のBasedow」から生まれるのです。</p>\n<h3>原因</h3>\n<ul><li><strong>下垂体の腫瘍など</strong>（頭蓋咽頭腫、Rathke嚢胞、empty sellaなど）が過半数</li>\n<li>先天性では、ほかの前葉ホルモンの不足を伴うことが多い（巻の一の複合型下垂体機能低下症）</li>\n<li><strong>TSH単独欠損</strong>の遺伝子：TSHβ、TRHR、<strong>IGSF1</strong>（X連鎖。思春期の遅れや、大きな精巣を伴うことがある）、<strong>TBL1X</strong>（難聴を伴う）、IRS4</li></ul>\n<p>TSHが上がらない甲状腺機能低下を見たら、遺伝子も視野に入れます。そして何より、<strong>ほかの下垂体ホルモン、とくにACTH</strong>を確かめます。</p>\n<h3>補充の順番：副腎が先</h3>\n<p>甲状腺ホルモンを入れると、<strong>コルチゾールの代謝が速く</strong>なります。副腎不全を見落としたままLT4を始めると、コルチゾールが足りなくなって危機を招きます。逆に、重い甲状腺機能低下があるとコルチゾールの代謝が落ちて血中の値が保たれ、<strong>副腎不全が隠れて見える</strong>ことがあります。ACTHが低いことが手がかりです。下垂体の病気の一部としてTSHの不足がある子では、この順番が命に関わります。</p>\n<h3>補充のものさしはFT4</h3>\n<p>ここがいちばん大事なポイントです。中枢性では<strong>TSHは指標になりません</strong>。もともと出せないので、TSHが低いのは当たり前で、「TSHが低いから量が多すぎる」という根拠にもなりません。<strong>FT4を基準範囲の高めに保つ</strong>ように調節します。原発性と同じつもりでTSHを追うと、<strong>必ず補充不足</strong>になります。</p>", "keys": ["中枢性はTSHスクリーニングをすり抜ける（1.5〜3万人に1人）", "母のBasedowがコントロール不良だと児の中枢性CHになる", "原因は下垂体腫瘍などが過半数。TSH単独欠損はIGSF1・TBL1Xなど", "副腎不全を先に確かめ、副腎を先に補う", "補充の指標はFT4（基準範囲の高め）。TSHは見ない"], "upd": null, "quiz": [{"v": "", "q": "中枢性甲状腺機能低下症のLT4補充で、管理の指標として注意すべきなのは。", "o": ["TSHを指標とし、正常範囲の中央を目標にする", "TSHは指標にならず、FT4を基準範囲の高めに保つ", "TSHを指標とし、正常範囲の中央（1〜2 μU/mL）を目標にする", "TSHが抑制されたら減量し、上昇したら増量する"], "a": 1, "e": "TSHが正常範囲を下回っても過量の根拠にはならない。原発性と同じつもりでTSHを追うと、必ず補充不足になる。", "r": "小児内分泌学 p.458"}, {"v": "", "q": "中枢性甲状腺機能低下症の原因として過半数を占めるのは。", "o": ["下垂体腫瘍（頭蓋咽頭腫、Rathke嚢胞、empty sellaなど）", "自己免疫性下垂体炎（リンパ球性漏斗下垂体炎）", "TSHβ、TRHR、IGSF1などの遺伝子異常（先天性が過半数を占め、後天性は少ない）", "頭部外傷や頭部放射線照射後の二次性のもの"], "a": 0, "e": "遺伝子異常による先天性中枢性CHもあり、他の前葉ホルモンの分泌不全を伴うことが多い。コントロール不良のBasedow病母体から出生した児にもみられる。", "r": "治療 p.810"}, {"v": "母がBasedow病でコントロール不良のまま妊娠・出産。児はマススクリーニング正常だが、TSHが上がらないままfT4が低い。", "q": "考えられるのは。", "o": ["母体TSBAbによる一過性の原発性先天性甲状腺機能低下症", "母体の甲状腺機能亢進による中枢性先天性甲状腺機能低下症", "新生児Basedow病の回復期で、一過性にfT4が下がった状態", "母体の抗甲状腺薬による一過性甲状腺機能低下症"], "a": 1, "e": "胎児期の過剰な甲状腺ホルモン曝露が胎児の視床下部下垂体を抑え込む。TSHが上がらないためスクリーニングをすり抜ける。", "r": "p.151 / 文献2"}]}, {"id": "t8", "lv": 3, "t": "ちぐはぐな検査値：不応症・輸送・代謝異常", "min": 6, "cats": "不応・輸送・代謝異常・甲状腺検査の読みかた", "src": "症例 p.137-145 ／ 小児内分泌学 p.457-458, 475-479", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>甲状腺が腫れている14歳の女の子。FT4もFT3も高いのに、TSHは2.6と正常です。TRAbは陰性。</div><p>甲状腺ホルモンが高いのに、TSHが抑えられていない。冒頭の数字は、教科書の常識に合いません。軸のどこかが壊れていると、甲状腺の検査値は<strong>教科書どおりに並びません</strong>。その「ちぐはぐさ」が診断の手がかりです。</p>\n<h3>甲状腺ホルモン不応症（THRB）</h3>\n<p>fT4・fT3が高いのに、<strong>TSHが抑えられていない</strong>。BasedowならTSHは測定感度以下になり、TRAbも陽性です。原因の大多数はTRβ（THRB）の異常で、常染色体優性。全身型と下垂体型は、いまは連続した一つの病態と考えます。</p>\n<h3>MCT8欠損症（Allan-Herndon-Dudley）</h3>\n<p>X連鎖で男児。<strong>fT3高値・fT4低値・TSH正常</strong>という並びに、重い発達遅滞と筋緊張低下。T3を脳へ運ぶトランスポーターが欠け、<strong>脳は不足、末梢は過剰</strong>（体重減少・頻脈）になります。T3アナログ（Triac）が試されています。</p>\n<h3>SBP2（SECISBP2）異常症</h3>\n<p>セレンを含む脱ヨウ素酵素が働かず、T4→T3が落ちます。<strong>fT4高値・fT3低値・TSH軽度高値</strong>。低身長や難聴を伴います。</p>\n<h3>THRA異常症</h3>\n<p>便秘・低身長・発達遅滞があるのに、<strong>検査値の異常は軽い</strong>。臨床像から疑わないと拾えません。</p>\n<h3>受容体の後ろで止まると</h3>\n<p>ホルモンは届いているのに、受容体の側が応えない病気も、もう一つあります。<strong>TSH不応症</strong>は、TSH受容体の機能喪失変異です。片方だけの変異（ヘテロ）では軽いTSH高値だけ、両方（ホモや複合ヘテロ）では甲状腺の低形成を伴う先天性の機能低下まで、幅があります。</p>\n<p>この回で見てきた病気に共通するのは、<strong>「TSHとFT4の組み合わせが、軸の常識に合わない」</strong>ことです。高いのに抑えられていない、高い・低いが入り混じる、異常が軽すぎる。違和感を見逃さず、軸のどこで止まっているかを考える。それがこの回のいちばんのメッセージです。</p>", "keys": ["fT4・fT3高値でTSHが抑えられていない→不応症（THRB）", "MCT8欠損：fT3高・fT4低、脳は不足で末梢は過剰", "SBP2異常：fT4高・fT3低", "THRAは検査値の異常が軽い", "TSH不応症はTSHR機能喪失。軽いTSH高値から低形成まで"], "upd": null, "quiz": [{"v": "14歳女子。甲状腺腫大。fT4 2.6 ng/dL、fT3 6.0 pg/mL と高値だが TSH 2.6 μIU/mL と正常。TRAb 陰性。", "q": "最も考えられるのは。", "o": ["Basedow病", "甲状腺ホルモン不応症", "破壊性甲状腺炎", "TSH産生腫瘍以外は考えにくい"], "a": 1, "e": "甲状腺ホルモンが高いのにTSHが抑制されていない、という不一致が核心。Basedowなら TSH は測定感度以下まで落ち、TRAbが陽性になる。 THRB異常。", "r": "症例1 p.137-139"}, {"v": "低身長と精神運動発達遅滞のある小児。fT3が高値、fT4が低値、TSHは正常。重度の筋緊張低下とジストニアを認める。男児。", "q": "最も考えられるのは。", "o": ["MCT8（SLC16A2）欠損症", "SECISBP2異常症（fT4高値・fT3低値）", "橋本病（TSH高値・fT4低値）", "THRB異常症（fT4高値・TSH非抑制）"], "a": 0, "e": "X連鎖のAllan-Herndon-Dudley症候群。T3を細胞内に運ぶトランスポーターが欠け、組織によって過剰と不足が同時に起こる。fT3高値・fT4低値というちぐはぐな並びが手がかり。", "r": "症例4・5 p.143-145"}, {"v": "", "q": "SECISBP2（SBP2）異常症の甲状腺機能パターンは。", "o": ["fT4高値・fT3低値・TSH軽度高値", "fT4・fT3ともに高値でTSH抑制されず（THRB型）", "fT4低値・fT3高値・TSH正常（MCT8型）", "両者とも高値でTSH抑制"], "a": 0, "e": "セレノプロテインである脱ヨード酵素が働かず、T4からT3への変換が落ちる。血中セレンが低く、低身長・GH分泌不全・感音難聴・易疲労性を伴う。", "r": "症例3 p.143"}]}, {"id": "t7", "lv": 1, "t": "後天性甲状腺機能低下症（橋本病）", "min": 6, "cats": "破壊性・慢性甲状腺炎・甲状腺検査の読みかた", "src": "症例 p.117, 151-155 ／ 小児内分泌学 p.460-463 ／ 治療 p.816, 1186-1193", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>11歳の男の子。この1年でほとんど身長が伸びず、体重はむしろ増えました。TSHは200以上、FT4は0.47。MRIでは下垂体が大きく見えると言われています。</div><p>腫瘍かもしれない、と身構える前に。この子の所見は、一つの病気で全部説明できます。「この1年ほとんど背が伸びていない、でも体重は増えた」。この組み合わせは、<strong>重症の後天性甲状腺機能低下症</strong>に特徴的です。GH分泌不全では、ここまで極端に伸びが止まることは通常ありません。</p>\n<h3>驚かされる2つの所見</h3>\n<ul><li><strong>下垂体の腫大</strong>：TSH産生細胞の過形成で、腺腫と間違えるほど大きくなる。<strong>補充すれば1〜2か月で縮む</strong>ので、手術の前にまず補充する</li>\n<li><strong>Van Wyk-Grumbach症候群</strong>：機能低下なのに乳房発育や卵巣嚢胞など思春期早発が出る。これも補充で戻る</li></ul>\n<h3>補充の進め方</h3>\n<p>重症例は少量から始め、1〜2週ごとに段階的に増やします。急に上げると心臓に負担がかかります。FT4は1か月以内に戻りますが、<strong>TSHが戻るには数か月</strong>かかります。</p>\n<h3>伸びは取り戻せるか</h3>\n<p>重症例ではキャッチアップは<strong>70%程度</strong>で、骨端線が早く閉じて最終身長が足りないことがあります。家族には「追いつくが、完全でないことがある」と、過度の期待も不安も与えない伝え方をします。長く飲む薬なので、続けてもらうことが治療の中身です。</p>\n<h3>知っておくと安全なこと</h3>\n<ul><li>副腎不全があれば<strong>先に副腎を補う</strong>。甲状腺ホルモンはコルチゾールの代謝を速め、危機を招く。重い機能低下ではコルチゾールが見かけ上高く、副腎不全が隠れる</li>\n<li>低体温・意識障害・徐脈の<strong>粘液水腫性昏睡</strong>では、ヒドロコルチゾンを先に</li>\n<li>LT4の吸収はカルシウム、セベラマー、ポラプレジンク、PPI、大豆などで落ちる。安定しないときはまず併用薬を確認</li>\n<li>妊娠すると必要量は<strong>約50%増える</strong></li>\n<li>橋本病では乳頭がんが約3%。結節があれば評価する</li></ul>", "keys": ["伸びが止まって体重が増えるのは重症の機能低下", "下垂体腫大は補充で縮む。Van Wyk-Grumbachも補充で戻る", "重症例は少量から段階的に。TSHが戻るのは数か月後", "キャッチアップは70%程度", "副腎不全があれば副腎を先に補う"], "upd": null, "quiz": [{"v": "11歳男子。この1年ほとんど身長が伸びていない。体重はむしろ増えた。TSH 200 μIU/mL以上、fT4 0.47 ng/dL。", "q": "この所見の組み合わせが示唆するのは。", "o": ["GH分泌不全症（体重増加と成長率低下）", "重症の後天性甲状腺機能低下症（慢性甲状腺炎）", "Cushing症候群（体重増加と成長率低下）", "中枢性甲状腺機能低下症（TSHは参考にならない）"], "a": 1, "e": "成長率だけが落ちて体重は増える、という組み合わせが特徴的。GH分泌不全では通常ここまで極端に伸びが止まらない。", "r": "症例1・2 p.151-153"}, {"v": "", "q": "重症の甲状腺機能低下症で下垂体腫大・トルコ鞍拡大を認めたときの対応は。", "o": ["下垂体腺腫を疑い、経蝶形骨洞手術を検討する", "LT4補充を行い、1〜2か月での改善をみる", "LT4は腫大を増悪させるため、まず画像で経過をみる", "プロラクチノーマの合併を疑い、ドパミン作動薬を開始する"], "a": 1, "e": "TSH産生細胞の過形成なので、補充で戻る。腫瘍と間違えるほど大きくなることがあり、ここを知らないと不要な介入につながる。", "r": "p.155"}, {"v": "甲状腺機能低下症の患者が低体温、意識障害、徐脈、低換気で搬送された。血清Naは128 mEq/L。", "q": "対応として適切なのは。", "o": ["甲状腺ホルモンを大量に静注し、ステロイドは副腎不全が確定してから", "甲状腺ホルモン投与の前にヒドロコルチゾンを投与し、副腎不全が否定されるまで継続する", "甲状腺ホルモンを大量に静注して速やかに代謝を上げ、ステロイドは副腎不全が確定してから追加する", "まず復温と換気の補助を行い、ホルモン補充は意識の回復を待つ"], "a": 1, "e": "粘液水腫性昏睡。診断基準は中枢神経症状を必須とし、低体温・循環不全・呼吸不全・低Na血症などを点数化する。甲状腺ホルモンを先に入れると副腎不全を顕在化させる。", "r": "治療 p.1193"}]}, {"id": "t5", "lv": 1, "t": "Basedow病と抗甲状腺薬", "min": 7, "cats": "Basedow・亢進症", "src": "p.155-161 ／ 治療 p.1196-1202 ／ 小児内分泌学 p.465-471", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>「最近、授業に集中できなくて成績が下がった」「すぐイライラする」。心療内科を勧められたという中学2年の女の子。首を見ると、甲状腺が少し腫れています。</div><p>この子に必要なのは、心療内科より先に甲状腺の検査かもしれません。小児Basedow病でいちばん多い症状は<strong>甲状腺腫大</strong>で、眼球突出、体重減少、食欲亢進、頻脈、<strong>学業成績の低下</strong>が続きます。不定愁訴が多く、心の問題とされていることもあります。</p>\n<h3>チアマゾール（MMI）が基本</h3>\n<div class=\"formula\">MMI 0.2〜0.5 mg/kg/日（最大 15 mg/日、分1〜2）</div>\n<p>1日1回でよく、続けやすいのが利点です。効き目は<strong>fT4・fT3で判断</strong>します。TSHはしばらく抑えられたままで遅れて戻るので、TSHだけ見ていると効いていないと誤読します。</p>\n<h3>副作用は「時期」で覚える</h3>\n<ul><li><strong>無顆粒球症</strong>：約0.3%、<strong>開始2〜3か月以内</strong>に多い。MMIは用量依存で、15 mg/日以下ならリスクが低い。発熱と強い咽頭痛が出たらすぐ受診、と最初に伝える。好中球500未満なら中止</li>\n<li><strong>MPO-ANCA関連血管炎</strong>：内服<strong>1年以上</strong>で多く、PTUで頻度が高い</li></ul>\n<h3>妊娠と薬</h3>\n<p>MMIは妊娠初期に胎児の奇形（臍帯ヘルニア、食道閉鎖など）を起こしうるので、妊娠を希望する人や<strong>妊娠16週まで</strong>はPTUを使います。年頃の患者には先に説明しておきます。</p>\n<h3>そのほか</h3>\n<p>動悸などには<strong>β1選択性</strong>の遮断薬を使います（死亡例の多くが非選択性でした）。若い男性の突然の四肢脱力は、低Kによる<strong>甲状腺中毒性周期性四肢麻痺</strong>を思い出します。再発は30%程度で、TRAbの陰性化が寛解の参考になります。小児でアイソトープ治療は第一選択ではありません。</p>", "keys": ["症状は甲状腺腫が最多。成績低下・不定愁訴に注意", "MMI 0.2〜0.5 mg/kg/日（最大15 mg）", "効果はfT4・fT3で見る。TSHは遅れて戻る", "無顆粒球症は開始2〜3か月、ANCA血管炎は1年以上", "妊娠16週まではPTU", "β遮断薬はβ1選択性"], "upd": "抗甲状腺薬の用量や小児での使い分けは、最新の小児Basedow病の治療ガイドラインで確認してください。", "quiz": [{"v": "", "q": "抗甲状腺薬による無顆粒球症の頻度と発症時期は。", "o": ["100人に1人と高頻度で、初回投与から数日以内に発症する", "1,000人に1人、投与開始2〜3週以内に多い", "100人に1人、初回投与直後", "1万人に1人とまれで、投与開始1年以降に多い"], "a": 1, "e": "発熱と強い咽頭痛が出たらただちに受診・白血球確認、と最初に伝えておく。コンプライアンスが悪かった患者がきちんと飲みはじめた後に発症することもある。", "r": "p.157"}, {"v": "", "q": "抗甲状腺薬治療の効果判定について本書が述べているのは。", "o": ["TSHが最も早く反応するため、TSHの正常化で判断する", "治療開始後しばらくTSHは抑制されたままで、fT4・fT3で判断する", "TRAb価の低下で判断し、fT4は参考にとどめる", "TSHが最も早く反応するため、TSHの正常化をもって効果ありと判断する"], "a": 1, "e": "TSHは遅れて戻る。TSHだけを見ていると効いていないと誤読する。逆に慢性甲状腺炎の回復ではT4のレベルで回復がわかる。", "r": "p.155-157"}, {"v": "", "q": "MPO-ANCA関連血管炎について正しいのは。", "o": ["内服1年以上で発症することが多く、プロピルチオウラシルのほうが頻度が高い", "内服開始3か月以内に多く、チアマゾールのほうが頻度が高いため、PTUへの切り替えで予防できる", "用量依存性があり、チアマゾール15 mg/日以下なら生じない", "プロピルチオウラシル中止後も進行するため、ステロイドが必須"], "a": 0, "e": "治療前からMPO-ANCA陽性の症例もあり、因果の判断は難しい。疑わしい症状が出たら検査する。無顆粒球症が開始2〜3か月以内に多いのと、時期が対照的。", "r": "治療 p.1198"}]}, {"id": "tE", "lv": 2, "t": "Basedow病を長く診る", "min": 7, "cats": "Basedow・亢進症", "src": "p.161 ／ 治療 p.1196-1202 ／ 小児内分泌学 p.466, 471", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>抗甲状腺薬を2年続けて、甲状腺機能はずっと正常。中学3年の女の子は「もう薬をやめたい」と言います。やめてよいのでしょうか。</div><p>Basedow病は、薬を始めるところより、<strong>長く付き合うところ</strong>のほうが難しい病気です。今日は、寛解と再発、薬以外の治療、そして少し変わった場面を見ていきます。</p>\n<h3>寛解と再発</h3>\n<p>抗甲状腺薬をやめたあとの<strong>再発は30%程度</strong>です。やめどきを考える参考になるのが、<strong>TRAbが陰性になっているか</strong>です。</p>\n<p>再発しやすいのは、<strong>甲状腺腫が大きい、TRAbが高い、機能亢進が重かった、年齢が若い</strong>子です。FT3/FT4比が高い子も再燃しやすいとされます。一方で、<strong>治療期間が長いほど寛解率は上がります</strong>。冒頭の子には、TRAbを確かめたうえで、「やめても再発することがあるので、やめたあとも長く見ていく」ことを前提に相談します。</p>\n<h3>副作用は「時期」と「薬」で</h3>\n<p>第11話のおさらいです。無顆粒球症は開始2〜3か月以内、ANCA関連血管炎は1年以上（PTUで多い）。肝障害は、MMIは胆汁うっ滞型、PTUは肝炎型が多いという違いがあります。PTUを使うときは肝機能を見張ります。</p>\n<h3>薬以外の道</h3>\n<ul><li><strong>アイソトープ（放射性ヨウ素）</strong>：小児では第一選択ではない。年齢が低いと発がんの懸念があり、見解が一致していない</li>\n<li><strong>手術</strong>：甲状腺腫がとても大きい、薬が飲めない（アドヒアランス不良）ときに考える。全摘は再燃しにくいが、副甲状腺機能低下症や反回神経麻痺のリスクがある</li></ul>\n<h3>成人の重症例の工夫</h3>\n<p>成人のガイドラインでは、FT4が7 ng/dL以上の重症例で、MMI 30 mg/日、または<strong>MMI 15 mg/日＋ヨウ化カリウム</strong>が推奨されています。高用量の副作用を避けるための組み合わせです（小児は体重あたりで考える）。甲状腺の機能亢進では腸からの薬の吸収も変わるので、効き方が読みにくいことがあります。</p>\n<h3>少し変わった場面</h3>\n<ul><li><strong>euthyroid Graves' disease</strong>：眼の症状があり、TRAbやTSAbが陽性なのに、FT4とTSHは正常。眼だけが先に出る。甲状腺腫がはっきりしないことが多い</li>\n<li><strong>甲状腺中毒性周期性四肢麻痺</strong>：カリウムが細胞の中に移って<strong>低K血症</strong>になり、急に手足が動かなくなる。若い男性に多く、感染・ストレス・飲酒・β刺激薬がきっかけ。突然の脱力で運ばれてきたときに思い出せるか</li>\n<li>動悸や震えには<strong>β1選択性</strong>のβ遮断薬（喘息や糖尿病の子では注意）</li></ul>", "keys": ["中止後の再発は約30%。TRAb陰性化が参考", "再発しやすい：甲状腺腫大・TRAb高値・重症・若年。治療が長いほど寛解率は上がる", "アイソトープは小児の第一選択ではない。手術は大きな腫大・服薬困難で", "euthyroid Graves：眼症状とTRAb陽性で機能は正常", "周期性四肢麻痺は低K。若い男性の急な脱力で思い出す"], "upd": null, "quiz": [{"v": "", "q": "抗甲状腺薬治療の再燃について本書が示す数字は。", "o": ["再発率は30%程度", "再発はほとんどない", "80%以上が再燃する", "不明である"], "a": 0, "e": "寛解の判断にはTRAbの陰性化が参考になる。血清FT3/FT4比が高い症例は再燃しやすいとされる。中止後も長期の経過観察が要る。", "r": "治療 p.1197 / p.1202"}, {"v": "", "q": "euthyroid Graves' disease とは。", "o": ["眼症状がありTRAbまたはTSAb陽性だが、FT4とTSHが正常の例", "抗甲状腺薬治療によりFT4・TSHが正常化した寛解期", "抗甲状腺薬治療によりFT4・TSHが正常化した寛解期で、眼症状のみが残る例", "甲状腺腫のみがあり、眼症状も機能異常もない例"], "a": 0, "e": "眼症状だけが先行する。甲状腺腫が明らかでないことが多いので注意する。euthyroid ophthalmopathyともよばれる。", "r": "小児内分泌学 表10 p.466"}, {"v": "", "q": "甲状腺中毒性周期性四肢麻痺（TPP）について正しいのは。", "o": ["カリウムが細胞内へ移動して低カリウム血症となり麻痺を呈する。患者の約2%、若い男性に多い", "高カリウム血症による麻痺で、若い女性に多く、Basedow病患者の約20%に生じ、Kの補充で悪化する", "低カリウム血症による麻痺で、甲状腺機能低下症でも同様に生じる", "Naが細胞内へ移動して低Na血症となり麻痺を呈する"], "a": 0, "e": "感染、ストレス、アルコール摂取、β刺激薬などが誘因になる。突然の四肢脱力で搬送されたときに想起できるかどうか。", "r": "治療 p.1201"}]}, {"id": "t6", "lv": 3, "t": "中毒症＝Basedowではない", "min": 6, "cats": "破壊性・慢性甲状腺炎・Basedow・亢進症・不応症", "src": "症例 p.147-163 ／ 小児内分泌学 p.464, 472-473 ／ 治療 p.817", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>12歳の女の子。イライラと動悸で受診し、TSHは測定感度以下、FT4は2.79と高値。Basedow病だと思って抗甲状腺薬の処方を書こうとした、その前に。</div><p>処方を書く前に、TRAbとサイログロブリン、そして甲状腺の痛みを確かめてください。この子はTRAb陰性で、Tgは1,330と高く、痛みはありませんでした。甲状腺ホルモンが高くTSHが抑えられていれば、まずBasedow病を考えます。でも<strong>抗甲状腺薬を出してはいけない中毒症</strong>があります。ここを取り違えないことが、この章でいちばん大事です。</p>\n<h3>破壊性甲状腺炎（漏れているだけ）</h3>\n<p>濾胞が壊れて、たまっていたホルモンが漏れ出ています。作りすぎではありません。</p>\n<ul><li><strong>無痛性甲状腺炎</strong>：TRAb陰性、Tg高値、<strong>ヨード摂取率は低い</strong>。2〜3か月で機能低下期を経て戻る。治療はβ遮断薬だけ。抗甲状腺薬を出すと、機能低下期に急に落ちる</li>\n<li><strong>亜急性甲状腺炎</strong>：痛みと発熱。白血球は増えず、摂取率は消える。強ければステロイド</li></ul>\n<p>Basedowとの分かれ目は<strong>ヨード摂取率</strong>で、破壊性は低く、Basedowは高い。向きが逆です。</p>\n<h3>痛い甲状腺：もう一つ</h3>\n<p><strong>急性化膿性甲状腺炎</strong>は、半数以上で<strong>下咽頭梨状窩瘻</strong>が背景にあり、<strong>左側</strong>がほとんどです。繰り返すので、瘻孔を見つけて処理します。</p>\n<h3>抗体がすべて陰性の亢進症</h3>\n<p>TRAb・TSAb・TSBAbがすべて陰性で、家族にも乳児期発症の人がいる。<strong>TSH受容体の機能獲得変異</strong>による非自己免疫性の亢進症です。抗甲状腺薬では長くコントロールしにくく、手術が必要になることが多いです。</p>\n<h3>TSHが抑えられていない「高値」</h3>\n<p>fT4・fT3が高いのに<strong>TSHが正常</strong>なら、Basedowではありません。<strong>甲状腺ホルモン不応症</strong>を考えます（次の話）。</p>\n<p>橋本病の経過中に一時的に中毒症になる<strong>Hashitoxicosis</strong>もあり、これも破壊による漏れが主体です。</p>", "keys": ["抗甲状腺薬を出してはいけない中毒症がある", "無痛性：TRAb陰性・Tg高値・摂取率低値。β遮断薬のみ", "摂取率は破壊性で低く、Basedowで高い", "急性化膿性は梨状窩瘻、左側", "抗体すべて陰性＋家族歴はTSHR機能獲得変異"], "upd": null, "quiz": [{"v": "12歳女子。イライラと頻脈で受診。TSH 0.03 μIU/mL未満、fT4 2.79 ng/dL と甲状腺中毒症。TRAb陰性、Tg 1,330 ng/mL と高値。甲状腺の痛みはない。", "q": "最も考えられるのは。", "o": ["Basedow病", "破壊性甲状腺炎", "急性化膿性甲状腺炎", "TSH受容体機能獲得変異"], "a": 1, "e": "TRAb陰性＋Tg高値＋ヨード摂取率低値。濾胞が壊れて漏れ出ているだけなので自然軽快する。抗甲状腺薬を出す病態ではない。ここを取り違えることが、この章で最も注意されている。 無痛性甲状腺炎。", "r": "症例 p.163"}, {"v": "", "q": "破壊性甲状腺炎とBasedow病を分ける最も有用な検査は。", "o": ["fT4/fT3比（破壊性では高い）", "ヨード摂取率（破壊性では低値、Basedowでは高値）", "fT4/fT3比（破壊性では貯蔵ホルモンの漏出でfT4が相対的に高い）", "抗TPO抗体の有無"], "a": 1, "e": "どちらも甲状腺中毒症でTSHは抑制される。取り込みの向きが逆になるところで分ける。TRAbも助けになる。", "r": "p.163 / p.153"}, {"v": "新生児。体重増加不良と頻脈。fT3 13.1 pg/mL、fT4 7.53 ng/dL と高値。TRAb・TSAb・TSBAb すべて陰性、眼球突出なし。母のいとこにも同様の乳児期発症例がある。", "q": "最も考えられるのは。", "o": ["新生児Basedow病（抗体陰性でも母体抗体が消えた後）", "TSH受容体の機能獲得変異による非自己免疫性甲状腺機能亢進症", "McCune-Albright症候群（GNAS機能獲得による自律性機能亢進）", "甲状腺ホルモン不応症（THRB。TSHが抑制されない）"], "a": 1, "e": "抗体がすべて陰性で家族内発症がある。常染色体優性、または新生変異。抗体陽性のBasedowと治療方針も見通しも異なるので、必ず分ける。", "r": "症例1・2 p.147-149"}]}, {"id": "t9", "lv": 3, "t": "甲状腺クリーゼ", "min": 5, "cats": "Basedow・亢進症", "src": "小児内分泌学 p.111-112, 131-133 ／ 治療 p.1203", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>Basedow病で通院していたものの、ここ数か月薬を飲んでいなかった高校生。40℃の発熱と意識の混濁で救急に運ばれ、「感染性脳症の疑い」で入院しようとしています。</div><p>このまま脳症として治療を始めると、命に関わる見落としになりかねません。甲状腺クリーゼはまれですが、<strong>致死率が約10%</strong>の内分泌救急です。未治療やコントロール不良の甲状腺中毒症に、感染・手術・ストレス・<strong>服薬の中断</strong>などが加わって、体の代償が崩れて多臓器が機能不全に陥ります。</p>\n<h3>見逃される典型</h3>\n<p>発熱で受診して、<strong>感染性脳症と診断されてしまう</strong>ことです。甲状腺の病歴を聞くことが、最初の一歩になります。</p>\n<h3>Burch-Wartofskyスコア</h3>\n<p>体温、中枢神経症状、消化器・肝機能、心血管系、誘因の5項目で点数をつけます。<strong>45点以上で強く疑い、25〜44点で切迫</strong>状態を疑います。いちばん配点が高い（30点）のは、<strong>体温40℃以上</strong>と<strong>重い中枢神経症状</strong>（けいれん・昏睡）です。</p>\n<h3>治療は4本を同時に</h3>\n<ul><li><strong>抗甲状腺薬</strong>：通常より多量・頻回（成人でMMI 60 mg/日を分4）。飲めなければ経鼻胃管、注腸、点滴</li>\n<li><strong>無機ヨウ素</strong>：抗甲状腺薬を入れた<strong>あとに</strong>速やかに。合成と放出の両方を抑える</li>\n<li><strong>ステロイド</strong>：ヒドロコルチゾン（成人300 mg/日）など</li>\n<li><strong>β遮断薬</strong>：心不全に注意し、β2作用のあるものは避ける</li></ul>\n<p>そのうえで全身管理と誘因の治療を行います。手術が必要なときは、中毒症を是正してから行います。</p>", "keys": ["致死率約10%。服薬中断・感染・手術が誘因", "発熱→感染性脳症と誤診されやすい", "Burch-Wartofsky：45点以上で強く疑う", "抗甲状腺薬→無機ヨウ素→ステロイド→β遮断薬"], "upd": "小児の用量は成人の数字をそのまま使えません。体重換算と最新の甲状腺クリーゼ診療ガイドラインで確認してください。", "quiz": [{"v": "", "q": "甲状腺クリーゼの診断に用いるBurch-Wartofskyポイントスケールの判定は。", "o": ["45点以上で強く疑う、25〜44点で切迫状態を疑う、25点未満は可能性なし", "25点以上で確定診断とし、治療を開始する", "60点以上で強く疑う、40〜59点で切迫状態、40点未満は可能性なしと判定する", "体温と脈拍の2項目のみで判定する"], "a": 0, "e": "体温調節障害・心血管系障害・消化器肝機能障害・中枢神経症状・誘因となる病歴の5項目で採点する。頻度はまれだが致死率が高く、見逃してはならない内分泌救急。", "r": "小児内分泌学 表23 p.111"}, {"v": "", "q": "甲状腺クリーゼが見逃される典型的な場面として述べられているのは。", "o": ["発熱を主訴に受診し、感染性脳症と診断されること", "健診で偶然fT4高値を指摘されること", "無症状のまま甲状腺腫だけが見つかり、精査が遅れること", "小児では発症しないと考えられていること"], "a": 0, "e": "未治療ないしコントロール不良の甲状腺疾患に、感染・手術・ストレスなどが誘因として加わる。代償機構の破綻で複数臓器が機能不全に陥る。", "r": "小児内分泌学 p.111-112"}, {"v": "", "q": "甲状腺クリーゼで無機ヨウ素を投与する目的と、投与のタイミングは。", "o": ["Wolff-Chaikoff効果でホルモン合成を抑え、甲状腺からのホルモン放出も抑える。抗甲状腺薬投与後に速やかに始める", "ヨウ素欠乏を補ってホルモン合成を正常化するため、抗甲状腺薬の前に投与する（Jod-Basedow効果を期待）", "甲状腺の血流を増やして薬剤の到達を助ける", "ヨウ素は用いず、β遮断薬で代替する"], "a": 0, "e": "ヨウ化カリウム200 mg/日または内服用ルゴール液で同等量。ステロイドはヒドロコルチゾン300 mg/日分3〜4またはデキサメタゾン8 mg/日。β遮断薬は心不全に注意し、β2作用のある薬は避ける。", "r": "小児内分泌学 p.132-133"}]}, {"id": "tF", "lv": 3, "t": "甲状腺のしこりと、がん", "min": 6, "cats": "破壊性・慢性甲状腺炎・Basedow・亢進症", "src": "小児内分泌学 p.460-462, 472, 481-484", "vol": "巻の三 甲状腺", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>首のしこりに気づいた高校2年の女の子。最近、声が少しかすれる気がする、と言います。</div><p>甲状腺のしこりは大人に多いものですが、<strong>子どものしこりは、大人より悪性の割合が高い</strong>。これがこの回の出発点です。冒頭の「声のかすれ」は、とくに見逃せないサインです。</p>\n<h3>しこりを超音波で見る</h3>\n<p>健診の超音波では、3〜20 mmほどの嚢胞性の病変が2割近くに見つかったという報告もあり、しこりそのものは珍しくありません。超音波での見分けの手がかりは、</p>\n<ul><li><strong>良性らしい</strong>：嚢胞性（コロイド）、コメットサイン</li>\n<li><strong>乳頭癌を疑う</strong>：<strong>微細な石灰化、不整な辺縁、血流の増加</strong></li></ul>\n<p>疑わしければ細胞診で判断します。<strong>嗄声を伴うしこりは悪性を疑います</strong>（反回神経への浸潤）。腺腫様の結節は女性に3〜10倍多いことも知っておきます。</p>\n<h3>子どもの甲状腺癌</h3>\n<p>大部分は<strong>乳頭癌</strong>です。<strong>多発・両側性</strong>で、<strong>リンパ節転移や肺転移を起こしやすい</strong>のに、<strong>命の予後はとても良い</strong>という、一見矛盾した性質を持っています。濾胞癌は被膜や血管への浸潤で診断するので、細胞診では腺腫と区別できません。手術のあとはTSHを抑える治療と、サイログロブリン（抗Tg抗体が陰性なら）でフォローします。小児の結節と分化癌にはATAのガイドラインが参考になります。</p>\n<h3>しこりの背景にあるもの</h3>\n<ul><li><strong>橋本病</strong>：乳頭癌が約3%に見られ、悪性リンパ腫のリスクも知られる。「慢性甲状腺炎だから安心」とはしない。しこりがあれば評価する</li>\n<li><strong>頸部への放射線照射</strong>：Hodgkinリンパ腫の治療後で約30%、より高い線量では約60%に甲状腺機能低下が起こる。照射歴は必ず聞き、機能としこりの両方を長く追う</li></ul>\n<h3>熱いしこり：Plummer病</h3>\n<p>しこり自身が勝手にホルモンを作る<strong>自律性機能性甲状腺結節（Plummer病）</strong>もあります。TSH受容体やGsαの体細胞変異が原因で、<strong>TRAbは陰性</strong>。シンチグラフィでは、しこりに一致して取り込みが強く（hot nodule）、周りの正常な部分の取り込みは下がっています。ヨウ素の足りない地域に多い病気です。治療は手術やアイソトープ。Basedow病に機能性の結節が合併したものは、Marine-Lenhart症候群と呼ばれます。</p>\n<p>巻の三はここまでです。甲状腺の病気を「軸のどこが、どう壊れたか」で見てきました。作れない、出しすぎる、漏れる、効かない、そしてしこり。どの回も、最初の軸に戻れば地図の上に置けるはずです。</p>", "keys": ["子どものしこりは大人より悪性の割合が高い。嗄声は悪性を疑う", "乳頭癌を疑う超音波：微細石灰化・不整な辺縁・血流増加", "小児の乳頭癌は多発・転移しやすいが予後は良好", "橋本病の乳頭癌は約3%。頸部照射歴は長く追う", "Plummer病：TRAb陰性のhot nodule"], "upd": null, "quiz": [{"v": "", "q": "小児の甲状腺結節について述べられているのは。", "o": ["嗄声を伴うものは悪性を疑う。超音波で嚢胞性病変（コロイド・コメットサイン）は良性、微細石灰化・不整な辺縁・血流増加は乳頭癌を疑い、細胞診で判定する。小児の結節は成人より悪性の割合が高い", "小児の結節はすべて良性で経過観察でよく、嚢胞性病変は悪性の可能性が高いが細胞診は小児では行わない", "嚢胞性病変は悪性の可能性が高い", "細胞診は小児では行わない"], "a": 0, "e": "健診の超音波で3.1〜20 mmの嚢胞性病変を18.6%に認めたという報告がある。腺腫様結節は女性に3〜10倍多い。乳頭癌は多発・両側性でリンパ節転移を来しやすいが予後は良好。", "r": "小児内分泌学 p.481-484"}, {"v": "", "q": "小児甲状腺癌の組織型と特徴として正しいのは。", "o": ["乳頭癌が大部分で多発性・両側性、リンパ節転移・肺転移を来しやすいが生命予後は良好。濾胞癌は被膜浸潤・血管浸潤で診断し、細胞診では腺腫と区別できない", "濾胞癌が大部分を占め、小児の乳頭癌は転移せず、未分化癌が小児に多い", "小児の乳頭癌は転移しない", "未分化癌が小児に多い"], "a": 0, "e": "術後はTSH抑制とサイログロブリン（抗Tg抗体陰性の場合）でフォロー。ATAの小児甲状腺結節・分化癌ガイドラインが参考になる。", "r": "小児内分泌学 p.483-484"}, {"v": "", "q": "自律性機能性甲状腺結節（Plummer病）の特徴として正しいのは。", "o": ["TSH受容体またはGsαの体細胞変異による。TRAb陰性で、シンチグラフィで結節に一致したhot noduleと周囲の取り込み低下を示す。ヨウ素欠乏地域に多い", "TRAb陽性でびまん性の取り込み上昇を示し、Basedow病と同じ自己免疫性で小児に最も多い甲状腺中毒症の原因", "Basedow病と同じ自己免疫性", "小児に最も多い甲状腺中毒症の原因"], "a": 0, "e": "中毒性多結節性甲状腺腫から発生することも。Marine-Lenhart症候群はBasedow病に機能性結節が合併したもの。治療は手術やアイソトープ。", "r": "小児内分泌学 p.472"}]}];
const CA = [{"id": "c1", "lv": 1, "t": "カルシウムを守る三人組", "min": 5, "cats": "骨・Ca代謝の基本", "src": "レクチャー4 p.213-221 ／ 小児内分泌学 p.486-488", "vol": "巻の四 カルシウム・骨", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>「ビタミンDを測ってください」と言われて、25(OH)Dと1,25(OH)₂Dのどちらを出すか、一瞬迷ったことはないでしょうか。答えは、何を知りたいかで決まります。</div><p>血中のカルシウムとリンは、<strong>PTH・ビタミンD・FGF23</strong>の三人組で守られています。それぞれの持ち場と、誰が誰を抑えるかを押さえると、この章の病気はほとんど地図の上に置けるようになります。</p>\n<h3>ビタミンDは二段階で活性化される</h3>\n<p>皮膚や食事から入ったビタミンDは、まず<strong>肝臓で25位</strong>が水酸化されます。ここはほとんど調節を受けないので、血中の25(OH)Dは「どれだけ入ってきたか」、つまり<strong>体の貯金</strong>をそのまま映します。栄養状態や欠乏を見たいときに測るのはこちらです。</p>\n<p>次に<strong>腎臓で1α位</strong>が水酸化されて、活性型の1,25(OH)₂Dになります。こちらはしっかり調節されていて、<strong>PTHと低リン血症で促進</strong>、1,25(OH)₂D自身で抑制されます。だから1,25(OH)₂Dは、貯金ではなく「いま腎臓が作ろうとしている量」を表します。</p>\n<h3>PTHはカルシウムの見張り番</h3>\n<p>副甲状腺の細胞表面には<strong>カルシウム感知受容体（CaSR）</strong>があり、Caが高いとGq/G11を介してPTHの合成と分泌を止めます。Caが下がるとPTHが出て、骨からCaを出し、腎でCaを回収し、1α水酸化を進めて腸からの吸収も増やします。PTH(1-84)の半減期は<strong>2〜4分</strong>ととても短く、刻々と調節されています。</p>\n<p>カルシトニンはPTHと逆で、Caが高いと出ます。ただしヒトでの役割は限られていて、甲状腺を全部取っても欠乏症状は出ません。製剤として使うと受容体が減って、効き目がすぐ落ちます（タキフィラキシー）。</p>\n<h3>FGF23はリンを捨てさせる</h3>\n<p>骨細胞から出る<strong>FGF23</strong>は、腎でのリン再吸収を抑えて<strong>リンを尿に捨てさせ</strong>、しかも<strong>1α水酸化を抑えて</strong>活性型ビタミンDを作らせません。働くには受容体FGFR1に<strong>αKlotho</strong>が組み合わさる必要があり、Klothoのある組織にだけ効くことが、FGF23がホルモンとして働ける理由です。</p>\n<p>この「リンを捨て、しかもビタミンDを作らせない」という二重の作用が、のちに出てくる低リン血症性くる病の謎を解く鍵になります。</p>", "keys": ["25(OH)Dは貯金（栄養評価）、1,25(OH)₂Dはいま作っている量", "1α水酸化はPTHと低リンで促進、1,25(OH)₂Dで抑制", "CaSRはCa高値でPTHを止める。PTHの半減期は2〜4分", "FGF23はリンを捨てさせ、1α水酸化も抑える（Klotho必要）", "カルシトニンのヒトでの役割は限定的"], "upd": null, "quiz": [{"v": "", "q": "ビタミンDの25位水酸化（肝）について正しいのは。", "o": ["PTHにより促進され、血中25(OH)DはPTHの作用を反映する", "代謝調節を受けにくく、血中25(OH)D濃度はビタミンD摂取量を反映する", "低リン血症で強く促進され、血中25(OH)Dはリン状態を反映する", "1,25(OH)2Dによる負のフィードバックを受け、血中濃度は一定に保たれる"], "a": 1, "e": "だから栄養状態の指標として25(OH)Dを測る。調節を受けるのは腎の1α水酸化のほうで、こちらはPTHと低リン血症で促進、1,25(OH)2Dで抑制される。", "r": "レクチャー4 p.219-221"}, {"v": "", "q": "FGF23の作用として正しい組み合わせは。", "o": ["腎でのリン再吸収を抑制し、1α水酸化酵素を抑制する", "腎でのリン再吸収を促進し、1α水酸化酵素を活性化して1,25(OH)2Dを増やす", "Ca再吸収を抑制する", "PTH分泌を促進する"], "a": 0, "e": "骨細胞から出てリンを捨てさせ、しかも活性型ビタミンDを作らせない。受容体はFGFR1（IIIc）とαKlothoの複合体。低リン血症性くる病はこの過剰で説明される。", "r": "レクチャー4 p.221 / p.213"}, {"v": "", "q": "CaSRが活性化されたときに起こるのは。", "o": ["Gq/G11を介したIP3とDAGの産生によりPTHの合成・分泌が抑制される", "Gs を介したcAMP産生によりPTHの分泌が促進される", "Gi を介したcAMP低下によりPTHの分泌が抑制され、カルシトニンの分泌も抑制される", "Gq/G11 を介してPTHの分泌が促進され、Caが上昇する"], "a": 0, "e": "変異によりCa濃度のセットポイントが変化する。機能獲得なら低Ca血症（ADH）、機能喪失ならFHHになる。カルシトニンはPTHと逆で、Ca高値で分泌が促進される。", "r": "小児内分泌学 p.486-488"}]}, {"id": "c2", "lv": 1, "t": "数字の読みかた：Ca・リンの落とし穴", "min": 5, "cats": "骨・Ca代謝の基本・副甲状腺機能低下症", "src": "小児内分泌学 p.119-121, 144, 159 ／ 治療 p.1218-1222", "vol": "巻の四 カルシウム・骨", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>過換気で手がしびれてつっぱる高校生。総Caを測ると正常です。それでも症状はカルシウムで説明できます。</div><p>カルシウムとリンの数字には、<strong>そのまま読むと間違える</strong>落とし穴がいくつかあります。今日はそれを順に片づけます。</p>\n<h3>総Caは「見かけ」</h3>\n<p>血中Caの約半分はアルブミンと結合していて、働くのは<strong>イオン化Ca</strong>です。アルブミンが低いと総Caは低く見えるので、補正します。</p>\n<div class=\"formula\">補正Ca ＝ 測定Ca ＋（4 − 血清アルブミン）</div>\n<p>冒頭の高校生は、<strong>アルカローシス</strong>でアルブミンへの結合が増え、総Caは変わらないままイオン化Caだけが下がっていました。過換気でテタニーが出る理屈がここにあります。逆に言うと、アルカローシスでは補正式が過剰補正になるので、<strong>できればイオン化Caを実測</strong>します。単位の換算は「1 mmol/L ＝ 2 mEq/L ＝ 4 mg/dL」です。</p>\n<h3>リンは「年齢で」読む</h3>\n<p>カルシウムと違って、リンの基準値は年齢で大きく変わります。<strong>乳児では4.8〜8.2 mg/dLほどと高く</strong>、成人に向かって2.7〜4.7程度まで下がります。成人の物差しで乳児のリンを見ると、明らかな低リン血症を「正常」と読んでしまいます。溶血や長く置いた検体では偽高値になる点にも注意します。腎でのリン喪失を見るときは%TRPやTmP/GFRを使います。</p>\n<h3>PTHの測り方にもくせがある</h3>\n<p>よく使うintact PTHは、生理活性のあるPTH(1-84)に加えて<strong>不活性な断片も一緒に</strong>測ってしまいます。腎機能が落ちていると断片がたまって高めに出るので、慢性腎臓病では注意します。第3世代のwhole PTHはこの問題を避けられます。</p>\n<h3>新生児は別の世界</h3>\n<p>胎児は胎盤からの能動輸送で<strong>高Caの状態</strong>にいます。生まれてその供給が断たれると血清Caが下がり、そこからPTHと1,25(OH)₂Dが立ち上がってきます。だから新生児の低Caの基準は別にあり、<strong>正期産児で8.0 mg/dL未満、低出生体重児で7.0 mg/dL未満</strong>です。生後48〜72時間以内の早発型は、早産・仮死・糖尿病母体児などで起こりやすくなります。早産児は胎盤からの供給が早く切れるので、ミネラル不足（未熟児くる病）にもなりやすいのです。</p>", "keys": ["補正Ca＝測定Ca＋（4−Alb）。アルカローシスではイオン化Caを実測", "過換気のテタニーはイオン化Caの低下で起こる", "リンは年齢別。乳児は成人よりずっと高い", "intact PTHは断片も測る。CKDでは高めに出る", "新生児の低Ca：正期産8.0未満、低出生体重7.0未満"], "upd": null, "quiz": [{"v": "", "q": "低カルシウム血症の判定で用いる補正Ca値の式は。", "o": ["補正Ca = 測定Ca + (4 − 血清Alb)", "補正Ca = 測定Ca × 血清Alb / 4（Albが低いほど低く補正）", "補正Ca = 測定Ca − 血清Alb", "補正は不要"], "a": 0, "e": "アルカローシスではアルブミンとの結合が増えるため、総Ca値は正常のままイオン化Caが低下する。過換気でテタニーが出る理屈がここにある。", "r": "小児内分泌学 p.498 / 治療 p.1222"}, {"v": "", "q": "血清リン値の年齢変化として正しいのは。", "o": ["乳児で低く（2.7〜4.7 mg/dL程度）、思春期に向けて上昇する", "乳児で高く（4.8〜8.2 mg/dL程度）、成人に向けて低下する（2.7〜4.7 mg/dL程度）", "年齢による変動は小さく、成人の基準値をそのまま用いてよい", "乳児で高いが、生後6か月で成人値（2.7〜4.7 mg/dL程度）に達し、以後は年齢による変動がない"], "a": 1, "e": "成人の基準で乳児のリンを読むと、低リン血症を見逃す。カルシウムと違い、リンは年齢別の値で判断する。", "r": "表1 p.221"}, {"v": "", "q": "新生児の低カルシウム血症の判定基準として示されているのは。", "o": ["正期産児で血清Ca 8.0 mg/dL未満、低出生体重児で7.0 mg/dL未満、イオン化Caで3〜3.5 mg/dL未満", "正期産児・低出生体重児とも血清Ca 8.5 mg/dL未満", "正期産児で7.0 mg/dL未満、低出生体重児で8.0 mg/dL未満、イオン化Caで4.0〜4.5 mg/dL未満とする", "イオン化Ca 4.0 mg/dL未満のみで判定する"], "a": 0, "e": "早発型（生後48〜72時間以内）と遅発型に分ける。早発型のリスクは早産、低出生体重、仮死、糖尿病母体児、子宮内発育遅延。", "r": "治療 p.1218-1219"}]}, {"id": "cE", "lv": 2, "t": "新生児と早産児のカルシウム", "min": 5, "cats": "骨・Ca代謝の基本・副甲状腺機能低下症・ビタミンD関連くる病", "src": "小児内分泌学 p.144, 159 ／ 治療 p.1218-1221", "vol": "巻の四 カルシウム・骨", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>在胎29週で生まれた赤ちゃん。生後2日目にCaが6.8 mg/dLまで下がりました。2か月後には、ALPがどんどん上がってきています。</div><p>新生児、とくに早産児のカルシウムには、<strong>二つの山</strong>があります。生まれてすぐの低Caと、数か月かけて進む骨のミネラル不足です。冒頭の赤ちゃんは、その両方に出会っています。</p>\n<h3>生まれた瞬間に起きること</h3>\n<p>第2話で見たように、胎児は胎盤からの能動輸送でCaを受け取り、<strong>高Caの状態</strong>にいます。母から大量のビタミンDも流れ込みますが、胎児の1,25(OH)₂Dは母より低く保たれています。生まれて胎盤からの供給が断たれると、血清Caが下がり、そこから<strong>PTHと1,25(OH)₂D</strong>が立ち上がってきます。この切り替えがうまくいかないと、低Caになります。</p>\n<h3>早発型と遅発型</h3>\n<p>新生児の低Caは、生まれて<strong>48〜72時間以内</strong>の<strong>早発型</strong>と、それより後の<strong>遅発型</strong>に分けます。早発型のリスクは、<strong>早産、低出生体重、仮死、糖尿病の母から生まれた子、子宮内発育遅延</strong>です。冒頭の子は早産・低出生体重なので、生後2日目の低Caは典型的な早発型です。</p>\n<p>判定の基準は、正期産で8.0 mg/dL未満、低出生体重児で7.0 mg/dL未満、イオン化Caで3〜3.5 mg/dL未満。治療を考える目安は、血清Ca 7.5 mg/dL未満かイオン化Ca 0.8 mmol/L未満で、症状があればそれより高くても治療します。</p>\n<h3>Caを入れる前と、入れても上がらないとき</h3>\n<p>第4話のおさらいです。補正の前にクリティカルサンプルを採り、入れても上がらなければ<strong>Mg</strong>を見ます。Ca製剤の静注は心電図モニター下でゆっくり、単独ルートで、漏れによる石灰沈着に気をつけます。</p>\n<h3>2か月後の山：未熟児くる病</h3>\n<p>早産児は、本来なら妊娠後期に胎盤からたっぷり受け取るはずだったCaとPを、<strong>受け取りきれずに</strong>生まれてきます。だから<strong>ミネラルが足りず</strong>、骨の石灰化が追いつかない未熟児くる病（骨減少症）になりやすいのです。ALPの上昇はそのサインです。</p>\n<p>ここで大事な落とし穴があります。<strong>リンが足りない状態で、ビタミンDだけを入れると、かえって悪くなります</strong>。ビタミンDでCaの吸収だけが増えても、リンがなければ骨に沈着できないからです。CaとPの<strong>バランス</strong>が要ります。</p>\n<div class=\"formula\">Ca：P の投与比　静脈栄養 1.3〜1.7：1 ／ 経腸栄養 2：1</div>\n<p>第9話で見るように、低リン血症が重なるとALPは上がりきらないことがあります。ALPだけでなく、リンそのものも追います。</p>", "keys": ["胎児は高Ca。出生で供給が断たれ、PTHと1,25(OH)₂Dが立ち上がる", "早発型（48〜72時間以内）：早産・低出生体重・仮死・糖尿病母体児・IUGR", "補正前にクリティカルサンプル、上がらなければMg", "早産児はミネラル不足で未熟児くる病になりやすい", "リン不足のままビタミンDだけ入れると悪化。Ca:P比を守る"], "upd": null, "quiz": [{"v": "", "q": "胎児期から新生児期へのカルシウム代謝の移行として正しいのは。", "o": ["胎児は胎盤を介した能動輸送で高Ca状態にあり、出生で供給が断たれると血清Caが低下して、PTHと1,25(OH)2Dの産生が立ち上がる", "胎児の血清Caは母体より低く、出生後に上昇し、胎児期は母体の1,25(OH)2Dに完全に依存して胎児腎では産生されない", "胎児期は母体の1,25(OH)2Dに完全に依存し、胎児腎では産生されない", "出生直後からCaの吸収は腸管に依存し、PTHは関与しない"], "a": 0, "e": "母体から多量のビタミンDが流入するが、胎児の1,25(OH)2Dは母体より低く保たれる。早産児では胎盤輸送からの離脱が早く、ミネラル不足（未熟児くる病）になりやすい。", "r": "小児内分泌学 p.159"}, {"v": "", "q": "新生児・乳児の低カルシウム血症で、治療を要する目安として示されているのは。", "o": ["血清Ca<7.5 mg/dLまたはイオン化Ca<0.8 mmol/L、症状があればより高い値でも", "血清Ca<9.0 mg/dLまたはイオン化Ca<1.2 mmol/Lで、症状の有無によらず全例治療", "イオン化Ca<1.2 mmol/Lで全例治療", "症状がなければ血清Ca 6.0 mg/dLまで経過観察"], "a": 0, "e": "基準値は血清Ca 8.4〜10.6 mg/dL、イオン化Ca 1.1〜1.3 mmol/L。1 mmol/L＝2 mEq/L＝4 mg/dL。アルブミン補正式はアルカローシスで過剰補正になるため、イオン化Caの実測が望ましい。", "r": "小児内分泌学 p.144"}, {"v": "低リン血症を伴う未熟児くる病に、ビタミンDのみを投与した。", "q": "起こりうることは。", "o": ["Ca吸収が増えて骨化が進み、速やかに改善する", "Ca吸収の増加によりむしろ病態が悪化する", "リン吸収も増えるため、低リン血症が是正される", "高Ca血症のみ生じ、骨の病態は変わらない"], "a": 1, "e": "リンが足りない状態でCaだけを増やしても石灰化は進まない。未熟児ではCa:Pの投与比が、静脈栄養で1.3〜1.7:1、経腸栄養で2:1が推奨されている。", "r": "治療 p.1221"}]}, {"id": "c3", "lv": 2, "t": "低カルシウム血症：治療の前にやること", "min": 5, "cats": "副甲状腺機能低下症", "src": "治療 p.1219-1236 ／ 小児内分泌学 p.144-146, 496", "vol": "巻の四 カルシウム・骨", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>けいれんで運ばれてきた新生児。Caが低い。グルコン酸カルシウムを入れたのに、なかなか上がってこない。次に何を見ますか。</div><p>低カルシウム血症は、治療すればすぐ数字が動きます。だからこそ、<strong>治療の前にやっておくこと</strong>と、<strong>入れても上がらないときに見るところ</strong>を決めておくと、あとで原因が分からなくなるのを防げます。</p>\n<h3>まず「クリティカルサンプル」</h3>\n<p>低血糖のときと同じ発想です。補正を始める前に、<strong>血液ガス、Ca、Alb、P、Mg、ALP、intact PTH、25(OH)D、BUN、Cr</strong>、それに<strong>尿のCa・P・Mg・Cr</strong>を採っておきます。補正したあとでは、PTHが本当に低かったのか、ビタミンDが足りなかったのか、分けられなくなります。</p>\n<h3>入れても上がらないなら、Mg</h3>\n<p>冒頭の新生児で次に見るのは<strong>血清Mg</strong>です。Mgが1.0 mg/dL未満に下がると、<strong>PTHの分泌も作用も止まってしまい</strong>、いくらCaを入れても反応しません。基準は1.8〜2.5 mg/dL。Mgを補えば、Caもついてきます。数値が極端に低くなくても、補充を考える場面があります。</p>\n<h3>静注は「ゆっくり、単独で、モニターを付けて」</h3>\n<ul><li>急速に入れると<strong>徐脈や不整脈</strong>（心室性期外収縮、torsade de pointes）を起こしうるので、心電図モニター下で緩徐に</li>\n<li>漏れると皮下に<strong>石灰沈着</strong>を起こすので、単独ルートで、末梢からは慎重に</li>\n<li>8.5%グルコン酸カルシウムは、Caとして約8.5 mg/mL</li></ul>\n<p>けいれんやテタニーがあれば速やかに補正します。血清Ca 7.5 mg/dL以上で症状がなければ、ゆっくりした補充を選べます。乳児の治療の目安は、血清Ca 7.5 mg/dL未満かイオン化Ca 0.8 mmol/L未満ですが、症状があればそれより高くても治療します。</p>\n<h3>長く続いた低Caのサイン</h3>\n<p>心電図ではQTc延長が出ます。低Caが長く続くと、頭部CTで<strong>大脳基底核の石灰化</strong>が見られることがあります（錐体外路症状はまれ）。Chvostek徴候などのテタニー誘発法は有名ですが、必ず出るわけではありません。</p>", "keys": ["補正の前にクリティカルサンプル（血液・尿）", "Caを入れても上がらなければMgを確認", "Ca静注はゆっくり、単独ルート、心電図モニター", "症状がなくCa 7.5以上なら緩徐な補充も可", "長期の低Caで基底核石灰化、QTc延長"], "upd": null, "quiz": [{"v": "", "q": "低カルシウム血症の精査で提出すべき critical sample の項目として挙げられているのは。", "o": ["血液ガス、Ca、Alb、P、Mg、ALP、intact PTH、25(OH)D、BUN、Cr、尿中Ca・P・Mg・Cr", "Ca・P・intact PTHの3項目で足り、Mgや25(OH)D、尿中電解質は治療が落ち着いてから後日に改めて提出すればよい", "血液ガスと血清電解質のみで、尿中電解質は必要ない", "治療開始後に採血しても原因の鑑別には支障がない"], "a": 0, "e": "治療を始める前に採っておかないと、後から原因を分けられない。低血糖のcritical sampleと同じ発想。", "r": "治療 p.1224"}, {"v": "低カルシウム血症でけいれんを起こした新生児。グルコン酸カルシウムを投与したが改善しない。", "q": "次に確認すべきなのは。", "o": ["血清Mg値（低Mg血症があるとPTH分泌が抑制され、Caを入れても反応しない）", "血清P値（高P血症でCaが沈着するため）", "血清K値（低K血症がけいれんを助長するため、Caと同時に補正する必要があり、Kが正常化すれば止まる）", "血糖値（低血糖を合併しているため）"], "a": 0, "e": "Mg 1.0 mg/dL未満なら硫酸マグネシウムを補充する。血清Mg値が低値でなくとも補充を考慮する場面がある、とも付されている。", "r": "治療 p.1219 / p.1224"}, {"v": "", "q": "低カルシウム血症で心電図モニターが必須とされる理由は。", "o": ["QT延長、徐脈、心収縮力低下、ジギタリス不応に加え、Ca急速静注で心室性期外収縮やtorsade de pointesを誘発しうるため", "低Caでは心房細動が必発のため", "Caの補充で血圧が急上昇するため", "QT短縮による突然死を防ぐため"], "a": 0, "e": "けいれんやテタニーなど明らかな症状があれば速やかに補正。血清Ca 7.5 mg/dL以上で症状がなければ緩徐な補充も選べる。", "r": "小児内分泌学 p.145"}]}, {"id": "c4", "lv": 2, "t": "副甲状腺機能低下症の原因を探す", "min": 6, "cats": "副甲状腺機能低下症・骨・Ca代謝の基本", "src": "症例1 p.167-173 ／ 小児内分泌学 p.485, 497 ／ 治療 p.850-854", "vol": "巻の四 カルシウム・骨", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>低Caでけいれんした新生児。Pは高い。心臓に手術の既往があり、口蓋の異常も指摘されている。</div><p>低Caに<strong>高P</strong>が並び、PTHが出ていない。これが副甲状腺機能低下症の基本形です。原因を探すときは、副甲状腺がどこから来たかを知っておくと、合併する所見の意味が分かります。</p>\n<h3>副甲状腺のふるさと</h3>\n<p>副甲状腺は<strong>第3・第4咽頭嚢</strong>の内胚葉から生まれます。第3咽頭嚢から来たものは胸腺と一緒に尾側へ降りて下副甲状腺に、第4咽頭嚢から来たものが上副甲状腺になります。このとき働く転写因子の異常が、そのまま病気になります。</p>\n<ul><li><strong>TBX1</strong> → 22q11.2欠失症候群</li>\n<li><strong>GATA3</strong> → HDR症候群</li>\n<li><strong>GCM2</strong>（副甲状腺だけに働く）→ 単独の副甲状腺機能低下症</li></ul>\n<h3>22q11.2欠失症候群</h3>\n<p>冒頭の子です。低Ca・高Pに、<strong>円錐動脈幹の心奇形と口蓋裂</strong>が並びます。頻度は数千人に1人（報告によって3,000〜6,000人に1人）で、決してまれではありません。責任遺伝子はTBX1と考えられていますが、すべての表現型がTBX1だけで説明できるかはまだ分かっていません。</p>\n<p>大事なのは、<strong>低Caが新生児期に一度よくなっても、思春期や強いストレスで再び出てくる</strong>ことです。「新生児期に問題なかった」は、これからの否定になりません。</p>\n<h3>HDR症候群</h3>\n<p><strong>H</strong>ypoparathyroidism（副甲状腺機能低下）、<strong>D</strong>eafness（難聴）、<strong>R</strong>enal anomaly（腎の異常）。GATA3のハプロ不全です。難聴はほぼ必発ですが、腎奇形を欠くこともあり、三つがそろわなくても否定できません。低Caの子が難聴なら、腎の画像も見ます。</p>\n<h3>自己免疫の副甲状腺機能低下</h3>\n<p><strong>APS1</strong>（自己免疫性多内分泌腺症候群1型）は<strong>AIRE</strong>の変異で、副甲状腺に対する自己抗原としてNALP5やCaSRが知られています。副腎不全やカンジダ症と並ぶので、経過の中で一つずつ増えていくことを念頭に置きます。</p>\n<h3>軽症は負荷をかけて見つける</h3>\n<p>安静時の値だけでは、軽いPTH分泌不全は拾えません。<strong>EDTA負荷やNaHCO₃負荷</strong>で低Caのストレスをかけ、PTHが十分に立ち上がるかを見ます。</p>", "keys": ["低Ca＋高P＋PTH低値が基本形", "副甲状腺は第3・4咽頭嚢から。TBX1・GATA3・GCM2", "22q11.2：心奇形＋口蓋裂。思春期やストレスで再燃しうる", "HDR：難聴はほぼ必発、腎奇形は欠けることも", "軽症はEDTA・NaHCO₃負荷で見つける"], "upd": null, "quiz": [{"v": "新生児。けいれんで入院。Ca 4.4 mg/dL、P 9.3 mg/dL。心奇形の既往があり、口蓋の異常を指摘されている。", "q": "最も考えられるのは。", "o": ["偽性副甲状腺機能低下症1A型（新生児期から高P・低Caを呈する）", "22q11.2欠失症候群による副甲状腺機能低下症", "母体副甲状腺機能亢進症による一過性副甲状腺機能低下症", "CaSR機能獲得変異による常染色体顕性低Ca血症"], "a": 1, "e": "低Ca＋高Pという副甲状腺機能低下のパターンに、円錐動脈幹の心奇形と口蓋裂が並ぶ。頻度は3,000〜4,000人に1人で、決してまれではない。", "r": "症例1 p.167-169"}, {"v": "", "q": "22q11.2欠失症候群の低カルシウム血症について正しいのは。", "o": ["多くは新生児期に発症し、乳児期以降に新たに顕性化することは少ない", "新生児期に出るものから思春期に顕性化するものまで幅がある", "新生児期の低Caは一過性が多く、思春期以降に再燃するのは1割程度", "副甲状腺の低形成は軽度で、補充を要することはまれ"], "a": 1, "e": "一度正常化しても、成長やストレスで再び表に出る。「新生児期に問題なかった」は今後の否定にならない。", "r": "p.169"}, {"v": "低カルシウム血症でけいれんを起こした乳児。難聴があり、腎の形態異常も指摘されている。", "q": "考えられる症候群は。", "o": ["HDR症候群", "22q11.2欠失症候群", "Kenny-Caffey症候群", "偽性副甲状腺機能低下症"], "a": 0, "e": "Hypoparathyroidism・Deafness・Renal anomaly。難聴はほぼ必発だが、腎奇形を欠く症例もあり、三徴が揃わなくても否定できない。 GATA3ハプロ不全。", "r": "p.173"}]}, {"id": "c5", "lv": 2, "t": "副甲状腺機能低下症の治療：上げすぎない", "min": 6, "cats": "副甲状腺機能低下症・カルシウム感知受容体", "src": "症例 p.173-177 ／ 治療 p.1227-1236", "vol": "巻の四 カルシウム・骨", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>活性型ビタミンDで治療している低Caの子。Caはまだ低めなのに、尿中Ca/Crが0.4〜1.2と高い。この「ちぐはぐ」をどう読みますか。</div><p>副甲状腺機能低下症の治療でいちばん大事な考え方は、<strong>Caを正常の真ん中まで上げにいかない</strong>ことです。理由は腎臓にあります。</p>\n<h3>PTHがないと、腎はCaを捨てる</h3>\n<p>PTHには腎でCaを回収させる働きがあります。PTHがない状態で活性型ビタミンDを使って血清Caを上げると、腸から入ったCaは腎で回収されずに尿へ出ていき、<strong>高カルシウム尿症から腎石灰化・尿路結石</strong>を作ります。だから目標はこうなります。</p>\n<div class=\"formula\">血清Ca：正常下限付近 ／ 尿中Ca/Cr：0.3以下</div>\n<p>活性型ビタミンDを増やしてもCaが上がらないときは、<strong>高リン血症</strong>が足を引っぱっていることがあります。リンを下げる方向（低リンミルクなど）を足すという発想が要ります。</p>\n<h3>冒頭の子：CaSRの機能獲得変異</h3>\n<p>Caが低めなのに尿のCaが多い。これは<strong>カルシウム感知受容体（CaSR）の機能獲得変異</strong>（常染色体顕性低カルシウム血症、ADH）の典型です。受容体が「Caは足りている」と誤認するので、PTHは出ず、腎はCaを捨て続けます。</p>\n<p>普通の副甲状腺機能低下症よりも、<strong>同じ血清Caを保つのに必要なビタミンDが多く</strong>、しかも尿のCaがさらに多い。これを知らずにCaを目標値まで上げにいくと、確実に腎石灰化を作ります。</p>\n<h3>ADHの治療の工夫</h3>\n<ul><li><strong>サイアザイド</strong>を併用すると、遠位尿細管のNaCl共輸送体が止まり、より近位でCaの再吸収が増えて尿中Caが下がる。ビタミンDの必要量も減る（脱水、低K、低Mgに注意）</li>\n<li>血清Caの目標はさらに低めに置く</li>\n<li>PTH製剤（rhPTH(1-84)）は、ADHでは高カルシウム尿症を助長するので適応から外れる</li></ul>\n<p>重症の機能獲得変異では、ヘンレ係蹄の太い上行脚でもCaの回収がうまくいかず、<strong>Bartter症候群様</strong>（type V）の病態になります。CaSRは副甲状腺だけでなく、腎にもあるからです。</p>\n<p>逆に、CaSRの<strong>機能喪失</strong>はFHH（家族性低カルシウム尿性高カルシウム血症）になります。こちらは高Caの話で、次の次の回で出てきます。</p>", "keys": ["目標は血清Ca正常下限、尿中Ca/Cr 0.3以下", "上げすぎると高Ca尿症・腎石灰化", "Caが上がらなければ高リンを疑い、リンを下げる", "低Caなのに尿Caが多い→CaSR機能獲得（ADH）", "ADHはサイアザイド併用、目標はさらに低め"], "upd": null, "quiz": [{"v": "", "q": "副甲状腺機能低下症の活性型ビタミンD治療で、モニタリングの指標とすべきなのは。", "o": ["血清Caを正常下限付近に保ち、尿中Ca/Cr比を0.3以下に抑える", "血清Caを正常中央に保ち、尿中Caは問わない", "intact PTHを正常化することを目標にする", "血清Caを正常上限付近に保ち、尿中Ca/Cr比は0.6以下であれば問題ない"], "a": 0, "e": "Caを正常域まで上げにいくと高カルシウム尿症と腎石灰化を招く。intact PTHを下げきろうとしないことも同じ理由。", "r": "治療 p.1229 / p.1236"}, {"v": "低カルシウム血症でアルファカルシドールを要する児。血清Caは低めなのに、尿中Ca/Cr比が0.4〜1.2と高い。", "q": "最も考えられるのは。", "o": ["ビタミンD依存性くる病1型（1α水酸化の障害）", "カルシウム感知受容体（CaSR）の機能獲得変異", "偽性副甲状腺機能低下症（PTH不応で尿中Caは低い）", "22q11.2欠失症候群（副甲状腺の低形成）"], "a": 1, "e": "受容体が「Caは足りている」と誤認するため、PTHが出ず、腎はCaを捨てる。低Caなのに尿中Caが多いというちぐはぐさが決め手。", "r": "症例 p.175"}, {"v": "", "q": "CaSR機能獲得変異による低カルシウム血症で、尿中Ca排泄を減らすために併用するのは。", "o": ["フロセミド", "サイアザイド", "ビスホスホネート", "炭酸カルシウムのみ"], "a": 1, "e": "サイアザイドは尿中Caを下げる。これにより活性型ビタミンDの必要量も減らせ、腎石灰化のリスクを抑えられる。 ヒドロクロロチアジド。", "r": "p.175-177 / 文献"}]}, {"id": "c6", "lv": 3, "t": "PTHが効かない：偽性副甲状腺機能低下症", "min": 7, "cats": "偽性副甲状腺機能低下症・副甲状腺機能低下症", "src": "症例 p.179-187 ／ 小児内分泌学 p.496, 502-504 ／ 治療 p.849, 1228", "vol": "巻の四 カルシウム・骨", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>低身長で肥満、手の指が短い女の子。Caは低くPは高い。でもPTHは高値です。TSHも少し高い。</div><p>PTHはしっかり出ているのに、標的の臓器が反応しない。これが<strong>偽性副甲状腺機能低下症（PHP）</strong>です。低Ca・高Pは同じでも、<strong>PTHが高い</strong>ことが入り口になります。</p>\n<h3>分泌不全と不応を、腎と骨で分ける</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>尿中Ca排泄率</th><th>骨代謝回転</th></tr>\n<tr><td>PTH分泌不全</td><td>上昇</td><td>低下</td></tr>\n<tr><td>PTH不応（PHP）</td><td>上がらない</td><td>亢進</td></tr></table></div>\n<p>PHPでは、腎尿細管でCaを回収する反応は保たれていて、骨ではPTHのシグナルが働いています。だから2つとも向きが逆になります。</p>\n<h3>I型とII型</h3>\n<p>PTHを負荷して、<strong>尿中cAMP</strong>が上がるかを見ます。I型はcAMPもリン利尿も出ません。II型はcAMPは上がるのにリン利尿が出ない、つまりcAMPより下流の障害です。</p>\n<h3>冒頭の子：PHP Ia</h3>\n<p>短指症（中手骨の短縮）、低身長、肥満、丸い顔、皮下の骨化。これを<strong>Albright骨異栄養症（AHO）</strong>と呼びます。PHP Iaは、AHOに<strong>複数のホルモンへの不応</strong>（PTHに加えてTSHなど）が加わったもので、<strong>母から受け継いだGNAS</strong>の変異が原因です。肥満と低身長は、低Caが表に出るより前の乳幼児期から進むことがあるので、生化学だけを待っていると診断が遅れます。</p>\n<h3>なぜ「母由来」だけで起こるのか</h3>\n<p>ここがこの病気のいちばん面白いところです。GNASは<strong>ゲノムインプリンティング</strong>を受けていて、<strong>腎の近位尿細管</strong>では父由来のアレルが眠っており、<strong>母由来だけが働いて</strong>います。だから母由来に変異があると、腎ではGsαがほとんどなくなり、PTHが効かなくなります。甲状腺や卵巣でも似たことが起きますが、甲状腺では抑制が部分的なので、TSH不応も部分的にとどまります。</p>\n<h3>父由来ならどうなるか</h3>\n<ul><li><strong>PPHP</strong>（偽性偽性副甲状腺機能低下症）：AHOはあるが、ホルモン不応はない。子宮内発育遅延を伴うことがある</li>\n<li><strong>POH</strong>（進行性骨異形成症）：骨化が皮下にとどまらず、筋や筋膜にまで及ぶ</li></ul>\n<p>同じ遺伝子でも、どちらの親から来たかで顔つきがまったく変わります。</p>\n<h3>そのほか</h3>\n<p><strong>PHP Ib</strong>はGNAS領域の<strong>メチル化異常</strong>（STX16の欠失など）で、AHOを欠くことが多いものの、Iaとの臨床像は重なります。<strong>acrodysostosis</strong>（PRKAR1A、PDE4D）はcAMP-PKA経路のさらに下流の異常で、PHPと連続した病態として捉えられています。</p>", "keys": ["PHPはPTH高値。分泌不全とは尿中Ca排泄・骨代謝が逆", "I型：cAMPもリン利尿も出ない。II型：cAMPは上がる", "Ia：AHO＋多ホルモン不応。母由来GNAS", "腎近位尿細管では母由来GNASだけが働く（インプリンティング）", "父由来はPPHP・POH。Ibはメチル化異常"], "upd": null, "quiz": [{"v": "低身長と肥満、中手骨の短縮を認める児。低Ca・高P・PTH高値。TSHも軽度高値。", "q": "最も考えられるのは。", "o": ["PHP Ia", "PPHP", "PHP II", "副甲状腺機能低下症"], "a": 0, "e": "Albright骨異栄養症（AHO：短指症・低身長・肥満・円形顔貌・皮下骨化）に多ホルモン不応が加わる。母由来アレルのGNAS変異による。", "r": "症例1 p.179-181"}, {"v": "", "q": "母由来のGNAS変異でPTH不応が生じる理由は。", "o": ["腎近位尿細管ではGNASが母由来アレルからのみ発現しているため", "父由来アレルの発現量が多く、母由来の変異が相対的に目立つため", "変異Gsαが優性阻害として働き、正常アレル由来の蛋白も機能しなくなるため", "PTH受容体が同時に変異するため"], "a": 0, "e": "ゲノムインプリンティング。一方で甲状腺ではインプリンティング調節を受けず、少なくとも部分的にPTH／TSH反応性が保たれる。組織ごとに事情が違う。", "r": "p.183 / p.187"}, {"v": "", "q": "PTH分泌不全とPTH不応性（PHP）を分ける検査所見は。", "o": ["尿中Ca分画排泄率（FECa）が、分泌不全では上昇、PHPでは低下〜正常", "血清P値（分泌不全で高く、PHPでは正常にとどまる。FECaは両者とも低い）", "血清Mg値（分泌不全で低く、PHPで正常）", "血清ALP（分泌不全で高く、PHPで正常）"], "a": 0, "e": "PHPでは腎尿細管のCa再吸収へのPTH反応性が保たれているため。加えて骨代謝回転も、分泌不全では低下、PHPでは亢進と逆になる。", "r": "小児内分泌学 p.496"}]}, {"id": "c7", "lv": 2, "t": "高カルシウム血症と副甲状腺機能亢進症", "min": 7, "cats": "副甲状腺機能亢進症・カルシウム感知受容体", "src": "症例1 p.188-193 ／ 小児内分泌学 p.117-118, 494 ／ 治療 p.1242-1243", "vol": "巻の四 カルシウム・骨", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>腹痛で受診した中学生。尿路結石が見つかり、ついでに測ったCaが高い。小児の原発性副甲状腺機能亢進症は、こうやって見つかることが少なくありません。</div><p>小児の原発性副甲状腺機能亢進症は、10万人に2〜5人とまれです。症状が非特異的なので見過ごされやすく、<strong>尿路結石で初めて診断される</strong>ことがあります。高Ca血症を見たら、必ずPTHを測ります。</p>\n<h3>高Caの原因を、PTHで二つに分ける</h3>\n<ul><li><strong>PTHが高い（抑えられていない）</strong>：原発性副甲状腺機能亢進症、FHH</li>\n<li><strong>PTHが低い</strong>：ビタミンD過剰、ビタミンA中毒、サイアザイド、長期臥床・不動、悪性腫瘍（PTHrPによる高Ca）など。これらでは尿中Caが増える</li></ul>\n<p>悪性腫瘍に伴う高Caとの鑑別には、PTHと一緒に<strong>PTHrP</strong>も測ります。</p>\n<h3>小児では遺伝の背景を探す</h3>\n<p>原因は腺腫が約7割ですが、<strong>MEN1が約2割</strong>、MEN2、家族性と続き、成人より遺伝性の割合が高いのが小児の特徴です。責任遺伝子は、<strong>MEN1はMEN1、MEN2AはRET、副甲状腺機能亢進症・顎腫瘍症候群はCDC73</strong>。若い患者では家族歴とほかの腫瘍を必ず確認します。局在は超音波と<strong>99mTc-MIBIシンチ</strong>を組み合わせます。</p>\n<h3>手術してはいけない高Ca：FHH</h3>\n<p>CaSRの<strong>機能喪失</strong>で、Caの設定値が高い側にずれた状態です。生化学は原発性副甲状腺機能亢進症に似ていますが、<strong>手術しても治りません</strong>。見分けるポイントは<strong>尿中Caが少ない</strong>こと（1日100 mg未満、Ca排泄率1%未満）と家族歴です。原因遺伝子はCASR・GNA11・AP2S1。ただしビタミンD不足があると原発性でも排泄率が下がるので、迷えば遺伝子検査です。</p>\n<h3>急性期の治療は「入れて、出す」</h3>\n<p>重症度は12 mg/dL未満が軽度、12〜14が中等度、14以上が重度です。</p>\n<ul><li>まず<strong>生理食塩液で脱水を補正</strong>（高Caは多尿で脱水を作り、脱水がさらにCaを上げる）</li>\n<li>脱水を直してから<strong>ループ利尿薬</strong>。サイアザイドはCaを保持するので使わない</li>\n<li><strong>ビスホスホネート</strong>（パミドロン酸、ゾレドロン酸）。インフルエンザ様症状や低Caに注意</li>\n<li>ビタミンD過剰や肉芽腫性疾患による高Caにはステロイド。乳児にはビタミンD無添加・低Caのミルク</li></ul>\n<h3>手術のあとの落とし穴：hungry bone</h3>\n<p>腺腫を取ると、飢えていた骨が一気にCaを取り込み、血清Caが急速に下がります。<strong>数値がまだ正常範囲（たとえば9.3 mg/dL）でも、急に下がればしびれやテタニーが出ます</strong>。数字より症状を優先して補正し、術前からアルファカルシドールとCaで備えます。Mgも補います。</p>", "keys": ["高Ca血症を見たらPTHを測る。小児は尿路結石で見つかることも", "PTH高値なら原発性かFHH、低値ならビタミンD過剰など", "小児は遺伝性（MEN1・RET・CDC73）の割合が高い", "FHHは尿中Caが少なく、手術の対象外", "治療は生食→ループ利尿薬→ビスホスホネート", "術後のhungry boneは数値より症状で判断"], "upd": null, "quiz": [{"v": "", "q": "小児の原発性副甲状腺機能亢進症が診断される契機として少なくないのは。", "o": ["健診での高Ca血症の指摘が大部分を占める", "尿路結石をきたして初めて診断される", "病的骨折で整形外科を受診して診断される", "低Ca血症性のけいれんで搬送される"], "a": 1, "e": "症状が非特異的で見過ごされやすい。10万人に2〜5人とまれだが、高Ca血症を見たら必ずPTHを測る。", "r": "p.191"}, {"v": "", "q": "高カルシウム血症の患者でFHHを見分けることが重要な理由は。", "o": ["悪性腫瘍の合併が多く、腫瘍検索が必要だから", "副甲状腺摘出の対象にならないから", "急性期にビスホスホネートが禁忌になるから", "PTHが測定できないから"], "a": 1, "e": "原発性副甲状腺機能亢進症と生化学が似るが、手術しても治らない。家族歴と尿中Ca排泄の低さで疑う。", "r": "p.193 / p.207"}, {"v": "副甲状腺腺腫の摘出後、血清Caが急速に低下し、Ca 9.3 mg/dLの時点でしびれを訴えた。", "q": "この病態と対応として適切なのは。", "o": ["hungry bone syndrome。基準値内でも症状があればそれを優先してコントロールする", "hungry bone syndrome。基準値内なので", "術後の一過性副甲状腺機能低下症。Ca補充は基準値を下回ってから開始する", "低Mg血症によるPTH分泌抑制。Caではなく Mgのみを補う"], "a": 0, "e": "骨が一気にCaを取り込む。数値が正常範囲でも急な低下でテタニーが出るため、症状を優先する。術前からアルファカルシドールとCaを開始して備える。低Mg血症はPTH分泌を抑えるのでMgも補う。", "r": "症例1 p.189-191"}]}, {"id": "c8", "lv": 1, "t": "くる病とビタミンD欠乏", "min": 7, "cats": "ビタミンD関連くる病・骨・Ca代謝の基本", "src": "レクチャー4 p.219 ／ 症例 p.197-205 ／ 治療 p.1221, 1231-1232", "vol": "巻の四 カルシウム・骨", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>1歳半の子がO脚で受診。完全母乳で、卵と乳製品を除去中。お母さんも日焼けを避ける生活をしています。</div><p>くる病は「骨が弱い病気」と思われがちですが、本態はもっと具体的です。骨の土台（基質）は作られているのに、そこに<strong>CaとPが沈着しない</strong>。石灰化していない骨基質、つまり<strong>類骨が増えた状態</strong>がくる病です。成長板では石灰化が始まらないので、軟骨細胞がきれいに並べず、骨端が広がって毛羽立ちます。骨端線が閉じたあとに同じことが起これば、骨軟化症と呼びます。</p>\n<h3>診断の手引き（2014年）</h3>\n<p>大項目は<strong>X線のくる病変化</strong>と<strong>高ALP血症</strong>の2つです。X線では骨端の杯状化（cupping）、拡大（splaying, flaring）、毛羽立ち（fraying）を見ます。ALPは成長期にもともと高いので、<strong>1歳未満で1,200 IU/L以上、1歳以降で1,000 IU/L以上</strong>を目安にします。低リン・低Ca、臨床症状、25(OH)D低値は小項目です。骨系統疾患やBlount病を除いてから診断します。</p>\n<h3>欠乏の数字</h3>\n<p>25(OH)Dが<strong>20 ng/mL以下で欠乏</strong>、15以下ならより確実な欠乏です。ただし測定法が標準化されていないので、値は少し幅をもって読みます。日本の小児では、10万人あたり15人ほどと推定されています。</p>\n<h3>冒頭の子に重なっていること</h3>\n<p>巻物で取り上げた症例は、どれも<strong>完全母乳</strong>で、<strong>卵・乳の除去</strong>が重なっていました。そこに<strong>日光不足</strong>と<strong>母体のビタミンD不足</strong>が加わります。母乳のビタミンDは母の状態をそのまま映すので、母側の欠乏が背景にあることが多いのです。</p>\n<h3>検査で見えるもの</h3>\n<p>ビタミンDが足りないとCaが下がり、PTHが上がって腎でCaを回収するので、<strong>尿中Ca/Crは低く</strong>なります。これは二次性副甲状腺機能亢進症の簡単な目安になります。注意したいのは、<strong>低リン血症が重なっているとALPが上がりきらない</strong>ことです。ALPが思ったほど高くないからといって、軽症とは限りません。</p>\n<h3>治療</h3>\n<p>本来はネイティブビタミンD（乳児3,000〜6,000 IU/日、年長児6,000 IU/日、Caも500 mg/日）が生理的ですが、日本では処方できない事情があり、<strong>アルファカルシドール0.05〜0.1 μg/kg/日</strong>がよく使われます。3か月を目安に評価し、誘因が改善していれば少量や中止でも正常化していきます。</p>\n<p>早産児のミネラル不足（未熟児くる病）は、第3話で見たとおり、CaとPのバランスが鍵です。</p>\n<p>ビタミンDを補っても治らないくる病は、経路そのものが壊れているかもしれません。それは次の回で。</p>", "keys": ["くる病の本態は類骨の増加（石灰化しない）", "大項目はX線とALP（1歳未満1,200、以降1,000以上）", "25(OH)D 20以下で欠乏、15以下でより確実", "完全母乳・除去食・日光不足・母体の欠乏が重なる", "低リンが重なるとALPが上がりきらない"], "upd": "ビタミンD欠乏の治療で使える製剤は変わることがあります。サプリメントの扱いも含め、最新の情報で確認してください。", "quiz": [{"v": "", "q": "くる病の診断の手引き（2014年）の大項目に含まれるのは。", "o": ["低リン血症と低Ca血症の両方が揃うこと", "X線でのくる病変化と高ALP血症", "25(OH)D低値とPTH高値", "O脚と肋骨念珠の身体所見"], "a": 1, "e": "大項目は画像と高ALP。低リン/低Ca血症、臨床症状、25(OH)D低値は小項目。大項目2つと小項目2つでくる病と診断する。", "r": "表3 p.199-201"}, {"v": "", "q": "日本の小児でビタミンD欠乏性くる病の誘因として本書が挙げているのは。", "o": ["完全母乳栄養、日光曝露不足、食物アレルギーによる除去食、母体のビタミンD不足", "人工乳栄養、牛乳の過剰摂取、早期の離乳食開始、肉類の摂取不足、過度の日焼け止め使用", "過剰なカルシウム摂取による腸管でのリン吸収阻害", "高たんぱく食と運動過多による骨代謝の亢進"], "a": 0, "e": "5症例とも母が完全母乳で、卵・乳の除去が重なっていた。母体側の欠乏が背景にあることが多い点が繰り返し強調されている。", "r": "表4 p.201 / p.197-199"}, {"v": "ビタミンD欠乏性くる病の回復期の症例。ALPは高値だが、血清Caは低値のままである。", "q": "注意すべきなのは。", "o": ["低リン血症を合併していると血清ALPが上昇しないことがあり、重症度を見誤る", "ALP高値は骨の修復を示すので、回復が順調であることを意味し、治療は継続でよい", "血清Caが低ければ治療失敗で、活性型ビタミンDに切り替える", "ALPが正常化すれば、ビタミンDは中止してよい"], "a": 0, "e": "ALPは骨病変の指標として有用だが、低リン血症が併存すると上がりきらない。数値を単独で読まない。", "r": "小児内分泌学 p.506 / 治療 p.1231"}]}, {"id": "cC", "lv": 3, "t": "ビタミンDの経路そのものの病気", "min": 5, "cats": "ビタミンD関連くる病", "src": "症例5・6 p.203-205 ／ 小児内分泌学 p.512-513 ／ 治療 p.1237", "vol": "巻の四 カルシウム・骨", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>まだ一人で歩けない1歳半の子。くる病の変化と低Caがあり、ビタミンDを補っても良くなりません。よく見ると、頭の毛と眉毛がとても少ないのです。</div><p>前の回では、ビタミンDが<strong>足りない</strong>くる病を見ました。今日は、ビタミンDは足りているのに、<strong>使う経路そのものが壊れている</strong>くる病です。「ビタミンD依存症」と呼ばれ、補充してもなかなか治らないのが特徴です。</p>\n<h3>経路をもう一度</h3>\n<p>第1話の地図です。ビタミンDは肝臓で25位、腎臓で1α位が水酸化されて、活性型の1,25(OH)₂Dになり、<strong>ビタミンD受容体（VDR）</strong>に結合して働きます。どこが壊れたかで、検査の顔つきが変わります。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>病型</th><th>壊れた場所</th><th>25(OH)D</th><th>1,25(OH)₂D</th></tr>\n<tr><td>欠乏性</td><td>材料不足</td><td>低い</td><td>高いことも</td></tr>\n<tr><td>依存症1A型</td><td>1α水酸化（CYP27B1）</td><td>正常</td><td>低い</td></tr>\n<tr><td>依存症2型</td><td>受容体（VDR）</td><td>正常</td><td>高い</td></tr></table></div>\n<h3>依存症1A型：最後の一歩が進まない</h3>\n<p>腎の1α水酸化酵素（<strong>CYP27B1</strong>）の異常です。<strong>25(OH)Dは正常なのに、1,25(OH)₂Dが低い</strong>。材料はあるのに、最後の一歩が進まない状態です。カナダ・ケベック州のフランス系の人たちでは2,400出生に1人と多く（創始者効果）、日本での報告は少数です。</p>\n<p>治療は、最後の一歩を飛ばして、はじめから<strong>活性型のビタミンD</strong>を入れること。必要なのは<strong>生理的な量</strong>（1α(OH)D₃ 0.01〜0.03 μg/kg/日）で、よく効きます。</p>\n<h3>依存症2型（VDR異常症）：受け手が応えない</h3>\n<p>冒頭の子です。受容体が壊れているので、1,25(OH)₂Dは<strong>高い</strong>のに働きません。そして、<strong>脱毛</strong>が特徴です。ほかのくる病では脱毛は見られません。毛の生え変わりにVDRそのものが関わっているからです。</p>\n<p>VDRの<strong>DNA結合ドメイン</strong>に変異がある子は、ほぼ全員が脱毛を伴い、重症です。リガンド結合ドメインの変異では脱毛がないこともあります。治療には<strong>大量のビタミンD</strong>が要り、ネイティブビタミンDで1日5万単位という量になることもあります。大人になると良くなることがあります。</p>\n<h3>見分けのコツ</h3>\n<p>ビタミンDを補っても治らないくる病を見たら、<strong>25(OH)Dと1,25(OH)₂Dを両方</strong>測ります。1,25(OH)₂Dが低ければ1A型、高ければ受容体の問題、低リンなのにどちらも上がらなければFGF23の問題（次の回）。三つの病気が、二つの数字で分かれます。</p>", "keys": ["依存症は「足りない」ではなく「使えない」くる病", "1A型（CYP27B1）：25(OH)D正常・1,25(OH)₂D低値。生理量の活性型で治る", "2型（VDR）：1,25(OH)₂D高値で働かない。脱毛が特徴", "DNA結合ドメインの変異はほぼ全例脱毛・重症", "治らないくる病は25(OH)Dと1,25(OH)₂Dを両方測る"], "upd": null, "quiz": [{"v": "", "q": "ビタミンD依存性くる病1A型（1α水酸化酵素欠損、CYP27B1）の検査所見は。", "o": ["25(OH)D低値・1,25(OH)2D低値", "25(OH)D正常・1,25(OH)2D低値", "25(OH)D正常・1,25(OH)2D高値", "両者とも高値"], "a": 1, "e": "材料はあるが最終段階に進めない。生理的補充量の活性型ビタミンDで治療できる。", "r": "症例5 p.203 / 文献2"}, {"v": "独歩できない乳幼児。くる病様変化と低Ca血症。頭髪と眉毛がきわめて少なく、脱毛が目立つ。", "q": "最も考えられるのは。", "o": ["ビタミンD欠乏性くる病（脱毛は栄養不良による）", "ビタミンD受容体（VDR）異常症", "1α水酸化酵素欠損症（ビタミンD依存症1型）", "低リン血症性くる病（XLH）"], "a": 1, "e": "脱毛はVDR異常症に特徴的で、他のくる病では見ない。治療には大量のビタミンDを要し、ネイティブビタミンDで5万単位/日という量になる。成人になり改善することがある。", "r": "症例6 p.203-205"}, {"v": "", "q": "ビタミンD依存症2型（VDR異常）で脱毛を伴う症例の特徴は。", "o": ["DNA結合ドメインに変異を有する症例はほぼ全例が脱毛を伴い重症である", "リガンド結合ドメインの変異で、高用量ビタミンDによく反応する", "脱毛は軽症のサインで、治療で改善する", "DNA結合ドメインの変異では脱毛を伴わず軽症である"], "a": 0, "e": "リガンド結合ドメインの変異では脱毛を伴わないこともある。VDRが検出されない症例をVDDR2Bと分類するが、その病因はまだ不明。", "r": "小児内分泌学 p.513 / 治療 p.1237"}]}, {"id": "c9", "lv": 3, "t": "低リン血症性くる病とFGF23", "min": 7, "cats": "低リン血症性くる病", "src": "症例1 p.205-213 ／ 小児内分泌学 p.508-510 ／ 治療 p.1233-1234", "vol": "巻の四 カルシウム・骨", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>O脚と低身長の幼児。Caは正常、Pは低く、ALPは高い。1,25(OH)₂Dは37〜40 pg/mLで正常範囲。尿中Ca/Crは0.0。</div><p>この症例で引っかかってほしいのは、<strong>「正常範囲」の1,25(OH)₂D</strong>です。リンが下がっていれば、本来は腎の1α水酸化が進んで1,25(OH)₂Dは<strong>高く</strong>なるはずです。ビタミンD欠乏性くる病では実際にそうなります。低リンなのに活性型ビタミンDが上がってこない。これが、<strong>FGF23が過剰に働いている</strong>サインです。</p>\n<h3>c1の伏線を回収する</h3>\n<p>最初の回で、FGF23は「リンを捨てさせ、しかもビタミンDを作らせない」と書きました。FGF23が多すぎると、腎はリンを捨て続け、低リンなのに1α水酸化は抑えられたまま。冒頭の検査値は、この二重の作用でぴったり説明できます。</p>\n<h3>XLH（X連鎖性低リン血症性くる病）</h3>\n<p>いちばん多いのがXLHで、<strong>PHEX</strong>の異常によりFGF23が分解されずに高くなります。X連鎖優性なので女性も発症しますが、<strong>女性は軽い傾向</strong>があり、診断されていない人がいるかもしれません。家族歴を聞くときは、軽い女性の存在を意識します。</p>\n<h3>同じ「FGF23過剰」に集まる病気</h3>\n<ul><li><strong>ADHR</strong>：FGF23の切断部位（176・179番のアルギニン、RXXR配列）の変異で、分解を免れる。<strong>鉄欠乏や妊娠</strong>がきっかけで発症することがある</li>\n<li><strong>腫瘍性骨軟化症（TIO）</strong>：腫瘍がFGF23を作る</li>\n<li><strong>GACI</strong>（乳児全身性動脈石灰化症、ENPP1）：動脈石灰化で始まった子が、のちに低リン血症性くる病になる</li></ul>\n<h3>見分けるための検査</h3>\n<p>腎でのリン喪失は<strong>TmP/GFR</strong>で評価します（%TRPより有用）。低リン血症を見たら<strong>intact FGF23</strong>を測ります。ビタミンD欠乏性では20 pg/mL未満と低く、FGF23関連かどうかがここで分かれます。</p>\n<h3>逆向きの病気：HHRH</h3>\n<p>リンを捨てるのは同じでも、原因がリン輸送体（NaPi-IIc）そのものなら、FGF23は<strong>むしろ低く</strong>なります。すると1α水酸化が抑えられず1,25(OH)₂Dが上がり、<strong>高カルシウム尿症</strong>になります。だから<strong>活性型ビタミンDを足してはいけません</strong>。XLHと治療の向
