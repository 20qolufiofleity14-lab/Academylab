らです。さらに、箱の上に個々の点を重ねて描けば、人数も見えます。</p>\n<p>先輩の図は、治療群と比較群の並列箱ひげ図に、31個と26個の点を重ねたものになりました。治療群の箱は上にずれ、外れた2人は箱の上の点として正直に表示されています。「隠さずに見せると、かえって説得力が出るね」。</p>", "keys": ["中央値：順に並べた真ん中。偶数なら中央2つの平均", "Q1（25%）・Q3（75%）の間が中央50%。IQR＝Q3−Q1はばらつきの指標", "箱ひげ図：箱＝Q1〜Q3、太線＝中央値、ひげは1.5×IQRまで、外は点（外れ値候補）", "外れ値は捨てずに調べる。歪み・入力ミス・洞察の手がかり", "群の比較は平均の棒グラフより並列箱ひげ図＋個々の点"], "upd": null, "quiz": [{"v": "", "q": "箱ひげ図の「箱」の長さが表すものは。", "o": ["最大値と最小値の差", "四分位範囲 IQR（Q3−Q1）", "標準偏差", "平均±1SD"], "a": 1, "e": "箱はQ1からQ3、中央50%のデータの範囲。その長さがIQR。", "r": "OpenIntro 2章"}, {"v": "", "q": "箱ひげ図の「ひげ」はどこまで伸びるか。", "o": ["必ず最大値・最小値まで", "箱の端から1.5×IQR以内にある最も遠いデータまで", "平均±2SDまで", "中央値±IQRまで"], "a": 1, "e": "1.5×IQRより先には伸ばさない。その外側の点は外れ値候補として個別に描く。", "r": "OpenIntro 2章"}, {"v": "", "q": "外れ値を調べる価値として教科書が挙げていないのは。", "o": ["分布の強い歪みを識別する", "データ入力エラーを識別する", "データの興味深い性質への洞察", "解析から除外して平均を安定させる"], "a": 3, "e": "教科書は外れ値を「調べる」価値を挙げており、機械的に除外することは勧めていない。", "r": "OpenIntro 2章"}], "course": "stat"}, {"id": "s13", "lv": 2, "t": "頑健な統計量と、データ変換", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §2.1.6–2.1.8", "vol": "統計 第2章 データの要約", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>IGF-1の値を使った研究で、先輩が困っています。「平均を出したら、1人だけ測定値が異常に高くて、全体の平均が引っ張られる。この子を外していい？」</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>極端な値が1つあると平均とSDは大きく動くが、<strong>中央値は動かない</strong>。歪んだデータは中央値［IQR］で報告する。</div><p>外れ値が1つあるとき、要約統計量はどう動くか。教科書は、ローン金利の最大値 26.3% を、15% に変えた場合と 35% に変えた場合で、4つの統計量を比べます。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>シナリオ</th><th>中央値</th><th>IQR</th><th>平均</th><th>SD</th></tr>\n<tr><td>元データ</td><td>9.93</td><td>5.76</td><td>11.57</td><td>5.05</td></tr>\n<tr><td>26.3→15</td><td>9.93</td><td>5.76</td><td>11.34</td><td>4.61</td></tr>\n<tr><td>26.3→35</td><td>9.93</td><td>5.76</td><td>11.74</td><td>5.68</td></tr></table></div>\n<h3>頑健な統計量</h3>\n<p><strong>中央値とIQRは、1点をどう動かしても変わりません</strong>。Q1・中央値・Q3の近くの値にしか反応しないからです。こういう統計量を<strong>頑健</strong>（robust）と呼びます。</p>\n<p>一方、<strong>平均とSDは動きます</strong>。極端な値に引っ張られる。これは欠点のようで、<strong>状況によっては大事な情報</strong>でもあります。</p>\n<h3>どちらを使うか</h3>\n<p>教科書の確認問題。右に歪んだローン金額で、「典型的なローンの大きさ」を知りたいなら？ 答えは中央値。でも「1,000件の総額」を知りたいなら、平均×件数のほうが役立つ。<strong>目的で選ぶ</strong>のです。</p>\n<p>論文では、分布が対称なら「平均±SD」、歪んでいたり外れ値があるなら「中央値［IQR］」または「中央値（Q1–Q3）」と書く習慣があります。IGF-1、CRP、入院日数は中央値で書かれることが多い。「平均が引っ張られるから外す」のではなく、「<strong>引っ張られない統計量に替える</strong>」のが先です。</p>\n<h3>データ変換</h3>\n<p>強く歪んだデータは、<strong>変換</strong>して扱いやすくすることがあります。教科書の例は郡の人口。ほとんどの郡が小さく、少数の大都市だけが巨大で、ヒストグラムは左端に押しつぶされます。これを <strong>log₁₀</strong> に変換すると、対称に近づき、外れ値も極端でなくなります。</p>\n<p>変換は散布図にも効きます。人口 vs 人口変化は、変換前は何も見えませんが、人口を対数にすると正の関連が浮かび上がります。</p>\n<p>ほかに平方根変換、逆数変換。目的は三つ。歪みを減らす、統計モデルを当てはめやすくする、非線形の関係を線形に近づける。医学なら、IGF-1、ホルモン濃度、ウイルス量などは<strong>対数で扱うのが標準</strong>です。</p>\n<h3>強度地図</h3>\n<p>地域ごとのデータは、色の濃淡で地図に描く<strong>強度地図</strong>が役立ちます。貧困率と失業率の地図は似た濃淡を示し、関連を示唆します。正確な値は読めませんが、地域の傾向と、次の仮説が見えてきます。</p>\n<p>先輩には、こう答えました。「外す前に、三つ。まず入力ミスか確かめる。次にIGF-1を対数にしてヒストグラムを見る。それでも極端なら、平均ではなく中央値［IQR］で書く。外すのは、医学的に理由があるときだけ」。確かめると、その子は測定日が治療開始前の値を誤って入力したもので、入力ミスでした。</p>", "keys": ["中央値とIQRは頑健：1点の極端な値で動かない。平均とSDは動く", "典型値なら中央値、総量なら平均。目的で選ぶ", "歪みや外れ値があれば「中央値［IQR］」で報告", "強く歪んだデータは対数変換。ホルモン濃度は対数が標準", "外す前に：入力ミス確認→変換→頑健な統計量。除外は医学的理由があるときだけ"], "upd": null, "quiz": [{"v": "", "q": "最大値を26.3%から35%に変えたとき、変化しない統計量の組み合わせは。", "o": ["平均と標準偏差", "中央値とIQR", "平均と中央値", "標準偏差とIQR"], "a": 1, "e": "中央値とIQRは Q1・中央値・Q3 付近の値にしか反応しないので頑健。平均とSDは極端な値に引っ張られる。", "r": "OpenIntro 2章"}, {"v": "", "q": "右に強く歪んだ郡人口のヒストグラムを見やすくするために教科書が用いた変換は。", "o": ["二乗", "log₁₀（対数）", "標準化", "中央値で割る"], "a": 1, "e": "対数変換で分布が対称に近づき、外れ値も極端でなくなる。散布図の非線形関係も線形に近づく。", "r": "OpenIntro 2章"}, {"v": "", "q": "右に歪んだ「典型的なローン金額」を知りたいとき、適切な要約は。", "o": ["平均", "中央値", "最大値", "標準偏差"], "a": 1, "e": "典型値には頑健な中央値。総額を知りたいなら平均が役立つ。目的で選ぶ。", "r": "OpenIntro 2章"}], "course": "stat"}, {"id": "s14", "lv": 2, "t": "分割表と行比・列比", "min": 6, "cats": "", "src": "OpenIntro Statistics 4e §2.2.1–2.2.2", "vol": "統計 第2章 データの要約", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「ビタミンD低値の子でインスリン抵抗性あり（HOMA-IR≥2.5）は何%？」と聞かれて、先輩がExcelで数えています。「低値群で18/40、正常群で9/45……これ、どっちを分母にするんやったっけ」</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>カテゴリー同士の関係は<strong>分割表</strong>で見る。割合は「何を分母にするか」で意味が変わる。</div><p>ここからは<strong>カテゴリカル変数</strong>の要約です。数値変数と違って、平均やSDはありません。代わりに<strong>件数と割合</strong>、そして2変数の関係なら<strong>分割表</strong>です。</p>\n<h3>分割表</h3>\n<p>教科書は1万件のローンで、「住居（借家／抵当付き持ち家／持ち家）」と「申込（単独／共同）」をまとめます。2つのカテゴリカル変数の組み合わせごとに件数を数えた表が<strong>分割表</strong>（contingency table）です。行の合計、列の合計、総計も入れます。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>借家</th><th>抵当</th><th>持ち家</th><th>計</th></tr>\n<tr><td>単独</td><td>3496</td><td>3839</td><td>1170</td><td>8505</td></tr>\n<tr><td>共同</td><td>362</td><td>950</td><td>183</td><td>1495</td></tr>\n<tr><td>計</td><td>3858</td><td>4789</td><td>1353</td><td>10000</td></tr></table></div>\n<p>1変数だけなら、件数の表と<strong>棒グラフ</strong>です。件数で描いても、割合で描いても、形は同じです。</p>\n<h3>行比と列比</h3>\n<p>ここが要点です。同じ表から、二種類の割合が作れます。</p>\n<ul>\n<li><strong>行比</strong>：各セルを<strong>行の合計</strong>で割る。3496/8505＝0.411 は「単独申込のうち借家の割合」。</li>\n<li><strong>列比</strong>：各セルを<strong>列の合計</strong>で割る。3496/3858＝0.906 は「借家のうち単独申込の割合」。</li>\n</ul>\n<p>「0.411」と「0.906」は、同じセルから出た別の数字です。<strong>分母が違うと、意味が違う</strong>。</p>\n<h3>どちらを使うか：説明変数を「条件」にする</h3>\n<p>教科書のスパムメールの例。メール形式（テキスト／HTML）とスパムかどうかの表で、知りたいのは「<strong>形式ごとに</strong>スパムの割合はどう違うか」。形式が説明変数なので、<strong>形式を分母</strong>にする。テキスト形式のスパム率 209/1195＝17.5%、HTMLは 158/2726＝5.8%。</p>\n<div class=\"formula\">説明変数の各水準を分母にして、目的変数の割合を出す</div>\n<p>説明変数と目的変数がはっきりしない組み合わせ（住居と申込タイプ）では、どちらが役立つか明確な答えはありません。でも、仮説的な説明変数があるなら、<strong>それを条件として</strong>割合を計算するのが自然です。</p>\n<p>先輩の表に戻ります。ビタミンD（低値／正常）が説明変数、インスリン抵抗性（あり／なし）が目的変数。だから<strong>ビタミンDの群を分母</strong>にします。低値群 18/40＝45%、正常群 9/45＝20%。「低値群では45%、正常群では20%にインスリン抵抗性を認めた」。逆に「インスリン抵抗性ありのうちビタミンD低値は 18/27＝67%」も計算できますが、それは別の問いへの答えです。</p>\n<p>論文の表を読むときも同じです。<strong>%の分母がどこか</strong>を最初に確かめる。それだけで、読み違えの半分は防げます。</p>", "keys": ["分割表：2つのカテゴリカル変数の組み合わせごとの件数。行計・列計・総計", "行比は行の合計で割る、列比は列の合計で割る。同じセルでも意味が違う", "説明変数の各水準を分母にして、目的変数の割合を出す", "1変数なら件数の表と棒グラフ", "論文の%は、まず分母を確かめる"], "upd": null, "quiz": [{"v": "", "q": "分割表で「単独申込のうち借家の割合」を求めるとき、分母は。", "o": ["総計（10000）", "単独申込の行合計（8505）", "借家の列合計（3858）", "借家×単独のセル（3496）"], "a": 1, "e": "「〜のうち」の「〜」が分母。単独申込のうち→行比。", "r": "OpenIntro 2章"}, {"v": "", "q": "メール形式がスパムを説明すると考えるとき、適切な割合の出し方は。", "o": ["スパムのうちHTML形式の割合", "形式ごとにスパムの割合（列比：形式を分母）", "総メール中のHTMLスパムの割合", "行計と列計の比"], "a": 1, "e": "説明変数（形式）の各水準を条件（分母）にして、目的変数（スパム）の割合を見る。", "r": "OpenIntro 2章"}, {"v": "", "q": "ビタミンD低値40人中18人、正常45人中9人にインスリン抵抗性。ビタミンDを説明変数として報告すべき数字は。", "o": ["18/27＝67%", "18/40＝45% と 9/45＝20%", "27/85＝32%", "40/85＝47%"], "a": 1, "e": "説明変数（ビタミンD群）を分母にした割合を群ごとに示す。18/27は「抵抗性ありのうち低値」という別の問い。", "r": "OpenIntro 2章"}], "course": "stat"}, {"id": "s15", "lv": 2, "t": "図で比べる：積み重ね棒・モザイク・並列箱ひげ", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §2.2.3–2.2.6", "vol": "統計 第2章 データの要約", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>学会のスライドに、先輩が円グラフを3つ並べました。「治療群・比較群・全体で、Tanner分類の内訳を見せたい」。隣で見ていた上司が一言。「円は、比べられんよ」</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>群を比べる図は<strong>棒グラフ</strong>（積み重ね・並列）や<strong>並列箱ひげ図</strong>。円グラフは比較に向かない。</div><p>カテゴリカル変数の関係と、群ごとの数値の分布を<strong>図で比べる</strong>方法です。教科書が勧める図と、勧めない図がはっきりしています。</p>\n<h3>2つのカテゴリカル変数：棒グラフの三つの形</h3>\n<ul>\n<li><strong>積み重ね棒グラフ</strong>：住居ごとの棒を、申込タイプで色分けして積む。件数が見える。</li>\n<li><strong>並列棒グラフ</strong>：積まずに横に並べる。各組み合わせの件数を比べやすい。</li>\n<li><strong>標準化した積み重ね棒グラフ</strong>：各棒の高さを1にそろえ、割合で積む。<strong>列比を図にしたもの</strong>。住居ごとに共同申込の割合がどう違うかが一目で分かる。</li>\n</ul>\n<p>前の回の「説明変数を分母に」は、図にすると標準化積み重ね棒グラフになります。</p>\n<h3>モザイクプロット</h3>\n<p>標準化積み重ね棒グラフの、<strong>棒の幅を各群の件数に比例させた</strong>ものです。まず説明変数で縦に分け（幅＝件数）、次に各列を目的変数で横に分ける。列ごとの水平線の高さが違えば、2変数が関連しているサインです。割合と件数の両方を一枚で見せられます。</p>\n<h3>本書で唯一の円グラフ</h3>\n<p>教科書は円グラフを一枚だけ載せて、こう言います。全体の概観には向くが、<strong>細部の比較は難しい</strong>。「借家より抵当付きが多い」ことを、円グラフでは一瞬考えてしまうが、棒グラフなら即座に分かる。<strong>群を比べるなら棒グラフ</strong>。これが、上司の「円は比べられん」の中身です。</p>\n<h3>群ごとの数値変数：並列箱ひげ図と中抜きヒストグラム</h3>\n<p>人口が増えた郡と増えなかった郡で、世帯所得の中央値を比べます。方法は二つ。</p>\n<ul>\n<li><strong>並列箱ひげ図</strong>：群ごとの箱ひげ図を同じ軸に並べる。<strong>中心とばらつきの比較</strong>に強い。</li>\n<li><strong>中抜きヒストグラム</strong>（hollow histogram）：群ごとのヒストグラムの輪郭だけを重ねる。<strong>形・歪み・峰</strong>の比較に強い。</li>\n</ul>\n<p>教科書の答え合わせ：増えた郡の中央値は約45,000ドル、増えなかった郡は約40,000ドルで少し高い。ばらつきは増えた郡のほうがやや大きい（IQRで約50%大きい）。両群とも単峰でわずかに左に歪む。これを、図を見て言葉にできれば十分です。そして教科書は忘れずに添えます。<strong>観察データなので、因果の解釈は慎重に</strong>。</p>\n<h3>図の選び方の表</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>見たいもの</th><th>図</th></tr>\n<tr><td>1つの数値変数の分布</td><td>ドットプロット／ヒストグラム／箱ひげ図</td></tr>\n<tr><td>2つの数値変数の関係</td><td>散布図</td></tr>\n<tr><td>1つのカテゴリカル変数</td><td>棒グラフ</td></tr>\n<tr><td>2つのカテゴリカル変数</td><td>標準化積み重ね棒／モザイク</td></tr>\n<tr><td>群ごとの数値変数</td><td>並列箱ひげ図／中抜きヒストグラム</td></tr></table></div>\n<p>先輩のスライドは、治療群と比較群の2本の標準化積み重ね棒グラフになりました。Tanner分類の割合が、横に並んで一目で比べられます。「全体」の棒は要らない、と上司。比べたいのは群と群だからです。</p>", "keys": ["標準化積み重ね棒グラフ＝列比の図。説明変数ごとに目的変数の割合を比べる", "モザイクプロットは幅が件数、高さが割合", "円グラフは比較に向かない。群を比べるなら棒グラフ", "群ごとの数値変数は並列箱ひげ図（中心・ばらつき）と中抜きヒストグラム（形）", "観察データの群間比較は因果の解釈を慎重に"], "upd": null, "quiz": [{"v": "", "q": "教科書が円グラフについて述べたことは。", "o": ["最も正確な図である", "群の比較には棒グラフのほうが良い", "カテゴリカル変数には使えない", "3群以上の比較に向く"], "a": 1, "e": "円グラフは全体の概観には向くが、細部の比較は難しい。群を比べるなら棒グラフ。", "r": "OpenIntro 2章"}, {"v": "", "q": "モザイクプロットで、各列の幅が表すものは。", "o": ["目的変数の割合", "説明変数の各水準の件数", "標準偏差", "中央値"], "a": 1, "e": "幅＝各群の件数に比例、縦の分割＝目的変数の割合。割合と件数を一枚で示す。", "r": "OpenIntro 2章"}, {"v": "", "q": "2群の数値変数について「分布の形や歪み」を比べるのに向く図は。", "o": ["並列箱ひげ図", "中抜きヒストグラム", "円グラフ", "分割表"], "a": 1, "e": "並列箱ひげ図は中心とばらつき、中抜きヒストグラムは形・歪み・峰の比較に向く。", "r": "OpenIntro 2章"}], "course": "stat"}, {"id": "s16", "lv": 3, "t": "シミュレーションで「偶然」を測る：マラリアワクチン", "min": 7, "cats": "", "src": "OpenIntro Statistics 4e §2.3", "vol": "統計 第2章 データの要約", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>第1章第1話の問いが戻ってきます。「58% vs 46%の差は本物か」。先輩が言います。「人数は31人と26人。これ、偶然でも出る差なん？」。第2章の最後に、この問いに初めて手を動かして答えます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>「効果がない世界」で<strong>何度もくじを引き直し</strong>、観察された差がどれくらい珍しいかを数える。これがp値の原型。</div><p>教科書の第2章は、<strong>マラリアワクチンの事例</strong>で締めくくられます。ここで初めて、「偶然かどうか」を数字で評価する考え方が登場します。第5章の仮説検定の、いちばん素朴な形です。</p>\n<h3>データ</h3>\n<p>20人のボランティアをランダムに分け、14人にワクチン、6人にプラセボ。19週後、全員をマラリアに曝露します。結果、ワクチン群は14人中5人が感染（9人は非感染）、プラセボ群は<strong>6人全員</strong>が感染しました。</p>\n<div class=\"formula\">感染率：ワクチン群 5/14 ＝ 35.7%　／　プラセボ群 6/6 ＝ 100%　→ 差 64.3%</div>\n<p>これはランダム化実験なので、第1章の原則に照らせば因果を語れます。でも標本はたった20人。<strong>この差は、ワクチンが効かなくても偶然に出うる大きさではないか</strong>。</p>\n<h3>二つの仮説</h3>\n<ul>\n<li><strong>H₀ 独立モデル</strong>：ワクチンと感染は独立。感染率の差64.3%は偶然による。</li>\n<li><strong>H_A 対立モデル</strong>：ワクチンは感染に影響する。差は偶然ではない。</li>\n</ul>\n<p>H₀が正しいとすると、どう割り付けようと「11人は感染し、9人は感染しない」運命でした。差が出たのは、<strong>ランダムな割り付けのせいだけ</strong>、ということになります。</p>\n<h3>シミュレーション：カードを配り直す</h3>\n<p>では、H₀の世界で割り付けをやり直したら、どのくらいの差が出るのか。教科書の方法は、20枚のカードです。11枚に「感染」、9枚に「非感染」と書く。よく切って、14枚をワクチン側、6枚をプラセボ側に配る。差を計算する。これを<strong>何度も繰り返す</strong>。</p>\n<p>1回目：ワクチン側7人感染、プラセボ側4人感染。差は 4/6 − 7/14 ＝ 16.7%。観察された64.3%よりずっと小さい。計算機で100回繰り返すと、差は<strong>0の周りにばらつき</strong>ます。そして、<strong>64.3%以上の差が出たのは100回中2回</strong>だけでした。</p>\n<h3>二つの解釈</h3>\n<ul>\n<li>H₀が正しく、<strong>100回に2回の珍しいこと</strong>がたまたま起きた。</li>\n<li>H_Aが正しく、ワクチンが効いているから大きな差が出た。</li>\n</ul>\n<p>統計では、「珍しいことがたまたま起きた」という考えを<strong>棄却</strong>するのが通例です。だから、独立モデルを棄却し、「ワクチンがマラリアを防ぐ強い証拠がある」と結論します。この「100回に2回」が、第5章で<strong>p値</strong>と呼ばれるものの原型です。</p>\n<h3>間違える可能性は残る</h3>\n<p>珍しいことは、実際に起きます。だから、この方法で<strong>誤ったモデルを選ぶ可能性はゼロにならない</strong>。統計的推測は、誤る確率を制御し、評価する仕組みです。教科書は脚注で、宝くじの例を出します。どの番号が出ても「驚くほど珍しい」。だから、<strong>あとから見つけた珍しさ</strong>を証拠にしてはいけない。問いを先に立て、その問いについて珍しさを測るのです。</p>\n<h3>先輩の問いに答える</h3>\n<p>31人と26人で、「+0.5以上伸びた」が18人と12人。合計30人が「伸びた」、27人が「伸びなかった」。この57枚のカードを切って、31枚と26枚に配り直すと、58% vs 46% ほどの差は<strong>どのくらいの頻度で出るか</strong>。計算機で1万回やると、12%以上の差は<strong>およそ4回に1回</strong>出ました。珍しくありません。</p>\n<p>「つまり、この人数だと、偶然でも十分出る差やってこと？」「そう。効いていないとは言えないけど、効いているとも言えない。もっと人数が要る。それを計算するのが、第5章以降」。第3章と第4章では、その準備として<strong>確率</strong>を学びます。</p>", "keys": ["H₀独立モデル（差は偶然）とH_A対立モデル（差は本物）", "H₀の世界でランダム割り付けを何度もやり直し、観察された差がどのくらい珍しいか測る", "珍しければ（例：100回に2回）H₀を棄却する。これがp値の原型", "誤る可能性は残る。統計はその確率を制御・評価する", "問いを先に立てる。あとから見つけた珍しさは証拠にならない"], "upd": null, "quiz": [{"v": "", "q": "マラリアワクチン研究のシミュレーションで、「独立モデルが正しい」と仮定するとはどういう意味か。", "o": ["ワクチンは必ず効く", "ワクチンは感染に影響せず、差はランダム割り付けの偶然だけで生じる", "プラセボ群は必ず感染する", "標本が20人以上必要"], "a": 1, "e": "H₀のもとでは、誰がどの群でも感染者11人・非感染9人は変わらず、差は割り付けの偶然だけで生じる。", "r": "OpenIntro 2章"}, {"v": "", "q": "100回のシミュレーションで観察値以上の差が2回出たとき、教科書の結論は。", "o": ["差は偶然なので効果なし", "珍しいので独立モデルを棄却し、ワクチンが効く強い証拠とする", "もう100回やり直す", "結論は出せない"], "a": 1, "e": "統計では「珍しいことがたまたま起きた」という考えを棄却するのが通例。ただし誤る可能性は残る。", "r": "OpenIntro 2章"}, {"v": "", "q": "教科書の宝くじの脚注が示す教訓は。", "o": ["珍しい事象は証拠として強い", "あとから見つけた珍しさを証拠にしてはいけない。問いを先に立てる", "宝くじは統計で予測できる", "珍しい事象は起きない"], "a": 1, "e": "どの番号も「驚くほど珍しい」。問いを先に立て、その問いについて珍しさを測ることが大事。", "r": "OpenIntro 2章"}], "course": "stat"}];
const ST3 = [{"id": "s17", "lv": 1, "t": "確率とは何か：大数の法則", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §3.1.1–3.1.2", "vol": "統計 第3章 確率", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩が前の章の最後で言いました。「偶然でも4回に1回出る差、か。でも『4回に1回』って、何を数えとるん？」。第3章は、この「数える」の正体から始めます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>確率は「<strong>無限に繰り返したときの割合</strong>」。回数を増やすほど、観察される割合は本当の確率に近づく。</div><p>第2章の終わりで、カードを配り直して「偶然の差」を数えました。あの数え方の土台が確率です。教科書は、確率論そのものは応用統計の理解に必須ではない、と前置きしつつ、後の章を深く理解するために一章を割いています。式は少なめにして、<strong>考え方</strong>だけ押さえます。</p>\n<h3>サイコロから</h3>\n<p>公平なサイコロで1が出るチャンスは 1/6。1か2が出るチャンスは 2/6＝1/3。どれかの目が出るチャンスは 100%。2でないチャンスは 1−1/6＝5/6。二つのサイコロが両方1になるチャンスは (1/6)×(1/6)＝1/36。ここに、この章で出てくる規則のほとんどが入っています。</p>\n<h3>ランダム過程と確率の定義</h3>\n<p>サイコロ投げやコイン投げのように、<strong>事前には結果が分からない</strong>仕組みを<strong>ランダム過程</strong>と呼びます。そして、</p>\n<div class=\"formula\">事象の確率 ＝ そのランダム過程を無限に繰り返したとき、その事象が起きる割合</div>\n<p>確率は 0 から 1（0%から100%）の値です。</p>\n<h3>大数の法則</h3>\n<p>サイコロを n 回振って1が出た割合を p̂ₙ と書きます。最初の10回では 0.3 だったり 0.0 だったりしますが、<strong>回数を増やすと 1/6≈0.167 に近づいて安定します</strong>。これが<strong>大数の法則</strong>です。途中でふらつくのは当然で、ふらつきは回数とともに小さくなります。</p>\n<p>これが、第2章のシミュレーションで「1万回やった」理由です。100回では「およそ4回に1回」の推定がまだ揺れている。1万回なら安定する。</p>\n<h3>医学に引きつけて</h3>\n<p>教科書の確認問題は、「サイコロ以外のランダム過程を挙げよ」と聞きます。模範解答の一つが「<strong>ある人が来月病気になるか</strong>」。結果は〈病気／健康〉。本当に偶然かどうかは別として、<strong>ランダム過程としてモデル化すると有益</strong>だ、と教科書は言います。</p>\n<p>「GH治療で身長SDSが +0.5 以上伸びるか」も同じです。一人ひとりについては、伸びるか伸びないかのどちらか。でも「SGA性低身長の子にGHを使ったとき、伸びる割合」は確率として考えられる。<strong>有病率、治療反応率、副作用の発生率</strong>は、どれも「無限に繰り返したときの割合」として読めます。</p>\n<p>先輩への答え。「『4回に1回』は、カードを無限回配り直したときに、12%以上の差が出る割合。1万回で近似した」。「じゃあ、1万回で足りとる？」「大数の法則で、だいたい安定する回数。それでも揺れは残るから、論文では<strong>正確な計算</strong>に置き換える。それが第5章以降」。</p>", "keys": ["ランダム過程：事前に結果が分からない仕組み。確率はそれを無限に繰り返したときの割合", "確率は0〜1。全事象の和は1", "大数の法則：回数を増やすと観察された割合は確率に近づく", "有病率・治療反応率・副作用率は確率としてモデル化できる", "シミュレーションを多数回やるのは大数の法則で安定させるため"], "upd": null, "quiz": [{"v": "", "q": "教科書における「事象の確率」の定義は。", "o": ["その事象が1回の試行で起きる回数", "ランダム過程を無限に繰り返したときにその事象が起きる割合", "その事象が起きたときの重要度", "事象の数の逆数"], "a": 1, "e": "確率＝無限回繰り返したときの割合。0〜1の値を取る。", "r": "OpenIntro 3章"}, {"v": "", "q": "大数の法則が述べていることは。", "o": ["試行回数を増やすと観察された割合は確率に収束する", "試行回数が少ないほど正確", "確率は試行とともに変わる", "10回も振れば必ず1/6になる"], "a": 0, "e": "観測数を増やすと p̂ₙ は真の確率 p に近づく。途中のふらつきは回数とともに小さくなる。", "r": "OpenIntro 3章"}, {"v": "", "q": "「ある人が来月病気になるか」をランダム過程と見なすことについて教科書の立場は。", "o": ["本当に偶然でないので不適切", "真に確率的でなくても、ランダムとしてモデル化することは有益", "医学には確率は使えない", "病気は常に予測できる"], "a": 1, "e": "完全に予見するのが難しい現象は、ランダム過程としてモデル化すると有益。有病率や反応率も同じ。", "r": "OpenIntro 3章"}], "course": "stat"}, {"id": "s18", "lv": 1, "t": "排反と独立：足すのか、掛けるのか", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §3.1.3–3.1.7", "vol": "統計 第3章 確率", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>研修医が聞きました。「先天性甲状腺機能低下症が約3,000人に1人、CAHが約2万人に1人。両方持ってる赤ちゃんは、どのくらいの確率ですか？」。足すのか、掛けるのか、引くのか。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>同時に起きない事象なら確率を<strong>足す</strong>、互いに影響しない事象なら<strong>掛ける</strong>。「起きない確率」は1から引く。</div><p>確率の計算規則は、結局「<strong>足す</strong>」「<strong>掛ける</strong>」「<strong>1から引く</strong>」の三つです。どれを使うかは、事象どうしの関係で決まります。</p>\n<h3>排反：同時に起きない</h3>\n<p>サイコロの1と2は同時に出ません。こういう事象を<strong>排反</strong>（互いに排反、disjoint）と呼びます。排反な事象のどちらかが起きる確率は<strong>足し算</strong>です。</p>\n<div class=\"formula\">排反の加法ルール：P(A or B) ＝ P(A) ＋ P(B)</div>\n<p>ローンの住居形態〈借家／抵当／持ち家〉は排反。「抵当または持ち家」は 0.479＋0.135＝0.614。</p>\n<h3>排反でないとき：重なりを引く</h3>\n<p>トランプで「ダイヤ または 絵札」。ダイヤ13枚、絵札12枚ですが、ダイヤの絵札3枚が両方に数えられています。二重に数えた分を引きます。</p>\n<div class=\"formula\">一般加法ルール：P(A or B) ＝ P(A) ＋ P(B) − P(A and B)<br>＝ 13/52 ＋ 12/52 − 3/52 ＝ 22/52</div>\n<p>排反なら P(A and B)＝0 なので、単純な加法ルールに戻ります。ベン図を描くと、重なりが見えます。統計で「または」は、断りがなければ「<strong>どちらか、または両方</strong>」の意味です。</p>\n<h3>確率分布と補事象</h3>\n<p>ランダム過程の<strong>すべての結果と、それぞれの確率</strong>を並べた表を<strong>確率分布</strong>と呼びます。条件は三つ。結果が排反、確率が0以上、合計が1。</p>\n<p>ある事象が起きない事象を<strong>補事象</strong>（Aᶜ）と呼びます。P(Aᶜ)＝1−P(A)。「2でない」は 1−1/6＝5/6。「少なくとも1人は〜」の確率は、「誰も〜でない」を1から引くと速い、というのは臨床計算でもよく使う手です。</p>\n<h3>独立：片方を知っても他方の情報にならない</h3>\n<p>二つのサイコロの目は<strong>独立</strong>です。最初が1だと知っても、次が1になる確率は 1/6 のまま。独立な事象が<strong>両方</strong>起きる確率は<strong>掛け算</strong>です。</p>\n<div class=\"formula\">独立の乗法ルール：P(A and B) ＝ P(A) × P(B)</div>\n<p>教科書の例。米国成人の約10%が左利き。ランダムに選んだ2人が両方左利きの確率は 0.1×0.1＝0.01。ただし「ランダムに選んだ」が前提です。<strong>兄弟なら独立ではない</strong>かもしれない。</p>\n<h3>排反と独立は別のもの</h3>\n<p>混ざりやすいので区別します。排反は「同時に起きない」（だから足す）。独立は「片方が他方に影響しない」（だから掛ける）。排反な事象は、片方が起きたら他方は起きないと分かるので、<strong>独立ではありません</strong>。</p>\n<p>研修医への答え。「別々の病気で、片方があっても他方の確率が変わらないなら<strong>独立</strong>。掛け算で 1/3,000 × 1/20,000 ＝ 6,000万人に1人くらい」。「『どちらかを持っている』なら？」「ほぼ排反だから足して、約3,000人に1人より少し多いくらい。重なりは無視できるほど小さい」。</p>", "keys": ["排反（同時に起きない）なら足す。排反でなければ重なりを引く", "一般加法ルール：P(A or B)＝P(A)＋P(B)−P(A and B)", "確率分布：排反な全結果と確率、合計1。補事象は1−P(A)", "独立（片方が他方に影響しない）なら掛ける：P(A and B)＝P(A)×P(B)", "排反と独立は別の概念。排反な事象は独立ではない"], "upd": null, "quiz": [{"v": "", "q": "ダイヤ（13/52）または絵札（12/52）を引く確率を求めるとき、引くべきものは。", "o": ["何も引かない", "ダイヤの絵札（3/52）", "スペードの絵札", "絵札でないダイヤ"], "a": 1, "e": "一般加法ルール。両方に数えた重なり P(A and B)=3/52 を引く。", "r": "OpenIntro 3章"}, {"v": "", "q": "二つの事象が「独立」であるとは。", "o": ["同時に起きない", "片方の結果を知っても他方の確率が変わらない", "確率が等しい", "合計が1になる"], "a": 1, "e": "独立なら P(A and B)=P(A)×P(B)。排反（同時に起きない）とは別の概念。", "r": "OpenIntro 3章"}, {"v": "", "q": "米国成人の10%が左利き。ランダムに選んだ2人が両方左利きの確率は。", "o": ["0.2", "0.1", "0.01", "0.5"], "a": 2, "e": "独立と仮定して 0.1×0.1=0.01。ランダムに選ばず兄弟などなら独立でないかもしれない。", "r": "OpenIntro 3章"}], "course": "stat"}, {"id": "s19", "lv": 2, "t": "条件付き確率：分母を変える", "min": 6, "cats": "", "src": "OpenIntro Statistics 4e §3.2.1–3.2.3", "vol": "統計 第3章 確率", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>第2章の分割表に戻ります。ビタミンD低値40人中18人、正常45人中9人にインスリン抵抗性。先輩が言います。「低値の子の45%、って書いたけど、これって確率の言葉で何て言うん？」</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>条件付き確率は「<strong>分母を絞った</strong>確率」。感度（病気→陽性）と陽性的中率（陽性→病気）は別物。</div><p>第2章第14話で「分母を確かめる」と言いました。確率の言葉にすると、それは<strong>条件付き確率</strong>です。この章でいちばん大事な道具で、次の回のベイズの定理の土台です。</p>\n<h3>例：写真の自動分類</h3>\n<p>教科書は、1,822枚の写真を機械学習が「ファッション／非ファッション」に分類し、人間が正解を付けたデータを使います。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>真：F</th><th>真：NF</th><th>計</th></tr>\n<tr><td>予測 F</td><td>197</td><td>22</td><td>219</td></tr><tr><td>予測 NF</td><td>112</td><td>1491</td><td>1603</td></tr><tr><td>計</td><td>309</td><td>1513</td><td>1822</td></tr></table></div>\n<p>これは、診断検査の<strong>2×2表</strong>そのものです。予測＝検査結果、真の状態＝病気の有無。</p>\n<h3>周辺確率と同時確率</h3>\n<ul>\n<li><strong>周辺確率</strong>：1変数だけの確率。P(予測F)＝219/1822＝0.12。表の縁（周辺）の合計から出るのでこう呼びます。</li>\n<li><strong>同時確率</strong>：2変数の組み合わせの確率。P(予測F and 真F)＝197/1822＝0.11。</li>\n</ul>\n<p>同時確率を足すと周辺確率になります。P(真F)＝P(予測F,真F)＋P(予測NF,真F)＝0.108＋0.062＝0.17。</p>\n<h3>条件付き確率</h3>\n<p>「予測がFだった写真のうち、本当にFの割合」は 197/219＝0.90。<strong>条件</strong>（予測F）を満たすものだけに分母を絞って、その中で関心事象（真F）の割合を見る。これを</p>\n<div class=\"formula\">P(真F | 予測F) ＝ 197 / 219 ＝ 0.90</div>\n<p>と書き、縦棒「|」は「〜という条件のもとで」と読みます。</p>\n<p>件数が分からず、確率しか分からないときも計算できます。</p>\n<div class=\"formula\">P(A | B) ＝ P(A and B) / P(B)</div>\n<p>P(真F | 予測F)＝0.108/0.120＝0.90。同じ答えです。</p>\n<h3>条件を逆にすると別の数字</h3>\n<p>P(予測F | 真F)＝197/309＝0.64。「本当にFの写真のうち、Fと予測された割合」。さっきの 0.90 とは<strong>別の問い</strong>です。</p>\n<p>診断検査の言葉に直すと、</p>\n<ul>\n<li>P(検査陽性 | 病気あり) ＝ <strong>感度</strong></li>\n<li>P(病気あり | 検査陽性) ＝ <strong>陽性的中率</strong></li>\n</ul>\n<p>縦棒の左右を入れ替えると、まったく違う数字になります。この入れ替えが、次の回のベイズの定理です。</p>\n<h3>条件付き確率の和は1</h3>\n<p>同じ条件のもとでは、排反な結果の条件付き確率を足すと1になります。P(予測F | 真F)＋P(予測NF | 真F)＝0.64＋0.36＝1。補事象のルールも、同じ条件のもとで使えます。</p>\n<p>先輩への答え。「45%は、P(インスリン抵抗性 | ビタミンD低値)。条件がビタミンD低値、関心事象が抵抗性。逆の P(ビタミンD低値 | 抵抗性) は 18/27＝67% で、別の数字」。「縦棒の右が分母、やな」「そう。それだけ覚えとけば、論文の%は全部読める」。</p>", "keys": ["周辺確率：1変数の確率（表の縁）。同時確率：組み合わせの確率。同時を足すと周辺", "条件付き確率 P(A|B)＝P(A and B)/P(B)。縦棒の右が分母", "P(真F|予測F)と P(予測F|真F)は別の問い", "感度＝P(陽性|病気)、陽性的中率＝P(病気|陽性)。入れ替えると別の数字", "同じ条件のもとで、条件付き確率の和は1"], "upd": null, "quiz": [{"v": "", "q": "P(A | B) の定義は。", "o": ["P(A)×P(B)", "P(A and B) / P(B)", "P(A)+P(B)", "P(B) / P(A and B)"], "a": 1, "e": "条件Bのもとで、Aが起きる確率。分母は条件Bの確率。", "r": "OpenIntro 3章"}, {"v": "", "q": "診断検査で「感度」に対応する条件付き確率は。", "o": ["P(病気あり | 検査陽性)", "P(検査陽性 | 病気あり)", "P(検査陽性 and 病気あり)", "P(病気あり)"], "a": 1, "e": "感度は「病気がある人のうち検査が陽性になる割合」＝P(陽性|病気)。P(病気|陽性)は陽性的中率。", "r": "OpenIntro 3章"}, {"v": "", "q": "ビタミンD低値40人中18人に抵抗性、正常45人中9人。P(抵抗性 | 低値) は。", "o": ["18/27", "18/40", "18/85", "40/85"], "a": 1, "e": "条件（低値）が分母。18/40=45%。18/27は P(低値|抵抗性)。", "r": "OpenIntro 3章"}], "course": "stat"}, {"id": "s20", "lv": 2, "t": "樹形図とベイズの定理：検査が陽性だったら", "min": 7, "cats": "", "src": "OpenIntro Statistics 4e §3.2.7–3.2.8", "vol": "統計 第3章 確率", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>新生児スクリーニングで17-OHPが高値と連絡が来ました。お母さんが電話口で泣いています。「この子、病気なんですか」。あなたは、何%と答えますか。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>病気がまれだと、<strong>良い検査でも陽性者の多くは偽陽性</strong>になる。有病率が陽性的中率を決める。</div><p>前の回で、感度と陽性的中率は縦棒の左右が逆だと見ました。臨床で本当に知りたいのは<strong>陽性的中率</strong>、つまり「検査が陽性だった人のうち、本当に病気の人の割合」です。でも手元にあるのは感度と特異度。この<strong>逆転</strong>をするのが、ベイズの定理です。</p>\n<h3>教科書の例：マンモグラフィ</h3>\n<ul>\n<li>40歳以上の女性の乳がん有病率：0.35%</li>\n<li>がんがある人の11%は検査陰性（偽陰性）→ <strong>感度 89%</strong></li>\n<li>がんがない人の7%は検査陽性（偽陽性）→ <strong>特異度 93%</strong></li>\n</ul>\n<p>検査が陽性だったとき、本当にがんである確率は？</p>\n<h3>樹形図で解く</h3>\n<p>まず、周辺確率が分かっている変数（がんの有無）で枝を分け、次に条件付き確率（検査結果）で枝を分けます。枝の確率を左から右に掛けると、同時確率になります。</p>\n<div class=\"formula\">がんあり 0.0035 → 陽性 0.89 → 0.0035×0.89 ＝ 0.00312<br>がんあり 0.0035 → 陰性 0.11 → 0.00039<br>がんなし 0.9965 → 陽性 0.07 → 0.9965×0.07 ＝ 0.06976<br>がんなし 0.9965 → 陰性 0.93 → 0.92675</div>\n<p>「陽性」になる経路は二つ。本物の陽性 0.00312 と、偽陽性 0.06976。陽性の総確率は 0.07288。</p>\n<div class=\"formula\">P(がん | 陽性) ＝ 0.00312 / 0.07288 ≈ 0.043</div>\n<p><strong>陽性でも、本当にがんなのは約4%</strong>。感度89%の検査なのに、です。理由は、がんのない人が圧倒的に多いので、7%の偽陽性でも<strong>人数では本物の陽性の22倍</strong>になるからです。</p>\n<h3>ベイズの定理</h3>\n<p>樹形図でやったことを式にしたのがベイズの定理です。</p>\n<div class=\"formula\">P(A₁ | B) ＝ P(B | A₁) P(A₁) / [ P(B | A₁) P(A₁) ＋ P(B | A₂) P(A₂) ＋ … ]</div>\n<p>分子は「A₁ かつ B」の同時確率。分母は「B が起きるすべての経路」の和。手順は二つ。(1) 第1変数の各結果の周辺確率（有病率）を用意する。(2) 各結果を条件とした B の条件付き確率（感度・偽陽性率）を用意する。あとは割り算です。</p>\n<h3>有病率が答えを決める</h3>\n<p>同じ検査でも、<strong>有病率が変わると陽性的中率は大きく変わります</strong>。乳がんの家族歴がある人（有病率が高い）なら、陽性的中率はずっと高くなる。これが「検査前確率」の考え方で、教科書は「だから多くの医師は、最初の陽性で確定せず追加検査をする」と書いています。</p>\n<h3>新生児スクリーニングに当てはめる</h3>\n<p>21水酸化酵素欠損症の有病率を約1/18,000、スクリーニングの感度を仮に 99%、偽陽性率を 0.5% とします。10万人を樹形図に通すと、</p>\n<div class=\"formula\">病気あり 5.6人 → 陽性 5.5人<br>病気なし 99,994人 → 陽性 500人<br>P(病気 | 陽性) ≈ 5.5 / 505.5 ≈ 1%</div>\n<p>一次スクリーニングの陽性者のうち、本当に病気なのは<strong>100人に1人</strong>程度です（早産児では偽陽性がさらに増えます）。だから精密検査があるのです。</p>\n<p>お母さんへの答え。「スクリーニングで陽性になった赤ちゃんの、ほとんどは病気ではありません。ただ、病気だった場合は早く治療を始めることがとても大事なので、念のため今日来てください」。この一文は、ベイズの定理をそのまま言葉にしたものです。</p>", "keys": ["樹形図：周辺確率が分かる変数で先に分け、条件付き確率で次に分け、掛けて同時確率", "P(病気|陽性)＝本物の陽性 ÷（本物の陽性＋偽陽性）。これがベイズの定理", "有病率が低いと、感度が高くても陽性的中率は低い（偽陽性の人数が多い）", "有病率（検査前確率）が変わると陽性的中率は大きく変わる", "新生児スクリーニング陽性の多くは偽陽性。だから精密検査がある"], "upd": null, "quiz": [{"v": "", "q": "有病率0.35%、感度89%、特異度93%のマンモグラフィで陽性のとき、本当にがんである確率は約。", "o": ["89%", "50%", "4%", "0.35%"], "a": 2, "e": "P(がん|陽性)=0.00312/0.07288≈0.043。がんのない人が多いので偽陽性の人数が本物を圧倒する。", "r": "OpenIntro 3章"}, {"v": "", "q": "ベイズの定理の分母が表すものは。", "o": ["病気の有病率", "検査が陽性になるすべての経路の確率の和", "感度", "検査陰性の確率"], "a": 1, "e": "分母は P(B)、つまり B が起きる各シナリオ（本物の陽性＋偽陽性…）の同時確率の和。", "r": "OpenIntro 3章"}, {"v": "", "q": "同じ検査で陽性的中率を大きく変えるものは。", "o": ["検査の価格", "有病率（検査前確率）", "検査の回数", "検査の名称"], "a": 1, "e": "有病率が高い集団（家族歴あり等）では同じ感度・特異度でも陽性的中率が上がる。", "r": "OpenIntro 3章"}], "course": "stat"}, {"id": "s21", "lv": 2, "t": "独立の確認、ギャンブラーの誤り、天然痘の教訓", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §3.2.4–3.2.6", "vol": "統計 第3章 確率", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「この子、3回続けて低血糖やったから、次は大丈夫やろ」。当直明けの研修医がつぶやきました。確率の言葉で、どこが間違っているでしょう。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>コインやサイコロに記憶はない。「そろそろ表が出るはず」は<strong>ギャンブラーの誤り</strong>。</div><p>条件付き確率が分かると、<strong>独立</strong>を数式で確かめられます。そして、独立を取り違える有名な間違いも説明できます。</p>\n<h3>独立の数式</h3>\n<p>二つのサイコロ。P(Y=1)＝1/6。P(Y=1 | X=1)＝P(X=1 and Y=1)/P(X=1)＝(1/36)/(1/6)＝1/6。<strong>条件を付けても確率が変わらない</strong>。これが独立の定義です。</p>\n<div class=\"formula\">独立 ⟺ P(A | B) ＝ P(A)</div>\n<p>逆に、P(A | B) が P(A) と違えば、AとBは関連しています。前の回のビタミンDの例なら、P(抵抗性)＝27/85＝32%、P(抵抗性 | 低値)＝45%。条件で確率が変わるので、関連あり。第1章の「関連している／独立」が、ここで数字になりました。</p>\n<h3>一般乗法ルール</h3>\n<p>条件付き確率の式を並べ替えると、独立でなくても使える掛け算の規則になります。</p>\n<div class=\"formula\">P(A and B) ＝ P(A | B) × P(B)</div>\n<p>教科書の例は1721年ボストンの天然痘。住民の96.08%が接種を受けず、非接種者の85.88%が生存。「非接種かつ生存」は 0.8588×0.9608＝0.825。樹形図の枝を掛けるのと同じことです。</p>\n<h3>天然痘データの教訓</h3>\n<p>接種者の死亡率は約1/40、非接種者は約1/7。大きな差です。でも教科書は念を押します。接種は<strong>自己選択</strong>だった。これは<strong>観察研究</strong>であり、因果は推測できない。交絡の候補は、たとえば接種を選べた人の経済状況や健康状態。第1章の原則は、確率の章でも繰り返されます。（のちの研究で、接種の効果自体は確認されています。）</p>\n<h3>ギャンブラーの誤り</h3>\n<p>ルーレットで黒が5回続いた。「6回続く確率は1/64と低いから、次は赤だ」と賭ける。どこが間違いか。<strong>各回転は過去と独立</strong>です。黒が5回出たあとの6回目が黒になる確率は、1回目と同じ 1/2。「6回連続」が珍しいのは、<strong>始める前</strong>の話。5回出てしまった今、残りは1回分の確率しかありません。カジノが直近の結果を表示するのは、この錯覚を誘うためです。</p>\n<p>研修医のつぶやきも同じ構造です。「3回続いたから次は大丈夫」は、低血糖が各回独立で、かつ「4回連続は珍しい」という前提での発想。でも、<strong>医学では各回は独立ではないことが多い</strong>。3回続いたのは、その子にインスリンの量が多いとか、夕食を食べていないとか、<strong>同じ原因が続いている</strong>からかもしれない。独立なら「次も同じ確率」、独立でないなら「むしろ次も起きやすい」。どちらにしても「次は大丈夫」にはなりません。</p>\n<p>「じゃあどう考えたらいいですか」「3回続いた、という情報で<strong>条件付け</strong>する。P(次も低血糖 | 3回続いた) を考える。それは、原因が続いていれば高い」。研修医は、その子のインスリン量を見直しに行きました。</p>", "keys": ["独立 ⟺ P(A|B)＝P(A)。条件で確率が変われば関連あり", "一般乗法ルール：P(A and B)＝P(A|B)×P(B)。樹形図の枝を掛けるのと同じ", "天然痘データ：接種は自己選択の観察研究。因果は推測できない", "ギャンブラーの誤り：独立な試行では過去の結果は次に影響しない", "医学では各回は独立でないことが多い。「続いた」という情報で条件付けする"], "upd": null, "quiz": [{"v": "", "q": "事象AとBが独立であることを条件付き確率で表すと。", "o": ["P(A|B)＝0", "P(A|B)＝P(A)", "P(A|B)＝P(B)", "P(A|B)＝1"], "a": 1, "e": "条件を付けても確率が変わらないのが独立。変われば関連あり。", "r": "OpenIntro 3章"}, {"v": "", "q": "ルーレットで黒が5回続いたあと、次が黒になる確率は。", "o": ["1/64", "1/32", "1/2", "0"], "a": 2, "e": "各回転は独立。過去の結果は次に影響しない（ギャンブラーの誤り）。", "r": "OpenIntro 3章"}, {"v": "", "q": "1721年ボストンの天然痘データで、接種者の死亡率が低かったことから因果を結論できない理由は。", "o": ["標本が小さい", "接種が自己選択の観察研究で、交絡がありうる", "死亡率の計算が誤っている", "接種は効果がない"], "a": 1, "e": "観察研究から因果は推測できない。接種を選べた人の状況が交絡になりうる。", "r": "OpenIntro 3章"}], "course": "stat"}, {"id": "s22", "lv": 2, "t": "有限集団からのサンプリング", "min": 4, "cats": "", "src": "OpenIntro Statistics 4e §3.3", "vol": "統計 第3章 確率", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>外来の15人の中から、研究の説明をする患者を3人ランダムに選ぶことになりました。「最初に選んだ子が、2回目にも選ばれる確率は？」と研修医。「戻さないなら0やで」と答えてから、少し考えました。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>一度選んだものを戻さない抽出では、<strong>選ぶたびに確率が変わる</strong>。大きな集団ならほぼ無視できる。</div><p>短い回です。<strong>取り出したものを戻すかどうか</strong>で、確率の計算が変わります。</p>\n<h3>復元抽出と非復元抽出</h3>\n<p>教科書の例は、教授が15人のクラスから3人を順に指名する場面。1回目に自分が当たる確率は 1/15。</p>\n<p><strong>非復元</strong>（一度選んだ人は戻さない）なら、1回目に自分が当たらなかったという条件のもとで、2回目に当たる確率は 1/14。3回目は 1/13。すると「3回のどこかで当たる」確率は</p>\n<div class=\"formula\">1 − (14/15)(13/14)(12/13) ＝ 1 − 12/15 ＝ 3/15 ＝ 0.2</div>\n<p>結局、3/15 です。順番に関係なく、15人から3人選ばれるうちの1人になる確率、と考えても同じ。</p>\n<p><strong>復元</strong>（毎回全員から選び直す）なら、毎回 1/15 で独立。「3回とも当たらない」は (14/15)³≈0.812、「少なくとも1回」は約 0.188。非復元より少し低い。</p>\n<h3>医学での意味</h3>\n<p>ほとんどの臨床研究は<strong>非復元</strong>です。同じ患者を二度数えません。母集団が大きい（数千人以上）なら、非復元でも復元とほぼ同じ確率になるので、復元として扱って問題ありません。母集団が小さい（1つの外来の数十人）なら、違いが出てきます。</p>\n<p>第1章第6話の単純無作為抽出は、非復元のくじ引きでした。「各個体が同じ確からしさで選ばれ、個体間に関係が生じない」という言い方は、復元に近い性質を非復元で近似している、ということです。</p>\n<p>研修医に、「戻さないなら0。でも『3回のどこかで当たる』は、戻しても戻さなくても、だいたい2割」。次の回からは、確率変数と期待値、第3章の後半です。</p>", "keys": ["非復元抽出：一度選んだものを戻さない。条件付きで分母が減っていく", "「少なくとも1回」は「1回も起きない」を1から引く", "復元なら各回独立で同じ確率", "臨床研究はほぼ非復元。母集団が大きければ復元とほぼ同じ", "単純無作為抽出は非復元のくじ引き"], "upd": null, "quiz": [{"v": "", "q": "15人から非復元で3人を順に選ぶとき、特定の1人がどこかで選ばれる確率は。", "o": ["1/15", "3/15", "1/3", "(1/15)³"], "a": 1, "e": "1−(14/15)(13/14)(12/13)=3/15=0.2。順番によらず15人中3人に入る確率。", "r": "OpenIntro 3章"}, {"v": "", "q": "復元抽出と非復元抽出の違いは。", "o": ["復元は各回独立で同じ確率、非復元は分母が減る", "復元は確率が増える", "非復元は独立", "違いはない"], "a": 0, "e": "復元は毎回全員から選び直すので独立。非復元は選んだ人を戻さないので条件付き確率になる。", "r": "OpenIntro 3章"}, {"v": "", "q": "母集団が非常に大きいとき、非復元抽出は。", "o": ["復元抽出とほぼ同じ確率になる", "計算できない", "必ず復元より高い確率", "独立でなくなる"], "a": 0, "e": "母集団が大きいと1人を取り出しても分母がほとんど変わらないので、復元として扱って問題ない。", "r": "OpenIntro 3章"}], "course": "stat"}, {"id": "s23", "lv": 3, "t": "確率変数と期待値", "min": 6, "cats": "", "src": "OpenIntro Statistics 4e §3.4.1–3.4.2", "vol": "統計 第3章 確率", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>GH製剤の年間コストを見積もる会議。「体重で量が変わるし、途中で中止する子もいるし、計算できませんよ」。でも、平均なら計算できます。それが期待値です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b><strong>期待値</strong>は「平均するとどれくらいになるか」。確率で重みをつけた平均のこと。</div><p>ランダム過程の結果が<strong>数値</strong>のとき、それを<strong>確率変数</strong>と呼び、X や Y と書きます。確率変数には「平均」と「ばらつき」があります。データの平均とSDの、確率版です。</p>\n<h3>教科書の例：本屋の売上</h3>\n<p>統計の授業で、学生の20%はどの本も買わず、55%は教科書だけ、25%は教科書とガイドの両方を買う。100人なら、0冊×20人＋1冊×55人＋2冊×25人＝105冊売れると<strong>期待</strong>できます。実際に105冊ぴったりにはなりませんが、だいたいその辺りです。</p>\n<h3>期待値</h3>\n<p>確率変数 X の<strong>期待値</strong> E(X) は、各値に確率を掛けて足したものです。</p>\n<div class=\"formula\">E(X) ＝ x₁P(x₁) ＋ x₂P(x₂) ＋ … ＋ xₖP(xₖ)</div>\n<p>教科書137ドル、ガイド33ドルなら、1人あたりの売上 X は 0ドル（0.20）、137ドル（0.55）、170ドル（0.25）。</p>\n<div class=\"formula\">E(X) ＝ 0×0.20 ＋ 137×0.55 ＋ 170×0.25 ＝ 117.85 ドル</div>\n<p>期待値は<strong>分布の重心</strong>です。第2章のドットプロットの三角と同じ。母集団の平均 μ と書くこともあります。</p>\n<h3>確率変数のばらつき</h3>\n<p>期待値からの偏差を二乗して、確率で重みづけして足すと<strong>分散</strong>、その平方根が<strong>標準偏差</strong>です。</p>\n<div class=\"formula\">Var(X) ＝ (x₁−μ)²P(x₁) ＋ … ＋ (xₖ−μ)²P(xₖ)<br>本屋の例：(0−117.85)²×0.20 ＋ (137−117.85)²×0.55 ＋ (170−117.85)²×0.25 ≈ 3659 → SD ≈ 60.5 ドル</div>\n<p>第2章の標本分散は n−1 で割りましたが、こちらは確率で重みづけするので割り算は出てきません。</p>\n<h3>期待値を医学で使う</h3>\n<p>冒頭の会議に戻ります。治療を続ける確率、中止する確率、体重別の薬の量と価格が分かれば、1人あたりの年間コストの期待値が計算できます。「計算できない」のではなく、「ばらつきはあるが、平均は計算できる」。</p>\n<p>もう一つ、臨床判断で使う形。<strong>期待効用</strong>です。治療Aは80%で成功（利益10）、20%で合併症（損失−5）。期待値は 0.8×10＋0.2×(−5)＝7。治療Bは50%で成功（利益12）、50%で何も起きない（0）。期待値は 6。期待値だけで決めるものではありませんが、比較の出発点になります。</p>\n<p>会議では、「1人あたりの期待コストは、継続率と体重分布から約○万円。ばらつきはSDで±○万円」と答えました。「平均と、ばらつき。第2章で習ったやつですね」と誰かが言いました。</p>", "keys": ["確率変数：結果が数値のランダム過程。X, Y で書く", "期待値 E(X)＝Σ xᵢP(xᵢ)。分布の重心。μ とも書く", "分散は期待値からの偏差の二乗を確率で重みづけして足す。SDはその平方根", "「計算できない」ではなく「平均は計算できる、ばらつきはSDで」", "期待効用：成功確率×利益＋失敗確率×損失。治療比較の出発点"], "upd": null, "quiz": [{"v": "", "q": "売上が 0ドル（0.20）、137ドル（0.55）、170ドル（0.25）のとき期待値は。", "o": ["102.3ドル", "117.85ドル", "137ドル", "153.5ドル"], "a": 1, "e": "0×0.20+137×0.55+170×0.25=117.85。各値×確率の和。", "r": "OpenIntro 3章"}, {"v": "", "q": "確率変数の期待値を図で言うと。", "o": ["分布の最大値", "分布の重心", "分布の中央値", "分布の幅"], "a": 1, "e": "期待値は確率で重みづけした平均＝分布の重心。第2章のドットプロットの三角と同じ。", "r": "OpenIntro 3章"}, {"v": "", "q": "確率変数の分散の計算で、標本分散と違う点は。", "o": ["二乗しない", "n−1で割らず、各偏差の二乗を確率で重みづけして足す", "平均を引かない", "平方根を取らない"], "a": 1, "e": "Var(X)=Σ(xᵢ−μ)²P(xᵢ)。確率で重みづけするので割り算は出ない。", "r": "OpenIntro 3章"}], "course": "stat"}, {"id": "s24", "lv": 3, "t": "確率変数の足し算と、連続分布", "min": 6, "cats": "", "src": "OpenIntro Statistics 4e §3.4.3–3.5", "vol": "統計 第3章 確率", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「身長SDSの変化（平均+0.62、SD 0.41）と、骨年齢の進み（平均+1.1年、SD 0.5年）を足した指標を作りたいんやけど、SDはどうなる？」と先輩。「足せばいいんちゃう？」と研修医。足してはいけません。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>ばらつき（SD）はそのまま足せない。<strong>分散を足してからルート</strong>をとる。差をとるときも分散は足す。</div><p>第3章の最後は二つ。確率変数を<strong>足したり引いたり</strong>したときの平均とばらつき、そして<strong>連続分布</strong>への橋渡しです。</p>\n<h3>線形結合の期待値</h3>\n<p>二つの確率変数 X と Y を、aX＋bY のように組み合わせたものを<strong>線形結合</strong>と呼びます。期待値は、そのまま組み合わせられます。</p>\n<div class=\"formula\">E(aX ＋ bY) ＝ a E(X) ＋ b E(Y)</div>\n<p>教科書の例は、2つの株の月次収益。それぞれの期待値を持ち分で重みづけして足せば、ポートフォリオの期待収益です。独立でなくても成り立ちます。</p>\n<h3>線形結合のばらつき：SDは足せない</h3>\n<p>ここが要点です。<strong>XとYが独立</strong>なら、</p>\n<div class=\"formula\">Var(aX ＋ bY) ＝ a² Var(X) ＋ b² Var(Y)</div>\n<p>足せるのは<strong>分散</strong>で、しかも係数は二乗。SDは足せません。先輩の指標なら、Var＝0.41²＋0.5²＝0.168＋0.25＝0.418、SD＝√0.418≈0.65。SDを単純に足した 0.91 より小さくなります。</p>\n<p>もう一つ注意。<strong>X−Y でも分散は足します</strong>。引き算でも、ばらつきは増えます。Var(X−Y)＝Var(X)＋Var(Y)。「差」の不確かさは、両方の不確かさを合わせたものだからです。治療前後の差や、2群の差の標準誤差が、この形で出てきます（第5章・第7章）。</p>\n<p>独立でないときは、共分散の項が入って式が変わります。教科書はそこには深入りせず、「独立のときの式」を覚えればよいとしています。</p>\n<h3>ヒストグラムから連続分布へ</h3>\n<p>身長のような<strong>連続変数</strong>は、どの値も取りえます。300万人の成人の身長をヒストグラムにして、階級をどんどん細かくしていくと、棒の輪郭が<strong>なめらかな曲線</strong>になります。これが<strong>連続分布</strong>（確率密度）です。</p>\n<p>連続分布では、<strong>曲線の下の面積が確率</strong>です。曲線全体の下の面積は1。「身長が180〜185cmの確率」は、その区間の面積。</p>\n<p>そして、少し不思議な性質。「身長がちょうど180.00000…cmの確率」は、幅ゼロの区間の面積なので<strong>0</strong>です。だから連続変数では、「ある値」ではなく「ある範囲」の確率を考えます。P(X ≤ 180) と P(X ＜ 180) は同じです。</p>\n<h3>第3章の地図</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>話</th><th>覚えておくこと</th></tr>\n<tr><td>17</td><td>確率＝無限回の割合。大数の法則</td></tr>\n<tr><td>18</td><td>排反なら足す、独立なら掛ける、補事象は1から引く</td></tr>\n<tr><td>19</td><td>条件付き確率。縦棒の右が分母。感度と陽性的中率は別</td></tr>\n<tr><td>20</td><td>樹形図とベイズ。有病率が陽性的中率を決める</td></tr>\n<tr><td>21</td><td>独立 ⟺ P(A|B)＝P(A)。ギャンブラーの誤り</td></tr>\n<tr><td>22</td><td>復元と非復元</td></tr>\n<tr><td>23</td><td>期待値＝重心、分散は確率で重みづけ</td></tr>\n<tr><td>24</td><td>分散は足せるがSDは足せない。連続分布は面積が確率</td></tr></table></div>\n<p>先輩には、「分散を足して平方根。SD 0.65」と答えました。「引き算でも分散は足すって、ちょっと直感に反するな」「差の不確かさは、両方の不確かさを背負うから」。次の第4章は、連続分布の王様、<strong>正規分布</strong>です。身長SDSの −2 SD が「下位2.3%」になる理由を、ちゃんと計算します。</p>", "keys": ["E(aX+bY)＝aE(X)+bE(Y)。期待値は独立でなくても足せる", "独立なら Var(aX+bY)＝a²Var(X)+b²Var(Y)。SDは足せない、分散を足して平方根", "X−Y でも分散は足す。差の不確かさは両方を背負う", "連続分布：ヒストグラムの極限。曲線の下の面積が確率、全体で1", "連続変数では「ちょうどある値」の確率は0。範囲で考える"], "upd": null, "quiz": [{"v": "", "q": "独立な X（SD 0.41）と Y（SD 0.5）の和のSDは。", "o": ["0.91", "0.65", "0.455", "0.09"], "a": 1, "e": "Var(X+Y)=0.41²+0.5²=0.418、SD=√0.418≈0.65。SDは足せず、分散を足す。", "r": "OpenIntro 3章"}, {"v": "", "q": "独立な X と Y について、Var(X − Y) は。", "o": ["Var(X)−Var(Y)", "Var(X)+Var(Y)", "0", "Var(X)×Var(Y)"], "a": 1, "e": "引き算でも分散は足す（係数−1の二乗は1）。差の不確かさは両方の不確かさを合わせたもの。", "r": "OpenIntro 3章"}, {"v": "", "q": "連続分布で「身長がちょうど180.000cm」の確率は。", "o": ["曲線の高さ", "0", "1", "面積の半分"], "a": 1, "e": "幅ゼロの区間の面積は0。連続変数は範囲の確率（面積）で考える。", "r": "OpenIntro 3章"}], "course": "stat"}];
const ST4 = [{"id": "s25", "lv": 1, "t": "正規分布：釣り鐘の形と2つのパラメータ", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §4.1.1", "vol": "統計 第4章 確率変数の分布", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>外来の合間、先輩が成長曲線を指でなぞりながら言いました。「この −2 SD の線、なんで『下位2.3%』なん？誰が決めたん？」。第4章はこの問いに答えるところから始めます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b><strong>正規分布</strong>は左右対称の釣り鐘型。平均とSDの2つで形が決まる。身長はこの分布にほぼ従う。</div><p>実際のデータで見られる分布のなかで、ひとつだけ<strong>圧倒的によく出てくる形</strong>があります。左右対称で、山が一つで、釣り鐘型。これが<strong>正規分布</strong>（正規曲線）です。ガウスにちなんで<strong>ガウス分布</strong>とも呼ばれます。</p>\n<p>教科書が例に挙げるのは、SATの点数と<strong>アメリカの成人男性の身長</strong>。小児内分泌で毎日見ている「同じ年齢・性別の子どもの身長」も、ほぼ正規分布に従います。</p>\n<h3>正規分布の現実</h3>\n<p>教科書はここで大事な一言を添えています。</p>\n<div class=\"formula\">多くの変数は<strong>ほぼ</strong>正規分布に従うが、<strong>厳密に</strong>従うものはない</div>\n<p>完全ではない。でも、さまざまな問題に対してとても役に立つ。これが正規分布との付き合い方です。</p>\n<h3>2つのパラメータ</h3>\n<p>正規分布はいつも釣り鐘型ですが、<strong>平均 μ</strong> と<strong>標準偏差 σ</strong> の2つで見た目が変わります。</p>\n<ul><li>平均を変える → 曲線が<strong>左右に移動</strong>する</li>\n<li>標準偏差を変える → 曲線が<strong>広がる／狭まる</strong></li></ul>\n<p>平均 μ、標準偏差 σ の正規分布を <strong>N(μ, σ)</strong> と書きます。この2つで分布が完全に決まるので、μ と σ は分布の<strong>パラメータ</strong>と呼ばれます。</p>\n<p>特に、<strong>N(0, 1)</strong>（平均0、標準偏差1）を<strong>標準正規分布</strong>と呼びます。この章の主役です。</p>\n<h3>成長曲線は「年齢ごとの正規分布」</h3>\n<p>成長曲線は、各年齢で身長がそれぞれ N(その年齢の平均, その年齢のSD) に従うと考えて描かれた線の集まりです。6歳男児なら平均もSDも6歳男児のもの、10歳なら10歳のもの。年齢ごとに<strong>違う正規分布</strong>が並んでいます。</p>\n<p>だから、6歳の子と10歳の子の身長を「cm」で比べても意味がありません。そこで次の話の<strong>Zスコア</strong>（＝SDS）が出てきます。</p>\n<p>先輩への最初の答え。「−2 SD の線は、その年齢の正規分布で平均から標準偏差2つ分下。『下位2.3%』は、正規分布の形から自動的に決まる数字。誰かが決めたのは『−2 SD で線を引く』ことの方」。</p>", "keys": ["正規分布：左右対称・単峰・釣り鐘型。ガウス分布とも", "多くの変数は「ほぼ」正規。厳密に従うものはないが有用", "パラメータは平均μ（位置）と標準偏差σ（広がり）。N(μ, σ)と書く", "N(0,1)が標準正規分布", "成長曲線は年齢ごとに異なる正規分布を並べたもの"], "upd": null, "quiz": [{"v": "", "q": "正規分布を完全に決める2つのパラメータは。", "o": ["中央値と範囲", "平均と標準偏差", "最頻値と四分位範囲", "標本サイズと平均"], "a": 1, "e": "N(μ, σ)。平均が位置を、標準偏差が広がりを決める。", "r": "OpenIntro 4章"}, {"v": "", "q": "平均を変えずに標準偏差だけ大きくすると、正規曲線は。", "o": ["右に移動する", "左に移動する", "横に広がり山が低くなる", "形が左右非対称になる"], "a": 2, "e": "σは広がり。曲線の下の面積は常に1なので、広がると山は低くなる。", "r": "OpenIntro 4章"}, {"v": "", "q": "教科書が述べる「正規分布の現実」として正しいのは。", "o": ["身長は厳密に正規分布に従う", "多くの変数はほぼ正規に従うが、厳密に従うものはない", "正規分布は理論上の存在で実用性はない", "医学データは正規分布に従わない"], "a": 1, "e": "完全ではないが有用、というのが正規分布との付き合い方。", "r": "OpenIntro 4章"}], "course": "stat"}, {"id": "s26", "lv": 1, "t": "Zスコア：SDSの正体", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §4.1.2", "vol": "統計 第4章 確率変数の分布", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「身長 −1.8 SD、体重 −0.6 SD。この子、身長と体重どっちが『より』小さいん？」。単位が cm と kg で違うのに、比べられるのはなぜか。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b><strong>Zスコア＝身長SDS</strong>。「平均からSDいくつ分離れているか」なので、単位や年齢が違っても比べられる。</div><p>教科書の例題はこうです。SATは平均1100・SD200、ACTは平均21・SD6。アンはSATで1300点、トムはACTで24点。<strong>どちらの成績が良いか</strong>。</p>\n<p>点数の物差しが違うので、そのままでは比べられません。そこで<strong>「平均からSDいくつ分離れているか」</strong>に直します。</p>\n<ul><li>アン：1300 は 1100＋200 → <strong>平均＋1 SD</strong></li>\n<li>トム：24 は 21＋0.5×6 → <strong>平均＋0.5 SD</strong></li></ul>\n<p>アンの方が、仲間の中で上にいます。</p>\n<h3>Zスコアの定義</h3>\n<div class=\"formula\">Z ＝ (x − μ) ／ σ</div>\n<p>観測値 x が、平均 μ より<strong>標準偏差いくつ分</strong>上（正）か下（負）かを表します。平均ちょうどなら Z＝0。</p>\n<p>もうお分かりのとおり、これは<strong>身長SDS（Standard Deviation Score）</strong>そのものです。</p>\n<div class=\"formula\">身長SDS ＝ (実測身長 − 同年齢同性の平均身長) ／ 同年齢同性のSD</div>\n<p>単位が消えるので、<strong>年齢が違っても、身長と体重でも</strong>同じ物差しで比べられます。冒頭の子は、身長 −1.8 SD の方が体重 −0.6 SD より<strong>平均から遠い</strong>。つまり身長の方が「より小さい」と言えます。</p>\n<h3>|Z| が大きいほど珍しい</h3>\n<p>教科書は、フクロギツネの頭長（平均92.6mm、SD3.6mm）で練習させます。95.4mm は Z＝0.78、85.8mm は Z＝−1.89。<strong>Zの絶対値</strong>が大きい 85.8mm の方が<strong>観測されにくい</strong>。</p>\n<div class=\"formula\">|Z₁| ＞ |Z₂| なら、x₁ は x₂ より珍しい（分布が左右対称のとき特に有効）</div>\n<p>注意点も一つ。Zスコアは正規分布に近いデータで最もよく使われますが、計算自体はどんな分布にもできます。ただし「Z＝−2 だから下位2.3%」と読み替えられるのは、<strong>分布が正規に近いときだけ</strong>です（第27話）。</p>\n<h3>第5章への伏線</h3>\n<p>教科書は、この章の計算を<strong>必ずZスコアから始める</strong>方針をとります。理由は、第5章で出てくる<strong>検定統計量</strong>が、多くの場合Zスコアと同じものだから。「観測値が、帰無仮説の下での平均から、SDいくつ分離れているか」。SDSが読める人は、検定統計量も読めます。</p>", "keys": ["Zスコア＝(x−μ)/σ：平均から標準偏差いくつ分離れているか", "身長SDSはZスコアそのもの。単位が消えるので年齢・項目をまたいで比較できる", "平均より上なら正、下なら負、平均ちょうどで0", "|Z|が大きいほど観測されにくい（対称分布で特に有効）", "第5章の検定統計量は多くの場合Zスコアと同じ形"], "upd": null, "quiz": [{"v": "", "q": "ある年齢の平均身長120cm、SD5cm。身長110cmの子のSDSは。", "o": ["−10", "−2", "−0.5", "+2"], "a": 1, "e": "Z=(110−120)/5=−2。平均からSD2つ分下。", "r": "OpenIntro 4章"}, {"v": "", "q": "身長 −1.8 SD、体重 −0.6 SD の子について正しいのは。", "o": ["単位が違うので比べられない", "身長の方が平均から遠い", "体重の方が平均から遠い", "同じくらい小さい"], "a": 1, "e": "Zスコアは単位が消えるので比較できる。|−1.8|>|−0.6|。", "r": "OpenIntro 4章"}, {"v": "", "q": "Z＝−2 を「下位約2.3%」と読み替えてよいのはどんなときか。", "o": ["どんな分布でも常に", "分布がほぼ正規分布のとき", "標本サイズが10以下のとき", "中央値と平均が違うとき"], "a": 1, "e": "Zスコア自体はどの分布でも計算できるが、パーセンタイルへの換算は正規分布を前提にしている。", "r": "OpenIntro 4章"}], "course": "stat"}, {"id": "s27", "lv": 2, "t": "片側確率：−2 SDが「下位2.3%」になる理由", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §4.1.3–4.1.4", "vol": "統計 第4章 確率変数の分布", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩の問いに、いよいよ数字で答えます。「−2 SD 以下は何%？」。答えは曲線の下の<strong>面積</strong>です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>正規分布の面積を計算すると、<strong>−2SD以下は2.3%</strong>。健康な子でも約44人に1人はここに入る。</div><p>第24話で見たとおり、連続分布では<strong>曲線の下の面積が確率</strong>です。ある値より下の面積（<strong>下側確率</strong>）は、その値の<strong>パーセンタイル</strong>と同じ意味になります。</p>\n<h3>計算の3つの方法</h3>\n<ol><li><strong>統計ソフト</strong>：実務で最も一般的。Rなら <code>pnorm(1)</code> → 0.841。Excel なら <code>=NORM.S.DIST(1,TRUE)</code></li>\n<li><strong>関数電卓</strong>：教室向け</li>\n<li><strong>分布表</strong>：教室では見るが、実務ではめったに使わない</li></ol>\n<h3>−2 SD を計算する</h3>\n<div class=\"formula\">pnorm(−2) ＝ 0.0228 → <strong>下位約2.3%</strong></div>\n<p>これが成長曲線の「−2 SD＝下位2.3%」の正体です。正規分布を仮定すれば、−2 SD 以下の面積は自動的に 2.28%。逆に言えば、<strong>健康な子どもでも約44人に1人は −2 SD 以下</strong>になります。−2 SD は「病気の線」ではなく「精査を考える線」です。</p>\n<p>ついでに −2.5 SD は <code>pnorm(−2.5)</code>＝0.0062、<strong>約0.6%</strong>。160人に1人です。</p>\n<h3>上側確率は「1から引く」</h3>\n<p>多くのソフトは<strong>下側</strong>確率を返します。上側（ある値以上）が知りたいときは、</p>\n<div class=\"formula\">上側確率 ＝ 1 − 下側確率</div>\n<p>教科書の例：SAT N(1100, 200) で 1190点以上の確率。Z＝(1190−1100)/200＝0.45、下側 0.6736、上側 1−0.6736＝<strong>0.3264</strong>。</p>\n<h3>いつも、いつも、いつも図を描く</h3>\n<p>教科書は「いつも」を3回重ねて強調します。</p>\n<ol><li>正規曲線をざっと描く（正確でなくてよい）</li>\n<li>平均と、関心のある値を書き込む</li>\n<li>知りたい領域を<strong>塗りつぶす</strong></li>\n<li>それからZスコアを計算する</li></ol>\n<p>図を描くと、「答えはだいたい半分より小さいはず」といった<strong>見当</strong>がつきます。上側と下側を取り違える計算ミスを、図が防いでくれます。</p>\n<p>先輩：「じゃあ、身長SDS −2.0 の子が来たら、同年齢の98%はその子より大きい？」「正規分布を仮定すれば、そう。1−0.0228＝0.977」。</p>", "keys": ["曲線の下の面積が確率。下側確率＝パーセンタイル", "pnorm(−2)＝0.0228：−2 SD以下は下位約2.3%（約44人に1人）", "−2 SDは病気の線ではなく精査を考える線。健常児も一定数含まれる", "上側確率＝1−下側確率", "必ず図を描き、領域を塗ってからZを計算する"], "upd": null, "quiz": [{"v": "", "q": "正規分布で Z＝−2 以下となる確率は約。", "o": ["0.2%", "2.3%", "5%", "16%"], "a": 1, "e": "pnorm(−2)=0.0228。成長曲線の −2 SD が「下位2.3%」の根拠。", "r": "OpenIntro 4章"}, {"v": "", "q": "ソフトで Z＝1 の下側確率が 0.841 と出た。Z＝1 以上の確率は。", "o": ["0.841", "0.159", "0.5", "1.841"], "a": 1, "e": "上側＝1−下側＝0.159。", "r": "OpenIntro 4章"}, {"v": "", "q": "健康な子どもの集団（身長が正規分布）で、−2 SD 以下の子がいる割合として正しいのは。", "o": ["0%（−2 SD以下は全員病気）", "約2.3%", "約5%", "約50%"], "a": 1, "e": "健常集団でも約2.3%は −2 SD 以下。だから −2 SD は「精査を考える線」。", "r": "OpenIntro 4章"}], "course": "stat"}, {"id": "s28", "lv": 2, "t": "逆算と区間：3パーセンタイルは何SD？", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §4.1.4", "vol": "統計 第4章 確率変数の分布", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>成長曲線には、SDの線のほかに「3パーセンタイル」「97パーセンタイル」の線が描かれたものもあります。先輩：「3パーセンタイルって −2 SD と同じ？」</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>逆に「何パーセンタイルは何SDか」も出せる。<strong>3パーセンタイル＝−1.88SD</strong>、97.5パーセンタイル＝＋1.96SD。</div><p>前の話は「値 → 確率」でした。今度は逆、<strong>「確率 → 値」</strong>です。</p>\n<h3>パーセンタイルから値を求める</h3>\n<p>教科書の例：成人男性の身長 N(70インチ, 3.3インチ)。エリックは40パーセンタイル。身長は？</p>\n<ol><li>図を描き、左側40%を塗る</li>\n<li>下側確率0.40に対応するZを求める：<code>qnorm(0.40)</code> ≈ <strong>−0.25</strong></li>\n<li>Zの式を x について解く：−0.25＝(x−70)/3.3 → x ≈ <strong>69.2インチ</strong></li></ol>\n<p>Excel なら <code>=NORM.S.INV(0.40)</code>。「pnorm の逆」が qnorm です。</p>\n<h3>3パーセンタイルは −1.88 SD</h3>\n<div class=\"formula\">qnorm(0.03) ＝ −1.88　／　qnorm(0.97) ＝ ＋1.88</div>\n<p>先輩への答え。<strong>3パーセンタイル線は −1.88 SD</strong>で、−2 SD（2.3パーセンタイル）より<strong>少し上</strong>にあります。同じ子が「3パーセンタイル未満」だけど「−2 SD 以上」ということは普通に起こります。どちらの基準で話しているのか、紹介状を読むときに意識しておくと混乱しません。</p>\n<p>よく使う値をまとめておきます。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>パーセンタイル</th><th>Z（SD）</th></tr>\n<tr><td>2.3</td><td>−2.0</td></tr>\n<tr><td>3</td><td>−1.88</td></tr>\n<tr><td>10</td><td>−1.28</td></tr>\n<tr><td>50</td><td>0</td></tr>\n<tr><td>95</td><td>＋1.65</td></tr>\n<tr><td>97.5</td><td>＋1.96</td></tr></table></div>\n<p>最後の <strong>1.96</strong> は覚えておいてください。第5章の95%信頼区間で主役になります。</p>\n<h3>2つの値の間の確率</h3>\n<p>「69インチから74インチの間」のような中間の領域は、</p>\n<div class=\"formula\">中間 ＝ 1 − 下の片側 − 上の片側</div>\n<p>教科書の答えは 1−0.3821−0.1131＝<strong>0.5048</strong>。これも図を描けば迷いません。全体の面積が1であることを使うだけです。</p>\n<p>小児で言えば、「−2 SD から −1 SD の間の子は何%？」は pnorm(−1)−pnorm(−2)＝0.159−0.023＝<strong>約13.6%</strong>。</p>", "keys": ["確率→値の逆算：qnorm（Excel: NORM.S.INV）でZを出し、x＝μ＋Zσ", "3パーセンタイル＝−1.88 SD。−2 SD（2.3パーセンタイル）より少し上", "10パーセンタイル≈−1.28、95≈+1.65、97.5≈+1.96", "1.96は第5章の95%信頼区間で使う", "中間の確率＝1−下の片側−上の片側"], "upd": null, "quiz": [{"v": "", "q": "3パーセンタイルに対応するZスコアは約。", "o": ["−2.0", "−1.88", "−1.28", "−3.0"], "a": 1, "e": "qnorm(0.03)=−1.88。−2 SD より少し上にある。", "r": "OpenIntro 4章"}, {"v": "", "q": "97.5パーセンタイルに対応するZスコアは約。", "o": ["1.65", "1.96", "2.33", "2.58"], "a": 1, "e": "qnorm(0.975)=1.96。95%信頼区間の係数として第5章で再登場。", "r": "OpenIntro 4章"}, {"v": "", "q": "正規分布で −2 SD から −1 SD の間に入る割合は約。", "o": ["2.3%", "13.6%", "34%", "68%"], "a": 1, "e": "pnorm(−1)−pnorm(−2)=0.159−0.023≈0.136。", "r": "OpenIntro 4章"}], "course": "stat"}, {"id": "s29", "lv": 2, "t": "68-95-99.7ルールと基準範囲", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §4.1.5", "vol": "統計 第4章 確率変数の分布", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>検査室から届いた基準値一覧。「基準範囲は健常者の平均±2SD」。先輩：「つまり健康な人の5%は異常値ってこと？」。そのとおりです。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>平均±1SDに68%、±2SDに95%、±3SDに99.7%。だから<strong>健康な人でも検査1項目あたり5%は基準範囲外</strong>になる。</div><p>計算機もZ表もないときに使える、正規分布の<strong>大まかな目安</strong>があります。</p>\n<div class=\"formula\">平均±1 SD に約68%　／　±2 SD に約95%　／　±3 SD に約99.7%</div>\n<p>正確には 0.6827、0.9545、0.9973。日常の判断ならこの3つで十分です。</p>\n<h3>もっと外側</h3>\n<p>正規分布なら、平均から4 SD、5 SD 以上離れる値も<strong>あり得ます</strong>が、まれです。</p>\n<ul><li>4 SD より外：<strong>約1万5千分の1</strong></li>\n<li>5 SD より外：約200万分の1</li>\n<li>6 SD より外：約5億分の1</li></ul>\n<p>身長SDS −4 の子が来たら、「健常のばらつき」ではほぼ説明できない、ということです。</p>\n<h3>基準範囲の落とし穴</h3>\n<p>臨床検査の基準範囲の多くは、健常者の<strong>中央95%</strong>（およそ平均±2SD）で決められています。ということは、</p>\n<ul><li>健康な人でも、1項目あたり<strong>約5%</strong>は基準範囲外になる</li>\n<li>独立な20項目を測れば、少なくとも1つ外れる確率は 1−0.95²⁰ ≈ <strong>64%</strong></li></ul>\n<p>第18話の「補事象は1から引く」がここで効きます。<strong>たくさん測るほど、健康な人にも「異常値」が出る</strong>。スクリーニング検査をまとめてオーダーしたときに、境界の値ひとつで慌てない理由です。</p>\n<h3>「正規分布の現実」をもう一度</h3>\n<p>±2SDで基準範囲を作るのは、分布が<strong>正規に近い</strong>ときだけ妥当です。実際には、</p>\n<ul><li>TSH や IGF-1 のように<strong>右に裾を引く</strong>検査値は多い</li>\n<li>その場合、そのまま±2SDをとると下限が0以下になったりする</li>\n<li>だから<strong>対数変換してから</strong>正規分布を当てはめたり（第13話）、パーセンタイルで直接決めたりする</li></ul>\n<p>先輩：「IGF-1 のSDSって、年齢ごとに対数変換しとるんやな」「そう。正規分布が使えるように、データの方を整えている」。</p>", "keys": ["68-95-99.7ルール：±1SDに68%、±2SDに95%、±3SDに99.7%", "4SDより外は約1万5千分の1。極端なSDSは健常のばらつきでは説明しにくい", "基準範囲＝健常者の中央95%なら、健康でも1項目あたり約5%が範囲外", "独立な20項目なら少なくとも1つ外れる確率は約64%", "右に裾を引く検査値は対数変換やパーセンタイルで基準を作る"], "upd": null, "quiz": [{"v": "", "q": "正規分布で平均±2SDの範囲に入る割合は約。", "o": ["68%", "95%", "99.7%", "50%"], "a": 1, "e": "68-95-99.7ルール。正確には0.9545。", "r": "OpenIntro 4章"}, {"v": "", "q": "基準範囲が健常者の中央95%で作られている独立な検査を20項目測った。健康な人で少なくとも1つ範囲外になる確率は約。", "o": ["5%", "20%", "64%", "100%"], "a": 2, "e": "1−0.95²⁰≈0.64。たくさん測るほど健康な人にも異常値が出る。", "r": "OpenIntro 4章"}, {"v": "", "q": "右に裾を引く検査値で基準範囲を作るときの適切な対応は。", "o": ["そのまま平均±2SDをとる", "対数変換してから正規分布を当てはめる、またはパーセンタイルで決める", "最大値と最小値で決める", "平均±1SDにする"], "a": 1, "e": "正規に近くない分布に±2SDを当てはめると下限が不自然になる。", "r": "OpenIntro 4章"}], "course": "stat"}, {"id": "s30", "lv": 2, "t": "ベルヌーイと幾何分布：成功するまで何回？", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §4.2", "vol": "統計 第4章 確率変数の分布", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩の研究で、新たに条件に合う症例を集めることに。「外来に来るSGAの子で、同意をもらえるのは4人に1人くらいかな。何人に声をかけたら1人目が入る？」</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>「成功するまで何回かかるか」の分布。成功確率が1/4なら<strong>平均4回</strong>だが、5回以上かかることも3割ある。</div><h3>ベルヌーイ確率変数</h3>\n<p>結果が2通りしかない試行を、<strong>成功／失敗</strong>とラベルし、成功を<strong>1</strong>、失敗を<strong>0</strong>で表します。これが<strong>ベルヌーイ確率変数</strong>です。どちらを「成功」と呼ぶかは自由で、一貫していれば数学には影響しません（「病気になった」を成功と呼んでもよい）。</p>\n<p>0と1で表すと便利なことがあります。10人の結果が 1 1 1 0 1 0 0 1 1 0 なら、</p>\n<div class=\"formula\">標本比率 p̂ ＝ (1+1+1+0+1+0+0+1+1+0)／10 ＝ 0.6</div>\n<p><strong>割合は0/1データの平均</strong>。この見方は第6章の「割合の推測」の土台になります。成功確率 p のベルヌーイ変数の平均は p、標準偏差は √(p(1−p)) です。</p>\n<h3>幾何分布</h3>\n<p>独立で、成功確率が毎回同じ p のベルヌーイ試行（<strong>iid</strong>：独立で同一の分布）を繰り返し、<strong>最初の成功が n 回目</strong>になる確率は、</p>\n<div class=\"formula\">P(n 回目で初めて成功) ＝ (1−p)ⁿ⁻¹ × p</div>\n<p>n−1 回失敗して、最後に1回成功。独立なので掛け算です（第18話）。</p>\n<div class=\"formula\">平均 ＝ 1／p　　標準偏差 ＝ √(1−p)／p</div>\n<h3>先輩の症例集め</h3>\n<p>同意率 p＝0.25 なら、</p>\n<ul><li>1人目が入るまでに声をかける人数の平均は 1/0.25＝<strong>4人</strong></li>\n<li>標準偏差は √0.75／0.25 ≈ <strong>3.5人</strong></li>\n<li>4人以内に1人目が入る確率は 1−0.75⁴ ≈ <strong>68%</strong>（補事象で計算）</li></ul>\n<p>つまり<strong>3割くらいの確率で、5人以上声をかけても1人も入らない</strong>。平均4人だからといって、4人目で入る保証はありません。直感どおり、p が高ければ待ち時間は短く、p が低ければ長くなります（p＝0.8 なら平均1.25回、p＝0.1 なら平均10回）。</p>\n<h3>幾何分布は正規分布ではない</h3>\n<p>幾何分布は、n＝1 が一番確率が高く、そこから<strong>指数的に減っていく</strong>分布です。いつも<strong>右に強く歪んでいる</strong>ので、平均と標準偏差を使って正規分布で近似するのは<strong>不適切</strong>です。正規分布が便利だからといって、どこにでも使ってよいわけではありません。</p>\n<p>また、幾何分布は<strong>独立</strong>の仮定に強く依存します。同じ家族の兄弟に続けて声をかけるような状況では、独立性が崩れます。</p>", "keys": ["ベルヌーイ変数：成功1／失敗0。平均p、SD √(p(1−p))", "割合は0/1データの平均", "幾何分布：n回目で初めて成功する確率＝(1−p)ⁿ⁻¹p", "平均1/p、SD √(1−p)/p。p＝0.25なら平均4回", "幾何分布は右に強く歪むので正規近似は不適切。独立性が前提"], "upd": null, "quiz": [{"v": "", "q": "0/1データ 1,0,1,1,0 の標本比率は。", "o": ["0.4", "0.6", "3", "0.5"], "a": 1, "e": "割合は0/1データの平均。3/5=0.6。", "r": "OpenIntro 4章"}, {"v": "", "q": "同意率0.25のとき、1人目の同意を得るまでに声をかける人数の平均は。", "o": ["0.25人", "4人", "25人", "2人"], "a": 1, "e": "幾何分布の平均は1/p=4。", "r": "OpenIntro 4章"}, {"v": "", "q": "幾何分布を正規分布で近似することについて正しいのは。", "o": ["平均と標準偏差が分かれば常に適切", "右に強く歪んでいるので不適切", "n が大きければ適切", "p＝0.5のときだけ適切"], "a": 1, "e": "幾何分布はいつも右に歪んでおり、正規モデルで十分に近似できない。", "r": "OpenIntro 4章"}], "course": "stat"}, {"id": "s31", "lv": 3, "t": "二項分布：n人中k人の確率", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §4.3.1", "vol": "統計 第4章 確率変数の分布", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>遺伝外来。両親とも常染色体潜性（劣性）疾患の保因者。「3人きょうだいで、ちょうど1人が発症する確率は？」。答えは二項分布で出せます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>「n人中ちょうどk人」の確率は<strong>二項分布</strong>で計算できる。「効果がなくてもこれくらいは出る」が分かる。</div><p>幾何分布は「成功するまで何回か」。<strong>二項分布</strong>は「<strong>決まった回数 n のうち、成功がちょうど k 回</strong>」の確率です。</p>\n<h3>組み立て方</h3>\n<p>3人のうち1人だけ発症するシナリオは、「1人目だけ」「2人目だけ」「3人目だけ」の3通り。どれも確率は同じで、</p>\n<div class=\"formula\">0.25 × 0.75 × 0.75 ＝ 0.1406</div>\n<p>3通りあるので 3×0.1406＝<strong>0.42</strong>。考え方は</p>\n<div class=\"formula\">確率 ＝ [シナリオの数] × [1つのシナリオの確率]</div>\n<h3>二項分布の公式</h3>\n<p>シナリオの数は「n 個から k 個を選ぶ組み合わせ」 ₙCₖ ＝ n!／(k!(n−k)!)。1つのシナリオの確率は pᵏ(1−p)ⁿ⁻ᵏ。</p>\n<div class=\"formula\">P(k 回成功) ＝ ₙCₖ × pᵏ × (1−p)ⁿ⁻ᵏ</div>\n<div class=\"formula\">平均 ＝ np　　標準偏差 ＝ √(np(1−p))</div>\n<p>Rなら <code>dbinom(1, 3, 0.25)</code>、Excel なら <code>=BINOM.DIST(1,3,0.25,FALSE)</code>。</p>\n<h3>使ってよいかの4条件</h3>\n<ol><li>試行は<strong>独立</strong></li>\n<li>試行回数 n は<strong>固定</strong></li>\n<li>結果は<strong>成功か失敗</strong>のどちらか</li>\n<li>成功確率 p は<strong>毎回同じ</strong></li></ol>\n<p>教科書の確認問題：喫煙者の友人4人の肺疾患。<strong>友人同士が知り合いなら</strong>、喫煙習慣が似ていたり一緒に禁煙したりして、独立の条件が崩れるかもしれない、と答えています。きょうだいの遺伝なら、メンデルの法則で各子は独立なので条件を満たします。</p>\n<h3>先輩のGH研究に当ててみる</h3>\n<p>先輩の研究では、比較群の反応率が46%、治療群は31人中18人（58%）でした。ここで問いを立てます。</p>\n<div class=\"formula\">もし治療に効果がなく、治療群の本当の反応率も46%だったら、31人中18人以上が反応する確率は？</div>\n<p>二項分布 n＝31、p＝0.46 で計算すると、<strong>約0.12</strong>。平均は 31×0.46≈14.3人、SDは≈2.8人です。</p>\n<p>つまり、効果がなくても<strong>8回に1回くらいは</strong>この程度の差が偶然出る。第2章のカードのシミュレーションと同じ問いを、今度は<strong>式で</strong>解きました（設定が少し違うので数字も少し違います）。この「効果がないと仮定したら、これ以上極端な結果が出る確率」は、第5章で<strong>p値</strong>という名前で再登場します。</p>", "keys": ["二項分布：n回の独立試行で成功がちょうどk回の確率", "P(k)＝ₙCₖ pᵏ(1−p)ⁿ⁻ᵏ ＝ [シナリオ数]×[1シナリオの確率]", "平均np、SD √(np(1−p))", "4条件：独立・n固定・成功か失敗・pが一定", "「効果がないと仮定して、これ以上極端な結果が出る確率」は第5章のp値につながる"], "upd": null, "quiz": [{"v": "", "q": "両親とも常染色体潜性疾患の保因者。3人の子のうちちょうど1人が発症する確率は約。", "o": ["0.14", "0.25", "0.42", "0.75"], "a": 2, "e": "3C1×0.25×0.75²=3×0.1406≈0.42。", "r": "OpenIntro 4章"}, {"v": "", "q": "n＝40、p＝0.7 の二項分布の平均は。", "o": ["0.7", "12", "28", "40"], "a": 2, "e": "平均＝np＝40×0.7＝28。", "r": "OpenIntro 4章"}, {"v": "", "q": "二項分布の条件として当てはまらないものは。", "o": ["試行は独立", "試行回数は固定", "成功確率は毎回同じ", "成功するまで試行を続ける"], "a": 3, "e": "成功するまで続けるのは幾何分布（や負の二項分布）。二項分布は回数を先に決める。", "r": "OpenIntro 4章"}], "course": "stat"}, {"id": "s32", "lv": 3, "t": "正規近似と、まれな事象の数え方", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §4.3.2–4.5", "vol": "統計 第4章 確率変数の分布", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「さっきの二項分布、n が数百人になったら計算しんどくない？」。教科書も同じことを言っています。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>人数が多ければ二項分布は<strong>正規分布で近似</strong>できる。まれな事象の件数は<strong>ポアソン分布</strong>でばらつく。</div><h3>二項分布の正規近似</h3>\n<p>教科書の例：喫煙率15%の地域で400人を調べ、42人以下しか喫煙者がいない確率。二項分布で k＝0〜42 の43個を足すと <strong>0.0054</strong>。面倒です。</p>\n<p>n を大きくすると、二項分布の形は<strong>ギザギザで歪んだ形から、釣り鐘型</strong>に近づきます。条件は</p>\n<div class=\"formula\">np ≥ 10 かつ n(1−p) ≥ 10</div>\n<p>満たせば、N(np, √(np(1−p))) で近似できます。この例なら np＝60、n(1−p)＝340 で条件を満たし、μ＝60、σ＝7.14。Z＝(42−60)/7.14＝−2.52 → <strong>0.0059</strong>。正確な 0.0054 にかなり近い値です。</p>\n<p>先輩のGH研究（n＝31、p＝0.46）も np≈14.3、n(1−p)≈16.7 でぎりぎり条件を満たします。</p>\n<h3>狭い区間は苦手：0.5 補正</h3>\n<p>「400人中ちょうど49〜51人」のような<strong>狭い範囲</strong>では、正規近似はうまくいきません（正確 0.0649、近似 0.0421）。二項分布の棒は幅1を持つのに、正規曲線では両端が0.5ずつ削れてしまうからです。<strong>下限を0.5下げ、上限を0.5上げる</strong>と、0.0633 まで改善します。広い範囲では、この補正の効果はほとんど消えます。</p>\n<h3>まれな事象を数える：ポアソン分布</h3>\n<p>教科書は残りの節で負の二項分布とポアソン分布も紹介しています。本書の多くの部分の理解には必須ではない、という位置づけです。小児内分泌で役に立つのは<strong>ポアソン分布</strong>の方です。</p>\n<p>大きな集団で、<strong>まれな事象が一定期間に何件起きるか</strong>を表す分布です。パラメータは平均件数 <strong>λ</strong>（ラムダ）ひとつだけで、<strong>平均も分散も λ</strong>。</p>\n<div class=\"formula\">P(k 件) ＝ λᵏ e⁻λ ／ k!</div>\n<p>例：ある地域の年間出生が12,000人、ある疾患の頻度が1万8千人に1人だとすると、λ＝12000/18000≈0.67件／年。</p>\n<ul><li>1年で0件：e⁻⁰·⁶⁷ ≈ <strong>51%</strong></li>\n<li>1件：≈ 34%</li>\n<li>2件以上：≈ 14%</li></ul>\n<p>「去年は2人見つかったのに今年は0人」は、頻度が変わったからではなく、<strong>ポアソン分布の自然なばらつき</strong>で十分起こり得ます。まれな疾患の年ごとの件数に一喜一憂しない、という感覚につながります。</p>\n<h3>第4章の地図</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>話</th><th>覚えておくこと</th></tr>\n<tr><td>25</td><td>正規分布は N(μ, σ)。ほぼ従うが厳密ではない</td></tr>\n<tr><td>26</td><td>Zスコア＝SDS。単位が消える</td></tr>\n<tr><td>27</td><td>−2 SD 以下は 2.3%。必ず図を描く</td></tr>\n<tr><td>28</td><td>3パーセンタイル＝−1.88 SD。1.96 を覚える</td></tr>\n<tr><td>29</td><td>68-95-99.7。基準範囲外は健康でも5%</td></tr>\n<tr><td>30</td><td>割合は0/1の平均。幾何分布は歪む</td></tr>\n<tr><td>31</td><td>二項分布と4条件。「効果がなければ」の確率</td></tr>\n<tr><td>32</td><td>np≥10で正規近似。まれな件数はポアソン</td></tr></table></div>\n<p>先輩：「31人中18人以上が偶然出る確率が0.12。これって『効果なし』ってこと？」「それを判断する枠組みが、次の第5章<strong>推測の基礎</strong>。信頼区間とp値と仮説検定」。</p>", "keys": ["np≥10 かつ n(1−p)≥10 なら二項分布は N(np, √(np(1−p))) で近似できる", "狭い区間では正規近似が悪い。上下に0.5広げる補正で改善", "ポアソン分布：まれな事象の件数。平均＝分散＝λ", "λ≈0.67なら年0件が約51%。年ごとの件数のばらつきは自然に起こる", "第5章でこれらを使って信頼区間とp値を組み立てる"], "upd": null, "quiz": [{"v": "", "q": "二項分布を正規分布で近似してよい目安は。", "o": ["n ≥ 10", "np ≥ 10 かつ n(1−p) ≥ 10", "p ＝ 0.5", "n ≤ 30"], "a": 1, "e": "成功と失敗の期待数がどちらも10以上あること。", "r": "OpenIntro 4章"}, {"v": "", "q": "ポアソン分布の性質として正しいのは。", "o": ["平均と分散がどちらも λ", "平均が λ、分散が λ²", "パラメータは n と p の2つ", "左右対称な分布"], "a": 0, "e": "ポアソン分布はλ一つで決まり、平均＝分散＝λ。", "r": "OpenIntro 4章"}, {"v": "", "q": "まれな疾患の年間発見数が平均0.67件の地域で、ある年0件だった。最も適切な解釈は。", "o": ["疾患の頻度が下がった", "スクリーニングに問題がある", "偶然のばらつきで十分起こり得る（約51%）", "統計的に有意な減少"], "a": 2, "e": "ポアソン分布でP(0)=e^−0.67≈0.51。半分くらいの年は0件になる。", "r": "OpenIntro 4章"}], "course": "stat"}];
const ST5 = [{"id": "s33", "lv": 1, "t": "点推定と誤差：標本は毎回ちがう", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §5.1.1–5.1.2", "vol": "統計 第5章 推測の基礎", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「治療群の反応率58%。これが『本当の』反応率なん？」。もう一度31人集めたら、たぶん58%にはなりません。第5章はこの「毎回ちがう」を数字にする章です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>標本から出した数字は、<strong>標本を取り直すたびに変わる</strong>。その揺れの大きさが<strong>標準誤差（SE）</strong>。</div><p>統計的推測は、<strong>推定の不確かさを理解し、数字で表すこと</strong>から始まります。設定ごとに式は変わっても、基礎の考え方は統計学全体で同じ、と教科書は言います。</p>\n<h3>パラメータと点推定</h3>\n<ul><li><strong>パラメータ p</strong>：母集団全体の本当の割合。普通は分からない</li>\n<li><strong>点推定 p̂</strong>（ピーハット）：標本から計算した割合。p の推定に使う</li></ul>\n<p>先輩の研究なら、p は「SGA性低身長の子にGHを使ったときの本当の反応率」、p̂＝18/31＝0.58 はその点推定です。</p>\n<h3>誤差の2つの顔</h3>\n<div class=\"formula\">誤差 ＝ 標本誤差 ＋ 偏り</div>\n<ul><li><strong>標本誤差</strong>：標本ごとに推定値がばらつくこと。ある標本では1%低く、別の標本では3%高い。<strong>統計学のほとんどは、この誤差を理解し定量化すること</strong>に集中している</li>\n<li><strong>偏り（バイアス）</strong>：真の値より系統的に高く／低く出る傾向。誘導的な質問の仕方などで生じる。これは<strong>データの集め方</strong>（第1章）で防ぐもの</li></ul>\n<h3>シミュレーションで「ばらつき」を見る</h3>\n<p>教科書の例：アメリカ成人の88%が太陽光エネルギー拡大を支持しているとします（p＝0.88）。1000人を無作為に選んで p̂ を計算する、を<strong>1万回</strong>繰り返すと、</p>\n<ul><li>1回目 0.894（誤差 ＋0.014）、2回目 0.885、3回目 0.878…</li>\n<li>1万個の p̂ のヒストグラムは、<strong>中心が0.880</strong>、<strong>標準偏差0.010</strong>、<strong>釣り鐘型</strong></li></ul>\n<p>この「p̂ の分布」を<strong>標本分布</strong>と呼びます。そして、標本分布の標準偏差には特別な名前があります。</p>\n<div class=\"formula\">標本分布の標準偏差 ＝ <strong>標準誤差（SE）</strong></div>\n<p>SD はデータ一つひとつのばらつき、SE は<strong>推定値のばらつき</strong>。論文の表で「mean ± SD」と「mean ± SE」が混在していたら、何を見せたいのかを必ず確認してください。</p>\n<h3>標本分布は観測できない</h3>\n<p>現実には、研究は1回しかできません。標本分布を<strong>実際に見ることは決してない</strong>。それでも、「自分の p̂ は、この仮想的な分布から1つ引いたもの」と考えておくと、手元の推定値の意味が分かります。</p>\n<p>そして直感どおり、<strong>標本が小さいほど標本分布は広がります</strong>（n＝50 なら SE は約0.046、n＝1000 の4倍以上）。31人の58%は、1000人の58%よりずっと揺れている。次の話で、その揺れを式にします。</p>", "keys": ["パラメータp（母集団の真の値）と点推定p̂（標本からの推定）", "誤差＝標本誤差（ばらつき）＋偏り（系統的なずれ）", "偏りはデータの集め方で防ぐ。統計の手法が扱うのは主に標本誤差", "p̂の分布＝標本分布。その標準偏差＝標準誤差SE", "SDはデータのばらつき、SEは推定値のばらつき。標本が小さいほどSEは大きい"], "upd": null, "quiz": [{"v": "", "q": "標本分布の標準偏差を何と呼ぶか。", "o": ["標準偏差", "標準誤差", "分散", "誤差の範囲"], "a": 1, "e": "推定値のばらつき＝標準誤差（SE）。データのばらつき（SD）と区別する。", "r": "OpenIntro 5章"}, {"v": "", "q": "誘導的な質問文で回答が一方向にずれるのはどちらの誤差か。", "o": ["標本誤差", "偏り（バイアス）", "丸め誤差", "測定の精度"], "a": 1, "e": "系統的なずれは偏り。統計手法ではなくデータの集め方で防ぐ。", "r": "OpenIntro 5章"}, {"v": "", "q": "p＝0.88 の母集団から n＝50 と n＝1000 の標本を取るとき、p̂ のばらつきは。", "o": ["n＝50 の方が大きい", "n＝1000 の方が大きい", "同じ", "pによる"], "a": 0, "e": "標本が小さいほど標本分布は広がる。", "r": "OpenIntro 5章"}], "course": "stat"}, {"id": "s34", "lv": 2, "t": "中心極限定理：p̂はなぜ正規分布になるか", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §5.1.3–5.1.5", "vol": "統計 第5章 推測の基礎", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「1万回のシミュレーション、毎回やるわけにいかんやろ？」。その通り。だから<strong>式</strong>があります。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>人数が多いほど推定は安定する。ただし<strong>精度を2倍にするには人数は4倍</strong>必要。</div><p>シミュレーションの標本分布が釣り鐘型だったのは偶然ではありません。<strong>中心極限定理</strong>という一般原理の結果です。</p>\n<h3>中心極限定理（割合版）</h3>\n<p>観測値が<strong>独立</strong>で、標本サイズが<strong>十分大きい</strong>とき、p̂ はおよそ次の正規分布に従う。</p>\n<div class=\"formula\">平均 ＝ p　　SE ＝ √( p(1−p) ／ n )</div>\n<p>p＝0.88、n＝1000 なら SE＝√(0.88×0.12/1000)＝<strong>0.010</strong>。1万回のシミュレーションと同じ値が、一行の式で出ます。</p>\n<h3>2つの条件</h3>\n<ol><li><strong>独立性</strong>：単純無作為抽出、または<strong>ランダム化比較試験</strong>で処置群に無作為に割り付けられていれば独立と考えてよい。同じ家族、同じクラスタからの観測が多いと崩れる</li>\n<li><strong>成功・失敗条件</strong>：np ≥ 10 かつ n(1−p) ≥ 10（第4章の正規近似と同じ）</li></ol>\n<h3>p が分からないときは p̂ で代用</h3>\n<p>現実には p は未知（だから調べている）。そこで条件の確認にも SE の計算にも <strong>p̂ を代入</strong>します。これを<strong>代入原理（plug-in principle）</strong>と呼びます。</p>\n<p>先輩の研究：p̂＝0.58、n＝31。</p>\n<ul><li>n p̂ ＝ 18、n(1−p̂) ＝ 13 → どちらも10以上で、<strong>ぎりぎり</strong>条件を満たす</li>\n<li>SE ＝ √(0.58×0.42／31) ≈ <strong>0.089</strong></li></ul>\n<p>反応率の推定が、±9%くらい揺れて当然、ということです。</p>\n<h3>n と SE の関係</h3>\n<p>SE の式では n が<strong>分母のルートの中</strong>にあります。</p>\n<div class=\"formula\">SE を半分にしたければ、n を<strong>4倍</strong>にする</div>\n<p>n＝1000 で SE 0.010、n＝4000 で 0.005。精度を上げるコストは高くつきます。研究計画で症例数を決めるとき、この「√n」の感覚が効いてきます。</p>\n<h3>条件を満たさないと</h3>\n<p>教科書は n＝10、p＝0.25（np＝2.5）のシミュレーションを見せます。標本分布は<strong>ガタガタで、右に歪み</strong>、同じ平均・SDの正規分布とは明らかに別物。シミュレーションからは次の傾向も読み取れます。</p>\n<ul><li>標本分布の中心はいつも p にある（無作為抽出なら p̂ は<strong>偏りがない</strong>）</li>\n<li>n が大きいほどばらつきは小さい</li>\n<li>同じ n なら、<strong>p＝0.5 のときばらつきが最大</strong></li></ul>\n<p>この考え方は割合だけでなく、<strong>平均</strong>（第7章）や<strong>回帰係数</strong>（第8〜9章）にもそのまま広がっていきます。</p>", "keys": ["中心極限定理：独立かつnが十分大きければp̂は平均p、SE √(p(1−p)/n)の正規分布", "条件：独立性（無作為抽出・無作為割付）と成功・失敗条件（np, n(1−p) ≥ 10）", "pが未知ならp̂を代入（plug-in原理）", "SEを半分にするにはnを4倍。精度はnの平方根でしか上がらない", "同じnならp＝0.5でばらつき最大"], "upd": null, "quiz": [{"v": "", "q": "p̂＝0.58、n＝31 のときの標準誤差は約。", "o": ["0.019", "0.089", "0.42", "0.58"], "a": 1, "e": "√(0.58×0.42/31)≈0.089。", "r": "OpenIntro 5章"}, {"v": "", "q": "標準誤差を半分にしたい。標本サイズはどうすればよいか。", "o": ["2倍", "4倍", "半分", "√2倍"], "a": 1, "e": "SEは1/√nに比例するので、半分にするにはnを4倍。", "r": "OpenIntro 5章"}, {"v": "", "q": "中心極限定理を割合に適用するための条件として正しい組み合わせは。", "o": ["正規母集団と大きなn", "独立性と np, n(1−p) ≥ 10", "n ≥ 30 のみ", "p＝0.5 であること"], "a": 1, "e": "観測値の独立性と成功・失敗条件の2つ。", "r": "OpenIntro 5章"}], "course": "stat"}, {"id": "s35", "lv": 2, "t": "信頼区間：銛ではなく網で捕まえる", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §5.2.1–5.2.2", "vol": "統計 第5章 推測の基礎", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「論文には『反応率58%』だけ書けばいい？」「それだと、どれくらい揺れているかが伝わらん」。点ではなく<strong>幅</strong>で示します。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b><strong>信頼区間</strong>は「本当の値がありそうな範囲」。点推定値±約2×SE。31人では幅がかなり広い。</div><h3>銛と網</h3>\n<p>教科書のたとえが秀逸です。点推定だけを報告するのは、<strong>濁った湖で銛を投げて魚を突く</strong>ようなもの。だいたい外れます。<strong>網を投げれば</strong>、捕まえられる可能性が高い。その網が<strong>信頼区間</strong>です。</p>\n<p>確実に魚を捕まえたければ、網を<strong>大きく</strong>する。信頼区間も、確実にしたければ<strong>広く</strong>なります。</p>\n<h3>95%信頼区間の作り方</h3>\n<p>中心極限定理の条件を満たせば、p̂ は正規分布に従います。正規分布では95%が平均±1.96 SD の範囲に入る（第28話の1.96）。そこで、</p>\n<div class=\"formula\">95%信頼区間 ＝ 点推定値 ± 1.96 × SE</div>\n<h3>先輩の研究で計算する</h3>\n<p>p̂＝0.58、SE＝0.089（第34話）。</p>\n<div class=\"formula\">0.58 ± 1.96 × 0.089 → <strong>(0.41, 0.75)</strong></div>\n<p>「GHの反応率は41%から75%の間である、と95%の信頼をもって言える」。<strong>思ったより広い</strong>、というのが正直な感想だと思います。31人では、反応率について言えるのはこの程度です。比較群の46%も、この区間の<strong>中に入っています</strong>。</p>\n<h3>「95%の信頼」とは何か</h3>\n<p>ここが一番誤解されるところです。</p>\n<div class=\"formula\">同じ方法で標本を何度も取り、毎回95%信頼区間を作ると、<strong>そのうち約95%</strong>が真の p を含む</div>\n<p>教科書の図では、25個の区間のうち24個が p＝0.88 を含み、1個だけ外れていました。外れた1個があるからといって p＝0.88 が間違っていたわけではありません。観測値が平均から1.96 SD 以上離れることが自然にあるのと同じで、<strong>点推定値が1.96 SE 以上離れることも自然にある</strong>。</p>\n<p>信頼区間は「もっともらしい値の範囲」です。区間の外の値は「ありそうにない」とは言えても、「不可能」とまでは言えません。</p>\n<h3>論文での書き方</h3>\n<p>教科書は、信頼区間を報告するときは<strong>パーセントで小数第1位まで</strong>に丸めるのが一般的だとしています。医学論文なら「反応率 58.1%（95% CI 40.7–75.4%）」。点推定と区間を必ずセットで書く習慣が、読み手への誠実さです。</p>", "keys": ["点推定は銛、信頼区間は網。確実にしたいほど区間は広くなる", "95%信頼区間＝点推定値 ± 1.96 × SE（中心極限定理の条件下）", "先輩の研究：0.58 ± 1.96×0.089 → (0.41, 0.75)。31人では幅が広い", "「95%信頼」＝同じ方法で何度も区間を作ると約95%が真の値を含む", "区間外の値はありそうにないが不可能ではない"], "upd": null, "quiz": [{"v": "", "q": "p̂＝0.887、SE＝0.010 のときの95%信頼区間は。", "o": ["(0.877, 0.897)", "(0.867, 0.907)", "(0.787, 0.987)", "(0.857, 0.917)"], "a": 1, "e": "0.887 ± 1.96×0.010 ＝ 0.887 ± 0.0196。", "r": "OpenIntro 5章"}, {"v": "", "q": "「95%信頼区間」の意味として正しいのは。", "o": ["データの95%がこの区間に入る", "同じ方法で何度も区間を作ると約95%が真のパラメータを含む", "次の研究の推定値が95%の確率でこの区間に入る", "p値が0.05以下である"], "a": 1, "e": "信頼水準は「区間を作る方法」の成功率。個々のデータや将来の推定値についての主張ではない。", "r": "OpenIntro 5章"}, {"v": "", "q": "母比率をより確実に捕まえたいとき、信頼区間はどうすべきか。", "o": ["狭くする", "広くする", "中心をずらす", "変えない"], "a": 1, "e": "網を大きくするのと同じ。信頼水準を上げると区間は広がる。", "r": "OpenIntro 5章"}], "course": "stat"}, {"id": "s36", "lv": 2, "t": "信頼水準を変える・区間を正しく読む", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §5.2.3–5.2.5", "vol": "統計 第5章 推測の基礎", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>共同研究者のメールに「99%信頼区間も出してほしい」。先輩：「1.96 の代わりに何を入れるん？」</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>「95%信頼区間」は<strong>同じ方法で何度も作ると95%が当たる</strong>という意味。偏りまでは直せない。</div><h3>z* を取り替える</h3>\n<p>信頼区間の部品は3つ。点推定値、「1.96」、SE。この「1.96」が信頼水準を決めています。</p>\n<div class=\"formula\">信頼区間 ＝ 点推定値 ± z* × SE</div>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>信頼水準</th><th>z*</th><th>両側の裾</th></tr>\n<tr><td>90%</td><td>1.65</td><td>5%ずつ</td></tr>\n<tr><td>95%</td><td>1.96</td><td>2.5%ずつ</td></tr>\n<tr><td>99%</td><td>2.58</td><td>0.5%ずつ</td></tr></table></div>\n<p>z* × SE の部分を<strong>誤差の範囲（margin of error）</strong>と呼びます。世論調査の「誤差±3%」はこれです。</p>\n<p>先輩の研究（0.58、SE 0.089）なら、90%で (0.43, 0.73)、95%で (0.41, 0.75)、99%で (0.35, 0.81)。信頼水準を上げるほど網は広がります。</p>\n<h3>4つのステップ</h3>\n<ol><li><strong>準備</strong>：p̂ と n を確認し、信頼水準を決める</li>\n<li><strong>確認</strong>：独立性と成功・失敗条件（p̂ で代用）</li>\n<li><strong>計算</strong>：SE を出し、z* を選び、区間を作る</li>\n<li><strong>結論</strong>：状況に即した言葉で解釈する</li></ol>\n<h3>区間を正しく読むための4つの注意</h3>\n<p><strong>1. いつも母集団のパラメータについての主張</strong>。「SGA性低身長児全体の反応率」についてであって、「この31人」についてではありません。</p>\n<p><strong>2. 「真の値がこの区間に入る確率が95%」と言わない</strong>。便利な言い方ですが、教科書はよくある誤りとして避けています。95%は<strong>区間を作る方法</strong>の信頼度です。</p>\n<p><strong>3. 個々の観測値や、将来の推定値についての主張ではない</strong>。教科書の確認問題：「次の調査結果が87.1〜90.4%に入ることに90%の信頼がある」と言えるか？ → <strong>言えない</strong>。「次に治療する子の反応確率」も、この区間からは言えません。</p>\n<p><strong>4. 扱えるのは標本誤差だけで、偏りは扱えない</strong>。データの集め方が系統的にずれていれば、信頼区間をいくら丁寧に計算しても、ずれた場所に網を投げていることになります。</p>\n<h3>時間も条件のひとつ</h3>\n<p>教科書は、2014年のエボラ流行直後のニューヨークの世論調査（隔離支持82%、95% CI 79.6〜84.4%）について、「<strong>今日も有効か</strong>」と問います。答えは「必ずしもそうではない」。人々の関心が変われば意見も変わる。治療成績も、<strong>時代や施設が変われば</strong>同じ区間が通用するとは限りません。</p>", "keys": ["信頼区間＝点推定値 ± z*×SE。z*は90%で1.65、95%で1.96、99%で2.58", "z*×SEを誤差の範囲（margin of error）と呼ぶ", "区間は母集団のパラメータについての主張。個々の観測値や将来の推定値についてではない", "「真の値が区間に入る確率95%」は誤った言い方。95%は方法の信頼度", "信頼区間は標本誤差のみを扱い、偏りは扱えない"], "upd": null, "quiz": [{"v": "", "q": "99%信頼区間で使う z* は約。", "o": ["1.65", "1.96", "2.33", "2.58"], "a": 3, "e": "両側0.5%ずつの裾に対応するのは2.58。", "r": "OpenIntro 5章"}, {"v": "", "q": "ある調査の90%信頼区間が(87.1%, 90.4%)。次に同じ調査をしたとき、その結果がこの区間に入ることに90%の信頼があると言えるか。", "o": ["言える", "言えない。信頼区間はパラメータについての範囲で、将来の推定値についてではない", "95%なら言える", "標本サイズが同じなら言える"], "a": 1, "e": "信頼区間はあくまで母集団のパラメータについての主張。", "r": "OpenIntro 5章"}, {"v": "", "q": "信頼区間で対処できないものは。", "o": ["標本サイズが小さいことによる不確かさ", "データの集め方による系統的な偏り", "信頼水準の選択", "標準誤差の大きさ"], "a": 1, "e": "信頼区間は標本誤差のみを扱う。偏りは慎重なデータ収集で防ぐ。", "r": "OpenIntro 5章"}], "course": "stat"}, {"id": "s37", "lv": 2, "t": "仮説検定の枠組み：疑ってかかる", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §5.3.1–5.3.2", "vol": "統計 第5章 推測の基礎", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>教授回診で先輩が発表。「GHで反応率が上がりました」。教授：「それ、偶然じゃないとどうして言える？」。この問いに答える形式が仮説検定です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>仮説検定はまず「<strong>差はない</strong>」と疑ってかかる。棄却できなくても「差がない」と証明されたわけではない。</div><h3>2つの仮説</h3>\n<ul><li><strong>帰無仮説 H₀</strong>：懐疑的な立場。「差はない」「効果はない」</li>\n<li><strong>対立仮説 Hₐ</strong>：検討したい主張。「差がある」</li></ul>\n<p>統計家は、対立仮説を受け入れる前に<strong>強い証拠を求める懐疑論者</strong>の立場に立ちます。教授の「偶然じゃないと言えるか」は、まさにこの立場です。</p>\n<p>教科書の例は、ロスリング『ファクトフルネス』の3択クイズ（「世界の1歳児のうち予防接種を受けている割合は？ 20%／50%／80%」、正解は80%）。でたらめに答えたら正答率は1/3。</p>\n<div class=\"formula\">H₀：p ＝ 0.333　　Hₐ：p ≠ 0.333</div>\n<p>比べる基準の値（0.333）を<strong>帰無値 p₀</strong> と呼びます。</p>\n<h3>裁判のアナロジー</h3>\n<p>被告は<strong>無罪（H₀）</strong>と推定され、有罪（Hₐ）とするには<strong>合理的な疑いを超える証拠</strong>が要る。そして、</p>\n<div class=\"formula\">証拠不十分で無罪 ≠ 無実が証明された</div>\n<p>仮説検定も同じです。<strong>H₀ を棄却できなかったことは、H₀ が正しいと認めたことではありません</strong>。統計で「帰無仮説を棄却できなかった」「疑わしいとは言えない」といった<strong>二重否定</strong>がよく出てくるのは、この「否定もしないが肯定もしない」を正確に言うためです。</p>\n<h3>信頼区間で検定する</h3>\n<p><strong>例1</strong>：大卒50人中24%が予防接種の問いに正解。95% CI は (0.122, 0.358)。帰無値0.333 は<strong>区間の中</strong> → H₀ を棄却しない。「でたらめと違う」と言える証拠は不十分。ただし差がないとは言っていません。<strong>50人では見抜けなかった</strong>だけかもしれない。</p>\n<p><strong>例2</strong>：別の問い（2100年の子どもの数）で、大卒228人中14.9%が正解。95% CI は (0.103, 0.195)。0.333 は<strong>区間の外</strong> → H₀ を棄却。しかも区間全体が0.333より下なので、<strong>でたらめよりも悪い</strong>。人は世界の進歩を実際より悲観的に見がちだ、というロスリングの主張と一致します。</p>\n<h3>先輩の研究</h3>\n<p>反応率の95% CI は (0.41, 0.75)。比較群の46%は<strong>区間の中</strong>にあります。教授への答えは「偶然でないとは、まだ言えません」。ただし、「効果がない」とも言っていない。31人では判断できない、が正確な言い方です。</p>\n<p>（厳密には、比較群の46%にもばらつきがあるので、2群を比べる正式な方法は第6章で扱います。）</p>", "keys": ["帰無仮説H₀＝懐疑的立場（差はない）、対立仮説Hₐ＝検討したい主張", "H₀を棄却するには強い証拠が要る", "H₀を棄却できない ≠ H₀が正しい。二重否定はこのため", "帰無値が信頼区間の外ならH₀を棄却、中なら棄却しない", "小さな標本では差を見抜けないことがある"], "upd": null, "quiz": [{"v": "", "q": "仮説検定における帰無仮説が表すのは。", "o": ["研究者が証明したい主張", "懐疑的な立場や『差はない』という見方", "必ず正しい仮説", "対立仮説の逆の結論"], "a": 1, "e": "H₀は懐疑的な立場。強い証拠があって初めて棄却する。", "r": "OpenIntro 5章"}, {"v": "", "q": "H₀ を棄却できなかったときの正しい解釈は。", "o": ["H₀が正しいと証明された", "H₀を棄却する十分な証拠がなかった", "Hₐが正しい", "研究は失敗だった"], "a": 1, "e": "裁判の「証拠不十分で無罪」と同じ。無実の証明ではない。", "r": "OpenIntro 5章"}, {"v": "", "q": "95% CI が (0.103, 0.195)、帰無値が0.333。結論は。", "o": ["H₀を棄却しない", "H₀を棄却する（帰無値が区間の外）", "判断できない", "H₀が正しい"], "a": 1, "e": "帰無値が区間の外にあるので、もっともらしくないと判断してH₀を棄却する。", "r": "OpenIntro 5章"}], "course": "stat"}, {"id": "s38", "lv": 2, "t": "2種類の過誤：冤罪と見逃し", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §5.3.3", "vol": "統計 第5章 推測の基礎", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「有意差なしって書いたら、効果ないってことになるん？」「それ、見逃しの可能性もある」。仮説検定は完璧ではありません。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>検定の誤りは2種類：<strong>差がないのにあると言う（偽陽性）</strong>と、<strong>差があるのに見逃す（偽陰性）</strong>。</div><h3>4つのシナリオ</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>H₀ を棄却しない</th><th>H₀ を棄却</th></tr>\n<tr><td><strong>H₀ が真</strong></td><td>正しい判断</td><td><strong>第1種の過誤</strong></td></tr>\n<tr><td><strong>Hₐ が真</strong></td><td><strong>第2種の過誤</strong></td><td>正しい判断</td></tr></table></div>\n<ul><li><strong>第1種の過誤</strong>：本当は差がないのに「差がある」とする。<strong>冤罪</strong>。効かない薬を「効く」と言う</li>\n<li><strong>第2種の過誤</strong>：本当は差があるのに「差がない」とする。<strong>犯人を逃がす</strong>。効く薬を見逃す</li></ul>\n<h3>スクリーニング検査と同じ構造</h3>\n<p>第19〜20話の感度・特異度を思い出すと分かりやすくなります。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>仮説検定</th><th>スクリーニング</th></tr>\n<tr><td>第1種の過誤</td><td>偽陽性（病気でないのに陽性）</td></tr>\n<tr><td>第2種の過誤</td><td>偽陰性（病気を見逃す）</td></tr></table></div>\n<p>新生児スクリーニングのカットオフを下げれば見逃しは減るが偽陽性が増える。上げれば逆。仮説検定も同じです。</p>\n<h3>片方を減らすと、もう片方が増える</h3>\n<p>教科書は裁判で説明します。冤罪を減らそうと有罪の基準を「合理的な疑い」から「考えうる限りの疑い」に上げると、本当の犯人も有罪にしにくくなる（第2種が増える）。逆に基準を下げれば冤罪が増える。</p>\n<div class=\"formula\">一方の誤りを減らすと、一般に他方の誤りが増える</div>\n<h3>有意水準 α</h3>\n<p>一般的な目安として、<strong>H₀ が真なのに誤って棄却する</strong>のは5%までにしたい。これが<strong>有意水準 α＝0.05</strong>です。</p>\n<div class=\"formula\">α ＝ H₀ が真のとき、誤って棄却する確率（第1種の過誤の上限）</div>\n<p>95%信頼区間で検定するのは、α＝0.05 の検定と同じです。H₀ が真でも、点推定が1.96 SE 以上ずれるのは5%（両側2.5%ずつ）だからです。99%区間なら α＝0.01。</p>\n<h3>先輩の研究にとっての意味</h3>\n<p>31人では、仮に本当に効果があっても、検出できない（第2種の過誤）確率がかなり高い。「有意差なし」は「効果なし」ではなく、<strong>「この症例数では判断できなかった」</strong>かもしれない。</p>\n<p>第2種の過誤を減らす一番まっとうな方法は、<strong>データを増やす</strong>ことです。教科書も、データ収集のコストが第2種の過誤のコストより小さければ、もっと集めるのがよい戦略だと述べています。症例数が増えれば、第1種の過誤（α）を変えずに第2種の過誤を減らせます。</p>", "keys": ["第1種の過誤：H₀が真なのに棄却（冤罪・偽陽性）", "第2種の過誤：Hₐが真なのに棄却しない（見逃し・偽陰性）", "一方を減らすと他方が増えるトレードオフ", "有意水準α＝第1種の過誤を犯す確率の上限。通常0.05", "データを増やせばαを変えずに第2種の過誤を減らせる"], "upd": null, "quiz": [{"v": "", "q": "効かない新薬を「既存薬より有効」と結論してしまうのは。", "o": ["第1種の過誤", "第2種の過誤", "正しい判断", "偏り"], "a": 0, "e": "H₀（差がない）が真なのに棄却している。冤罪型の誤り。", "r": "OpenIntro 5章"}, {"v": "", "q": "本当は有効な治療を、症例数が少なく「有意差なし」としてしまうのは。", "o": ["第1種の過誤", "第2種の過誤", "正しい判断", "α の誤り"], "a": 1, "e": "Hₐが真なのにH₀を棄却できない。見逃し型の誤り。", "r": "OpenIntro 5章"}, {"v": "", "q": "第1種の過誤の率を変えずに第2種の過誤を減らす方法は。", "o": ["αを大きくする", "αを小さくする", "標本サイズを増やす", "片側検定にする"], "a": 2, "e": "データを増やすと、αを保ったまま見逃しが減る。", "r": "OpenIntro 5章"}], "course": "stat"}, {"id": "s39", "lv": 3, "t": "p値：偶然でこれ以上が出る確率", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §5.3.4", "vol": "統計 第5章 推測の基礎", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>教授：「で、p値はいくつ？」。先輩、言葉に詰まる。p値は医学論文で最も目にし、最も誤解される数字です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b><strong>p値</strong>は「差がないと仮定したら、これ以上極端な結果が出る確率」。差がない確率ではない。</div><h3>p値の定義</h3>\n<div class=\"formula\">p値 ＝ <strong>もし帰無仮説が真だったら</strong>、今のデータと同じか、それ以上に対立仮説寄りのデータが観測される確率</div>\n<p>第31話の「効果がないと仮定して、31人中18人以上が反応する確率」は、まさにこの考え方でした。</p>\n<h3>信頼区間との違い：p₀ を使う</h3>\n<p>p値の計算では<strong>H₀ が真だと仮定</strong>するので、条件の確認と SE の計算に、p̂ ではなく<strong>帰無値 p₀</strong> を使います。ここが信頼区間との違いです。</p>\n<div class=\"formula\">SE ＝ √( p₀(1−p₀) ／ n )　　Z ＝ (p̂ − p₀) ／ SE</div>\n<p>この Z を<strong>検定統計量</strong>と呼びます。第26話で予告したとおり、Zスコアそのものです。H₀ の下での p̂ の分布を<strong>帰無分布</strong>と呼びます。</p>\n<h3>4つのステップ</h3>\n<ol><li><strong>準備</strong>：パラメータを特定し、仮説を立て、α を決め、p̂ と n を確認</li>\n<li><strong>確認</strong>：独立性と、<strong>p₀ を使った</strong>成功・失敗条件</li>\n<li><strong>計算</strong>：p₀ で SE、Z、p値を出す</li>\n<li><strong>結論</strong>：p値と α を比べ、状況に即して述べる</li></ol>\n<h3>先輩の研究で計算する</h3>\n<p>比較群の46%を基準の値として、治療群（31人中18人）を検定してみます。</p>\n<ul><li>H₀：p＝0.46　Hₐ：p≠0.46</li>\n<li>条件：31×0.46≈14、31×0.54≈17、どちらも10以上</li>\n<li>SE＝√(0.46×0.54／31)≈0.090</li>\n<li>Z＝(0.581−0.46)／0.090≈<strong>1.35</strong></li>\n<li>両側なので上側の面積を<strong>2倍</strong>：p値≈<strong>0.18</strong></li></ul>\n<p>0.18 ＞ 0.05 なので H₀ を棄却しない。「46%と違うと言える十分な証拠はない」。</p>\n<p>なぜ2倍するのか。Hₐ は「≠」なので、46%より<strong>低い</strong>方向にも同じくらい極端な結果（34%程度）が出る可能性を含めるからです。</p>\n<h3>教科書の極端な例</h3>\n<p>1000人中37%が石炭利用拡大に賛成。H₀：p＝0.5 なら SE＝0.016、Z＝−8.1、p値は約 <strong>4×10⁻¹⁶</strong>。「H₀ が真で1000兆回に1回の偶然が起きた」か「H₀ が間違っている」か。後者がはるかにありそうなので、H₀ を棄却します。</p>\n<h3>p値でないもの</h3>\n<ul><li>p値は「<strong>H₀ が正しい確率</strong>」ではない（H₀ が真と<strong>仮定した</strong>うえでの確率）</li>\n<li>p値は<strong>効果の大きさ</strong>ではない（次の話）</li>\n<li>p＝0.18 は「効果がない証拠」ではない（第37話）</li></ul>", "keys": ["p値：H₀が真なら、観測データ以上に極端な結果が出る確率", "p値計算ではSEも条件確認も帰無値p₀を使う（信頼区間はp̂）", "検定統計量Z＝(p̂−p₀)/SE。両側検定では裾の面積を2倍", "p値＜αならH₀を棄却。先輩の研究はZ≈1.35、p≈0.18で棄却しない", "p値はH₀が正しい確率でも効果の大きさでもない"], "upd": null, "quiz": [{"v": "", "q": "p値の定義として正しいのは。", "o": ["帰無仮説が正しい確率", "帰無仮説が真だと仮定したとき、観測以上に極端なデータが出る確率", "対立仮説が正しい確率", "効果の大きさ"], "a": 1, "e": "p値はH₀が真という仮定の下での確率。H₀が正しい確率ではない。", "r": "OpenIntro 5章"}, {"v": "", "q": "比率の仮説検定で標準誤差を計算するときに使うのは。", "o": ["標本比率 p̂", "帰無値 p₀", "p̂ と p₀ の平均", "0.5 固定"], "a": 1, "e": "H₀が真と仮定するので帰無値p₀を使う。信頼区間ではp̂を使う。", "r": "OpenIntro 5章"}, {"v": "", "q": "両側検定で Z＝1.35 の上側確率が0.089のとき、p値は。", "o": ["0.089", "0.178", "0.911", "0.045"], "a": 1, "e": "反対側の同じくらい極端な結果も含めるので2倍する。", "r": "OpenIntro 5章"}], "course": "stat"}, {"id": "s40", "lv": 3, "t": "有意水準の選び方・有意と意味のある差", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §5.3.5–5.3.7", "vol": "統計 第5章 推測の基礎", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「じゃあ、症例を増やして p＜0.05 になったら、それで勝ち？」。そう単純でもありません。第5章の最後は、p値と付き合うための注意です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b><strong>有意＝意味がある、ではない</strong>。大人数ならごく小さな差も有意になる。差の大きさを必ず見る。</div><h3>α は状況で選ぶ</h3>\n<p>α＝0.05 は伝統的な値ですが、教科書は<strong>結論の重みに応じて調整してよい</strong>と言います。</p>\n<ul><li><strong>第1種の過誤が危険・高コスト</strong>なら α を小さく（0.01など）。例：高価で、壊れていても機械が動く部品は、壊れていると<strong>かなり確実なときだけ</strong>交換する</li>\n<li><strong>第2種の過誤の方が危険</strong>なら α を大きく（0.10など）。例：安全関連部品は、わずかな改善の証拠でも切り替えたい</li></ul>\n<p>なぜ0.05 なのかに疑問を持ったなら、「批判的に読めている証拠だ、よくやった」と教科書は書いています。</p>\n<h3>統計的に有意 ≠ 意味がある</h3>\n<p>標本が大きくなると SE は小さくなり、<strong>ごくわずかな差でも「有意」</strong>になります。</p>\n<p>たとえば100万人で賛成50.2%なら、H₀：p＝0.5 に対して Z＝4、p値は約0.00006。<strong>統計的には有意</strong>ですが、0.2%の差に実務上の意味はほとんどありません。教科書の例は「広告で視聴率が0.001%有意に増えた」。</p>\n<div class=\"formula\">統計的有意性：偶然で説明できるか　／　臨床的（実務的）有意性：その差に意味があるか</div>\n<p>医学なら、<strong>身長SDSが0.05上がって p＜0.001</strong> でも、子どもと家族にとって意味のある差かは別問題です。論文を読むときは、p値の横の<strong>効果の大きさと信頼区間</strong>を必ず見てください。</p>\n<h3>症例数は研究の前に決める</h3>\n<p>教科書は、研究者の仕事の一つに<strong>標本サイズの計画</strong>を挙げています。専門家や文献から「意味のある最小の差」を決め、p のおおよその見当から SE を見積もり、その差を見抜けるだけの n を提案する。特に医学研究では、参加者への潜在的なリスクやコストを考えるときにこの計算が役立つ、と書いています。</p>\n<h3>片側検定は、まず使わない</h3>\n<p>Hₐ を「p＞p₀」のように片方向だけにすると、p値は裾の面積を2倍しないので小さくなります。魅力的ですが、教科書は<strong>非常にまれにしか適切でない</strong>と言います。</p>\n<p>第1章のステント研究がその理由です。研究者はステントが脳卒中を<strong>防ぐ</strong>と信じていましたが、データは<strong>悪化</strong>を示しました。片側検定なら、この<strong>害</strong>を見落としていたかもしれない。</p>\n<p>さらに、<strong>データを見てから</strong>片側検定の向きを選ぶと、実際の第1種の過誤は α＝0.05 ではなく<strong>0.10</strong> になります。教科書はこれ以降、両側検定だけを使います。</p>\n<h3>第5章の地図</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>話</th><th>覚えておくこと</th></tr>\n<tr><td>33</td><td>誤差＝標本誤差＋偏り。SEは推定値のばらつき</td></tr>\n<tr><td>34</td><td>中心極限定理。SE＝√(p(1−p)/n)。精度は√n</td></tr>\n<tr><td>35</td><td>95% CI＝点推定±1.96 SE。網のたとえ</td></tr>\n<tr><td>36</td><td>z*を替える。区間はパラメータについてだけ</td></tr>\n<tr><td>37</td><td>H₀は懐疑。棄却できない≠正しい</td></tr>\n<tr><td>38</td><td>第1種＝偽陽性、第2種＝見逃し。α</td></tr>\n<tr><td>39</td><td>p値はH₀の下での確率。検定ではp₀を使う</td></tr>\n<tr><td>40</td><td>有意≠意味がある。片側検定は避ける</td></tr></table></div>\n<p>先輩：「結局、比較群の46%にもばらつきがあるのに、固定の値として扱っとったよな」「そう。2つの群の割合を正しく比べるのが、次の第6章<strong>割合の推測</strong>。カイ二乗検定も出てくる」。</p>", "keys": ["αは状況で選ぶ。第1種の過誤が重大なら小さく、第2種が重大なら大きく", "大きな標本ではごく小さな差も有意になる。統計的有意≠臨床的有意", "p値だけでなく効果の大きさと信頼区間を見る", "標本サイズは「意味のある最小の差」から研究前に計画する", "片側検定はまれにしか適切でない。データを見て向きを選ぶと実際のαは2倍"], "upd": null, "quiz": [{"v": "", "q": "100万人の調査で50.2%が賛成、p値は0.00006。正しい解釈は。", "o": ["大きく意味のある差である", "統計的には有意だが、実務的な意味は小さい可能性がある", "偶然である", "標本が少なすぎる"], "a": 1, "e": "大標本ではわずかな差も有意になる。効果の大きさを別に評価する。", "r": "OpenIntro 5章"}, {"v": "", "q": "データを見てから片側検定の向きを決めると、実際の第1種の過誤の率は（α＝0.05のつもりで）。", "o": ["0.025", "0.05", "0.10", "0.01"], "a": 2, "e": "どちらの裾に入っても棄却することになるので、実質0.10になる。", "r": "OpenIntro 5章"}, {"v": "", "q": "第2種の過誤（有効な治療の見逃し）が特に重大な状況で、教科書が許容する対応は。", "o": ["αを0.01にする", "αを0.10程度に大きくする", "片側検定にする", "検定をしない"], "a": 1, "e": "見逃しの方が重大なら、αをやや大きくして棄却しやすくする選択もある。", "r": "OpenIntro 5章"}], "course": "stat"}];
const ST6 = [{"id": "s41", "lv": 1, "t": "何人集めればいい？標本サイズの決め方", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §6.1", "vol": "統計 第6章 割合の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「次の研究、何人集めたらいいか教授に聞かれた」。第5章の最後で予告した「標本サイズの計画」を、まずは割合1つで計算してみます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>研究の前に「<strong>どれくらいの精度が欲しいか</strong>」から必要な人数を逆算できる。</div><p>第6章は、第5章の道具を<strong>カテゴリカルデータ</strong>（はい／いいえ、群A／B／C）に広げる章です。前半は割合の差、後半はカイ二乗検定。まずは1つの割合の復習を兼ねて、<strong>研究前に n を決める</strong>計算から。</p>\n<h3>誤差の範囲から逆算する</h3>\n<p>信頼区間の誤差の範囲（margin of error）は z* × SE でした。これを「<strong>±m 以内</strong>」に収めたいなら、</p>\n<div class=\"formula\">z* × √( p(1−p) ／ n ) ＜ m　→　n ＞ z*² × p(1−p) ／ m²</div>\n<p>困るのは、p が<strong>まだ分からない</strong>こと（だから調べる）。</p>\n<ul><li>先行研究などで p の見当があれば、それを使う</li>\n<li>見当がなければ <strong>p＝0.5</strong> を入れる。p(1−p) が最大になる<strong>最悪のケース</strong>なので、安全側に大きな n が出る</li></ul>\n<h3>教科書の例</h3>\n<p>95%信頼で ±4% 以内にしたい。p＝0.5 として、</p>\n<div class=\"formula\">n ＞ 1.96² × 0.25 ／ 0.04² ＝ 600.25 → <strong>601人以上</strong></div>\n<p>標本サイズは<strong>必ず切り上げ</strong>ます。</p>\n<h3>小児内分泌で考える</h3>\n<ul><li>ある治療の副作用頻度を<strong>±5%</strong>で知りたい。見当なし → 1.96²×0.25／0.05² ≈ <strong>385人</strong></li>\n<li>先行研究で副作用はおよそ10%と分かっている → 1.96²×0.1×0.9／0.05² ≈ <strong>139人</strong></li>\n<li>±10%で妥協する（p＝0.5） → <strong>97人</strong></li></ul>\n<p>p の見当があるだけで必要数は3分の1近くに減ります。また、精度を2倍（±10%→±5%）にすると n は<strong>4倍</strong>。第34話の √n の感覚そのものです。</p>\n<h3>見当の選び方にも判断が要る</h3>\n<p>教科書の確認問題では、過去3モデルのタイヤ不良率（1.7%、6.2%、1.3%）のどれを使うかで、必要数が455、1584、350と大きく変わります。どの過去データが<strong>今回の状況に一番近いか</strong>、どれが<strong>大きな標本に基づくか</strong>で選ぶ。さらに、p が非常に小さい（0.5%など）と成功・失敗条件を満たさず、正規近似そのものが使えなくなる点にも注意が要ります。</p>\n<p>先輩への答え。「反応率を ±10% で推定するだけなら97人。でも本当に知りたいのは<strong>2群の差</strong>やろ？　それはもっと要る」。その計算は第44話で。</p>", "keys": ["必要なn ＞ z*²×p(1−p)／m²（mは誤差の範囲）", "pの見当がなければp＝0.5（最悪ケース）を使う", "95%、±4%、p＝0.5なら601人。標本サイズは切り上げ", "精度を2倍にするにはnは4倍", "pの見当は今回の状況に近く、大きな標本に基づくものを選ぶ"], "upd": null, "quiz": [{"v": "", "q": "95%信頼で誤差の範囲±5%、p の見当なし。必要な標本サイズは約。", "o": ["97人", "139人", "385人", "601人"], "a": 2, "e": "1.96²×0.25／0.05²≈384.2 → 切り上げて385人。", "r": "OpenIntro 6章"}, {"v": "", "q": "p の見当がないときに p＝0.5 を使う理由は。", "o": ["計算が簡単だから", "p(1−p) が最大になり、必要数が安全側に大きく出るから", "多くの割合は0.5に近いから", "成功・失敗条件を必ず満たすから"], "a": 1, "e": "最悪のケースで計算すれば、実際のpが何であっても誤差の範囲を守れる。", "r": "OpenIntro 6章"}, {"v": "", "q": "誤差の範囲を±10%から±5%に半分にしたい。必要な n は。", "o": ["2倍", "4倍", "半分", "変わらない"], "a": 1, "e": "nはmの二乗に反比例する。", "r": "OpenIntro 6章"}], "course": "stat"}, {"id": "s42", "lv": 2, "t": "2群の割合の差：信頼区間", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §6.2.1–6.2.2", "vol": "統計 第6章 割合の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>第5章の宿題。先輩：「比較群の46%も、26人から出した数字やから揺れとるよな」。2つの揺れを合わせて扱います。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>2群の割合の差にも信頼区間がある。<strong>0をまたいでいれば</strong>、どちらが良いとも言えない。</div><h3>点推定は「差」</h3>\n<p>2群の母比率の差 p₁ − p₂ を、標本比率の差 p̂₁ − p̂₂ で推定します。先輩の研究なら、</p>\n<div class=\"formula\">p̂治療 − p̂比較 ＝ 18/31 − 12/26 ＝ 0.581 − 0.462 ＝ <strong>0.119</strong></div>\n<h3>正規分布が使える条件</h3>\n<ol><li><strong>（拡張された）独立性</strong>：各群の中でも、群の間でも独立。2つの独立な無作為標本か、<strong>ランダム化実験</strong>なら満たす</li>\n<li><strong>成功・失敗条件を両群で</strong>：各群で成功も失敗も10以上</li></ol>\n<p>先輩の研究：治療群 18／13、比較群 12／14。<strong>全部10以上</strong>で、ぎりぎり条件を満たします。</p>\n<h3>差の標準誤差</h3>\n<div class=\"formula\">SE ＝ √( p₁(1−p₁)／n₁ ＋ p₂(1−p₂)／n₂ )</div>\n<p>どこかで見た形です。第24話の「<strong>X − Y でも分散は足す</strong>」。差の不確かさは、両方の不確かさを背負う。各群の SE を二乗して足し、ルートをとっているだけです。</p>\n<p>先輩の研究：SE＝√(0.581×0.419／31 ＋ 0.462×0.538／26) ≈ <strong>0.132</strong>。第5章で治療群だけの SE は0.089でした。比較群の揺れが加わって、<strong>1.5倍</strong>に膨らんでいます。</p>\n<h3>信頼区間</h3>\n<div class=\"formula\">0.119 ± 1.96 × 0.132 → <strong>(−0.14, 0.38)</strong></div>\n<p>「GHによる反応率の差は、−14%から＋38%の間と95%の信頼で言える」。区間が<strong>0をまたいでいる</strong>ので、治療群の方が良いとも悪いとも言えません。点推定の＋12%は魅力的ですが、データはその差が<strong>マイナスである可能性</strong>も否定できていない。</p>\n<h3>教科書のCPR研究</h3>\n<p>心肺蘇生を受けた患者を抗凝固薬あり（40人中14人が24時間生存、35%）となし（50人中11人、22%）に<strong>ランダムに</strong>割り付け。差0.13、SE 0.
