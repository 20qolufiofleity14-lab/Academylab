trong>インスリン抵抗性</strong>があり、それを補うために<strong>β細胞が増え、インスリンをたくさん出して</strong>血糖を保っています。その代償が破れたとき、まず食後高血糖が出ます。そこに高血糖そのもの（糖毒性）や脂肪（脂肪毒性）の害が加わり、さらに分泌が落ちていきます。β細胞は酸化ストレスに弱い細胞です。</p>\n<p>日本人は、<strong>軽い肥満でも2型になりやすい</strong>人種です。インスリン抵抗性に加えて、血糖が上がったときの<strong>最初のインスリン分泌（初期分泌）が弱い</strong>からです。肥大した脂肪細胞はアディポネクチンを減らし、TNF-αやFFAを出して、抵抗性を強めます。</p>\n<p>冒頭の男の子は、空腹時血糖138、HbA1c 7.6%。OGTTはせずに糖尿病と診断しました。HOMA-IRは6.8。GAD抗体は陰性。次の回は、彼の治療です。</p>", "keys": ["学校検尿の2型糖尿病は10万人あたり年2.5〜3.5人で1型より多い。中学生で多い", "約80%が肥満、60〜70%に家族歴、黒色表皮腫は抵抗性のサイン", "尿糖＋尿ケトン陽性は緊急。空腹時血糖とHbA1cが両方糖尿病型ならOGTTはしない", "HOMA-IR≥2.5で抵抗性、HOMA-β≥20で分泌保持、insulinogenic index＜0.5で初期分泌低下", "日本人は初期インスリン分泌が弱く、軽い肥満でも2型になりやすい"], "upd": null, "quiz": [{"v": "", "q": "東京都の学校検尿における糖尿病精密検査の内容として述べられているのは。", "o": ["尿ケトン、空腹時血糖、HbA1c、OGTT（1.75 g/kg、最大75 g）とインスリン測定", "尿糖検査のみを再検し、2度陽性であればHbA1cのみを測定して糖尿病型を判定", "随時血糖とHbA1cのみで判定し、OGTTやインスリン測定は行わない", "OGTTを全例に行うが、血糖のみで判定しインスリン濃度や脂質は測定しない"], "a": 0, "e": "OGTT実施時に血糖測定と並行して時間ごとにインスリン濃度を測定、空腹時の血清で総コレステロール、中性脂肪、ALT、GAD抗体を測定。精密検査時には尿ケトン検査が重要な項目となり、尿糖陽性かつ尿ケトンが陽性の場合にはDKAが疑われるため医療機関への緊急受診を考える。FPGとHbA1cの同時採血でいずれも糖尿病型を示す場合にはOGTTを行う必要はない。不必要なOGTTは受診者への負担になるばかりでなく、さらなる高血糖を招きDKAへ進展する危険もある。耐糖能障害の判定基準（日本糖尿病学会）：糖尿病型は空腹時126以上またはOGTT 2時間200以上、境界型は空腹時110〜125（IFG）または2時間140〜199（IGT）、正常型は空腹時110未満かつ2時間140未満。", "r": "治療 p.227, 表5"}, {"v": "", "q": "2003年度の小児内分泌学会調査で、小児2型糖尿病の診断時に肥満度20%以上であった割合は。", "o": ["男子78%、女子63%", "男子50%、女子30%", "男子95%、女子90%", "男子30%、女子50%"], "a": 0, "e": "1975〜2015年における東京都の学校検尿による糖尿病検診の結果においてもBMI 95パーセンタイル以上の肥満症例は87.1%。わが国の小児2型糖尿病のおよそ80%は肥満度20%以上の肥満例であるが10〜15%の症例は非肥満で、非肥満例ではインスリン抵抗性が軽度で診断時から内因性インスリン分泌能が低い症例が多いことから、しばしば緩徐進行型1型糖尿病や単一遺伝子性糖尿病との鑑別が困難なケースに遭遇する。糖尿病の家族歴に関しては診断時に60〜70%の症例で第1度近親者に2型糖尿病が存在する。", "r": "治療 p.227-228"}, {"v": "", "q": "2型糖尿病を示唆するインスリン分泌・抵抗性の指標（表6）で正しいのは。", "o": ["insulinogenic index 0.5未満、HOMA-IR 2.5以上、HOMA-β 20以上", "insulinogenic index 1.0以上、HOMA-IR 1.0未満、HOMA-β 50以上", "insulinogenic index 0.5未満、HOMA-IR 1.6未満、HOMA-β 10未満", "insulinogenic index 2.0以上、HOMA-IR 2.5以上、HOMA-β 100以上"], "a": 0, "e": "OGTTにおけるインスリン分泌反応では空腹時IRIが10 μU/mL以上を示し遅延型過分泌パターンを示すことが多い。insulinogenic index＝（負荷後30分IRI−空腹時IRI）/（負荷後30分血糖−空腹時血糖）で初期分泌反応を表し0.5未満で低値。HOMA-IR＝空腹時IRI×空腹時血糖/405で2.5以上でインスリン抵抗性。HOMA-β＝空腹時IRI×360/（空腹時血糖−63）で20以上でインスリン分泌能は保たれている。2型糖尿病診断のポイント：①一般に肥満（肥満度20%以上）を有するか過去に肥満歴がある、②第1度近親者に2型糖尿病の家族例がある、③黒色表皮腫などのインスリン抵抗性を示唆する所見、④OGTTのインスリン反応は遅延型過分泌反応、⑤HOMA-IR 2.5以上、HOMA-β 20以上、⑥膵島関連自己抗体は検出されない、⑦遺伝子診断で単一遺伝子異常を認めない。", "r": "治療 表6 p.229"}]}, {"id": "d11", "lv": 2, "t": "2型糖尿病を治す", "min": 7, "cats": "2型糖尿病", "src": "p.477 ／ 小児内分泌学 p.539 ／ 治療 p.229-236", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>前の回の中学2年生。食事と運動で3か月頑張り、体重は4 kg減ってHbA1cは6.4%まで下がりました。本人は「もう治ったから、病院来なくていい？」</div><p>2型糖尿病の治療の柱は、食事と運動、そして必要に応じた薬です。今日はその組み立てと、子どもに使える薬の選び方です。</p>\n<h3>食事と運動：減らしすぎない</h3>\n<p>食事は、中等度以上の肥満では同年齢の健常児の<strong>90%程度</strong>、軽度肥満から非肥満では95%に。育つ時期なので、大人のように大きく削りません。糖質50〜60%、蛋白質20%未満、脂質20〜30%。運動は、1日の摂取エネルギーの5〜10%を消費する量を週2〜3回以上。テレビやゲームは<strong>1日2時間以内</strong>に。</p>\n<p>体重が減ると、1〜3か月という短い間に耐糖能が良くなる子が多いです。だからこそ大事なのは、<strong>「治った」と思って通院をやめてしまう</strong>ことを防ぐこと。最初の教育で、良くなっても長く管理が続くことを伝えておきます。</p>\n<h3>薬の組み立て（ISPAD 2018）</h3>\n<div class=\"formula\">ケトーシスなし・HbA1c &lt; 8.5% → メトホルミン 500〜1,000 mg/日 から<br>ケトアシドーシスあり → すぐに基礎インスリン 0.25〜0.5 単位/kg、2〜6週でメトホルミンへ移行<br>目標 HbA1c &lt; 7.0%</div>\n<p>メトホルミン単独で4か月以内に目標に届かなければ<strong>基礎インスリンを併用</strong>（最大1.5単位/kg/日）、それでもだめなら食前の追加インスリンへ進みます。</p>\n<h3>子どもに使える薬は二つだけ</h3>\n<p>日本で小児に使用が認められている経口薬は、<strong>メトホルミン</strong>と、9歳以上の<strong>グリメピリド</strong>だけです。実際には中学生以上で成人と同じように他の薬も医師の判断で使われますが、まずこの二つを押さえます。</p>\n<p><strong>メトホルミン</strong>は、肝臓と筋肉の<strong>AMPキナーゼ</strong>を活性化し、肝臓からの糖の放出を抑え、筋肉の取り込みを増やします。インスリンの分泌は増やさないので、<strong>単独では低血糖を起こしにくい</strong>。脂質も改善します。最大量は10歳以上で2,000 mg/日。注意は<strong>乳酸アシドーシス</strong>で、eGFR 30未満は禁忌、脱水、手術前後、ヨウ素造影剤の前には止めます。</p>\n<p><strong>グリメピリド</strong>（SU薬）は、β細胞のKATPチャネルを閉じてインスリンの分泌を増やします。肥満がない、または軽い肥満で、分泌が残っている子に向きます。<strong>低血糖</strong>に注意します。</p>\n<h3>ほかの薬の顔ぶれ</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>薬</th><th>仕組み</th><th>体重</th><th>注意</th></tr>\n<tr><td>DPP-4阻害薬</td><td>GLP-1の分解を止める</td><td>不変</td><td>単独で低血糖少ない</td></tr>\n<tr><td>GLP-1受容体作動薬</td><td>血糖依存でインスリン↑・グルカゴン↓、胃排出遅延・食欲抑制</td><td>減少</td><td>胃腸症状、少量から</td></tr>\n<tr><td>SGLT2阻害薬</td><td>近位尿細管の糖再吸収を止める</td><td>減少</td><td>尿路・性器感染、脱水、euDKA</td></tr>\n<tr><td>チアゾリジン</td><td>PPARγでインスリン抵抗性改善</td><td>増加</td><td>浮腫・心不全</td></tr>\n<tr><td>α-GI</td><td>糖の吸収を遅らせる</td><td>不変</td><td>放屁・下痢（ミグリトールは少ない）</td></tr></table></div>\n<p>インクレチン（GLP-1、GIP）は、<strong>血糖が高いときだけ</strong>インスリンを出させるので、単独では低血糖を起こしにくいのが特徴です。単独で低血糖のリスクが「高」いのは、SU薬とグリニド薬です。</p>\n<h3>血圧と脂質も</h3>\n<p>メタボリックシンドロームに伴う高血圧には、<strong>ACE阻害薬やARB</strong>が理にかなっています。インスリン抵抗性も改善するからです。β遮断薬は代謝や体重を悪くすることが心配されます。脂質異常の薬は、6か月から1年の食事療法で改善しないときだけ考えます（第19話）。</p>\n<p>中学2年生には、「治ったんじゃなくて、『おさまっている』んだよ。体がインスリンを出しにくい体質は変わらない。だから3か月に1回、顔を見せて」と伝えました。メトホルミン500 mgを続けながら、外来でのゲームの話が、少しずつ部活の話に変わっていきました。</p>", "keys": ["食事は健常児所要量の90〜95%、スクリーンタイム1日2時間以内。改善後の中断を防ぐ初期教育", "ISPAD 2018：HbA1c＜8.5%でケトーシスなしならメトホルミン、DKAならまず基礎インスリン", "小児承認の経口薬はメトホルミンとグリメピリド（9歳以上）のみ", "メトホルミンはAMPK活性化、単独で低血糖少ない。eGFR 30未満禁忌、造影剤前に中止", "インクレチン関連薬は血糖依存。SGLT2阻害薬はeuDKAに注意。高血圧にはACE阻害薬/ARB"], "upd": null, "quiz": [{"v": "", "q": "ISPADコンセンサスガイドライン2018の小児2型糖尿病の薬物療法指針（表9）で正しいのは。", "o": ["代謝が安定（HbA1c 8.5%未満）ならメトホルミン1日500〜1,000 mgで開始", "全例でインスリン強化療法から開始し、1年後にメトホルミン単独療法に移行する", "HbA1c 7.0%未満でも全例でメトホルミンとSU薬の併用から開始", "ケトアシドーシスがあればメトホルミン単独で治療し、インスリンは使わない"], "a": 0, "e": "ケトアシドーシスがあれば直ちにインスリン（基礎0.25〜0.5単位/kg）投与し、おおよそ2〜6週でメトホルミン単独療法に移行。初期治療の血糖コントロールの目標はHbA1c 7.0%未満。メトホルミン単独で4か月以内にHbAlc 7.0%未満を達成できない場合は基礎インスリンを併用（最大1.5単位/kg/日）、メトホルミンと基礎インスリンの併用でも目標値が達成できない場合は食前の追加インスリンを投与する。わが国で小児に対する使用が許可されている経口血糖降下薬はメトホルミンとスルホニル尿素薬のグリメピリド（アマリール®錠、9歳以上）のみ。", "r": "治療 表9 p.230"}, {"v": "", "q": "メトホルミンの作用機序と小児での使用量として正しいのは。", "o": ["肝および骨格筋のAMPキナーゼ活性化により肝からのブドウ糖放出の抑制と筋肉組織でのブドウ糖取り込みを増加", "膵β細胞のKATPチャネルを閉鎖しインスリン分泌を促進。開始量1日250 mg、最大1,000 mg", "小腸での炭水化物の吸収を遅らせる。開始量1日150 mg、最大300 mg", "PPARγを活性化しインスリン抵抗性を改善。開始量1日15 mg、最大30 mg"], "a": 0, "e": "開始量は1日500〜1,000 mg（朝夕食前あるいは食後）、最大量は10歳以上で1日2,000 mg（メトグルコ®錠のみ）。スルホニル尿素薬でみられるインスリン分泌増強作用はない。本薬はおもに肥満でインスリン抵抗性を示す症例で適応となるが非肥満例の血糖値改善にも有効とされる。血糖降下作用に加え血清脂質の改善作用（総コレステロール、LDL、TG低下とHDL増加）も有する。Matsuuraらの日本人小児・思春期2型糖尿病におけるメトホルミン単独療法の多施設共同研究では24週の観察期間でHbA1cの有意な改善を認めた。アメリカのTODAY試験では2か月の観察期間で90%の症例がメトホルミン単独療法でHbA1c 8.0%未満を達成したが、その後の追跡調査では6か月の観察期間においてメトホルミン単独でHbA1c 8.0%未満を維持している症例は約半数に減少し、メトホルミンとロシグリタゾンを併用した場合にはHbA1c 8.0%未満を維持している症例が有意に多かった。副作用は乳酸アシドーシスが重篤で、肝・腎・心・肺機能障害のある患者、脱水、手術前後、栄養不良、下垂体・副腎機能不全には使用しない。eGFR 30 mL/分/1.73 m²未満は禁忌、30〜45は慎重投与、30〜60の患者ではヨウ素造影剤検査の前あるいは造影時に投与を中止し48時間は再開しない。", "r": "治療 p.230-232"}, {"v": "", "q": "SGLT2阻害薬について正しいのは。", "o": ["近位尿細管でのブドウ糖再吸収を抑制し尿糖排泄を促進", "小腸でのブドウ糖吸収を抑制。副作用は胃腸障害のみ", "肝での糖新生を抑制。副作用は乳酸アシドーシス", "膵β細胞のインスリン分泌を促進。副作用は低血糖"], "a": 0, "e": "尿糖が陽性となるため1,5-AGは血糖コントロールの指標にならない。副作用は尿路感染症、性器感染症（特に女性）、正常血糖でもケトアシドーシス（eDKA）の可能性。適応は肥満を有する症例であり、尿糖排泄に伴い体重低下も期待される。インスリンとは独立した作用を示すため単独使用では低血糖のリスクは低い。尿糖排泄のほかに尿中へのナトリウム排泄も促進し、降圧および腎機能保護にも有効と報告される。全身倦怠感、悪心、嘔吐、腹痛を認める場合には正常血糖であってもeDKAの可能性もあるので尿中あるいは血中ケトンの測定を行う必要がある。浸透圧利尿に伴い脱水を認めることがあるので尿量に伴い特に夏季には十分な水分補給が必要。処方例：15歳男子、肥満度45%、黒色表皮腫あり、HbA1c 8.5% → ルセフィ®錠5 mg 1錠/日分1（朝食前）。", "r": "治療 p.235"}]}, {"id": "d12", "lv": 2, "t": "薬とホルモンが作る糖尿病", "min": 6, "cats": "ステロイド誘発性糖尿病・2型糖尿病", "src": "小児内分泌学 p.548 ／ 治療 p.244-246, 900-902", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>ネフローゼ症候群で入院中の10歳の女の子。プレドニゾロン60 mgを朝1回で始めて1週間。朝の空腹時血糖は98でいつも正常です。でも夕方、看護師さんが測ったら312 mg/dLでした。</div><p>糖尿病は、膵臓だけの病気ではありません。<strong>薬</strong>や、ほかの<strong>内分泌の病気</strong>が血糖を上げることがあります。今日は、小児科の病棟で最もよく出会う、ステロイドによる高血糖から始めます。</p>\n<h3>ステロイドは「午後」に効く</h3>\n<p>ステロイドは、肝臓の糖新生を増やし、インスリン抵抗性を強め、食欲も増やします。インスリン受容体への親和性を下げ、筋肉でのGLUT4の移動を抑え、グルカゴンも上げます。</p>\n<p>大事なのは<strong>血糖の上がり方の形</strong>です。<strong>朝に飲むと、昼過ぎから寝る前にかけて高血糖が出て</strong>、翌朝には戻ります。だから<strong>早朝の空腹時血糖では気づけません</strong>。冒頭の子はまさにこの形でした。HbA1cも、治療を始めてすぐの高血糖は映しません。食前と<strong>食後</strong>の血糖を測ります。</p>\n<p>力価と期間で見積もります。デキサメタゾンはプレドニゾロンより強く、吸入薬や外用薬では起こりにくいとされます。</p>\n<h3>いつ治療するか、何を使うか</h3>\n<div class=\"formula\">治療開始の目安：食前 140 mg/dL または 食後 200 mg/dL を繰り返し超える</div>\n<p>ステロイドの種類で、インスリンを合わせます。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>ステロイド</th><th>血糖の形</th><th>インスリン</th></tr>\n<tr><td>ヒドロコルチゾン（短時間）</td><td>すぐ上がり、すぐ戻る。一過性</td><td>RまたはRa 0.1単位/kg/回から</td></tr>\n<tr><td>プレドニゾロン朝1回（中間）</td><td>徐々に上がり、夕方まで続く</td><td>NPHまたはLa 0.2〜0.4単位/kg（PSL 10 mgで0.1単位/kgの目安も）</td></tr>\n<tr><td>デキサメタゾン（長時間）</td><td>日中ピークで24時間続く</td><td>NPH 1日2回（0.3単位/kg）またはLa 1日1回（0.2単位/kg）</td></tr></table></div>\n<p>副腎不全に対する<strong>生理量のヒドロコルチゾン補充</strong>では、高血糖は起こりません。ストレス時の大幅な増量で上がっても、一過性で限られたものです。</p>\n<h3>ほかの薬</h3>\n<ul>\n<li><strong>免疫チェックポイント阻害薬</strong>：β細胞を壊し、劇症1型のような経過をとる（前章の第14話）</li>\n<li><strong>L-アスパラギナーゼ</strong>：β細胞のインスリン分泌を下げる</li>\n<li><strong>mTOR阻害薬</strong>：インスリン受容体からのシグナルを妨げる</li>\n</ul>\n<p>薬ごとに仕組みが違います。白血病の治療中の子では、ステロイドとL-アスパラギナーゼが重なります。</p>\n<h3>ホルモンが作る糖尿病</h3>\n<p>前の章で見た腫瘍たちも、血糖を上げます。<strong>Cushing症候群</strong>では糖尿病が17〜35%、<strong>先端巨大症</strong>で19〜56%、<strong>褐色細胞腫</strong>で25〜75%、グルカゴノーマでは70〜90%。褐色細胞腫では、カテコラミンが<strong>α受容体を介してインスリン分泌を抑え</strong>、グリコーゲン分解と糖新生を進め、β3受容体を介した脂肪分解も加わります。腫瘍を取れば、耐糖能は良くなります。</p>\n<h3>抗体が作る低血糖と高血糖</h3>\n<p><strong>インスリン自己免疫症候群</strong>は、チアマゾールなど<strong>SH基をもつ薬</strong>のあとに、インスリンへの抗体ができて起こります。食後の高血糖と、抗体から外れたインスリンによる低血糖が交互に起きます。甲状腺の章でBasedow病の治療を見たとき、この名前を思い出してください。</p>\n<p>冒頭の女の子には、朝のプレドニゾロンに合わせて朝にNPHを0.3単位/kg打つことにしました。昼と夕方の血糖が落ち着き、ステロイドを減らすにつれてNPHも減らし、やがて要らなくなりました。</p>", "keys": ["ステロイド高血糖は朝内服で昼過ぎ〜就寝前に出る。早朝空腹時血糖では気づけない", "治療開始の目安：食前140または食後200を繰り返し超える", "プレドニゾロン朝1回にはNPH/Laを0.2〜0.4単位/kg。生理量ヒドロコルチゾンでは高血糖は起きない", "ICIはβ細胞破壊、L-アスパラギナーゼは分泌低下、mTOR阻害薬はシグナル障害", "Cushing・先端巨大症・褐色細胞腫（α受容体でインスリン分泌抑制）も耐糖能異常。IASはSH基薬で"], "upd": null, "quiz": [{"v": "", "q": "ステロイド誘発性糖尿病で血糖降下療法を開始する目安として推奨されているのは。", "o": ["食前140 mg/dLまたは食後200 mg/dLを繰り返し超えた場合", "食前126 mg/dLまたはHbA1c 6.5%を1回でも超えた場合", "随時血糖300 mg/dLを1回でも超えた場合に開始する", "空腹時血糖100 mg/dLを超えた時点でただちに開始する"], "a": 0, "e": "ステロイド誘発性糖尿病の治療目標を設定するための明確なエビデンスを示す疫学データはない。血糖値目標は他のタイプの糖尿病患者と同様であり、余命や併存疾患、患者のコンプライアンス、低血糖のリスクなどに応じて個別に対応する必要がある。化学療法、免疫抑制薬、抗菌薬などの複合的治療を併用する場合や頻繁にステロイド使用量の変更が必要な場合には特に血糖変動が大きくなりやすく、厳格な血糖値目標を設定した場合低血糖のリスクも高まるため高血糖とともに低血糖も回避する管理が重要。選択するインスリン療法は使用するステロイド製剤の特性を考慮してインスリン製剤の種類、使用量と投与間隔を選択する。", "r": "治療 p.245"}, {"v": "", "q": "中間作用型ステロイド（プレドニゾロン、メチルプレドニゾロン）朝1回投与による高血糖に対するインスリン治療で正しいのは。", "o": ["徐々に上昇し、ゆるやかに夕方まで高血糖が続く", "投与直後に急上昇し、2〜3時間で正常化する", "夜間から早朝にかけて上昇し、日中は正常に戻る", "24時間持続する平坦な高血糖で、日内変動がない"], "a": 0, "e": "NPHやLaを用い投与量は0.4単位/kgまたはより低用量（0.2〜0.3単位/kg）から始める。用量依存的にプレドニゾロン10 mgで0.1単位/kg、20 mgで0.2単位/kg、30 mgで0.3単位/kgとする方法もある。複数回の中間型ステロイド製剤を用いる場合には血糖値の変化がより複雑となるためNPHの1日2回投与またはインスリングラルギンなどのLaへの変更やR追加投与を考慮する。また速効型インスリン70%と基礎インスリン30%などの混合インスリンへの変更も選択肢となる。長時間作用型ステロイド（デキサメタゾン）は最も強力なグルココルチコイドとして24時間以上の長時間作用を特徴とする。血糖値が12 mmol/L（216 mg/dL）を超えた時点で治療を開始する。高血糖は緩徐に上昇し日中にピークを迎えるが24時間にわたり持続するため、中間型インスリン（NPH、デテミル）の1日2回投与（初期投与量0.3単位/kg）あるいはLa（グラルギンまたはデグルデク）1日1回を選択する（初期投与量0.2単位/kg）。基礎インスリン療法の開始後2〜3日経過後も高血糖が持続する場合（空腹時血糖値200 mg/dL以上）は投与量を10〜20%増量する。食後の高血糖がおもな場合はRまたはRaの追加投与、またはプレミックスインスリン製剤への変更を考慮する。", "r": "治療 p.245-246"}, {"v": "", "q": "褐色細胞腫による耐糖能異常の機序は。", "o": ["カテコラミンがα受容体優位に働いてインスリン分泌を抑制し、グリコーゲン分解と糖新生を亢進させる", "β受容体優位に働き、インスリン分泌を促進しつつ末梢の取り込みを阻害するため血糖が上がり、摘出後も改善しない", "カテコラミンが膵β細胞を直接傷害し、インスリン分泌が低下する", "グルカゴン分泌が抑制され、肝からの糖放出が減る"], "a": 0, "e": "β3アドレナリン受容体を介した脂肪分解も加わり、グリセロールやアラニンが糖新生の材料になる。摘出後に耐糖能が改善する。", "r": "治療 p.900"}]}, {"id": "d13", "lv": 3, "t": "MODY：遺伝子が治療を決める", "min": 6, "cats": "単一遺伝子性糖尿病", "src": "症例 p.479-483 ／ 小児内分泌学 p.544 ／ 治療 p.239-241, 897, 1275-1276", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>小学5年生の女の子。学校検尿で尿糖を指摘され、空腹時血糖は118 mg/dL、HbA1cは6.3%。肥満はなく、GAD抗体は陰性。お母さんも「境界型」と言われて、近くの病院で薬を飲んでいるそうです。</div><p>糖尿病の中には、<strong>一つの遺伝子</strong>で起きるものがあります。そして、その遺伝子が分かると、<strong>治療が変わる</strong>。ときには「治療をやめてよい」という根拠にもなります。今日は<strong>MODY</strong>です。</p>\n<h3>MODYとは</h3>\n<p>3世代にわたって若い年齢（ふつう25歳未満）で発症し、<strong>常染色体顕性遺伝</strong>が想定される糖尿病です。抗体は陰性で、肥満は目立ちません。第1話で、抗体陰性のインスリン分泌不全を見たら単一遺伝子性を考える、と見ました。日本で多いのは三つです。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>遺伝子</th><th>特徴</th><th>治療</th></tr>\n<tr><td>MODY2</td><td>GCK</td><td>軽い空腹時高血糖が続くが進行しない</td><td>経過観察</td></tr>\n<tr><td>MODY3</td><td>HNF1A</td><td>年齢とともに進行。尿糖が出やすい</td><td>SU薬がよく効く</td></tr>\n<tr><td>MODY1</td><td>HNF4A</td><td>MODY3に似る。高出生体重、新生児低血糖</td><td>少量SU薬</td></tr>\n<tr><td>MODY5</td><td>HNF1B</td><td>腎嚢胞・腎尿路奇形（RCAD）、性腺形成異常</td><td>はじめからインスリン</td></tr></table></div>\n<h3>MODY2：セットポイントが少し高いだけ</h3>\n<p><strong>グルコキナーゼ（GCK）</strong>は、β細胞が血糖を感じる「センサー」です。片方の変異でセンサーの閾値が少し上がり、<strong>血糖のセットポイントがわずかに高く</strong>なります。でも血糖が上がればインスリンはちゃんと出るので、<strong>進行しません</strong>。空腹時血糖のわりにHbA1cが軽くしか上がらず、無治療でも悪くならないとき、強く疑います。</p>\n<p>合併症はまれで、家系内で変異をもつ人ともたない人で合併症の頻度に差がないという報告もあります。だから<strong>ほとんど治療は要りません</strong>。ほかの病院で糖尿病として治療されている家族にMODY2と診断をつけることは、<strong>治療をやめる根拠</strong>になります。遺伝子診断が治療を減らす、珍しい例です。</p>\n<p>以前は日本人に少ないとされていましたが、小児科からの多くの報告で、<strong>実は少なくない</strong>と分かってきました。母がMODY2のとき、子が同じ変異をもつかどうかで出生体重が変わるなど、妊娠中の対応には課題もあります。両方の変異では新生児糖尿病になります。</p>\n<h3>MODY3：SU薬が効く</h3>\n<p><strong>HNF1A</strong>の変異をもつ人の60%以上が25歳までに発症します。<strong>尿細管での糖の再吸収の閾値が低い</strong>ので、血糖があまり高くないうちから尿糖が出て、学校検尿で早く見つかることがあります。</p>\n<p>早い時期はインスリンの分泌が保たれていて、<strong>SU薬（グリメピリド）によく反応</strong>します。年齢とともに分泌が落ちて、インスリンが必要になることが多いです。合併症は1型や2型と同じように進むので、コントロールはしっかり行います。</p>\n<h3>MODY5：家族歴がなくても</h3>\n<p><strong>HNF1B</strong>は膵臓だけでなく泌尿生殖器にも出ています。だから腎嚢胞や腎の形成異常を伴います（RCAD）。<strong>新生突然変異や欠失が多い</strong>ので、家族歴がなくても否定できません。肝臓由来のインスリン抵抗性を伴い、SU薬が効きにくいので、はじめからインスリンが選ばれます。腎機能が予後を左右します。</p>\n<h3>遺伝子を調べるということ</h3>\n<p>確定には遺伝子検査が必要です。日本小児内分泌学会では、糖代謝関連遺伝子の網羅的な解析と専門家の意見を返す仕組みがあります。顕性遺伝の病気なので、診断がついたら<strong>遺伝カウンセリング</strong>で十分な情報を提供し、家族の検索も配慮して行います。</p>\n<p>冒頭の女の子にはGCK変異が見つかり、お母さんも同じ変異をもっていました。お母さんの主治医に手紙を書き、薬をやめることになりました。「お二人とも、血糖の基準がほんの少し高い体質です。病気が進むことはほとんどありません」。</p>", "keys": ["MODYは抗体陰性・常染色体顕性・若年発症。日本ではGCK・HNF1A・HNF4Aが多い", "MODY2（GCK）はセットポイントが少し高いだけで進行せず、治療不要が多い。診断が治療中止の根拠に", "MODY3（HNF1A）は進行性、尿糖閾値が低く学校検尿で見つかる。SU薬がよく効く", "MODY5（HNF1B）は腎嚢胞（RCAD）、de novoが多く家族歴がなくても否定できない。はじめからインスリン", "確定は遺伝子検査。診断後は遺伝カウンセリング"], "upd": null, "quiz": [{"v": "学校検尿で尿糖を指摘された小児。軽度の空腹時高血糖が続くが進行せず、家族の複数名にも軽い高血糖がある。", "q": "最も考えられるのは。", "o": ["GCK異常症", "1型糖尿病", "2型糖尿病", "新生児糖尿病"], "a": 0, "e": "血糖のセットポイントがわずかに高いだけで進行しない。治療の対象にならないことが多く、それを知らないと不要な治療を始めてしまう。 MODY2。", "r": "症例 p.479-481"}, {"v": "", "q": "MODY3（HNF1A遺伝子）の臨床像と治療について正しいのは。", "o": ["変異保有者の60%以上が25歳までに発症", "終生SU薬で管理でき、インスリン療法は不要", "尿糖閾値が高く、学校検尿では発見されない", "インスリン抵抗性が主体で、メトホルミンが第一選択"], "a": 0, "e": "尿細管での尿糖再吸収閾値が低いことより学校検尿で早期に発見されることも多い。早期にはインスリン分泌は保たれSU薬（グリメピリドなど）への感受性も良好だが、加齢とともにインスリン分泌が低下しインスリン療法を要することが多い。HNF-1αは肝臓および膵臓で主として発現する転写因子で、膵では膵内分泌・外分泌細胞に主として発現。標的遺伝子はインスリン、GLUT2、IGF-I、E-cadherinなど。臨床像は多彩で、妊娠糖尿病での発見もあり、さらに1型糖尿病と鑑別が困難なほどインスリン分泌不全が高度なこともある。ブドウ糖刺激に対して選択的にインスリン分泌は障害されている。網膜症などの合併症は比較的多い。処方例：13歳男子、MODY3 → アマリール®錠0.5 mg/錠あるいは1 mg/錠、1錠/日分1（朝食後）。上記処方のみで不十分な場合1 mg/錠2錠/日分2（朝、夕食後）程度まで低血糖に注意しながら増量を考慮。増量でも効果不十分でインスリン療法に移行する場合は超速効型インスリンの食前投与からはじめ、インスリン分泌がさらに低下するようなら持効型インスリンの追加も考慮。GLP-1受容体作動薬の有用性がMODY3に対して報告されているが小児年齢への適応がなく日本における小児の報告例は少ない。", "r": "治療 p.239-240"}, {"v": "", "q": "MODY5（HNF1B遺伝子）について正しいのは。", "o": ["腎囊胞や腎・泌尿生殖器形成異常を伴い、RCADの概念が提唱されている", "SU薬によく反応し、腎病変は伴わず肝腺腫を合併しやすく家族歴が明らか", "家族歴が必須で、de novo変異はなく常に顕性遺伝を示す", "膵外分泌不全と膵無形成が特徴で、ホモ接合では新生児糖尿病となる"], "a": 0, "e": "de novo変異や欠失例が多く家族歴がなくとも否定できない。インスリン分泌低下はMODY3に比してやや軽いが通常肝臓由来インスリン抵抗性を伴い、SU薬の感受性がよくないため最初からインスリン療法が選択される。HNF-1βはHNF-1αと同じくatypical homeodomain型転写因子で膵臓以外にも泌尿生殖器臓器に発現し、膵臓ではHNF-1αと異なり導管細胞における発現が強い。HNF-1β異常症全体からみると糖尿病の発症は部分的であるともいえ、糖尿病の家族歴がなくとも否定できない。MODY5は腎尿路系の病変を伴った糖尿病、糖尿病の家族歴がある場合にはまず疑う。HNF1B遺伝子はde novo変異が多いことから家族歴がなくても積極的に疑う必要がある。インスリン抵抗性が強い傾向があることを念頭におく必要がある。MODY5は合併することが多い腎尿路系の異常による腎機能障害が予後を左右する。", "r": "治療 p.240-241"}]}, {"id": "d14", "lv": 3, "t": "新生児糖尿病と、まれな糖尿病", "min": 6, "cats": "単一遺伝子性糖尿病", "src": "p.485-489 ／ 小児内分泌学 p.185, 545 ／ 治療 p.241-244, 895, 1278-1279", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>生後8週、子宮内発育遅延で生まれた男の子。哺乳が落ち、血糖が480 mg/dL、軽いアシドーシスもあります。「赤ちゃんの1型糖尿病ですか？」と、NICUの先生。</div><p>前の回で、遺伝子が治療を決めることを見ました。その最もドラマチックな例が、<strong>新生児糖尿病</strong>です。注射から、飲み薬に変えられることがあるのです。</p>\n<h3>生後6か月未満の糖尿病は「1型ではない」</h3>\n<p>新生児糖尿病は、<strong>生後6か月未満に発症</strong>するインスリン依存性の糖尿病です。9万〜16万出生に1人。この時期の1型糖尿病はまれなので、<strong>単一遺伝子性を疑います</strong>。子宮内発育遅延を伴い、生後1週前後からの発症が多いです。</p>\n<p>数週から数か月で良くなる<strong>一過性（TNDM）</strong>と、続く<strong>永続性（PNDM）</strong>に分けます。</p>\n<ul>\n<li><strong>一過性で最も多い</strong>：<strong>6q24</strong>のインプリンティング異常（PLAGL1・HYMAIの父性発現の過剰）。一過性でも<strong>思春期以降に再発</strong>することがあります。</li>\n<li><strong>新生児糖尿病の多くを占める</strong>：<strong>KATPチャネル</strong>（Kir6.2をつくるKCNJ11、SUR1をつくるABCC8）の片方の変異。</li>\n</ul>\n<p>KATPチャネル性の発症は生後6〜18週が中央値で、<strong>生後1週以内の発症ならKATP性の可能性は低く</strong>、6q24やINS変異、膵低形成を考えます。</p>\n<h3>開きっぱなしのチャネルを、薬で閉じる</h3>\n<p>β細胞は、血糖が上がるとATPが増えて<strong>KATPチャネルが閉じ</strong>、細胞が脱分極してインスリンを出します。機能亢進変異では、このチャネルが<strong>開きっぱなし</strong>になり、インスリンが出ません。</p>\n<p>SU薬は、このチャネルを外から閉じる薬です。だからKATP性の新生児糖尿病では、<strong>約90%がSU薬（多くはグリベンクラミド）でインスリンから離脱</strong>できます。</p>\n<div class=\"formula\">グリベンクラミド 0.2 mg/kg/日 分2から、1週ごとに0.2 mg/kg/日ずつ増量、最大2 mg/kg/日</div>\n<p>KATPチャネルは脳にもあるので、最も重い例では<strong>DEND症候群</strong>（発達遅滞・てんかん・新生児糖尿病）を伴います。遺伝子解析で80%以上の原因が分かるので、積極的に調べます。</p>\n<p>ちなみに、同じABCC8・KCNJ11の<strong>機能低下</strong>変異は、逆にチャネルが閉じっぱなしになって、第21話の<strong>先天性高インスリン血症</strong>を起こします。同じ遺伝子が、向きによって糖尿病にも低血糖にもなるのです。</p>\n<h3>新生児のインスリン</h3>\n<p>遺伝子の結果を待つ間はインスリンです。静注は0.01〜0.05単位/kg/時で始め、血糖100〜200 mg/dLを目標にします。長く管理するには<strong>CSII</strong>が役に立ち、インスリンを<strong>生理食塩水で10倍に薄めて</strong>使います。CGMを併用すると管理が良くなります。</p>\n<h3>そのほかの、まれな糖尿病</h3>\n<ul>\n<li><strong>Wolfram症候群</strong>（DIDMOAD）：尿崩症・糖尿病・視神経萎縮・難聴。水の章の第5話で出てきました。WFS1、CISD2。</li>\n<li><strong>ミトコンドリア糖尿病</strong>：<strong>m.3243A&gt;G</strong>が最多。<strong>難聴と母系の家族歴</strong>が手がかり。初期はSU薬、進むとインスリン。<strong>メトホルミンは避けます</strong>（呼吸鎖を止め、乳酸アシドーシスの誘因に）。血液では変異の割合が低く、見逃されることがあります。</li>\n<li><strong>インスリン受容体異常症</strong>：両方の変異はDonohue症候群（妖精症）・Rabson-Mendenhall症候群で、子宮内発育遅延と高度のインスリン抵抗性。片方の変異は<strong>タイプA</strong>で、思春期以降に黒色表皮腫とアンドロゲン過剰（多嚢胞性卵巣）。思春期の章の第16話のPCOSの鑑別に入ります。</li>\n<li><strong>脂肪萎縮性糖尿病</strong>：脂肪がなく<strong>レプチン</strong>が欠乏する。<strong>メトレレプチン（レプチン補充）</strong>が保険適用。原因に直接届く治療です。</li>\n</ul>\n<p>冒頭の赤ちゃんは、10倍希釈のインスリンでCSIIを始め、3週間後にKCNJ11の変異が分かりました。グリベンクラミドを少しずつ増やし、1か月後、ポンプは外れました。お母さんは、粉薬をミルクに溶かしながら「注射しなくていいなんて、夢みたい」と言いました。</p>", "keys": ["新生児糖尿病は生後6か月未満発症。1型はまれで単一遺伝子性を疑う", "一過性の最多は6q24インプリンティング異常（思春期以降に再発あり）。全体ではKATPチャネル（KCNJ11・ABCC8）が多い", "KATP性は約90%がSU薬（グリベンクラミド）でインスリン離脱可。重症例はDEND症候群", "ミトコンドリア糖尿病（m.3243A>G）は難聴と母系遺伝。メトホルミンは避ける", "インスリン受容体異常（Donohue・タイプA）、脂肪萎縮性糖尿病にはメトレレプチン"], "upd": null, "quiz": [{"v": "", "q": "新生児糖尿病（NDM）の定義と分類で正しいのは。", "o": ["生後6か月未満に発症するインスリン依存性糖尿病", "生後28日未満に発症する糖尿病。頻度は1万出生に1例", "生後1年未満に発症する糖尿病。全例が永続性", "生後3か月未満に発症。全例が一過性で治療不要"], "a": 0, "e": "頻度は9〜16万出生に1例で、数週間から数か月で改善する一過性（TNDM）と以降も持続する永続性（PNDM）に分類。TNDMの代表例としてPLAGL1（ZAC）とHYMAI遺伝子のある染色体6q24領域の父性発現インプリンティング遺伝子の過剰発現によって発症する6q24関連新生児一過性糖尿病がある。PNDMの代表的な疾患であるKATPチャネル遺伝子（KCNJ11、ABCC8）異常はTNDMの症例もあり、β細胞がインスリンを分泌する際にKATPチャネルが閉鎖せずインスリン分泌が障害される。KATPチャネルは膵β細胞以外に中枢神経系にも存在することが知られており最重症例では新生児糖尿病にてんかん、発達遅滞などの神経症状を合併するDEND（developmental delay, epilepsy, neonatal diabetes）症候群を発症する。", "r": "治療 p.243"}, {"v": "", "q": "KATPチャネル遺伝子（KCNJ11、ABCC8）異常による新生児糖尿病の治療として正しいのは。", "o": ["約90%でSU薬による治療が可能でインスリンから離脱できる", "全例でインスリン療法が終生必要で、SU薬は無効である", "メトホルミン0.5 g/日から開始し、インスリンは中止する", "グリメピリド1 mg/日を1日1回で開始し、低血糖は起こらない"], "a": 0, "e": "多くの症例でグリベンクラミドが用いられ、0.2 mg/kg/日分2より開始し1週おきに0.2 mg/kg/日ずつ増量、最大2 mg/kg/日。スルホニル尿素薬はKATPチャネルを閉鎖させインスリン分泌を促進する。使用開始時にはインスリン分泌促進による低血糖に注意する。DEND症候群に伴う神経症状や他の症候性新生児糖尿病に伴う合併症に注意する。原因となる遺伝子異常により予後は異なり、遺伝子解析により80%以上の単一遺伝子異常の新生児糖尿病を同定できる。遺伝子診断ができると治療法や合併症の同定が可能となり予後を予測して診療を行うことができるため積極的な遺伝子診断を行うべき。処方例：グリベンクラミド錠「各社」（適応外）1.25、2.5 mg/錠、0.2 mg/kg/日分2より開始、1週おきに0.2 mg/kg/日ずつ増量、最大2 mg/kg/日。", "r": "治療 p.244"}, {"v": "", "q": "ミトコンドリア遺伝子異常による糖尿病で最も頻度の高い変異と、その臨床像は。", "o": ["ロイシンtRNAをコードするMT-TL1のm.3243A>G", "POLG遺伝子の核DNA変異。常染色体潜性で新生児期に発症", "MT-TK m.8344A>G。肥満を伴い2型糖尿病に類似", "ミトコンドリア遺伝子の大欠失（Kearns-Sayre症候群）が最多"], "a": 0, "e": "全糖尿病の0.5〜2.9%を占め、若年発症（平均38歳）で初期には内因性インスリン分泌を残すことが多いが数年〜10年の経過でインスリン依存性になることが多い。感音難聴と母系遺伝の存在から疑われる。その他MT-TL1（m.3254C>G、m.3256C>T、m.3264T>G、m.3271T>C）、MT-TK（m.8344A>G、m.8356T>C）、MT-TS2（m.12258T>C）、MT-TE（m.14709T>C）、MT-ND6（m.14577T>C）、ミトコンドリア遺伝子の大欠失（Kearns-Sayre症候群など、孤発性または母系遺伝）、核がコードするPOLG、RRM2B、OPA1、MPV17の病的バリアント（常染色体潜性）に伴うものが報告されている。やせ型、網膜色素変性症、心肥大などの症状を伴うこともある。確定診断は遺伝子診断で、ミトコンドリアがコードする遺伝子では組織ごとに病的バリアントの比率が異なることが多い（ヘテロプラスミー）ため末梢血を用いた遺伝子診断では病的バリアントの頻度が低いために検出されないことがある。", "r": "治療 p.241"}]}, {"id": "d15", "lv": 2, "t": "糖尿病と妊娠、生まれてくる子", "min": 6, "cats": "糖尿病と妊娠・新生児・療養指導", "src": "小児内分泌学 p.162-163 ／ 治療 p.249-253, 905-906, 1285-1287", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>1型糖尿病の女性が、妊娠38週で予定帝王切開。生まれた男の子は4,120 g。生後1時間で血糖は28 mg/dL、呼吸も速い。NICUに呼ばれました。</div><p>この章の最初に出会った9歳の男の子も、いつか大人になります。1型糖尿病の女の子なら、妊娠を考える日も来ます。今日は、母の糖尿病と、生まれてくる子どもの話です。</p>\n<h3>三つの分類</h3>\n<ul>\n<li><strong>妊娠糖尿病（GDM）</strong>：妊娠中に初めて見つかった、<strong>糖尿病に至っていない</strong>糖代謝異常</li>\n<li><strong>妊娠中の明らかな糖尿病</strong>：空腹時126以上またはHbA1c 6.5%以上</li>\n<li><strong>糖尿病合併妊娠</strong>：妊娠前からの糖尿病</li>\n</ul>\n<div class=\"formula\">GDM（75 g OGTT）：空腹時 ≥ 92、1時間 ≥ 180、2時間 ≥ 153 mg/dL のいずれか1点</div>\n<p>妊娠中はもともとインスリン抵抗性が強まり、後期でとくに顕著です。スクリーニングは妊娠初期と24〜28週に行います。</p>\n<h3>妊娠前から整える</h3>\n<p>赤ちゃんの心臓や神経管ができる<strong>器官形成期（妊娠3〜8週）</strong>の血糖が、先天異常の頻度を決めます。</p>\n<div class=\"formula\">妊娠初期HbA1c ≤ 6.3% → 先天異常 0.9%　／　≥ 6.4% → 5.4%　／　≥ 7.4% → 17.4%</div>\n<p>妊娠に気づくころには、器官形成はもう始まっています。だから<strong>妊娠前にHbA1c 6.5%未満</strong>、網膜症が安定、腎症は1〜2期まで、というのが妊娠に適した状態です。先天性心疾患が最も多く、中枢神経、消化器、四肢、尾部退行症候群などもあります。思春期の1型糖尿病の女の子への<strong>計画妊娠</strong>の教育は、ここにつながります。</p>\n<h3>妊娠中の目標と道具</h3>\n<p>目標は<strong>食前100 mg/dL未満、食後2時間120 mg/dL未満</strong>。妊娠中は鉄代謝でHbA1cが変わるので、<strong>グリコアルブミン</strong>も参考にします。インスリンは<strong>胎盤を通らない</strong>ので安全で、経口薬やGLP-1受容体作動薬は推奨されません。1型ではCSIIのほうが低血糖を避けやすいことがあります。インスリンの必要量は妊娠末期に向けて増え、<strong>分娩後には急に減る</strong>ので、前後の調整が大切です。</p>\n<p>母体のDKAは0.5〜3%、妊娠末期に多く、胎児死亡率は9〜35%。増殖網膜症は妊娠で悪化しうるので1〜2か月ごとに眼科へ。ACE阻害薬やARBは中止します。</p>\n<h3>Pedersen仮説：母の糖が、子のインスリンになる</h3>\n<p>母の血糖が高いと、ブドウ糖は胎盤を通って胎児へ。でも<strong>インスリンは通りません</strong>。胎児は自分のβ細胞を増やし、<strong>高インスリン血症</strong>になります。インスリンは成長ホルモンのように働き、<strong>巨大児</strong>に。頭はそれほど大きくないのに肩や体幹が大きいので、肩甲難産が増えます。</p>\n<h3>生まれてからの合併症</h3>\n<ul>\n<li><strong>低血糖</strong>：生まれて供給が断たれても、インスリンは高いまま。遷延することがあります。</li>\n<li><strong>呼吸窮迫症候群</strong>：インスリンが肺のⅡ型上皮細胞の<strong>サーファクタント産生を妨げる</strong>ので、<strong>38週でもRDS</strong>が起こりえます。予定帝王切開による一過性多呼吸も重なります。</li>\n<li><strong>低Ca血症</strong>：副甲状腺の未熟さに、低血糖→グルカゴン→カルシトニンが加わります。母の尿細管障害で<strong>低Mg</strong>も。カルシウムの章の第3話の早発型です。</li>\n<li><strong>多血症・黄疸</strong>：糖化ヘモグロビンが酸素を離しにくく、胎児の酸素需要も増えるので、エリスロポエチンが増えます。</li>\n<li><strong>心筋肥大</strong>：グリコーゲンが心筋にたまる。多くは6か月までに自然に治りますが、非対称性中隔肥大では強心薬が流出路狭窄を悪化させるので注意します。</li>\n</ul>\n<p>NICUでは、10%ブドウ糖の点滴で血糖を保ちながら、CaとMgを測り、胸のX線を撮りました。呼吸は2日で落ち着き、低血糖は4日目に終わりました。お母さんの病室には、インスリンの量を半分に減らす指示が出ていました。</p>", "keys": ["妊娠中の糖代謝異常はGDM・明らかな糖尿病・糖尿病合併妊娠。GDMは75 g OGTTで92/180/153", "器官形成期（3〜8週）のHbA1cが先天異常を決める。妊娠前にHbA1c 6.5%未満", "妊娠中目標は食前100未満・食後2時間120未満。インスリンは胎盤を通らず安全", "Pedersen仮説：母の高血糖→胎児高インスリン血症→巨大児・新生児低血糖", "インスリンがサーファクタント産生を抑え38週でもRDS。低Ca・低Mg・多血症・心筋肥大"], "upd": null, "quiz": [{"v": "", "q": "糖尿病母体から出生した新生児の先天異常の発症頻度とHbA1cの関係として述べられているのは。", "o": ["器官形成期（妊娠3〜8週）のHbA1c濃度と正の相関", "HbA1cと無関係で、先天異常の頻度は一般集団と同等", "HbA1c 8%以上で初めて上昇し、神経管閉鎖障害が最多", "HbA1c 6%以上で50%に先天異常を認める"], "a": 0, "e": "妊娠初期HbA1c 6.3%以下で0.9%、6.4%以上5.4%、7.4%以上17.4%。先天性心疾患の発症率が一番高い。その他に中枢神経系、消化器、四肢に先天異常を認めることが多い。成因は不明な点が多いがミトコンドリアにおけるフリーラジカルの過剰産生や、プロスタグランジンI₂産生抑制による血管れん縮のため組織血管形成の変化、高血糖からのアポトーシス、アラキドン酸やミオイノシトールの変化などがあげられている。特徴的な先天異常として知られている左側大腸低形成や尾退行症候群は近年の妊婦の糖代謝管理の進歩によりその頻度は減少している。妊娠中期および後期の血糖上昇の影響で新生児に現れる合併症（表17）：低血糖症、巨大児あるいはLGA児、新生児仮死、早期産、新生児呼吸窮迫症候群、低Ca血症、低Mg血症、心筋肥大、多血症、高ビリルビン血症。", "r": "治療 p.251-252"}, {"v": "", "q": "糖尿病母体から出生した新生児の呼吸窮迫症候群（RDS）について正しいのは。", "o": ["インスリンが肺胞2型上皮細胞に作用しサーファクタント産生を阻害", "糖尿病母体児ではサーファクタント産生が亢進しRDSはまれである", "RDSは早産児のみに生じ、正期産の糖尿病母体児では生じない", "高血糖がサーファクタント産生を促進するため人工サーファクタントは不要"], "a": 0, "e": "巨大児のため予定帝王切開で出生し肺胞液吸収遅延が発症し新生児一過性多呼吸のリスクも高く、妊娠38週でもRDSを発症する可能性がある。高血糖状態が持続すると胎児の肺胞2型上皮細胞が少なくなることも報告されている。Opatiらの報告によると、糖尿病母体から出生した新生児は非糖尿病母体から出生した新生児と比較してRDS発症頻度が高い。人工呼吸器管理や人工肺サーファクタントの気管内投与を必要に応じて考慮する。高出生体重児：多量のブドウ糖が胎盤を介して胎児に移行するため胎児は高インスリン血症となる。インスリンはグリコーゲンの蓄積のほか脂質や蛋白質の合成も促進するため高出生体重児となる。糖尿病母体から出生した新生児は頭囲はそれほど大きくないが肩や体幹が大きくなるため肩甲難産に伴う分娩外傷の頻度が高くなる。", "r": "治療 p.252"}, {"v": "", "q": "妊娠糖尿病（GDM）の診断基準（75 g OGTT）として正しいのは。", "o": ["空腹時≥92、1時間≥180、2時間≥153 mg/dLのいずれか1点以上", "空腹時≥126、2時間≥200 mg/dLの両方を満たすこと（非妊娠時と同じ基準）", "空腹時≥100、2時間≥140 mg/dLのいずれか", "空腹時≥110のみで判定する"], "a": 0, "e": "「妊娠中の明らかな糖尿病」は空腹時≥126またはHbA1c≥6.5%。妊娠前からの糖尿病（pregestational）と区別する。妊娠中はHbA1cの基準をそのまま当てはめられない。", "r": "小児内分泌学 p.162"}]}, {"id": "d16", "lv": 1, "t": "肥満を測る：肥満度、肥満症、メタボ", "min": 6, "cats": "肥満・メタボリックシンドローム", "src": "p.491-495 ／ 小児内分泌学 p.90-92, 579-585", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>小学4年生の男の子。学校から「肥満度45%」の通知をもらって来ました。お母さんは「太ってるのは分かってるんですけど、病気なんですか？」</div><p>肥満は、それだけでは病気ではありません。でも、肥満が<strong>健康を損ねはじめた状態</strong>は、治療すべき病気です。今日はその線引きの物差しです。</p>\n<h3>肥満度</h3>\n<div class=\"formula\">肥満度（%）＝（実測体重 − 標準体重）÷ 標準体重 × 100</div>\n<p>標準体重は、学童では性別・年齢別・身長別、幼児では性別・身長別のものを使います。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>軽度</th><th>中等度</th><th>高度</th></tr>\n<tr><td>学童（6〜18歳）</td><td>+20%以上</td><td>+30%以上</td><td>+50%以上</td></tr>\n<tr><td>幼児</td><td>+15% ふとりぎみ</td><td>+20% やや太りすぎ</td><td>+30% 太りすぎ</td></tr></table></div>\n<p>幼児の基準が厳しいのは、予防の意味が大きいからです。海外ではBMIパーセンタイル（85以上で過体重、95以上で肥満）を使いますが、年長児では肥満を少なく見積もるという指摘があります。</p>\n<h3>まず、内分泌の病気を拾う</h3>\n<p>肥満の子のうち、内分泌や遺伝の病気が原因なのは<strong>5%以下</strong>とされます（過小評価かもしれません）。その5%を拾う物差しは、ここまで何度も出てきました。<strong>身長の伸びが落ちていないか</strong>。単純性肥満では背も伸びます。伸びが落ちていれば、<strong>甲状腺機能低下症、Cushing症候群、GH分泌不全</strong>を考えます（前章の第6話）。ほかに、発達の遅れ、特徴的な顔立ちや奇形、薬の服用歴、とても幼いころからの発症も手がかりです。</p>\n<h3>小児肥満症：治療すべき肥満</h3>\n<p>日本肥満学会の小児肥満症の診断基準（6〜18歳）は、こう組み立てます。</p>\n<ul>\n<li><strong>A項目</strong>（肥満治療が必要な医学的異常）：高血圧、<strong>睡眠時無呼吸などの換気障害</strong>、2型糖尿病・耐糖能障害、内臓脂肪型肥満、早期動脈硬化</li>\n<li><strong>B項目</strong>（肥満と関連の深い代謝異常）：脂肪肝、高インスリン血症・黒色表皮症、高TC/non-HDL-C、高TG/低HDL-C、高尿酸血症</li>\n<li>参考項目：皮膚線条、運動器の機能不全、月経異常、不登校・いじめ、低／高出生体重</li>\n</ul>\n<div class=\"formula\">A項目1つ以上　または　肥満度50%以上でB項目1つ以上　または　50%未満でB項目2つ以上</div>\n<h3>内臓脂肪を測る</h3>\n<p>内臓脂肪型肥満の判定は、臍の高さのCTで<strong>内臓脂肪面積60 cm²以上</strong>（大人は100 cm²）。代わりに、<strong>ウエスト周囲長</strong>が小学生75 cm、中学生以上80 cm以上、または<strong>ウエスト身長比0.5以上</strong>。身長の半分というのは、年齢や性別を問わずに使える簡単な目安です。</p>\n<h3>メタボリックシンドロームとの違い</h3>\n<p>小児のメタボリックシンドローム（6〜15歳）は、<strong>腹囲80 cm以上</strong>（小学生75 cm、または腹囲/身長0.5以上）が必須で、そこに脂質（TG 120以上かつ/またはHDL 40未満）、血圧（125/70以上）、空腹時血糖100以上のうち<strong>2つ以上</strong>。</p>\n<p>肥満症は<strong>治療する病気</strong>として、メタボは<strong>リスクの集まり</strong>として疫学に比重がある、という違いです。肥満の子の健診では10〜25%、一般の子では1〜2%がメタボに当たります。治療の効果は体重だけでなく、<strong>腹囲の減り</strong>で見ます。</p>\n<p>冒頭の男の子は、身長は伸びていて、血圧は128/74、ALTが62で脂肪肝、腹囲は82 cm。肥満度45%でB項目が2つ（脂肪肝と、高インスリン血症の黒色表皮症）あり、小児肥満症と診断しました。「太っているだけじゃなくて、体が少し困りはじめているサインがあるんだ。だから、一緒に治そう」。</p>", "keys": ["肥満度＝（実測−標準）÷標準×100。学童は20/30/50%で軽度/中等度/高度、幼児は15/20/30%", "内分泌性肥満は5%以下。身長の伸びの低下で甲状腺機能低下・Cushing・GHDを拾う", "小児肥満症：A項目1つ以上、または+50%以上でB項目1つ、+50%未満でB項目2つ", "内臓脂肪型：CT 60 cm²以上、腹囲 小学生75・中学生80 cm、ウエスト身長比0.5以上", "小児メタボは腹囲80 cm（小学生75）必須＋脂質・血圧125/70・血糖100のうち2つ"], "upd": null, "quiz": [{"v": "", "q": "小児肥満症診断基準（日本肥満学会2017）の対象年齢と診断の組み立てで正しいのは。", "o": ["3歳以上18歳未満。A項目2つ以上、または肥満度+30%以上でB項目1つ以上、または+30%未満でB項目2つ以上で診断する", "6歳以上18歳未満。A項目1つ以上、または肥満度+50%以上でB項目1つ以上、または+50%未満でB項目2つ以上で診断する", "6歳以上15歳未満。A項目とB項目を各1つ以上同時に有するか、肥満度+50%以上で参考項目2つ以上を有する場合に診断する", "6歳以上18歳未満。肥満度+30%以上で、A項目またはB項目のいずれか1つ以上、または参考項目3つ以上あれば診断する"], "a": 1, "e": "A項目は肥満治療を必要とする医学的異常、B項目は肥満と関連が深い代謝異常。参考項目は2つ以上あればB項目1つと同等とする。肥満の定義は肥満度+20%以上かつ体脂肪率増加（男児25%以上、女児11歳未満30%以上・11歳以上35%以上）。", "r": "小児内分泌学 表4 p.580"}, {"v": "", "q": "小児肥満症診断基準の内臓脂肪型肥満の判定で正しいのは。", "o": ["臍部CT内臓脂肪面積100 cm²以上、またはウエスト周囲長が男子85 cm・女子90 cm以上、またはウエスト身長比0.55以上", "臍部CT内臓脂肪面積60 cm²以上、またはウエスト周囲長が小学生75 cm・中学生以上80 cm以上、またはウエスト身長比0.5以上", "ウエスト周囲長が身長の1/2以上で、かつBMIが95パーセンタイル以上、または臍部CT内臓脂肪面積80 cm²以上の場合に判定する", "腹部超音波で内臓脂肪厚が皮下脂肪厚を上回り、かつ肥満度+30%以上、またはウエスト周囲長が小学生80 cm・中学生85 cm以上で判定する"], "a": 1, "e": "小児では内臓脂肪面積60 cm²を超えると代謝異常の個数が増加する（成人は100 cm²）。腹囲75 cmは小学生、80 cmは中学生で感度・特異度が良好。ウエスト身長比は年齢・性別を問わず単一基準で使え、感度は良いが特異度は低い。", "r": "小児内分泌学 表5 p.581"}, {"v": "", "q": "小児期（6〜15歳）メタボリックシンドローム診断基準（厚労省研究班2007）で正しいのは。", "o": ["腹囲85 cm以上（小学生80 cm以上、または腹囲/身長0.55以上）が必須で、脂質・血圧・空腹時血糖のうち1項目以上", "腹囲80 cm以上（小学生75 cm以上、または腹囲/身長0.5以上）が必須で、脂質・血圧・空腹時血糖のうち2項目以上", "肥満度+20%以上（または腹囲/身長0.5以上）が必須で、脂質・血圧・空腹時血糖のうち2項目以上", "腹囲80 cm以上・脂質・血圧・空腹時血糖の4項目のうち、腹囲を含まなくてもいずれか3項目以上"], "a": 1, "e": "脂質：TG 120 mg/dL以上かつ／またはHDL-C 40 mg/dL未満。血圧：収縮期125かつ／または拡張期70 mmHg以上。空腹時血糖100 mg/dL以上。食後2時間以降ならTG 150以上、血糖100以上でスクリーニングする。", "r": "小児内分泌学 表7 p.584"}]}, {"id": "d17", "lv": 2, "t": "食欲の回路と、肥満の始まり", "min": 6, "cats": "肥満", "src": "p.497 ／ 小児内分泌学 p.571-578", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>2歳の女の子。生後すぐから異常なほどお腹をすかせ、泣いてミルクを求め続けたそうです。いまは肥満度80%。両親はやせ型です。お母さんは涙ぐんで言います。「私の育て方が悪いんでしょうか」</div><p>「食べすぎだから太る」。それは半分しか正しくありません。<strong>なぜ食べすぎてしまうのか</strong>には、脳の回路と、生まれる前からの歴史があります。今日はその二つです。</p>\n<h3>弓状核の二つのニューロン</h3>\n<p>食欲の司令塔は、視床下部の<strong>弓状核</strong>です。そこにアクセルとブレーキがあります。</p>\n<ul>\n<li><strong>アクセル：NPY/AgRPニューロン</strong>。空腹で血糖が下がり、胃から<strong>グレリン</strong>が出ると働きます。AgRPは<strong>MC4Rを止める</strong>物質です。</li>\n<li><strong>ブレーキ：POMCニューロン</strong>。満腹で血糖が上がり、脂肪から<strong>レプチン</strong>が出ると働きます。POMCから<strong>α-MSH</strong>が作られ、<strong>MC4R</strong>を介して食欲を止めます。</li>\n</ul>\n<p>外側野には、食欲を促すオレキシンやMCHのニューロンがあります。報酬系（中脳辺縁系のドパミン）も「おいしい」に関わります。最近は、肝臓から出て食欲を促す<strong>アスプロシン</strong>（FBN1のC末端由来）も見つかりました。</p>\n<h3>一つの遺伝子で太る</h3>\n<p>レプチン → POMC → α-MSH → MC4R という道のどこが壊れても、ブレーキが効かず肥満になります。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>遺伝子</th><th>特徴</th></tr>\n<tr><td><strong>MC4R</strong></td><td>単一遺伝子性肥満で<strong>最多</strong>。ヘテロでも発症</td></tr>\n<tr><td>レプチン・レプチン受容体</td><td>肥満、インスリン抵抗性、性腺機能低下</td></tr>\n<tr><td>POMC</td><td>赤毛、ACTH低値（副腎不全）</td></tr>\n<tr><td>PCSK1</td><td>性腺機能低下、高プロインスリン血症</td></tr>\n<tr><td>BDNF</td><td>発達の遅れ、多動、痛覚障害（MC4Rの下流）</td></tr></table></div>\n<p>思春期の章の第15話で見た<strong>Prader-Willi症候群</strong>も、視床下部の問題で、満腹にならない病気でした。多くの人に当てはまる「なりやすさ」の遺伝子としては、GWASで最初に見つかった<strong>FTO</strong>があります。</p>\n<h3>生まれる前から始まっている：DOHaD</h3>\n<p>Barkerは、低出生体重で生まれた人に虚血性心疾患が多いことに気づきました。胎内で栄養が少ない環境に適応した<strong>倹約型の体</strong>で生まれると、生まれてからの豊かな栄養に過敏に反応して、太りやすくなる。これがDOHaD（成人病胎児期発症説）です。</p>\n<p>反対側には、第15話の<strong>Pedersen仮説</strong>があります。母の高血糖で胎児が高インスリン血症になり、大きく生まれる。高出生体重も、将来の肥満のリスクです。低出生体重の子でも、乳幼児期に<strong>急なキャッチアップ</strong>があると、内臓脂肪型の肥満に進みやすくなります。</p>\n<h3>adiposity rebound：5歳より前の「再上昇」</h3>\n<p>BMIは乳児期にいったんピークを迎え、そのあと下がり、<strong>5〜7歳</strong>で再び上がり始めます。この再上昇の時点を<strong>adiposity rebound（AR）</strong>と呼びます。<strong>5歳より前</strong>にARが来る（早期AR）と、小児期・成人期の肥満、糖尿病、メタボのリスクが上がります。</p>\n<p>実践的な使い方があります。<strong>1歳6か月のときよりBMIが上がっている3歳児</strong>は、まだ太っていなくてもハイリスク。栃木県大田原市では、そうした子に5歳まで介入して、約9割でBMIパーセンタイルが改善しました。幼児の肥満は健康障害が少なく「肥満症」には当たりませんが、高い確率で学童の肥満に移ります。</p>\n<p>冒頭の女の子は、MC4Rにヘテロの変異が見つかりました。お母さんには、こう伝えました。「お腹がすくのを止めるブレーキの部品が、生まれつき一つ弱いんです。育て方のせいではありません。だから、気合いではなく、環境の工夫で一緒に守っていきましょう」。</p>", "keys": ["弓状核：NPY/AgRP（摂食促進、グレリン）とPOMC（α-MSH→MC4Rで抑制、レプチン）", "単一遺伝子性肥満の最多はMC4R（ヘテロでも発症）。POMCは赤毛・副腎不全、PCSK1は高プロインスリン", "FTOはGWASで最初の肥満関連遺伝子", "DOHaD：低出生体重は倹約型、急なキャッチアップで内臓脂肪型肥満へ。Pedersen仮説で高出生体重も", "5歳前の早期adiposity reboundは将来の肥満・糖尿病リスク。1歳6か月よりBMIが上がった3歳児は介入"], "upd": null, "quiz": [{"v": "", "q": "視床下部弓状核で摂食を促進するニューロンと伝達物質の組み合わせは。", "o": ["POMCニューロン：α-MSHを分泌しMC4Rを活性化して摂食を促し、空腹時に働く", "NPY/AgRPニューロン：NPY・AgRP・GABAを分泌しMC4Rを抑制する", "CRHニューロン：室傍核でオレキシンとGABAを分泌しMC4Rを抑制する", "ドパミンニューロン：側坐核に投射して弓状核のMC4R陽性ニューロンを活性化する"], "a": 1, "e": "POMCニューロンはα-MSHを産生しMC3R/MC4Rを介して摂食を抑制する。AgRPはMC4Rの内因性拮抗ペプチドで摂食を促進する。空腹時は血糖低下とグレリンでNPY/AgRPが、満腹時は血糖上昇とレプチンでPOMCが働く。", "r": "小児内分泌学 p.571-572"}, {"v": "", "q": "単一遺伝子変異によるヒト肥満の原因遺伝子のうち、最も高頻度とされるのは。", "o": ["LEP：レプチン欠損で性腺機能低下を伴う", "POMC：赤毛と低コルチゾール血症を伴う", "MC4R：ヘテロ接合体変異でも肥満を発症する", "PCSK1：高プロインスリン血症を伴う"], "a": 2, "e": "MC4R遺伝子変異は単一遺伝子変異による肥満として最も高頻度で、ヘテロでも発症する。レプチン・レプチン受容体異常は肥満+インスリン抵抗性+性腺機能低下。POMCは赤毛・低ACTH、PCSK1は低インスリン・高プロインスリン血症。", "r": "小児内分泌学 表1 p.574"}, {"v": "", "q": "adiposity rebound（AR）とは何か。", "o": ["出生後6か月から12か月にかけてBMIがピーク（adiposity peak）を迎える時点", "思春期の成長スパートに伴い除脂肪体重と体脂肪率が急増しはじめる時期", "乳児期のピーク後に減少したBMIが、5〜7歳で再び上昇に転ずる時点", "SGA児が出生後2年以内にキャッチアップして体重を標準域まで取り戻す現象"], "a": 2, "e": "Rolland-Cacheraが1984年に提唱。1歳以降のBMIの最低値をARのタイミングとする。5歳未満のARを早期ARとし、早期ARは小児・成人期の肥満、糖尿病、メタボリックシンドローム、高血圧のリスクを上げる。", "r": "小児内分泌学 p.577-578"}]}, {"id": "d18", "lv": 2, "t": "肥満を治す：小さな目標と長い伴走", "min": 6, "cats": "肥満", "src": "p.491-495 ／ 小児内分泌学 p.579, 582 ／ 治療 p.257-262", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>第16話の小学4年生。初診から2か月、体重は1 kg増えていました。お母さんが言います。「毎日怒ってるんですけど、全然だめで…」</div><p>小児肥満の治療は、急いで痩せさせることではありません。最大のゴールは、<strong>大人へ肥満を持ち越さないこと</strong>（トラッキングを防ぐこと）です。改善しなければ<strong>約2/3が成人の肥満</strong>に移ります。だから、短い効果より、<strong>どれだけ続けられるか</strong>を設計します。</p>\n<h3>目標は「増やさない」から</h3>\n<p>子どもは背が伸びます。だから、体重を減らさなくても、<strong>増やさなければ</strong>肥満度は下がっていきます。短期の目標は4段階です。</p>\n<ol>\n<li>肥満度を増やさない</li>\n<li>肥満度を下げる</li>\n<li><strong>体重を増やさない</strong></li>\n<li>体重を減らす</li>\n</ol>\n<p>背が伸びる子は、まず③、難しければ②。成人身長に近い子や、100 kgを超えるような子は④、次に③。長い目で見た目標は、予測される成人身長でBMI 25に当たる体重などです。</p>\n<h3>体重を毎日測る、責めずに褒める</h3>\n<p>家庭での体重測定は、<strong>1日1回、夕食の前</strong>に。夕食の食べすぎを抑える効果も期待できます。そして<strong>1週間の最高値を「超えてはいけない体重」</strong>にします。それを超えたら、エネルギーの収支がプラスだと分かるので、食事を減らし、体を動かす。</p>\n<p>大事なのは、<strong>測ったこと（行動）を褒めて、結果を責めない</strong>ことです。行動目標は実行できる具体的なものにし、1回の診察で伝えるのは<strong>1〜2点</strong>に絞ります。</p>\n<h3>食事と運動</h3>\n<p>肥満の子の食事は、ご飯が多い、肉を好む、野菜嫌い、汁物を飲まない、間食や清涼飲料水・牛乳が多い、という傾向があります。目指すのは<strong>一汁三菜の和食</strong>（糖質50〜55%、蛋白質20%、脂質25〜30%）。主菜は肉より魚や大豆。給食は制限しないけれど、お代わりは控える。食べ放題は控える。「いつでも、どこでも、好きなものを好きなだけ」から「好き嫌いなく適量、早寝早起き朝ごはん」へ。</p>\n<p>運動は<strong>毎日20〜30分以上</strong>、スクリーンタイムは<strong>2時間以内</strong>。運動習慣のない子には、好きな音楽で踏み台昇降、動画のエクササイズ、家族で散歩。楽しいことが続く条件です。</p>\n<h3>見逃してはいけない合併症</h3>\n<p>高度肥満では、<strong>睡眠時無呼吸から肺胞低換気</strong>に進むことがあります。本書には、減量が進まないまま急変して亡くなった子の記録があります。いびき、日中の眠気、夜間のSpO₂を、<strong>早く、繰り返し</strong>評価します。無呼吸低呼吸指数20以上ならCPAPです。</p>\n<p><strong>脂肪肝（NAFLD/NASH）</strong>は肝硬変に至ることがあり、進行度は血液だけでは読めません。高度肥満の子は骨年齢が進み、思春期の身長スパートが減ったり消えたりして、成人身長は必ずしも高くなりません。</p>\n<p>尿アルブミンが続けば6歳以上でカンデサルタン、尿酸が8.0以上でアロプリノールなど、合併症への薬はありますが、肥満そのものへの薬は小児ではほとんど使えません。</p>\n<p>お母さんには、こう伝えました。「怒るのを一回やめてみませんか。毎晩夕食の前に体重を測ったら、それだけで『えらい』と言ってください。目標は、来月、今の体重を超えないこと。それだけです」。2年後、彼の体重は2年前とほぼ同じで、身長は11 cm伸び、肥満度は45%から22%になっていました。</p>", "keys": ["最大のゴールは成人への持ち越しを防ぐこと（改善しなければ約2/3が成人肥満）", "短期目標は4段階。背が伸びる子は「体重を増やさない」から", "夕食前の毎日の体重測定、1週間の最高値を超えない。測ったことを褒め結果を責めない", "一汁三菜の和食、毎日20〜30分の運動、スクリーンタイム2時間以内", "高度肥満は睡眠時無呼吸から肺胞低換気で急変しうる。早期に繰り返し評価"], "upd": null, "quiz": [{"v": "", "q": "肥満小児の短期目標体重の設定で、本書が示す4段階と選び方は。", "o": ["体重10%減、肥満度20%未満、BMI正常化、体脂肪率正常化の4段階を順に目指す", "BMI 25未満、肥満度10%未満、腹囲80 cm未満、体脂肪率25%未満の4段階を順に達成", "運動量増加、間食中止、睡眠確保、登校促進の4段階で体重目標は設けない", "肥満度を増やさない／下げる、体重を増やさない／減らすの4段階"], "a": 3, "e": "身長増加が予測される例は②か③、まず③（体重を増やさない）を目標とし困難なら②へ。成人身長が近い症例や成人肥満に相当する体重の症例（たとえば100 kg以上など）では④を目標、次に③。長期的な目標体重は成人になったときに肥満ではない体重で、成長曲線と骨年齢などから成人身長を予測し、その身長でのBMI 25 kg/m²相当の体重などとする。", "r": "治療 p.257"}, {"v": "", "q": "肥満小児の家庭体重測定で本書が勧める方法は。", "o": ["週1回同じ曜日の朝に測定し、前週より増えていれば間食を禁じる", "毎食後に測定し、食事ごとの増加量から摂取エネルギーを推定する", "1日1回夕食前に測定し、1週間の最高値を超えてはいけない体重とする", "起床直後と就寝前の1日2回測定し、差が1 kg以内になるよう調整する"], "a": 2, "e": "その後、その体重を超えた場合はエネルギー収支がプラスと判断し食事量を減らし運動するように心がける。体重測定をしたこと（行動）を褒め、結果を責めないよう親に指導する。行動目標は実行可能な具体的内容に、1回の診察での指導は1、2点に絞る。", "r": "治療 p.258, 260, 図1"}, {"v": "高度肥満の患児。入眠中にSpO2が60%台まで低下し、血液ガスでpCO2の貯留と呼吸性アシドーシスを認めた。", "q": "この病態について正しいのは。", "o": ["肥満に伴う閉塞性睡眠時無呼吸から肺胞低換気に至った状態で、死亡例が報告されている", "一過性の換気低下で、日中に症状がなければ経過観察でよく、減量後に睡眠検査で評価すればよい病態", "減量が先決で、減量後に睡眠検査を行えばよい", "肥満とは関係のない中枢性睡眠時無呼吸である"], "a": 0, "e": "本書には減量が進まないまま急変し死亡した症例が記載されている。高度肥満では呼吸の評価を早期に、繰り返し行う。", "r": "症例1 p.491-493"}]}, {"id": "d19", "lv": 2, "t": "脂質異常症と家族性高コレステロール血症", "min": 6, "cats": "脂質異常症・肥満・2型糖尿病", "src": "小児内分泌学 p.586-588 ／ 治療 p.236, 263-265", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>小学5年生の女の子。学校の生活習慣病健診で総コレステロール286 mg/dL。やせ型です。問診すると、お父さんが48歳で心筋梗塞を起こしていました。</div><p>子どもの脂質異常の多くは、肥満に伴うものです。でも、その中に、<strong>早く見つけて治療すれば人生が変わる</strong>病気が混じっています。<strong>家族性高コレステロール血症（FH）</strong>です。</p>\n<h3>リポ蛋白の地図</h3>\n<p>脂質は、蛋白質と組んだ<strong>リポ蛋白</strong>として血液を運ばれます。比重の軽い順に、<strong>カイロミクロン → VLDL → IDL → LDL → HDL</strong>。それぞれ、運ぶ脂質とアポ蛋白の組み合わせが違います。</p>\n<h3>小児の基準（空腹時）</h3>\n<div class=\"formula\">TC ≥ 220、LDL-C ≥ 140、TG ≥ 140、non-HDL-C ≥ 150、HDL-C &lt; 40 mg/dL</div>\n<p>LDL-CはFriedewald式（TC − HDL-C − TG/5）で出しますが、食後や高TG（400以上）では使えず、non-HDL-C（TC − HDL-C）で判断します。乳児は母乳で高く出ることがあるので離乳後に再検し、思春期にはLDL-Cが下がります。</p>\n<h3>まず続発性を除く</h3>\n<p>高コレステロールの続発性の原因は、<strong>甲状腺機能低下症</strong>、ネフローゼ症候群、閉塞性黄疸、Cushing症候群。<strong>甲状腺機能の検査は必須</strong>です。甲状腺の章の第10話で見た橋本病が、コレステロールで見つかることもあります。最も多いのは、肥満に伴うものです。</p>\n<h3>FH：300人に1人</h3>\n<p>FHヘテロ接合体は<strong>約300人に1人</strong>と、とても多い病気です。LDL受容体などの異常で、生まれたときからLDLが高く、頸動脈の内膜中膜の肥厚は、FHでない子の<strong>5倍以上早く</strong>進みます。</p>\n<div class=\"formula\">小児FHの診断：未治療LDL-C ≥ 140 ＋ FHまたは早発性冠動脈疾患の家族歴（2親等以内）</div>\n<p>早発性冠動脈疾患とは、男性55歳未満、女性65歳未満の発症です。子どもでは黄色腫などの所見が乏しいので、<strong>家族歴</strong>が診断の鍵です。鑑別には、母乳性の高コレステロール血症、リソソーム酸性リパーゼ欠損症、シトステロール血症などがあります。</p>\n<h3>10歳から、スタチン</h3>\n<p>早くスタチンを始めると、冠動脈疾患の発症を、FHでない人と同じくらいまで遅らせられます。</p>\n<div class=\"formula\">10歳以上：指導後もLDL-C ≥ 180 が2回以上 → 薬物療法、目標 &lt; 140 mg/dL<br>10歳未満：LDL-C ≥ 200 なら専門家と相談</div>\n<p>第一選択はスタチンで、<strong>ピタバスタチン</strong>が10歳以上の小児FHに承認されています。最小量から始め、1か月後に脂質・肝機能・CK・筋症状を確かめ、以後3〜4か月ごと。成長と二次性徴も見ます。女の子には、スタチンの<strong>催奇形性</strong>と計画妊娠の大切さを、本人と保護者に伝えます。</p>\n<p>ホモ接合体はずっと重く、高強度スタチンから始め、<strong>4〜6歳ごろからLDLアフェレシス</strong>を考えます。</p>\n<h3>もう二つの原発性</h3>\n<ul>\n<li><strong>家族性複合型高脂血症（FCHL）</strong>：人口の約1%と多く、TGが変動して表現型が変わる。65歳以下の心筋梗塞の30%の基礎疾患。小児期の薬物療法の根拠はありませんが、メタボになりやすいので見守ります。</li>\n<li><strong>原発性高カイロミクロン血症</strong>：最も重要なのは<strong>LPL欠損症</strong>（50万〜100万人に1人）。極端な高TGで<strong>膵炎</strong>を起こすのが最大の問題で、脂肪制限の食事療法が基本です。</li>\n</ul>\n<p>冒頭の女の子はLDL-Cが212。お父さんの心筋梗塞と合わせてFHと診断し、まず食事を整えて、2か月後も198だったのでピタバスタチン1 mgを始めました。お父さんの弟や、いとこたちにも検査を勧めました。一人の子の診断が、家族の心臓を守るきっかけになります。</p>", "keys": ["小児の脂質基準：TC 220、LDL-C 140、TG 140、non-HDL-C 150以上、HDL-C 40未満", "続発性（甲状腺機能低下・ネフローゼ・Cushing・肥満）を除く。甲状腺機能は必須", "FHヘテロは約300人に1人。診断はLDL-C≥140＋FH/早発性冠動脈疾患の家族歴", "10歳以上でLDL-C≥180が続けばスタチン（ピタバスタチン承認）、目標140未満。女児には催奇形性の説明", "FCHLは約1%で表現型が変動。LPL欠損症は高TGで膵炎、脂肪制限"], "upd": null, "quiz": [{"v": "", "q": "小児家族性高コレステロール血症（FH）の診断基準（日本小児科学会ほか2017）は。", "o": ["未治療LDL-C 140 mg/dL以上と、FHまたは早発性冠動脈疾患の家族歴（2親等以内）の2項目", "未治療LDL-C 180 mg/dL以上、腱黄色腫、FHの家族歴（3親等以内）の3項目のうち2項目", "未治療LDL-C 140 mg/dL以上と、角膜輪または腱黄色腫のいずれか1つの身体所見の2項目", "未治療LDL-C 160 mg/dL以上と、早発性冠動脈疾患の家族歴（3親等以内）、黄色腫の3項目"], "a": 0, "e": "総コレステロール220以上の場合にLDL-Cを測定する。続発性を除外。小児では腱黄色腫などの臨床症状に乏しく、診断には家族歴が重要で、必要なら2親等を超えた家族調査も参考にする。早発性冠動脈疾患は男性55歳未満・女性65歳未満の発症。黄色腫やLDL-Cが非常に高値ならホモ接合体を疑う。", "r": "小児内分泌学 表12 p.588"}, {"v": "", "q": "小児FHヘテロ接合体の薬物療法開始基準（図6）で正しいのは。", "o": ["10歳以上でLDL-C 160 mg/dL以上なら1回の測定で薬物療法を開始し、生活指導は省略", "10歳以上で指導後もLDL-C 180以上が2回以上続けば薬物療法、10歳未満は200以上で専門家と相談", "年齢を問わずLDL-C 140 mg/dL以上で直ちに薬物療法を開始し、140未満を維持する", "18歳以降にLDL-C 190 mg/dL以上で開始し、小児期は生活指導と年1回の採血のみ"], "a": 1, "e": "1か月程度の指導後にLDL-C値を評価、180未満なら定期的にフォロー（年3回程度）。第一選択はスタチンで最小用量から開始。わが国ではピタバスタチン（リバロ錠・OD錠1、2 mg）が10歳以上の小児FHに承認。処方例：リバロ錠1 mg 1錠/日分1（夜）。早発性冠動脈疾患の家族歴または糖尿病合併では管理目標140 mg/dL未満を確実に維持。", "r": "治療 p.263-264, 図6"}, {"v": "", "q": "小児の原発性高カイロミクロン血症で最も重要な原因と、最大の問題となる合併症は。", "o": ["アポ蛋白E異常症で、早発性冠動脈疾患", "LPL欠損症で、高度の高TG血症による膵炎", "LDL受容体異常で、腱黄色腫と角膜輪", "CETP欠損症で、著明な高HDL-C血症"], "a": 1, "e": "LPL欠損症は常染色体潜性で推定頻度50万〜100万人に1人。LPL活性化に関わるアポC-Ⅱ、アポA-Ⅴ欠損、LPLを血管内皮へ運ぶGPIHBP1欠損、LPL成熟に関わるLMF1欠損も原因となる。治療は食事療法が基本。部分型では早朝空腹時のTGはそれほど高くない。", "r": "小児内分泌学 p.586, 表9 p.587"}]}, {"id": "d20", "lv": 2, "t": "低血糖を読む：ケトンとクリティカルサンプル", "min": 6, "cats": "低血糖症", "src": "症例1 p.497-501 ／ 小児内分泌学 p.142-143, 156, 572 ／ 治療 p.248-249, 1284", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>3歳の男の子。かぜで昨日の夕食を食べずに寝てしまい、今朝なかなか起きず、ぐったりしてけいれんしました。救急で血糖20 mg/dL。研修医がすぐにブドウ糖を入れようとしています。</div><p>低血糖の子を前にしたとき、いちばん大事なのは、<strong>ブドウ糖を入れる前の一本の採血</strong>です。今日は、その採血と、そこから原因をたどる地図、そして幼児で最も多い低血糖の話です。</p>\n<h3>クリティカルサンプル</h3>\n<p>低血糖のその場で採っておかないと、あとから原因を分けられません。</p>\n<ul>\n<li><strong>必須</strong>：血糖、インスリン・Cペプチド、血液ガス、乳酸、アンモニア、遊離脂肪酸、ケトン体（βOHB）、保存用の血清と尿</li>\n<li>ほかに：ACTH・コルチゾール、GH・IGF-1、FT4・TSH、アシルカルニチン（タンデムマス）。尿は有機酸分析用に保存</li>\n</ul>\n<p>採ったら、すぐにブドウ糖です。0.2 g/kg程度を目安に、反応を見ながら持続点滴へつなぎます。ただ、計算どおりには上がりません。感染などで糖の消費が増えていれば、もっと小さくなります。点滴を始めても、しばらくぼーっとしていることもあります。</p>\n<h3>最初の分かれ道は「ケトン」</h3>\n<p>低血糖のとき、体は脂肪を分解して<strong>ケトン</strong>を作り、脳の代わりの燃料にします。それを止めているのが<strong>インスリン</strong>です。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>インスリン</th><th>ケトン</th><th>遊離脂肪酸</th><th>考えること</th></tr>\n<tr><td>上がっている</td><td>低い</td><td>低い</td><td>高インスリン血症（先天性、インスリノーマ、インスリン過量）</td></tr>\n<tr><td>抑えられている</td><td>低い</td><td>高い</td><td>脂肪酸酸化異常症</td></tr>\n<tr><td>抑えられている</td><td>高い</td><td>高い</td><td>ケトン性低血糖、糖原病、ホルモン欠乏（GH・コルチゾール）</td></tr></table></div>\n<p>ケトンが出ない低血糖は、インスリンが脂肪の分解を止めているか、脂肪をケトンに変えられないか、のどちらかです。</p>\n<h3>新生児の一過性低血糖</h3>\n<p>生まれた直後は、母からの糖の供給が途切れ、血糖は生後1〜2時間で60〜80%まで下がります。グルカゴンとカテコラミンが上がって回復します。新生児は体のわりに脳が大きく、糖をたくさん使う（4〜6 mg/kg/分）のに、蓄えは少ない。この時期のインスリンは、異化を止めるというより「育てる」ために働いています。</p>\n<h3>ケトン性低血糖症：幼児で最多</h3>\n<p>幼児の低血糖で<strong>最も多い</strong>のが、ケトン性低血糖症です。<strong>1歳半〜5歳</strong>に多く、<strong>小柄でやせていて筋肉の少ない子</strong>、低出生体重で生まれた子に多い。糖新生の材料（筋肉のアミノ酸）が少ないので、<strong>12〜18時間の絶食</strong>で低血糖になります。</p>\n<p>かぜで夕食を食べずに寝た翌朝、朝寝坊で朝食が遅れた朝。いくつかが重なって、早朝に起こります。検査では、<strong>インスリンは抑えられ、ケトンと遊離脂肪酸は高く、尿ケトン陽性</strong>。体の仕組みは正しく働いていて、蓄えが少ないだけです。ふつうの絶食でケトンと低血糖が誘発できるので、ケトン食の負荷は必ずしも要りません。ほかの病気を除くことが診断の条件です。</p>\n<h3>治すのではなく、飢餓の時間を作らない</h3>\n<ul>\n<li>三食を規則正しく。<strong>夕食を食べずに寝ない</strong></li>\n<li>起きるのが遅くなっても、<strong>朝食を遅らせない</strong>。同じようなことがあったら朝早く起こすか、夜に一度何か食べさせる</li>\n<li>かぜで食欲がないときは、<strong>糖分を頻回に</strong>。飲めなければ早めに受診</li>\n</ul>\n<p>成長して筋肉が増えると、<strong>10歳ごろまでに自然に治まります</strong>。予後は良好です。</p>\n<p>研修医の手を止めて、まず一本採りました。血糖20、インスリン2.1 μU/mLと抑えられ、βOHBと遊離脂肪酸は高値、尿ケトン陽性。ブドウ糖を入れると、男の子は30分で「おなかすいた」と言いました。お母さんには、かぜの日の夜の過ごし方を書いた紙を渡しました。</p>", "keys": ["低血糖のその場でクリティカルサンプル（血糖・インスリン・Cペプチド・ケトン・遊離脂肪酸・乳酸・アンモニア・保存検体）", "最初の分岐はケトン。インスリン高値・ケトン低値は高インスリン血症、FFA高値・ケトン低値は脂肪酸酸化異常", "ケトン性低血糖は幼児で最多（1歳半〜5歳）、やせ型・低出生体重、12〜18時間の絶食で", "ケトン性低血糖の所見：インスリン抑制、ケトン・FFA高値、尿ケトン陽性", "予防は飢餓の時間を作らないこと。10歳ごろまでに自然寛解"], "upd": null, "quiz": [{"v": "", "q": "低血糖の鑑別フローで、インスリン上昇あり・ケトン体上昇なしのときに考えるのは。", "o": ["高インスリン血症性低血糖（先天性高インスリン血症、インスリノーマ、インスリン過量）", "ケトン性低血糖症", "脂肪酸酸化異常症（遊離脂肪酸の上昇を伴う）", "GH分泌不全症・副腎不全"], "a": 0, "e": "インスリン上昇なし・ケトン体上昇なし・遊離脂肪酸上昇なら脂肪酸酸化異常症。インスリン上昇なし・ケトン体上昇ならケトン性低血糖、糖原病、ホルモン欠乏。クリティカルサンプルが鍵。", "r": "小児内分泌学 p.142"}, {"v": "", "q": "低血糖時のクリティカルサンプルで「必須」とされる項目は。", "o": ["血糖、インスリン・Cペプチド、血液ガス、乳酸、アンモニア、遊離脂肪酸、ケトン体、保存血清・尿", "血糖とHbA1cのみ", "血糖とインスリンのみ", "血糖と甲状腺機能のみ"], "a": 0, "e": "ACTH・コルチゾール・GH・IGF-I・FT4/TSH、アシルカルニチンプロフィール（タンデムマス）も採る。尿は有機酸分析用に保存する。", "r": "小児内分泌学 p.143"}, {"v": "", "q": "ケトン性低血糖症の病態と検査所見で正しいのは。", "o": ["糖新生の基質不足のため12〜18時間の絶食後に起こる", "インスリン過剰のため食後2〜3時間で起こる", "糖原病によるグリコーゲン分解障害で絶食4時間で起こる", "脂肪酸酸化障害のため72時間以上の絶食で初めて起こる"], "a": 0, "e": "低血糖時の検査で①インスリン低値、②ケトン体・遊離脂肪酸がともに高値、③尿中ケトン体陽性。胎児発育不全や低出生体重で出生した児、小柄で痩せていて筋肉量が少ない児に多く、幼児の低血糖症のなかでは最も頻度が高い。1歳半〜5歳に好発する。感染症罹患時や疲労などのため夕食を摂取せずに就寝した翌朝や、起床が遅く朝食の摂取が遅れたとき、また高脂肪食の摂取など、いくつかの因子が重なり早朝に低血糖を発症する。症状から低血糖を疑い血糖値を確認することが重要。そのうえで内分泌疾患や先天代謝異常症など、ほかの重篤な基礎疾患を除外する。低血糖の原因診断のためには特に低血糖時の検査（クリティカルサンプルの採取）が必要。最も重要な検査はインスリンとケトン体。", "r": "治療 p.248"}]}, {"id": "d21", "lv": 3, "t": "高インスリン血症性低血糖と、この学びの終わりに", "min": 7, "cats": "高インスリン血症性低血糖・低血糖症", "src": "症例1 p.501-507 ／ 小児内分泌学 p.568-571 ／ 治療 p.246-248, 1282-1283", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>出生体重3,884 gの男の子。生後2時間から低血糖をくり返し、ブドウ糖を10 mg/kg/分入れてもまだ下がります。低血糖のときのインスリンは12 μU/mL、ケトンも遊離脂肪酸も低い。</div><p>前の回の表の一行目、<strong>インスリンが上がっていてケトンが出ない</strong>低血糖です。新生児・乳児の持続する低血糖で<strong>最も多い原因</strong>が、<strong>先天性高インスリン血症（CHI）</strong>です。</p>\n<h3>診断のしるし</h3>\n<div class=\"formula\">低血糖時：インスリン &gt; 1 μU/mL、βOHB &lt; 2 mmol/L、FFA &lt; 1.5 mmol/L、ブドウ糖注入速度（GIR）&gt; 7〜8 mg/kg/分</div>\n<p>インスリンが脂肪分解とケトン産生を止めているので、脳は代わりの燃料も得られません。だから<strong>脳障害</strong>が起きやすい。治療の最大の目標は、<strong>血糖を確保して脳を守ること</strong>です。診断に時間がかかっても、血糖を保つことは待てません。</p>\n<p>巨大児で生まれることが多いのは、胎内からインスリンが多かったからです。第15話の糖尿病母体児と同じ理屈です。一過性のCHIは、SGA、母体糖尿病、新生児期の心疾患などに多く、持続性は遺伝子異常によります。前章の第13話の<strong>Beckwith-Wiedemann症候群</strong>も、症候性のCHIの原因です。</p>\n<h3>原因遺伝子：閉じたままのチャネル</h3>\n<p>最も多いのは、<strong>ABCC8・KCNJ11</strong>、つまり<strong>KATPチャネル</strong>の異常です。第14話の新生児糖尿病では、このチャネルが開きっぱなしでした。CHIでは<strong>機能が失われて閉じたまま</strong>になり、血糖が低くてもインスリンが出続けます。</p>\n<p><strong>GLUD1</strong>の異常では、<strong>高アンモニア血症</strong>を伴い（HI/HA症候群）、ロイシン（蛋白質）で低血糖が誘発されます。アンモニアの上昇は軽いことも多いので、低血糖やけいれんをくり返す子では、アンモニアを測ります。</p>\n<h3>限局型を見つけることが、いちばん大事</h3>\n<p>CHIには、膵臓全体が働きすぎる<strong>びまん型</strong>と、一部だけの<strong>限局型（focal）</strong>があります。</p>\n<p>限局型の仕組みは巧妙です。<strong>父から受け継いだ片方のKATP変異</strong>があり、膵臓の一部の細胞で、<strong>11p15の母由来アレルが脱落</strong>（父性片親性ダイソミー）します。すると、その細胞ではKATPチャネルが完全に働かなくなり、同時に父由来で発現する<strong>IGF2が倍</strong>になって、細胞が増えます。前章のBWSと同じ11p15の話です。父は無症状です。</p>\n<p>限局型なら、<strong>¹⁸F-DOPA PET</strong>で場所を見つけ、<strong>その部分だけを切除すれば根治</strong>できます。一方、びまん型で内科治療が効かなければ95%以上の膵亜全摘が必要になり、多くは術後に糖尿病になります。だから、限局型かどうかの鑑別が、方針を大きく変えます。</p>\n<h3>治療の順番</h3>\n<ul>\n<li>急性期：<strong>20%ブドウ糖1 mL/kg</strong>静注と持続点滴。静注できなければグルカゴン</li>\n<li>慢性期の第一選択：<strong>ジアゾキシド</strong> 5〜15 mg/kg/日（KATPチャネルを開く）。副作用は水分貯留と多毛で、新生児では利尿薬を併用</li>\n<li>効かなければ：<strong>オクトレオチド</strong> 5〜25 μg/kg/日、グルカゴン持続、ニフェジピン。ステロイドは使わないのが原則</li>\n<li>頻回食、コーンスターチ、持続胃注も</li>\n</ul>\n<p>KATPの機能喪失型では、ジアゾキシドが開けるチャネル自体がないので、効かないことが多いのです。</p>\n<h3>年長児ならインスリノーマ</h3>\n<p>年長の子どもの高インスリン性低血糖では、<strong>インスリノーマ</strong>を考えます。<strong>Whippleの三徴</strong>（低血糖症状、低血糖、ブドウ糖で回復）が鍵で、てんかんと誤診されて長く見逃されることがあります。90%以上は良性で単発。局在はエコー・CT・MRIだけでは難しく、選択的動脈内Ca注入試験などが必要です。切除できれば手術が第一選択。<strong>若い人のインスリノーマではMEN1</strong>を調べます（前章の第11話）。</p>\n<p>冒頭の男の子はジアゾキシドが効かず、遺伝子検査で父由来のABCC8変異が一つだけ見つかりました。¹⁸F-DOPA PETで膵尾部に限局した病変が見つかり、部分切除のあと、血糖は正常になりました。</p>\n<h3>この学びの終わりに</h3>\n<p>ここまで、成長、水、甲状腺、カルシウム、思春期、副腎、性分化、腫瘍、そして糖と脂肪。九つの巻を読んできました。振り返ると、同じ考え方が何度も出てきたことに気づくはずです。</p>\n<ul>\n<li><strong>軸とフィードバック</strong>で数字を読む</li>\n<li><strong>補充の順番</strong>（ステロイドが先）</li>\n<li><strong>成長曲線</strong>は内分泌の窓</li>\n<li><strong>一つの遺伝子が、向きによって逆の病気</strong>を作る（KATP、CDKN1C、GNAS）</li>\n<li>遺伝子が分かると<strong>治療が変わる</strong></li>\n<li>そして、<strong>本人と家族に、どう伝えるか</strong></li>\n</ul>\n<p>毎日5分の積み重ねが、外来の一場面で、目の前の子どもと家族を守る力になります。ここからは、クイズで繰り返し、気になった巻を読み返してください。お疲れさまでした。</p>", "keys": ["CHIは新生児・乳児の持続性低血糖で最多。低血糖時インスリン＞1、ケトン・FFA低値、GIR＞7〜8", "最多はKATPチャネル（ABCC8・KCNJ11）の機能喪失。GLUD1は高アンモニア血症を伴う", "限局型：父由来変異＋11p15母由来アレル脱落。¹⁸F-DOPA PETで局在、部分切除で根治", "第一選択はジアゾキシド、無効ならオクトレオチド。びまん型の膵亜全摘は術後糖尿病が多い", "年長児はインスリノーマ（Whipple三徴、若年はMEN1を検索）"], "upd": null, "quiz": [{"v": "", "q": "先天性高インスリン血症（CHI）の診断に用いる低血糖時の検査所見として正しいのは。", "o": ["低血糖時インスリン>1 μU/mL、GIR>7 mg/kg/分、βOHB<2、FFA<1.5 mmol/L", "低血糖時インスリン<1 μU/mL、GIR<3 mg/kg/分、ケトン体高値、FFA高値", "低血糖時コルチゾール<10 μg/dLとGH<7 ng/mL、インスリンは測定感度以下、GIR<3 mg/kg/分", "GIR<3 mg/kg/分で血糖維持可能、βOHB>2 mmol/L、FFA>1.5 mmol/L、乳酸高値"], "a": 0, "e": "CHIは先天性のインスリン過剰分泌に伴う持続性低血糖症をきたす。新生児、乳児の持続性低血糖症の最も多い原因。出生直後に発症し一過性に経過するものと新生児期-乳児期に発症し長期に持続するものがある。一過性CHIは多くは非遺伝性、持続性CHIは遺伝子異常によると考えられている。臨床的には一過性CHIに多いSGA出生、母体糖尿病、新生児期の心疾患、持続性CHIに多い過体重出生、持続性高アンモニア血症、また症候性CHI（Beckwith-Wiedemann症候群など）を示唆する身体所見の存在などが手がかりになる。", "r": "治療 p.246"}, {"v": "", "q": "限局型（focal）の先天性高インスリン血症の成立機序は。", "o": ["母由来の片アレル変異に、父由来アレルの脱落が加わって両アレルが失われる", "父由来の片アレル変異に、その領域で母由来アレルの脱落が加わる", "両アレルの変異が全膵に生じる", "後天的な膵島の過形成による"], "a": 1, "e": "限局型と分かれば病変部分のみの摘出で済み、術後の糖尿病発症リスクが大幅に下がる。18F-DOPA PETでの局在診断が意味をもつのはこのため。", "r": "p.503 / p.505"}, {"v": "", "q": "CHIの急性期治療として正しいのは。", "o": ["20%ブドウ糖1 mL/kg静注と持続静注（4〜6 mg/kg/分）が第一選択", "まず経口ブドウ糖10〜15 gを試み、無効ならジアゾキシドを静注して対応する", "ヒドロコルチゾン2 mg/kgの静注が第一選択で、ブドウ糖は併用しない", "グルカゴンの持続静注が第一選択で、ブドウ糖静注は行わない"], "a": 0, "e": "静注が行えない場合は高インスリン血症による低血糖とわかっていればグルカゴン注射薬筋注（または皮下注）または年長児ではグルカゴン点鼻薬も使用可だが血糖上昇は一時的。慢性期治療のファーストライン治療はジアゾキシド（ジアゾキシドカプセル）内服。ジアゾキシド内服に反応が不良の場合、セカンドライン治療としてはオクトレオチド（サンドスタチン®皮下注用）頻回皮下注または持続皮下注、グルカゴン（グルカゴンGノボ注射用）持続静注や、症例によってはニフェジピン内服（アダラート®CR錠、保険適用外）が行われる。ステロイド治療は行わないのが原則。", "r": "治療 p.246"}]}];

    (o.days||[]).forEach(d=>out.push(d)); (h.days||[]).forEach(d=>out.push(d));
    for(const k in (o.log||{})) if(o.log[k] && o.log[k].a>0) out.push(k);
    return {days:out, info: o.ans? "解いた問題 "+o.ans.toLocaleString()+"問" : ""}; },
  senmon(){ const o=readLS("senmoni_scroll_v1")||{}; const out=[]; let n=0;
    for(const k in (o.log||{})) if(o.log[k]){ out.push(k); n+=+o.log[k]||0; }
    return {days:out, info: n? "記録 "+n+"回":""}; },
  owarai(){ const o=readLS("owarai-makimono-v1"); if(!o||!o.k) return {days:[],info:""};
    let tot=0, st=0; for(const id in o.k){ const r=o.k[id]; tot+=(r.g||0)+(r.m||0)+(r.b||0)+(r.qo||0)+(r.qx||0); if((r.g||0)>=3) st++; }
    S.snap=S.snap||{}; const out=[];
    if(S.snap.owarai!=null && tot>S.snap.owarai) out.push(dkey(new Date()));
    S.snap.owarai=tot; return {days:out, info: "スタンプ "+st+"こ", keep:true}; },
  dojo(){ const o=readLS("prime_30s_v1"); if(!o||!o.log) return {days:[],info:""};
    const out=Object.keys(o.log).filter(k=>o.log[k]&&o.log[k].lv>0);
    return {days:out, info: out.length? "トレーニング "+out.length+"回":""}; },
  mini(){ const o=readLS("mini.log"); if(!o) return {days:[],info:""};
    const out=Object.keys(o).filter(k=>o[k]&&o[k].length);
    return {days:out, info: out.length? "開いた日 "+out.length+"日":""}; }
};
function syncHub(){
  S.hub.forEach(a=>{ const f=DETECT[a.id]; if(!f) return;
    const r=f(); const days=r.days.map(normDay).filter(Boolean);
    a.auto = r.keep? [...new Set([...(a.auto||[]), ...days])] : days; a.info=r.info; });
  save();
}
function dkey(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function appDays(a){ return a.self? S.days : [...new Set([...(a.days||[]), ...(a.auto||[])])]; }
function appStreak(a){
  const set=new Set(appDays(a)); let n=0; const d=new Date();
  if(!set.has(dkey(d))) d.setDate(d.getDate()-1);
  while(set.has(dkey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function unionDays(){ const s=new Set(S.days); S.hub.forEach(a=>{ if(!a.self) appDays(a).forEach(d=>s.add(d)); }); return s; }
function unionStreak(){ const set=unionDays(); let n=0; const d=new Date(); if(!set.has(dkey(d))) d.setDate(d.getDate()-1); while(set.has(dkey(d))){ n++; d.setDate(d.getDate()-1);} return n; }
function monthDays(y,m){ return [...unionDays()].filter(s=>s.startsWith(y+"-"+(m+1)+"-")).length; }
const STAR_DAYS=[3,7,12,18,25];
function week(a){ const set=new Set(appDays(a)); let n=0; const d=new Date(); for(let i=0;i<7;i++){ if(set.has(dkey(d))) n++; d.setDate(d.getDate()-1);} return n; }
function monthKey(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1); }
function addMinutes(m){ S.mins=(S.mins||0)+m; const k=monthKey(); S.month[k]=(S.month[k]||0)+m; }
const STAR_AT=[15,45,90,180,300];

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function streak(){
  const set = new Set(S.days); let n=0; const d=new Date();
  if(!set.has(todayStr())) d.setDate(d.getDate()-1);
  while(set.has(d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate())){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function rank(){ let r=RANKS[0]; RANKS.forEach(x=>{ if(S.xp>=x.xp) r=x; }); return r; }
function nextRank(){ return RANKS.find(x=>x.xp>S.xp); }
function allLessons(){ return CHAPTERS.flatMap(c=>c.lessons.map(l=>({...l, chap:c}))); }
function totalPlanned(){ return CHAPTERS.reduce((a,c)=>a+Math.max(c.lessons.length,5),0); }
function lvXp(lv){ return lv===1?100:lv===2?200:300; }
function isOpen(chap, i){
  const l = chap.lessons[i]; if(l.soon) return false;
  return i===0 || !!S.done[chap.lessons[i-1].id];
}
function nextInChap(c){ for(let i=0;i<c.lessons.length;i++){ const l=c.lessons[i]; if(!S.done[l.id] && isOpen(c,i)) return {l,c}; } return null; }
/* 今日のレッスン：最後に読んだ章の続き。読み切っていれば、章の並び順で次に未読がある章 */
function nextLesson(){
  const last=CHAPTERS.find(c=>c.id===S.lastChap);
  if(last){ const n=nextInChap(last); if(n) return n; }
  for(const c of CHAPTERS){ const n=nextInChap(c); if(n) return n; }
  return null;
}

function runQuiz(c,l){
  const box=document.getElementById("qz"); let i=0, correct=0;
  function show(){
    if(i>=l.quiz.length){ return finish(); }
    const q=l.quiz[i];
    box.innerHTML = `<div class="q"><div class="qn">Q${i+1} / ${l.quiz.length}</div>${q.v?`<p class="vig">${q.v}</p>`:""}<p>${q.q}</p>
      ${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}<div id="ex"></div></div>`;
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k; const ok=k===q.a; if(ok) correct++;
      S.quiz.n++; if(ok) S.quiz.c++;
      box.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.k===q.a) x.classList.add("ok"); });
      if(!ok) b.classList.add("ng");
      document.getElementById("ex").innerHTML = `<div class="exp">${ok?"正解。":"惜しい。"}${q.e}${q.r?`<span class="ref">${q.r}</span>`:""}</div><button class="cta" id="nx" style="margin-top:10px">${i+1<l.quiz.length?"次の問題":"結果を見る"}</button>`;
      document.getElementById("nx").onclick=()=>{ i++; show(); };
      save();
    });
  }
  function finish(){
    const first = !S.done[l.id]; const gain = first? lvXp(l.lv):0;
    if(first){ S.done[l.id]=1; S.xp+=gain; }
    S.lastChap=c.id;
    addMinutes(l.min);
    const t=todayStr(); if(!S.days.includes(t)) S.days.push(t);
    save(); hdr();
    box.innerHTML = `<div class="finish"><div class="eyebrow">レッスン完了</div>
      <div class="big">${first? "+"+gain+" XP":"復習完了"}</div>
      <p style="color:var(--muted);margin:4px 0 14px">クイズ ${correct} / ${l.quiz.length} 正解</p>
      <div class="fin-row"><button class="cta" id="hm">ホームへ</button>${scrollLink("巻物で深める ↗")}</div></div>`;
    document.getElementById("hm").onclick=()=>setTab("home");
    if(first) toast("+"+gain+" XP 獲得");
  }
  show();
}

function calGrid(y,m,isCur){

/* ---------- 引き継ぎ（同じgithub.ioの全アプリの記録をまとめて移す） ---------- */
const XFER_SKIP=["hub_home_url"];
const XFER_NAMES={"mini.log":"ミニ置き場","endo_academy_v1":"内分泌アカデミー","shugyo_endo_v2":"修行巻物","shugyo_habit_v1":"修行巻物（習慣）","senmoni_scroll_v1":"小児科専門医","owarai-makimono-v1":"お笑い会話","prime_30s_v1":"PRIME"};
function xferExport(){ const o={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!XFER_SKIP.includes(k)) o[k]=localStorage.getItem(k); }
  return "EAX1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
/* 両方の端末の記録を足し合わせる：オブジェクトは中身ごと合体、数は大きいほう、配列は重複なしで合体 */
function xferMerge(a,b){
  if(Array.isArray(a)&&Array.isArray(b)){ const out=[...a]; const seen=new Set(a.map(x=>JSON.stringify(x))); b.forEach(x=>{ const j=JSON.stringify(x); if(!seen.has(j)){ seen.add(j); out.push(x);} }); return out; }
  if(a&&b&&typeof a==="object"&&typeof b==="object"){ const out=Object.assign({},a); for(const k in b) out[k]= k in a? xferMerge(a[k],b[k]) : b[k]; return out; }
  if(typeof a==="number"&&typeof b==="number") return Math.max(a,b);
  return b; }
function xferImport(code){ code=(code||"").trim().replace(/\s+/g,""); if(!code.startsWith("EAX1:")) return {ok:false,msg:"コードの形が違います（EAX1: で始まるコードを貼ってください）"};
  let o; try{ o=JSON.parse(decodeURIComponent(escape(atob(code.slice(5))))); }catch(e){ return {ok:false,msg:"コードを読めませんでした。途中で切れていないか確認してください"}; }
  const names=[]; let n=0;
  for(const k in o){ if(XFER_SKIP.includes(k)) continue;
    if(k===KEY){ try{ const cur=JSON.parse(localStorage.getItem(KEY)||"{}"), inc=JSON.parse(o[k]);
        const m=Object.assign({},cur,inc); m.done=Object.assign({},cur.done||{},inc.done||{}); m.xp=Math.max(cur.xp||0,inc.xp||0);
        m.days=[...new Set([...(cur.days||[]),...(inc.days||[])])]; m.mins=Math.max(cur.mins||0,inc.mins||0);
        localStorage.setItem(k,JSON.stringify(m)); }catch(e){ localStorage.setItem(k,o[k]); } }
    else { let v=o[k]; try{ const cur=localStorage.getItem(k); if(cur!==null) v=JSON.stringify(xferMerge(JSON.parse(cur),JSON.parse(o[k]))); }catch(e){} localStorage.setItem(k,v); }
    n++; names.push(XFER_NAMES[k]||k); }
  return {ok:true,n,names}; }

function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
