VPを続けると水中毒。第2相を「治った」と読まない", "補充はヒドロコルチゾンが先、LT4は後（副腎クリーゼを防ぐ）", "中枢性甲状腺機能低下はFT4を基準範囲の高めに。TSHは指標にならない", "masked DI：副腎・甲状腺の補充で隠れていた尿崩症が顕在化"], "upd": null, "quiz": [{"v": "", "q": "下垂体・鞍上部腫瘍の術後にみられる三相性反応（triphasic response）の順序は。", "o": ["抗利尿相（1〜3日）→ 尿崩症（5〜7日）→ 回復", "尿崩症（4〜5日）→ 抗利尿相（5〜7日）→ 永続的尿崩症", "尿崩症（4〜5日）→ 抗利尿相（5〜7日）→ 回復して治療不要となる", "尿崩症（1〜2週）→ 回復 → 遅発性の抗利尿相"], "a": 1, "e": "第2相で油断してDDAVPを続けると水中毒になる。逆に第2相を見て「治った」と判断しても、第3相が来る。", "r": "p.441 / 図 p.441"}, {"v": "鞍上部腫瘍の患児。副腎機能低下と甲状腺機能低下があり補充を開始したところ、それまでなかった多尿が出現した。", "q": "この現象の呼び名と意味は。", "o": ["masked DI。副腎・甲状腺機能低下により隠れていた尿崩症が、補充により顕在化した", "三相性反応の第1相。手術後の一過性尿崩症", "医原性尿崩症。ヒドロコルチゾンの過量による浸透圧利尿で、減量すれば数日で消失するため補充の調整のみでよい", "SIADHからの回復。抗利尿相が終わって利尿がついた"], "a": 0, "e": "コルチゾール不足のあいだは自由水が排泄できず多尿が目立たない。補充の順序を知らないと、副作用と誤解する。", "r": "p.441"}, {"v": "", "q": "下垂体腫瘍の術後にステロイドと甲状腺ホルモンを補充する順序として適切なのは。", "o": ["甲状腺ホルモンを先に入れ、代謝を整えてからステロイドを入れる", "ステロイド（ヒドロコルチゾン）を先に入れる", "同時に開始し、量を少しずつ増やす", "GHを先に入れ、反応を見てから他を補う"], "a": 1, "e": "甲状腺ホルモンはコルチゾール代謝を亢進させるため、副腎不全があると危機を招く。この順序は章をまたいで繰り返し出てくる原則。", "r": "p.441 / 巻の三 p.135"}]}, {"id": "m3", "lv": 2, "t": "腫瘍に似たもの：下垂体炎と外傷", "min": 5, "cats": "下垂体・鞍上部腫瘍", "src": "小児内分泌学 p.250-253, 262-265", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>12歳の女の子。急に多飲・多尿が始まり、MRIで下垂体の漏斗が太く、後葉の高信号が消えていました。「腫瘍ですか」と聞かれ、言葉に詰まります。</div><p>下垂体が腫れて見えても、腫瘍とは限りません。今日は、<strong>下垂体炎</strong>と、見逃されやすい<strong>頭部外傷後の下垂体機能低下</strong>を見ます。</p>\n<h3>下垂体炎の分け方</h3>\n<p>下垂体炎は、<strong>原発性</strong>と<strong>続発性</strong>に分けます。</p>\n<ul>\n<li>原発性：リンパ球性、肉芽腫性、黄色腫性、IgG4関連</li>\n<li>続発性：Rathke嚢胞や頭蓋咽頭腫に伴うもの、サルコイドーシス、免疫チェックポイント阻害薬（第14話）など</li>\n</ul>\n<p>炎症の場所によって、症状が変わります。<strong>リンパ球性漏斗下垂体後葉炎（LINH）</strong>は、漏斗から後葉の炎症で、<strong>中枢性尿崩症</strong>が主な症状です。自己抗原として<strong>Rabphilin-3A</strong>が報告されています。<strong>リンパ球性下垂体前葉炎</strong>は、妊娠後期から産後の女性に多く、頭痛などの圧迫症状と前葉ホルモンの分泌不全が出ます。IgG4関連は高齢の男性に多く、他の臓器の病変を伴います。</p>\n<h3>どのホルモンが落ちやすいか</h3>\n<p>リンパ球性下垂体炎では、<strong>ACTHとTSH</strong>、そして<strong>ゴナドトロピン</strong>が障害されやすく、GHやPRLの分泌不全は少ないとされます。腫瘍による圧迫では、GHとゴナドトロピンから落ちていくことが多いので、<strong>落ち方の順番が違う</strong>こと自体が手がかりになります。</p>\n<h3>診断と治療</h3>\n<p>造影MRIが診断に欠かせません。漏斗の肥厚は、経過とともに消えていくことが多いです。ただ、下垂体が大きく腫れている子では、<strong>腺腫や胚細胞腫瘍との鑑別</strong>がとても大事です。前の回で見たように、胚細胞腫瘍は最初は小さく、炎症のように見えることがあります。</p>\n<p>治療は<strong>対症療法が基本</strong>です。圧迫症状や分泌低下が強ければ、グルココルチコイドの薬理量で病変を小さくすることがあります。自然に小さくなることもありますが、多くは何らかのホルモンの低下が残り、<strong>尿崩症はほとんど改善しません</strong>。長くデスモプレシンを使うことになります。</p>\n<h3>頭部外傷のあとに</h3>\n<p>見落とされやすいのが、頭部外傷後の下垂体機能低下症です。大人では、受傷した人の<strong>少なくとも約1/4</strong>に起き、脳振盪のような軽い外傷でも起こりえます。子どもでの頻度は分かっていませんが、<strong>虐待によるもの</strong>も少なくありません。尿崩症だけの子、SIADHを経てから尿崩症になる子など、経過はさまざまです。長いフォローが要ります。</p>\n<p>冒頭の女の子は、ACTHとTSHは保たれ、GHも正常でした。LINHを考え、胚細胞腫瘍を見逃さないよう、3か月ごとのMRIとhCG・AFPの測定を続けることにしました。「腫瘍かどうかを、時間をかけて確かめていきましょう。お水のお薬は、たぶん長く使うことになります」。</p>", "keys": ["下垂体炎は原発性（リンパ球性・肉芽腫性・黄色腫性・IgG4関連）と続発性に分ける", "LINHは漏斗〜後葉の炎症で中枢性尿崩症が主症状（Rabphilin-3A）", "前葉炎は妊娠後期〜産後に多い。障害されやすいホルモンの順番が腫瘍と異なる", "治療は対症療法が基本。胚細胞腫瘍との鑑別を続ける。尿崩症は戻りにくい", "頭部外傷後の下垂体機能低下は成人で約1/4以上。小児では虐待も"], "upd": null, "quiz": [{"v": "", "q": "下垂体炎の分類と、リンパ球性漏斗下垂体後葉炎（LINH）の特徴は。", "o": ["原発性（リンパ球性・肉芽腫性・黄色腫性・IgG4関連）と続発性（Rathke嚢胞、頭蓋咽頭腫、サルコイドーシス、ICIなど）に分け、LINHは漏斗部〜後葉の炎症で中枢性尿崩症を主症状とする", "下垂体炎はすべて自己免疫性で腫瘍による続発性はなく、LINHは前葉のみの炎症で尿崩症は伴わない", "LINHは前葉のみの炎症で、尿崩症は伴わない", "IgG4関連下垂体炎は小児に多く、血清IgG4は正常"], "a": 0, "e": "リンパ球性下垂体前葉炎は妊娠後期〜産後に多く、ACTHとTSHが障害されやすい。LINHの自己抗原としてRabphilin-3Aが報告されている。IgG4関連は高年男性に多く、他臓器病変を伴う。", "r": "小児内分泌学 p.262-265"}, {"v": "", "q": "リンパ球性下垂体炎で分泌不全になりやすいホルモンの順序は。", "o": ["ゴナドトロピン（LH/FSH）とTSHが障害されやすく、GHやPRLの分泌不全は少ない", "GHが最も障害されやすく、次いでPRL", "PRLが最初に低下し、TSHは保たれる", "ACTHとTSHが同時に障害され、LH/FSHは保たれ、GHは最後に障害されるため成長は保たれる"], "a": 0, "e": "下垂体前葉炎は妊娠後期から産後の女性に多い。頭痛などのmass effect、前葉ホルモン分泌不全、尿崩症による多飲多尿が症状。造影MRIが診断に必須で、漏斗の肥厚は経過で消退することが多い。", "r": "小児内分泌学 p.250-251"}, {"v": "", "q": "頭部外傷後の下垂体機能低下症について述べられているのは。", "o": ["成人では受傷者の少なくとも約1/4以上に生じ、脳振盪など軽度外傷でも発症しうる", "重症外傷に多く、脳振盪では少ない", "成人に多く、小児では報告が少ない", "受傷直後にのみ生じ、遅発性の発症はなく、重症外傷に限られるため脳振盪では評価不要"], "a": 0, "e": "小児での頻度は不明だが、虐待によるものも少なくない。尿崩症だけの例、SIADHを経て尿崩症となる例など経過は多様。長期のフォローが要る。", "r": "小児内分泌学 p.252-253"}]}, {"id": "m4", "lv": 2, "t": "プロラクチン：まず薬と測定を疑う", "min": 5, "cats": "下垂体・鞍上部腫瘍", "src": "p.443 ／ 小児内分泌学 p.254-258, 604", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>16歳の女の子。月経が止まり、乳汁が少し出ると言います。PRLは85 ng/mL。精神科でリスペリドンを飲んでいます。MRIを予約しかけた研修医に、「その前に確かめることがあるよね」と声をかけました。</div><p>高プロラクチン血症を見たら、すぐに下垂体の画像へ進みたくなります。でも、その前に確かめることが二つあります。<strong>薬</strong>と、<strong>測定</strong>です。</p>\n<h3>PRLを上げる薬</h3>\n<p>PRLは、視床下部からの<strong>ドパミン</strong>でいつもブレーキをかけられています。だから、ドパミンD2受容体を遮る薬はPRLを上げます。</p>\n<ul>\n<li>抗精神病薬（リスペリドン、ハロペリドールなど）</li>\n<li>制吐薬（メトクロプラミド）</li>\n<li>降圧薬（α-メチルドパ、ラベタロール）</li>\n<li>H2拮抗薬、経口避妊薬、抗うつ薬、フェニトイン、モルヒネ</li>\n</ul>\n<p>もう一つ、<strong>原発性甲状腺機能低下症</strong>。TRHが増えると、TSHと一緒にPRLも上がります。薬歴と甲状腺機能を確認してから、画像に進みます。</p>\n<h3>測定の二つの罠</h3>\n<p><strong>マクロプロラクチン</strong>：PRLがIgGと複合体を作ったもので、生物学的な活性は低いのに、測定では高く出ます。<strong>PEG沈殿法</strong>で取り除いて測り直します。</p>\n<p><strong>フック効果</strong>：逆の罠です。巨大なプロラクチノーマでPRLが多すぎると、測定系が飽和して<strong>見かけ上PRLが低く</strong>出ます。大きな腫瘍なのにPRLがそれほど高くないときは、<strong>希釈して再検</strong>します。</p>\n<h3>プロラクチノーマの治療は「飲み薬」</h3>\n<p>プロラクチノーマの治療の第一選択は、手術ではなく<strong>ドパミンアゴニスト</strong>の内服です。</p>\n<div class=\"formula\">カベルゴリン 0.25 mg/回 週1回 就寝前から、PRLを見て漸増<br>ブロモクリプチン 5〜7.5 mg/日 分2〜3</div>\n<p>飲めば腫瘍は小さくなることが期待できます。ただし、やめると再び大きくなるので、長く飲むことが前提です。高用量を長く使うときは、<strong>心臓弁膜症</strong>の評価が要ります。大きな腺腫の女性が妊娠を望むときは、妊娠前に腫瘍を小さくし、妊娠中はブロモクリプチンを使うことが多いです。</p>\n<h3>若い人の腺腫は、遺伝を考える</h3>\n<p>18歳未満のマクロプロラクチノーマの<strong>約20%</strong>に、<strong>MEN1</strong>または<strong>AIP</strong>の変異があったと報告されています。若い発症、大きな腺腫、家族歴があれば、遺伝子の検索を考えます。MEN1に伴う下垂体腺腫は、プロラクチノーマが最も多いので、やはりドパミンアゴニストが第一選択です（第11話）。</p>\n<p>冒頭の女の子は、精神科の先生と相談して、リスペリドンをPRLへの影響が少ない薬に替えてもらいました。2か月後、PRLは18 ng/mLに下がり、月経も戻りました。MRIの予約は、取り消しになりました。</p>", "keys": ["高PRL血症はまず薬（D2遮断：抗精神病薬・メトクロプラミドなど）と甲状腺機能低下を確認", "マクロプロラクチンは見かけの高値（PEG沈殿）、フック効果は巨大腫瘍で見かけの低値（希釈再検）", "プロラクチノーマの第一選択はドパミンアゴニスト。カベルゴリン0.25 mg週1から", "中止で再増大、高用量長期は弁膜症評価", "若年のマクロプロラクチノーマの約20%にMEN1/AIP変異"], "upd": null, "quiz": [{"v": "", "q": "高プロラクチン血症を来す薬剤として挙げられているのは。", "o": ["抗精神病薬（リスペリドン、ハロペリドールなど）、制吐薬（メトクロプラミド）、降圧薬（α-メチルドパ、ラベタロール）、H2拮抗薬、経口避妊薬、抗うつ薬、フェニトイン、モルヒネ", "β遮断薬とACE阻害薬、メトホルミンとSU薬、LT4と抗甲状腺薬", "メトホルミンとSU薬", "LT4と抗甲状腺薬"], "a": 0, "e": "ドパミンD2受容体の遮断が主な機序。原発性甲状腺機能低下症ではTRH亢進でTSHとともにPRLが上がる。薬剤歴と甲状腺機能を確認してから下垂体画像へ進む。", "r": "小児内分泌学 p.254"}, {"v": "", "q": "高プロラクチン血症の診断の手引き（平成30年度改訂）で注意されている測定上の問題は。", "o": ["フック効果（過剰量のPRLで見かけ上PRLが低く出る）と、マクロプロラクチンによる見かけ上の高値", "PRLは日内変動がなく随時採血でよく、食事の影響も受けないため絶食は不要で、溶血で低値になる", "PRLは食事の影響を受けないため、絶食は不要", "PRLは溶血で低値になる"], "a": 0, "e": "巨大プロラクチノーマで低値が出たら希釈再検。マクロプロラクチンはIgGとの複合体で生物活性が低く、PEG沈殿法で除く。視床下部・下垂体病変があれば器質性、なければ機能性と診断する。", "r": "小児内分泌学 p.255"}, {"v": "", "q": "プロラクチノーマの治療としてカベルゴリンを用いるときの標準的な始め方は。", "o": ["週1回就寝前に0.25 mg/回から開始し、PRL値をみて漸増する（ブロモクリプチンは5〜7.5 mg/日分2〜3）", "毎日3 mgから開始し、PRLが正常化したら週1回に減らす", "1日1回朝に10 mgから開始する", "注射で月1回投与する"], "a": 0, "e": "ドパミン作動薬が第一選択。高用量の長期投与では心臓弁膜症の評価が要る。マクロプロラクチノーマで妊娠を希望する場合は妊娠前に腫瘍を縮小させ、妊娠中はブロモクリプチンを用いることが多い。", "r": "小児内分泌学 p.256-257"}]}, {"id": "m5", "lv": 2, "t": "GH産生腫瘍：伸びすぎる背", "min": 5, "cats": "GH産生腫瘍・下垂体・鞍上部腫瘍", "src": "症例6 p.439-443 ／ 小児内分泌学 p.258-260", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>15歳の男の子、身長186 cm。お父さんは159 cm、お母さんは160 cm。「最近、靴のサイズがどんどん大きくなって」と照れ笑い。手を握ると、厚くて大きな手でした。</div><p>成長障害の章の第13話で、背が高すぎる子の見かたを学びました。今日は、その中でもまれですが見逃してはいけない<strong>GH産生下垂体腺腫</strong>です。</p>\n<h3>子どもでは「巨人症」として現れる</h3>\n<p>大人のGH産生腫瘍は、手足や顔が大きくなる<strong>先端巨大症</strong>として現れます。子どもは<strong>骨端線が閉じていない</strong>ので、まず<strong>高身長</strong>として現れます（acrogigantism）。<strong>両親の身長からかけ離れた高身長</strong>は、それ自体が大事な所見です。冒頭の男の子の標的身長は165 cmほど。186 cmは、その範囲を大きく外れています。</p>\n<h3>起こらないはずのことが起きる</h3>\n<p>診断の負荷試験は、ふつうなら起きないことを確かめます。</p>\n<ul>\n<li><strong>75 g糖負荷でGHが抑制されない</strong>（底値0.4 ng/mL未満にならない。キットで値が違うので注意）</li>\n<li><strong>TRH負荷でGHが奇異性に上昇する</strong></li>\n<li>ブロモクリプチンでGHが下がる（参考所見）</li>\n</ul>\n<p>ふつうは糖負荷でGHは下がり、TRHではGHは動きません。heel pad（踵の軟部組織）が22 mm以上に厚くなるのも参考になります。なお、思春期早発症やKlinefelter症候群（性分化の章の第9話）でも、GHやIGF-1が高く出ることがあります。</p>\n<h3>治療と、効いたかどうかの判定</h3>\n<p>第一選択は<strong>経蝶形骨洞手術</strong>です。寛解率は、microadenomaで<strong>80%以上</strong>、macroadenomaでは<strong>約50%</strong>と、腫瘍の大きさで見通しが変わります。残った腫瘍には、<strong>ソマトスタチンアナログ</strong>や、GH受容体拮抗薬の<strong>ペグビソマント</strong>を使います。ペグビソマントは受容体にくっつくけれどシグナルを出さないように設計された薬で、ソマトスタチンアナログとは働く場所が違います。</p>\n<p>効果の判定では<strong>IGF-1の正常化</strong>を重視します。GHは変動が大きいので、何回か測り、糖負荷後の底値と合わせて判断します。GH底値0.4 ng/mL未満でIGF-1が正常なら「コントロール良好」です。</p>\n<h3>若い腺腫の背景</h3>\n<p>若くして下垂体腺腫ができた人の<strong>10〜30%</strong>に<strong>AIP</strong>遺伝子の異常があります。ほかにMEN1、Carney complex（第13話）、家族性単独下垂体腺腫。思春期の章の第10話で見た<strong>McCune-Albright症候群</strong>でも、GH産生腫瘍ができることがあります。家族歴とほかの腫瘍を確かめます。</p>\n<p>冒頭の男の子は、糖負荷でGHが下がらず、MRIで1.2 cmの腺腫が見つかりました。AIP遺伝子に変異があり、お父さんも調べることになりました。手術のあとIGF-1は少しずつ下がっていきましたが、macroadenomaなので、時間をかけて評価を続けます。</p>", "keys": ["小児のGH産生腺腫は骨端線が開いているため高身長（acrogigantism）として現れる", "糖負荷でGHが抑制されない、TRHで奇異性上昇", "第一選択は経蝶形骨洞手術。寛解率はmicro 80%以上、macro約50%", "残存にはソマトスタチンアナログ、ペグビソマント（GH受容体拮抗薬）。判定はIGF-1正常化", "若年腺腫の10〜30%にAIP異常。MEN1、Carney complex、McCune-Albrightも"], "upd": null, "quiz": [{"v": "高身長と大きな手足を主訴に受診した男子。身長186 cm（父159 cm、母160 cm）。75 g糖負荷でGHが抑制されず、TRH負荷でGHが奇異性に上昇した。", "q": "診断は。", "o": ["体質性高身長（両親が低いのは遺伝の多様性による）", "GH産生下垂体腺腫（acrogigantism）", "Marfan症候群（FBN1。高身長とくも状指）", "甲状腺機能亢進症（成長率の加速と骨年齢促進）"], "a": 1, "e": "小児は骨端線が閉じていないので、末端肥大症ではなく高身長として現れる。両親の身長からかけ離れた高身長は、それ自体が所見になる。", "r": "症例6 p.439"}, {"v": "", "q": "GH産生下垂体腺腫の手術による寛解率として述べられているのは。", "o": ["macroadenomaで約50%、microadenomaで80%以上", "macroadenomaで約80%、microadenomaで約50%（大きいほうが摘出しやすい）", "macroadenoma・microadenomaとも約90%", "macroadenomaで約20%、microadenomaで約50%"], "a": 0, "e": "腫瘍径で見通しが変わる。macroadenomaではIGF-1の正常化が遅れることもあり、時間をかけて評価する。", "r": "p.441"}, {"v": "", "q": "先端巨大症の治療効果判定で重視されるのは。", "o": ["IGF-I値の正常化。GH値は変動が大きいため複数回測定し、OGTT後のGH底値とあわせて判断する", "GH随時値が1回でも正常なら治癒とし、IGF-Iは参考にとどめて腫瘍径で判断する", "IGF-Iは参考にとどめ、腫瘍径のみで判断する", "PRL値の正常化"], "a": 0, "e": "GH底値0.4 ng/mL未満でIGF-I正常なら「コントロール良好」。経蝶形骨洞手術が第一選択で、残存にはソマトスタチンアナログやGH受容体拮抗薬を用いる。", "r": "小児内分泌学 p.260"}]}, {"id": "m6", "lv": 1, "t": "Cushingを肥満外来から拾う", "min": 5, "cats": "Cushing症候群", "src": "p.451-455 ／ 小児内分泌学 p.429-432", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>肥満外来に来た11歳の女の子。この1年で体重が8 kg増えました。でも成長曲線を並べると、身長はほとんど伸びていません。顔は丸く、お腹に赤紫の線が見えます。</div><p>小児のCushing症候群はまれです。肥満の子は外来にたくさん来ます。そのたくさんの中から、どうやって一人を拾い上げるか。今日はその物差しの話です。</p>\n<h3>決定的な違いは「背」</h3>\n<p>小児のCushing症候群で最も特徴的なのは、<strong>体重は増えているのに、身長が伸びない</strong>ことです。</p>\n<p>単純性肥満の子は、体重が増えると成長率はむしろ<strong>上がります</strong>。骨年齢も進み、背も少し高めになります。一方、コルチゾールが多すぎると、視床下部からのソマトスタチン（SRIF）が増え、IGF-1の産生が下がって、<strong>背が止まります</strong>。成長障害の章の第5話で見た、ステロイドが背を止める仕組みと同じです。</p>\n<p>だから、肥満の子を見たら、<strong>体重と身長の曲線を必ず並べます</strong>。この乖離が、肥満外来からCushingを拾う物差しです。</p>\n<h3>体の所見は、あとから</h3>\n<p>満月様顔貌、皮膚線条、近位筋の萎縮、うぶ毛の増加。教科書どおりの所見はあります。でも子どもでは、単純性肥満との区別がむずかしく、<strong>体の所見だけで拾おうとすると遅れます</strong>。</p>\n<h3>スクリーニングの三本柱</h3>\n<p>コルチゾールが多すぎるか、そして<strong>日内変動が保たれているか</strong>を見にいきます。</p>\n<ul>\n<li><strong>深夜の血中コルチゾール</strong>：5 μg/dL以上なら疑わしい。ふつうは夜に下がるはずです。</li>\n<li><strong>尿中遊離コルチゾール</strong>：3日間の蓄尿で、すべて70 μg/m²/日以上</li>\n<li><strong>少量デキサメタゾン抑制試験</strong>：抑制されない</li>\n</ul>\n<h3>一つの検査で決めない</h3>\n<p>それぞれに偽陽性があります。肥満では尿中遊離コルチゾールが偽陽性になりやすく、CBG（コルチゾール結合グロブリン）の影響も受けます。デキサメタゾン抑制試験は、<strong>カルバマゼピンやフェノバルビタール</strong>がデキサメタゾンの代謝を速めたり、吸収が悪かったりすると、偽陽性になります。偽陽性率は12〜30%。<strong>「抑制されない」を、そのまま病気と読まない</strong>ことです。</p>\n<p>冒頭の女の子は、深夜のコルチゾールが11 μg/dL、蓄尿の遊離コルチゾールも3日とも高値、デキサメタゾンでも抑制されませんでした。Cushing症候群です。では、そのコルチゾールはどこから来ているのか。次の回で分岐をたどります。</p>", "keys": ["小児Cushingの最大の特徴：体重は増えるのに身長が伸びない", "単純性肥満では成長率はむしろ上がる。体重と身長の曲線を並べる", "スクリーニング：深夜コルチゾール5 μg/dL以上、尿中遊離コルチゾール、少量DEX抑制", "肥満では尿中遊離コルチゾールが偽陽性になりやすい", "DEX抑制試験はカルバマゼピン・フェノバルビタールや吸収不良で偽陽性（12〜30%）"], "upd": null, "quiz": [{"v": "", "q": "小児Cushing症候群を疑う最も特徴的な所見は。", "o": ["体重とともに身長も急速に伸び、骨年齢が促進すること", "体重は増えているのに身長増加が得られないこと", "肥満に高血圧を伴うこと", "多毛と痤瘡が目立つこと"], "a": 1, "e": "単純性肥満では身長も伸びる。この乖離が、肥満外来のなかからCushingを拾い上げる物差しになる。", "r": "p.451"}, {"v": "", "q": "Cushing症候群のスクリーニングとして示されている基準は。", "o": ["深夜の血中コルチゾール5 μg/dL以上、3日間の蓄尿による尿中遊離コルチゾールが全測定で70 μg/m2/日以上", "早朝コルチゾール20 μg/dL以上", "深夜コルチゾール1.8 μg/dL以上、または早朝コルチゾール20 μg/dL以上、または随時ACTH 60 pg/mL以上（成人の基準をそのまま用いる）", "随時ACTH 60 pg/mL以上"], "a": 0, "e": "肥満では尿中遊離コルチゾールが偽陽性になりやすい。CBGの影響も受ける。単一の検査で決めない。", "r": "小児内分泌学 p.430"}, {"v": "", "q": "デキサメタゾン抑制試験で偽陽性となりうる要因として挙げられているのは。", "o": ["カルバマゼピンやフェノバルビタールによる代謝亢進、吸収率の低下", "肝機能低下によるデキサメタゾンの代謝遅延", "高血糖による副腎の反応性亢進", "経口避妊薬によるCBG低下"], "a": 0, "e": "偽陽性率は12〜30%とされる。逆に肝機能低下や高齢ではクリアランスが低下する。抑制されないことをそのまま病的と読まない。", "r": "小児内分泌学 p.432"}]}, {"id": "m7", "lv": 3, "t": "Cushingの分岐：ACTHをたどる", "min": 6, "cats": "Cushing症候群・副腎腫瘍・症候群性の腫瘍素因・下垂体・鞍上部腫瘍", "src": "症例10 p.451-455 ／ 小児内分泌学 p.261, 430-432", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>前の回の女の子。ACTHは52 pg/mLと抑制されていません。下垂体のダイナミックMRIを撮りましたが、腺腫ははっきりしませんでした。</div><p>コルチゾールが多すぎると分かったら、次は<strong>どこから来ているのか</strong>です。最初の分かれ道は、<strong>血漿ACTH</strong>です。</p>\n<h3>ACTHで二つに分ける</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>ACTH依存性</th><th>ACTH非依存性</th></tr>\n<tr><td>ACTH</td><td>正常〜高値</td><td>抑制（5 pg/mL未満）</td></tr>\n<tr><td>原因</td><td>Cushing病（下垂体腺腫）、異所性ACTH産生腫瘍</td><td>副腎腺腫、副腎がん、AIMAH、PPNAD</td></tr></table></div>\n<p>副腎の腫瘍が勝手にコルチゾールを出していれば、下垂体は抑えられ、ACTHは低くなります。<strong>PPNAD</strong>（原発性色素性結節性副腎皮質異形成）もACTH非依存性で、Carney complexの一部として現れます（第13話）。</p>\n<h3>Cushing病は見えにくい</h3>\n<p>ACTH依存性なら、まずCushing病を考えます。ただし腺腫の<strong>80〜90%はマイクロアデノーマ</strong>で、MRIで写りにくいのです。<strong>造影ダイナミックMRI</strong>が必須で、腺腫は正常な下垂体より<strong>ゆっくり</strong>造影されます。3テスラ・2 mmスライスでも見えなければ、次の手です。</p>\n<h3>デキサメタゾン「2 mgで抑制されず8 mgで抑制」</h3>\n<p>大量デキサメタゾンで抑制されるのは、Cushing病に典型的とされる所見です。でも、本書は注意しています。<strong>そうならないこともあり、これだけでは確定できない</strong>。典型の型を覚えることと、それを確定の根拠にすることは別です。</p>\n<h3>下錐体静脈洞サンプリング</h3>\n<p>画像で見えなければ、<strong>両側下錐体静脈洞サンプリング</strong>へ進みます。下垂体から出てくる血液と末梢の血液でACTHを比べます。</p>\n<div class=\"formula\">ACTHの中枢／末梢比（C/P比）≥ 2（CRH負荷後は ≥ 3）→ Cushing病</div>\n<p>下垂体から来ていればCushing病、そうでなければ異所性ACTH産生腫瘍。左右の比で、腺腫がどちら側にあるかの手がかりも得られます。</p>\n<h3>何を測りたいかで、入れる薬を選ぶ</h3>\n<p>検査や手術のときに、ステロイドを入れる必要がある場面があります。このとき、<strong>ヒドロコルチゾンはコルチゾールとして測定されてしまう</strong>ので、内因性のコルチゾールを測りたいときには使いません。<strong>デキサメタゾン</strong>なら、コルチゾールの測定に影響しません。何を測りたいかで、入れる薬を選びます。</p>\n<p>ちなみに、<strong>TSH産生腺腫</strong>では、FT4が高いのにTSHが抑制されない（SITSH）という形をとり、甲状腺の章の第9話で見た甲状腺ホルモン不応症との鑑別が必要になります。</p>\n<p>冒頭の女の子の静脈洞サンプリングでは、C/P比は基礎値で4.2、CRH負荷後に12でした。右側優位。Cushing病です。経鼻的に腫瘍を摘出することになりました。</p>", "keys": ["最初の分岐は血漿ACTH。5 pg/mL未満なら副腎性（腺腫・がん・AIMAH・PPNAD）", "Cushing病の80〜90%はマイクロアデノーマ。造影ダイナミックMRIで遅れて造影", "「2 mgで抑制されず8 mgで抑制」は典型だが確定根拠にしない", "下錐体静脈洞サンプリング：C/P比≥2（CRH後≥3）でCushing病", "内因性コルチゾールを測りたい場面ではヒドロコルチゾンでなくデキサメタゾン"], "upd": null, "quiz": [{"v": "", "q": "Cushing症候群の分類として正しいのは。", "o": ["ACTH依存性（Cushing病、異所性ACTH）とACTH非依存性", "ACTH依存性に副腎腺腫とPPNADが、非依存性に異所性ACTHが含まれる", "下垂体性と異所性の2つに分け、副腎性は別の病名として扱う", "血中ACTHでは分けられず、デキサメタゾン抑制試験のみで分類する"], "a": 0, "e": "血漿ACTHの測定が最初の分岐点。5 pg/mL未満なら副腎性を疑う。 副腎腺腫、副腎がん、AIMAH、PPNAD。", "r": "表 p.454 / 図5 p.455"}, {"v": "", "q": "Cushing病と異所性ACTH産生腫瘍を分ける選択的静脈洞サンプリングの基準は。", "o": ["ACTHの中枢/末梢比（C/P比）が2以上（CRH負荷後は3以上）", "C/P比が1.5以上（CRH負荷後は2以上）であれば下垂体性と判定する", "C/P比が3以上（CRH負荷は用いない）", "C/P比が1.2以上（負荷の有無によらない）"], "a": 0, "e": "微小腺腫の局在診断にも使える。頭部MRIは造影ダイナミックが必須で、腺腫は正常下垂体より穏徐に造影される。", "r": "小児内分泌学 p.432"}, {"v": "", "q": "「2 mgで抑制されず8 mgで抑制される」というデキサメタゾン抑制試験の所見について本書が注意しているのは。", "o": ["Cushing病の確定所見であり、追加の検査は要らない", "Cushing病で典型的とされるが、そうならないこともあり、これのみでは確定できない", "副腎腺腫に典型的な所見で、下垂体MRIは不要", "異所性ACTH産生腫瘍に典型的な所見であり、下垂体MRIより先に全身CTを優先して腫瘍を探す"], "a": 1, "e": "典型例の型を覚えることと、それを確定根拠にすることは別。画像で異常がなければ両側下錐体静脈洞サンプリングへ進む。", "r": "p.453 / 症例10 p.451"}]}, {"id": "m8", "lv": 3, "t": "Cushingの術後：抑えられた軸を待つ", "min": 5, "cats": "Cushing症候群", "src": "p.454-457 ／ 小児内分泌学 p.433", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>Cushing病の摘出術の翌朝。女の子の血中コルチゾールは0.8 μg/dLでした。だるそうな顔で「手術したのに、前より元気が出ない」と言います。お母さんは心配そうです。</div><p>Cushing病の手術がうまくいくと、患者さんは一時的に<strong>副腎不全</strong>になります。逆説的に聞こえますが、それが治った証拠なのです。今日は術後の数か月から数年を見ます。</p>\n<h3>コルチゾールが下がりきることが「治癒」</h3>\n<p>術後の血中コルチゾールが<strong>1〜2 μg/dL以下</strong>になることが、治癒の指標です。長いあいだ腫瘍がコルチゾールを出し続けていたので、<strong>正常な下垂体のACTH細胞は抑えられきっています</strong>。腫瘍がなくなれば、コルチゾールを作る指令がどこからも出ない。その状態が、腫瘍が取れた証拠になります。</p>\n<p>裏を返せば、その後は<strong>必ずステロイドの補充</strong>が要ります。副腎の章の第6話で見た、ステロイドが作る副腎不全と同じ構造です。冒頭の女の子の「元気が出ない」は、その表れでした。</p>\n<h3>補充は「少なめ」がよいかもしれない</h3>\n<p>抑えられた軸が回復するには、<strong>長い時間</strong>がかかります。そして本書は、<strong>ヒドロコルチゾンを少なめにしたほうが、回復が早まる可能性</strong>を示しています。補充が多すぎると、軸が立ち上がる理由がなくなるからです。</p>\n<div class=\"formula\">ヒドロコルチゾン 6〜8 mg/m²/日 程度の少量</div>\n<p>もちろん、シックデイの増量（副腎の章の第5話）はしっかり教えます。少なめの補充と、いざというときの増量。この二つはセットです。</p>\n<h3>止まっていた背が動き出す</h3>\n<p>治療のあとには、<strong>身長の伸びが戻り、肥満度が下がっていく</strong>ことが見られます。本書の症例では、思春期の発来とも重なって説明されています。ただし、ステロイドを補充しているあいだは、<strong>GH分泌能の評価そのものが難しい</strong>という注意もあります。背の戻りが悪いからといって、すぐにGHDと決めません。</p>\n<h3>手術ができないとき、取りきれないとき</h3>\n<p>薬でコルチゾールを抑える方法もあります。</p>\n<ul>\n<li><strong>メチラポン</strong>：11β水酸化酵素を止めるので、手前の<strong>11-デオキシコルチゾール</strong>が溜まります。</li>\n<li><strong>ミトタン</strong>：副腎皮質を壊す薬。効くまでに時間がかかるので、再発予防の補助として使います。コルチゾールの<strong>代謝も速める</strong>ので、尿中遊離コルチゾールでの判定に注意が要ります。大量では生理量のステロイド補充が必要になります。</li>\n</ul>\n<p>冒頭の女の子には、ヒドロコルチゾンを少なめに始め、発熱のときの増量を練習しました。1年半後、朝のコルチゾールが自分で出るようになり、補充を終えることができました。その間に身長は7 cm伸び、丸かった顔はすっかりもとに戻っていました。</p>", "keys": ["術後コルチゾール1〜2 μg/dL以下が治癒の指標（正常軸が抑制されきっている）", "術後は必ずステロイド補充。回復には長期間かかる", "ヒドロコルチゾン6〜8 mg/m²/日程度の少なめ補充で回復が早まる可能性", "治療後は身長増加と肥満度低下。補充中はGH分泌能評価が難しい", "メチラポンは11-デオキシコルチゾール蓄積、ミトタンは代謝促進で尿中F判定に注意"], "upd": null, "quiz": [{"v": "", "q": "Cushing病の術後、治癒を示す指標として述べられているのは。", "o": ["術後の血中コルチゾールが正常範囲（5〜15 μg/dL）に保たれること", "術後の血中コルチゾールが1〜2 μg/dL以下となること", "術後のACTHが正常範囲に入ること", "術後1週で体重が減りはじめること"], "a": 1, "e": "正常の副腎軸が抑制されきっている状態が、腫瘍が取れた証拠になる。裏返せば、その後は必ずステロイド補充が要る。", "r": "p.456"}, {"v": "", "q": "Cushing病術後の副腎機能回復について本書が示唆しているのは。", "o": ["回復には長期を要し、ヒドロコルチゾンを少なめにすると回復が早まる可能性がある", "回復は数週で完了し、補充は1か月以内に中止でき、多めに補充すると回復が早まる", "ヒドロコルチゾンを多めに補充すると回復が早まる", "副腎機能は回復せず、生涯の補充が必要になる"], "a": 0, "e": "補充が多すぎると軸が立ち上がらない。ヒドロコルチゾン6〜8 mg/m2/日程度の少量投与が挙げられている。", "r": "p.456-457"}, {"v": "", "q": "メチラポンとミトタンの作用と効果判定の違いは。", "o": ["メチラポンは11-デオキシコルチゾールを蓄積させ、ミトタンはコルチゾール代謝も促進するため尿中遊離コルチゾールでの判定に注意を要する", "どちらも11β水酸化酵素を阻害して11-デオキシコルチゾールを蓄積させ、尿中遊離コルチゾールで同様に判定でき", "メチラポンは副腎皮質を傷害し、ミトタンは酵素阻害で速やかに効く", "ミトタンは数日で効果が出るため急性期のコントロールに適する"], "a": 0, "e": "ミトタンは効果が出るまで時間がかかるため再発予防の補助として使われる。大用量では生理量のステロイド補充が必要になる。", "r": "小児内分泌学 p.433"}]}, {"id": "m9", "lv": 2, "t": "副腎皮質腫瘍とLi-Fraumeni", "min": 5, "cats": "副腎腫瘍・アルドステロン症・高血圧", "src": "症例1 p.443-445 ／ 小児内分泌学 p.443", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>3歳の女の子。陰毛が数本見えるようになり、少しずつ増えてきました。DHEA-Sとテストステロンが高く、お腹を触ると右の上腹部にしこりがあります。</div><p>思春期の章の第3話で、早発陰毛と副腎性徴を見ました。そこで「ゆっくり進む早発陰毛は多くが心配ない」と学びましたが、例外があります。今日はその例外、<strong>副腎皮質腫瘍</strong>です。</p>\n<h3>アンドロゲンだけが突出する</h3>\n<p>小児の副腎皮質がんは、<strong>男性ホルモンを出す腫瘍</strong>として見つかることが多いです。冒頭の女の子は、DHEA-Sとテストステロンが高いのに、<strong>コルチゾールとACTHの日内変動は保たれ</strong>、尿中遊離コルチゾールは正常でした。アンドロゲンだけが突出し、コルチゾール系は保たれている。これが典型的な形です。</p>\n<p>3歳で陰毛が出て、どんどん増えていく。早発陰毛としては早すぎ、速すぎます。DHEA-Sが思春期以上に高ければ、腫瘍を探します。</p>\n<h3>背景にTP53</h3>\n<p>小児の副腎皮質がんの背景として知られているのが<strong>Li-Fraumeni症候群（TP53）</strong>です。生まれつき片方のTP53に変異があり、腫瘍細胞に<strong>もう一つの変異（second hit）</strong>が加わって発症する、古典的なモデルです。副腎皮質がんは<strong>5歳までに約90%</strong>が発症します。</p>\n<p>副腎皮質がんの子を見たら、家族にほかのがん（乳がん、肉腫、脳腫瘍、白血病など）がないかを聞き、遺伝カウンセリングにつなげます。</p>\n<h3>取ったあとも、追う</h3>\n<p>治療は<strong>摘出</strong>に加えて、<strong>ミトタン</strong>を使います。肉眼的に取りきれても、<strong>微小な転移</strong>が見られることが多いからです。だから完全に摘出したあとも追跡が要ります。<strong>腫瘍が出していたホルモン</strong>（この子ならDHEA-Sとテストステロン）が、再発の指標になります。</p>\n<h3>副腎のもう一つの腫瘍：アルドステロン</h3>\n<p>子どもの高血圧と低K血症では、<strong>原発性アルドステロン症</strong>も考えます。</p>\n<div class=\"formula\">アルドステロン／レニン比（ARR）&gt; 200 で陽性 → カプトプリル・生理食塩水・フロセミド立位負荷のいずれかで確認</div>\n<p>低K血症は検査の前に補正します。子どもでは、副腎の章の第15話で見た<strong>家族性</strong>のもの（GRA、CYP11B2やKCNJ5の異常など）を念頭に置きます。局在の診断は、薄いスライスのCTと副腎静脈サンプリングです。</p>\n<p>冒頭の女の子は、右副腎に4 cmの腫瘍が見つかり、摘出されました。副腎皮質がんでした。TP53に生殖細胞系列の変異が見つかり、家族の相談も始まりました。DHEA-Sは術後に正常化し、それからは3か月ごとにDHEA-Sを測り続けています。</p>", "keys": ["小児の副腎皮質がんはアンドロゲン単独の突出（コルチゾール系は保たれる）で見つかることが多い", "早すぎ・速すぎる早発陰毛とDHEA-S高値は腫瘍を探す", "背景にLi-Fraumeni症候群（TP53）。5歳までに約90%が発症", "摘出＋ミトタン。微小転移が多く、産生ホルモンを指標に追跡", "原発性アルドステロン症：ARR＞200で確認試験。小児は家族性を念頭に"], "upd": null, "quiz": [{"v": "幼児。陰毛が数本みられ徐々に増えてきた。DHEA-S・テストステロンが高値だが、コルチゾールとACTHの日内変動は保たれ、尿中遊離コルチゾールは正常範囲。腹部に腫瘤を認めた。", "q": "最も考えられるのは。", "o": ["副腎皮質腫瘍", "中枢性思春期早発症", "21水酸化酵素欠損症", "副腎白質ジストロフィー"], "a": 0, "e": "アンドロゲンだけが突出し、コルチゾール系は保たれている。小児の副腎皮質がんはこの形で発症することが多い。 男性ホルモン産生。", "r": "症例1 p.443-445"}, {"v": "", "q": "小児の副腎皮質がんの背景として知られている遺伝性疾患は。", "o": ["Li-Fraumeni症候群（TP53）", "神経線維腫症1型（NF1）", "von Hippel-Lindau病（VHL）", "結節性硬化症（TSC1/TSC2）"], "a": 0, "e": "生殖細胞系列の変異に加え、腫瘍細胞にsecond hitが生じて発症するという古典的なモデル。5歳までに約90%が発症する。", "r": "p.445"}, {"v": "", "q": "原発性アルドステロン症のスクリーニングと確認検査として推奨されているのは。", "o": ["アルドステロン/レニン比（ARR）>200を陽性とし、カプトプリル負荷・生理食塩水負荷・フロセミド立位負荷のうち1種類以上の陽性で確認。低K血症は検査前に補正する", "血漿レニン活性のみで判定する", "CTで腺腫があれば確認検査は不要で、尿中アルドステロンの単回測定で確定でき、低K血症は補正せずに測る", "尿中アルドステロンの単回測定で確定する"], "a": 0, "e": "小児では家族性（GRA、CYP11B2/KCNJ5など）を念頭に置く。局在診断はthin sliceのCTと副腎静脈サンプリング。", "r": "小児内分泌学 p.443"}]}, {"id": "m10", "lv": 2, "t": "褐色細胞腫・パラガングリオーマ", "min": 6, "cats": "MEN・褐色細胞腫・褐色細胞腫", "src": "症例 p.447-449 ／ 小児内分泌学 p.444-447, 606-607", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>13歳の男の子。頭痛と動悸、汗をかく発作をくり返し、学校で測った血圧が180/110でした。「緊張しやすい子なんです」とお母さんは言いますが、発作のときの顔は真っ青だったそうです。</div><p>子どもの高血圧は、まず二次性を考えます。その中でも、見逃すと命に関わるのが<strong>褐色細胞腫・パラガングリオーマ（PPGL）</strong>です。</p>\n<h3>5つのH</h3>\n<p>主な症状は「5H」と覚えます。</p>\n<div class=\"formula\">Hypertension（高血圧）・Headache（頭痛）・Hyperhidrosis（発汗）・Hypermetabolism（代謝亢進）・Hyperglycemia（高血糖）</div>\n<p>でも、高血圧や動悸だけでは拾えません。<strong>数字で確認</strong>します。</p>\n<h3>測るのは「メタネフリン」</h3>\n<p>カテコラミンは発作のときにだけ出ることが多いのですが、その代謝物である<strong>メタネフリンは腫瘍の中で持続的に作られる</strong>ので、診断の価値が高いのです。</p>\n<ul>\n<li><strong>血中遊離メタネフリン</strong>：感度はほぼ100%</li>\n<li><strong>尿中メタネフリン分画</strong>：正常上限の3倍以上、または500 ng/mg·Cr以上で陽性。反復して測ります</li>\n<li>カテコラミン、クロモグラニンAも参考に</li>\n</ul>\n<p>局在の診断には、<strong>MIBG</strong>などの機能的な画像を組み合わせます。子どもや妊婦さんでは、CTより<strong>MRI</strong>が望ましいとされます。</p>\n<h3>手術の前：αが先、βはあと</h3>\n<p>術前の管理には、はっきりした順番があります。</p>\n<div class=\"formula\">α遮断薬（ドキサゾシンなど）を第一選択 → 頻脈・不整脈があれば β1選択的遮断薬を後から追加</div>\n<p><strong>β遮断薬を単独で使うのは禁忌</strong>です。βを先に止めると、血管を広げるβ2の作用が外れ、カテコラミンのα作用だけが残って<strong>血圧が急上昇</strong>します。コントロールが難しければCa拮抗薬を加えます。術中の血圧の変動と、腫瘍を取ったあとの<strong>低血糖・低血圧</strong>にも備えます。</p>\n<h3>子どもの褐色細胞腫は、遺伝を考える</h3>\n<p>PPGL全体で<strong>30〜40%</strong>が生殖細胞系列の変異に由来し、子どもではその割合がさらに高くなります。SDHA/B/C/D、VHL、RET、NF1、TMEM127、MAXなど。散発例に見えても、<strong>全例で遺伝子の解析を検討</strong>します。</p>\n<p>候補の遺伝子は多いので、当たりをつける方法があります。組織の<strong>SDHB免疫染色</strong>が消えていればSDH系。そして臨床所見の組み合わせ：甲状腺の病変があればMEN2A、腸管神経節腫症があればMEN2B、腎細胞がんや膵嚢胞があればVHL。</p>\n<h3>良性か悪性か</h3>\n<p>組織で良性と悪性を確実に分ける方法はなく、<strong>転移があるかどうか</strong>で判断します。<strong>ノルアドレナリン優位、副腎の外にできたもの、多発、SDHB変異</strong>は、悪性のリスク因子です。悪性では5年生存率が約30%と予後が悪い。一方、MEN2に伴う褐色細胞腫の悪性率は<strong>1〜4%</strong>と低いのですが、両側・多発になりやすく、長い追跡が要ります。</p>\n<p>冒頭の男の子は、血中遊離メタネフリン（ノルメタネフリン）が上限の10倍。MRIで大動脈の脇に3 cmのパラガングリオーマが見つかりました。ドキサゾシンを2週間かけて増やしてから手術。SDHBの免疫染色が消えていて、遺伝子検査でSDHB変異が見つかりました。長いフォローの始まりです。</p>", "keys": ["5H（高血圧・頭痛・発汗・代謝亢進・高血糖）。症状でなく数字で確認", "メタネフリンは持続産生で診断価値が高い。血中遊離メタネフリンの感度ほぼ100%", "術前はα遮断薬が先、β1遮断薬は後。β遮断薬単独は禁忌", "PPGLの30〜40%（小児はさらに多い）が遺伝性。SDHB免疫染色と臨床所見で絞る", "悪性リスク：ノルアドレナリン優位・副腎外・多発・SDHB。MEN2の悪性率は1〜4%"], "upd": null, "quiz": [{"v": "", "q": "褐色細胞腫の術前管理として推奨される薬剤の順序は。", "o": ["α遮断薬（ドキサゾシン1〜32 mg/日/m²など）を第一選択とし、頻脈・不整脈があればβ1選択的遮断薬を後から加える。β遮断薬単独は禁忌、コントロール困難ならCa拮抗薬を併用", "β遮断薬を先に投与して頻脈を抑えてからα遮断薬を加え、Ca拮抗薬とACE阻害薬は用いない", "Ca拮抗薬のみで管理する", "ACE阻害薬が第一選択"], "a": 0, "e": "β遮断薬単独では血管のβ2による拡張が外れ、α作用で血圧が急上昇する。非選択的α遮断薬フェノキシベンザミンも用いられる。術中の血圧変動と術後の低血糖・低血圧に備える。", "r": "小児内分泌学 p.446"}, {"v": "", "q": "褐色細胞腫のスクリーニングとして感度が高いとされる検査は。", "o": ["血中遊離メタネフリン（感度ほぼ100%）", "血中カテコラミン（感度ほぼ100%、特異度も高い）", "尿中VMA（感度ほぼ100%）", "腹部CT（感度ほぼ100%）"], "a": 0, "e": "局在診断ではMIBGなどの機能的画像を併用する。小児や妊婦ではCTよりMRIが望ましい。", "r": "小児内分泌学 p.607"}, {"v": "", "q": "小児褐色細胞腫・パラガングリオーマの遺伝的背景と予後について正しいのは。", "o": ["小児では患者の30%以上に生殖細胞系列変異（SDHB、VHL、RETなど）を認め、ノルアドレナリン優位・副腎外発生・多発・SDHB変異は悪性のリスク因子。悪性では5年生存率が約30%と不良", "小児では遺伝性はまれで散発性が大部分を占め、アドレナリン優位のものが悪性になりやすく、良悪性は組織診で確実に判定できる", "アドレナリン優位のものが悪性になりやすい", "良悪性は組織診で確実に判定できる"], "a": 0, "e": "組織学的に良悪性を分ける確実な方法がなく、転移の有無で判断する。全例で遺伝子解析を検討し、長期のフォローを続ける。", "r": "小児内分泌学 p.447"}]}, {"id": "m11", "lv": 3, "t": "MEN1：二つ目のヒットを待つ遺伝子", "min": 5, "cats": "MEN・褐色細胞腫・症候群性の腫瘍素因・下垂体・鞍上部腫瘍", "src": "小児内分泌学 p.602-605 ／ 治療 p.955-956", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>お父さんがMEN1と診断され、10歳の娘さんの遺伝子検査を勧められて来院しました。結果は陽性。でも、娘さんは今のところどこにも病気がありません。「何もないのに、病気なんですか？」</div><p>多発性内分泌腫瘍症（MEN）には、性格のまったく違う二つの型があります。今日は<strong>MEN1</strong>、次の回で<strong>MEN2</strong>です。</p>\n<h3>MEN1の三つの病変</h3>\n<ul>\n<li><strong>副甲状腺機能亢進症</strong>：いちばん多く、98%以上</li>\n<li><strong>膵・消化管の神経内分泌腫瘍（NET）</strong></li>\n<li><strong>下垂体腺腫</strong>：日本ではプロラクチノーマが最多</li>\n</ul>\n<p>三つすべてを発症するのは20%ほどです。頻度は約3万人に1人。約10%は新生突然変異です。</p>\n<h3>MEN1は「ブレーキの故障」</h3>\n<p>MEN1遺伝子は<strong>menin</strong>という蛋白を作ります。meninはJunDなどと結合して転写を調節し、MLL、PRMT5、DAXXと複合体を作ってクロマチンの修飾を調節する、<strong>腫瘍抑制遺伝子</strong>です。</p>\n<p>だから発症には、Knudsonの<strong>two-hit theory</strong>のとおり、残ったもう一方のアレルにも体細胞変異が起きる必要があります。前の回のLi-Fraumeniと同じ構造です。変異の場所と症状のあいだに相関はありません。次の回のMEN2（RETの機能獲得）とは、仕組みも治療の戦略もまったく違います。</p>\n<h3>診断の基準</h3>\n<p>三つの病変のうち<strong>2つ以上</strong>があれば、MEN1と臨床診断します。あるいは、1つの病変に加えて<strong>第一度近親者にMEN1</strong>がいるか、<strong>生殖細胞系列の変異</strong>が確かめられていれば診断できます。散発例でも、変異が陽性なら診断できます。</p>\n<p>MEN1と似た病変があるのにMEN1変異が見つからない一群には、<strong>MEN4</strong>という概念が提唱されています。CDKN1Bの異常が知られています。変異がないから否定、とはなりません。</p>\n<h3>「変異保有未発症者」</h3>\n<p>遺伝子検査で変異が見つかったけれど、まだどの病変も出ていない人を、<strong>MEN1変異保有未発症者</strong>と呼びます。冒頭の娘さんです。この診断は、病気のレッテルではなく<strong>フォローの開始点</strong>です。</p>\n<p>病変がなくても、<strong>毎年</strong>スクリーニングします。血糖、インスリン、PRL、IGF-1、カルシウム、intact PTH、ガストリン、グルカゴンなど。必要に応じて画像も加えます。</p>\n<h3>どれから治すか</h3>\n<p>複数の病変があるときの優先順位は、<strong>症状の重さと悪性度</strong>で決めます。膵の腫瘍ではNETの治療が優先されることが多いです。下垂体腺腫はプロラクチノーマが多いので、第4話で見たとおり<strong>ドパミンアゴニスト</strong>が第一選択。手術ができない、あるいは優先度の低い腫瘍には、NETにソマトスタチン製剤、副甲状腺にエタノール注入やシナカルセトなどを使います。MEN1の病変は多発しやすく、再発しやすい傾向があります。</p>\n<p>娘さんには、こう答えました。「いまは病気じゃないよ。体の中に、病気が出やすくなる設計図の違いを一つもっている、ということ。だから、病気が小さいうちに見つけられるよう、毎年一回、血液の検査をしよう。それがあなたを守る方法なんだ」。</p>", "keys": ["MEN1：副甲状腺機能亢進症（最多98%以上）・膵消化管NET・下垂体腺腫（プロラクチノーマ最多）", "約3万人に1人。meninは腫瘍抑制遺伝子でtwo-hitで発症", "臨床診断：3病変のうち2つ以上、または1つ＋近親者/生殖細胞系列変異", "変異保有未発症者は毎年スクリーニング（Ca・PTH・PRL・IGF-1・ガストリンなど）", "治療の優先は症状の重さと悪性度。MEN1陰性の類似例はMEN4（CDKN1B）"], "upd": null, "quiz": [{"v": "", "q": "MEN1の臨床診断基準を満たすのはどれか。", "o": ["副甲状腺機能亢進症・膵消化管神経内分泌腫瘍・下垂体腺腫のうち2つ以上を有する", "3つの病変すべてを有すること", "1つの病変を有し、家族歴があること", "遺伝子変異が同定され、病変は問わない（変異のみで診断でき、家族歴も病変も不要）"], "a": 0, "e": "あるいは、これらのいずれか1つに加えて第一度近親者にMEN1と診断された者がいること、または生殖細胞系列変異が確認されていること。散発例でも変異陽性なら診断できる。", "r": "小児内分泌学 p.603 / 治療 p.956"}, {"v": "", "q": "MEN1で最も高頻度に認められる病変は。", "o": ["副甲状腺機能亢進症", "下垂体腺腫", "膵消化管神経内分泌腫瘍", "副腎病変"], "a": 0, "e": "3病変すべてを発症するのは20%程度にとどまる。日本の下垂体腫瘍ではプロラクチノーマが最多。下垂体腫瘍全体のうちMEN1によるものは3%以下。 98%以上。", "r": "小児内分泌学 p.602"}, {"v": "", "q": "「MEN1変異保有未発症者」とは。", "o": ["遺伝子診断で変異が同定されたが、いずれの病変も発症していない者", "遺伝子診断で変異が否定されたが、家族歴があるため追跡を要する者", "1つの病変のみを発症した者", "治療後に病変が消失した者"], "a": 0, "e": "未発症でも定期的なスクリーニング（血糖・インスリン・PRL・IGF-1・カルシウム・intact PTH・ガストリン・グルカゴンなど）を毎年行う。診断がフォローの開始点になる。", "r": "小児内分泌学 p.604 / 表 p.604"}]}, {"id": "m12", "lv": 3, "t": "MEN2：コドンで決まる手術の時期", "min": 6, "cats": "MEN・褐色細胞腫・症候群性の腫瘍素因", "src": "p.445-449 ／ 小児内分泌学 p.606-608 ／ 治療 p.960-961", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>3歳の男の子。お母さんが甲状腺髄様がんの手術を受け、MEN2Aと分かりました。男の子の遺伝子検査で、RETのコドン634の変異が見つかりました。「この子の甲状腺も、取らないといけないんですか」</div><p>MEN1が「ブレーキの故障」なら、MEN2は「<strong>アクセルの踏みっぱなし</strong>」です。RETはキナーゼで、その機能獲得変異で腫瘍ができます。そして浸透率が高く、<strong>発症前に介入できる</strong>のがMEN2の大きな特徴です。</p>\n<h3>MEN2AとMEN2B</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>MEN2A</th><th>MEN2B</th></tr>\n<tr><td>甲状腺髄様がん</td><td>ほぼ全例</td><td>ほぼ全例、より早く発症</td></tr>\n<tr><td>褐色細胞腫</td><td>あり</td><td>あり</td></tr>\n<tr><td>副甲状腺機能亢進症</td><td>あり</td><td><strong>なし</strong></td></tr>\n<tr><td>そのほか</td><td>苔癬アミロイドーシス、Hirschsprung病</td><td>マルファン様体型、粘膜神経腫、腸管神経節腫症、筋緊張低下</td></tr></table></div>\n<p>MEN2Aの<strong>80〜90%がコドン634</strong>の変異です。Hirschsprung病もRET変異で起きることがあり、Hirschsprung病の患者さんの2〜5%にMEN2Aが見つかります。MEN2Bは<strong>顔と体型で気づける</strong>型で、唇や舌のでこぼこ（粘膜神経腫）と細長い体つきがあれば、血清カルシトニンを測ることが診断につながります。</p>\n<p>以前は、家族性甲状腺髄様がん（FMTC）という分類もありましたが、いまはMEN2Aの亜型と位置づけられ、使われなくなっていくと考えられています。病名より、<strong>どのコドンの変異か</strong>で方針が動く時代です。</p>\n<h3>コドンでリスクが分かれる</h3>\n<p>変異のコドンによって、リスクのレベル（MOD／H／HST）が分かれ、甲状腺を取る時期が変わります。</p>\n<div class=\"formula\">コドン634（H）：5歳までに甲状腺全摘。カルシトニン40 pg/mL以上ならリンパ節郭清<br>M918T（MEN2B, HST）：最高リスク。さらに早期に全摘</div>\n<p>症状が出る前に、がんができる前に、甲状腺を取る。予防的甲状腺全摘です。</p>\n<h3>髄様がんのマーカー</h3>\n<p>甲状腺の章の第2話で見たように、カルシトニンは甲状腺の<strong>傍濾胞C細胞</strong>が作ります。髄様がんはこのC細胞のがんなので、マーカーは<strong>カルシトニンとCEA</strong>です。<strong>サイログロブリンは使えません</strong>。サイログロブリンは濾胞細胞のマーカーだからです（甲状腺の章の第15話）。</p>\n<p>術後は、カルシトニンが<strong>150 pg/mLを超えたら</strong>再発・転移の検索に進みます。それ未満なら数か月ごとにカルシトニンとCEAを測ります。二つの値の<strong>倍加時間</strong>が予後の指標になります。</p>\n<h3>家族に広げる</h3>\n<p>MEN2の発端者が見つかったら、家族の遺伝子診断を検討します。浸透率が高く、発症前に介入できる病気だからこそ、<strong>家系への展開が診断の一部</strong>なのです。異常が見つからなかった家族でも、1年ごとの追跡を続けることがあります。</p>\n<p>冒頭のお母さんには、こう伝えました。「お母さんの病気が分かったことで、この子は、がんになる前に守れるチャンスをもらいました。5歳までに甲状腺を取る手術を、カルシトニンを見ながら計画しましょう。そのあとは、甲状腺のお薬を毎日飲めば、ふつうに大きくなっていけます」。</p>", "keys": ["MEN2はRETの機能獲得。MEN2Aの80〜90%がコドン634", "MEN2Bは副甲状腺病変なし、マルファン様体型・粘膜神経腫・腸管神経節腫症。髄様がんがより早い", "コドン634は5歳までに甲状腺全摘（カルシトニン40以上で郭清）、M918Tはさらに早期", "髄様がんのマーカーはカルシトニンとCEA（サイログロブリンは使えない）。150 pg/mL超で転移検索", "発端者が出たら家族の遺伝子診断。FMTCはMEN2Aの亜型へ"], "upd": null, "quiz": [{"v": "RETのコドン634変異を有する児。家族はMEN2Aと診断されている。", "q": "甲状腺髄様癌に対する方針として示されているのは。", "o": ["5歳までに甲状腺全摘出を行い、カルシトニン値40 pg/mL以上ではリンパ節郭清を行う", "カルシトニンが上昇するまで経過をみて、上昇したら手術し、リンパ節郭清は行わずに術後の抑制療法で対応する", "1歳までに甲状腺全摘出を行う（M918T変異と同じ扱い）", "10歳ごろに甲状腺全摘出を行い、リンパ節郭清は行わない"], "a": 0, "e": "変異のコドンによりリスクレベル（MOD／H／HST）が分かれ、手術時期が変わる。M918T（MEN2B）は最高リスクで、より早期の全摘が必要になる。", "r": "小児内分泌学 p.608 / 図 p.608"}, {"v": "", "q": "MEN2Aに特徴的で、MEN2Bには通常みられない病変の組み合わせは。", "o": ["副甲状腺機能亢進症、苔癬アミロイドーシス、Hirschsprung病", "粘膜神経腫、マルファン様体型、腸管神経節腫症、角膜神経肥厚", "甲状腺髄様癌、褐色細胞腫、副甲状腺機能亢進症", "角膜神経肥厚、腸管神経節腫症、筋緊張低下"], "a": 0, "e": "MEN2BにはMEN2Aの副甲状腺病変がない。逆にHirschsprung病はRET変異で生じ、Hirschsprung病患者全体の2〜5%にMEN2Aが認められる。", "r": "小児内分泌学 p.607"}, {"v": "", "q": "MEN2Bの特徴として正しいのは。", "o": ["マルファン様体型・粘膜神経腫・腸管神経節腫症を伴い、副甲状腺病変のリスクはない", "マルファン様体型・粘膜神経腫を伴い、副甲状腺機能亢進症が主体で甲状腺髄様癌は成人期に発症する", "苔癬アミロイドーシスを伴い、甲状腺髄様癌は成人期に発症する", "粘膜神経腫を伴うが、甲状腺髄様癌のリスクは低い"], "a": 0, "e": "顔と体型で気づける型。副甲状腺を心配しなくてよい代わりに、髄様がんの発症がより早い。", "r": "p.449"}]}, {"id": "m13", "lv": 2, "t": "腫瘍が出やすい症候群", "min": 5, "cats": "症候群性の腫瘍素因", "src": "症例 p.447-450 ／ 小児内分泌学 p.605", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>新生児室。臍帯ヘルニアがあり、舌が大きく、右の手足が左より太い赤ちゃん。生後半日で血糖が28 mg/dLまで下がりました。</div><p>ある症候群をもつ子は、特定の腫瘍が出やすいことがあります。診断がついた時点から、<strong>何を、いつまで見張るか</strong>が決まります。今日は三つの症候群を見ます。</p>\n<h3>Beckwith-Wiedemann症候群</h3>\n<p>臍帯ヘルニア、巨舌、片側肥大。冒頭の赤ちゃんです。新生児期の<strong>低血糖は高インスリン血症</strong>によるもので、糖尿病・低血糖の章でもう一度出てきます。</p>\n<p>責任領域は<strong>11p15.5</strong>の二つのインプリンティング領域、<strong>H19 DMR</strong>と<strong>KvDMR1</strong>です。父性ダイソミー、H19 DMRのメチル化亢進、KvDMR1のメチル化低下、<strong>CDKN1C</strong>の変異など、いくつもの仕組みが同じ姿に集まります。性分化の章の第11話で見たIMAGe症候群は、同じCDKN1Cの<strong>機能獲得</strong>でした。同じ遺伝子が、逆向きに働くと逆の病気になる。成長障害の章で見たSilver-Russell症候群も、同じ11p15.5の逆向きの異常です。</p>\n<p>長期的に見張るのは、<strong>Wilms腫瘍と肝芽腫</strong>です。片側肥大があるとリスクがより高いとされ、<strong>腹部超音波とAFP</strong>で追いかけます。</p>\n<h3>Carney complex</h3>\n<p>責任遺伝子は<strong>PRKAR1A</strong>。PKAの<strong>調節サブユニット</strong>で、がん抑制遺伝子として働きます。調節サブユニットが失われると、触媒サブユニットが離れっぱなしになり、<strong>cAMPのシグナルが出っぱなし</strong>になります。思春期の章の第10話のMcCune-Albright（Gsαの活性化）と、同じcAMPの経路の別の場所の故障です。cAMPを分解するPDE11Aの変異も報告されています。</p>\n<p>診断基準に含まれるのは：</p>\n<ul>\n<li>皮膚・粘膜の<strong>色素斑</strong></li>\n<li><strong>粘液腫</strong>（皮膚、粘膜、そして<strong>心臓</strong>）</li>\n<li><strong>PPNAD</strong>（ACTH非依存性Cushing、第7話）</li>\n<li>GH産生下垂体腺腫（第5話）</li>\n<li>砂粒腫様黒色性神経鞘腫 など</li>\n</ul>\n<p>大事なのは<strong>心臓粘液腫</strong>です。内分泌の腫瘍ではありませんが、これが<strong>命の見通しを左右</strong>します。内分泌医が診断したら、心エコーを忘れないことです。</p>\n<h3>DICER1症候群</h3>\n<p>臓器を越えて腫瘍が並びます。<strong>胸膜肺芽腫、下垂体芽腫、多結節性甲状腺腫、Sertoli-Leydig細胞腫、嚢胞性腎腫</strong>。甲状腺の章の第15話で見た甲状腺のしこりの背景に、こうした症候群があることもあります。浸透率は高くなく、何か修飾する因子があると考えられています。</p>\n<p>冒頭の赤ちゃんは、ブドウ糖の持続点滴で血糖が安定し、11p15.5の検査でKvDMR1のメチル化低下が見つかりました。退院のとき、ご両親には、3か月ごとの腹部超音波とAFPの予定表をお渡ししました。「見張っていれば、もし何かできても小さいうちに見つけられます」。</p>", "keys": ["BWS：臍帯ヘルニア・巨舌・片側肥大、新生児低血糖は高インスリン血症", "BWSは11p15.5（H19 DMR・KvDMR1）。Wilms腫瘍・肝芽腫を超音波とAFPで監視", "Carney complex：PRKAR1A（PKA調節サブユニット）でcAMPシグナル亢進", "Carneyの診断基準：色素斑・粘液腫・PPNAD・GH産生腺腫。心臓粘液腫が予後を左右", "DICER1：胸膜肺芽腫・下垂体芽腫・多結節性甲状腺腫・Sertoli-Leydig細胞腫"], "upd": null, "quiz": [{"v": "新生児。臍帯ヘルニアと巨舌、右半身肥大、出生後の低血糖を認めた。", "q": "考えられる症候群と、長期的に監視すべきものは。", "o": ["Beckwith-Wiedemann症候群。Wilms腫瘍・肝芽腫の発生を監視する", "Prader-Willi症候群。肥満を監視する", "Noonan症候群。心筋症を監視する", "Silver-Russell症候群。低身長と摂食障害、低血糖、骨年齢の遅れを監視する"], "a": 0, "e": "新生児期の低血糖は高インスリン血症による。片側肥大があると腫瘍リスクがより高いとされ、腹部超音波とAFPでの追跡が行われる。", "r": "症例 p.447"}, {"v": "", "q": "Carney complexの責任遺伝子とその機能は。", "o": ["PRKAR1A。PKAの調節サブユニットで、がん抑制遺伝子として働く", "GNAS。Gsαの機能獲得変異で、McCune-Albright症候群と同じ", "PRKAR1A。PKAの触媒サブユニットで、機能獲得変異として働く", "MEN1。meninをコードし、がん抑制遺伝子として働く"], "a": 0, "e": "調節サブユニットが失われると、触媒サブユニットが解離しっぱなしになりcAMPシグナルが亢進する。cAMPを分解するPDE11Aの変異も報告されている。", "r": "p.449-450 / 文献2,3"}, {"v": "", "q": "Carney complexの診断基準に含まれるのは。", "o": ["皮膚・粘膜の色素斑、粘液腫（皮膚・粘膜・心臓）、PPNAD、GH産生下垂体腺腫、砂粒腫様黒色性神経鞘腫など", "カフェオレ斑、思春期早発、線維性骨異形成", "粘膜神経腫、マルファン様体型、甲状腺髄様癌、褐色細胞腫、腸管神経節腫症、角膜神経肥厚、苔癬アミロイドーシスなど", "色素斑、褐色細胞腫、網膜血管腫、腎細胞癌"], "a": 0, "e": "内分泌腫瘍だけでなく心臓粘液腫が含まれる点が重要で、これが生命予後を左右する。", "r": "表4 p.450"}]}, {"id": "m14", "lv": 3, "t": "免疫チェックポイント阻害薬と内分泌", "min": 5, "cats": "症候群性の腫瘍素因", "src": "小児内分泌学 p.619-620", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>悪性黒色腫で免疫チェックポイント阻害薬（ICI）の治療を受けている17歳。腫瘍科の先生から相談です。「だるさと食欲低下が強くて、Naが127。甲状腺は先月から低下していてLT4を始めたところです」</div><p>がんの治療は、免疫の力を使う時代になりました。<strong>免疫チェックポイント阻害薬（ICI）</strong>は免疫のブレーキを外すので、内分泌の臓器にも炎症が起きることがあります。小児でも使われる場面が増えてきました。</p>\n<h3>いちばん多いのは甲状腺</h3>\n<p>ICIによる内分泌障害で最も多いのは、<strong>甲状腺機能低下症</strong>です。<strong>破壊性の甲状腺中毒症を経て、機能低下症に至る</strong>経過をとることがあります。甲状腺の章の第13話で見た、破壊性甲状腺炎と同じ流れです。投与前に<strong>TgAbやTPOAb</strong>が陽性だと起きやすい傾向があります。</p>\n<h3>下垂体炎：抗CTLA-4抗体で</h3>\n<p>下垂体機能低下症は、抗CTLA-4抗体で約1%、投与を始めて早い時期に多く起きます。だるさ、食欲低下、消化器症状。重い例では<strong>副腎クリーゼ</strong>に至ります。</p>\n<p>回復の見込みはホルモンで違います。<strong>TSHとゴナドトロピンの分泌不全は、最大50〜60%が回復</strong>するという報告がありますが、<strong>ACTH分泌不全は回復しにくい</strong>。長く補充することを前提にします。中枢性なので、甲状腺ホルモンの調節は<strong>TSHではなくFT4</strong>で行います。</p>\n<p>そしてもう一度、<strong>ステロイドが先</strong>。第2話の原則は、ここでも同じです。</p>\n<h3>副腎不全のGrade別の対応</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>Grade</th><th>対応</th></tr>\n<tr><td>1（無症状〜軽症）</td><td>ヒドロコルチゾン維持量（朝10〜20 mg、午後5〜10 mg）、安定するまでICI休止を検討</td></tr>\n<tr><td>2（中等症）</td><td>急性症状に上記の2〜3倍、5〜10日で維持量へ</td></tr>\n<tr><td>3〜4</td><td>集中治療。生理食塩水2 L以上、ヒドロコルチゾン100 mg静注</td></tr></table></div>\n<p>原発性の副腎不全では、フルドロコルチゾンが必要になることもあります。</p>\n<h3>劇症1型糖尿病</h3>\n<p>頻度は1%未満とまれですが、<strong>ケトアシドーシスで発症</strong>することがあります。血糖が250 mg/dLを超えたらインスリンを始め、DKAを評価し、ICIはGrade 1以下になるまで休みます。</p>\n<h3>副甲状腺も</h3>\n<p>まれに、副甲状腺機能低下症も起きます。低Ca、高P、intact PTH低値。緊急でなければ<strong>活性型ビタミンD</strong>から始め、症状のある低Caにはグルコン酸Caを静注します。カルシウムの章の第6話の治療と同じです。</p>\n<h3>ICIを続けるか</h3>\n<p>内分泌のirAEは、多くは不可逆で、ずっと補充が要ります。一方で、内分泌障害が出た人のほうが<strong>抗腫瘍効果が高かった</strong>という報告もあります。だから、適切に補充しながら、ICIの治療を続けることを検討します。内分泌医の役目は、がんの治療を止めずに済むよう、ホルモンを整えることです。</p>\n<p>冒頭の17歳は、ACTHが低く、コルチゾールも2.1 μg/dL。中枢性の副腎不全でした。LT4を一度止めてヒドロコルチゾンを先に始め、3日後にLT4を再開しました。Naは戻り、1週間後にはICIの治療を再開できました。</p>", "keys": ["ICIの内分泌障害で最多は甲状腺機能低下症（破壊性中毒症を経ることも）。投与前抗体陽性で起きやすい", "下垂体炎は抗CTLA-4抗体で約1%。TSH・LH/FSHは50〜60%回復、ACTHは回復しにくい", "中枢性はFT4で調節、ステロイドを先に", "劇症1型糖尿病は1%未満だがDKAで発症", "内分泌irAEは多くが不可逆。補充しながらICI継続を検討"], "upd": null, "quiz": [{"v": "", "q": "免疫チェックポイント阻害薬（ICI）による内分泌障害で、最も頻度が高いのは。", "o": ["甲状腺機能低下症", "1型糖尿病", "副甲状腺機能低下症", "Basedow病"], "a": 0, "e": "投与前にTgAbやTPOAbが陽性だと発症しやすい傾向がある。破壊性甲状腺中毒症を経て機能低下症に至る経過をとる。 全体で6.6%。", "r": "小児内分泌学 p.619"}, {"v": "", "q": "ICIによる下垂体機能低下症のうち、回復する可能性が低いのは。", "o": ["TSH分泌不全症", "ACTH分泌不全症", "ゴナドトロピン分泌不全症", "プロラクチン分泌不全症"], "a": 1, "e": "TSH分泌不全症とゴナドトロピン分泌不全症は最大50〜60%の割合で回復するとの報告がある。内分泌irAEsは多くの場合不可逆的で永続的な治療が必要なことが多い。一方、ICIにより内分泌障害が発現した群のほうが高い抗腫瘍効果が得られたとの報告があり、適切に対処しながらICI治療の継続を検討する。", "r": "小児内分泌学 p.620"}, {"v": "", "q": "ICIによる下垂体機能低下症の治療でホルモン補充を行うとき、甲状腺ホルモンの用量調節に用いる指標は。", "o": ["FT4（TSHは指標にならない）", "TSH（正常範囲の中央を目標にする）", "FT3", "サイログロブリン"], "a": 0, "e": "中枢性なのでTSHは当てにならない。Grade 1でも症状があればホルモン補充が安定するまでICIの休薬を検討する。", "r": "小児内分泌学 p.620"}]}, {"id": "m15", "lv": 2, "t": "小児がん経験者：治療が残すもの", "min": 6, "cats": "小児がん経験者（総説）", "src": "小児内分泌学 p.631-635", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>7歳で髄芽腫の治療を受け、全脳全脊髄照射と化学療法を乗り越えた13歳の男の子。がんは再発していません。今日は内分泌のフォロー外来、初めての受診です。「もう治ったのに、なんで病院に来るの？」</div><p>小児がんは、いまや<strong>8割以上が長期生存</strong>する病気になりました。そして生き延びた子どもたち、<strong>小児がん経験者（CCS）</strong>の<strong>60〜90%以上</strong>が、一つ以上の晩期合併症をもちます。その中で最も多いのが、<strong>内分泌の合併症</strong>です。CCSの40〜60%に、何らかの内分泌代謝の問題が起きます。</p>\n<p>内分泌の合併症は、成長や思春期に直接響くだけでなく、生涯にわたって続くことがあります。だから、がんが治ったあとに、内分泌医の仕事が始まります。</p>\n<h3>放射線と下垂体：GHから落ちる</h3>\n<p>頭への照射のあと、下垂体前葉のホルモンは決まった順番で落ちていきます。</p>\n<div class=\"formula\">放射線感受性：GH ＞ LH/FSH ＞ ACTH ＞ TSH</div>\n<p>GHが最も弱く、照射量が<strong>18 Gy以上</strong>でGHDのリスクが高くなります。ただし低い線量でも、年月とともに発症率が上がります。だから、<strong>一度GH分泌刺激試験で正常だったからといって、ずっと大丈夫とは限りません</strong>。逆に、ほかの下垂体ホルモンが落ちていれば、GHDも隠れていると考えます。</p>\n<h3>性腺：早すぎることも、来ないことも</h3>\n<p>頭への照射は、ゴナドトロピンの分泌を<strong>不足</strong>だけでなく<strong>亢進</strong>させることもあります。</p>\n<div class=\"formula\">18 Gy以上 → 中枢性思春期早発症　／　30 Gy以上 → 性腺機能低下症</div>\n<p>高い線量では、<strong>一過性の思春期早発症のあとに、永続的な性腺機能低下症</strong>が来ることもあります。思春期の章の第7話で見た照射後の早発は、この話につながります。</p>\n<p>精巣への照射や<strong>アルキル化薬</strong>（ブスルファン、シクロホスファミドなど）は、<strong>胚細胞とSertoli細胞を傷つけやすく、Leydig細胞は比較的保たれます</strong>。だから、テストステロンは出て二次性徴は正常に来るのに、精巣は小さく、精子が作れない、ということが起きます。精巣が小さいのに思春期早発症になる子もいます。卵巣は腹部・骨盤の照射や化学療法で傷つき、二次性徴の異常や早発卵巣不全を起こします。</p>\n<h3>甲状腺</h3>\n<p>頭への照射30 Gy以上では、<strong>中枢性甲状腺機能低下症</strong>の可能性が高くなります。首への照射は、原発性の機能低下症、亢進症、そして<strong>甲状腺がん</strong>のリスクになります。甲状腺がんのリスクは、<strong>30 Gyまでは線量とともに上がり、それを超えると下がります</strong>（細胞が死んでしまうため）。甲状腺の章の第15話で見た、照射後の甲状腺のしこりです。症状がなくても、TSH・FT4・サイログロブリンと超音波で定期的に見ます。</p>\n<h3>代謝と骨</h3>\n<p>頭への照射が<strong>18 Gy以上でメタボリックシンドローム、20 Gy以上で肥満、50 Gy以上で治療抵抗性の視床下部性肥満</strong>のリスクになります。プラチナ製剤は脂質異常と関係し、造血幹細胞移植のあとは肥満がなくても脂質異常や脂肪肝、耐糖能異常が起きます。</p>\n<p>骨粗鬆症のリスクは、放射線、<strong>メトトレキサート</strong>、ステロイド、造血幹細胞移植、そしてGHDや性腺機能低下症。栄養不足や長い入院による運動・日光の不足も加わります。水と電解質の問題は、ほとんどが<strong>治療の前や治療中</strong>に起きるので、フォロー外来ではそれがきちんとコントロールされているかを確かめます。</p>\n<p>冒頭の男の子は、身長が−2.3 SDまで下がり、GH分泌刺激試験で低反応でした。精巣は4 mLで、LHが少し上がり始めています。「病気が治ったからこそ、これから大きくなる体を、一緒に守っていこう」。次の回は、彼のGH治療をどう始めるかの話です。</p>", "keys": ["CCSの60〜90%以上に晩期合併症、最多は内分泌（40〜60%）", "放射線感受性はGH＞LH/FSH＞ACTH＞TSH。GHDは18 Gy以上、一度正常でも経年で発症", "頭蓋照射18 Gy以上で思春期早発症、30 Gy以上で性腺機能低下症", "アルキル化薬・精巣照射は胚細胞とSertoli細胞を障害、Leydig細胞は比較的保たれる", "甲状腺がんは30 Gyまで上昇。代謝は18 Gyメタボ・20 Gy肥満・50 Gy視床下部性肥満"], "upd": null, "quiz": [{"v": "", "q": "頭蓋照射後の下垂体前葉ホルモン分泌障害で、最も放射線感受性が高いのは。", "o": ["TSH", "ゴナドトロピン", "GH", "ACTH"], "a": 2, "e": "GHは最も放射線感受性が高く、その他のホルモンがこれに続く（図2：GH、LH/FSH、ACTH、TSHの順に機能正常の確率が低下）。各分泌不全の発症率は照射線量と経過時間に応じて増加する。GHDのリスクは照射線量18 Gy以上で高くなるが、低線量でも経年的に発症率が上昇するため、一度GH分泌刺激試験に正常な反応を示したとしてもGH分泌能が維持されているとは限らない。", "r": "小児内分泌学 p.633, 図2"}, {"v": "", "q": "頭部放射線治療による中枢性の性腺障害について正しいのは。", "o": ["線量にかかわらず中枢性性腺機能低下症のみを生じ、思春期早発は起こらない", "18 Gy以上で思春期早発症、30 Gy以上で性腺機能低下症のリスクが高い", "30 Gy以上で思春期早発症、50 Gy以上で性腺機能低下症のリスクが高い", "思春期早発症は一過性で、永続性の性腺機能低下症に移行することはない"], "a": 1, "e": "ゴナドトロピンの分泌異常は分泌不全だけでなく分泌亢進をきたしうる点で特徴的。高用量放射線治療には一過性の中枢性思春期早発症の後に永続性の性腺機能低下症を生じることがあり注意が必要。性腺障害のリスクは性別、年齢、放射線治療の照射線量・照射部位・分割数、化学療法の種類・投与量によって異なる。", "r": "小児内分泌学 p.633"}, {"v": "", "q": "精巣に対する局所照射や化学療法（アルキル化薬）の影響として正しいのは。", "o": ["Leydig細胞が最も障害されやすく、テストステロン低下が先行する", "胚細胞やSertoli細胞は障害されやすく、Leydig細胞は比較的保たれる", "胚細胞は放射線に抵抗性で、アルキル化薬のみが造精機能を障害する", "精巣容積は保たれるため、超音波や精液検査による評価は不要である"], "a": 1, "e": "精巣容積が小さいにもかかわらず中枢性思春期早発症をきたす場合や、二次性徴が正常に発現しても精巣発育や造精機能が著しく障害されている場合がある。卵巣は腹部・骨盤への放射線照射や化学療法（アルキル化薬など）によって障害され、顆粒膜細胞のエストロゲン産生が低下し卵子数が減少することで、二次性徴の異常や早発閉経不全を呈する。", "r": "小児内分泌学 p.633-634"}]}, {"id": "m16", "lv": 3, "t": "小児がん経験者の補充療法", "min": 6, "cats": "小児がん経験者（総説）", "src": "小児内分泌学 p.632-634 ／ 治療 p.282-285", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>この章の第1話の、頭蓋咽頭腫の男の子。16歳になりました。ヒドロコルチゾン、LT4、DDAVPを毎日飲み、GHの注射も続けています。今日は、修学旅行の前の相談です。「もし旅行中に熱が出たら、どうすればいい？」</div><p>この章の最後は、がんや腫瘍の治療のあとの<strong>補充療法</strong>です。第2話で見た原則を、長い人生の中でどう使っていくかを確かめます。</p>\n<h3>GH治療：始める時期と量</h3>\n<p>GHやIGF-1には細胞を増やす働きがあるので、腫瘍への影響を完全には否定できません。そのため、原則として<strong>原疾患の治療が終わってから1年以上</strong>たってから始めます。ただ、その間にもGHDの症状が進むことがあるので、可否と時期は一人ひとり判断します。</p>\n<p>がんの再発のリスクについては、<strong>がんが出やすい基礎疾患をもつ人以外では、上がるという証拠は否定的</strong>とされています。治療中にIGF-1が高すぎるときは、二次がんへの懸念から量を減らします。成人のGHDでは3 μg/kg/日から始めます。</p>\n<p>全脳全脊髄照射や全身照射で<strong>脊椎</strong>が照射野に入っていると、椎体の成長が止まり、体幹が短くなったり側弯・後弯になったりします。この場合、GH治療をしても思ったほど背が伸びないことがあります。前の回の男の子は、まさにこれに当たります。</p>\n<h3>ヒドロコルチゾン：毎日の量と、いざというとき</h3>\n<p>中枢性の副腎不全では、<strong>ミネラルコルチコイドの補充は要りません</strong>。レニン・アンジオテンシン系は保たれているからです。頭への照射30 Gy以上で起きやすいですが、低い線量や化学療法だけでも起きることがあります。症状はだるさ、疲れやすさ、病気からの回復の遅れ、食欲低下、低Na、低血圧と、はっきりしないことが多いです。</p>\n<div class=\"formula\">維持量：乳児期 9〜12 mg/m²/日、幼児期以降 6〜9 mg/m²/日（分2〜3、朝は起床直後）<br>中等度ストレス（発熱38.5℃超、嘔吐・下痢、歯科処置、小手術、マラソン）：25〜75 mg/m²/日<br>緊急時の筋注：乳幼児 25 mg、学童 50 mg、中学生以上 100 mg</div>\n<p>2020年4月から、<strong>ヒドロコルチゾンの在宅自己注射</strong>が保険で使えるようになりました。副腎の章の第5話で見たシックデイの備えが、旅行先でもできるようになったのです。</p>\n<p>吸収には個人差があり、飲み薬がうまく効いていないように見える子もいます。全身の状態、成長曲線、血圧、電解質や血糖を見て調整します。手術のときは、執刀時にヒドロコルチゾン25〜50 mg/m²を静注し、残りを6〜8時間ごとに。大量の期間が10日以内なら、減らすときに漸減は要りません。</p>\n<p>もう一つ。副腎腫瘍の摘出後や、ステロイドを長く使ったあとは、ACTHが抑えられて副腎皮質が萎縮しているので、回復までは<strong>原発性の副腎不全のような状態</strong>になります。この場合は、両方の補充が必要なことがあります。</p>\n<h3>LT4：少なめから、FT4で</h3>\n<p>中枢性甲状腺機能低下症には、原発性より少なめの<strong>25 μg/m²/日</strong>（0.7〜1.0 μg/kg/日）から始め、<strong>FT4</strong>で調節します。TSHは指標にならず、補充が足りていれば低くなります。そして、<strong>副腎不全が疑われたら、ステロイドを先に</strong>。この章で三度目です。</p>\n<h3>ずっと続く外来</h3>\n<p>この章の第1話で、成長曲線の変化が腫瘍を見つけました。治療のあとも、成長曲線は大事な窓です。背、思春期、甲状腺、副腎、水、骨、代謝。一つひとつは小さな補充でも、それが積み重なって、子どもたちの毎日の生活を支えています。</p>\n<p>16歳の彼には、こう答えました。「熱が38.5℃を超えたら、ヒドロコルチゾンをいつもの3倍に。吐いて飲めなかったら、この自己注射を太ももに打って、すぐ病院へ。先生たちに見せるカードも持っていこう」。彼は注射の練習を一回やってみて、「思ったより簡単やん」と笑いました。7年前、成長曲線のSDが下がり始めていた男の子は、もうすぐ大人の外来へ移っていきます。</p>", "keys": ["CCSのGH治療は原疾患治療終了後1年以上が原則。高リスク基礎疾患以外で再発リスク上昇は否定的", "脊椎照射後は体幹短縮でGHの効果が限られる。IGF-1高値なら減量", "中枢性副腎不全はミネラルコルチコイド不要。維持6〜9 mg/m²/日、中等度ストレスで25〜75 mg/m²/日", "緊急筋注は乳幼児25・学童50・中学生以上100 mg。2020年から在宅自己注射が保険適用", "中枢性甲状腺機能低下はLT4 25 μg/m²/日からFT4で調節。ステロイドを先に"], "upd": null, "quiz": [{"v": "", "q": "CCSに対するGH治療で本書が示す開始時期・投与量の原則は。", "o": ["二次がんリスクのため、成人期のGH補充は行わず小児期のみ投与", "IGF-Iは測定不要で、体重のみで投与量を調整し年1回評価する", "原疾患治療終了後1年以上経ってから。成人GHDは3 μg/kg/日から", "診断後ただちに成人量で開始し、IGF-Iは測定せず身長で調整する"], "a": 2, "e": "GHおよびIGF-Iの細胞増殖作用の腫瘍への影響が完全に否定できないこと、残存病変の可能性、がん治療に伴う発がんリスクなどを考慮。この間にもGHDの症状が進行する場合があるためGH治療の可否・開始時期は個別の判断が必要。TBIや全脳全脊髄照射で照射野に脊椎が含まれると椎体の成長が障害され体幹部の短縮、脊椎側彎・後彎の原因となり、GH治療を行っても想定していたほどの身長獲得が得られないことがある。二次がんへの懸念から治療中のIGF-I値が異常高値となる場合には投与量の減量が推奨。", "r": "治療 p.282-284"}, {"v": "", "q": "CCSのACTH分泌不全症に対するヒドロコルチゾン維持療法の処方例とストレス時の目安（表5）は。", "o": ["ストレス時は経口のみで対応し、静注は副腎クリーゼ発症後に限る", "生理的分泌量以上で分2〜3、中等度ストレスで2〜3倍、重度で静注", "維持量は20 mg/m²/日で、ストレス時は一律倍量とし静注はしない", "軽度ストレスでも必ず3倍に増量して1週間継続し、以後漸減する"], "a": 1, "e": "乳児期9〜12 mg/m²/日、幼児期以降6〜9 mg/m²/日。中等度（マラソン、発熱>38.5℃、嘔吐・下痢、歯科処置、小手術）は25〜75 mg/m²/日。朝分は起床直後・朝食前の内服が望ましい。経口投与時のヒドロコルチゾン吸収効率は良好とされるが実際には吸収率が悪いと考えられる症例が存在するため全身状態・成長曲線・血圧・検査所見（電解質、血糖値）を参考に調整。内服困難や吸収障害が見込まれる場合は経静脈投与。手術の際には執刀時あるいは腫瘍摘出時にヒドロコルチゾン25〜50 mg/m²/回をボーラス投与した後、残量を6〜8時間ごとに分割投与あるいは24時間かけて持続投与、大量投与期間が10日以内であれば投与量の漸減は必要ない。緊急時には乳幼児25 mg、学童50 mg、成人（中学生以上）100 mgを目安に筋注、2020年4月からソル・コーテフ注・武田テバの在宅自己注射が保険収載。", "r": "治療 p.284-285, 表5"}, {"v": "", "q": "CCSの中枢性甲状腺機能低下症に対するLT₄補充について本書が示すのは。", "o": ["原発性より少量の25 μg/m²/日から、FT₄を指標。副腎不全疑いは先に補充", "原発性と同量の初期量で開始し、TSHを指標に基準範囲内へ調整する", "TSH 1 μU/mL以上なら補充は十分と判断し、FT₄は測定不要とする", "甲状腺ホルモンを先に補充してから副腎機能を評価し、必要ならヒドロコルチゾン"], "a": 0, "e": "0.7〜1.0 μg/kg/日相当。TSHは治療指標とならず、補充が適切なら低値を示す。甲状腺ホルモンはグルココルチコイドのクリアランスを促進し副腎不全を惹起する可能性がある。原発性の初期投与量は生後6〜12か月6〜8 μg/kg/日、1〜5歳5〜7、6〜12歳3〜5、13〜18歳2〜4、成人1〜2 μg/kg/日（チラーヂンS散・錠、分1朝食前）。TSH 1 μU/mL以上では補充量が不十分である可能性も指摘され、血清TSH値は低値から感度未満を目指す。甲状腺中毒症はBasedow病などの機能亢進症を伴うものと濾胞細胞の破壊によるものに分けられ、がん診断後30年までに亢進症と診断されたCCSの割合は放射線治療を受けた患者の2.5%。", "r": "治療 p.285"}]}];
const DM = [{"id": "d1", "lv": 1, "t": "1型糖尿病を診断する", "min": 6, "cats": "1型糖尿病・2型糖尿病", "src": "p.469 ／ 小児内分泌学 p.525-527 ／ 治療 p.215-216, 1250-1251", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>9歳、30 kgの男の子。この1か月、夜中に何度もトイレに起き、水筒を1日に3本空けるようになりました。体重は2 kg減っています。随時血糖は412 mg/dL、尿ケトン2+。まだ歩いて外来に来られています。</div><p>最後の章は、小児内分泌の外来で最も多くの時間を占める三つの領域、<strong>糖尿病・肥満・低血糖</strong>です。ほかの章より少し長くなりますが、毎日の診療にいちばん直結する章でもあります。まずは1型糖尿病の診断から。</p>\n<h3>膵β細胞が壊れる病気</h3>\n<p>1型糖尿病は、自己免疫などで<strong>膵β細胞が壊れ</strong>、インスリンが出なくなる病気です。診断されたときには、β細胞の<strong>70〜80%ほどがすでに壊れている</strong>と考えられています。多飲・多尿・体重減少は、残りのβ細胞が力尽きかけているサインです。</p>\n<h3>自己抗体：陽性なら強い根拠、陰性でも否定できない</h3>\n<p>膵島関連の自己抗体には、<strong>GAD抗体、IA-2抗体、インスリン自己抗体（IAA）、ZnT8抗体、ICA</strong>があります。急性発症の1型では<strong>70〜90%</strong>で陽性です。</p>\n<p>陰性でも1型は否定できません（特発性に分類されます）。ただ、<strong>抗体が陰性のインスリン分泌不全</strong>を見たら、第13話の<strong>単一遺伝子性糖尿病</strong>を考えるきっかけにもなります。</p>\n<h3>日本人のHLA</h3>\n<p>1型糖尿病のなりやすさにはHLAが関わります。日本人の小児で感受性のハプロタイプは<strong>DRB1*0405-DQB1*0401</strong>と<strong>DRB1*0901-DQB1*0303</strong>、抵抗性は<strong>DRB1*1502-DQB1*0601</strong>と<strong>DRB1*1501-DQB1*0602</strong>です。欧米でよく知られるDR3/DR4とは違う、日本人に特有の組み合わせがあり、欧米のデータをそのまま当てはめられません。</p>\n<h3>インスリンがどれだけ残っているか</h3>\n<p>インスリン分泌不全の判断には、<strong>Cペプチド</strong>を使います。</p>\n<div class=\"formula\">空腹時Cペプチド &lt; 0.6 ng/mL ／ 24時間尿中Cペプチド &lt; 20 μg ／ グルカゴン負荷頂値 &lt; 1.0 ng/mL</div>\n<h3>三つの発症様式</h3>\n<ul>\n<li><strong>急性発症</strong>：冒頭の子のように、数週から数か月の症状で見つかる典型的な形。</li>\n<li><strong>劇症</strong>：症状が出てから<strong>おおむね1週間以内</strong>にケトーシス・ケトアシドーシスに陥ります。初診時の血糖が288 mg/dL以上なのに<strong>HbA1cは8.7%未満</strong>。血糖が高いのにHbA1cが低いという<strong>不一致</strong>が、発症がとても急だったことを物語ります。Cペプチドはほぼ枯渇しています。前章の第14話で見た、免疫チェックポイント阻害薬による糖尿病もこの形をとることがあります。</li>\n<li><strong>緩徐進行</strong>（SPIDDM）：GAD抗体などが陽性なのに、<strong>発症後3か月以上インスリンを要さない</strong>。診断から数年はインスリン分泌が保たれることが多く、肥満のない2型糖尿病との区別が難しいことがあります。緩徐進行型の診断に使う抗体は<strong>GAD抗体とICA</strong>だけです。</li>\n</ul>\n<h3>予後は変わってきた</h3>\n<p>日本の1型糖尿病の標準化死亡比は、1965〜69年診断群の15.7から、1975〜79年診断群の6.9へと下がり、その後も改善しています。インスリンの製剤、ポンプ、CGMの進歩が、子どもたちの人生を変えてきました。</p>\n<p>冒頭の男の子はGAD抗体が陽性、HbA1cは11.2%でした。尿ケトンは出ていますが、血液ガスはpH 7.34で、まだアシドーシスには至っていません。「今日から入院して、インスリンを始めよう」。次の回は、間に合わずにアシドーシスに陥った子の話です。</p>", "keys": ["1型はβ細胞の破壊。診断時に70〜80%が破壊されている", "膵島関連自己抗体（GAD・IA-2・IAA・ZnT8・ICA）は急性発症で70〜90%陽性。陰性でも否定できない", "日本人小児の感受性HLA：DRB1*0405-DQB1*0401、DRB1*0901-DQB1*0303", "劇症：症状から約1週間でケトアシドーシス、血糖288以上でHbA1c 8.7%未満", "緩徐進行型：抗体陽性で3か月以上インスリン不要。GAD抗体とICAで診断"], "upd": null, "quiz": [{"v": "", "q": "1型糖尿病でGADなど膵島関連自己抗体が陽性となる割合は。", "o": ["70〜90%", "ほぼ100%", "30%程度", "10%未満"], "a": 0, "e": "陰性でも1型を否定できない（特発性に分類される）。逆に、抗体が陰性のインスリン分泌不全では単一遺伝子性糖尿病を考える。", "r": "治療 p.1251"}, {"v": "", "q": "劇症1型糖尿病の診断基準（2012）で必須とされるのは。", "o": ["糖尿病症状発現後おおむね1週間以内にケトーシスあるいはケトアシドーシスに陥る", "発症後3か月以内にケトーシスに陥ること", "膵島関連自己抗体が陽性であること", "膵酵素（アミラーゼ・リパーゼ）が上昇し、膵島関連自己抗体が陽性であること"], "a": 0, "e": "初診時の血糖が288 mg/dL以上かつHbA1c 8.7%未満、尿中C-ペプチド20 μg/日未満または血中C-ペプチド0.5 ng/mL未満も基準に入る。血糖が高いのにHbA1cが低い、という不一致が核心。", "r": "小児内分泌学 p.527 / 治療 p.1250"}, {"v": "", "q": "緩徐進行1型糖尿病（SPIDDM）の診断で重要なのは。", "o": ["GAD抗体などの膵島関連自己抗体が陽性で、発症後3か月以上インスリン療法を要さないこと", "発症時からケトーシスがあり、インスリンを要すること", "膵島関連自己抗体が陰性で、インスリン分泌が緩やかに低下し、発症3か月以内にインスリンを要すること", "肥満を伴い、インスリン抵抗性が主体であること"], "a": 0, "e": "抗体陽性と分かった時点でインスリンが開始されることがあるが、この基準では経過を見る。抗体は経過とともに陰性化することもある。", "r": "表5 p.469"}]}, {"id": "d2", "lv": 1, "t": "DKA：最初の1時間", "min": 6, "cats": "糖尿病性ケトアシドーシス", "src": "p.467-469 ／ 小児内分泌学 p.127, 138-140 ／ 治療 p.216, 1251-1252", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>5歳、16 kg。数日前から元気がなく、今朝は呼びかけへの反応が鈍い。発症前は18 kgでした。血糖678 mg/dL、静脈血pH 7.10、HCO₃⁻ 8.8、Na 128、K 5.8。救急の先生が言います。「インスリン、すぐ静注しますか？」</div><p>糖尿病性ケトアシドーシス（DKA）は、小児糖尿病で最も命に関わる状態です。そして、<strong>急いで治そうとすることが危ない</strong>という、直感に反する原則をもつ病態でもあります。今日は最初の1時間です。</p>\n<h3>何が起きているか</h3>\n<p>インスリンが足りないうえに、ストレスで<strong>グルカゴン、コルチゾール、カテコラミン、GH</strong>という抗インスリンホルモンが上がります。ブドウ糖は使えず、糖新生とグリコーゲン分解が進んで高血糖に。脂肪は分解されて<strong>ケトン体</strong>が増え、アシドーシスになります。高血糖による浸透圧利尿で脱水も進みます。子どもは体重のわりに体表面積が大きく、脱水とアシドーシスが重くなりやすいのです。</p>\n<p>インスリンを持続投与している子でも、強いストレスがあればDKAは起こりえます。</p>\n<h3>診断</h3>\n<div class=\"formula\">血糖 &gt; 200 mg/dL ＋ 静脈 pH &lt; 7.3 または HCO₃⁻ &lt; 15 mmol/L ＋ ケトーシス（βOHB ≥ 3 mmol/L またはケトン尿）</div>\n<p>重症度はpHで分けます（軽症 &lt;7.3、中等症 &lt;7.2、重症 &lt;7.1）。食事がとれていないと、血糖が300 mg/dLより低いこともあります。<strong>血糖だけでDKAを否定しない</strong>ことです。</p>\n<h3>最初は「水」、インスリンはあと</h3>\n<p>まずPALSに沿ってABCDEを評価します。</p>\n<ul>\n<li><strong>ショックがあれば</strong>：生理食塩水10〜20 mL/kgを急速に。評価しながら繰り返します。</li>\n<li><strong>ショックがなければ</strong>：生理食塩水10〜20 mL/kgを<strong>1時間ほどかけて</strong>。そのあと0.45〜0.9%食塩水で欠乏分を<strong>48時間かけて</strong>補います。</li>\n</ul>\n<p>そして、インスリンは<strong>輸液を始めて1〜2時間たってから</strong>始めます。</p>\n<div class=\"formula\">速効型インスリン 0.05〜0.1 単位/kg/時 の持続静注（ワンショット静注はしない）</div>\n<p>ワンショットの静注は、血糖と浸透圧を急に下げ、<strong>脳浮腫</strong>のリスクになるので推奨されません。急いで下げることが目的ではなく、<strong>ゆっくり安全に下げる</strong>ことが目的です。</p>\n<h3>重炭酸は使わない</h3>\n<p>pHが7.10でも、重炭酸（メイロン）は原則使いません。ISPADのガイドラインもそうです。重炭酸を入れると、そのぶんNaが入る。そしてCO₂は血液脳関門を自由に通るので、<strong>脳の中のアシドーシスを逆に悪化させる</strong>ことがあります。低Kも進め、ケトン体の代謝も遅らせます。pH &lt;6.9など、ごく例外的な場面に限られます。</p>\n<h3>重症DKAで失っているもの</h3>\n<div class=\"formula\">水 100 mL/kg、Na 6、K 4、Cl 4、P 3 mEq/kg</div>\n<p>補充は「維持量＋喪失量の1/2」で計画を立てるという考え方が示されています。リンの喪失も無視できません。</p>\n<p>冒頭の救急の先生には、こう答えました。「インスリンは1時間待ちましょう。まず生理食塩水を1時間かけて入れて、そのあと0.05単位/kg/時で始めます」。次の回は、そこから先の数時間、ブドウ糖とKと、脳浮腫の見張り方です。</p>", "keys": ["DKAはインスリン欠乏＋抗インスリンホルモン（グルカゴン・コルチゾール・カテコラミン・GH）", "診断：血糖＞200、pH＜7.3またはHCO₃⁻＜15、ケトーシス。血糖だけで否定しない", "初期輸液：ショックなら生食10〜20 mL/kg急速、非ショックは1時間かけて、欠乏分は48時間で", "インスリンは輸液開始1〜2時間後から0.05〜0.1単位/kg/時。ワンショット静注はしない", "重炭酸は原則使わない（Na負荷・脳内アシドーシス逆説的悪化）"], "upd": null, "quiz": [{"v": "", "q": "DKAの診断基準として示されているのは。", "o": ["血糖>200 mg/dL、静脈pH<7.3または重炭酸<15 mmol/L、ケトーシス（血中βヒドロキシ酪酸≥3 mmol/Lまたはケトン尿）", "血糖>400 mg/dL、pH<7.0、ケトン尿のみ", "血糖>300 mg/dL、重炭酸<10 mmol/L、意識障害、ケトン尿の4項目をすべて満たす", "血糖値は問わず、pH<7.2のみ"], "a": 0, "e": "重症度はpHで分ける（軽症<7.3、中等症<7.2、重症<7.1）。死亡率は0.15〜0.3%で、その多くが脳浮腫による。", "r": "小児内分泌学 p.138"}, {"v": "", "q": "DKAの初期輸液として正しいのは。", "o": ["ショック時は生理食塩液10〜20 mL/kg、非ショックの脱水は10 mL/kgを1時間", "全例で生理食塩液20 mL/kgを30分で急速投与し、その後5%ブドウ糖液に切り替え", "ショック時は生理食塩液40 mL/kgを1時間、非ショックは3%食塩水を12時間かけて", "乳酸リンゲル液10 mL/kgを2時間、その後0.2%食塩水で72時間かけて補正"], "a": 0, "e": "必要に応じて複数回施行。診断直後に速効型インスリン投与を行うのではなく、輸液を1〜2時間行い循環血流を増加させた後に0.05〜0.1単位/kg/時の投与速度で持続注入を行う。ワンショットの投与は脳浮腫発生リスクとなるため行わない。血糖が250〜300 mg/dLとなったらブドウ糖を添加し、血糖300 mg/dL以上でも降下速度が90 mg/dLを上回るようであれば早期にブドウ糖を添加。低K血症が出現した場合は急速輸液中の場合は20 mmol/Lで添加、インスリン開始後は血清Kをみながら40 mmol/Lまで増量。", "r": "治療 p.216, 図1"}, {"v": "5歳男子、16 kg。意識混濁、約10%の脱水（発症前18 kg）。血糖678 mg/dL、β-ヒドロキシ酪酸5,686 mmol/L、Na 128、K 5.8、Cl 96 mEq/L、HCO₃⁻ 8.8 mEq/L、静脈血ガスpH 7.10、尿糖3+、尿ケトン3+。", "q": "最も適切な初期対応は。", "o": ["炭酸水素ナトリウムでpH 7.20まで補正したうえで、インスリン0.1単位/kg/時の持続静注を開始", "生理食塩液60 mL/kgを2時間で急速投与し、血糖300 mg/dL未満になるまでインスリンは待機する", "生理食塩液10〜20 mL/kgを1時間以上かけ、1時間後にインスリン0.05〜0.1単位/kg/時を開始", "レギュラーインスリン0.1単位/kgを静注し、同時に5%ブドウ糖加維持液20 mL/kgを1時間で開始"], "a": 2, "e": "処方例：生理食塩液10〜20 mL/kg 1時間以上→1時間後にヒューマリンRまたはノボリンR 0.05〜0.1単位/kg/時で開始。以降は図1に従い輸液・インスリンを変更。炭酸水素Naは原則用いない。", "r": "治療 処方例 p.216"}]}, {"id": "d3", "lv": 2, "t": "DKA：ブドウ糖、K、脳浮腫", "min": 6, "cats": "糖尿病性ケトアシドーシス", "src": "p.469 ／ 小児内分泌学 p.128-129, 139-141 ／ 治療 p.216, 237-238, 1252, 1273", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>前の回の5歳の子。インスリンを始めて3時間、血糖は678から290まで下がりました。pHはまだ7.18。看護師さんが聞きます。「血糖が下がってきたので、インスリン止めますか？」</div><p>DKAの治療で、最初の山を越えたあとに来る判断です。血糖が下がっても、ケトアシドーシスはまだ終わっていません。</p>\n<h3>血糖が下がったら、糖を足す</h3>\n<p>インスリンを止めるのではなく、<strong>ブドウ糖を足して、インスリンは続けます</strong>。インスリンが必要なのは、血糖を下げるためだけでなく、<strong>ケトン体を消すため</strong>だからです。</p>\n<div class=\"formula\">ブドウ糖を足す目安：血糖 ≤ 250〜300 mg/dL、または低下速度 &gt; 90 mg/dL/時</div>\n<p>0.45%か0.9%の食塩水に5〜12%のブドウ糖を加えます。細胞が生きるのに必要な糖を入れながら、インスリンでケトーシスの改善を待つ。これが「血糖だけで止めない」の意味です。</p>\n<h3>Kは「入れてから」下がる</h3>\n<p>冒頭の子は来院時のKが5.8と高めでした。でも体の中のKは失われています。アシドーシスが補正され、インスリンが入ると、<strong>Kは細胞の中へ戻り、急に下がります</strong>。</p>\n<p>だからKは、<strong>治療前の値にかかわらず、尿が出ていてインスリンを始めたら補充</strong>します。初期輸液中に低Kなら20 mmol/L、インスリン開始後は血清Kを見ながら<strong>40 mmol/L</strong>まで。心電図でT波も見ます。リンも細胞内に移り、尿に失われます。1 mg/dL未満なら補充を考え、K製剤の半分をリン酸Kにする方法もあります。</p>\n<h3>脳浮腫：いちばん怖い合併症</h3>\n<p>DKAの死亡率は0.15〜0.3%で、その多くが<strong>脳浮腫</strong>によるものです。脳浮腫はDKAの<strong>0.5〜0.9%</strong>に起き、起きると<strong>死亡率は21〜24%</strong>です。</p>\n<p>原因は一つではありません。脳の低灌流と再灌流障害、ケトン体によるNa-K-Cl共輸送の活性化、血液脳関門の障害が重なると考えられています。だから治療中は、<strong>血漿浸透圧をゆっくり下げる</strong>ことを監視します。</p>\n<div class=\"formula\">血漿浸透圧 ＝ 2 ×（Na＋K）＋ 血糖/18 ＋ BUN/2.8</div>\n<p>血糖が下がると、そのぶん<strong>Naは上がってくるはず</strong>です。測定Naが上がってこない、むしろ下がるのは、水が入りすぎているサイン。Naが上がっていくようにNaの注入量を調整します。水の章の第10〜11話で見た、Naと水の読み方がここで生きます。</p>\n<p>サインを見逃さないこと。<strong>頭痛、血圧上昇、心拍数の低下（20/分以上）、意識レベルの低下、酸素飽和度の低下</strong>。疑ったら<strong>マンニトール0.5〜1 g/kgを15分以上かけて</strong>静注します。3%食塩水も選択肢です。過剰な輸液は避けます。</p>\n<h3>HHS：ケトンのない高血糖</h3>\n<p>高血糖高浸透圧状態（HHS）は、<strong>インスリン分泌は保たれていてケトーシスはない</strong>のに、極端な高血糖（500 mg/dL以上）と高浸透圧（320 mOsm/L以上）、強い脱水と意識障害を起こします。小児2型糖尿病で増えています。発症がゆっくりで、嘔吐や腹痛が目立たず、受診が遅れやすい。</p>\n<p>DKAより<strong>さらにゆっくり</strong>下げます。等張液で循環を戻したら0.45〜0.75%の低張液で浸透圧をゆるやかに。インスリンは<strong>輸液だけで血糖が下がらなくなってから</strong>、0.025〜0.05単位/kg/時。血糖の低下は50〜75 mg/dL/時が目安です。主な死因は循環虚脱で、横紋筋融解や血栓にも注意します。</p>\n<h3>血糖が正常なDKA</h3>\n<p>SGLT2阻害薬を使っている人では、尿糖が出続けるので<strong>血糖が上がらないまま</strong>ケトアシドーシスが進むことがあります（euDKA）。だるさや吐き気があれば、血糖が正常でもケトンを測ります。</p>\n<p>看護師さんには「インスリンはそのまま。点滴に10%ブドウ糖を足して、Kも40にしましょう。Naが上がってくるか、1時間ごとに見てください」と伝えました。12時間後、pHは7.32まで戻り、男の子は「のどかわいた」と言えるようになりました。</p>", "keys": ["血糖≤250〜300（または低下＞90 mg/dL/時）でブドウ糖を足し、インスリンはケトアシドーシス改善まで続ける", "Kは治療前値にかかわらず尿量確保とインスリン開始で補充（最大40 mmol/L）。Pは1未満で考慮", "脳浮腫は0.5〜0.9%、死亡率21〜24%。浸透圧をゆっくり下げ、Naが上がっていくか見る", "脳浮腫のサイン：頭痛・血圧上昇・徐脈・意識低下。マンニトール0.5〜1 g/kg", "HHSはケトーシスなし。さらにゆっくり、インスリンは0.025〜0.05単位/kg/時。SGLT2阻害薬でeuDKA"], "upd": null, "quiz": [{"v": "", "q": "DKAの治療中にブドウ糖を添加する血糖の目安と、インスリンの扱いは。", "o": ["血糖≤300 mg/dL（17 mmol/L）になったらブドウ糖を加え、インスリンはケトアシドーシスが改善するまで続ける", "血糖≤200 mg/dLになったらインスリンを中止し、ブドウ糖を加えてケトンの消失を待つ", "血糖≤100 mg/dLでブドウ糖を加える", "血糖にかかわらず、輸液開始6時間後にブドウ糖を加える"], "a": 0, "e": "血糖低下が速すぎるときも添加する。インスリンはケトン体を消すために必要で、血糖だけで止めない。0.45%食塩水への切り替えも浸透圧低下を防ぐ目的で考慮する。", "r": "小児内分泌学 p.139-140"}, {"v": "", "q": "DKA治療中の脳浮腫について正しいのは。", "o": ["0.5〜0.9%に発症し死亡率21〜24%", "5〜10%に発症し死亡率5%。グリセオールを1時間かけて静注", "0.1%未満の発症で、デキサメタゾンの静注が第一選択", "20%に発症するが死亡率は1%未満で、輸液速度を上げて治療"], "a": 0, "e": "頭痛、血圧上昇、心拍数低下（20 bpm/分以上）、意識レベル低下などが現れたらマンニトール0.5〜1 g/kgを15分以上かけて静注。必要に応じて最低30分あけて同量を再度投与する。治療は正常血圧を保つよう輸液量を調整し過剰輸液を避ける。脳浮腫の徴候は頭痛、血圧上昇、心拍数の低下、意識レベルの低下、酸素飽和度の低下など。3%食塩水も治療選択肢。処方例：5歳男子16 kg、意識混濁、約10%脱水（発症前18 kg）、血糖678 mg/dL、3ヒドロキシ酪酸5,686 mmol/L、Na 128、K 5.8、Cl 96、HCO₃⁻ 8.8、pH 7.10 → 生理食塩液10〜20 mL/kgを1時間以上、1時間以上後にヒューマリン®R注またはノボリン®R注0.05〜0.1単位/kg/時で開始。", "r": "治療 p.216"}, {"v": "", "q": "高血糖高浸透圧状態（HHS）の輸液とインスリンについて、DKAと異なる点は。", "o": ["等張液で循環血漿量を回復したあと0.45〜0.75%の低張液で浸透圧を緩やかに下げ、インスリンは輸液だけで血糖低下が得られなくなってから0.025〜0.05単位/kg/時で始める", "DKAと同じく輸液と同時にインスリン0.1単位/kg/時を開始する", "低張液は用いず、生理食塩水のみで治療する", "インスリンは不要で、輸液のみで治療する"], "a": 0, "e": "HHSは発症が緩徐で嘔吐・腹痛が目立たず、受診が遅れやすい。脱水が高度でNa補正に注意する。血糖の低下は50〜75 mg/dL/時を目安に。", "r": "小児内分泌学 p.141"}]}, {"id": "d4", "lv": 1, "t": "インスリンの道具箱", "min": 6, "cats": "インスリン製剤・ポンプ・CGM・1型糖尿病", "src": "p.463 ／ 治療 p.218, 表1", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>第1話の9歳の男の子。点滴のインスリンから皮下注に切り替える日です。お母さんは、ペンが2本あることに戸惑っています。「どっちがどっちで、何のために打つんですか？」</div><p>1型糖尿病の治療は、体が本来しているインスリンの出し方を、外から再現することです。今日はその道具、インスリン製剤と、量の決め方です。</p>\n<h3>二つの出し方を真似する</h3>\n<p>健康な膵臓は、インスリンを二つの形で出しています。</p>\n<ul>\n<li><strong>基礎分泌</strong>：食べていなくても、一日中少しずつ出ている。肝臓からの糖の放出を抑えている。</li>\n<li><strong>追加分泌</strong>：食事のたびに、さっと出て、さっと消える。</li>\n</ul>\n<p>これを<strong>持効型（基礎）</strong>と<strong>超速効型（追加）</strong>の組み合わせで真似するのが、<strong>基礎-追加インスリンによる頻回注射法（MDI）</strong>です。いちばん生理的に近い方法として推奨されています。</p>\n<h3>製剤の時間を知る</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>種類</th><th>発現</th><th>ピーク</th><th>持続</th></tr>\n<tr><td>超速効型（リスプロ・アスパルト・グルリジン）</td><td>0.15〜0.35時間</td><td>1〜3時間</td><td>3〜5時間</td></tr>\n<tr><td>速効型（R）</td><td>0.5〜1時間</td><td>2〜4時間</td><td>5〜8時間</td></tr>\n<tr><td>中間型（NPH）</td><td>2〜4時間</td><td>4〜12時間</td><td>12〜24時間</td></tr>\n<tr><td>デテミル</td><td>1〜2時間</td><td>4〜7時間</td><td>20〜24時間</td></tr>\n<tr><td>グラルギン（100）</td><td>2〜4時間</td><td>8〜12時間</td><td>22〜24時間</td></tr>\n<tr><td>グラルギン（300）</td><td>2〜6時間</td><td>なし</td><td>30〜36時間</td></tr>\n<tr><td>デグルデク</td><td>0.5〜1.5時間</td><td>なし</td><td>42時間超</td></tr></table></div>\n<p>持効型は、1回で24時間もたないものを1日1回で使うと、<strong>明け方に効果が切れます</strong>。<strong>デテミル</strong>やグラルギン（100）は1日2回が必要になることがあり、グラルギン（300）とデグルデクは平坦で1日1回が原則です。6歳以下に承認があるのはデグルデクだけですが、グラルギンやデテミルも年少児で安全に使えています。</p>\n<h3>新しい超速効型</h3>\n<p>フィアスプ®やルムジェブ®は、添加剤で吸収が速くなった製剤です。<strong>食事開始時（2分以内）</strong>、必要なら食べ始めて20分以内にも打てます。食べる量が読めず、<strong>食後に打つしかない幼児</strong>で役に立ちます。ただ、打ってから食べるまでが空くと低血糖になるので注意します。ふつうの超速効型は、食事の15分前から直前が望ましく、幼児では食べた量を見て食直後に打つこともあります。</p>\n<h3>量の目安</h3>\n<div class=\"formula\">1日総量：前思春期 0.7〜1.0 単位/kg、思春期 1.0〜2.0 単位/kg　うち 30〜50% が基礎</div>\n<p>思春期には、GHや性ホルモンでインスリンが効きにくくなるので、量が増えます。</p>\n<p>お母さんには、こう説明しました。「グレーのペンは『一日中のぶん』、寝る前に1回、10単位。オレンジのペンは『ごはんのぶん』、毎食の前に4〜6単位。おやつのときは2単位。体がもともと出していた二種類のインスリンを、二本のペンで分けて真似しているんです」。トレシーバ®10単位とノボラピッド®4〜6単位。30 kgの彼にとって、1日0.8単位/kgほどの出発です。</p>", "keys": ["基礎分泌は持効型、追加分泌は超速効型で真似る（MDI）", "デテミル・グラルギン（100）は1日2回が必要なことがある。グラルギン（300）・デグルデクは1日1回", "デグルデクは持続42時間超・ピークなし。6歳以下の承認はデグルデクのみ", "新しい超速効型（フィアスプ・ルムジェブ）は食事開始時〜20分以内に投与可", "1日総量は前思春期0.7〜1.0、思春期1.0〜2.0単位/kg、基礎は30〜50%"], "upd": null, "quiz": [{"v": "", "q": "1型糖尿病の総インスリン量の目安と、基礎インスリンの割合は。", "o": ["前思春期0.7〜1.0単位/kg、思春期1.0〜2.0単位/kg。うち30〜50%が基礎インスリン", "前思春期0.3〜0.5単位/kg、思春期0.5〜0.8単位/kg。うち70%が基礎インスリン", "前思春期1.5〜2.0単位/kg、思春期2.5〜3.0単位/kg。うち10〜20%が基礎インスリン", "年齢によらず1.0単位/kg。うち50〜70%が基礎インスリン"], "a": 0, "e": "残りが追加インスリン。処方例：9歳男子30 kg、高血糖症状で急性発症、抗GAD抗体陽性で1型糖尿病の診断 → 基礎インスリン：トレシーバ®注フレックスタッチ®10単位を眠前に皮下注。追加インスリン：ノボラピッド®注フレックスタッチ®毎食前に4〜6単位皮下注、間食時は2単位皮下注。", "r": "治療 p.218"}, {"v": "", "q": "インスリン製剤の作用時間（表1）で、持効型溶解アナログのデグルデクの作用発現と持続時間は。", "o": ["作用発現0.5〜1.5時間、明らかなピークなし、持続42時間超", "作用発現1〜2時間、最大作用4〜7時間、持続20〜24時間", "作用発現2〜6時間、明らかなピークなし、持続30〜36時間", "作用発現2〜4時間、最大作用8〜12時間、持続22〜24時間"], "a": 0, "e": "超速効型アナログ（リスプロ、アスパルト、グルリジン）：0.15〜0.35時間／1〜3時間／3〜5時間。速効型（R）：0.5〜1／2〜4／5〜8時間。中間型（NPH）：2〜4／4〜12／12〜24時間。デテミル：1〜2／4〜7／20〜24時間。グラルギン（100）：2〜4／8〜12／22〜24時間。グラルギン（300）：2〜6／ピークなし／30〜36時間。グラルギン（100単位/mL）は持続時間が24時間であり1日1回注射が原則とされているが個人差があり1日2回注射を必要とすることもある。デグルデク以外は6歳以下への適応の承認が得られていないが、グラルギン、デテミルとも年少例においても安全に使用できる。グラルギン（300単位/mL）とデグルデクは薬物動態がより平坦で、1日1回の注射が原則。", "r": "治療 表1 p.218"}, {"v": "", "q": "持効型溶解アナログ（La）の投与回数について正しいのは。", "o": ["デテミルは持続48時間で2日に1回、グラルギン（300）は吸収が速く1日2回投与が原則", "グラルギン（100）は1日2回を要することがあり、グラルギン（300）・デグルデクは1日1回が原則", "すべてのLaは持続時間が24時間未満のため、小児では年齢を問わず1日2回投与が原則とされる", "デグルデクは持続時間が最も短く、小児では1日3回投与を要することがあり6歳以下で用いる"], "a": 1, "e": "デグルデク以外は6歳以下への適応の承認が得られていないが、グラルギン・デテミルとも年少例でも安全に使用できる。Laはピークが少なくNPHと比べて一定の基礎分泌を補うことができる。", "r": "治療 p.218"}]}, {"id": "d5", "lv": 2, "t": "カーボカウントと責任インスリン", "min": 6, "cats": "インスリン製剤・ポンプ・CGM・1型糖尿病・療養指導", "src": "p.471, 509-511 ／ 治療 p.218-219", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>退院から1か月。9歳の彼の血糖ノートを見ると、昼食前に60台の低血糖が週に3回。夕食のあとは毎日250を超えています。お母さんは「全部の量を少しずつ変えたほうがいいですか？」と聞きます。</div><p>インスリンの量を調整するとき、「全部を少しずつ」動かすと、何が効いたのか分からなくなります。今日は、<strong>どの数字を、どのインスリンで直すか</strong>という考え方と、食事に合わせて量を決める<strong>カーボカウント</strong>です。</p>\n<h3>責任インスリン</h3>\n<p>ある時点の血糖に<strong>いちばん影響しているインスリン</strong>を、その血糖の<strong>責任インスリン</strong>と呼びます。基本的には、<strong>一つ前に打ったインスリン</strong>です。</p>\n<ul>\n<li>昼食前の血糖 ← 朝食前の超速効型</li>\n<li>夕食後の血糖 ← 夕食前の超速効型</li>\n<li>朝食前（早朝）の血糖 ← 基礎インスリン</li>\n</ul>\n<p>同じ時間帯の血糖が<strong>くり返し</strong>目標から外れるとき、その責任インスリンを<strong>1〜2単位</strong>動かします。一回の外れで動かさないのがコツです。</p>\n<h3>食事を数える：カーボ</h3>\n<p>食後の血糖を最も上げるのは、<strong>炭水化物（糖質）</strong>です。その量を数えて、インスリンを合わせるのがカーボカウントです。</p>\n<div class=\"formula\">日本の1カーボ＝炭水化物 10 g（米国では15 gが多い）</div>\n<p>海外の文献を読むときは、この違いで比の値が合わなくなるので注意します。</p>\n<p>二つの段階があります。</p>\n<ul>\n<li><strong>基礎カーボカウント</strong>：毎食の糖質量を<strong>一定</strong>にして、食後血糖を安定させる。まずはここから。</li>\n<li><strong>応用カーボカウント</strong>：食べる量に合わせて、インスリンの量を<strong>変える</strong>。</li>\n</ul>\n<h3>二つの比</h3>\n<p>応用カーボカウントでは、二つの数字を使います。</p>\n<ul>\n<li><strong>インスリン/カーボ比</strong>：1カーボに何単位要るか。成人では1、幼児では0.4〜0.5、乳児では0.1〜0.2が目安。</li>\n<li><strong>インスリン効果値</strong>：1単位で血糖が何mg/dL下がるか。成人では40〜50、幼児では100〜150、乳児では500〜1,000。</li>\n</ul>\n<p>食事のインスリンは、<strong>食前血糖と、超速効型が切れる4〜5時間後の血糖が同じになる</strong>ように合わせます。効果値は、食事の影響がない時間帯の高血糖で実際に補正してみて決めます。どちらも時間帯や季節で変わるので、ときどき見直します。</p>\n<h3>食べてはいけないもの、ではなく</h3>\n<p>エネルギーの目安は<strong>1,000＋年齢×100 kcal/日</strong>。糖尿病だからといって特別に減らすのではなく、育つのに必要な量をしっかりとります。砂糖はでんぷんの20%以内を原則にしますが、お菓子を禁止するのではなく、<strong>食べるときにインスリンを打つ習慣</strong>を教えます。禁止ではなく、運用として設計するのです。</p>\n<p>お母さんには、こう伝えました。「昼前の低血糖は、朝のごはんのインスリンが少し多いから。朝を1単位減らしましょう。夕食後の高いのは、夕食前のインスリンが足りないから。そっちを1単位増やします。ほかは動かさないで、1週間見てみましょう」。1週間後、ノートの数字は、だいぶ落ち着いていました。</p>", "keys": ["責任インスリン＝その血糖に最も影響する一つ前のインスリン。くり返す逸脱で1〜2単位調整", "日本の1カーボは炭水化物10 g（米国15 g）", "基礎カーボカウント（糖質一定）から応用カーボカウント（量に合わせて変える）へ", "インスリン/カーボ比・インスリン効果値：食前と4〜5時間後の血糖が同じになるように", "総エネルギーは1,000＋年齢×100 kcal。お菓子は禁止せずインスリンで運用"], "upd": null, "quiz": [{"v": "", "q": "責任インスリンの考え方として正しいのは。", "o": ["その時点の血糖に一番影響を与えている、基本的に一つ前に注射したインスリン", "基礎インスリンのことで、追加インスリンは責任インスリンには含めない", "直前に食べた食事の糖質量に応じて計算するインスリンで、血糖値には左右されない", "1日の総インスリン量のうち最も単位数の多い時間帯に注射したインスリン"], "a": 0, "e": "同じ時間帯の血糖値が繰り返し目標から逸脱する場合にその責任インスリンを調整する。例として昼食前に低血糖を繰り返し認める場合はその責任インスリンである朝食前のRaを1〜2単位減量する。夕食後に高血糖を繰り返す場合は夕食前のRaを1〜2単位増量する。追加インスリン調整には食事量、特に炭水化物をできるだけ一定にする（基礎カーボカウント）。生理的インスリン分泌に最も近い投与方法である基礎-追加インスリンによる頻回注射法（MDI）が推奨される。", "r": "治療 p.218"}, {"v": "", "q": "カーボカウント法で、一般的な成人の目安とされるインスリン/カーボ比とインスリン効果値は。", "o": ["インスリン/カーボ比1、インスリン効果値40〜50", "インスリン/カーボ比0.4〜0.5、インスリン効果値100〜150", "インスリン/カーボ比0.1〜0.2、インスリン効果値500〜1,000", "インスリン/カーボ比2、インスリン効果値20〜30"], "a": 0, "e": "日本では1カーボを10 gとして計算する。幼児はインスリン/カーボ比0.4〜0.5、インスリン効果値100〜150、乳児ではインスリン/カーボ比0.1〜0.2、インスリン効果値500〜1,000と設定することもある。食事のインスリンは食前血糖と超速効型のインスリン効果が切れる4〜5時間後の血糖が同じになるように調整する。インスリン効果値は高血糖のときに食事の影響がない時間帯をみはからって実際にインスリン投与を行って調整する。インスリン/カーボ比、インスリン効果値とも日内変動や季節間変動があるため適宜調整する。毎食の糖質量を一定にすることで食後血糖値の安定化を図るのを基礎カーボカウント、毎食での糖質摂取量を変化させた際に追加インスリンなど投薬量を糖質摂取量に応じて変化させる方法を応用カーボカウントという。", "r": "治療 p.219"}, {"v": "", "q": "カーボカウントにおける日本での1カーボの定義は。", "o": ["炭水化物5 g", "炭水化物10 g", "炭水化物15 g", "炭水化物20 g"], "a": 1, "e": "米国では15 gとされることが多い。文献を読むときにこの差を意識しないと、比の値が合わなくなる。", "r": "p.471"}]}, {"id": "d6", "lv": 2, "t": "ポンプとCGM", "min": 6, "cats": "インスリン製剤・ポンプ・CGM・1型糖尿病", "src": "p.463-465 ／ 小児内分泌学 p.530-531 ／ 治療 p.219-221, 224-225", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>3歳、14 kgの女の子。保育園に通っています。昼食とおやつの時間に誰がインスリンを打つのか。そして夜中の低血糖が怖くて、お母さんは毎晩2時に起きて指先から血を採っています。</div><p>小さな子の1型糖尿病は、家族の生活をまるごと変えます。今日は、それを少しでも軽くする二つの道具、<strong>インスリンポンプ（CSII）</strong>と<strong>持続グルコースモニタリング（CGM）</strong>です。</p>\n<h3>CSII：基礎を時間ごとに変えられる</h3>\n<p>CSIIは、超速効型インスリンを皮下に<strong>持続的に</strong>入れる方法です。皮下注では一定に入れられない基礎インスリンを、<strong>時間ごとに細かく調整</strong>できます。</p>\n<p>適応として挙げられているのは、<strong>7歳未満</strong>、低血糖をくり返す、血糖の変動が激しい、HbA1cが目標を上回る、といった子です。保育園や幼稚園の子は、自分で昼食やおやつの注射ができません。注射なら朝にNPHを打って昼をカバーする方法がとられますが、ポンプなら<strong>昼食やおやつの時間だけ基礎を一時的に増やす</strong>ことで対応できます。</p>\n<p>本書は、まず1日4回の皮下注で指導し、家族の受け入れを見てからCSIIへ進む、という順序を示しています。</p>\n<h3>ポンプの弱点：止まると速い</h3>\n<p>ポンプは超速効型しか入っていません。<strong>基礎の注入が数時間止まるだけで、DKAに至る</strong>ことがあります。チューブの詰まりや抜けです。説明のつかない高血糖が出たら、まず注入トラブルを疑って<strong>すぐに注入セットを交換</strong>し、無理ならペンで超速効型を補います。</p>\n<h3>CGM：点ではなく線で見る</h3>\n<p>指先の自己測定は「点」です。下がっている時間帯そのものは見えません。CGMは皮下の間質液のブドウ糖を連続で測り、「線」で見せてくれます。<strong>低血糖の自覚がない子</strong>や、日常的に低血糖にさらされている子で、とくに役に立ちます。</p>\n<p>注意点が一つ。CGMのセンサーグルコース値（SG値）は<strong>間質液</strong>を測っているので、血糖に<strong>10〜15分遅れます</strong>。急に動く場面では、ずれます。インスリンの量を決めるときや、SG値がおかしいと思ったときは、指先で測ります。リブレは4歳以上、G6は2歳以上で較正が要りません。</p>\n<h3>SAP療法と、低血糖の手前で止まる機能</h3>\n<p>ポンプとCGMをつなげたのが<strong>SAP療法</strong>です。SG値が設定した下限（50〜90 mg/dL）に達したとき、あるいは<strong>30分後に達すると予測</strong>されたときに、基礎インスリンを<strong>自動で止めます</strong>（PLGM）。最大2時間止まり、回復すれば再開します。低血糖の回数を約75%減らせたという報告があり、保育園や学校、夜間の低血糖が減って、<strong>保護者の心の負担</strong>も軽くなります。止まったあとの高血糖には注意します。</p>\n<h3>その先へ</h3>\n<p>CGMのデータをもとにアルゴリズムがインスリンの量を自動で調整する<strong>ハイブリッドクローズドループ</strong>（人工膵臓）が実用化されてきました。膵島移植も進んでいますが、移植した細胞は数年しかもたないことも分かっています。</p>\n<p>3歳の女の子は、ミニメド640Gで1日10単位、PLGMを使うことになりました。1か月後、お母さんは言いました。「夜中の2時に起きなくてよくなりました。アラームが鳴らない夜が、こんなにありがたいなんて」。</p>", "keys": ["CSIIは基礎インスリンを時間ごとに調整可能。適応：7歳未満、低血糖反復、変動大、HbA1c高値", "CSIIは注入停止で数時間でDKA。説明のつかない高血糖はまず注入セット交換", "CGMは間質液を測るため血糖に10〜15分遅れる。用量決定時や疑問時は血糖測定", "SAP＋PLGM：下限到達または30分後予測で基礎を自動停止（最大2時間）、低血糖約75%減", "まず1日4回皮下注で指導し、家族の受け入れを見てCSIIへ"], "upd": null, "quiz": [{"v": "", "q": "CSII（持続皮下インスリン注入療法）の適応として述べられているのは。", "o": ["7歳未満、低血糖の反復、血糖変動が激しい、HbA1cが目標を上回る症例など", "成人例のみで、HbA1cが目標値以下に安定し自己管理が確立している症例に限る", "緩徐進行型1型糖尿病でインスリン分泌が残存し追加インスリン不要の症例", "2型糖尿病でメトホルミン無効のため基礎インスリンを導入した肥満症例"], "a": 0, "e": "CSIIはMDIと比較しより生理的なインスリン投与が可能で、インスリンとしてはRaを使用することが多い。乳幼児は日中保育所・幼稚園で過ごすため昼食時や間食時にインスリン注入が必要になるが自分でボーラスを行うことがむずかしいため、注射では朝にNPHを使用して昼食・間食分をカバーする方法が用いられることが多いが、CSIIでは基礎インスリンを昼食時および間食時に一過性に増量することで対応でき血糖管理もしやすくなる。注意点として基礎インスリンの注入が数時間止まることでケトアシドーシスに至る可能性があり、CSII使用中に説明のつかない高血糖が出現した場合は基礎インスリンの注入トラブルを疑ってすぐに注入セット交換を行う。交換がむずかしい場合はペン型注射器によりRaで補正。", "r": "治療 p.219"}, {"v": "", "q": "SAP療法とPLGM機能について正しいのは。", "o": ["SG値が設定下限値に達する、または30分後に到達が予測されると基礎注入を自動停止", "食事のインスリン注入も含め全自動化された人工膵臓で、手動のボーラス入力は不要", "SG値が高血糖域（250 mg/dL超）に達すると自動で追加インスリンを注入する機能", "CGMとペン型注射器を連動させ、注射量をアプリが指示するシステム"], "a": 0, "e": "低グルコース一時停止はSG値が設定した下限値（50〜90 mg/dLで設定可能）に達すると基礎インスリンの注入を自動で一時的に停止し、SG値が回復するか最大2時間停止した後にインスリン注入は自動で再開される。この機能により低血糖の頻度を減らすことができ、特に保育所・幼稚園や学校での低血糖、夜間の低血糖頻度が減少することで保護者の心理的負担も軽減される。一方、基礎インスリン注入が止まることによりその後高血糖になることもあるため注意が必要。ミニメド620G・640G本体にはSG値などの記録が3か月間保存される。処方例：3歳男子14 kg、高血糖症状、抗GAD抗体陽性 → ミニメド640G、ヒューマログ®注（100単位/mL）1日10単位、ボーラスウィザード、PLGM使用。", "r": "治療 p.220-221"}, {"v": "", "q": "CGMについて正しいのは。", "o": ["ガーディアンコネクトは較正不要だが、リブレは1日2回の較正が必要である", "小児には10歳以上からしか使用できず、乳幼児ではSMBGのみで管理する", "SG値は血糖に10〜15分遅れる。リブレは4歳以上、G6は2歳以上で較正不要", "SG値は血糖と常に一致し、どの機種でも1日2回の血糖測定による較正が必要"], "a": 2, "e": "ガーディアンコネクト（日本メドトロニック）は血液測定によるSG値の較正を必要とする。リブレは専用リーダーまたはアプリ搭載スマートフォンをかざしてSG値を表示する間欠型CGMで、センサーは14日間有効。SG値が現在の血糖を反映しているわけではなくタイムラグがあること、実際の血糖と大幅にずれることもあるため、インスリン投与量を決めたりSG値に疑問があったりする場合などは血糖を測定する。", "r": "治療 p.219-220"}]}, {"id": "d7", "lv": 2, "t": "低血糖・シックデイ・運動", "min": 7, "cats": "療養指導", "src": "p.512 ／ 小児内分泌学 p.532 ／ 治療 p.222-223, 1257-1258", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>9歳の彼は、サッカーチームに戻りたいと言っています。ある日の練習後、ふらついて座り込みました。別の日には、胃腸炎で何も食べられないのに、お母さんがインスリンを打つかどうか迷って電話をくれました。</div><p>1型糖尿病の子が毎日を安全に過ごすための、三つの場面の約束ごとです。低血糖、病気の日（シックデイ）、そして運動。</p>\n<h3>低血糖：軽いうちに、繰り返し確かめる</h3>\n<p>軽い低血糖には、<strong>ブドウ糖10〜15 g</strong>を口から。<strong>10〜15分後にもう一度測り</strong>、上がりが足りなければまた。ブドウ糖は効き目が短いので、状況によっては炭水化物も食べて、再び下がるのを防ぎます。</p>\n<p>意識がない、飲めないときは：</p>\n<div class=\"formula\">在宅：グルカゴン 25 kg以上 1 mg、25 kg未満 0.5 mg（筋注・皮下注）。4歳以上は点鼻（バクスミー®）3 mg<br>医療機関：10%ブドウ糖 2〜3 mL/kg 静注</div>\n<p>保護者には、グルカゴンの使い方を前もって練習してもらいます。</p>\n<h3>シックデイ：インスリンは止めない</h3>\n<p>食べられなくても、病気のストレスで抗インスリンホルモンは上がり、肝臓は糖を出し続けます。だから<strong>インスリンは決して中止しない</strong>。これがシックデイの第一原則です。基礎インスリンは続け、追加インスリンを食事量・血糖・ケトンで調整します。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>状態</th><th>追加の補正インスリン（RaまたはR）</th><th>ポンプ</th></tr>\n<tr><td>高血糖、ケトンなし〜軽度</td><td>1日総量の5〜10%を2〜4時間ごと</td><td>基礎を10〜30%増</td></tr>\n<tr><td>高血糖、ケトン中等度〜重度</td><td>1日総量の10〜20%を2〜4時間ごと</td><td>基礎を20〜50%増</td></tr></table></div>\n<p>受診してほしいのは、①発熱・消化器症状が強い、②24時間ほとんど食べられない、③血糖350 mg/dL以上が続く・ケトンが高い、④意識がおかしい、のとき。頻回に血糖とケトンを測り、病院に連絡して症状を伝えてもらいます。</p>\n<h3>運動：血糖は「いつも」下がるわけではない</h3>\n<p>運動は筋肉のインスリン感受性を上げ、<strong>GLUT4</strong>の働きを高めます。食後の有酸素運動は食後高血糖を抑えます。進んだ合併症がなければ、<strong>すべての運動、部活動に参加できます</strong>。</p>\n<p>ただし、運動で血糖が下がるのは、<strong>インスリンが十分に働いているとき</strong>だけです。インスリンが足りない状態で運動すると、抗インスリンホルモンが勝って<strong>血糖はむしろ上がり、ケトンが増えます</strong>。</p>\n<div class=\"formula\">運動しない：血中ケトン ≥ 1.5 mmol/L、または尿ケトン 2+</div>\n<p>低血糖の予防には：</p>\n<ul>\n<li>運動に当たる時間帯の追加インスリンを<strong>25〜75%減らす</strong></li>\n<li>長い運動では、前日夜と当日の基礎インスリンを30〜50%減らすことも</li>\n<li><strong>ブドウ糖を必ず携帯</strong></li>\n</ul>\n<p>運動の処方は、精神的な負担がなく、いつでもどこでも一人でできて、<strong>週3〜4回続けられる</strong>もの。続かない処方は処方ではありません。</p>\n<p>サッカーの日は、練習前の昼のインスリンを半分にして、ポケットにブドウ糖を3個。胃腸炎の日には、トレシーバ®はそのまま打って、2〜3時間ごとに血糖とケトンを測ってもらいました。翌朝、ケトンは消えていました。</p>", "keys": ["軽症低血糖はブドウ糖10〜15 g、10〜15分後に再検して繰り返す", "重症低血糖：グルカゴン25 kg以上1 mg・未満0.5 mg、点鼻3 mg（4歳以上）、院内は10%ブドウ糖2〜3 mL/kg", "シックデイはインスリンを中止しない。ケトン軽度で総量5〜10%、中等度以上で10〜20%を2〜4時間ごと", "血中ケトン≥1.5または尿ケトン2+では運動しない（血糖はむしろ上がる）", "運動時は責任相の追加インスリンを25〜75%減量、ブドウ糖を携帯"], "upd": null, "quiz": [{"v": "", "q": "重症低血糖の治療として述べられているのは。", "o": ["医療施設では10%ブドウ糖を2〜3 mL/kgの量で静脈内投与", "医療施設では50%ブドウ糖を5 mL/kg静注。在宅ではグルカゴン2 mgを筋注", "医療施設では5%ブドウ糖を10 mL/kg静注。在宅では砂糖水の経口投与のみ", "年齢・体重によらずグルカゴン1 mgを筋注し、点鼻薬は成人のみ"], "a": 0, "e": "在宅では25 kg以上で1 mg、25 kg未満で0.5 mgのグルカゴンを筋注または皮下注。4歳以上では点鼻薬（バクスミー®）も使用可。成人と同量の3 mgを点鼻で投与する。保護者などにグルカゴン注射の方法を指導しておくことが大切。軽症の低血糖では10〜15 gのブドウ糖を経口投与する。状況に応じて短時間しか効力のないブドウ糖に加え炭水化物を摂取させて再度低血糖に陥らないようにする。ブドウ糖の投与を行ってから10〜15分で再度血糖を測定し、血糖上昇が十分でない場合には再度ブドウ糖を投与し、血糖が十分上がるまでブドウ糖投与を繰り返す。", "r": "治療 p.222"}, {"v": "", "q": "1型糖尿病のシックデイで、高血糖だがケトン体が検出されないか軽度のときのインスリン投与法は。", "o": ["1日総インスリン量の5〜10%をRaまたはRで投与し、血糖や症状をみながら同量を2〜4時間ごとに投与", "1日総インスリン量の10〜20%をRaで投与し、2〜4時間ごとに反復。ポンプでは基礎レートを20〜50%増加", "追加インスリンを中止し、基礎インスリンのみ継続", "1日総インスリン量の30%をRで投与し、6時間ごとに反復"], "a": 0, "e": "ポンプでは一時基礎レート機能で2〜4時間以上基礎レートを10〜30%増加。高血糖および中等度〜重度のケトン体を認めるときは1日総インスリン量の10〜20%をRaあるいはRで投与し、血糖や症状をみながら同量のインスリンを2〜4時間ごとに投与、ポンプでは2〜4時間またはそれ以上の間基礎レートを20〜50%増加させる。シックデイではインスリンは中止せず、NPH、Laは継続すること、追加インスリンは食事量、血糖値、ケトン体に応じて調整すること、頻回に血糖値・ケトン体を測定し医療機関に連絡し症状を伝える。①発熱・消化器症状が強い、②24時間にわたって経口摂取ができない・著しく少ない、③血糖値350 mg/dL以上が続く、血中ケトン体が高値、尿中ケトン体が強陽性、④意識状態の悪化がある、に当てはまるときは医療機関を受診するように指導する。", "r": "治療 p.223"}, {"v": "", "q": "1型糖尿病の運動時の低血糖予防として述べられているのは。", "o": ["責任相の追加インスリンをあらかじめ25〜75%減量する", "運動前に追加インスリンを2倍にして運動後の高血糖を防ぐ", "ケトン陽性でも血糖が高値であれば高強度の運動を行ってよい", "運動中は基礎インスリンを完全に中止し、運動後に再開する"], "a": 0, "e": "長時間の運動では前日夜と当日の基礎インスリンを30〜50%減量することを考慮。血中ケトン1.5 mmol/L以上または尿ケトン2+のときは運動を行わない。運動は筋肉のインスリン感受性を亢進し糖輸送体（GLUT4）の活性を増加させる働きがあり、食後の有酸素運動は食後高血糖を抑制し血糖コントロールの改善に有用。進行した合併症を有していない限り特に制限はなく、低血糖の予防と対処法に留意すれば、すべての運動、クラブ活動の参加は可能。運動に際し低血糖時にはすぐに捕食できるようにブドウ糖を常に携帯しておかなければならない。ケトンが上昇していて血糖が高値のときは高強度の運動は避けたほうがよい。", "r": "治療 p.222"}]}, {"id": "d8", "lv": 2, "t": "目標と合併症：数字の向こうにあるもの", "min": 6, "cats": "1型糖尿病・療養指導", "src": "p.459, 463, 471 ／ 治療 p.222-224, 910", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>診断から3年、12歳になった彼のHbA1cは7.8%。「7.5を切れって言われても、もう頑張ってるし」。その言葉に、どう答えればいいでしょうか。</div><p>HbA1cの目標は、何のためにあるのか。今日は、目標値と、それが防ごうとしている合併症、そしてHbA1cという数字の読み方です。</p>\n<h3>目標は少しずつ厳しくなってきた</h3>\n<p>以前は年齢別にゆるい目標がありましたが、いまは年齢にかかわらず目標を設定します。ガイドラインによって数字が少し違います。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>HbA1c</th><th>食前血糖</th></tr>\n<tr><td>ISPAD</td><td>&lt; 7.0%</td><td>70〜130 mg/dL（TIR 70%以上）</td></tr>\n<tr><td>ADA</td><td>&lt; 7.5%</td><td>90〜130 mg/dL</td></tr>\n<tr><td>NICE</td><td>≤ 6.5%</td><td>70〜126 mg/dL</td></tr></table></div>\n<p>ただし、目標は<strong>一人ひとり</strong>です。低血糖をうまく訴えられない子、重い低血糖の既往がある子、ポンプやCGMを使えない子では<strong>7.5%未満、TIR 60%以上</strong>。反対に、低血糖が少なく生活の質も保てるなら、6.5%未満を目指してもかまいません。</p>\n<h3>防ごうとしているもの</h3>\n<p>罹病期間が<strong>30年以上</strong>になると、1型糖尿病の<strong>網膜症は約60%</strong>、腎症も同じくらいの頻度になります。9歳で発症した子なら、39歳のときの話です。コントロールの意味を、遠い将来の数字として本人に伝えられるようにしておきます。</p>\n<p><strong>網膜症</strong>は、正常→単純→増殖前→増殖と進みます。眼科の受診は、なし〜初期で6か月〜1年ごと、中期で3〜6か月ごと、増殖前以降は1〜2か月ごと。適切な時期にレーザー光凝固をすれば、失明は防げます。</p>\n<p><strong>腎症</strong>は尿アルブミンで病期を分けます。微量アルブミン尿（30〜299 mg/gCr）が第2期（早期腎症）、300以上か持続性蛋白尿が第3期（顕性腎症）。厳格な血糖管理と血圧管理が進行を抑え、高血圧にはACE阻害薬やARBが第一選択です。</p>\n<h3>HbA1cを疑うとき</h3>\n<p>HbA1cは赤血球のヘモグロビンにどれだけ糖がついたかなので、<strong>赤血球の寿命や質が変われば</strong>、血糖を映さなくなります。溶血、腎不全、鉄欠乏性貧血、異常ヘモグロビン、肝硬変。値と血糖ノートが合わないときは、検査そのものを疑います。古いカルテの数字は<strong>NGSP＝JDS＋0.4</strong>で読み替えます。</p>\n<p>ほかの指標にも弱点があります。<strong>グリコアルブミン（GA）</strong>は約2週間の血糖を映しますが、甲状腺の病気や低栄養、ネフローゼで変わります。<strong>1,5-AG</strong>は尿糖が出ると下がるので良いコントロールの評価に向きますが（正常14.0 μg/mL以上）、SGLT2阻害薬を使っていると指標になりません。指標の強みと弱点は、セットで覚えます。</p>\n<p>12歳の彼には、こう返しました。「頑張ってるのは、ノートを見れば分かるよ。7.8でも、3年前の11.2から見たら全然違う。7.5を切るのは、30年後の目と腎臓のため。そのために、今の生活で無理なくできることを、一個だけ一緒に探そう」。彼が選んだのは、夕食後のCGMを毎日見ること、でした。</p>", "keys": ["目標はISPAD 7.0%未満（TIR 70%以上）、ADA 7.5%未満。低血糖リスクが高ければ7.5%未満・TIR 60%以上", "罹病30年以上で網膜症約60%。網膜症は病期で眼科受診間隔を決める", "腎症は微量アルブミン尿で第2期、顕性で第3期。高血圧にはACE阻害薬・ARB", "HbA1cは溶血・腎不全・鉄欠乏・異常Hbで血糖を反映しない。NGSP＝JDS＋0.4", "GAは甲状腺・低栄養・ネフローゼで変動、1,5-AGはSGLT2阻害薬で使えない"], "upd": null, "quiz": [{"v": "", "q": "ISPADが示す小児1型糖尿病の血糖管理目標値（表2）で正しいのは。", "o": ["HbA1c 7.0%未満、食前70〜130、食後90〜180、就寝前80〜140 mg/dL、TIR 70%以上", "HbA1c 6.5%以下、食前70〜126、食後90〜162、就寝前70〜126 mg/dL、TIR 80%以上", "HbA1c 7.5%未満、食前90〜130、食後120〜200、就寝前90〜150 mg/dL、TIR 60%以上", "HbA1c 8.0%未満、食前100〜150、食後150〜200、就寝前100〜160 mg/dL、TIR 50%以上"], "a": 0, "e": "NICE（イギリス）はHbA1c 6.5%以下、食前70〜126、食後90〜162、就寝前70〜126 mg/dL。ADA（アメリカ）はHbA1c 7.5%未満、食前90〜130、就寝前90〜150 mg/dL。低血糖をうまく訴えることができない、重症低血糖の既往がある、CSIIやCGMなどの最新の治療を受けられない患者ではHbA1cの目標は7.5%未満としTIRは60%以上を目標とする。一方、低血糖を頻回に起こすことがなく生活の質も保つことができて過剰な負荷がかからないということであればHbA1c 6.5%未満を目標としてもよい。", "r": "治療 表2 p.222"}, {"v": "", "q": "糖尿病性腎症病期分類（表3）の第3期（顕性腎症期）の基準は。", "o": ["顕性アルブミン尿（300以上）または持続性蛋白尿（0.5 g/gCr以上）、GFR 30以上", "微量アルブミン尿（30〜299 mg/gCr）、GFR 30以上で高血圧を伴う", "正常アルブミン尿（30未満）、GFR 30以上60未満で増殖網膜症を伴う", "アルブミン尿の程度は問わず、GFR 30未満で透析導入前の腎不全期"], "a": 0, "e": "第1期（腎症前期）：正常アルブミン尿（30未満）、GFR 30以上。第2期（早期腎症期）：微量アルブミン尿（30〜299）、GFR 30以上。第4期（腎不全期）：問わない、GFR 30未満。第5期（透析療法期）：透析療法中。厳格な血糖コントロールは早期腎症の発展阻止や早期から顕性腎症への進展阻止への有効性が認められている。血圧管理も有効性が示されており、高血圧の治療にはACE阻害薬やARBが第一選択として用いられる。", "r": "治療 表3 p.223"}, {"v": "", "q": "1,5-アンドロヒドログルシトール（1,5-AG）が血糖管理の指標になる理由は。", "o": ["尿糖が排泄されると再吸収が競合阻害され血中濃度が下がるため、良好な管理の評価に向く", "赤血球寿命を反映し、過去1〜2か月の平均血糖を示すため長期管理の評価に向き", "食事量を反映し、食後高血糖の指標になるため", "インスリン分泌量を反映し、β細胞機能の指標になるため"], "a": 0, "e": "正常は14.0 μg/mL以上。SGLT2阻害薬を使っていると尿糖が出続けるため指標にならない。GAは約2週間の血糖を反映するが甲状腺疾患や低栄養で変動する。", "r": "治療 p.910"}]}, {"id": "d9", "lv": 2, "t": "学校・思春期・大人の外来へ", "min": 5, "cats": "療養指導・1型糖尿病", "src": "p.461-470, 513", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>16歳になった彼。最近、外来にはお母さんだけが来て、処方をもらって帰っていきます。HbA1cは9%台。お母さんが言います。「本人、もう病院に行きたくないって」</div><p>1型糖尿病は、一生続く病気です。だから小児科の仕事は、血糖を整えるだけでなく、<strong>本人が自分で病気と付き合えるようにして、大人の診療へ送り出す</strong>ことまでです。今日は、その長い道のりの話です。</p>\n<h3>診断の日に伝えること</h3>\n<p>本書は、診断したとき本人と家族に伝えることとして、三つを挙げています。</p>\n<ul>\n<li><strong>きちんと生活している先輩がたくさんいる</strong>こと</li>\n<li>インスリンは<strong>年の単位で</strong>必要になるであろうこと</li>\n<li><strong>シックデイ</strong>の対応</li>\n</ul>\n<p>制限の説明から入らない。できることと、続け方から入る。特別扱いしすぎない生活を目指します。</p>\n<h3>学校と友だち</h3>\n<p>糖尿病は、<strong>本来隠すものではなく</strong>、多くの人に説明しておくほうがよいとされています。低血糖のときに助けてもらう必要があるからです。担任、養護教諭、部活の顧問、そして付き合いの長い友だちには協力してもらいます。</p>\n<h3>思春期：深追いしない勇気</h3>\n<p>思春期は、インスリンが効きにくくなる時期であり、同時に、親から離れようとする時期でもあります。本書の実践は印象的です。思春期の子は<strong>お母さんとは別に外来に来させ</strong>、<strong>本人が話したがる内容を聞くこと</strong>を中心にする。そして、時期によっては<strong>糖尿病のコントロールを深追いしない</strong>。</p>\n<p>なぜなら、<strong>通院が途切れることのほうが、害が大きい</strong>からです。HbA1cが少し高くても、外来に来てくれていれば、また立て直せます。来なくなれば、DKAで救急に運ばれるまで会えないかもしれません。</p>\n<h3>大人として知っておくこと</h3>\n<p>喫煙は体にプラスになることはなく勧めない。飲酒は低血糖を起こしやすい。<strong>車を運転する前には血糖を測る</strong>。禁止を言い渡すのではなく、なぜそうなるのかを添えて伝えます。思春期以降の子に届く形です。</p>\n<h3>移行は「能力の受け渡し」</h3>\n<p>成人の診療科への移行（transition）にあたって、本書は<strong>チェックリスト</strong>を使っています。病態の説明ができるか、シックデイの対応ができるか、薬を自分で注文できるか、進学・就職・妊娠の相談ができるか。項目ごとに、本人の理解と自立を確かめていきます。移行は書類を渡すことではなく、<strong>能力を受け渡す</strong>ことです。</p>\n<p>お母さんには、「次は、本人だけで来てもらえませんか。HbA1cの話はしません。部活の話でも、進路の話でもいい」とお願いしました。翌月、彼は一人でやってきて、専門学校に行きたいこと、一人暮らしが不安なことを話してくれました。帰り際、チェックリストの一枚目を手渡しました。「全部できるようになったら、大人の先生を紹介するね」。</p>", "keys": ["診断時に伝える：先輩がたくさんいる、インスリンは年単位、シックデイ対応", "学校・友人には隠さず説明しておく（低血糖時に助けてもらう）", "思春期は母と別に来させ、本人の話を聞く。コントロールを深追いしない時期もある", "通院が途切れることのほうが害が大きい", "移行はチェックリストで本人の理解と自立を項目ごとに確認（能力の受け渡し）"], "upd": null, "quiz": [{"v": "", "q": "1型糖尿病の診断時に本人・家族へ伝える内容として本書が挙げているのは。", "o": ["きちんと生活している先輩がたくさんいること、インスリンは年の単位で必要であろうこと、シックデイの対応", "まず合併症の種類と頻度を網羅的に説明し、インスリンは数か月で中止できる可能性が高いと伝え、運動と食事の制限を示す", "インスリンは数か月で中止できる可能性が高いと伝える", "運動と食事の制限を具体的に示すことから説明を始める"], "a": 0, "e": "制限の説明から入らない。できることと、続けかたから入る。特別扱いにしすぎない生活をさせることを努力している、と述べられている。", "r": "p.465"}, {"v": "", "q": "思春期の1型糖尿病患者への外来対応として本書が実践しているのは。", "o": ["必ず親と同席させ、家庭での管理状況を親から聞き取る", "母とは別に外来に来させ、本人が話したがる内容を聞くことを中心にする", "HbA1cと血糖記録の確認を中心に、短時間で終える", "コントロールが安定するまで受診間隔を延ばさず毎週来させ、親の同席を必ず求める"], "a": 1, "e": "時期によっては糖尿病のコントロールを深追いしない、とも書かれている。通院が途切れることのほうが害が大きい。", "r": "p.463 / p.465 / 症例3 p.461"}, {"v": "", "q": "成人診療科への移行（transition）にあたり本書が用いているのは。", "o": ["18歳到達時に紹介状を書いて自動的に移行させ", "本人の理解と自立を項目ごとに確認するチェックリスト", "成人科の受け入れ可否をもとに時期を決める", "親の希望を優先し、本人の理解度は問わない"], "a": 1, "e": "病態の説明、シックデイ対応、薬剤の注文、進学・就職・妊娠の相談まで含む。移行は書類ではなく能力の受け渡し。", "r": "表 p.462-463"}]}, {"id": "d10", "lv": 1, "t": "2型糖尿病：学校検尿から", "min": 6, "cats": "2型糖尿病", "src": "p.473-477 ／ 小児内分泌学 p.534-538 ／ 治療 p.225-229", "vol": "巻の九 糖尿病・肥満・低血糖", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>中学2年生の男の子。学校検尿で尿糖を2回指摘されて来院しました。肥満度42%、首の後ろが黒ずんでざらざらしています。お父さんも祖母も糖尿病で治療中です。</div><p>小児の2型糖尿病は、多くが<strong>学校検尿</strong>で見つかります。症状がないうちに見つけられる、日本ならではの仕組みです。今日は、その見つけ方と、1型との見分け方です。</p>\n<h3>どのくらいいるか</h3>\n<p>学校検尿で見つかる2型糖尿病は、<strong>10万人あたり年2.5〜3.5人</strong>で、1型（1.5〜2.5）より多いのです。<strong>中学生は小学生よりずっと多く</strong>、思春期のインスリン抵抗性が影響していると考えられています。1975年から増えてきましたが、ここ十数年は増加が止まっています。小児肥満が少しずつ減っていることと関係しているようです。</p>\n<h3>2型らしさ</h3>\n<ul>\n<li><strong>肥満</strong>：診断時に約80%が肥満度20%以上。ただし10〜15%は肥満がありません。</li>\n<li><strong>家族歴</strong>：60〜70%で親やきょうだいに2型糖尿病。</li>\n<li><strong>黒色表皮腫</strong>：首や脇の黒ずみ。インスリン抵抗性のサインで、あると2型の頻度が約7倍に。</li>\n<li>OGTTでインスリンが<strong>遅れて、たくさん</strong>出る（遅延型過分泌）。</li>\n<li>膵島関連自己抗体は陰性。</li>\n</ul>\n<p>1型は肥満がないか「小太り」程度です。ただ、肥満のない2型は、インスリンの分泌が最初から低い子が多く、緩徐進行型の1型や、第13話のMODYとの区別が難しくなります。</p>\n<h3>精密検査で何をするか</h3>\n<p>尿ケトン、空腹時血糖、HbA1c、そしてOGTT（1.75 g/kg、最大75 g）でインスリンも測ります。ここで大事な原則が二つ。</p>\n<ul>\n<li><strong>尿糖陽性で尿ケトンも陽性なら</strong>、DKAかもしれません。緊急の受診を考えます。</li>\n<li><strong>空腹時血糖とHbA1cの両方が糖尿病型なら、OGTTはしない</strong>。不要な負荷は負担になるうえ、さらに高血糖を招いてDKAへ進めてしまう危険があります。</li>\n</ul>\n<div class=\"formula\">糖尿病型：空腹時 ≥ 126 または OGTT 2時間 ≥ 200 mg/dL<br>境界型：空腹時 110〜125（IFG）または 2時間 140〜199（IGT）</div>\n<h3>インスリン抵抗性を数字にする</h3>\n<div class=\"formula\">HOMA-IR ＝ 空腹時IRI × 空腹時血糖 ÷ 405　（2.5以上で抵抗性）<br>HOMA-β ＝ 空腹時IRI × 360 ÷（空腹時血糖 − 63）　（20以上で分泌は保たれている）<br>insulinogenic index ＝ Δ30分IRI ÷ Δ30分血糖　（0.5未満で初期分泌低下）</div>\n<p>Cペプチドも目安になります。1 ng/mL以下ならインスリン治療が必要、3 ng/mL以上ならインスリンには頼らなくてよい、と判断できます。1型か2型かの二択ではなく、<strong>自分のインスリンがどれだけ残っているか</strong>で治療を決めるのです。</p>\n<h3>2型は、ずっと前から始まっている</h3>\n<p>2型糖尿病は、発症のかなり前から<s
