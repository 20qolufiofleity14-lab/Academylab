きが逆になる、要注意の病気です。</p>\n<h3>治療</h3>\n<p>従来はリン製剤（PO₄として<strong>40〜80 mg/kg/日を分割</strong>、分割しないとリンが上がらない）とアルファカルシドールの併用です。入れすぎると二次性・三次性副甲状腺機能亢進症と腎石灰化を招くので、<strong>尿中Ca/Cr 0.3以下</strong>を見張り、ALPは半年〜1年での改善を目標にします。</p>\n<p>新しい選択肢は抗FGF23抗体の<strong>ブロスマブ</strong>です。小児では<strong>2週ごとに0.8 mg/kg</strong>を皮下注し、始めるときはリン製剤と活性型ビタミンDをやめておきます。</p>", "keys": ["低リンなのに1,25(OH)₂Dが上がらない→FGF23過剰", "XLHはPHEX異常。女性は軽く見逃されやすい", "ADHR（鉄欠乏が誘因）、TIOもFGF23過剰", "TmP/GFRとintact FGF23で分ける", "HHRHはFGF23低値で高Ca尿症。活性型ビタミンDは禁物", "リン製剤は分割、尿Ca/Cr 0.3以下。ブロスマブは0.8 mg/kgを2週ごと"], "upd": "ブロスマブの適応や用量は改訂されることがあります。使用時は添付文書と最新の手引きで確認してください。", "quiz": [{"v": "O脚と低身長で紹介された幼児。Ca 8.9〜9.3 mg/dL、P 2.1〜2.8 mg/dL、ALP 1,732〜2,495 IU/L、PTHは正常上限程度、1,25(OH)2D 37.7〜40.0 pg/mL、尿中Ca/Cr 0.0、TmP/GFR低下。", "q": "最も考えられるのは。", "o": ["ビタミンD欠乏性くる病（Caは正常でもPは低い）", "X連鎖性低リン血症性くる病（XLH）", "ビタミンD依存性くる病（1α水酸化酵素欠損）", "偽性副甲状腺機能低下症（Pが高い）"], "a": 1, "e": "低リン血症のわりに1,25(OH)2Dが上がっていないことが核心。欠乏性なら低リンに反応して1,25(OH)2Dは高値になる。Caは正常で尿中Ca/Crも低い。", "r": "症例1 p.205-207"}, {"v": "", "q": "XLHの責任遺伝子と病態は。", "o": ["FGF23の切断部位の変異でFGF23が分解されず高値となる", "PHEX異常によりFGF23が分解されず高値となる", "PHEX異常によりFGF23の産生が低下する", "DMP1異常により骨細胞からのFGF23分泌が抑制される"], "a": 1, "e": "FGF23過剰が本態。リン再吸収が抑制され、かつ1α水酸化も抑えられるので、低リンなのに活性型ビタミンDが増えない。", "r": "p.211-213"}, {"v": "", "q": "HHRH（高カルシウム尿症を伴う遺伝性低リン血症性くる病）でXLHと決定的に異なるのは。", "o": ["FGF23がむしろ低下し、1,25(OH)2Dが上昇して高カルシウム尿症を来す", "FGF23が著明高値となり、1,25(OH)2Dは低下して高カルシウム尿症を来す", "低リン血症を伴わず、高カルシウム尿症のみを呈する", "リン製剤が無効で、活性型ビタミンDのみで治療する"], "a": 0, "e": "NaPi-IIcの変異によるリン喪失。FGF23が低いので1α水酸化が抑制されず、1,25(OH)2Dが上がる。だから活性型ビタミンDを足してはいけない。XLHと治療方針が逆になる。", "r": "小児内分泌学 p.509 / 治療 p.1233"}]}, {"id": "c10", "lv": 2, "t": "骨形成不全症と、骨の作られかた", "min": 5, "cats": "骨形成不全症・骨・Ca代謝の基本", "src": "症例 p.215-219 ／ 小児内分泌学 p.486-487", "vol": "巻の四 カルシウム・骨", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>頭が腫れて受診した1歳児。調べると複数の骨折。外傷のはっきりした話はなく、身なりは整っています。</div><p>この場面で、どちらか一方に決め打ちしないこと。巻物の症例が最も強く伝えているのはそこです。考えるべきは<strong>虐待と骨形成不全症の両方</strong>です。</p>\n<h3>見るべき手がかり</h3>\n<p><strong>青色強膜</strong>、<strong>歯の形成不全</strong>、家族歴、骨密度。これらを確かめたうえで、両方の可能性を並べて検討します。骨形成不全症は、周産期に命に関わる型から、大人になるまで気づかれない軽い型まで、連続して幅があります。軽い型ほど、虐待との区別が難しくなります。</p>\n<h3>原因はコラーゲン</h3>\n<p>大多数は<strong>I型コラーゲンの遺伝子（COL1A1／COL1A2）</strong>の異常で、常染色体優性です（Sillence分類のI〜IV型）。I型コラーゲンは3本の鎖がらせん状に巻いてできていて、その配列は<strong>Gly-X-Y</strong>の繰り返しです。いちばん小さいアミノ酸であるグリシンが、三本鎖の中心にちょうど収まる。だから<strong>グリシンが大きなアミノ酸に置き換わると、らせんが組めなくなります</strong>。小さな置換が、骨全体の強さを変えてしまうのです。V型以降の新しい型の多くは常染色体劣性で、コラーゲンの修飾や折りたたみを助ける分子の異常です。</p>\n<h3>治療</h3>\n<p><strong>パミドロネートの静注</strong>が確立しつつあり、骨密度と骨折の頻度が改善します。治療で骨折が減り、身長が追いつく子もいます。診断がつけば介入できるので、鑑別する意味がとても大きい病気です。</p>\n<h3>骨はどうやって作られるか</h3>\n<p>最後に、この章の土台を振り返ります。骨の作られ方は2通りあります。</p>\n<ul><li><strong>軟骨内骨化</strong>：まず軟骨の型を作り、それを骨に置き換える（手足の長い骨）。<strong>SOX9</strong>が必須</li>\n<li><strong>膜性骨化</strong>：間葉系の細胞が直接骨芽細胞になる（頭蓋骨など）。骨芽細胞の分化には<strong>RUNX2</strong>が必須</li></ul>\n<p>成長板では、軟骨細胞が静止→増殖→肥大と進み、肥大軟骨が石灰化したところに血管が入り込んで骨に置き換わります。くる病は、この「石灰化」の段階で止まってしまう病気でした。破骨細胞はRANK/RANKL/OPGの系で調節されています。</p>\n<p>カルシウムとリン、ビタミンDとPTHとFGF23、そしてコラーゲン。この章で見てきた病気は、全部この骨の作られ方のどこかの段階に置くことができます。</p>", "keys": ["多発骨折では虐待と骨形成不全症の両方を考える", "青色強膜・歯牙形成不全・家族歴・骨密度を確認", "大多数はCOL1A1/A2。Gly-X-Yのグリシン置換でらせんが組めない", "パミドロネート静注で骨密度・骨折頻度が改善", "軟骨内骨化はSOX9、骨芽細胞分化はRUNX2"], "upd": null, "quiz": [{"v": "", "q": "骨形成不全症の大多数を占める原因遺伝子は。", "o": ["COL1A1 / COL1A2（常染色体優性）", "CRTAP / P3H1 / PPIB（常染色体劣性）", "IFITM5（V型、常染色体優性）", "SERPINF1（VI型、常染色体劣性）"], "a": 0, "e": "Sillence分類I〜IVがこれに当たる。近年報告されたV型以降の多くは常染色体劣性で、コラーゲンの修飾や折りたたみに関わる分子の異常。", "r": "表1 p.217"}, {"v": "", "q": "I型コラーゲンの三重らせん形成にとって決定的なのは。", "o": ["Gly-X-Y の繰り返しにおけるグリシンが置換されないこと", "Gly-X-Y の X 位置のプロリンが水酸化されていること", "リジンの架橋が三重らせんの形成前に完了していること", "C末端プロペプチドが切断されていること"], "a": 0, "e": "グリシンは最も小さく、三本鎖の中心に収まる。ここが大きな残基に置き換わると、らせんが組めない。", "r": "図 p.219"}, {"v": "1歳児。頭部腫脹で受診し、複数の骨折を認めた。外傷歴ははっきりせず、身なりは整っている。", "q": "評価として必須なのは。", "o": ["虐待の可能性と骨形成不全症の双方を検討する", "身なりが整っているので虐待は否定し、骨形成不全症のみを考える", "経過観察とする", "ビタミンD欠乏性くる病を第一に考え、25(OH)Dを測定する"], "a": 0, "e": "青色強膜、歯牙形成不全、家族歴、骨密度を確認する。どちらか一方に決め打ちしないことが、この症例で最も強調されている。", "r": "症例 p.215-217"}]}];
const PUB = [{"id": "u1", "lv": 1, "t": "思春期のスイッチ", "min": 5, "cats": "思春期発来の生理", "src": "レクチャー5 p.227-261 ／ 治療 p.644 ／ 小児内分泌学 p.295-300", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>「うちの子、いつ思春期が始まるんでしょう」。この素朴な質問に、体の中で何が起きているかから答えられると、説明の説得力がまるで変わります。</div><p>思春期は、ある日突然「始まる」ように見えますが、実際には脳の奥で何年も前から準備が進んでいます。今日はその仕組みを、上流から順にたどります。</p>\n<h3>軸は4段</h3>\n<div class=\"formula\">キスペプチン → LHRH（GnRH）→ LH・FSH → 性ステロイド</div>\n<p>いちばん上流にいるのは、視床下部の<strong>KNDyニューロン</strong>です。キスペプチン（K）、ニューロキニンB（N）、ダイノルフィン（Dy）の3つを出すので、この名前がついています。思春期は、ここからの抑制が外れて<strong>LHRHが脈を打つように（パルス状に）出はじめる</strong>ことで始まります。思春期を「新しく作る」のではなく、「ブレーキを外す」と考えると分かりやすいです。</p>\n<h3>最初の変化は、夜にこっそり起きる</h3>\n<p>二次性徴が見えるより<strong>1〜2年も前</strong>から、<strong>夜の睡眠中だけLHが上がり</strong>はじめます。日中はまだ低いままで、思春期が進むにつれて日中にも広がっていきます。だから思春期の始まりを見たいときは、早朝の採血に意味があります。</p>\n<p>もう一つの目印が<strong>LH優位</strong>です。LHはFSHより先に上がるので、LHがFSHを上回ってくることは、LHRHの指令で動いている（中枢性）ことの手がかりになります。ちなみにFSHは半減期が長いのでパルスがはっきりせず、指令の強さを見るにはLHを測ります。LHRHのパルスがLHのパルスを、LHRHのサージがLHのサージ（排卵）を生む、という1対1の関係です。</p>\n<h3>ブレーキを外す因子、かけ直す因子</h3>\n<p>MKRN3という遺伝子は、父由来のアレルだけが働いていて、KNDyニューロンやLHRHニューロンを抑えていると考えられています。これが壊れると抑制が外れ、中枢性思春期早発症になります。</p>\n<p>逆に、LHRHの分泌は<strong>栄養や運動、ストレス</strong>でも動きます。GABA、カテコラミン、CRH、βエンドルフィン、NPYなどの影響を受けるからです。<strong>やせや過度の運動で思春期が止まる</strong>のは、このためです。エストロゲンのフィードバック（負も正も）を仲介するのも、キスペプチンだと考えられています。</p>\n<h3>LHRHニューロンの長い旅</h3>\n<p>最後に一つ、あとの回の伏線を置いておきます。LHRHニューロンは、視床下部で生まれるのではありません。<strong>鼻の奥（嗅板）で生まれ、嗅神経に沿って視床下部まで旅をしてきます</strong>。この旅がうまくいかないと、思春期が来ないうえに<strong>においも分からない</strong>。それがKallmann症候群です。</p>", "keys": ["軸：キスペプチン→LHRH→LH・FSH→性ステロイド", "思春期はKNDyニューロンのブレーキが外れて始まる", "最初の変化は夜間のLH上昇（二次性徴の1〜2年前）", "LH優位は中枢性の手がかり。指令の強さはLHで見る", "やせ・過度の運動・ストレスで思春期は止まる", "LHRHニューロンは鼻で生まれ嗅神経に沿って移動する"], "upd": null, "quiz": [{"v": "", "q": "思春期発来のホルモン軸を上位から並べると。", "o": ["LHRH → キスペプチン → LH/FSH → 性ステロイド", "キスペプチン → LHRH → LH/FSH → 性ステロイド", "LH/FSH → LHRH → 性ステロイド", "性ステロイド → キスペプチン → LHRH"], "a": 1, "e": "KNDyニューロン（キスペプチン・ニューロキニンB・ダイノルフィン）がLHRHニューロンを制御する。思春期発来はLHRHニューロンの抑制が解除され、脈動的分泌が始まることで起こる。", "r": "レクチャー5 p.261 / p.229"}, {"v": "", "q": "二次性徴が現れる前に最初に捉えられる変化は。", "o": ["夜間睡眠中のLH上昇", "昼間のFSH上昇", "テストステロンの上昇", "骨年齢の促進"], "a": 0, "e": "二次性徴の1〜2年前から夜間のLHが上がりはじめる。またLHはFSHに比して先に上昇するので、LH優位はLHRH依存性を示す手がかりになる。", "r": "p.227"}, {"v": "", "q": "エストロゲンのネガティブ／ポジティブフィードバックを仲介するとされるのは。", "o": ["視床下部キスペプチン", "視床下部のドパミン作動性ニューロン", "GABAのみ", "プロラクチン"], "a": 0, "e": "GnRH分泌はほかにもGABA、カテコラミン、CRH、βエンドルフィン、NPYなどの影響を受け、栄養や運動でも変動する。だから「痩せ」や「過度の運動」が思春期を止める。 メタスチン。", "r": "治療 p.644"}]}, {"id": "u2", "lv": 1, "t": "二つの思春期：mini-pubertyと静止期", "min": 5, "cats": "思春期発来の生理・低ゴナドトロピン性", "src": "治療 p.646, 694 ／ 小児内分泌学 p.149, 299-300, 341", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>小陰茎と停留精巣で紹介された生後2か月の男の子。お母さんは「思春期になるまで様子を見ればいいんですよね」と聞きます。実は、今がいちばん大事な検査のタイミングです。</div><p>思春期は人生で一度きり、と思われがちですが、実は<strong>2回</strong>あります。1回目は、生まれて数か月のころです。</p>\n<h3>mini-puberty（ミニ思春期）</h3>\n<p>生後数か月、<strong>LHRHのパルスジェネレーターが一時的に目を覚まし</strong>、男女ともゴナドトロピンと性ステロイドが上がります。男の子では、テストステロンが<strong>思春期と同じくらいまで</strong>上がります。この時期は精巣の働きを評価できる、貴重な窓です。</p>\n<p>ただし、生まれてすぐは胎盤から来たhCGでテストステロンが保たれているので、その影響は差し引いて読みます。</p>\n<h3>そのあとの長い「静止期」</h3>\n<p>mini-pubertyが終わると、幼児期から学童期にかけて長い<strong>静止期</strong>（juvenile pause）に入ります。LHRHのパルスジェネレーターへの中枢からの抑制が強まり、しかも性ステロイドへの感受性が上がるので、わずかな性ステロイドでもLHRHが強く抑えられます。この時期はゴナドトロピンが生理的に低いので、<strong>低ゴナドトロピン性性腺機能低下症（生まれつき指令が出ない病気）と区別できません</strong>。</p>\n<p>思春期になると、この抑制が外れ、性ステロイドへの感受性も下がって、LHRHがたくさん出るようになります。これが2回目の思春期です。</p>\n<h3>冒頭の答え：今が窓</h3>\n<p>先天性の低ゴナドトロピン性性腺機能低下症は、<strong>mini-pubertyの時期に診断の窓があります</strong>。この時期にゴナドトロピンやテストステロンが上がってこなければ、指令が出ていない可能性が高い。逆に、この窓を逃すと、静止期に入ってしまい、思春期の年齢まで判定が難しくなります。</p>\n<p>あとの回で出てきますが、思春期が遅い子が「体質的に遅いだけ」なのか「指令が出ない病気」なのかの見分けはとても難しい問題です。そのとき、もし乳児期にホルモンを測った記録があれば、大きな手がかりになります。<strong>mini-pubertyの値が高ければ体質性、低ければ低ゴナドトロピン性</strong>の可能性が高いからです。</p>\n<p>小陰茎や停留精巣は、その一部がゴナドトロピン不足から来ています。生後数か月の外来は、10年以上先の思春期を見通せる、数少ないチャンスです。</p>", "keys": ["思春期は2回ある。1回目は生後数か月のmini-puberty", "mini-pubertyでは男児のテストステロンが思春期並みに上がる", "幼児期の静止期はゴナドトロピンが低く、病気と区別できない", "先天性低ゴナドトロピン性の診断の窓はmini-puberty", "乳児期の値は、後の体質性との鑑別にも役立つ"], "upd": null, "quiz": [{"v": "", "q": "mini-puberty（ミニ思春期）について正しいのは。", "o": ["生後数か月にGnRHパルスジェネレーターが一過性に活性化し、男女ともゴナドトロピンと性ステロイドが上昇する", "出生直後のみに起こり、生後1週で終わる", "女児にのみ起こり、男児では起こらない", "思春期の開始と同じ機序で生後数か月に始まり、以後は思春期まで持続して性腺を発達させる"], "a": 0, "e": "男児では血中テストステロンが思春期並みに上がり、精巣容積の評価に使える。先天性低ゴナドトロピン性性腺機能低下症はこの時期に診断の窓がある。", "r": "小児内分泌学 p.149"}, {"v": "新生児期から乳児期に、ゴナドトロピンと性ステロイドが一過性に上昇する時期がある。", "q": "その後に幼児期の静止期が訪れる機序として述べられているのは。", "o": ["GnRHパルスジェネレーターへの中枢性抑制が強まり、性ステロイドへの感受性が亢進する", "性腺が萎縮してゴナドトロピンに反応しなくなるため", "下垂体が未熟で、ゴナドトロピンを産生できなくなるため", "性ステロイドへの感受性が低下して負のフィードバックが外れ、GnRHの貯蔵が枯渇して分泌が止まるため"], "a": 0, "e": "思春期にはこの抑制が外れ、性ステロイドへのネガティブフィードバック感受性が低下してGnRH分泌が増える。だから静止期の値だけを見ても性腺機能は評価できない。", "r": "治療 p.646"}, {"v": "", "q": "低ゴナドトロピン性性腺機能低下症の診断において、新生児期〜乳児期が重要な理由は。", "o": ["この時期に一過性の性ホルモン分泌増加（mini-puberty）があり、その反応で評価できる", "この時期はゴナドトロピンが生理的に最も低く安定しているため", "この時期に治療を始めると精巣容積が正常化するから", "この時期は遺伝子検査の結果が出やすいから"], "a": 0, "e": "生後数か月のこの窓を逃すと、思春期年齢まで判定が難しくなる。ただし出生直後は胎盤由来のhCGでテストステロンが保たれるため、そこは差し引いて読む。", "r": "p.243 / p.245"}]}, {"id": "u3", "lv": 1, "t": "副腎性徴と早発陰毛", "min": 5, "cats": "思春期発来の生理・末梢性の性早熟", "src": "p.228 ／ 小児内分泌学 p.300 ／ 治療 p.66", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>7歳の女の子に、少し陰毛が生えてきた。体臭も出てきた。でも胸はふくらんでいません。お母さんは「思春期早発症ですか」と心配しています。</div><p>思春期には、実は<strong>二つの別々のスイッチ</strong>があります。一つはこれまで話してきた性腺のスイッチ（gonadarche）。もう一つが、副腎のスイッチ、<strong>副腎性徴（adrenarche）</strong>です。</p>\n<h3>副腎のスイッチ</h3>\n<p>6〜8歳ごろから、副腎の網状層から<strong>DHEA-S</strong>という弱い男性ホルモンがたくさん出るようになります。陰毛や腋毛、体臭、ニキビの一部はこれが原因です。gonadarcheとは<strong>独立した仕組み</strong>で動いていて、DHEA-Sが目印になります。</p>\n<p>なぜ副腎のスイッチが入るのかは、まだよく分かっていません。面白いのはACTHとの関係です。ACTH分泌不全の子ではadrenarcheが起こらず、DHEA-Sも上がりません。でも、ふつうのadrenarcheのときにACTHが上がるわけでもない。<strong>ACTHは必要だが、引き金そのものではない</strong>、という関係です。</p>\n<h3>早発陰毛・早発腋毛</h3>\n<p>このadrenarcheが早めに来たのが、<strong>早発陰毛</strong>です。女の子に多く、骨年齢が少し進むことはありますが、<strong>成人身長には影響しません</strong>。治療は要りませんが、経過は見ます。</p>\n<p>大事なのは、本当にadrenarcheなのかを確かめることです。</p>\n<ul><li><strong>非古典型の21水酸化酵素欠損症</strong>（先天性副腎過形成）を除外する。17OHPを測る</li>\n<li>男性化が強い、進みが速い、陰核が大きくなる、といった所見があれば、副腎腫瘍なども考える</li>\n<li>小さく生まれた（SGAの）子では、とくに注意する</li></ul>\n<p>長い目で見ると、早発陰毛の女の子は、将来<strong>アンドロゲン過剰やPCOS、メタボリックシンドローム</strong>になりやすいことが言われています。「治療は要らない、でも体重と生活は気にかけておこう」と伝えておくと、家族にとって意味のある説明になります。</p>\n<h3>冒頭の子への説明</h3>\n<p>胸がふくらんでいないなら、性腺のスイッチはまだ入っていない可能性が高いです。陰毛と体臭だけなら、まず副腎のスイッチ、つまり早発陰毛を考えます。そのうえで、成長率が急に上がっていないか、骨年齢が大きく進んでいないか、陰核が大きくなっていないかを確かめ、非古典型CAHを除外します。二つのスイッチを分けて考えるだけで、家族への説明がぐっと整理されます。</p>", "keys": ["思春期のスイッチは性腺（gonadarche）と副腎（adrenarche）の2つ", "adrenarcheは6〜8歳からDHEA-S上昇。性腺とは独立", "ACTHは必要だが引き金ではない", "早発陰毛は成人身長に影響しないが、非古典型CAHを除外", "将来のPCOS・メタボのリスクに配慮"], "upd": null, "quiz": [{"v": "", "q": "adrenarche（副腎性徴）について正しいのは。", "o": ["副腎網状層からのDHEA-S分泌が6〜8歳ごろから増え、尿中17-KSの多くを占めるようになる。gonadarcheとは独立した機序で、DHEA-Sがマーカーになる", "gonadarcheと同時に始まり、LHが副腎網状層を刺激してDHEA-Sが増える", "副腎皮質束状層からのコルチゾール分泌の増加を指す", "思春期後期に起こり、成長スパートの原因になる"], "a": 0, "e": "機序は解明されておらず、副腎の独立した成熟説やPOMC由来ペプチド・レプチンの関与が想定されている。早発陰毛（premature adrenarche）はこの早期化。", "r": "小児内分泌学 p.300"}, {"v": "", "q": "ACTH分泌不全症におけるadrenarcheについて正しいのは。", "o": ["adrenarcheとDHEA-Sの上昇は生じない", "adrenarcheは正常に生じ、DHEA-Sは年齢相応に上昇する", "adrenarcheは生じるが、DHEA-Sの上昇は遅れる", "ACTHに依存しないため、adrenarcheは影響を受けない"], "a": 0, "e": "一方で、通常のadrenarcheにACTHの上昇はみられない。ACTHは必要だが、adrenarcheの引き金そのものではない、という関係になる。", "r": "p.228 / 文献2"}, {"v": "", "q": "早発陰毛・早発腋毛について正しいのは。", "o": ["女子に多く、軽度の骨成熟促進はあるが成人身長には影響しない", "男子に多く、骨年齢は正常で成人身長が低下する", "SGA児では少なく、思春期開始後の副腎アンドロゲン過剰による", "3β-HSD欠損症が最多の原因で、GnRHアナログで治療する"], "a": 0, "e": "思春期開始前に副腎アンドロゲンの分泌が軽度過剰になったためと考えられるが正確な機序は不明。在胎週数に比し低体重で生まれた児では特に注意が必要。一部でアンドロゲン過剰症状を認める例があり、特に21OHDによる非古典型先天性副腎過形成を除外する必要がある。3β-HSD欠損症や11β水酸化酵素欠損症でも早発陰毛をきたすが頻度はまれ。治療は不要だが経過観察は必要。長期的には女子でアンドロゲン過剰症やPCOSのリスクが高く、メタボリックシンドロームとなるリスク増加もいわれている。", "r": "治療 p.66"}]}, {"id": "u4", "lv": 1, "t": "早発乳房：見守ってよい胸", "min": 5, "cats": "末梢性の性早熟", "src": "症例3 p.229-235 ／ 小児内分泌学 p.314 ／ 治療 p.65-66", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>1歳半の女の子。数か月前から、左の胸だけ少しふくらんでいる。大きくなったり小さくなったりします。身長の伸びはふつうです。</div><p>乳幼児の胸のふくらみは、小児内分泌の外来でとても多い相談です。多くは<strong>早発乳房</strong>（premature thelarche）で、治療の要らないものです。でも「全部大丈夫」とは言い切れない。その見分け方の話です。</p>\n<h3>早発乳房の典型</h3>\n<ul><li>多くは<strong>2歳ごろまでに出てきて、2年以内に消えていく</strong>（生まれたときからあることも）</li>\n<li>片側のことも両側のこともあり、<strong>大きくなったり小さくなったり</strong>する。年単位ではなく<strong>月単位</strong>で消長するのが典型</li>\n<li>ほかの二次性徴はない。<strong>成長率は加速せず、骨年齢も進まない</strong></li></ul>\n<p>卵胞が一時的にエストロゲンを出しては消えることで、乳腺がふくらんだりしぼんだりすると考えられています。LH・FSHは前思春期のレベルで、エストラジオールは正常か少し高い程度。超音波で卵巣に小さな嚢胞がいくつか見えることもあります。冒頭の子は、まさにこの典型です。</p>\n<h3>見守る、でも見放さない</h3>\n<p>治療は要らず、思春期や将来の生殖能力も正常です。ただし、<strong>一部は中枢性思春期早発症に移っていく</strong>ことがあり、始まりかけの早発症や、外からのエストロゲン（化粧品や薬など）の影響が紛れていることもあります。だから、<strong>続けて経過を見る</strong>ことが大事です。身長の伸びが急に上がってきた、乳房が着実に大きくなっていく、陰毛が出てきた、となれば精査に進みます。</p>\n<p>思春期の少し前、6〜7歳ごろにも、エストロゲンが上がらない一過性の乳房のふくらみが出ることがあり、半年〜1年後に本当の思春期が来ることがあります。</p>\n<h3>早発月経</h3>\n<p>もっとまれなのが、胸のふくらみがないのに性器出血だけがある<strong>早発月経</strong>です。多くは1〜3回の出血で自然に治まり、治療は要りません。卵巣が一時的に自分でエストロゲンを出していることがあります。</p>\n<p>ただし、小さな子の性器出血を見たら、<strong>外陰腟炎、異物、外傷、そして性的虐待</strong>を必ず考えます。出血しやすい体質（von Willebrand病など）や腫瘍も鑑別に入ります。「ホルモンのせいでしょう」で終わらせず、まずほかの原因を除外する。これが小児の性器出血の鉄則です。</p>", "keys": ["早発乳房は2歳までに出て2年以内に消えることが多い", "月単位で大きくなったり小さくなったりする", "成長率の加速・骨年齢の促進がない", "一部は中枢性早発症へ移行する。経過観察を続ける", "性器出血では膣炎・異物・虐待を必ず考える"], "upd": null, "quiz": [{"v": "", "q": "早発乳房（premature thelarche）の特徴として正しいのは。", "o": ["成長率の加速を伴うが、骨年齢は進まない", "一過性で、成長率の加速や骨年齢の促進を伴わない", "LHRH負荷でLH頂値がFSH頂値を上回る", "乳房腫大が進行し、2年以内に初経に至ることが多い"], "a": 1, "e": "卵胞からのエストロゲン分泌と消退で一過性の乳腺腫大が起こる。年の単位でなく月の単位で消長するのが典型。治療対象にならない。", "r": "症例3 p.235 / p.229"}, {"v": "", "q": "早発乳房について正しいのは。", "o": ["多くは2歳頃までに出現し、2年以内に消退することが多い", "多くは6〜7歳頃に出現し、半年で必ず本当の思春期に移行", "エストラジオールが思春期レベルに上昇し、GnRHアナログを要する", "必ず両側性で変動せず、卵巣に囊胞は認めない"], "a": 0, "e": "出生時から存在している場合もある。片側性のことも両側性のこともあり、しばしば変動する。通常他の二次性徴の徴候は認めず、一時的なFSHとエストロゲンの分泌増加によると考えられているが正確な機序は不明。LH、FSHは前思春期レベルでエストラジオールは前思春期レベルか軽度上昇。超音波で卵巣のサイズは前思春期相当だが数個の小囊胞を認めることがある。治療は不要で二次性徴の進行や生殖能力は正常。思春期開始前の6〜7歳頃にもエストロゲン上昇を伴わない一過性の乳房発育が出現することがあり、半年から1年後くらいに本当の思春期が発来する。一部はCPPに移行するものや初期の症例、外因性エストロゲン曝露もあるため継続した経過観察が重要。", "r": "治療 p.65-66"}, {"v": "", "q": "早発月経について正しいのは。", "o": ["通常1〜3回の出血のみで自然寛解する", "LH・FSHが思春期レベルに上昇し、GnRHアナログ治療が必要", "早発乳房より頻度が高く、エストロゲン持続高値を伴う", "二次性徴の発来が遅れ、生殖能力は低下する"], "a": 0, "e": "早発乳房、早発陰毛・早発腋毛よりはるかに頻度が低い。子宮内膜のエストロゲンに対する感受性亢進や一時的なエストロゲン分泌の可能性が考えられている。外陰腟炎、異物、性的虐待など他の性器出血をきたす原因を除外する必要がある。LH、FSHは前思春期レベルだが卵巣からの自律的分泌によりエストラジオールは上昇することがあり、時に超音波で卵巣に卵胞囊腫が認められる。治療は不要。生殖能力は正常。", "r": "治療 p.66"}]}, {"id": "u5", "lv": 1, "t": "思春期のものさし：早い・遅いの基準", "min": 5, "cats": "中枢性思春期早発症・思春期遅発症", "src": "診断の手引き p.263 ／ p.265 ／ 小児内分泌学 p.93-95 ／ 治療 p.66", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>「クラスでうちの子だけ胸がふくらんでいる」「うちの子だけ声変わりしていない」。早い・遅いの相談は、どちらも「ほかの子と比べて」から始まります。</div><p>「早い」「遅い」を言うには、ものさしが要ります。今日はそのものさしを、一枚にまとめます。</p>\n<h3>思春期はいつ始まるか</h3>\n<p>日本人の思春期の始まりは、<strong>男の子で10.8〜11.5歳、女の子で9.5〜10.0歳</strong>ごろです。男の子は<strong>精巣が3〜4 mLに大きくなる</strong>こと、女の子は<strong>乳房のふくらみ</strong>から始まります。男の子は陰茎の成長より精巣が先、という順番を覚えておくと、診察で役立ちます。陰毛は、色のついたまばらな毛から始まります。</p>\n<h3>早い：思春期早発症の基準（診断の手引き）</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>所見</th><th>年齢</th></tr>\n<tr><td>女児</td><td>乳房発育</td><td>7歳6か月未満</td></tr>\n<tr><td>女児</td><td>陰毛・腋毛・小陰唇の発育</td><td>8歳未満</td></tr>\n<tr><td>女児</td><td>初経</td><td>10歳6か月未満</td></tr>\n<tr><td>男児</td><td>精巣・陰茎・陰嚢の発育</td><td>9歳未満</td></tr>\n<tr><td>男児</td><td>陰毛</td><td>10歳未満</td></tr>\n<tr><td>男児</td><td>腋毛・ひげ・声変わり</td><td>11歳未満</td></tr></table></div>\n<p>これに、成長速度が2年以上にわたって標準より<strong>+1.5 SD以上</strong>速い、骨年齢が進んでいる、といった所見が加わります。</p>\n<h3>遅い：思春期遅発症</h3>\n<p><strong>男の子14歳、女の子13歳</strong>までに二次性徴が始まらないとき、または始まってから<strong>4.5〜5年たっても完成しない</strong>ときです。開始が遅いだけでなく、<strong>途中で止まる</strong>場合も含めます。女の子で15歳になっても初経がなければ検査を考えます。</p>\n<h3>1 SDは、およそ1年</h3>\n<p>思春期のいろいろな指標のばらつき（1 SD）は、どれも<strong>およそ1年</strong>です（乳房1.4年、陰毛1.6年、初経0.98年、成長のピーク1.05年）。つまり「2 SDの遅れ」は、<strong>だいたい2〜3年の遅れ</strong>のことです。数字に置き換えると、家族への説明がぐっと具体的になります。</p>\n<h3>ものさしを使うときの心構え</h3>\n<p>思春期の時期は、胎児期や新生児期のアンドロゲンの影響などで、ある程度あらかじめ決まっているのではないかとも言われています。女の子のほうが男の子より早く、性別で事情が違います。基準の線ぎりぎりの子の多くは<strong>正常のばらつき</strong>です。線を越えたかどうかに加えて、<strong>どれくらいの速さで進んでいるか</strong>、身長の伸びと骨年齢がどう動いているかをあわせて見ることが、次の回からの診断の基本になります。</p>", "keys": ["思春期開始：男児は精巣3〜4 mL（10.8〜11.5歳）、女児は乳房（9.5〜10.0歳）", "早発：女児の乳房7歳6か月未満、男児の精巣9歳未満など", "遅発：男児14歳・女児13歳までに開始しない、または途中で止まる", "思春期の指標の1 SDはおよそ1年", "線ぎりぎりの多くは正常のばらつき。進む速さも見る"], "upd": null, "quiz": [{"v": "", "q": "思春期早発症の診断の手引きで、女児の乳房発育の年齢基準は。", "o": ["6歳6か月未満", "7歳6か月未満", "8歳6か月未満", "9歳未満"], "a": 1, "e": "陰毛・腋毛・小陰唇発育は8歳未満、初経は10歳6か月未満。男児は精巣・陰茎・陰嚢の発育が9歳未満、陰毛10歳未満、腋毛・ひげ・声変わり11歳未満。", "r": "診断の手引き p.263"}, {"v": "", "q": "日本人の思春期開始年齢と、思春期遅発と考える年齢の組み合わせで正しいのは。", "o": ["開始：男子10.8〜11.5歳・女子9.5〜10.0歳、遅発：男子14歳・女子13歳", "開始：男子12.0〜12.5歳・女子11.0〜11.5歳、遅発：男子16歳・女子15歳", "開始：男子9.5〜10.0歳・女子8.5〜9.0歳、遅発：男子13歳・女子12歳", "開始：男子・女子とも10.0〜10.5歳、遅発：男子・女子とも14歳"], "a": 0, "e": "思春期開始は男子では精巣容積の増大（3〜4 mL）、女子では乳房腫大から始まる。思春期遅発症は平均より2〜2.5 SD遅くなっても思春期徴候の開始がない場合と定義され、±2 SDの範囲は男子8.2〜13.4歳、女子7.2〜12.8歳。体質性思春期遅発症は正常な思春期発来のスペクトラムと考えられ、男子に多く家族に思春期遅発傾向の人がいることが多い。", "r": "治療 p.66"}, {"v": "", "q": "思春期発来の各指標について、1標準偏差はおよそどれくらいか。", "o": ["約3か月", "約1年", "約3年", "約5年"], "a": 1, "e": "乳房発育1.4年、陰毛1.6年、初経0.98年、成長のピーク1.05年と報告されている。だから2SDの遅れはおよそ2〜3年の遅れに相当する。", "r": "表 p.265"}]}, {"id": "u6", "lv": 2, "t": "中枢性思春期早発症の診断", "min": 6, "cats": "中枢性思春期早発症", "src": "レクチャー5 p.227-263 ／ 小児内分泌学 p.304-305 ／ 治療 p.57", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>6歳10か月の女の子。半年前から胸がふくらみ、この1年で身長が9 cm伸びました。骨年齢は9歳。LHRH試験の結果が届きました。</div><p>前の回の基準に当てはめると、この子は7歳6か月未満の乳房発育で、成長も速い。思春期早発症の疑いは十分です。次の問いは、<strong>それが脳からの指令（中枢性）によるものか</strong>です。</p>\n<h3>中枢性と言うために必要なもの</h3>\n<p>手引き（平成30年度改訂）では、身体所見に加えて、<strong>下垂体からのゴナドトロピンの分泌亢進</strong>と<strong>性ステロイドの分泌亢進</strong>の両方がはっきりしていることが必要です。さらに、頭部MRIで器質的な原因の有無を確かめ、副腎や性腺の腫瘍、外からの性ステロイドを否定します。</p>\n<h3>LHRH試験の読み方</h3>\n<p>LHRHを注射して、LHがどれだけ立ち上がるかを見ます。中枢性を支持する目安は、</p>\n<div class=\"formula\">LH頂値 ＞ FSH頂値　または　LH頂値 5〜6.7 mIU/mL以上</div>\n<p>6.7を基準にすると、感度94%、特異度100%と報告されています（高感度法の値。テキストによって8以上かつLH＞FSHとする基準もあります）。思春期の指令が入ると、まずLHが優位に立ち上がる、という第1回の話がここで生きてきます。</p>\n<p>一方、指令を介さない末梢性の早発では、LHは前思春期のレベルに<strong>抑え込まれています</strong>。ここで二つに分かれます。</p>\n<h3>基礎値と超音波</h3>\n<p>LHの基礎値は、前思春期と重なるので単独では判断しにくいのですが、<strong>0.83 mIU/mL以上</strong>なら前思春期とは言いにくくなります。FSHだけでは判断できず、エストラジオールはふつうの測定法では感度が足りません。</p>\n<p>女の子では骨盤の超音波も役立ちます。<strong>子宮体部の長径4 cm以上、卵巣容積1 cm³以上</strong>は、二次性徴期に入ったことを示唆します。</p>\n<h3>落とし穴</h3>\n<ul><li><strong>乳幼児</strong>ではmini-pubertyでLHが測れる値まで上がっていることがあるので、年齢を考えて読む</li>\n<li>6歳未満の症例は非典型として、より丁寧に扱う</li>\n<li>成長が速いことは早発症を支持しますが、同時に<strong>骨年齢を進めて最終身長を削る</strong>方向でもあります。だからこそ治療を考える意味があります（次の次の回）</li></ul>\n<p>冒頭の子のLHRH試験で、LHがFSHを上回って立ち上がっていれば、中枢性と考えてMRIへ進みます。女の子は多くが特発性ですが、それでも画像は省略しません。その理由は、次の回で。</p>", "keys": ["中枢性：ゴナドトロピンと性ステロイドの分泌亢進の両方＋MRI", "LHRH試験：LH頂値＞FSH頂値、またはLH頂値5〜6.7以上", "末梢性ではLHは前思春期レベルに抑えられている", "LH基礎値0.83以上は前思春期とは言いにくい", "女児の超音波：子宮長径4 cm以上、卵巣1 cm³以上", "乳幼児はmini-pubertyに注意"], "upd": "LHRH試験の判定基準は測定法や手引きの版で数値が少し異なります。施設の測定系と最新の手引きで確認してください。", "quiz": [{"v": "", "q": "LHRH試験でLHRH依存性（中枢性）思春期早発症を支持する所見は。", "o": ["LH頂値8 mIU/mL以上かつLH頂値>FSH頂値", "FSH頂値10 mIU/mL以上かつFSH頂値>LH頂値（前思春期型の反応）", "LH頂値が前思春期レベルであること", "基礎値のみで判断できる"], "a": 0, "e": "高感度法での値。LHRH非依存性ではLH頂値は前思春期レベルに抑制されており、ここで二分される。", "r": "レクチャー5 p.261 / p.227"}, {"v": "", "q": "CPPのLHRH負荷試験で、ゴナドトロピン依存性と判断する目安は。", "o": ["LH頂値がFSH頂値を下回り、LH頂値2 mIU/mL以上", "LH頂値＞FSH頂値、またはLH頂値5〜6.7 mIU/mL以上", "FSH頂値10 mIU/mL以上、かつLH基礎値0.3 mIU/mL以上", "エストラジオール20 pg/mL以上、かつLH頂値3 mIU/mL以上"], "a": 1, "e": "6.7 mIU/mLを基準にすると感度94%、特異度100%。LH基礎値は前思春期との重複があり判断はむずかしいが、0.83 mIU/mL以上なら前思春期とはいいがたい。FSH単独では判断がむずかしく、エストラジオールは一般の測定系では感度不十分。女性では子宮体部長径4 cm以上、卵巣容積1 cm³以上が二次性徴期を示唆する。", "r": "治療 p.57"}, {"v": "", "q": "中枢性思春期早発症に伴う成長の変化として診断基準に挙がるのは。", "o": ["成長速度が2年以上にわたって標準値の1.5 SD以上", "成長速度が1年以上にわたって標準値の+2.0 SD以上", "身長が +2.0 SD を超えること", "骨年齢が暦年齢より1年以上進むこと（成長速度は問わない）"], "a": 0, "e": "骨年齢の促進とあわせて評価する。伸びが速いことは早発を支持するが、同時に最終身長を損なう方向でもある。", "r": "診断の手引き p.263"}]}, {"id": "u7", "lv": 2, "t": "男の子の早発は原因を探す", "min": 6, "cats": "中枢性思春期早発症", "src": "表1-3 p.227-229 ／ 小児内分泌学 p.93 ／ 治療 p.57-58", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>5歳の男の子。陰茎が大きくなり、声変わりも始まった。MRIで視床下部に腫瘤が見つかった。数年前の画像と比べても、大きさは変わっていません。小さいころ、理由のない笑い発作があったそうです。</div><p>思春期早発症は女の子に多い病気です（男女比はおよそ1:5〜1:8）。そして、男女で原因の顔ぶれがまったく違います。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>特発性</th><th>器質性</th></tr>\n<tr><td>女児</td><td>約70〜80%</td><td>少ないが、過誤腫が約10%</td></tr>\n<tr><td>男児</td><td>約40%</td><td>40〜50%以上</td></tr></table></div>\n<p><strong>男の子の早発は、器質性を疑ってかかる</strong>。これがこの回のいちばん大事な一文です。女の子でも視床下部過誤腫が1割ほどあるので、画像は省略しません。</p>\n<h3>器質性の原因</h3>\n<p>中枢性早発症の器質的な原因には、<strong>視床下部過誤腫</strong>、<strong>胚細胞腫瘍</strong>、脳炎・脳症のあと、頭部外傷、水頭症、くも膜嚢胞、<strong>頭部照射のあと</strong>などがあります。照射では、18 Gyほどの比較的低い線量で早発、30 Gyを超えると逆にゴナドトロピンの分泌不全のリスクが高まる、という線量による違いがあります。</p>\n<h3>冒頭の子：視床下部過誤腫</h3>\n<p>視床下部過誤腫は、<strong>LHRHを出す細胞を含んだ先天的な奇形</strong>で、腫瘍ではありません。だから、<strong>何年たっても大きさが変わらない</strong>ことが、画像での見分けのポイントになります。<strong>笑い発作（gelastic seizure）</strong>などのてんかんを伴う子と、早発以外の症状がない子が、ほぼ同じくらいいると報告されています。</p>\n<p>腫瘍ではないので、<strong>早発症のために摘出する対象にはなりません</strong>。治療はGnRHアナログによる内科的な抑制です。ただし、過誤腫ではふつうより多めの量（45〜60 μg/kgほど）が必要になることがあります。</p>\n<h3>胚細胞腫瘍との違い</h3>\n<p>同じ鞍上部の腫瘤でも、胚細胞腫瘍は大きくなっていき、尿崩症などほかの症状を伴うことがあります。男の子の性早熟では、<strong>hCG-β</strong>の測定が胚細胞腫瘍の手がかりになります（hCGを出す腫瘍は、中枢を介さずに男性化を起こすこともあります。これは末梢性の回で）。</p>\n<h3>もう一つの視点：将来の性腺機能</h3>\n<p>小さいころにがんの治療で頭部照射を受け、そのあと早発症になった子では、<strong>あとになって逆にゴナドトロピンが足りなくなったり</strong>、抗がん剤による性腺そのものの障害が出てきたりすることがあります。治療を始めるときに、その見通しも家族に伝えておきます。早発症の診断は、その子の思春期全体を長く見守るスタートでもあります。</p>", "keys": ["男児の早発は器質性を疑う。女児も過誤腫が約10%", "器質性：過誤腫・胚細胞腫瘍・脳炎後・外傷・水頭症・照射後", "照射：低線量（18 Gy）で早発、30 Gy超で分泌不全", "過誤腫は大きさが変わらない先天奇形。摘出せず内科治療", "男児の性早熟ではhCG-βも測る"], "upd": null, "quiz": [{"v": "", "q": "中枢性思春期早発症の原因分布として正しいのは。", "o": ["女児は約70%が特発性、男児は器質性が40〜50%を占める", "男女とも約70%が特発性で、器質性は少数", "女児は器質性が40〜50%、男児は約70%が特発性", "男女とも器質性が過半数で、MRIで原因が見つかることが多い"], "a": 0, "e": "男児の早発は器質性を疑ってかかる。女児でも視床下部過誤腫が約10%を占めるので、画像を省略はできない。", "r": "表2・3 p.229"}, {"v": "5歳男児。陰茎の発育と声変わり。MRIで視床下部に腫瘤を認め、年単位で大きさが変わらない。笑い発作の既往がある。", "q": "この病変への対応として適切なのは。", "o": ["胚細胞腫瘍であり、化学療法と放射線治療を行う", "先天奇形であり、腫瘍として摘出する対象ではない", "視床下部過誤腫であり、思春期早発症の原因なので摘出する", "視神経膠腫であり、増大するまで経過をみる"], "a": 1, "e": "視床下部過誤腫はLHRHを分泌する先天奇形。大きさが変わらないことが画像上の鑑別点になる。てんかんを伴う例と、早発以外の症状がない例がほぼ同数という報告がある。", "r": "p.227 / 表1 p.227"}, {"v": "", "q": "中枢性思春期早発症の器質的原因として挙げられているのは。", "o": ["視床下部過誤腫、胚細胞腫瘍、脳炎・脳症後、頭部外傷、水頭症、くも膜嚢胞、頭部照射後", "McCune-Albright症候群、testotoxicosis、hCG産生腫瘍、卵巣顆粒膜細胞腫", "testotoxicosis（LH受容体の機能獲得変異）", "hCG産生腫瘍"], "a": 0, "e": "McCune-Albright・testotoxicosis・hCG産生腫瘍はゴナドトロピン非依存性（末梢性）。男児の中枢性では器質性の割合が高く、頭部MRIが必須。", "r": "小児内分泌学 p.93"}]}, {"id": "u8", "lv": 3, "t": "GnRHアナログ治療", "min": 7, "cats": "中枢性思春期早発症", "src": "p.263-265 ／ 小児内分泌学 p.307-308 ／ 治療 p.58-61", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>中枢性思春期早発症と診断した8歳の女の子。お母さんは「治療すれば背は高くなりますか」と聞きます。正直に答えるには、治療の目的をはっきりさせておく必要があります。</div><p>治療の目的は、大きく二つです。<strong>最終身長を守ること</strong>と、同級生より早すぎる体の変化による<strong>心理的・社会的な負担を減らすこと</strong>。どちらを主に置くかで、治療の始め方も終わり方も変わります。</p>\n<h3>仕組み：刺激し続けて、黙らせる</h3>\n<p>GnRHアナログは、GnRH受容体を<strong>途切れなく刺激し続ける</strong>薬です。受容体はパルスで刺激されると働きますが、刺激され続けると数を減らして（ダウンレギュレーション）、黙ってしまいます。その性質を逆手に取っています。</p>\n<p>だから最初の1回は、いったん刺激が入って<strong>二次性徴が一時的に進む</strong>ことがあり、女の子では<strong>性器出血</strong>が起こることもあります。始める前に必ず伝えておきます。</p>\n<h3>用量と効果の確かめ方</h3>\n<div class=\"formula\">リュープロレリン 30 μg/kg を4週ごと皮下注（180 μg/kgまで増量可）</div>\n<p>4週より間隔をあけると、性ホルモンがまた上がって所見が悪化することがあるので、間隔は守ります。必要量は人によって違い、増量は重症という意味ではありません。点鼻薬（ブセレリン）もありますが、1日3〜6回の点鼻が必要で効果が安定しないため、注射が難しい子など限られた場面で使います。</p>\n<p>効果は、LHRH試験で<strong>LH頂値が4 mIU/mL未満</strong>に抑えられているかで見ます。<strong>30分値だけ</strong>測れば十分で、何度も採血する必要はありません。成長の伸びが落ち着いているか、骨年齢の進みが緩んだかもあわせて見ます。</p>\n<h3>冒頭の問いへの答え</h3>\n<p>正直に言うと、<strong>開始が早いほど身長への効果は期待できますが、遅いと期待しにくい</strong>のです。身長予後の改善が期待しにくいのは、<strong>女の子は6歳以降、男の子は9歳以降</strong>に始めた場合や、ゆっくり進むタイプです。境界の年齢の子では最終身長の改善がはっきりしないという報告があり、ESPEのコンセンサスでも「低身長を予防する目的での安易な使用は慎むべき」とされています。</p>\n<p>だから8歳の女の子なら、「身長のためというより、気持ちや生活の負担を減らすため」という位置づけで、<strong>期間を区切って</strong>使うかを相談します。始める前に、いつまで続けるかの見通しも一緒に決めておくのが望ましいのです。なお、早く閉じかけた骨端線を開く力はないので、抑制だけでは身長が戻らないこともあります。</p>\n<h3>やめどきと、やめたあと</h3>\n<p>明確な基準はありませんが、<strong>骨年齢で女子12.5歳、男子14歳</strong>あたりが一つの目安です。やめると二次性徴は速やかに戻り、女の子では<strong>おおよそ1〜2年で月経が来ます</strong>（治療前に出血があった子では3〜6か月以内）。この期間は家族に先に伝えておきます。国内の長期フォローでは、成人身長は男性平均163.2 cm、女性154.5 cmで、約9割が目標身長の範囲に入っていました。</p>", "keys": ["目的は最終身長と心理社会的負担の軽減", "持続刺激でGnRH受容体を黙らせる。初回は一時的に進む", "リュープロレリン30 μg/kgを4週ごと（180まで）", "効果判定はLH頂値4未満。30分値で十分", "女児6歳・男児9歳以降の開始は身長効果を期待しにくい", "中止の目安は骨年齢 女12.5・男14。月経は1〜2年で"], "upd": "用量や中止時期の考え方は施設や手引きの改訂で変わることがあります。最新の情報で確認してください。", "quiz": [{"v": "", "q": "中枢性思春期早発症に対するリュープロレリンの標準的な用量は。", "o": ["3 μg/kg を4週ごと", "30 μg/kg を4週ごと", "300 μg/kg を4週ごと", "体重によらず一定量"], "a": 1, "e": "視床下部過誤腫では45〜60 μg/kg程度を要することがある。効果判定はLHRH試験で前思春期レベル（1〜2 mIU/mL）に抑えられているかを確認する。", "r": "p.263"}, {"v": "", "q": "CPPに対するGnRHアナログ治療で、身長予後の改善が期待できないとされる開始年齢は。", "o": ["女性6歳以降、男性9歳以降", "女性8歳以降、男性10歳以降", "女性4歳以降、男性6歳以降", "女性9歳以降、男性11歳以降"], "a": 0, "e": "緩徐に二次性徴が進行する場合（slowly progressive variant）も同様。成人身長の改善は軽症例では期待できない。身長予後の改善が望めない場合、しかるべき年齢（心理社会的負担が低くなる年齢）まで期間を限って治療することが望ましく、あらかじめ治療期間も相談したうえで開始する。幼少期に悪性疾患で頭部照射を受けてCPPを発症したケースでは、遅れて中枢性性腺機能低下症や化学療法による原発性性腺機能不全が生じる可能性をあらかじめ伝える。", "r": "治療 p.58"}, {"v": "", "q": "CPPのGnRHアナログ治療中止の目安として挙げられている骨年齢は。", "o": ["女子12.5歳、男子14歳", "女子11歳、男子13歳", "女子13.5歳、男子15歳", "女子10.5歳、男子12歳"], "a": 0, "e": "治療中止時期の明確な基準はない。二次性徴は治療中止後速やかに回復し、女子では治療前に性器出血のあった症例では3〜6か月以内、なかった例では2年以内にほぼ全例で月経が発来しLHサージも確認される。国内のリュープリン®治験の長期フォローでは男性の平均成人身長163.2 cm、女性154.5 cmで、男性91%、女性89%がtarget rangeに入っていた。", "r": "治療 p.59-60"}]}, {"id": "u9", "lv": 2, "t": "末梢性の性早熟：指令なしで進むもの", "min": 6, "cats": "末梢性の性早熟", "src": "症例1・3 p.233-237 ／ 小児内分泌学 p.94, 309, 313 ／ 治療 p.60, 64-65", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>6歳の男の子。声変わりと陰毛。でもLHRH試験ではLHが0.5以下と、しっかり抑えられています。診察すると、片方の精巣にしこりがありました。</div><p>体は思春期のように進んでいるのに、脳からの指令（LH）は出ていない。これが<strong>末梢性（ゴナドトロピン非依存性）の性早熟</strong>です。性ステロイドが、指令とは関係なく、どこかから出ています。</p>\n<h3>いちばんの手がかり：性腺が小さい</h3>\n<p>ゴナドトロピンを介さないので、<strong>精巣や卵巣はふつう大きくなりません</strong>。性徴だけが進んでいるのに性腺が小さい、という<strong>ちぐはぐさ</strong>が手がかりです。冒頭の子は、精巣に腫瘍があり、そこから性ステロイドが出ていました。腫瘍を取ったあと、LHの頂値が正常に戻ったことが、抑えられていた指令が解放されたことを示しています。</p>\n<h3>ホルモンで出どころを探す</h3>\n<p>LH・FSHが低いとき、何が高いかで出どころが分かれます。</p>\n<ul><li><strong>DHEA-Sが高い</strong> → 副腎腫瘍、先天性副腎過形成、早発陰毛</li>\n<li><strong>エストロゲンが高い</strong> → 卵巣腫瘍、機能性の卵巣嚢腫、McCune-Albright症候群</li>\n<li><strong>テストステロンが高い</strong> → 精巣腫瘍、家族性男性思春期早発症（testotoxicosis）、外からのアンドロゲン</li>\n<li><strong>hCG-βが高い</strong> → hCG産生腫瘍</li></ul>\n<p>卵巣の顆粒膜細胞腫を疑ったときは、<strong>AMH</strong>がマーカーとして役立ちます（巻物の症例では、術前に高く、摘出後に下がりました）。</p>\n<h3>hCG産生腫瘍：男の子だけ、そして精巣が少し大きくなる例外</h3>\n<p>hCGはLHとよく似ていて、LH受容体に働いて精巣のライディッヒ細胞にテストステロンを作らせます。だから男の子は男性化し、<strong>精巣も少しだけ大きく</strong>なります（「性腺が大きくならない」原則の例外です）。女の子では、卵胞が育ってエストロゲンを作るにはFSHの作用も必要なので、hCG産生腫瘍だけではふつう早発になりません。</p>\n<p>頭蓋内の胚細胞腫瘍は、日本では欧米の30〜50倍も多く、松果体や鞍上部など正中に生じます。血液や髄液の<strong>hCG-β</strong>がマーカーです。</p>\n<h3>そのほかの「指令なし」</h3>\n<ul><li><strong>7歳未満のCushing症候群</strong>：副腎腫瘍（とくに癌）が多く、アンドロゲンも出すので男性化と成長促進が前に出る。コルチゾール過剰による成長障害が目立たないこともある</li>\n<li><strong>治療が足りない21水酸化酵素欠損症</strong>：成長と骨年齢の促進、早発陰毛</li>\n<li><strong>重症の甲状腺機能低下症（Van Wyk-Grumbach）</strong>：非常に高いTSHがFSH受容体を刺激する。ほかの性早熟と違って、<strong>成長率は低く、骨年齢は遅れる</strong>のが手がかり。甲状腺ホルモンの補充で改善する</li></ul>\n<p>なお、末梢性の早発が長く続くと、性ステロイドに引っぱられて<strong>あとから中枢性の早発が重なる</strong>ことがあります。そのときは、GnRHアナログも併用します。</p>", "keys": ["末梢性はLHが抑えられているのに性徴が進む", "性腺が大きくならない「ちぐはぐさ」が手がかり", "DHEA-S・エストロゲン・テストステロン・hCG-βで出どころを探す", "hCG産生腫瘍は男児のみ、精巣が少し大きくなる例外", "Van Wyk-Grumbachは成長率が低く骨年齢が遅れる"], "upd": null, "quiz": [{"v": "", "q": "LHRH非依存性思春期早発症で原則としてみられないのは。", "o": ["精巣・卵巣の腫大", "陰毛や腋毛の発生（副腎性徴）", "乳腺の腫大", "骨年齢の促進"], "a": 0, "e": "ゴナドトロピンを介さないので性腺そのものは大きくならない。性徴だけが進んで性腺が小さいという不一致が手がかりになる。", "r": "p.233"}, {"v": "", "q": "性早熟の診断アルゴリズムで、LH・FSHが低値でDHEA-Sが高値のときに考えるのは。", "o": ["副腎腫瘍、先天性副腎過形成、特発性早発陰毛", "中枢性思春期早発症（DHEA-Sは思春期開始で上昇する）", "hCG産生腫瘍", "機能性卵巣嚢腫"], "a": 0, "e": "LH・FSH低値でエストロゲン高値なら卵巣腫瘍・機能性嚢腫・McCune-Albright、テストステロン高値なら精巣腫瘍・testotoxicosis・外因性アンドロゲン。hCG-β上昇ならhCG産生腫瘍。", "r": "小児内分泌学 p.94"}, {"v": "", "q": "hCG産生腫瘍による思春期早発症について正しいのは。", "o": ["男子ではLH作用のみの亢進で、精巣容積の増大は軽度", "女子ではFSH作用の亢進で、卵巣囊胞が必発する", "男子ではLH/FSH基礎値が高値で、LHRH負荷に過剰反応", "男女とも精巣・卵巣が著明に増大し、骨年齢は遅延する"], "a": 0, "e": "hCGがLH受容体を介してテストステロンの産生・分泌を促進させ男性化を引き起こす。女子では卵胞発育と顆粒膜細胞でのアロマターゼ産生にFSH作用を必要とするため、hCG産生腫瘍は一般的には思春期早発症の原因とならない（ごくまれにアロマターゼも産生する腫瘍の女子例が報告）。血中テストステロン高値にもかかわらずLH/FSH基礎値低値、LHRH負荷でLH/FSH低反応で血中hCG高値なら診断可能。頭蓋内胚細胞腫瘍では超高感度法で測定した血中／髄液中hCGβが腫瘍マーカーとして有用。胚細胞腫のうち胚腫の生命予後は比較的良好で、中枢神経外胚細胞腫瘍の予後は残存腫瘍が全摘できた場合は良好だが12歳以上の縦隔腫瘍は予後不良。", "r": "治療 p.60"}]}, {"id": "u10", "lv": 3, "t": "McCune-Albrightと家族性男性思春期早発症", "min": 6, "cats": "末梢性の性早熟", "src": "p.237 ／ 小児内分泌学 p.310-311 ／ 治療 p.61-64", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>3歳の女の子が繰り返す性器出血で受診。背中に、輪郭のギザギザした大きなカフェオレ斑があります。超音波では卵巣に大きな嚢胞。</div><p>末梢性の性早熟の中でも、分子の仕組みが鮮やかに分かっている二つの病気を取り上げます。どちらも「スイッチが入りっぱなし」の病気です。</p>\n<h3>McCune-Albright症候群（MAS）</h3>\n<p>原因は<strong>GNAS</strong>の変異です。GNASが作るGsαは、ホルモンの信号を受けてcAMPを作る「スイッチ」ですが、ふつうは自分でGTPを分解してスイッチを切ります。MASの変異（95%以上がArg201）ではこの分解ができず、<strong>スイッチが入りっぱなし</strong>になって、cAMPが出続けます。</p>\n<p>大事なのは、この変異が<strong>生まれる前の発生の途中で、体の一部の細胞にだけ</strong>起きることです（体細胞モザイク）。だから、変異を持つ細胞がどこにあるかで症状が決まり、<strong>三つの主な症状（性早熟・カフェオレ斑・多骨性線維性骨異形成）が全部そろうとは限りません</strong>。一つしかない子も多いのです。</p>\n<ul><li><strong>カフェオレ斑</strong>：色素細胞のMC1受容体（Gsαにつながる）が働きっぱなしで色素が増える。輪郭がギザギザ（「メイン州の海岸線」）</li>\n<li><strong>線維性骨異形成</strong>：骨髄の間質細胞がうまく分化できず、未熟な線維性の骨ができる</li>\n<li><strong>性早熟</strong>：卵巣が勝手にエストロゲンを作る。冒頭の子のように、嚢胞と性器出血を繰り返す</li></ul>\n<p>甲状腺、副腎（Cushing）、GHなど、ほかの内分泌の亢進も合併しうるので、全身を見ます。ちなみに、同じGNASでも機能が<strong>なくなる</strong>変異は、巻の四で見た偽性副甲状腺機能低下症（PHP Ia）です。同じ遺伝子が、入りっぱなしと切れっぱなしで、正反対の病気を作ります。</p>\n<h3>MASの治療</h3>\n<p>女の子の性早熟には、アロマターゼ阻害薬の<strong>レトロゾール</strong>（2.5 mg/日、適応外）が第一選択とされ、性器出血を減らし成人身長を改善する報告があります。効かなければタモキシフェンやフルベストラント。あとから中枢性に移れば、GnRHアナログを加えます。<strong>卵巣嚢腫の摘出は原則しません</strong>（捻転のリスクがあるときだけ考える）。骨病変にはビスホスホネートを使い、低リン血症（FGF23の過剰による）があれば骨病変を悪くするので補正します。</p>\n<h3>家族性男性思春期早発症（testotoxicosis）</h3>\n<p>こちらは<strong>LH受容体の機能獲得変異</strong>で、常染色体顕性の遺伝です。LHが来なくても受容体が勝手に働いて、テストステロンを作り続けます。<strong>男の子だけ</strong>が4歳ごろまでに発症し、成長と骨年齢の促進、陰茎・陰毛の発育が出ますが、<strong>精巣は性徴の進み具合に比べて小さめ</strong>です。女の子は保因者でも発症せず、生殖能力も保たれます。</p>\n<p>治療は、男性ホルモンの作用を止める薬（スピロノラクトンやビカルタミド）と、テストステロンからエストロゲンを作らせない薬（アナストロゾール）の組み合わせです（いずれも適応外）。ここでも、あとから中枢性が重なれば、GnRHアナログを併用します。</p>\n<h3>もう一つ：自律性の卵巣嚢胞</h3>\n<p>卵巣嚢胞が自分でエストロゲンを出して性早熟を起こすことがあります。多くは6週ほどで自然に消えるので、まず見守ります。<strong>繰り返す例ではMASとの見分け</strong>が大切です。</p>", "keys": ["MAS：GNAS（Arg201）の体細胞モザイク。Gsαが入りっぱなし", "三主徴は全部そろうとは限らない", "MAS女児の性早熟にはレトロゾール。卵巣嚢腫は原則摘出しない", "testotoxicosis：LH受容体の機能獲得、男児のみ、精巣は相対的に小さい", "同じGNASでも機能喪失はPHP Ia"], "upd": "MASやtestotoxicosisの薬物治療は適応外のものが多く、用量も含めて専門施設の最新の方針で確認してください。", "quiz": [{"v": "", "q": "McCune-Albright症候群の分子基盤は。", "o": ["GNASの生殖細胞系列変異", "GNASの体細胞変異", "MKRN3の変異", "CHD7の変異"], "a": 1, "e": "モザイクだから組織ごとに現れ方が違い、3徴（性早熟・カフェオレ斑・多骨性線維性骨異形成）すべてが揃うとは限らない。", "r": "p.237 / 文献"}, {"v": "", "q": "McCune-Albright症候群のGsα変異の分子機構として正しいのは。", "o": ["GsαのGTPase活性が失われてGTP結合型のまま活性化し続け、cAMPが持続的に増加する。発生途中の体細胞変異でモザイクになるため、症状は組織分布で決まる", "Gsαが受容体に結合できず、cAMPが減少する", "生殖細胞系列の変異で全身の全細胞が変異をもち、GTPの加水分解が速くなってシグナルが早く切れる", "GTPの加水分解が速くなり、シグナルが早く切れる"], "a": 0, "e": "95%以上がコドン201（Arg201）の変異。線維性骨異形成、カフェオレ斑、性早熟が3主徴だが1つしかない例も多い。甲状腺・副腎・GHなど他の内分泌亢進も合併しうる。", "r": "小児内分泌学 p.310-311"}, {"v": "", "q": "家族性男性思春期早発症（familial testotoxicosis）の原因と遺伝形式は。", "o": ["LH受容体の機能獲得型生殖細胞変異、常染色体顕性", "GNAS1の機能獲得型体細胞変異、モザイク", "LH受容体の機能喪失型変異、X連鎖潜性", "アロマターゼ遺伝子の機能獲得型変異、常染色体潜性"], "a": 0, "e": "LH受容体遺伝子（LHCGR）は2p21に座位する7回膜貫通型受容体。男子のみが症状を呈し4歳頃までに発症。LHの刺激がなくても受容体が活性化されテストステロンの産生・分泌が亢進し、成長・骨年齢促進、陰茎・陰毛発育が認められ、精巣容量は陰茎・陰毛の成熟度に比べ相対的に小さい。臨床症状・家族歴に加え、血中テストステロン高値にもかかわらずLH/FSH基礎値低値、LHRH負荷での低反応で疑い、MAS・腫瘍性・副腎性を除外、末梢血白血球DNAでのLH受容体遺伝子解析で確定診断。女子では発症せず生殖能力も保たれる。", "r": "治療 p.61"}]}, {"id": "u11", "lv": 1, "t": "思春期遅発症：まずは体質性を考える", "min": 5, "cats": "思春期遅発症", "src": "p.265-267 ／ 小児内分泌学 p.95-97, 329-330 ／ 治療 p.1060", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>中学3年の男の子。クラスでいちばん小さく、声変わりもまだ。精巣は2 mL。本人はあまり気にしていない様子ですが、お母さんが心配して連れてきました。</div><p>思春期が遅い子のいちばん多い原因は、<strong>体質性思春期遅発症（CDGP）</strong>です。いわゆる「おくて」で、正常な思春期の幅の一部と考えられています。男の子に多く、家族にも遅かった人がいることがよくあります。</p>\n<h3>CDGPの姿</h3>\n<p>身長の伸び方は正常範囲ですが、全体に<strong>2〜3年遅れて</strong>進みます。<strong>クラスでいちばん小さくなった時期</strong>に外来に来ることが多く、親も同じ経過だった、という話がよく聞かれます。成長期が長く続くので、成人身長はおおむね正常範囲に収まります。骨年齢は遅れていて（暦年齢より2年以上の遅れが「明らかな遅延」の目安）、IGF-1も暦年齢に比べて低めに出ます。</p>\n<h3>問診で聞くこと</h3>\n<ul><li><strong>家族の思春期</strong>：お母さんの初経の年齢、お父さんの声変わりや背が急に伸びた時期</li>\n<li><strong>においが分かるか</strong>（分からなければKallmann症候群を考える）</li>\n<li><strong>停留精巣や小陰茎の既往</strong>（先天性の低ゴナドトロピン性を示唆）</li>\n<li>体重の変化、運動量、食事、慢性の病気</li></ul>\n<h3>「機能性」の遅れ</h3>\n<p>体質性と病気の間に、<strong>機能性</strong>の遅れがあります。慢性の消耗性の病気（炎症性腸疾患など）、高度の肥満、<strong>神経性食欲不振症</strong>、<strong>過度の運動</strong>、甲状腺機能低下症などで、LHRHの指令が抑えられます。第1回で見たように、栄養やエネルギーの不足は思春期のブレーキになります。女の子では、やせや運動、ストレスによるエネルギー不足でレプチンが下がり、GnRHのパルスが止まる<strong>機能性視床下部性無月経</strong>がアスリートなどに多く見られます。原因を取り除けば戻ります。</p>\n<h3>最初に置く二つの病気</h3>\n<p>思春期の遅れの鑑別で、最初に頭に置くのが、性腺そのものの病気である<strong>Klinefelter症候群</strong>（男性の約500人に1人）と<strong>Turner症候群</strong>（女性の約2,000人に1人）です。決してまれではありません。</p>\n<ul><li><strong>Klinefelter</strong>：思春期前から背が高めで推移する。精巣が5 mLを超えることはまれなのに、<strong>陰毛は生えてくることが多い</strong>。陰毛があるから正常、とは言えないので、必ず精巣の大きさを測る</li>\n<li><strong>Turner</strong>：<strong>月経がある人もいる</strong>ので、月経があることは否定の根拠にならない。低身長と身体所見があれば染色体を調べる</li></ul>\n<p>性腺そのものが悪い場合、ゴナドトロピンは<strong>10歳ごろまでに上がってくる</strong>ので、LH・FSHが高ければこちらを考えます。身体所見だけでは区別できないので、LH・FSH・性ステロイドの測定は必須です。</p>\n<p>冒頭の子は、ゴナドトロピンが低いなら、CDGPか、指令が出ない病気（低ゴナドトロピン性）かの二択になります。この見分けがいちばん難しく、それが次の回のテーマです。</p>", "keys": ["思春期遅発の最多はCDGP（おくて）。家族歴が多い", "CDGPは2〜3年遅れて進み、成人身長はおおむね正常", "問診：家族の思春期・嗅覚・停留精巣/小陰茎・体重と運動", "機能性の遅れ：慢性疾患・肥満・食欲不振症・過度の運動", "Klinefelter（陰毛はあっても精巣が小さい）とTurner（月経があっても否定できない）"], "upd": null, "quiz": [{"v": "", "q": "思春期遅発症の定義として述べられているのは。", "o": ["男子14歳・女子13歳までに二次性徴が始まらない、または思春期開始から4.5〜5年以内に完了しない", "男子16歳・女子15歳までに二次性徴が始まらない場合で、進行停止は含めない", "男子12歳・女子11歳までに二次性徴が始まらない", "初経が15歳までに来ない場合のみ"], "a": 0, "e": "開始が遅いだけでなく、途中で止まる（進行が停止する）場合も含める。体質性思春期遅発症が多いが、低ゴナドトロピン性との鑑別が難しい。", "r": "小児内分泌学 p.95"}, {"v": "", "q": "体質性思春期遅発症の典型的な経過は。", "o": ["身長増加は正常範囲だが2〜3年の遅れがあり、家族歴を認めることが多い", "乳児期から成長率が低く、骨年齢は暦年齢どおりで、家族歴はなく多くは低ゴナドトロピン性へ移行する", "骨年齢が促進し、思春期は遅れて来るが早く終わる", "家族歴はなく、多くは低ゴナドトロピン性に移行する"], "a": 0, "e": "クラスで一番小さくなった時期に外来に来る。かつて親も同じ経過をたどっていることが多い。", "r": "p.266"}, {"v": "", "q": "Klinefelter症候群の性腺所見として正しいのは。", "o": ["精巣は5 mLを超えて大きくなることはまれだが、男性ホルモンによる陰毛発生は生じることがまれではない", "精巣は思春期に正常に発育して15 mL以上になり、精子形成のみが障害される", "精巣は小さく、男性ホルモンによる陰毛はまったく生じない", "精巣容積は10 mLを超えるが、精細管の硝子化が進む"], "a": 0, "e": "陰毛があるから正常、とは言えない。精巣容積を必ず測る。", "r": "p.267"}]}, {"id": "u12", "lv": 2, "t": "体質性か、低ゴナドトロピン性か", "min": 6, "cats": "思春期遅発症・低ゴナドトロピン性", "src": "症例1 p.239-247 ／ 小児内分泌学 p.316-322 ／ 治療 p.66-67", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>前の回の中学3年の男の子。LHもFSHもテストステロンも低い。LHRH試験の反応も弱い。「ただのおくて」なのか、「指令が出ない病気」なのか。</div><p>体質性思春期遅発症（CDGP）と、低ゴナドトロピン性性腺機能低下症（HH）。この二つの見分けは、<strong>思春期の外来でいちばん難しい問題</strong>の一つです。どちらも「まだ指令が出ていない」状態なので、思春期が始まる前は<strong>LH・FSHの値が大きく重なる</strong>からです。</p>\n<h3>検査の限界を知る</h3>\n<ul><li><strong>LHRH試験</strong>：HHでもCDGPでも反応が弱く出ることがあり、決め手にはならない。LH頂値2.8未満かつテストステロン基礎値1.04 ng/mL未満ならHHの可能性が高い、という報告はあるが、重なりは大きい</li>\n<li><strong>hCG負荷試験</strong>：HHでも精巣が反応することがある。性腺が反応する力と、上流が指令を出す力は別物なので、反応しても上流の障害は否定できない</li>\n<li>インヒビンB、INSL3なども検討されているが、まだ確立していない</li></ul>\n<h3>手がかりになるもの</h3>\n<p>決め手がないぶん、手がかりを積み重ねます。</p>\n<ul><li><strong>停留精巣・小陰茎の既往</strong>、<strong>嗅覚障害</strong> → HHらしい</li>\n<li><strong>家族の思春期遅発</strong> → CDGPらしい</li>\n<li><strong>乳児期（mini-puberty）のゴナドトロピンの記録</strong>があれば、高ければCDGP、低ければHH（第2回の伏線です）</li>\n<li><strong>夜間のLHのパルス</strong>：CDGPなら、そろそろ夜にLHの脈が出はじめる。巻物の症例では、夜間20分ごとにLHを測って19回とも0.03以下で、まったく脈がないことがHHを強く示唆した</li></ul>\n<h3>結局は「時間」が答える</h3>\n<p>多くの場合、確定は<strong>思春期の年齢を過ぎて、自然に思春期が来るかどうか</strong>を見るしかありません。注意深い診察と経過観察がいちばん大事です。</p>\n<h3>CDGPへの少量の性ステロイド</h3>\n<p>待つことが一つの道ですが、本人のつらさが強いときや、HHとの見分けが難しいときは、<strong>少量の性ステロイドで二次性徴を同級生にそろえる</strong>ことを考えます。</p>\n<div class=\"formula\">男子：エナント酸テストステロン 50 mg を4週ごと 6〜9か月（適応外）<br>女子：エストラジオール貼付 0.09 mg を2日ごと 6〜9か月（適応外）</div>\n<p>大事なのは、治療中はゴナドトロピンが抑えられているので、<strong>自分の思春期が来たかは、いったん中断しないと分からない</strong>ことです。中断して、精巣が大きくなりLH・FSH・テストステロンが立ち上がってくれば、本来の思春期が始まったと判断して終了します。骨成熟を進めすぎないよう注意し、やめたあとも思春期が完成していくかを見守ります。<strong>5年たっても完成しなければ、HHを考えます</strong>。</p>\n<p>成長率が2 cm/年を下回るようなら、治療開始を考える一つの目安になります。テストステロン治療中はニキビや声変わり、筋肉の発達が早く出ます。</p>", "keys": ["CDGPとHHは思春期前にLH・FSHが重なり、見分けが最も難しい", "LHRH試験・hCG試験は決め手にならない", "手がかり：停留精巣・小陰茎・嗅覚・家族歴・乳児期の値・夜間LHパルス", "多くは自然な思春期の到来で確定する", "少量の性ステロイド中は中断して自然発来を確かめる。5年で完成しなければHH"], "upd": null, "quiz": [{"v": "", "q": "体質性思春期遅発症と低ゴナドトロピン性性腺機能低下症の鑑別が難しい理由は。", "o": ["発来前にはLH・FSHの値が両者で大きく重なるから", "LHRH負荷でどちらもLHが過大反応を示し、画像所見も同じだから", "画像所見が同じで、嗅覚検査でも区別できないから", "どちらも骨年齢が促進するから"], "a": 0, "e": "時間をかけて経過をみる、あるいは性ステロイド補充を一度中断して自然発来の有無を確認する、という方法で分けていく。", "r": "p.267"}, {"v": "停留精巣の手術歴がある男子。思春期未発来。夜間20分ごとのLH測定で19回とも0.03 mIU/mL以下であった。", "q": "この所見が示すのは。", "o": ["体質性思春期遅発症で、LHの夜間分泌はまだ立ち上がっていない", "低ゴナドトロピン性性腺機能低下症を強く示唆する", "高ゴナドトロピン性性腺機能低下症（精巣固定術による精巣障害）", "測定感度以下の値は解釈できず、LHRH負荷が必須"], "a": 1, "e": "体質性遅発症なら夜間に脈動が出はじめる。まったく出ないことが決め手になる。停留精巣・小陰茎の既往は、その一部がゴナドトロピン分泌不全に由来するという意味で手がかりになる。", "r": "症例1 p.239 / p.247"}, {"v": "", "q": "体質性思春期遅発症（CDGP）と低ゴナドトロピン性性腺機能低下症を分ける指標として報告されているのは。", "o": ["LHRH負荷でLH頂値<2.8 mIU/mLかつ基礎テストステロン<1.04 ng/mLなら低ゴナドトロピン性の可能性が高い。インヒビンB、INSL3、hCG負荷後テストステロンも検討されるが確立していない", "LHRH負荷でLH頂値≥10 mIU/mLなら低ゴナドトロピン性で、CDGPでは骨年齢が促進するため両者は容易に区別できる", "CDGPでは骨年齢が促進する", "両者は臨床的に区別がつかないため、全例を治療する"], "a": 0, "e": "CDGPのLH頂値は全例≥4.0 mIU/mLという報告もあるがオーバーラップが大きい。停留精巣・小陰茎・嗅覚障害・家族歴が手がかり。確定は思春期年齢を過ぎて自然発来の有無を確認するしかないことも多い。", "r": "小児内分泌学 p.316-322"}]}, {"id": "u13", "lv": 3, "t": "先天性低ゴナドトロピン性：Kallmannとその仲間", "min": 6, "cats": "低ゴナドトロピン性", "src": "p.241-248 ／ 治療 図 p.647 ／ 小児内分泌学 p.298, 318-328", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>思春期が来ない高校1年の男の子。何気なく「カレーのにおい、分かる？」と聞くと、少し考えて「あんまり」。</div><p>第1回で置いた伏線を回収します。LHRHニューロンは、<strong>鼻の奥で生まれ、嗅神経に沿って視床下部まで旅をしてくる</strong>のでした。この旅が途中で止まると、思春期の指令が出ないうえに、においも分からなくなります。これが<strong>Kallmann症候群</strong>です。冒頭の子に必要なのは、嗅覚検査と、MRIで嗅球があるかの確認です。</p>\n<h3>どの段階が壊れたかで、嗅覚が変わる</h3>\n<p>先天性低ゴナドトロピン性性腺機能低下症（CHH）の原因遺伝子は、働く段階で分けると整理できます。</p>\n<ul><li><strong>LHRHニューロンの運命決定</strong>：FGF8/FGFR1、SOX2、CHD7など</li>\n<li><strong>嗅神経の伸び方とLHRHニューロンの移動</strong>：ANOS1（KAL1）、PROK2/PROKR2、SEMA3A、NSMF、WDR11、SOX10など → <strong>嗅覚障害を伴いやすい（Kallmann型）</strong></li>\n<li><strong>受容体やリガンドの異常</strong>（GnRH受容体、キスペプチン受容体など） → 嗅覚は保たれる</li></ul>\n<p>CHHの半数以上が嗅覚障害を伴います。一人に複数の遺伝子の変異が重なる（oligogenic）ことも多いのが特徴です。</p>\n<h3>体のほかの場所に出るサイン</h3>\n<ul><li><strong>ANOS1</strong>（X連鎖）：片方の腎臓がない、鏡像運動（片手を動かすと反対の手も動く）</li>\n<li><strong>CHARGE症候群</strong>（CHD7）：コロボーマ、心奇形、後鼻孔閉鎖、難聴</li>\n<li><strong>Waardenburg症候群</strong>（SOX10）：白髪、虹彩異色、難聴、Hirschsprung病</li>\n<li><strong>FGF8/FGFR1</strong>：裂手裂足、歯の欠損</li>\n<li><strong>Bardet-Biedl症候群</strong>：網膜色素変性、肥満、多指症、腎の異常。線毛の病気。夜盲が診断のきっかけになることも</li></ul>\n<h3>ホルモンのパターンが特徴的なもの</h3>\n<ul><li><strong>DAX1（NR0B1）</strong>：X連鎖で、<strong>副腎低形成</strong>を伴う。ゴナドトロピンを入れても精子ができにくい</li>\n<li><strong>レプチン／レプチン受容体</strong>：早くからの高度肥満。レプチン欠損ではレプチンの補充で思春期が来る</li>\n<li><strong>LHB/FSHB</strong>：片方のゴナドトロピンだけが低い</li>\n<li><strong>PROKR2</strong>：孤発の性腺機能低下から、GH・ACTH・TSHも欠ける複合型下垂体機能低下まで、幅広い</li></ul>\n<h3>後天性のもの</h3>\n<p>胚細胞腫瘍やプロラクチノーマ、Rathke嚢胞、下垂体炎、サルコイドーシス、頭部外傷、そして<strong>頭部照射（30 Gy超）</strong>でも起こります。照射ではGHとゴナドトロピンが先に障害され、治療が終わって何年もたってから出てくることがあります。思春期の伸びがないので、成長率の低下で気づかれます。</p>\n<h3>治るCHHもある</h3>\n<p>治療を始めたあとに、<strong>10〜20%</strong>で自分の機能が戻ることが知られています（CHH reversal）。Kallmann症候群でも起こります。ただし予測はできず、戻ったあとにまた落ちることもあるので、定期的なフォローを続けます。</p>", "keys": ["Kallmann：LHRHニューロンの移動障害＋嗅覚障害", "遺伝子は段階で整理：移動の異常は嗅覚障害を伴いやすい", "ANOS1は腎無形成・鏡像運動、CHD7はCHARGE、SOX10はWaardenburg", "DAX1は副腎低形成、レプチン異常は高度肥満", "頭部照射30 Gy超で後天性。10〜20%で機能が回復しうる"], "upd": null, "quiz": [{"v": "", "q": "Kallmann症候群の病態として正しいのは。", "o": ["GnRH受容体の機能喪失で、嗅覚は保たれる", "LHRHニューロンの遊走障害に嗅覚障害を伴う", "下垂体前葉の形成異常で、複数の前葉ホルモンが欠損する", "LHβ鎖の変異で、LHのみが作用しない"], "a": 1, "e": "嗅神経とLHRHニューロンが同じ経路をたどるため、両方が障害される。KAL1（X連鎖）、FGFR1、PROKR2、CHD7などが知られ、digenic/oligogenicの報告もある。", "r": "p.245 / 表2"}, {"v": "思春期未発来の男子。夜盲をきっかけに網膜色素変性症と診断された。肥満がある。", "q": "考えられる症候群は。", "o": ["Bardet-Biedl症候群", "Prader-Willi症候群", "Klinefelter症候群", "CHARGE症候群"], "a": 0, "e": "線毛（cilia）の異常が本態であることが判明してきている。網膜色素変性・肥満・多指症・腎異常などが並ぶ。", "r": "症例3 p.241 / p.245"}, {"v": "", "q": "CHHに合併する非生殖系の所見として、症候群別の対応が正しいのは。", "o": ["CHARGE（CHD7）：コロボーマ・心奇形・後鼻孔閉鎖・難聴、Waardenburg（SOX10）：白髪・虹彩異色・難聴・Hirschsprung病、裂手裂足（FGFR1）、歯牙欠損（FGF8/FGFR1）", "Kallmann症候群では嗅覚障害以外の所見は伴わず、CHARGEは常染色体潜性でCHD7は関与しない", "CHARGEは常染色体潜性で、CHD7は関与しない", "Waardenburgは嗅覚障害を伴わない"], "a": 0, "e": "ANOS1（X連鎖）では腎無形成と鏡像運動（synkinesia）を伴うことがある。嗅球の無形成は嗅覚検査とMRIで確認する。", "r": "小児内分泌学 p.318-321"}]}, {"id": "u14", "lv": 3, "t": "性ホルモン補充の実際", "min": 7, "cats": "低ゴナドトロピン性・思春期遅発症", "src": "小児内分泌学 p.323-324, 341 ／ 治療 p.68-73", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>低ゴナドトロピン性性腺機能低下症と診断した中学1年の男の子。お父さんがぽつりと「将来、子どもは持てるんでしょうか」。</div><p>性ホルモンの補充は、二次性徴を作るためだけのものではありません。<strong>骨量を作って守ること</strong>、脂質の代謝や動脈硬化の予防、筋肉、そして心の面まで、目的は幅広いのです。そして、<strong>将来子どもを望むかどうか</strong>で、男の子の治療は道が分かれます。</p>\n<h3>原則：少量から、ゆっくり</h3>\n<p>本来の思春期は数年かけて進みます。補充もそれに似せて、<strong>少量から始めて2〜3年かけて成人量へ</strong>近づけます。急に上げると骨端線が早く閉じて、身長を損ないます。始める時期は、男女とも遅くとも14〜15歳ごろが目安で、長く続ける治療なので、見通しを説明して理解してもらうことが大切です。</p>\n<h3>男の子：二つの道</h3>\n<p><strong>① テストステロン補充（二次性徴を作る道）</strong></p>\n<div class=\"formula\">エナント酸テストステロン 12.5 mg/月 から開始 → 半年ごとに増量 → 成人量 250 mg を3〜4週ごと</div>\n<p>簡単で確実ですが、<strong>テストステロンだけでは精子はできません</strong>。精巣の中で精子を作るには、FSHと、精巣の中の高いテストステロン濃度が必要だからです。</p>\n<p><strong>② hCG＋FSH療法（妊孕性を目指す道）</strong></p>\n<p>hCGでライディッヒ細胞にテストステロンを作らせ、FSH（rFSH）で精子形成を促します。少量から始めて1年ほどかけて増やし、成人量はhCG 3,000単位とrFSH 75単位を週1〜2回が目安です。テストステロンが上がっても精子ができなければ、rFSHを増やします。冒頭のお父さんへは、「精子を作る力を引き出す治療がある」と伝えられます。ただし、精巣が小さい、停留精巣があった、といった子では成績が下がり、DAX1異常では精子ができにくいので、精巣内精子回収術（TESE）と顕微授精が検討されます。</p>\n<h3>女の子：エストロゲンから、Kaufmann療法へ</h3>\n<div class=\"formula\">エストラジオール貼付 0.09 mg の1/2枚を2日ごと から開始 → 3〜6か月ごとに倍量 → 約2年でKaufmann療法</div>\n<p>エストロゲンを始めてから得られる身長は<strong>10〜15 cm</strong>ほどと考えられています。成人身長145 cm（−2.5 SD）以上を目指すなら、<strong>135 cmに達してから始める</strong>という考え方があります。開始は12歳ごろ、遅くとも14歳までが目安です。子宮の成長は腹部超音波で、骨量の増え方も確かめます。</p>\n<p>性器出血が来るか、2年ほどたったら<strong>Kaufmann療法</strong>に移ります。周期の前半はエストロゲンだけ、後半の10〜14日に黄体ホルモンを加えて、消退出血を起こさせます。<strong>子宮がある人では黄体ホルモンを必ず併用</strong>します。エストロゲンだけを長く続けると、子宮内膜の増殖症や子宮体癌のリスクが上がるからです。閉経の年齢（〜50歳）ごろまでを目安に続けます。</p>\n<h3>がん治療を受けた子では</h3>\n<p>がん治療後の男性では、<strong>ライディッヒ細胞（男性ホルモン）は比較的保たれるのに、精子を作る力は障害されやすい</strong>のが特徴です。二次性徴が来たことは、生殖能力が保たれていることを意味しません。治療の前に、思春期以降なら精子の凍結保存を、女性では卵子や卵巣組織の凍結を検討します（白血病など腫瘍細胞が混ざりうる病気では、卵巣組織の凍結は勧められません）。</p>", "keys": ["補充の目的は二次性徴だけでなく骨量・代謝・心の面も", "少量から2〜3年かけて成人量へ。急ぐと身長を損なう", "男児：テストステロンだけでは精子はできない。妊孕性にはhCG＋FSH", "女児：エストロゲン少量→2年でKaufmann療法。子宮があれば黄体ホルモン併用", "女児の開始は身長135 cmを一つの目安に", "がん治療後の男性は男性ホルモンが保たれても精子形成は障害されやすい"], "upd": "製剤の規格や用量、保険適用は変わることがあります。処方の際は最新の添付文書と手引きで確認してください。", "quiz": [{"v": "", "q": "CHH男子の小児期からのテストステロン療法の処方例で、開始量と成人量は。", "o": ["12.5 mgを月1回から開始し、成人量は250 mgを3〜4週ごと", "25 mgを2週ごとから開始し、成人量は500 mgを4週ごと", "50 mgを4週ごとから開始し、成人量は125 mgを4週ごと", "125 mgを4週ごとから開始し、成人量は250 mgを2週ごと"], "a": 0, "e": "エナルモンデポー®を中学校入学を契機に12.5 mgを月1回筋注、半年ごとに25→50→75→100→125→150→200→250 mgに増量。生理的な思春期進行に似せて少量より開始し漸増することが望ましいが、年齢などを考慮して初期から高用量で開始することもある。hCG-rFSH療法は中学校入学を契機にhCG製剤125単位、rFSH製剤12.5単位を週1回皮下注、半年ごとにhCGを250→500→1,000→1,500→2,000単位、rFSHを25→50→75単位に増量、成人量として1回hCG 3,000単位、rFSH 75単位を週1〜2回皮下注。hCG-rFSH療法は成人量投与3か月後に平均血清テストステロン300 ng/dLを目標とし、rFSHは75単位で開始しテストステロンが上昇しても精子形成が認められない場合は150単位まで増量、それでも効果がないときは投与回数を週3回まで増量。", "r": "治療 p.68, 70"}, {"v": "", "q": "CHH女子の小児期からの治療の処方例で、エストラーナ®テープの開始量と増量法は。", "o": ["0.09 mg/枚の半分を2日に1回貼り替えから開始、3〜6か月ごとに倍量", "0.09 mg/枚を連日貼付から開始し、6か月ごとに倍量として2年で成人量", "0.72 mg/枚を2日に1回貼り替えから開始し、増量せず成人量として継続", "0.18 mg/枚を週1回貼付から開始し、1年ごとに倍量として4年で成人量"], "a": 0, "e": "性器出血を認めた時点または2年程度経過した時点でKaufmann療法に移行。経口のエストロゲン剤（プレマリン®またはジュリナ®）を使用する場合には1/8錠から開始し3〜6か月ごとに倍量とし2年程度でKaufmann療法へ移行。小児の治療開始時期は日本人女子の二次性徴開始年齢9.5歳±2歳を参考に暦年齢12歳、遅くとも14歳までを目安とする。思春期獲得身長は10〜15 cmと考えられ、成人身長145 cm（−2.5 SD）以上を目指すとして逆算し135 cmに到達していることを治療のもう一つの目安とする。子宮の成長を腹部超音波でモニター、骨密度を測定し骨塩量の増加を確認する。", "r": "治療 p.70"}, {"v": "", "q": "Kaufmann療法で黄体ホルモン薬を投与する時期として正しいのは。", "o": ["月経周期の後半期（10〜14日程度）にエストロゲン剤に加えて投与", "月経周期の前半期（10〜14日程度）にエストロゲン剤なしで単独投与", "月経周期の全期間（28日間）を通してエストロゲン剤と併用して投与", "3か月に1回10日間、エストロゲン剤を休薬したうえで単独投与"], "a": 0, "e": "周期的エストロゲン・黄体ホルモン投与法。処方例：月経周期の前半期（月初めから10〜14日程度）はエストロゲン剤（エストラーナ®テープ0.72 mg 1枚/2日またはプレマリン®錠0.625 mgを1〜2錠、分1〜2）のみ、引き続き後半期（10〜14日程度）にエストロゲン剤に加えて黄体ホルモン薬（プロベラ®錠2.5 mgを2錠またはデュファストン®錠5 mgを2錠、分1〜2）を投与し、消退出血を誘導。エストロゲン単独の長期投与は子宮内膜増殖症・子宮体癌のリスクを高めるため、子宮のある場合には黄体ホルモンを併用する。", "r": "治療 p.70-71"}]}, {"id": "u15", "lv": 2, "t": "Prader-Willi症候群", "min": 6, "cats": "Prader-Willi症候群", "src": "症例1 p.251-255 ／ 小児内分泌学 p.223-226", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>生まれてすぐからぐったりしていて、ミルクをうまく飲めない赤ちゃん。経管栄養が必要です。お母さんは「この子は食が細いんです」と言います。数年後、この言葉は正反対になります。</div><p>Prader-Willi症候群（PWS）は、<strong>時期によって顔がまったく変わる</strong>病気です。この二つの顔を知らないと、診断が遅れます。</p>\n<h3>二つの時期</h3>\n<ul><li><strong>新生児期</strong>：重い<strong>筋緊張低下</strong>と<strong>哺乳障害</strong>。食べられないので、経管栄養が要ることもまれではない</li>\n<li><strong>乳幼児期以降</strong>：一転して<strong>過食</strong>と肥満が問題になる</li></ul>\n<p>新生児期に「食べない子」だったことが、診断の大きな手がかりです。ほかに、色が白い（低色素）、小さな手足、ねばねばした唾液、痛みを感じにくい、<strong>あまり吐かない</strong>（お腹の病気のサインが出にくい）、といった所見があります。ジグソーパズルが異常に得意、という特徴が診断基準に入っているのも、この病気らしいところです。</p>\n<h3>原因：父からもらった15番</h3>\n<p>原因は<strong>15番染色体の15q11-13</strong>で、ここには<strong>父由来のものだけが働く遺伝子</strong>が集まっています。その父由来の働きが失われると、PWSになります。</p>\n<ul><li>父由来の領域の<strong>欠失</strong>：65〜75%</li>\n<li><strong>母性片親性ダイソミー</strong>（2本とも母から）：20〜30%</li>\n<li><strong>インプリンティングセンターの変異</strong>：1〜3%</li></ul>\n<p>診断は、まず<strong>メチル化テスト</strong>で父由来のパターンが消えていることを確かめ（感度99%以上）、次にFISHで欠失かどうかを分けます。同じ領域で<strong>母由来</strong>の働き（UBE3A）が失われると、Angelman症候群になります。親がどちらかで正反対の病気になる、インプリンティングの代表です。巻の四のGNASと同じ考え方です。</p>\n<h3>GH治療：始める前の確認が命を守る</h3>\n<p>PWSのGH治療は、背を伸ばすことだけが目的ではありません。<strong>体組成の改善</strong>（筋肉を増やし脂肪を減らす）と<strong>運動発達の改善</strong>が大きな狙いです。報告では、身長SDSが −3.0から −1.2まで改善しています。</p>\n<p>ただし、<strong>GHを始めて3〜6か月以内の死亡例</strong>が報告されています。GHで扁桃やアデノイドが大きくなって、無呼吸が悪化することがあるからです。だから始める前に、</p>\n<ul><li><strong>睡眠時無呼吸</strong>の評価（ポリソムノグラフィ）、扁桃・アデノイドの大きさ</li>\n<li>側弯</li>\n<li>早朝コルチゾールによる<strong>中枢性副腎不全</strong>の評価</li></ul>\n<p>を確かめ、<strong>半量から</strong>始めます。始めたあとも見張ります。</p>\n<h3>代謝と食事</h3>\n<p>PWSの糖尿病は、同じ肥満度の単純性肥満より<strong>インスリンの分泌が低い</strong>のが特徴で、単純性肥満と同じつもりで管理しません。必要なエネルギーが少ないので、ふつうの計算式は合いません。減らしすぎれば伸びが止まる。慎重な設定が要ります。性ホルモンの補充も少量からゆっくり進め、男性では行動面の変化に注意します。</p>", "keys": ["新生児期は筋緊張低下と哺乳障害、その後は過食と肥満", "15q11-13の父由来の働きの喪失（欠失・母性UPD・IC変異）", "診断はメチル化テストから。母由来の喪失はAngelman症候群", "GH開始前に無呼吸・扁桃アデノイド・側弯・中枢性副腎不全を評価し、半量から", "糖尿病はインスリン分泌が低い。必要エネルギーが少ない"], "upd": null, "quiz": [{"v": "", "q": "Prader-Willi症候群の新生児期に最も特徴的なのは。", "o": ["過食と急速な体重増加による肥満", "重度の筋緊張低下と哺乳障害", "高身長と大きな手足", "けいれんと易刺激性"], "a": 1, "e": "過食と肥満は乳幼児期以降に移ってから問題になる。新生児期はむしろ食べられない。この二相性を知らないと診断が遅れる。 経管栄養を要することがまれでない。", "r": "p.253 / 診断基準 p.255"}, {"v": "", "q": "Prader-Willi症候群でGH治療を開始する前に必須の評価は。", "o": ["骨年齢と予測成人身長", "閉塞性睡眠時無呼吸の評価（アデノイド・扁桃、必要ならポリソムノグラフィ）", "甲状腺機能（TSHとfT4）と副腎機能（早朝コルチゾール）のみで、睡眠検査は要さない", "心エコーで心奇形の有無"], "a": 1, "e": "GH開始後3〜6か月以内の死亡例が報告されている。開始前と開始後のモニタリングの両方が要る。", "r": "p.253 / p.255"}, {"v": "", "q": "Prader-Willi症候群の確定診断に用いる検査の流れとして正しいのは。", "o": ["メチル化テストで父由来の非メチル化パターンの消失を確認（感度99%以上）し、次にSNRPN-FISHで欠失かを分け、欠失でなければ母性片親性ダイソミーやインプリンティングセンター変異を調べる", "染色体G分染法のみで確定する", "SNRPN-FISHのみで判定し、欠失がなければPWSは除外できる（UPDはまれなため）", "血中グレリンの測定で診断する"], "a": 0, "e": "原因は父由来15q11-13の欠失が65〜75%、母性UPDが20〜30%、インプリンティングセンター変異が1〜3%。SNORD116領域の微小欠失だけでもPWSの表現型になる。", "r": "小児内分泌学 p.223-225"}]}, {"id": "u16", "lv": 3, "t": "思春期のPCOS", "min": 6, "cats": "PCOS・思春期発来の生理", "src": "症例1・2 p.257-261 ／ 小児内分泌学 p.98-101, 363-368", "vol": "巻の五 思春期発来異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>高校1年の女の子。月経が不規則で、ニキビと濃いうぶ毛が気になる。首の後ろが黒ずんでいます。インターネットで調べて「PCOSですか」と聞いてきました。</div><p>多嚢胞性卵巣症候群（PCOS）は、思春期の女の子にとって身近な病気です。ただし、<strong>思春期には、PCOSのような所見が生理的にも出やすい</strong>ので、診断には慎重さが要ります。</p>\n<h3>月経のものさし</h3>\n<p>まず月経の異常を言葉にします。周期24日以内が頻発月経、<strong>39日以上が希発月経</strong>、90日以上止まれば無月経です。ただし、<strong>初経から2〜3年は排卵のない周期が生理的にもよくある</strong>ことを忘れないようにします。</p>\n<h3>日本の診断基準（2007年）</h3>\n<ul><li>① 月経の異常</li>\n<li>② 超音波で多嚢胞性卵巣（少なくとも一方の卵巣に<strong>2〜9 mmの小卵胞が10個以上</strong>）</li>\n<li>③ 血中の男性ホルモンが高い、または<strong>LHが高くFSHは正常</strong>（LH≧FSH）</li></ul>\n<p><strong>3つすべて</strong>が必要です。ただし、成人の基準を<strong>思春期にそのまま当てはめるのは難しい</strong>とされます。月経の不整も多嚢胞のような卵巣も、思春期には生理的に起こりうるからです。時間をかけて確かめるほうが安全です。</p>\n<h3>決める前に、除外すべきもの</h3>\n<p>男性化が強い（声が低い、陰核が大きい）、あるいは<strong>進み方が速い</strong>ときは、PCOSと決める前に器質的な病気を除外します。</p>\n<ul><li><strong>非古典型の21水酸化酵素欠損症</strong>（17OHP）</li>\n<li>Cushing症候群</li>\n<li>副腎や卵巣の<strong>アンドロゲン産生腫瘍</strong></li></ul>\n<p>多毛の評価に使うFerriman-Gallweyスコアは、アジア人には当てはまらないことが多く、思春期のニキビは生理的にも多いので、<strong>炎症が強く治りにくいニキビ</strong>や男性型の毛の生え方を重視します。</p>\n<h3>冒頭の黒ずみの意味</h3>\n<p>首の後ろの黒ずみは<strong>黒色表皮腫</strong>で、<strong>インスリン抵抗性</strong>のサインです。PCOSでは、アンドロゲン過剰がインスリン抵抗性を生み、インスリン抵抗性がさらにアンドロゲン過剰を生む、という<strong>悪循環</strong>があります。遺伝の素因（ゴナドトロピンとインスリンの作用に関わる遺伝子）に加え、<strong>SGAで生まれたこと</strong>、子どものころの肥満、巻の五の第3回で見た<strong>早発陰毛</strong>なども関わります。</p>\n<h3>治療と、長い目で見たリスク</h3>\n<p>基本は<strong>生活の見直しと運動</strong>です。そのうえで、月経の異常には周期的な黄体ホルモンや低用量ピル、多毛にはスピロノラクトン、耐糖能異常には<strong>メトホルミン</strong>を使います。巻物の症例では、メトホルミンで多毛と、月経周期に関わる気分の症状の両方がよくなった例が紹介されています。</p>\n<p>思春期にきちんと向き合う理由は、将来の<strong>2型糖尿病、メタボリックシンドローム、子宮内膜がん</strong>のリスクと、<strong>心の面への影響</strong>です。「病名をつける」より、「体と生活を一緒に整えていく」ことを伝えるのが、この年代の外来の役目です。</p>", "keys": ["初経後2〜3年は無排卵周期が生理的。思春期の診断は慎重に", "診断基準：月経異常・多嚢胞性卵巣・アンドロゲン高値またはLH≧FSHの3つ", "男性化が強い・速い→非古典型CAH・Cushing・腫瘍を除外", "黒色表皮腫はインスリン抵抗性のサイン。悪循環がある", "生活と運動が基本。メトホルミン・黄体ホルモン・ピル・スピロノラクトン"], "upd": null, "quiz": [{"v": "", "q": "日本産科婦人科学会のPCOS診断基準（2007年）の3項目は。", "o": ["月経異常・多嚢胞性卵巣・血中男性ホルモン高値またはLH基礎値高値かつFSH正常", "月経異常・多嚢胞性卵巣・インスリン抵抗性またはHOMA-R 2.5以上かつ肥満", "肥満・多毛・多嚢胞性卵巣", "月経異常・多毛・LH/FSH比 1以下"], "a": 0, "e": "3つすべてを満たすことが必要。肥満例（BMI≧25）ではLH≧FSHのみでも可とされる。", "r": "表1 p.259"}, {"v": "", "q": "思春期のPCOS疑い例に成人の診断基準を用いることについて本書が述べているのは。", "o": ["そのまま適用してよい", "思春期例への適用は困難であり、慎重な判断が要る", "思春期では診断できない", "基準は思春期用に作られているため、そのまま適用してよい"], "a": 1, "e": "思春期は月経不整も多嚢胞様所見も生理的に起こりうる。時間をかけて確かめるほうが安全。", "r": "p.259"}, {"v": "月経異常・低い声・多毛で受診した女子。外陰部に黒色素沈着、陰核肥大、インスリン高値を認める。", "q": "まず除外すべきなのは。", "o": ["甲状腺機能低下症（月経異常と体重増加を来す）", "副腎腫瘍・Cushing症候群・先天性副腎皮質過形成などの男性化を来す疾患", "高プロラクチン血症（月経異常と乳汁漏出を来し、多毛と黒色素沈着も伴うことがある）", "2型糖尿病（インスリン抵抗性による黒色表皮腫）"], "a": 1, "e": "男性化が強い、あるいは進行が速いときはPCOSと決める前に器質性を潰す。黒色表皮腫はインスリン抵抗性のサインで、PCOSでも見られる。", "r": "症例1 p.257 / p.259"}]}];
const ADR = [{"id": "a1", "lv": 1, "t": "副腎の地図：3つの層と酵素", "min": 6, "cats": "副腎の発生と生理", "src": "レクチャー6 p.315-322 ／ 小児内分泌学 p.375-377, 394", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>ステロイドの合成経路の図を見ると、矢印と酵素名がずらりと並んでいて、つい目をそらしたくなる。でも、この章の病気は全部、この図のどこかにある「通行止め」です。</div><p>副腎の病気を理解する近道は、<strong>ステロイドがどこで、どの順番で作られるか</strong>という地図を一枚持つことです。今日はその地図を、できるだけ簡単に描きます。</p>\n<h3>同じ臓器、ちがう生まれ</h3>\n<p>副腎は、外側の<strong>皮質</strong>と内側の<strong>髄質</strong>でできています。皮質は<strong>中胚葉</strong>、髄質は<strong>神経堤（外胚葉）</strong>から生まれ、生まれの違うものが一つの臓器に収まっています。この近さには意味があります。髄質でノルアドレナリンをアドレナリンに変える酵素（PNMT）は、<strong>皮質から流れてくる高濃度のコルチゾール</strong>で働いています。だから21水酸化酵素欠損症では、コルチゾールが足りず、<strong>アドレナリンの分泌まで落ちる</strong>のです。</p>\n<h3>3つの層、3つの製品</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>層</th><th>割合</th><th>主な製品</th></tr>\n<tr><td>球状層（外側）</td><td>約5%</td><td>アルドステロン</td></tr>\n<tr><td>束状層</td><td>約70%</td><td>コルチゾール</td></tr>\n<tr><td>網状層（内側）</td><td>約25%</td><td>副腎アンドロゲン（DHEA-S）</td></tr></table></div>\n<p>層によって<strong>持っている酵素の顔ぶれ</strong>が違うので、作るものが違います。球状層はアルドステロン合成酵素（CYP11B2）を持ち、CYP17A1を持ちません。束状層はその逆です。</p>\n<h3>入り口はひとつ：StAR</h3>\n<p>すべてのステロイドは<strong>コレステロール</strong>から作られます。最初の、そしていちばん大事な関門が<strong>StAR</strong>です。StARはコレステロールを<strong>ミトコンドリアの内膜まで運ぶ</strong>役で、ここが<strong>律速段階</strong>。ACTHはStARの量と働きを速やかに上げて、合成のスイッチを入れます。内膜に届いたコレステロールは、P450scc（CYP11A1）でプレグネノロンになり、そこから枝分かれしていきます。</p>\n<p>入り口が閉じれば、その先の酵素がいくら揃っていても、<strong>すべてのステロイドが作れなくなります</strong>。これが第11話のリポイド副腎過形成です。</p>\n<h3>男性ホルモンの「裏道」</h3>\n<p>ふつう男性ホルモンは、DHEA → アンドロステンジオン → テストステロンと作られます。ところが、<strong>17OHPやプロゲステロンから直接テストステロンやDHTを作る裏道（backdoor pathway）</strong>があります。21水酸化酵素欠損症やPOR欠損症で女の子が男性化する理由の一部は、この裏道で説明されます。</p>\n<p>最近は、<strong>11-オキシアンドロゲン</strong>（11-ケトテストステロンなど）という強い男性ホルモンが、21水酸化酵素欠損症の男性化に大きく関わっていることも分かってきました。DHEAやDHEA-S自体は弱く、体の中で変換されて働きます。</p>\n<p>この地図を頭の片隅に置いておくと、次の回からの病気が「どこの通行止めか」で整理できます。</p>", "keys": ["皮質は中胚葉、髄質は神経堤。皮質のコルチゾールが髄質のアドレナリン合成を支える", "球状層＝アルドステロン、束状層＝コルチゾール、網状層＝アンドロゲン", "層ごとに酵素の顔ぶれが違う", "律速段階はStAR（コレステロールをミトコンドリア内膜へ）", "backdoor pathwayと11-オキシアンドロゲンが男性化に関わる"], "upd": null, "quiz": [{"v": "", "q": "副腎皮質の3層と産生ホルモンの対応で正しいのは。", "o": ["球状層＝アルドステロン、束状層＝コルチゾール、網状層＝副腎アンドロゲン", "球状層＝コルチゾール、束状層＝アルドステロン、網状層＝副腎アンドロゲン", "球状層＝アルドステロン、束状層＝副腎アンドロゲン、網状層＝コルチゾール", "球状層＝副腎アンドロゲン、束状層＝コルチゾール、網状層＝アルドステロン"], "a": 0, "e": "球状層はCYP11B2を発現しCYP17A1を発現しない。束状層はその逆。層ごとに酵素の顔ぶれが違うことが、産物の違いを作っている。", "r": "図 p.317"}, {"v": "", "q": "ステロイド合成の律速段階を担うのは。", "o": ["CYP11A1（コレステロール側鎖切断酵素。P450sccとも呼ばれる）", "StAR（コレステロールのミトコンドリア内への輸送）", "HSD3B2（Δ5からΔ4への変換）", "CYP17A1（17α水酸化と17,20リアーゼ）"], "a": 1, "e": "コレステロールがミトコンドリア内膜に届かなければ、その先の酵素がいくらあっても始まらない。だからStAR異常は全ステロイドの合成障害になる。", "r": "p.317-318"}, {"v": "", "q": "21水酸化酵素欠損症で副腎髄質にも異常が生じる理由は。", "o": ["髄質にも21水酸化酵素が発現し、カテコラミン合成に関わるから", "ノルアドレナリンからアドレナリンへの変換に高濃度のコルチゾールが必要だから", "過剰なACTHが髄質のクロム親和性細胞を直接刺激し続け", "アルドステロン欠乏で髄質の血流が低下するから"], "a": 1, "e": "皮質から髄質へ流れる血液の高いコルチゾール濃度がPNMTを働かせている。21水酸化酵素欠損症ではアドレナリン分泌が低下し、髄質の形成異常も報告されている。", "r": "p.315 / 文献1"}]}, {"id": "a2", "lv": 1, "t": "胎児の副腎と、ステロイドの力価", "min": 5, "cats": "副腎の発生と生理", "src": "p.319-320 ／ 小児内分泌学 p.150, 372-378", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>新生児の腹部超音波で、副腎が思ったより大きく見えた。体重比で大人の何十倍もある、と聞いて驚いたことはありませんか。</div><p>胎児の副腎は、大人とはまったく違う臓器です。そして、ステロイドの薬にも、それぞれの「強さ」と「くせ」があります。今日はこの二つを押さえます。</p>\n<h3>副腎と性腺は、同じところから生まれる</h3>\n<p>胎生4〜5週、尿生殖堤に<strong>副腎と性腺の共通の原基</strong>ができます。この分化に欠かせないのが<strong>SF1</strong>です。だから<strong>SF1の異常では、副腎と性腺が同時に障害される</strong>ことがあります（第12話）。髄質は、胎生7〜8週に神経堤の細胞が皮質の原基へ入り込んでできます。</p>\n<h3>大きな胎児副腎</h3>\n<p>胎児の副腎の大部分は<strong>胎児層（fetal zone）</strong>で、生まれたときは約1.5 g、<strong>体重あたりで大人の約35倍</strong>もあります。胎児層は<strong>DHEA-S</strong>を大量に作り、それが胎盤でエストロゲン（エストリオール、E3）の材料になります。だから<strong>妊婦さんの尿中E3は、胎児の副腎の働きを映します</strong>。胎児のACTHが足りなかったり、副腎が低形成だったりすると、E3は低くなります。</p>\n<p>生まれると胎児層は急速に小さくなり、残った永久層から大人型の3つの層ができていきます。新生児の副腎が大きく見えるのは、このためです。</p>\n<h3>ACTHを動かすのはCRF</h3>\n<p>ACTHの分泌を促すのは、主に視床下部の<strong>CRF</strong>です。AVPも少し後押ししますが、その役割は限定的です。それが分かるのは、AVPが出ない中枢性尿崩症の人が、副腎不全にならないからです。実際の患者から生理を逆算できる、よい例です。コルチゾールはパルス状に出て、<strong>早朝にピーク</strong>があります。</p>\n<h3>ステロイドの力価</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>薬</th><th>糖質コルチコイドの力価</th></tr>\n<tr><td>ヒドロコルチゾン（コルチゾール）</td><td>1</td></tr>\n<tr><td>プレドニゾロン</td><td>約4</td></tr>\n<tr><td>メチルプレドニゾロン</td><td>約5</td></tr>\n<tr><td>デキサメタゾン</td><td>約25〜30（鉱質作用はほぼなし）</td></tr></table></div>\n<p>薬として多めに使うと、ACTHが抑えられて副腎が萎縮します（第6話）。逆にCAHではACTHが多すぎて、副腎が大きくなります。</p>\n<h3>腎臓の「門番」：11β-HSD2</h3>\n<p>コルチゾールは、実はアルドステロンの受容体（MR）にもよく結合します。それでも腎臓でアルドステロンのように働かないのは、腎の<strong>11β-HSD2</strong>がコルチゾールを不活性なコルチゾンに変えて、受容体に届かせないからです。ところが、<strong>ヒドロコルチゾンを大量に</strong>（1日80〜100 mg/m²）使うと、この門番の処理が追いつかず、コルチゾールが鉱質コルチコイドとして働いて、<strong>高血圧や低K血症</strong>が起こりえます。この門番が生まれつき壊れた病気は、第15話で出てきます。</p>", "keys": ["SF1が副腎と性腺の共通原基の分化に必須", "胎児副腎は胎児層が大部分（体重比で成人の約35倍）、DHEA-Sが胎盤でE3に", "妊婦の尿中E3は胎児副腎の機能を映す", "ACTH分泌の主役はCRF（AVPは限定的）", "力価：PSL約4、mPSL約5、DEX約25〜30", "11β-HSD2が腎でコルチゾールを不活化。大量HCで処理能を超える"], "upd": null, "quiz": [{"v": "", "q": "妊娠中の尿中エストリオール（E3）が示すのは。", "o": ["母体の副腎機能", "胎児の副腎機能", "胎盤の血流", "羊水量"], "a": 1, "e": "胎児副腎のDHEA-Sが胎盤でE3に変換される。胎児のACTH分泌不全症や副腎低形成では低値になる。", "r": "p.319"}, {"v": "", "q": "副腎と性腺の発生について正しいのは。", "o": ["胎生4〜5週の尿生殖堤にadrenogonadal primordiumが生じ、SF1がその分化に必須であるため、SF1異常症では副腎と性腺が同時に障害される", "副腎皮質と髄質はともに中胚葉由来で同じ原基から分化し、神経堤は関与しないためSF1異常症では髄質のみが障害される", "副腎は腎臓から分化するため、腎奇形を伴いやすい", "性腺は副腎とは無関係に、神経堤から分化する"], "a": 0, "e": "髄質は神経堤由来の細胞が胎生7〜8週に皮質原基へ遊走して形成される。胎児副腎は胎児層（fetal zone）が大部分を占め、DHEA-Sを大量に産生する。", "r": "小児内分泌学 p.150"}, {"v": "", "q": "大量のヒドロコルチゾン投与（1日80〜100 mg/m2）で高血圧・低カリウム血症を生じうる機序は。", "o": ["ACTH抑制が外れてアルドステロン分泌が亢進する", "11β-HSD2の処理能を超え、コルチゾールがミネラルコルチコイド作用を発揮する", "コルチゾールが肝でのレニン基質産生を増やし、アンジオテンシンIIが上昇する", "副腎髄質のカテコラミン合成が亢進する"], "a": 1, "e": "腎ではコルチゾールがコルチゾンに不活化されて受容体に届かないようになっている。量が処理能を超えると、その仕組みが破れる。", "r": "p.320"}]}, {"id": "a3", "lv": 1, "t": "副腎不全を見抜く", "min": 6, "cats": "副腎不全・クリーゼ", "src": "p.267-275 ／ 小児内分泌学 p.125-126, 135 ／ 治療 p.1143", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>「胃腸炎で吐いている」と救急に来た4歳の子。点滴をしてもぐったりしたまま。血糖が少し低く、Naも低め。前にも同じようなことがあったそうです。</div><p>副腎不全の怖さは、<strong>ありふれた病気の顔をしてやってくる</strong>ことです。今日は、それを見抜く目を作ります。</p>\n<h3>いちばん多い症状は「胃腸炎」</h3>\n<p>副腎不全で最も多い症状は<strong>悪心・嘔吐・下痢</strong>です。消化器の症状なので、胃腸炎と区別がつきません。しかも吐いて<strong>薬が飲めなくなる</strong>という、最悪の組み合わせになります。冒頭の子のように、「胃腸炎のたびにひどくなる」「点滴をしてもぐったりしている」「低血糖や低Naを繰り返す」ときは、副腎不全を思い浮かべます。</p>\n<h3>コルチゾールの数字の読み方</h3>\n<ul><li>具合が悪いときのコルチゾールが<strong>15 μg/dL未満</strong>（重症なら5以下）なら、上がるべき場面で上がっていないと考える</li>\n<li>早朝のコルチゾールが<strong>18 μg/dL以上</strong>なら副腎不全は否定できる。負荷試験の頂値も18が目安</li>\n<li>早朝値が<strong>4〜18</strong>のあいだは、否定も確定もできない灰色の帯</li></ul>\n<p>灰色の帯が広いので、1回の値で安心しないことが大事です。そして何より、<strong>迷ったら投与する</strong>のが原則です（次の回）。</p>\n<h3>電解質がそろわなくても否定できない</h3>\n<p>低Na血症や代謝性アシドーシスは<strong>必ず出るわけではありません</strong>。とくに、アルドステロンの系が保たれている病気（中枢性の副腎不全、ACTH不応症）では、<strong>高K血症は出ません</strong>。「電解質が正常だから副腎不全ではない」とは言えないのです。</p>\n<h3>同じ低Naでも、理由が二つある</h3>\n<ul><li><strong>ミネラルコルチコイドが足りない</strong>：腎からNaを失い、<strong>脱水</strong>を伴う低Na</li>\n<li><strong>コルチゾールが足りない</strong>：AVPが出すぎて<strong>水がたまる</strong>低Na（SIADH様）。アルドステロンが保たれる中枢性の副腎不全でも起こる</li></ul>\n<p>入れるべき水の量が変わるので、輸液の方針も変わります。コルチゾールを補うとAVPが抑えられ、水が出るようになります。</p>\n<h3>病型を分けるために測るもの</h3>\n<p>原発性の副腎不全を見たら、<strong>17OHP、レニン、アルドステロン、DHEA-S、尿中ステロイドプロファイル</strong>を追加します。どの系統が落ちていて、どの系統が保たれているかで、原因が絞れます（例：ACTH不応症ではアルドステロンは保たれる）。</p>", "keys": ["最も多い症状は悪心・嘔吐・下痢（胃腸炎と区別がつかない）", "ストレス時のコルチゾール15未満は不十分。早朝18以上なら否定、4〜18は灰色", "電解質異常は必発ではない。中枢性やACTH不応症では高Kなし", "低Naはミネラル欠乏（脱水）とコルチゾール欠乏（水貯留）で機序が違う", "原発性では17OHP・レニン・アルドステロン・DHEA-S・尿ステロイドを追加"], "upd": null, "quiz": [{"v": "", "q": "副腎不全でもっとも多い症状は。", "o": ["発熱", "悪心・嘔吐・下痢", "頭痛", "けいれんと意識障害"], "a": 1, "e": "消化器症状なので胃腸炎と区別がつかない。しかも内服できなくなるという最悪の組み合わせになる。", "r": "p.267"}, {"v": "", "q": "早朝コルチゾール値による副腎不全の評価として示されているのは。", "o": ["18 μg/dL以上なら否定でき、4〜18 μg/dL未満では可能性を否定できない", "10 μg/dL以上なら否定でき、5 μg/dL未満で確定し、その間は負荷試験で判断する", "25 μg/dL以上なら否定でき、それ未満では負荷試験が必須", "5 μg/dL以上なら否定でき、それ未満では確定する"], "a": 0, "e": "負荷試験でもコルチゾール頂値18 μg/dL以上が否定の目安。灰色帯が広いので、単回の値で安心しない。", "r": "治療 p.1143"}, {"v": "", "q": "副腎クリーゼで低ナトリウム血症が起こる機序として、ミネラルコルチコイド欠乏以外に挙げられているのは。", "o": ["コルチゾール欠乏によるバゾプレシン分泌の亢進で水が貯留する（SIADH様）", "腎血流の低下によるNa再吸収の障害と、嘔吐による胃液からのNa喪失", "嘔吐による胃液からのNa喪失のみ", "AVP分泌の低下による多尿"], "a": 0, "e": "中枢性副腎不全ではアルドステロンは保たれるが、コルチゾール欠乏だけで低Na血症になる。グルココルチコイドを補充するとAVPが抑えられて水利尿がつく。", "r": "小児内分泌学 p.135"}]}, {"id": "a4", "lv": 2, "t": "副腎クリーゼの初期対応", "min": 5, "cats": "副腎不全・クリーゼ", "src": "症例2 p.269-273 ／ 小児内分泌学 p.135-136 ／ 治療 p.1146", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>副腎不全で通院している子。夜中から吐き続けて薬が飲めず、朝にはぐったりして反応が乏しくなった、とお母さんから電話がありました。</div><p>副腎クリーゼは、<strong>迷っている時間が命取りになる</strong>救急です。今日の内容は、手順として体に入れておきたいものです。</p>\n<h3>まず、ヒドロコルチゾンを入れる</h3>\n<p>冒頭の子に必要なのは、<strong>ヒドロコルチゾンの静注を直ちに</strong>行うことです。死亡例を調べると、<strong>けいれんや嘔吐で内服できなかった</strong>子が多くを占めていました。検査の結果を待つ必要はありません。血液を採ったら、すぐに入れます。</p>\n<p>静脈ルートが取れなければ、<strong>胃チューブから入れる</strong>ことでも代用できます。「手段がない」ことを理由に諦めないことです。家庭用には、ヒドロコルチゾンの筋注（またはデキサメタゾンの皮下注）を持たせておく方法があります。</p>\n<h3>なぜ「100 mg/m²/日」なのか</h3>\n<p>ふだんのコルチゾールの分泌は1日<strong>5〜8 mg/m²</strong>ほどです。強いストレスがかかると、体はその<strong>約10倍</strong>を出します。だからクリーゼでは、<strong>100 mg/m²/日</strong>（初回は50 mg/m²前後をボーラス、そのあと持続または分割）が必要になります。ふだんの維持量の3倍では、本当のクリーゼはカバーしきれません。数字の根拠を知っておくと、迷わず入れられます。</p>\n<h3>輸液と、低血糖・高K</h3>\n<ul><li><strong>輸液</strong>：ブドウ糖を5%含む生理食塩液で、10〜20 mL/kg</li>\n<li><strong>低血糖</strong>：10%ブドウ糖を1〜2 mL/kg、2〜3分かけて</li>\n<li><strong>高K血症</strong>：多くはヒドロコルチゾンで良くなる。心電図に異常があれば、陽イオン交換樹脂の注腸などを加える</li></ul>\n<h3>塩喪失型CAHの新生児クリーゼ</h3>\n<p>巻物の症例では、日齢12の女の子がNa 126、K 10.2、17OHP 422で来ていました。こういう子では、<strong>結果を待たずに</strong>ステロイドと輸液を始めます。水として130〜200 mL/kg、Naとして5〜10 mEq/kgを含む輸液が必要になることもあります（第9話）。</p>\n<h3>この回のまとめ</h3>\n<p>副腎クリーゼの対応は、「疑ったら採血して、すぐヒドロコルチゾン」。理屈を知っていれば、夜中の電話でも迷わずに動けます。次の回は、クリーゼを<strong>起こさないため</strong>の、シックデイと手術のときの備えです。</p>", "keys": ["疑ったら採血してすぐヒドロコルチゾン静注。結果を待たない", "静注できなければ胃チューブ。家庭には筋注・皮下注を持たせる", "生理量5〜8 mg/m²/日の約10倍＝100 mg/m²/日が必要", "輸液は5%ブドウ糖加生食10〜20 mL/kg、低血糖には10%ブドウ糖", "高Kは多くがHCで改善"], "upd": null, "quiz": [{"v": "副腎不全でフォロー中の児。夜中から突然の嘔吐が続き、内服できないままぐったりして反応が乏しくなった。", "q": "最も適切な対応は。", "o": ["経口のヒドロコルチゾンを倍量にして朝まで様子をみる", "ヒドロコルチゾンの静脈内投与を直ちに行う", "内服を再度試みる", "制吐薬のみ投与する"], "a": 1, "e": "死亡例の解析では、けいれんや嘔吐で内服できなかった症例が多くを占めていた。静注が難しければ胃チューブからの投与でも代用できる。", "r": "症例2 p.269 / 表2 p.273"}, {"v": "急性副腎不全で搬送された乳児。低血糖と低ナトリウム血症、高カリウム血症を認める。", "q": "初期対応として適切なのは。", "o": ["ヒドロコルチゾン静注に加え、ブドウ糖濃度5%の生理食塩液で10〜20 mL/kgの輸液を行う", "ヒドロコルチゾン静注に加え、1/4生理食塩液で20 mL/kgの輸液を行い、ブドウ糖は加えない", "ヒドロコルチゾン静注に加え、ブドウ糖を含まない生理食塩液のみで輸液する", "フルドロコルチゾンを経口投与し、高K血症にはカリウム制限で対応する"], "a": 0, "e": "低血糖には10%ブドウ糖1〜2 mL/kgを2〜3分かけて投与する。高カリウム血症は多くがヒドロコルチゾン投与で改善するが、心電図異常があればケイキサレートの注腸などを行う。", "r": "治療 p.1146"}, {"v": "", "q": "副腎クリーゼにおける水溶性ヒドロコルチゾンの投与量の根拠として述べられているのは。", "o": ["生理的分泌量5〜8 mg/m²/日の約10倍、すなわち100 mg/m²/日を要すると考えられる", "通常の維持量の3倍で十分とされ、体重あたり1 mg/kgで一律に投与する", "体重あたり1 mg/kgで一律に投与する", "生理的分泌量と同量の補充で足りる"], "a": 0, "e": "維持量の3倍ではストレスをカバーしきれない。初回を静注したあと持続静注または分割で続ける。身体的ストレスの程度（軽度・中等度・重度）に応じて量を調節する。", "r": "小児内分泌学 p.135-136"}]}, {"id": "a5", "lv": 2, "t": "シックデイと手術のときの備え", "min": 6, "cats": "副腎不全・クリーゼ", "src": "p.273, 287, 301 ／ 小児内分泌学 p.136-137 ／ 治療 p.1149-1150", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>副腎不全の子が、来月、扁桃の手術を受けることになりました。お母さんは「いつもの薬はどうすればいいですか。風邪のときも同じですか」。</div><p>副腎不全の子の命を守るのは、病院よりも<strong>家庭での備え</strong>です。今日は、ふだんの体調不良（シックデイ）と、手術のときの対応を整理します。</p>\n<h3>シックデイの基本</h3>\n<ul><li>発熱や嘔吐など体調が悪いときは、ヒドロコルチゾンを<strong>ふだんの3〜4倍</strong>（倍量を6〜8時間ごと、など）に増やす</li>\n<li>あらかじめ<strong>3倍量を処方しておき</strong>、「飲めなくなったら受診」というルールにしておく</li>\n<li><strong>吐いて飲めなければ筋注</strong>。筋注の目安は乳児25 mg、幼児50 mg、学童以上100 mg。水溶性ヒドロコルチゾンを持たせ、手技を家族に教えておく</li>\n<li>症状が<strong>3〜4日以上続く</strong>ときは受診する</li></ul>\n<p>巻物には、感染で家族全員が下痢になったのに、<strong>副腎不全の子だけが命に関わる経過</strong>をたどった例が紹介されています。家族にとってはただの胃腸炎でも、この子にとっては違う、ということを繰り返し伝えます。</p>\n<h3>ストレスの重さで量を変える</h3>\n<p>21水酸化酵素欠損症の手引きでは、</p>\n<ul><li>軽いストレス：ふだんの3〜4倍</li>\n<li>熱傷や敗血症：50〜100 mg/m²/日</li>\n<li>大きな手術：100 mg/m²/日</li></ul>\n<p>が示されています。</p>\n<h3>手術のとき</h3>\n<p><strong>ストレスがかかってから追いかけるのでは間に合わない</strong>ことがあります。だから、手術の前から先に入れておきます。</p>\n<ul><li>全身麻酔：<strong>麻酔の導入直前にヒドロコルチゾン50 mg/m²を静注</strong>し、そのあと50〜100 mg/m²/日を持続点滴</li>\n<li>術後は、ふだんの3〜4倍から数日かけて減らしていく</li>\n<li>軽〜中等度の手術なら、50 mg/m²の単回投与でよいとされる</li></ul>\n<h3>知っておくと迷わない二つのこと</h3>\n<p>一つめ。ヒドロコルチゾン<strong>20 mg</strong>は、フルドロコルチゾン<strong>0.1 mg</strong>とほぼ同じ鉱質コルチコイドの効果を持ちます。だから、ストレス量のヒドロコルチゾンを入れている間は、<strong>フルドロコルチゾンを別に足す必要はありません</strong>。</p>\n<p>二つめ。ステロイドを多く入れていると、<strong>熱が出にくくなります</strong>。「熱がないから感染はない」とは読めません。周術期の合併症には、とくに気をつけます。</p>\n<p>冒頭のお母さんには、「手術の日は病院で先に点滴で入れます。風邪のときは家で3倍、飲めなければ筋注か受診」と、二つを分けて伝えます。</p>", "keys": ["シックデイはHCをふだんの3〜4倍。3倍量を処方しておく", "吐いて飲めなければ筋注（乳児25・幼児50・学童以上100 mg）", "重いストレスは50〜100 mg/m²/日", "全身麻酔は導入直前に50 mg/m²、以降50〜100 mg/m²/日", "HC 20 mg ≒ フルドロコルチゾン0.1 mg", "ステロイドで熱が出にくい。感染の見逃しに注意"], "upd": "ストレス時の用量は施設や手引きの版で異なることがあります。最新の手引きと、各患者の指示書で確認してください。", "quiz": [{"v": "副腎不全の児が全身麻酔下で手術を受けることになった。", "q": "周術期のステロイドカバーとして示されている方法は。", "o": ["麻酔導入直前にヒドロコルチゾン50 mg/m2を静注し、以降は50〜100 mg/m2/日を持続点滴", "術前日から通常量の3倍を内服し、術当日も内服で対応して静注は行わず、術後は翌日に通常量へ戻して特別な監視は要さない", "麻酔導入時に通常量を静注し、術後は通常量の内服に戻す", "術後に低血圧が出たときのみ、ヒドロコルチゾンを静注する"], "a": 0, "e": "術後は通常補充量の3〜4倍を数日かけて漸減する。軽度〜中等度の外科的ストレスなら50 mg/m2の単回投与が推奨される。", "r": "治療 p.1149"}, {"v": "", "q": "21水酸化酵素欠損症の手引き（2014改訂）が示すストレス時のヒドロコルチゾン量は。", "o": ["軽度：通常量の3〜4倍、熱傷・敗血症：50〜100 mg/m²/日、大手術：100 mg/m²/日", "すべてのストレスで一律に通常量の2倍", "軽度：通常量のまま、大手術：通常量の3倍", "ストレスの程度にかかわらず300 mg/日"], "a": 0, "e": "緊急時の筋注は乳児25 mg、幼児50 mg、学童以上100 mgが目安。重度ではフルドロコルチゾン50 μgを併用する考え方もある。", "r": "小児内分泌学 p.136"}, {"v": "", "q": "ステロイドカバー中の患者で注意すべきなのは。", "o": ["グルココルチコイドが発熱反応を抑制するため、感染徴候に注意深く対応する必要がある", "発熱しやすくなるため、解熱薬の併用を考慮する", "免疫が保たれるため通常どおり感染徴候を判断でき、発熱があれば感染と考えてよく、なければ否定できる", "血糖は変動せず、追加の測定を要さない"], "a": 0, "e": "熱が出ないから大丈夫、と読めなくなる。周術期に合併症があれば追加のカバーを検討する。", "r": "治療 p.1150"}]}, {"id": "a6", "lv": 1, "t": "ステロイドが作る副腎不全", "min": 5, "cats": "副腎不全・クリーゼ", "src": "症例6 p.273-275 ／ 小児内分泌学 p.428 ／ 治療 p.1148", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>喘息で長いあいだシロップの薬を飲んでいた3歳の子。最近やめたら、元気がなく、低血糖でけいれんしました。その薬はベタメタゾンでした。</div><p>小児の副腎不全で、実はいちばん身近なのが<strong>医原性</strong>、つまり<strong>治療で使ったステロイドが作る副腎不全</strong>です。</p>\n<h3>なぜ起こるのか</h3>\n<p>外からステロイドを入れ続けると、体は「コルチゾールは足りている」と判断して、<strong>ACTHを出すのをやめます</strong>。ACTHの刺激がないと副腎は休み、だんだん萎縮します。その状態で急にステロイドをやめると、自分の副腎がすぐには働き出せず、副腎不全になります。</p>\n<h3>どれくらいで抑制されるか</h3>\n<p>成人のデータでは、<strong>プレドニゾロン7.5 mg/日（ヒドロコルチゾン30 mg、デキサメタゾン0.75 mg相当）以上を3週間以上</strong>使うと、抑制を考えます。<strong>生理的な補充量の2倍を超える量が続く</strong>ときは要注意、と覚えておくと子どもにも当てはめやすいです。回復には<strong>3〜6か月</strong>かかることがあります。</p>\n<h3>冒頭の子：力価の落とし穴</h3>\n<p><strong>ベタメタゾン（リンデロン）</strong>は、ヒドロコルチゾンの<strong>約30倍</strong>の力価があります。シロップで少量のつもりでも、長く飲めば十分に副腎を抑えます。第2話の力価の表が、ここで効いてきます。</p>\n<h3>短くても起こる</h3>\n<p><strong>川崎病</strong>で免疫グロブリンとプレドニゾロンを一緒に使う治療では、<strong>副腎抑制が高い頻度で起こる</strong>と報告されています。短期間でも油断できません。やめたあとに「なんとなく元気がない」「吐く」といった体調不良が出たとき、それを副腎不全として拾えるかどうかが分かれ目です。</p>\n<h3>やめ方</h3>\n<p>長く使ったステロイドは、<strong>少しずつ</strong>減らします。プレドニゾロン換算で、2〜4週ごとに1 mgずつ、といった速さです。生理的な量に近づいたら、早朝のコルチゾールなどで回復を確かめます。減らしている間とやめてしばらくの間は、<strong>シックデイの対応（第5話）</strong>が必要になることも伝えておきます。</p>\n<h3>薬の飲み合わせ</h3>\n<p>補充中の子では、リファンピシン、一部の抗てんかん薬、ピオグリタゾンなどを併用すると、ステロイドの代謝が速くなり、<strong>効きが落ちます</strong>。新しい薬が始まったら、量を見直すことを考えます。</p>", "keys": ["外からのステロイドがACTHを止め、副腎が萎縮する", "PSL 7.5 mg/日（生理量の2倍超）を3週間以上で抑制を考える。回復に3〜6か月", "ベタメタゾンはHCの約30倍。シロップでも抑制する", "川崎病のIVIG＋PSLでも副腎抑制が多い", "減量はゆっくり（PSL換算で2〜4週ごとに1 mg）。シックデイ対応も"], "upd": null, "quiz": [{"v": "", "q": "ステロイド長期投与による医原性副腎不全について正しいのは。", "o": ["成人でプレドニゾロン10〜15 mg/日以上が目安で、回復に3〜6か月を要する", "成人でプレドニゾロン2.5 mg/日以上が目安で、中止後1週以内に速やかに回復する", "小児では起こらず、成人でのみ問題になる", "吸入ステロイドでは起こらず、全身投与でのみ問題になる"], "a": 0, "e": "ベタメタゾン（リンデロン）はヒドロコルチゾンの約30倍の力価があり、シロップで長く出されていた児が抑制を来していた症例が紹介されている。", "r": "症例6 p.273-275"}, {"v": "", "q": "ステロイド投与によるHPA系抑制の目安として、成人のデータで示されているのは。", "o": ["プレドニゾロン7.5 mg/日（ヒドロコルチゾン30 mg/日、デキサメタゾン0.75 mg/日）以上を3週間以上", "プレドニゾロン20 mg/日以上を1週間以上", "プレドニゾロン5 mg/日以上を2日以上", "プレドニゾロン7.5 mg/日（ヒドロコルチゾン30 mg/日）以上を3か月以上（3週間程度では抑制は起こらない）"], "a": 0, "e": "生理的補充量の2倍を超える投与が続くときは抑制を考慮する。漸減はプレドニゾロン換算で2〜4週ごとに1 mgずつ、といった速度で行う。", "r": "小児内分泌学 p.428"}, {"v": "", "q": "川崎病に対する免疫グロブリンとプレドニゾロン併用治療について報告されているのは。", "o": ["副腎抑制の発生頻度が高い", "副腎抑制は少ない", "ステロイドは用いない", "小児では副腎抑制は問題になりにくい"], "a": 0, "e": "短期であっても抑制は起こる。中止後の体調不良を副腎不全として拾えるかどうかが分かれ目になる。", "r": "治療 p.1148"}]}, {"id": "a7", "lv": 2, "t": "中枢性副腎不全", "min": 6, "cats": "副腎不全・クリーゼ", "src": "小児内分泌学 p.427 ／ 治療 p.1141-1146", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>下垂体の手術後、ACTH分泌不全と中枢性尿崩症がある10歳の子。ヒドロコルチゾンを始めたその夜から、尿が急に増えました。</div><p>副腎そのものではなく、<strong>ACTHが出ない</strong>ために起こるのが中枢性副腎不全です。原発性とは、見つけ方も、補い方も、少しずつ違います。</p>\n<h3>見つけにくい</h3>\n<p>中枢性では、ACTHもコルチゾールも<strong>正常範囲にとどまることがある</strong>ので、安静時の値だけでは見抜けません。<strong>インスリン低血糖試験</strong>などの負荷が必要になります。ただしインスリン負荷では、低血糖によるけいれんや、その治療で入れるブドウ糖による低K血症に十分な注意が要ります（巻の一で見たとおり、乳児やACTH分泌不全が疑われる子では避けることも）。</p>\n<h3>アルドステロンは保たれる</h3>\n<p>アルドステロンを動かすのは主にレニン・アンジオテンシン系で、ACTHではありません。だから中枢性では<strong>アルドステロンは保たれ</strong>、<strong>高K血症は出ず</strong>、<strong>ミネラルコルチコイドの補充はふつう要りません</strong>。原発性との大きな違いです。それでも、第3話で見たように、コルチゾール不足だけで水がたまって低Naになることはあります。</p>\n<h3>補充の量</h3>\n<div class=\"formula\">ヒドロコルチゾン 乳児 9〜12 mg/m²/日、幼児以降 6〜9 mg/m²/日を下回らない量（分2〜3）</div>\n<p>大事なのは<strong>生理的な分泌量を下回らない</strong>ことです。グルココルチコイドは成長を抑えるので多すぎもよくありませんが、足りなければ危険です。原発性の維持量（10〜15 mg/m²/日）より少なめで足りることが多いのは、ACTHがなくても副腎がわずかに働いていることがあるからです。</p>\n<h3>冒頭の夜：隠れていた尿崩症</h3>\n<p>巻の二で見た<strong>仮面尿崩症</strong>です。コルチゾールが足りないあいだは、AVPが出すぎ気味で水が出せず、尿崩症が隠れていました。ヒドロコルチゾンを入れたとたん、水が出るようになって多尿が表に出たのです。</p>\n<p>だから、ACTH分泌不全と中枢性尿崩症がある子で補充を始めるときは、<strong>水利尿が出るまでデスモプレシンを控える</strong>という順番になります。この順番を知らないと、急な多尿を薬の副作用と誤解してしまいます。始める前に家族へ伝えておくと、夜中に慌てずにすみます。</p>\n<h3>ほかの前葉ホルモンとの順番</h3>\n<p>甲状腺ホルモンはコルチゾールの代謝を速めるので、<strong>副腎が先、甲状腺はあと</strong>（巻の三）。GHも副腎と甲状腺を補ってから（巻の一）。下垂体機能低下症の補充は、いつもこの順番です。</p>", "keys": ["中枢性はACTH・コルチゾールが正常範囲のこともあり、負荷試験が要る", "アルドステロンは保たれ高Kなし。鉱質コルチコイドの補充は通常不要", "HCは乳児9〜12、幼児以降6〜9 mg/m²/日を下回らない", "補充開始で仮面尿崩症が出る。水利尿が出るまでデスモプレシンを控える", "補充の順番：副腎→甲状腺→GH"], "upd": null, "quiz": [{"v": "", "q": "中枢性副腎皮質機能低下症でACTH分泌能を評価するときの注意は。", "o": ["ACTH・コルチゾールが正常範囲にとどまることがあるため、インスリン低血糖試験などの負荷が必要になる", "ACTHが多くの例で低値となるため、基礎値で診断できることが多い", "インスリン低血糖試験は小児では避け、CRH試験で評価する", "コルチゾールが低ければACTH値にかかわらず原発性と考えてよく、インスリン低血糖試験などの負荷は要さない"], "a": 0, "e": "インスリン負荷では低血糖によるけいれん、治療のためのグルコース投与による低カリウム血症に十分な注意が要る。", "r": "小児内分泌学 p.427"}, {"v": "", "q": "中枢性副腎皮質機能低下症でのヒドロコルチゾン補充量として示されているのは。", "o": ["乳児 9〜12 mg/m2/日、幼児以降 6〜9 mg/m2/日を下回らない量、分2〜3", "乳児・幼児とも一律15 mg/m2/日、分3", "乳児 15〜20 mg/m2/日、幼児以降 10〜15 mg/m2/日を上回らない量、分3", "乳児 5 mg/m2/日、幼児以降 3〜5 mg/m2/日"], "a": 0, "e": "生理的分泌量を下回らないことが条件。原発性と異なり、通常ミネラルコルチコイドの補充は要さない。", "r": "治療 p.1141"}, {"v": "", "q": "ACTH分泌不全を合併した中枢性尿崩症で、グルココルチコイド補充を始めたときの対応は。", "o": ["水利尿が生じるまでデスモプレシンを控える", "デスモプレシンを増量して多尿に備える", "水分摂取を制限し、低Na血症を防ぐ", "グルココルチコイドを減量し、尿量の安定を待つ"], "a": 0, "e": "隠れていた尿崩症が顕在化するため。順序を知らないと、急な多尿を副作用と誤解する。", "r": "治療 p.1146"}]}, {"id": "a8", "lv": 2, "t": "新生児・早産児の副腎", "min": 6, "cats": "副腎不全・クリーゼ", "src": "小児内分泌学 p.176-177, 182, 425 ／ 治療 p.778, 1151-1152", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>超低出生体重で生まれた赤ちゃん。生後2週ごろ、急に血圧が下がり、輸液にもカテコラミンにも反応しません。尿が減り、胸のX線は白っぽくなってきました。</div><p>新生児、とくに早産児の副腎は、未熟で、しかも外からのストレスにさらされやすい存在です。NICUで出会う副腎の問題を3つ見ます。</p>\n<h3>晩期循環不全</h3>\n<p>冒頭の赤ちゃんです。超低出生体重児で、生後しばらくして、<strong>容量負荷にもカテコラミンにも反応しない循環不全</strong>が起こります。尿量が減り、肺の透過性も落ちます。視床下部・下垂体・副腎の未熟さに、人工呼吸、出生前のステロイド、感染などが重なった<strong>相対的な副腎不全</strong>と考えられています。</p>\n<p>特徴は、<strong>比較的少量のヒドロコルチゾンがよく効く</strong>ことです。1回の投与で、<strong>1〜2時間以内に血圧が上がる</strong>ことが多いのです。カテコラミンへの反応の低下、血管の透過性の亢進、血管の張りの低下が背景にあると考えられています。決まった診断基準はなく、敗血症など他の原因を除外しながら、デメリットの小さい治療として反応を見るために投与する施設が増えています。<strong>対応の遅れが予後を左右します</strong>。</p>\n<h3>慢性肺疾患とステロイド</h3>\n<p>早産児の慢性肺疾患に対するステロイドでは、<strong>生後7日以内のデキサメタゾンは脳性麻痺のリスクを上げる</strong>ため勧められていません。使うなら<strong>ヒドロコルチゾンを第一選択</strong>にします。一方で、デキサメタゾンを避けすぎることが肺の病気を重くしているという指摘もあり、神経の予後との兼ね合いで慎重に判断する領域です。</p>\n<h3>新生児の副腎出血</h3>\n<p>新生児の<strong>0.2〜0.3%</strong>に見られます。貧血、黄疸、お腹のしこりで気づかれ、<strong>神経芽腫との区別</strong>が必要です。出血は吸収されて石灰化していきます。副腎不全になってステロイドが必要になっても、<strong>経過中に離脱できる</strong>ことがあるので、補充を続けるかは定期的に見直します。</p>\n<h3>Waterhouse-Friderichsen症候群</h3>\n<p>重い感染症に伴うDICと<strong>両側の副腎出血</strong>で、急性の副腎不全が起こります。致死率はおよそ<strong>50%</strong>。髄膜炎菌が有名ですが、肺炎球菌やインフルエンザ菌でも報告されています。敗血症性ショックで、点状出血が広がり、昇圧薬が効かない子を見たとき、この病態を思い出せるかどうかが鍵です。</p>", "keys": ["晩期循環不全：超低出生体重児の治療抵抗性の低血圧。少量HCで1〜2時間以内に改善", "慢性肺疾患：生後7日以内のDEXは避け、使うならHCを第一選択", "新生児副腎出血は0.2〜0.3%。神経芽腫と鑑別、補充は離脱を検討", "Waterhouse-Friderichsen：DIC＋副腎出血、致死率約50%"], "upd": null, "quiz": [{"v": "超低出生体重児。生後しばらくして、容量負荷とカテコラミン投与に反応しない循環不全を呈した。尿量が減り、胸部X線で肺野の透過性が低下している。", "q": "考えるべき病態と対応は。", "o": ["晩期循環不全。比較的少量のヒドロコルチゾン投与が著効することが特徴", "敗血症性ショック。広域抗菌薬と大量輸液で対応する", "動脈管開存症による心不全。インドメタシンで閉鎖する", "相対的副腎不全。ヒドロコルチゾンは効かず、カテコラミンを増量して反応をみる"], "a": 0, "e": "1回のヒドロコルチゾン投与で1〜2時間以内に血圧が上昇する。デメリットは小さく、反応をみるために投与を試みる施設が増えている。", "r": "治療 p.1151-1152"}, {"v": "", "q": "新生児副腎出血の頻度と経過について正しいのは。", "o": ["新生児の0.2〜0.3%に認められ、吸収されて石灰化する。副腎機能不全でステロイドを要しても離脱できることがある", "新生児の約2%に認められ、多くは永続的な副腎不全となってステロイドを離脱できず、石灰化は生じないため画像では追えない", "新生児の0.2〜0.3%に認められるが、石灰化は生じず嚢胞化する", "ステロイドを始めたら、永続的に補充を続ける必要がある"], "a": 0, "e": "貧血・黄疸・腹部腫瘤で気づかれる。神経芽腫との鑑別が要る。補充を始めても、経過中に離脱の検討をする。", "r": "治療 p.778"}, {"v": "", "q": "Waterhouse-Friderichsen症候群について正しいのは。", "o": ["重症感染症に伴うDICと副腎出血により急性副腎不全を生じ、致死率はおおよそ50%とされる", "髄膜炎菌感染に限られ、致死率は約10%", "慢性経過をとり、徐々に副腎不全が進行して数年で補充を要するようになり、致死率は約10%とされる", "DICを伴わず、副腎出血のみで生じる"], "a": 0, "e": "髄膜炎菌が有名だが、肺炎球菌やインフルエンザ菌でも報告されている。ショックの児でこの病態を思い出せるかどうか。", "r": "小児内分泌学 p.425"}]}, {"id": "a9", "lv": 2, "t": "21水酸化酵素欠損症：見つける", "min": 6, "cats": "21水酸化酵素欠損症", "src": "p.277, 315-325 ／ 小児内分泌学 p.152, 171-172, 389-392 ／ 治療 p.1153", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>新生児マススクリーニングで17OHPが高いと連絡があった、在胎33週の男の子。元気に哺乳していて、Naも正常です。</div><p>先天性副腎過形成（CAH）の<strong>80〜90%以上</strong>が21水酸化酵素欠損症です。日本での頻度は1万8千〜2万人に1人で、新生児マススクリーニングの対象になっています。今日は「見つける」までを見ます。</p>\n<h3>何が起きている病気か</h3>\n<p>第1話の地図で、21水酸化酵素は<strong>コルチゾールとアルドステロンの両方の道</strong>にあります。ここが止まると、</p>\n<ul><li><strong>コルチゾールが作れない</strong> → ACTHが上がり、副腎が腫れる（過形成）</li>\n<li><strong>アルドステロンが作れない</strong> → 塩を失う（塩喪失型）</li>\n<li>行き場を失った材料（17OHPなど）が<strong>男性ホルモンの道へ流れる</strong> → 女の子の外性器が男性化する</li></ul>\n<p>塩喪失型は生後1〜2週で<strong>副腎クリーゼ</strong>を起こします。スクリーニングの導入前は、外性器で気づかれにくい<strong>男の子が命を落としやすく</strong>、男女比が偏っていました。導入後は、9割以上が生後2週以内に初診するようになりました。</p>\n<h3>スクリーニングの落とし穴：早産児</h3>\n<p>17OHPは、<strong>早産児・低出生体重児・ストレス</strong>で高くなり、ほかのステロイドとの交差反応もあります。冒頭の子は早産児なので、<strong>偽陽性</strong>の可能性を考えます。</p>\n<p>確定に役立つのが<strong>尿中ステロイドプロファイル（GC/MS）</strong>です。尿1〜2 mLで60種以上の代謝物を一度に測れ、21水酸化酵素欠損症では<strong>プレグナントリオロン</strong>の上昇で、早産児でも正期産児でも、ほぼ100%の精度で診断できます。17OHPが上がるほかの病気（POR欠損症、3βHSD2欠損症、11β水酸化酵素欠損症）との区別にも使えます。</p>\n<p>精密検査で急ぐべきなのは、<strong>Na 130未満やKの上昇</strong>があるときです。塩喪失が始まる前に診断することが大切です。</p>\n<h3>遺伝子のくせ：隣にいるそっくりさん</h3>\n<p>CYP21A2のすぐ隣には、<strong>そっくりな偽遺伝子（CYP21A1P）</strong>があります。二つがよく似ているので、組み換えで大きな欠失が起きたり、<strong>偽遺伝子の変異が本物に写し込まれたり</strong>（遺伝子変換）します。だから、<strong>両親が保因者でない子もいて</strong>、それは否定の材料になりません。</p>\n<h3>非古典型</h3>\n<p>軽い型は、思春期前後の早発陰毛や多毛、月経の乱れで見つかります（巻の五の早発陰毛やPCOSの回で除外すべきと書いた病気です）。日本人では<strong>Pro30Leu</strong>が多い変異です。基礎値だけでは判定できず、<strong>ACTH負荷後の17OHPが15 ng/mL以上</strong>が診断の目安です。治療が要るかは症状で判断し、症状のない人の扱いは定まっていません。</p>", "keys": ["CAHの80〜90%以上が21OHD。1.8〜2万人に1人", "コルチゾール・アルドステロン不足と、男性ホルモンへの流入", "17OHPは早産・低体重・ストレスで偽陽性。尿ステロイド（プレグナントリオロン）で確定", "Na<130やK上昇は精査を急ぐ", "CYP21A2は偽遺伝子と隣接。両親が保因者でなくても否定できない", "非古典型：日本人はPro30Leu、ACTH負荷後17OHP 15以上"], "upd": null, "quiz": [{"v": "日齢12の女児。Na 126 mEq/L、K 10.2 mEq/L、17OHP 422 ng/mL。外性器に男性化を認める。", "q": "最も適切な初期対応は。", "o": ["遺伝子検査と17OHPの結果を待って治療を開始する", "結果を待たずにステロイド補充と輸液を開始する", "経過観察する", "利尿薬を投与する"], "a": 1, "e": "塩喪失型の副腎クリーゼ。水として130〜200 mL/kg、Naとして5〜10 mEq/kgを含む輸液が必要になる。新生児ではNaClを最初から数 mEq/kg/日で入れることが望ましい、とされている。", "r": "症例1 p.277 / p.291 / p.295"}, {"v": "", "q": "新生児マススクリーニングの17OHPで偽陽性が問題になるのは。", "o": ["満期正常児の男児に多い", "低出生体重児・早産児", "出生後48時間以内に採血した女児", "男児のみ"], "a": 1, "e": "尿中プレグナントリオロン（P3）のGC/MS測定が確定に有用で、満期児・早産児のいずれでも診断を確定できると報告されている。", "r": "p.315-316 / 文献2"}, {"v": "", "q": "CYP21A2にde novo変異や遺伝子変換が生じやすい理由は。", "o": ["変異ホットスポットがあるから", "きわめて相同性の高い偽遺伝子が隣接して存在するから", "X染色体上にあるから", "CpG配列が多く、メチル化シトシンの脱アミノ化が起こりやすいから"], "a": 1, "e": "偽遺伝子CYP21A1Pとの間で組換えが起こる。両親が保因者でない症例があっても否定材料にならない。", "r": "レクチャー p.323"}]}, {"id": "a10", "lv": 3, "t": "21水酸化酵素欠損症：抑えすぎず、足りなすぎず", "min": 7, "cats": "CAHの治療とコントロール・21水酸化酵素欠損症", "src": "p.283-307 ／ 小児内分泌学 p.169-170, 393, 406, 414-415", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>21水酸化酵素欠損症の8歳の女の子。ACTHが高いので、前の主治医はヒドロコルチゾンを増やし続けていました。気づくと、身長の伸びが落ち、体重が増えています。</div><p>21水酸化酵素欠損症の治療は、<strong>どこかで折り合いをつける治療</strong>です。なぜなら、<strong>グルココルチコイドで過剰な男性ホルモンを完全に抑えることはできない</strong>からです。完全に抑えようとすれば、薬が多すぎて、低身長と肥満を招きます。</p>\n<h3>両側に崖がある</h3>\n<ul><li><strong>足りない</strong> → 副腎の男性ホルモンが増え、<strong>骨年齢が進んで</strong>最終身長を削る（骨年齢を進めるのは、男性ホルモンから変換された<strong>エストロゲン</strong>）</li>\n<li><strong>多すぎる</strong> → グルココルチコイドが<strong>成長を止め</strong>、肥満になる</li></ul>\n<p>ヒドロコルチゾンが<strong>30 mg/m²/日を超えると</strong>、最終身長が有意に低くなる（目標身長との差が約 −9 cm）と報告されています。冒頭の子は、こちら側の崖に落ちかけています。</p>\n<h3>維持量</h3>\n<div class=\"formula\">ヒドロコルチゾン 10〜15 mg/m²/日（新生児・乳児期は25 mg/m²/日程度まで）分2〜3<br>フルドロコルチゾン 0.025〜0.2 mg/日 ＋ 乳児期はNaCl</div>\n<h3>何を見て調節するか</h3>\n<p>巻物の原典がいちばん重視している指標は、<strong>早朝の第一尿（内服前）の尿中プレグナントリオロン（P3）</strong>です。血中の値は日内変動と内服のタイミングで大きく揺れるからです。そして、はっきり書かれているのが、<strong>「ACTHが高いというだけでは増量しない」</strong>ということ。冒頭の子の主治医は、まさにここでつまずいていました。</p>\n<p>フルドロコルチゾンと食塩が足りているかは、<strong>体重が増えているか</strong>がいちばん確かな答えです。レニン活性もあわせて見ます。色素沈着（ACTHが多いサイン）は、口唇と手のひらで見るのが実際的です。</p>\n<h3>デキサメタゾンは最終身長のあと</h3>\n<p>力価が強く骨への影響が大きいので、<strong>成長期には使いません</strong>。最終身長に達してから、ヒドロコルチゾンの1/150〜1/120ほどの量から使います。</p>\n<h3>手術の前は早めに</h3>\n<p>第5話のとおり、ストレスがかかってから追いかけるのでは遅いことがあります。<strong>手術の前日から増量</strong>しておいた例が紹介されています。</p>\n<h3>大人になってから</h3>\n<p>足りないと副腎のアンドロゲンが増えて、女性の<strong>無排卵</strong>や、男性の<strong>精巣内副腎遺残腫瘍（TART）</strong>が起こります。TARTはACTHが高いと大きくなる、精巣の中の副腎の組織で、<strong>精巣腫瘍と間違えて取らないよう</strong>注意します。まずコントロールを見直せば、縮むことがあります。多すぎれば、骨・脂質・糖の異常が出ます。妊娠を望む女性では、9例中8例が妊娠したという報告もあります。</p>\n<h3>出生前治療</h3>\n<p>妊娠中の母にデキサメタゾンを使って女児の男性化を防ぐ試みがありますが、男性化は妊娠8週までに始まるので<strong>性別が分かる前に始めざるを得ず</strong>、実際に必要な女児は<strong>8人に1人</strong>で、残り7人は不要な薬を浴びます。認知機能への影響も心配され、臨床研究としてのみ行うべきという立場が主流です。</p>", "keys": ["男性ホルモンを完全には抑えられない。折り合いをつける治療", "足りない→骨年齢促進、多すぎる→成長障害・肥満。HC 30 mg/m²/日超で最終身長が低下", "維持量：HC 10〜15（乳児は25まで）、フロリネフ0.025〜0.2、乳児はNaCl", "指標は早朝尿のプレグナントリオロン。ACTH高値だけで増量しない", "フロリネフと食塩は体重増加で判断", "DEXは最終身長後。TARTを腫瘍と間違えない"], "upd": "CAHの治療ガイドラインは改訂が続いています。用量と指標は最新版で確認してください。", "quiz": [{"v": "", "q": "21水酸化酵素欠損症のコントロール指標として本書が最も重視するのは。", "o": ["血中ACTH（正常化を目標にする）", "早朝第一尿・内服前の尿中プレグナントリオロン（P3）", "随時の血中17OHPを正常範囲まで下げること（最も鋭敏）", "血中コルチゾール（午前中の値）"], "a": 1, "e": "血中の値は日内変動と服薬タイミングで大きく振れる。ACTHが高いというだけでは増量しない、と明記されている。", "r": "p.291 / p.301-303"}, {"v": "", "q": "ヒドロコルチゾン投与量と最終身長の関係として報告されているのは。", "o": ["15 mg/m2/日を超える投与量では最終身長が有意に低くなる", "30 mg/m2/日を超える投与量では最終身長が有意に低くなる", "30 mg/m2/日までは影響がなく、それ以上では高身長となる", "投与量よりも開始年齢が最終身長を規定し、量は関係しない"], "a": 1, "e": "30 mg/m2以下の群と超える群で、最終身長と標的身長の差がそれぞれ約 −1.6 cm と約 −9.2 cm と報告されている。抑えすぎも害になる。", "r": "p.287"}, {"v": "", "q": "フロリネフとNaClの投与量が適正かを判断するのに最も有用な指標は。", "o": ["血清Na値", "体重増加率", "血清K値", "血圧"], "a": 1, "e": "数値が正常範囲でも足りていないことがある。体重が増えているかどうかが、いちばん確かな答えになる。", "r": "p.301"}]}, {"id": "a11", "lv": 3, "t": "ほかのCAHと、リポイド副腎過形成", "min": 7, "cats": "21水酸化酵素欠損症・リポイド副腎過形成", "src": "症例1 p.297-303 ／ 小児内分泌学 p.396-413", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>外性器の男性化がある46,XXの新生児。17OHPは高いけれど、母も妊娠中にひげが濃くなり、声が低くなっていた。赤ちゃんの肘の関節が少し固いのも気になります。</div><p>21水酸化酵素欠損症以外にも、ステロイドの地図のあちこちに「通行止め」があります。どこで止まったかで、<strong>血圧</strong>、<strong>男性化</strong>、<strong>副腎不全</strong>の出方がきれいに分かれます。</p>\n<h3>血圧が上がるCAH</h3>\n<ul><li><strong>11β水酸化酵素欠損症（CYP11B1）</strong>：コルチゾールの一歩手前で止まり、鉱質コルチコイド作用をもつDOCがたまる。<strong>高血圧・低K</strong>に、46,XXの男性化、46,XYの性早熟。ヒドロコルチゾンでACTHを抑えるとDOCが下がって血圧も下がる。血中ステロイドは交差反応を受けやすく、尿ステロイドプロファイルが役立つ</li>\n<li><strong>17α水酸化酵素欠損症（CYP17A1）</strong>：コルチゾールと性ホルモンの道が止まり、DOCとコルチコステロンがたまる。<strong>高血圧・低K</strong>と<strong>性腺機能低下</
