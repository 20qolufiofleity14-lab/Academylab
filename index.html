strong>（46,XYの外性器女性化、46,XXの原発性無月経）。コルチコステロンがコルチゾールの代わりをするので、<strong>副腎不全はまれ</strong></li></ul>\n<h3>男性化も、男性化不全も起こるもの</h3>\n<ul><li><strong>3β-HSD2欠損症</strong>：46,XYは男性化が不十分、46,XXは軽い男性化。副腎不全と色素沈着を伴う。Δ5/Δ4ステロイド比（17OHプレグネノロン/17OHPなど）の上昇が目印</li>\n<li><strong>POR（P450オキシドレダクターゼ）欠損症</strong>：冒頭の赤ちゃんです。PORは複数の酵素に電子を渡す「共通の部品」なので、CYP17A1・CYP21A2・アロマターゼ（CYP19A1）の働きがまとめて落ちます。46,XXの男性化、46,XYの男性化不全、<strong>妊娠中の母の男性化</strong>（胎盤のアロマターゼが落ちて男性ホルモンが母に回る）、<strong>骨格の異常</strong>（Antley-Bixler症候群）。日本人では<strong>Arg457His</strong>が7割以上。血圧はふつう正常で、色素沈着は目立たない。コルチゾールの基礎値は保たれても、ストレスでの反応が不十分なことがあり、ストレス時の補充を考える</li></ul>\n<p>第1話の「裏道（backdoor pathway）」は、POR欠損症の胎児期の男性化にも関わっています。</p>\n<h3>入り口が閉じる：リポイド副腎過形成</h3>\n<p><strong>StAR</strong>の異常で、コレステロールがミトコンドリアに入れず、<strong>すべてのステロイドが作れません</strong>。しかも、行き場を失ったコレステロールが細胞にたまって、<strong>細胞そのものを壊します</strong>。わずかに残る合成の時期と、蓄積で細胞が壊れる時期の、<strong>二段構え（two-hit）</strong>です。この二段構えが、発症が遅れる例がある理由にもなっています。副腎はCTで腫大して見えます。</p>\n<ul><li><strong>46,XY</strong>：精巣でもテストステロンが作れないので、外性器は<strong>女性型</strong></li>\n<li><strong>46,XX</strong>：卵巣は思春期まで働かないので蓄積を免れ、<strong>思春期が自然に来ることが多い</strong>（それでも約半数で女性ホルモンの補充が要る）。ただし、そのあと<strong>卵巣嚢胞</strong>が約7割にでき、<strong>卵巣捻転</strong>に注意。Kaufmann療法でLHを下げると嚢胞が縮む。定期的な超音波を</li></ul>\n<p>同じ最初の段階の障害でも、<strong>P450scc（CYP11A1）欠損症</strong>は副腎が腫れず、むしろ低形成で点状の石灰化を伴うことがあります。</p>", "keys": ["高血圧が出るのは11β（DOC蓄積、男性化）と17α（性腺機能低下、副腎不全はまれ）", "3β-HSD2はΔ5/Δ4比の上昇", "POR欠損：母の男性化・骨格異常・日本人はArg457His", "リポイド副腎過形成はStARの異常でtwo-hit。46,XYは女性型外性器", "46,XXは思春期が来ることが多いが、卵巣嚢胞と捻転に注意"], "upd": null, "quiz": [{"v": "", "q": "11β水酸化酵素欠損症（CYP11B1）の特徴と、診断上の注意は。", "o": ["高血圧・低K血症を伴う46,XXの男性化と46,XYの性早熟、成人低身長。11-デオキシコルチゾールとDOCが高値でPRA低値。血中ステロイドは測定キットの交差反応を受けるため尿ステロイドプロファイルが有用", "塩喪失と低血圧を伴い、17OHPは上がらずマススクリーニングで拾えず、外性器の異常は伴わない", "17OHPは上がらず、マススクリーニングで拾えない", "外性器の異常は伴わない"], "a": 0, "e": "TARTの合併も報告される。ヒドロコルチゾンでACTHを抑えるとDOCが下がり血圧が改善する。ストレス時の増量と副腎クリーゼへの備えは21水酸化酵素欠損症に準じる。", "r": "小児内分泌学 p.405-406"}, {"v": "", "q": "POR（P450オキシドレダクターゼ）欠損症の日本人に多い変異と、臨床の特徴は。", "o": ["p.Arg457Hisが日本人の70%以上を占め、白人ではp.Ala287Proが多い。46,XXの男性化・46,XYの男性化不全、母体の妊娠中の男性化、骨格異常（Antley-Bixler）、血圧は通常正常で色素沈着は目立たない", "p.Ala287Proが日本人に多く、高血圧と色素沈着が必発で、骨格異常は伴わず母体の男性化も起こらない", "高血圧と色素沈着が必発", "骨格異常は伴わない"], "a": 0, "e": "CYP17A1・CYP21A2・CYP19A1への電子供与が落ちる。マススクリーニングで17OHPが上がり、コルチコステロンやプレグネノロンも高値。尿中代謝物（11-OHアンドロステロン/プレグナンジオール比など）が診断に有用。成人女性の重症度は変異によらない。", "r": "小児内分泌学 p.411-413"}, {"v": "先天性リポイド副腎過形成の46,XX女性。思春期を自然に迎えたが、その後に多発性の卵巣嚢胞と卵巣腫大が進行し、腹痛で救急受診した。", "q": "最も警戒すべき合併症と対応は。", "o": ["卵巣捻転。女性ホルモン補充（Kaufman療法）で嚢胞を縮小させる", "卵巣癌。嚢胞は悪性化しやすいため両側卵巣を摘出する", "卵巣出血。輸血と止血のため緊急開腹する", "卵巣過剰刺激。ゴナドトロピン抑制のためGnRHアナログを用いて嚢胞を縮小させる"], "a": 0, "e": "約70%に卵巣嚢胞が生じるとされる。LH過剰が背景にあり、Kaufman療法で基礎値を下げて嚢胞を縮ませることができる。放置すれば捻転で緊急手術になる。", "r": "症例1 p.297-301"}]}, {"id": "a12", "lv": 3, "t": "副腎低形成とACTH不応症", "min": 7, "cats": "副腎低形成・ACTH不応症", "src": "症例 p.303-309 ／ 小児内分泌学 p.379-386, 412-414", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>生まれてまもなくから、肌の色がとても濃い赤ちゃん。低血糖を繰り返します。ACTHは1,500 pg/mLと非常に高く、コルチゾールは測れないほど低い。それなのに、NaもKも正常です。</div><p>副腎がうまく育たない病気と、ACTHの命令を受け取れない病気。どちらも「副腎が働かない」のですが、<strong>どの系統が残っているか</strong>で見分けます。</p>\n<h3>冒頭の子：ACTH不応症</h3>\n<p>コルチゾールだけが落ちて、<strong>アルドステロンは保たれている</strong>。だからNaもKも正常です。これは<strong>ACTH不応症</strong>（家族性グルココルチコイド欠損症）の典型です。アルドステロンはACTHではなくレニン系で動いているので、ACTHの受け手が壊れても残るのです。<strong>「電解質が正常だから副腎不全ではない」と読まない</strong>こと。手がかりは、<strong>全身の色素沈着</strong>（ACTHが高いと色素を作る作用も強まる）と<strong>低血糖</strong>です。</p>\n<p>原因は、ACTH受容体の<strong>MC2R</strong>や、その受容体を細胞の表面へ運ぶ<strong>MRAP</strong>の異常が代表です。最近は<strong>NNT</strong>や<strong>TXNRD2</strong>など、<strong>酸化ストレスを処理する分子</strong>の異常も見つかってきました。コルチゾールを作るには、酸化ストレスへの対処が欠かせない、という新しい理解です。NNTは全身で働くので、<strong>新生児期を過ぎてから発症</strong>したり、ゴナドトロピンの不足など<strong>ほかの臓器の障害</strong>を伴ったりすることがあり、長く見守ります。</p>\n<h3>赤毛と肥満：POMC異常症</h3>\n<p>POMCは、ACTHと、肌の色を作るMSHの<strong>共通の前駆体</strong>です。壊れると副腎不全に加えて、<strong>赤毛</strong>と<strong>肥満</strong>（食欲の調節もMSH系）が出ます。</p>\n<h3>DAX1異常症：副腎と性腺がセット</h3>\n<p><strong>X連鎖</strong>で、原則として男の子に発症します。副腎の低形成に、<strong>低ゴナドトロピン性性腺機能低下症</strong>がセットで来ます（巻の五のDAX1）。遅れて、大人になってから発症する例もあります。性腺そのものの機能も特殊で、<strong>ゴナドトロピンを補っても精子ができにくい</strong>ので、精巣内精子回収術での挙児の報告があります。Xp21の大きな欠失では、筋ジストロフィー（DMD）やグリセロールキナーゼ欠損を伴います。</p>\n<h3>SF1異常症：思っていた姿とちがう</h3>\n<p>SF1は副腎と性腺の両方に必要です（第2話）。最初はXYの性分化異常＋副腎不全として報告されましたが、報告が増えると、<strong>副腎不全を伴わない例がほとんど</strong>だと分かりました。報告が増えると病気の顔つきが変わる、というよい例です。</p>\n<h3>症候群として現れる副腎低形成</h3>\n<ul><li><strong>IMAGe症候群</strong>：子宮内発育遅延・骨幹端異形成・副腎低形成・性器異常。<strong>CDKN1C</strong>の機能獲得変異で、<strong>母から伝わったときだけ</strong>発症する（インプリンティング）。同じ遺伝子の機能喪失はBeckwith-Wiedemann症候群で、正反対の過成長になる</li>\n<li><strong>MIRAGE症候群</strong>：骨髄異形成・感染・成長障害・副腎低形成・性器・腸症。<strong>SAMD9</strong>。経過中に7番モノソミーを獲得して骨髄異形成になるので、骨髄を定期的に評価する</li>\n<li><strong>SGPL1欠損症</strong>：副腎不全に、ステロイド抵抗性ネフローゼ、魚鱗癬、神経障害を伴う</li></ul>", "keys": ["ACTH不応症はアルドステロンが保たれ電解質正常。色素沈着と低血糖が手がかり", "原因はMC2R・MRAP、近年はNNT・TXNRD2（酸化ストレス）", "POMC異常は赤毛と肥満", "DAX1はX連鎖、副腎低形成＋低ゴナドトロピン性。ゴナドトロピンが効きにくい", "SF1異常は副腎不全を伴わないことがほとんど", "IMAGe（CDKN1C、母由来）、MIRAGE（SAMD9）"], "upd": null, "quiz": [{"v": "生後まもなくから著明な色素沈着と反復する低血糖。ACTH 1,501 pg/mL、コルチゾール<0.5 μg/dL。一方でアルドステロンとPRAは保たれ、Na・Kは正常。", "q": "最も考えられるのは。", "o": ["21水酸化酵素欠損症", "ACTH不応症", "先天性リポイド副腎過形成", "副腎白質ジストロフィー"], "a": 1, "e": "糖質コルチコイド系だけが落ちて鉱質コルチコイド系が保たれる、という選択的な障害。MC2R（ACTH受容体）やMRAPの異常による。電解質が正常だから副腎不全ではない、と読まないこと。 家族性グルココルチコイド欠損症。", "r": "症例 p.303"}, {"v": "", "q": "DAX1（NR0B1）異常による先天性副腎低形成の特徴は。", "o": ["常染色体劣性で男女に発症し、性腺機能は保たれる", "X連鎖で原則男性に発症し、低ゴナドトロピン性性腺機能低下症を合併する", "X連鎖で男性に発症するが、性腺機能は正常", "X連鎖で男性に発症し、高ゴナドトロピン性性腺機能低下症を合併する（精巣の障害）"], "a": 1, "e": "副腎不全と性腺機能低下がセットで来る。遅発性の症例も知られており、成人期の発症もある。", "r": "症例1 p.305 / 文献3"}, {"v": "", "q": "IMAGe症候群の責任遺伝子と遺伝形式として正しいのは。", "o": ["CDKN1C（11p15.5、母由来アレルのみ発現）の機能獲得変異。母から伝わったときのみ発症する（インプリンティング）", "CDKN1Cの機能喪失変異（Beckwith-Wiedemann症候群と同じ）で、父由来のIGF2の過剰発現が重なる常染色体潜性", "父由来のIGF2の過剰発現", "常染色体潜性で、両親由来の変異が必要"], "a": 0, "e": "子宮内発育遅延・骨幹端異形成・副腎低形成・性器異常。高カルシウム尿症や筋緊張低下も。Beckwith-Wiedemannは同じ遺伝子の機能喪失で正反対の過成長になる。", "r": "小児内分泌学 p.382-383"}]}, {"id": "a13", "lv": 2, "t": "副腎白質ジストロフィー", "min": 5, "cats": "副腎白質ジストロフィー", "src": "p.311-313 ／ 小児内分泌学 p.416-417 ／ 治療 p.769-770, 1143", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>原因の分からない副腎不全の8歳の男の子。ヒドロコルチゾンで元気になりました。最近、先生から「字が汚くなった」「聞き返しが多い」と言われたそうです。</div><p>今日は、<strong>副腎不全の男の子を診たら、必ず頭に置いておきたい病気</strong>の話です。この病気には、治療の「窓」があります。そして副腎の外来は、その窓を開けられる数少ない場所です。</p>\n<h3>どんな病気か</h3>\n<p><strong>ABCD1</strong>の異常による<strong>X連鎖</strong>の病気で、原則として男性に発症します。ABCD1が作るALD蛋白が壊れると、<strong>極長鎖脂肪酸</strong>が分解されずにたまります。日本では約3万人に1人と推定されています。小児大脳型、副腎脊髄ニューロパチー（AMN）、副腎不全だけの型、そして女性の発症者など、いくつもの姿をとります。</p>\n<h3>副腎不全が先に来ることがある</h3>\n<p>いちばん大事な点です。副腎白質ジストロフィーは、<strong>副腎不全だけで始まり、神経の症状より先に来る</strong>ことがあります。副腎不全を治して「Addison病」で終わってしまうと、あとから神経症状が出たときには、治療の窓が閉じかけています。</p>\n<p>だから、<strong>原因の分からない副腎不全の男の子では、極長鎖脂肪酸（C26/C22比など）を必ず測ります</strong>。これが実際の結論です。家族歴のない子も6〜14%いて、新しく起きた変異でも発症するので、「家族にいないから違う」とは言えません。</p>\n<h3>最初の神経症状は、とても曖昧</h3>\n<p>冒頭の子のように、「<strong>聞こえにくい</strong>」「<strong>書き直しが多くなった</strong>」「<strong>字が汚くなった</strong>」といった、学校での小さな変化から始まります。学力や性格の問題とされてしまいがちな症状です。副腎不全の男の子の家族には、こうした変化に気づいたら教えてほしいと、先に伝えておきます。</p>\n<h3>治療の窓：造血幹細胞移植</h3>\n<p>有効性が確立している治療は<strong>造血幹細胞移植</strong>です。ただし、<strong>神経症状が進んでからでは効果が乏しい</strong>ので、早い段階で行うことが前提です。副腎不全で見つかった段階で診断できれば、この窓に間に合う可能性が高まります。</p>\n<h3>移植しても、副腎は治らない</h3>\n<p>移植は<strong>神経の症状には効きますが、副腎不全には効きません</strong>。だから副腎の補充は、移植のあとも続けます。この病気の副腎不全では、鉱質コルチコイドの欠乏は少なめで、遅れて出てきます。コントロールの指標も、21水酸化酵素欠損症の尿中P3のようなものは使えず、<strong>血中の値と臨床の様子</strong>で判断します。病気が違えば使える物差しも違う、ということです。</p>", "keys": ["ABCD1、X連鎖。極長鎖脂肪酸がたまる。約3万人に1人", "副腎不全が神経症状に先行することがある", "原因不明の副腎不全の男児では極長鎖脂肪酸を必ず測る", "初発の神経症状は「聞こえにくい・字が汚くなった」など曖昧", "造血幹細胞移植は早期に。神経には効くが副腎には効かない"], "upd": null, "quiz": [{"v": "", "q": "副腎不全の男児を診たときに副腎白質ジストロフィーを鑑別に置くべき理由は。", "o": ["副腎不全のみで発症し、神経症状に先行することがあるから", "必ず神経症状が先行するため、問診で拾えるから", "女児に多く、男児では見逃されやすいから", "副腎不全はALDの晩期症状で、診断の手がかりにならないから"], "a": 0, "e": "Addison病だけを見て終わると、移植の窓を逃す。原因が特定できない副腎不全の男児では極長鎖脂肪酸を測る、が実務上の結論になる。", "r": "p.311"}, {"v": "", "q": "副腎白質ジストロフィーの診断に用いる生化学的指標は。", "o": ["極長鎖脂肪酸", "17OHP", "VLDL", "アシルカルニチン"], "a": 0, "e": "ABCD1がコードするALDタンパクの異常で極長鎖脂肪酸が蓄積する。男児の原因不明の副腎不全では必ず測る。 C26/C22比など。", "r": "表 p.311"}, {"v": "", "q": "副腎白質ジストロフィーの初発症状として挙げられているのは。", "o": ["「聞こえにくい」「書き直しが多くなった」「字が汚くなった」など", "多尿・多飲と体重減少", "反復するけいれんと発熱", "色素沈着と低血糖のみで、神経症状は副腎不全の数年後に現れるため初発症状にはならない"], "a": 0, "e": "神経症状は最初とても曖昧な形で出る。学校からの指摘がきっかけになることもある。", "r": "p.313"}]}, {"id": "a14", "lv": 2, "t": "アルドステロンが効かない・作れない", "min": 6, "cats": "偽性低アルドステロン症・21水酸化酵素欠損症・CAHの治療とコントロール", "src": "小児内分泌学 p.419-422 ／ 治療 p.276-278, 772-775", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>哺乳が弱く、体重が増えない新生児。高K血症と代謝性アシドーシス、尿へのNaの排泄が多い。副腎不全を疑ってレニンとアルドステロンを測ると、どちらも著しく高値でした。</div><p>塩を失って高K血症になる。副腎不全によく似ていますが、<strong>アルドステロンがむしろ高い</strong>。冒頭の子は、アルドステロンが「出ているのに効かない」病気です。今日は、アルドステロンが<strong>効かない</strong>病気と<strong>作れない</strong>病気を見ます。</p>\n<h3>効かない：偽性低アルドステロン症1型（PHA1）</h3>\n<p>レニンもアルドステロンも高いのに、塩を失い、低Na・高K・アシドーシスになります。頻度は約4万7千人に1人。そして、<strong>二つの型で予後がまったく違います</strong>。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>腎型</th><th>全身型</th></tr>\n<tr><td>原因</td><td>MR（NR3C2）</td><td>ENaC（SCNN1A/B/G）</td></tr>\n<tr><td>遺伝</td><td>常染色体顕性</td><td>常染色体潜性</td></tr>\n<tr><td>経過</td><td>軽症、1〜3歳で改善</td><td>重症、生涯にわたる</td></tr></table></div>\n<p>全身型が腎の外にも症状を出すのは、<strong>ENaCが汗腺・唾液腺・肺・腸にもある</strong>からです。気道の分泌物がたまって呼吸の症状を起こしたり、皮膚炎を伴ったりします。</p>\n<p>治療は食塩の補充です。腎型は約1 g/kg/日の食塩で1〜3歳に良くなっていきます。全身型は食塩だけでは不十分なことが多く、<strong>Kの摂取を厳しく制限</strong>したら塩喪失が落ち着き、体重が増えた例も報告されています。急性期のショックには等張液20 mL/kgを繰り返し、高Kにはカルシウム、陽イオン交換樹脂、GI療法で対応します。急に補正しすぎないことにも注意します。</p>\n<h3>二次性の偽性低アルドステロン症（3型）</h3>\n<p><strong>尿路感染症や尿路の形成異常</strong>に伴って、PHA1とよく似た状態になることがあります。急に重症化し、命に関わる高K血症になった例もあります。原因の治療で良くなります。乳児の高K血症では、尿路感染症の有無を確かめます。</p>\n<h3>逆向き：偽性低アルドステロン症2型（Gordon症候群）</h3>\n<p>名前は似ていますが、こちらは<strong>高K血症・代謝性アシドーシスに、高血圧</strong>を伴います。腎の遠位尿細管でNaClを取り込む輸送体が働きすぎている状態で、WNK1・WNK4・KLHL3・CUL3の異常によります。<strong>CUL3</strong>によるものがいちばん低年齢で重症です。治療は<strong>サイアザイド</strong>で、1週間ほどで改善します。アシドーシスが良くなることは、成長障害の改善にもつながります。</p>\n<h3>作れない：アルドステロン合成酵素欠損症</h3>\n<p>球状層の最後の酵素（CYP11B2）が働かず、アルドステロンだけが作れない病気です。治療は<strong>フルドロコルチゾン0.1〜0.3 mgと食塩（2〜3 g/日）</strong>。大きくなって自分で塩をとれるようになっても、フルドロコルチゾンは続けます。代謝物やレニンが正常に下がれば、補充を減らせます。</p>", "keys": ["PHA1はレニン・アルドステロン高値なのに塩喪失・高K", "腎型（MR、顕性、1〜3歳で改善）と全身型（ENaC、潜性、生涯）", "全身型はENaCが汗腺・肺・腸にもあるため全身に症状。K制限が有効なことも", "二次性PHAは尿路感染・尿路異常で。乳児の高Kでは尿路感染を確認", "PHA2（Gordon）は高K＋高血圧、サイアザイドが効く。CUL3が最重症", "アルドステロン合成酵素欠損はフルドロコルチゾン＋食塩"], "upd": null, "quiz": [{"v": "新生児。哺乳力低下、高カリウム血症、代謝性アシドーシス、尿中Na排泄増加。血漿レニンとアルドステロンはともに著明高値。", "q": "最も考えられるのは。", "o": ["偽性低アルドステロン症I型", "21水酸化酵素欠損症", "アルドステロン合成酵素欠損症", "副腎低形成"], "a": 0, "e": "アルドステロンが出ているのに効かない。発症頻度は約1/47,000。MR（NR3C2）の異常によるものは常染色体顕性で比較的軽症、ENaCの異常によるものは全身型で重症になる。 PHA I。", "r": "小児内分泌学 p.420-421"}, {"v": "", "q": "PHA1の慢性期治療として本書が示すのは。", "o": ["全身型は食塩を中止し、スピロノラクトンで治療して高K血症を是正する", "腎型はフルドロコルチゾンで治療し、食塩は不要で成人まで継続する", "両型ともヒドロコルチゾンの補充で改善し、食塩やK制限は不要である", "腎型は約1 g/kg/日の食塩で1〜3歳に改善、全身型は食塩継続とK制限"], "a": 3, "e": "K摂取量の制限（0.6 mEq/kg/日）を厳格に行ったところ塩喪失が改善し有効な体重増加が得られた症例が報告。通常全身型では食塩の補充のみでは治療として不十分とされ、Naの十分な補充にもかかわらず頻回の塩喪失を繰り返しK摂取量の制限を厳格に行ったところ塩喪失が改善し有効な体重増加が得られた症例が報告。レニン・アルドステロンは自然に低下傾向を示すが成人となっても高値が続く症例も多く治療目標としては適していない。腎型は感染症時などで塩喪失をきたす可能性があることに留意。全身型は急性期にショックをきたして死亡することもある。", "r": "治療 p.277"}, {"v": "", "q": "偽性低アルドステロン症3型（二次性PHA）の原因と治療は。", "o": ["自然軽快するため治療は不要で、高K血症が重症化することはない", "尿路感染症や尿路形成異常などに伴うPHA1類似の病態で、原疾患治療で改善", "遺伝性で生涯の食塩補充が必要となり、基礎疾患の治療では改善しない", "サイアザイドで治療し、高血圧の管理が中心で電解質は自然に改善する"], "a": 1, "e": "急激に重症化し致死的な高K血症を呈する症例も報告されている。尿路感染症や尿路形成異常以外のまれな基礎疾患として尿細管間質性腎炎、SLE腎症、鎌状赤血球性腎症が報告されている。", "r": "治療 p.278"}]}, {"id": "a15", "lv": 3, "t": "アルドステロンが多すぎる・効きすぎる", "min": 6, "cats": "CAHの治療とコントロール・副腎の発生と生理・21水酸化酵素欠損症", "src": "小児内分泌学 p.435-437", "vol": "巻の六 副腎", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>高校1年の男の子。健診で血圧が150/95。お父さんも若いころから高血圧で、おじさんは40代で脳卒中を起こしたそうです。</div><p>前の回の逆向き、<strong>アルドステロンが多すぎる、または効きすぎる</strong>病気です。どれも<strong>若いうちからの高血圧</strong>で見つかります。子どもの高血圧の多くは肥満や腎の病気ですが、ここで取り上げる病気は、治療法がはっきりしているので見つける価値が大きいのです。</p>\n<h3>ACTHで動くアルドステロン：グルココルチコイド奏効性アルドステロン症（GRA）</h3>\n<p>冒頭の家族です。アルドステロンは本来レニン系で動きますが、この病気では<strong>ACTHの命令でアルドステロンが作られて</strong>しまいます。</p>\n<p>原因は、<strong>CYP11B1（コルチゾールを作る酵素）のスイッチ部分（プロモーター）</strong>と、<strong>CYP11B2（アルドステロン合成酵素）</strong>がつながった<strong>キメラ遺伝子</strong>です。ACTHでスイッチが入るのに、作るのはアルドステロン。だから、ACTHを抑えればアルドステロンも下がります。</p>\n<ul><li>手がかり：<strong>20歳以下の若い高血圧</strong>、<strong>若い脳卒中の家族歴</strong>。血清Kは正常のことが多い（低Kがないからと否定しない）</li>\n<li>治療：<strong>低用量のデキサメタゾンを寝る前に</strong>。早朝のACTHの山を抑えるため</li></ul>\n<h3>門番が壊れる：見かけのミネラルコルチコイド過剰症（AME）</h3>\n<p>第2話の<strong>11β-HSD2</strong>を覚えているでしょうか。腎でコルチゾールを不活性なコルチゾンに変え、アルドステロンの受容体に届かせない門番でした。この門番が生まれつき壊れているのがAME（HSD11B2の異常）です。大量のコルチゾールがそのまま受容体に結合して、<strong>アルドステロンが低いのに、アルドステロンが多すぎるような状態</strong>（高血圧・低K）になります。</p>\n<p>治療は、受容体をふさぐ薬です。スピロノラクトンより<strong>女性化乳房の副作用が少ないエプレレノン</strong>が勧められます。デキサメタゾンでACTHを抑える方法は、成長への影響から勧められません。サイアザイドやアミロライドなどを併用します。</p>\n<p>ちなみに、ヒドロコルチゾンを大量に使うと高血圧や低Kが起こりうるのも、この門番の処理が追いつかなくなるからでした。同じ仕組みが、病気と薬の副作用の両方を説明します。</p>\n<h3>この章を振り返って</h3>\n<p>11β水酸化酵素欠損症と17α水酸化酵素欠損症の高血圧（第11話）、PHA2の高血圧（第14話）、そして今日のGRAとAME。<strong>若い高血圧と低K</strong>を見たら、レニンとアルドステロンを測り、ステロイドの地図のどこで何が起きているかを考えます。</p>\n<p>巻の六はここまでです。副腎の病気は、第1話の地図と、「どの系統が落ちて、どの系統が残っているか」という問いで、ほとんどが解けるはずです。</p>", "keys": ["若い高血圧・若い脳卒中の家族歴でGRAを考える（Kは正常のことが多い）", "GRAはCYP11B1プロモーター＋CYP11B2のキメラ。寝る前の低用量DEXで治療", "AMEは11β-HSD2の異常。アルドステロン低値なのに高血圧・低K", "AMEにはエプレレノン。DEXは成長への影響で勧めない", "若い高血圧・低Kはレニンとアルドステロンを測り、地図のどこかを考える"], "upd": null, "quiz": [{"v": "", "q": "グルココルチコイド奏効性アルドステロン症（GRA）の分子機序と治療は。", "o": ["CYP11B1のプロモーターとCYP11B2が融合したキメラ遺伝子により、ACTH依存性にアルドステロンが分泌される。低用量デキサメタゾンで治療する", "CYP11B2のプロモーターとCYP11B1が融合したキメラ遺伝子により、アンジオテンシンII依存性にコルチゾールが分泌される。スピロノラクトンで治療する", "CYP11B1プロモーターの欠失によりコルチゾールが低下する。ヒドロコルチゾンで治療する", "MRの機能獲得変異によりアルドステロン作用が増強する。エプレレノンで治療する"], "a": 0, "e": "20歳以下の若年発症高血圧、若年発症の脳卒中の家族歴が手がかり。血清Kは正常範囲にとどまることが多い。早朝のACTH上昇を抑えるため就寝前に内服する。", "r": "小児内分泌学 p.435"}, {"v": "", "q": "見かけのミネラルコルチコイド過剰症（AME、HSD11B2異常）の治療で推奨されるのは。", "o": ["女性化乳房の副作用が少ないエプレレノン（スピロノラクトンより）", "低用量デキサメタゾンで内因性ACTHを抑制してコルチゾールを減らす", "フルドロコルチゾンで受容体を飽和させる", "スピロノラクトン（女性化乳房は問題にならない）"], "a": 0, "e": "デキサメタゾンによる内因性ACTH抑制は成長への影響から推奨されない。サイアザイドやアミロライド、トリアムテレンを併用する。", "r": "小児内分泌学 p.437"}, {"v": "", "q": "偽性低アルドステロン症II型（Gordon症候群）の特徴と治療は。", "o": ["高カリウム血症・高クロール性代謝性アシドーシス・高血圧を呈し、サイアザイド利尿薬が有効", "低カリウム血症・代謝性アルカローシス・高血圧を呈し、スピロノラクトンまたはエプレレノンが有効", "高カリウム血症・低血圧で、食塩補充が必要", "低カリウム血症・低血圧で、サイアザイドは禁忌"], "a": 0, "e": "WNK1/WNK4/KLHL3/CUL3の異常による。CUL3によるものが低年齢で診断されより重症。代謝性アシドーシスの改善は成長障害の改善にもつながる。", "r": "小児内分泌学 p.422"}]}];
const DSD = [{"id": "x1", "lv": 1, "t": "性腺はどちらに傾くか", "min": 5, "cats": "性分化の基本と説明・46,XY DSD", "src": "p.367-369, 391 ／ 小児内分泌学 p.334", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>「SRYがあれば男の子、なければ女の子」。学生のころそう覚えた先生が、SRY陰性なのに精巣を持つ46,XXの男の子に出会いました。教科書が間違っていたのでしょうか。</div><p>この章は、性がどう決まっていくのか、そしてその途中で「いつもと違う道」を通った子どもたちをどう支えるのか、という話です。最初の2回で地図を描き、そのあとで一つずつ病気を見ていきます。</p>\n<h3>はじめは、どちらにもなれる</h3>\n<p>胎児の性腺は、はじめ<strong>未分化性腺</strong>として生まれます。精巣にも卵巣にもなれる状態です。副腎の章の第2話で見たように、副腎と性腺は同じ原基から生まれ、そこには<strong>SF1</strong>が欠かせません。</p>\n<p>ここから精巣に向かうか卵巣に向かうかは、二つの力の綱引きで決まります。</p>\n<div class=\"formula\">SOX9 優位 → 精巣　／　βカテニン（WNT4・RSPO1）優位 → 卵巣</div>\n<p>大事なのは、この二つが<strong>互いを抑え合う</strong>関係にあることです。片方が立ち上がれば、もう片方は抑えられる。だから片方が崩れると、反対側の分化が呼び込まれます。</p>\n<h3>SRYは「スイッチ」にすぎない</h3>\n<p>では、SRYはどこにいるのか。SRYは、<strong>SOX9を立ち上げるスイッチ</strong>です。Y染色体上のSRYが働くとSOX9のスイッチが入り、SOX9が自分で自分を増幅して、綱引きを精巣側に決めます。</p>\n<p>ということは、SRYがなくても<strong>SOX9そのものが十分に働けば</strong>精巣はできます。冒頭の46,XXの男の子は、<strong>SOX9の重複</strong>によるSRY陰性の46,XX male でした。教科書が間違っていたのではなく、「SRY＝男」という覚え方が一歩手前で止まっていたのです。</p>\n<p>反対に、SOX9が足りなければ、SRYがあっても精巣になりきれません。第11話で出てくる<strong>campomelic dysplasia</strong>（SOX9異常症）は、骨の形成と精巣の分化が同時に障害される病気です。SOX9は骨にも精巣にも必要だからです。</p>\n<h3>どちらの型が多いか</h3>\n<p>SRY陰性の46,XY DSD（精巣にならない）は、SRY陽性の46,XX DSDより多く見られます。精巣に分化しない46,XYの胎児は、流産しにくいためと説明されています。一方、SRY陽性の46,XXは、移ってきたY染色体成分の大きさによって二つに分かれ、片方はほぼふつうの男性の姿をとります。</p>\n<h3>この章を読むときの姿勢</h3>\n<p>この章でいちばん大事なのは、知識の量より<strong>言葉の選び方</strong>かもしれません。本書は、本人に「<strong>違うだけで、異常ではない</strong>」というスタンスが伝わるように話すことを実践しています。男性にもXY以外にXXY、XY/X、XXなどがあり、女性にもXXX、X/XYなどがある。それを幅のある事実として伝えます。</p>\n<p>冒頭の先生は、外来でこう説明しました。「性の決まり方は、スイッチ一つではなく、いくつもの段階の積み重ねです。お子さんは、その途中で少し違う道を通りました」。次の回は、性腺ができたあと、ホルモンが体の形を作っていく段階です。</p>", "keys": ["未分化性腺はSOX9（精巣）とβカテニン（卵巣）の綱引きで決まる。互いに抑え合う", "SRYはSOX9を立ち上げるスイッチ。SOX9重複でSRY陰性46,XX male", "SOX9不足ではcampomelic dysplasia（骨と精巣分化が同時に障害）", "SRY陰性46,XY DSDはSRY陽性46,XXより多い（流産しにくい）", "説明の基本は「違うだけで、異常ではない」"], "upd": null, "quiz": [{"v": "", "q": "未分化性腺が精巣あるいは卵巣へ分化する仕組みとして述べられているのは。", "o": ["SRYの有無だけで決まり、その後の因子は分化を維持するにすぎない", "SOX9優位で精巣、βカテニン優位で卵巣となり、互いを抑制し合う", "AMHが卵巣化を抑えることで精巣が決まる", "SOX9とβカテニンが協調して働き、量の多寡で精巣か卵巣かが決まる"], "a": 1, "e": "どちらか一方が立てばもう一方が抑えられる、拮抗する関係。だから片方の破綻が反対側の分化を呼び込む。", "r": "p.391 / p.369"}, {"v": "", "q": "SOX9の重複によって生じるのは。", "o": ["46,XY完全型性腺形成不全（SRY陽性でも卵巣化）", "46,XX male（SRY陰性の精巣発生）", "46,XY DSD（SOX9の過剰発現で精巣が退縮）", "46,XX 卵精巣性DSD（両側にovotestis）"], "a": 1, "e": "SRYがなくてもSOX9が十分に働けば精巣ができる。SRYはSOX9を立ち上げるスイッチにすぎない、という理解につながる。", "r": "p.367 / 文献1"}, {"v": "", "q": "SRY陰性46,XY DSDがSRY陽性46,XX DSDより多い理由として説明されているのは。", "o": ["SRY陰性46,XY DSDでは性腺が精巣に分化せず、リンパ系への影響が少ないため流産しにくいこと", "SRY陽性46,XX DSDは胎生期に致死となる例が多く、出生に至らないことが大部分だからと考えられている", "46,XY DSDのほうが原因遺伝子の数が多いこと", "SRY陰性例では外性器が男性型となり発見されやすいこと"], "a": 0, "e": "SRY陽性46,XX DSDはY染色体成分のサイズにより二つに分かれ、片方はほぼ正常男性の表現型をとる。", "r": "小児内分泌学 p.334"}]}, {"id": "x2", "lv": 1, "t": "ホルモンが形を作る", "min": 6, "cats": "性分化の基本と説明", "src": "p.349, 385, 389 ／ 小児内分泌学 p.161, 335 ／ 治療 p.723-726", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>精巣はちゃんとあって、テストステロンも出ている。それなのに外性器は女の子に近い形をしている。研修医が首をひねっています。「テストステロンが出ているなら、男性化するはずでは？」</div><p>前の回で、性腺がどちらに傾くかを見ました。今日はその先、<strong>性腺が出すホルモンが、内性器と外性器の形を作っていく</strong>段階です。ここが分かると、この章の病気の半分は「どの担当者が働かなかったか」で整理できます。</p>\n<h3>担当者は三人</h3>\n<p>精巣からは二種類の細胞が、それぞれ別の仕事をします。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>出す細胞</th><th>ホルモン</th><th>仕事</th></tr>\n<tr><td>Sertoli細胞</td><td>AMH</td><td>Müller管（子宮・卵管・腟上部のもと）を退縮させる</td></tr>\n<tr><td>Leydig細胞</td><td>テストステロン</td><td>Wolff管（精巣上体・精管）を傍分泌で維持する</td></tr>\n<tr><td>（皮膚などで変換）</td><td>DHT</td><td>外性器を男性化する</td></tr></table></div>\n<p>ポイントは、<strong>外性器の男性化はテストステロンではなくDHT</strong>の仕事だということです。テストステロンは5α還元酵素でDHTに変えられて、はじめて外性器に強く働きます。冒頭の子は、まさにここでつまずいていました。答えは第13話で出てきます。</p>\n<p>卵巣はAMHもテストステロンも出しません。だからWolff管は自然に退縮し、Müller管が育ちます。「何もしなければ女性型」という基本設計です。外性器は胎生12週までに、生殖結節・陰唇陰嚢隆起・尿道ひだが男性型に変わります。</p>\n<h3>Leydig細胞を動かすもの</h3>\n<p>Leydig細胞は、はじめは<strong>胎盤のhCG</strong>、後半は<strong>胎児自身のLH</strong>で刺激されます。だから胎児期後半にLHが足りない子（低ゴナドトロピン性）では、形はおおむね男性型でも、<strong>陰茎が小さく、精巣が降りきらない</strong>ことがあります。思春期の章の第13話で見たKallmann症候群などの先天性低ゴナドトロピン性で、新生児期の小陰茎や停留精巣が手がかりになるのはこのためです。</p>\n<h3>精巣が降りるのはINSL3の仕事</h3>\n<p>精巣の下降には、テストステロン以上に<strong>INSL3</strong>（受容体はRXFP2）が大事だと考えられています。ノックアウトマウスは腹腔内停留精巣になります。一方、テストステロン不足による停留精巣では精巣そのものの問題が残るため、固定術をしても生殖能力が戻るとは限りません。停留精巣は約100人に1人、尿道下裂は1,000〜2,500人に1人と、決して珍しくありません。</p>\n<h3>母のアンドロゲンを止める関門と、裏道</h3>\n<p>お母さんの体にも男性ホルモンはあります。それが胎児の女の子を男性化させないのは、<strong>胎盤のアロマターゼ</strong>がエストロゲンに変えてしまうからです。この関門が破れる病気は第5話で出てきます。</p>\n<p>もう一つ、副腎の章の第1話で見た<strong>backdoor pathway</strong>。17OHPやプロゲステロンから、テストステロンを通らずにDHTへ至る裏道です。21水酸化酵素欠損症やPOR欠損症の女の子の男性化に関わります。ただし、表の道も裏道も、最後は<strong>5α還元</strong>を通ります。だから5α還元酵素欠損症では、両方とも止まります。</p>\n<p>副腎と性腺の作るものが違うのは、<strong>組織ごとに持っている酵素の組み合わせが違う</strong>からです。出発点は同じコレステロール。副腎網状層も17βHSD（タイプV）でテストステロンを少し作りますし、最近は11-オキシアンドロゲンという新しい男性ホルモンも見つかっています。</p>\n<p>研修医への答えはこうなります。「テストステロンが出ていても、DHTに変わらなければ、あるいは受け手が応えなければ、外性器は男性化しない」。誰が出して、何に変わって、誰が受け取るのか。この三段階を、この章ではずっと使います。</p>", "keys": ["AMH（Sertoli）がMüller管を退縮、T（Leydig）がWolff管を維持、DHTが外性器を男性化", "卵巣はAMHもTも出さない＝何もしなければ女性型", "Leydig細胞は前半は胎盤hCG、後半は胎児LHで刺激", "精巣下降はINSL3が重要。停留精巣約1/100、尿道下裂1/1,000〜2,500", "胎盤アロマターゼが母体アンドロゲンを止める。backdoorも最後は5α還元"], "upd": null, "quiz": [{"v": "", "q": "内性器・外性器の分化で、ホルモンと標的の対応として正しいのは。", "o": ["Sertoli細胞のAMHがMüller管を退縮させ、Leydig細胞のテストステロンが傍分泌的にWolff管を維持し、DHTが外性器を男性化する", "AMHがWolff管を維持し、テストステロンがMüller管を退縮させ、DHTは内性器の分化を担う（外性器はテストステロン）", "DHTが内性器を、テストステロンが外性器を分化させる", "卵巣がエストロゲンを分泌することでMüller管が発達する"], "a": 0, "e": "卵巣はAMHもテストステロンも出さないため、Wolff管は退縮しMüller管が発達する。胎生12週までに生殖結節・陰唇陰嚢隆起・尿道ひだが男性型へ。Leydig細胞は初期は胎盤hCG、後期は胎児LHで刺激される。", "r": "小児内分泌学 p.161"}, {"v": "", "q": "男性外性器の発生に最も重要なホルモンは。", "o": ["テストステロン（DHTへの変換は不要）", "ジヒドロテストステロン（DHT）", "AMH", "エストラジオール"], "a": 1, "e": "Wolff管の維持はテストステロン、外性器の男性化はDHT。同じ男性化でも担当が分かれている。", "r": "p.385"}, {"v": "", "q": "backdoor pathwayについて正しいのは。", "o": ["DHT産生に寄与し、5α還元酵素欠損症ではfrontdoorとともに障害される", "DHT産生に寄与するが、5α還元酵素を介さないため5α還元酵素欠損症では保たれる", "テストステロンを経由してDHTを作る経路である", "副腎ではなく胎盤でのみ働く経路である"], "a": 0, "e": "17OHPやプロゲステロンから、テストステロンを経由せずにDHTへ至る経路。21水酸化酵素欠損症やPORDでの男性化にも関わる。", "r": "図5 p.389 / p.353"}]}, {"id": "x3", "lv": 1, "t": "生まれた日の対応：性別を急いで告げない", "min": 6, "cats": "性分化の基本と説明", "src": "p.349 ／ 小児内分泌学 p.102, 345, 352 ／ 治療 p.75-76", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>夜の分娩室。生まれた赤ちゃんの外性器を見て、助産師さんが言葉を詰まらせました。お父さんが聞きます。「男の子ですか、女の子ですか」。あなたが呼ばれました。</div><p>判別がむずかしい外性器をもつ赤ちゃんは、<strong>4,500〜5,500人に1人</strong>の割合で生まれます。小児内分泌医なら、いつかこの場面に立ちます。今日は、その最初の数時間から2週間までにやることを見ます。</p>\n<h3>最初のひとこと</h3>\n<p>いちばん避けたいのは、<strong>予測した性別を安易に告げる</strong>ことです。あとで違った場合、家族の中で一度決まった性別を取り消すのは、とてもつらいことだからです。原則として、男女どちらかを確信できないときは<strong>保留</strong>するほうが間違いは少ないとされています。</p>\n<p>言葉も選びます。「外性器の成熟がゆっくり進んでいるようです」「性分化疾患という体質があるかもしれません」。何が分かっていて、何がまだ分からないかを、正直に、慎重に伝えます。初対面から時間をかけて、ていねいに説明して信頼関係をつくることが、その後のすべての決定をスムーズにします。</p>\n<h3>まず命を守る</h3>\n<p>外性器が非定型的な子の<strong>約半数</strong>は、性染色体異常と<strong>先天性副腎皮質過形成（CAH）</strong>です。副腎の章で見た<strong>塩喪失型の21水酸化酵素欠損症</strong>なら、生後1〜2週で副腎クリーゼに陥ります。だから外性器を診るのと同時に、<strong>17OHPと電解質</strong>を確認します。DSDが「速やかに評価すべき」とされるのは、命に関わる病気が含まれているからです。</p>\n<h3>どこを、どう診るか</h3>\n<ul>\n<li><strong>性腺は触れるか、どこにあるか</strong>：触れる性腺は、たいてい精巣成分を含み、相応のテストステロン作用があったと考えます。</li>\n<li><strong>陰唇陰嚢ひだ</strong>：癒合の程度、しわ、そして<strong>色素沈着</strong>。色素沈着はACTH過剰、つまり副腎不全のサインです。</li>\n<li><strong>尿道口の位置</strong>と、<strong>共通尿生殖洞</strong>の有無。</li>\n<li>男性化の程度は<strong>Prader分類</strong>で記録します。</li>\n<li>骨盤部超音波で<strong>子宮</strong>の有無。46,XXの21水酸化酵素欠損症なら子宮と卵巣が見えます。</li>\n</ul>\n<h3>チームで考える</h3>\n<p>性別の決定、手術をするかどうか、本人にいつ話すか。どれも一つの科では決められません。小児内分泌、小児外科・泌尿器科、産婦人科、新生児科、心理、遺伝。<strong>多職種のチーム</strong>で、定期的なカンファレンスの形で検討します。</p>\n<h3>出生届と2週間</h3>\n<p>社会的な性は、<strong>生後2週以内</strong>を目安に、できる範囲で速やかに決めます。医療スタッフは家族に寄り添い、分かったことを遅れずに共有します。ただ、戸籍法第49条は<strong>生後14日以内</strong>の出生届を求めています。間に合わないときの方法は二つあります。</p>\n<ul>\n<li>性別・氏名を空欄のまま届け出て、あとで<strong>追完</strong>する</li>\n<li><strong>医師の証明書</strong>を添えて、15日以降に届け出る</li>\n</ul>\n<p>どちらでもかまいません。大事なのは、家族が「急いで決めなければ」と追い詰められないことです。</p>\n<p>分娩室のお父さんには、こう答えました。「いまは、どちらとお伝えするのは控えさせてください。外性器の発達がゆっくりな体質の可能性があります。赤ちゃんの体を守る検査を今夜から始めて、分かったことはすぐにお伝えします。決めるまでに時間をかけても大丈夫な仕組みもあります」。次の回で、その検査を組み立てます。</p>", "keys": ["判別不明性器は4,500〜5,500人に1人。予測した性別を安易に告げない", "約半数は性染色体異常とCAH。17OHPと電解質をすぐ確認", "触れる性腺、陰唇陰嚢ひだの色素沈着（ACTH過剰）、尿道口、Prader分類、子宮", "多職種チームで検討する", "社会的性は2週以内が目安。出生届は空欄で追完、または医師証明書で15日以降も可"], "upd": null, "quiz": [{"v": "", "q": "判別不明性器の新生児で、出生届を性別未決定のまま対応する方法として述べられているのは。", "o": ["性別・氏名未記載で届け出て後日追完、または医師証明書を添え15日以降に届出", "14日以内に暫定的に性別を決めて届け出て、法律上の性が決まり次第家庭裁判所で訂正する", "家庭裁判所の許可を得て性別未記載で届け出て、1年以内に性別を追完する", "出生届を提出せず、法律上の性の決定後に出生証明書を再発行してから届け出る"], "a": 0, "e": "戸籍法第49条では生後14日以内に出生届を提出すべきと記載されている。いずれの方法でもよいが、初対面から時間をかけてていねいかつ真摯に両親へ説明し信頼関係を樹立することが、その後の法律上の性や治療方針のスムーズな決定に重要。判別不明性器をもつ児は4,500人から5,500人に1人の割合で出生する。原則として男性か女性かを確信できない場合には保留すれば間違いは少ない。出生直後の家族には「外性器の成熟が遅めで進んでいるようです」「性分化疾患という体質があるかもしれません」など言葉を選び慎重に説明する。予測した性別を安易に告げるのはよくない。", "r": "治療 p.75"}, {"v": "", "q": "新生児の外性器男性化の程度を評価する分類は。", "o": ["Prader分類", "Tanner分類", "Sillence分類", "Quigley分類のみ"], "a": 0, "e": "性腺の触知の有無とあわせて判別する。触知した性腺は相応のテストステロン作用があったと考えられる。皮膚色素沈着はACTH過剰、すなわち副腎不全のサインになる。", "r": "小児内分泌学 p.345"}, {"v": "", "q": "DSDの診療で「速やかに評価すべき」とされる理由は。", "o": ["塩喪失型21水酸化酵素欠損症のように生命に関わる病態が含まれ、家族の精神的負担も大きいため", "性別の決定を出生後1週間以内に行い、外性器形成術を新生児期に計画するため", "外性器形成術を新生児期に行うため", "染色体検査の結果が出るまで哺乳を止める必要があるため"], "a": 0, "e": "外性器の評価と同時に17OHP・電解質を確認する。経験の豊富な施設で多職種チームが対応する。", "r": "小児内分泌学 p.102"}]}, {"id": "x4", "lv": 1, "t": "検査を組み立てる：分類と初期評価", "min": 6, "cats": "性分化の基本と説明・46,XY DSD", "src": "小児内分泌学 p.102-103, 332, 341, 346 ／ 治療 p.694", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>前の回の赤ちゃん。染色体の結果が出るまで数日かかります。「それまでに何を測っておけば、次の一手が早くなりますか」と、新生児科の先生に聞かれました。</div><p>DSDの検査は、闇雲に並べるより、<strong>分類の地図</strong>を先に持っておくほうが速く進みます。今日はその地図と、最初の採血の組み立てです。</p>\n<h3>軸は染色体</h3>\n<p>いまのDSDの分類は、<strong>染色体核型を軸</strong>にしています。昔の「仮性半陰陽」などの言葉は使いません。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>分類</th><th>主な病気</th></tr>\n<tr><td>性染色体異常のDSD</td><td>Turner症候群、Klinefelter症候群、混合型性腺形成不全（45,X/46,XY）、キメラ</td></tr>\n<tr><td>46,XY DSD</td><td>精巣の形成の障害、アンドロゲンの合成の障害、アンドロゲンの作用の障害</td></tr>\n<tr><td>46,XX DSD</td><td>アンドロゲン過剰（21水酸化酵素欠損症など）、卵巣の形成の障害</td></tr></table></div>\n<p>この章の後半は、ほぼこの表の順に進みます。</p>\n<h3>最初に測るもの</h3>\n<p>染色体を待つあいだに、<strong>17OHP・テストステロン・LH/FSH・AMH</strong>を測っておきます。読み方はこうです。</p>\n<ul>\n<li><strong>17OHPが高い</strong>：21水酸化酵素欠損症（副腎の章の第9話）</li>\n<li><strong>AMHが正常でテストステロンが低い</strong>：精巣はあるのに作れない＝アンドロゲン合成の障害</li>\n<li><strong>AMHが低い</strong>：精巣そのものができていない＝性腺形成の障害</li>\n<li><strong>AMHもテストステロンも正常〜高い</strong>：作れているのに効かない＝アンドロゲン作用の障害を考える</li>\n</ul>\n<p><strong>尿ステロイドプロファイル</strong>も役に立ちます。どの酵素で止まっているかを、一度にたくさんの代謝物から読めます。</p>\n<h3>AMHが頼りになる理由</h3>\n<p>精巣成分があるかどうかを見るには、テストステロンより<strong>AMH</strong>が優れています。AMHはSertoli細胞から出て、<strong>下垂体ゴナドトロピンの調節を受けにくい</strong>からです。性腺が触れない子でも、AMHが測れれば「精巣はどこかにある」と、侵襲的な検索の前に一つ絞り込めます。</p>\n<p>一方テストステロンは、新生児期には<strong>胎盤由来のhCGの影響</strong>で上がることがあり、生後数日は変動が大きく読み違えやすい値です。思春期の章の第2話で見た<strong>ミニ思春期（生後2〜3か月）</strong>は、性腺の働きを負荷試験なしで見られる貴重な窓です。必要ならここで測り直します。</p>\n<p>形の確認には、泌尿生殖器の超音波とMRIを使います。</p>\n<h3>遺伝子診断の位置づけ</h3>\n<p>次世代シークエンスで、コピー数異常も含めた網羅的な解析ができるようになりました。遺伝子が分かると、<strong>将来の性腺腫瘍や性別違和の起こりやすさ</strong>をある程度予測できます。ただし46,XY DSDで確定診断に届くのは<strong>30〜40%</strong>ほど。分からないことが多い領域だと、家族にも正直に伝えます。</p>\n<p>新生児科の先生への答えは、「17OHPと電解質、テストステロン、LH/FSH、AMHを今日。超音波で子宮を見て、尿ステロイドプロファイルも出しておきましょう」。染色体が届いたとき、表のどの行に入るかがすぐ決まります。</p>", "keys": ["分類は染色体が軸：性染色体異常／46,XY DSD／46,XX DSD。旧用語は使わない", "初期検査は17OHP・T・LH/FSH・AMH、尿ステロイドプロファイル", "AMH正常＋T低値＝合成障害、AMH低値＝形成障害", "精巣成分の評価はTよりAMH（ゴナドトロピンの影響を受けにくい）", "新生児期のTは変動大。ミニ思春期（生後2〜3か月）が窓。遺伝子診断は30〜40%"], "upd": null, "quiz": [{"v": "", "q": "DSDの初期評価で測定すべき項目と、注意点として正しいのは。", "o": ["17OHP・テストステロン・LH/FSH・AMHを測る。生後数日のテストステロンは変動が大きく、評価は生後2〜3か月のミニ思春期に留意する", "染色体検査の結果が出るまでホルモン測定は行わない", "テストステロンは生後1日目が最も安定しており、ミニ思春期は考慮しなくてよい", "AMHは保険適用で、精巣の有無の判定に必須"], "a": 0, "e": "17OHP上昇なら21水酸化酵素欠損症。AMH正常でテストステロン低値ならアンドロゲン合成障害、AMH低値なら性腺形成不全を疑う。尿ステロイドプロファイルも有用。", "r": "小児内分泌学 p.103"}, {"v": "", "q": "精巣成分の有無を評価するうえで、テストステロンより指標として優れるとされるのは。", "o": ["AMH（Sertoli細胞から産生され、下垂体ゴナドトロピンの調節を受けにくい）", "インヒビンB（Leydig細胞から産生され、LHの調節を受けにくいため安定する）", "エストラジオール（精巣での芳香化を反映する）", "LH（精巣成分がなければ高値となる）"], "a": 0, "e": "新生児期は胎盤由来hCGの影響でテストステロンが上昇することがあり、読み違えやすい。加えて泌尿生殖器の超音波とMRIで形態を確認する。", "r": "小児内分泌学 p.346"}, {"v": "", "q": "DSDの病因分類として正しいのは。", "o": ["①性染色体異常（Turner、Klinefelter、MGD、キメラ）、②46,XY DSD（性腺形成・アンドロゲン合成／作用の障害）、③46,XX DSD（アンドロゲン過剰など）", "①外性器の型、②性腺の型、③社会的性の3分類", "①先天性、②後天性の2分類", "①内分泌性、②非内分泌性の2分類"], "a": 0, "e": "旧来の「仮性半陰陽」などの用語は用いない。染色体核型を軸にした分類で、原因探索の道筋が決まる。", "r": "小児内分泌学 p.102"}]}, {"id": "x5", "lv": 2, "t": "46,XX DSD：女の子が男性化するとき", "min": 6, "cats": "46,XX DSD", "src": "p.349-357 ／ 小児内分泌学 p.344", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>46,XXの赤ちゃん。外性器は男性化していて、頭蓋縫合が早く閉じかけ、肘が伸びきりません。問診で、お母さんが「妊娠中にひげが濃くなって、声も低くなった」と話してくれました。</div><p>46,XXの子が男性化するとき、男性ホルモンは<strong>どこから来たのか</strong>を考えます。児の体の中か、母か、外からの薬か。今日はこの順で見ていきます。</p>\n<h3>児の体の中から：三つの酵素</h3>\n<ul>\n<li><strong>21水酸化酵素欠損症</strong>：いちばん多い原因。副腎の章で詳しく見ました。</li>\n<li><strong>アロマターゼ（CYP19A1）欠損症</strong></li>\n<li><strong>P450オキシドレダクターゼ欠損症（PORD）</strong></li>\n</ul>\n<h3>母も男性化する二つの病気</h3>\n<p>第2話で、胎盤のアロマターゼが母のアンドロゲンを止める関門だと見ました。逆向きにも働いていて、<strong>胎児のアンドロゲンが母へ流れ込むのも防いでいます</strong>。だからアロマターゼが欠けると、<strong>児も母も男性化</strong>します。母の多毛やにきびは、出産すると良くなります。</p>\n<p>アロマターゼ欠損症の女の子は、思春期にはエストロゲンが作れないので、補充が必要です。男の子の例では<strong>高身長と骨年齢の遅れ</strong>が見られます。男性でも骨端線を閉じるのはエストロゲンだ、ということを教えてくれる病気です。</p>\n<p><strong>PORD</strong>も母を男性化させます。PORは、CYP17A1・CYP21A2・CYP19A1など多くの酵素に<strong>電子を渡す</strong>係です。アロマターゼも止まるので母が男性化し、コレステロール合成のCYP51A1にも関わるので<strong>骨の異常</strong>（頭蓋縫合早期癒合、橈尺骨癒合、関節拘縮）を伴います。冒頭の赤ちゃんは、PORDでした。</p>\n<p>PORDには落とし穴があります。<strong>マススクリーニングで17OHPが上がる</strong>ことがあり、21水酸化酵素欠損症と紛らわしいのです。数字だけで決めずに、骨の所見や母の病歴を見ます。尿ステロイドプロファイルが診断に役立ちます。</p>\n<h3>母と外から</h3>\n<p>外因性には、妊娠中の<strong>男性ホルモンの投与</strong>、母の<strong>妊娠ルテオーマや卵巣腫瘍</strong>があります。児だけでなく母も見にいく、というのが46,XX DSDの基本です。</p>\n<h3>出生前治療は「9週」</h3>\n<p>21水酸化酵素欠損症の女の子の男性化を防ぐため、母にデキサメタゾンを使う出生前治療があります。ただし<strong>妊娠9週より前</strong>に始めなければ意味がありません。外性器の分化はそれほど早く決まります。</p>\n<h3>家族に伝えたい二つのこと</h3>\n<p>21水酸化酵素欠損症の46,XXの子について、早いうちに伝えたいことがあります。一つは、外性器が男性化していても<strong>内性器は女性で、女性として妊娠できる</strong>こと。もう一つは、<strong>多くは女性としての性自認</strong>をもつことです。この二つは、家族の不安を大きく減らします。</p>\n<h3>男性化しない46,XX：MRKH症候群</h3>\n<p>最後に、方向の違う病気を一つ。<strong>Mayer-Rokitansky-Küster-Hauser症候群</strong>は、Müller管由来の子宮と腟上部ができません。卵巣は正常なので、<strong>乳房も恥毛もふつうに来ます</strong>。来ないのは月経だけ。原発性無月経の鑑別で、「ホルモンが正常だから違う」と外さないことです。脊椎や腎の形成異常、難聴を伴うことがあります。</p>\n<p>冒頭のお母さんには、こう伝えました。「お母さんの声やひげの変化は、赤ちゃんの体の酵素の働き方と関係していました。お母さんのせいではありませんし、出産後は戻っていきます」。</p>", "keys": ["46,XXの男性化：21OHD、アロマターゼ欠損症、PORD、母の薬・ルテオーマ・腫瘍", "アロマターゼ欠損症とPORDは母も男性化する（胎盤の関門が働かない）", "PORDは骨癒合異常を伴い、スクリーニングで17OHPが上がる", "出生前デキサメタゾンは妊娠9週前に開始しないと無意味", "21OHDの46,XXは女性として妊娠可能、多くは女性の性自認。MRKHは月経だけが来ない"], "upd": null, "quiz": [{"v": "46,XXの新生児。外性器の男性化があり、頭蓋縫合の早期癒合と橈尺骨癒合、関節拘縮を認める。母は妊娠中に男性化症状を呈していた。", "q": "最も考えられるのは。", "o": ["21水酸化酵素欠損症（骨格異常は伴わない）", "P450オキシドレダクターゼ欠損症（PORD）", "アロマターゼ欠損症（母体の男性化を伴うが骨格異常はない）", "11β水酸化酵素欠損症（高血圧を伴う）"], "a": 1, "e": "PORはCYP17A1・CYP21A2・CYP19A1などに電子を供給し、コレステロール合成に関わるCYP51A1にも関与する。だから骨癒合異常を伴う。母体の男性化も特徴。尿ステロイドプロファイルが診断に有用。", "r": "症例 p.351-353"}, {"v": "46,XXの女児。出生時に外性器の男性化を認めたが、その後の二次性徴では乳房腫大と恥毛発育は正常に発来した。母は妊娠中に多毛と痤瘡を認め、分娩後に軽快した。", "q": "最も考えられるのは。", "o": ["アロマターゼ（CYP19A1）欠損症", "21水酸化酵素欠損症（母体の男性化は伴わない）", "アンドロゲン不応症", "混合型性腺形成不全"], "a": 0, "e": "胎児のアンドロゲンが母体へ流入するのを防いでいるのが胎盤アロマターゼ。欠損すると母体も男性化する。また男性例では高身長と骨年齢遅延を呈し、男性の骨成熟をエストロゲンが担うことを示す。", "r": "小児内分泌学 p.344"}, {"v": "", "q": "21水酸化酵素欠損症の46,XX症例の妊孕性について、両親に説明すべきことは。", "o": ["妊娠は不可能である", "女性として妊娠可能であること", "必ず不妊治療を要し、自然妊娠は望めないこと", "説明は不要である"], "a": 1, "e": "外性器の男性化があっても内性器は女性であり、多くは女性としての性自認をもつ。この2点を早い段階で伝えることが勧められている。", "r": "p.357"}]}, {"id": "x6", "lv": 1, "t": "Turner症候群を見つける", "min": 6, "cats": "Turner症候群", "src": "p.339-343 ／ 小児内分泌学 p.353-355 ／ 治療 p.85", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>6歳の女の子。身長は−2.8 SD。成長曲線を見ると、生まれてからずっと少しずつ離れていっています。「でもこの子、ちゃんと元気なんです」とお母さん。首の後ろが、少しだけ広く見えました。</div><p>Turner症候群は、<strong>女性2,000人に1人</strong>。成長障害の章の第2話で「低身長の女の子には染色体を」と見ましたが、今日はその理由を、症候群全体の姿として見ていきます。</p>\n<h3>年齢ごとの入り口</h3>\n<p>新生児期は、<strong>手背・足背のリンパ浮腫</strong>と<strong>翼状頸</strong>が入り口です。幼児期以降は、<strong>低身長</strong>がいちばんの入り口になります。思春期には、思春期が来ないことで見つかる子もいます。</p>\n<h3>翼状頸は「引っぱらない」</h3>\n<p>翼状頸は、<strong>正面または背面から見て、首の輪郭に線が見えるか</strong>で判断します。皮膚を引っぱると、皮膚が伸びやすい子で偽陽性になります。乳幼児は首が短く分かりにくいのですが、重い子なら寝た姿勢でも分かります。</p>\n<h3>背が低い理由：SHOX</h3>\n<p>低身長の主な原因は、X染色体の端にある<strong>SHOX遺伝子のハプロ不全</strong>です。成人身長は一般の女性より<strong>12〜20 cmほど低く</strong>なります。成長障害の章の第11話で見たSHOX異常症と、同じ仕組みです。</p>\n<h3>核型の内訳と、Y染色体</h3>\n<p>45,Xは<strong>40〜50%</strong>で、残りはモザイクや構造異常です。残っているX染色体は60〜80%が母由来。そして<strong>10〜12%にY染色体成分</strong>があります。Y成分があると<strong>性腺芽腫</strong>のリスクがあるので、性腺摘出を考えます（第8話）。</p>\n<p>なお、45,X/46,XY（混合型性腺形成不全）や、SHOXの異常による低身長だけの子は、Turner症候群には含めません。</p>\n<h3>どのくらいの頻度で、何が起きるか</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>所見</th><th>頻度の目安</th></tr>\n<tr><td>低身長</td><td>95〜100%</td></tr>\n<tr><td>性腺機能低下</td><td>90〜95%</td></tr>\n<tr><td>思春期が自然に来る</td><td>約50%</td></tr>\n<tr><td>心血管の異常（大動脈二尖弁・縮窄）</td><td>約30〜50%</td></tr>\n<tr><td>腎の形成異常（馬蹄腎など）</td><td>約30〜40%</td></tr></table></div>\n<p>ほかに、耐糖能異常、甲状腺機能低下症（橋本病）、セリアック病、肝酵素の上昇、中耳炎をくり返したあとの難聴、多発する色素性母斑、側弯。知能はほとんどが正常範囲ですが、<strong>計算や視空間認知が苦手</strong>という非言語性の学習の困難があり、発達性協調運動障害や注意の問題を伴いやすいとされます。</p>\n<h3>卵巣はどうなっていくか</h3>\n<p>Turner症候群の卵巣は、胎生12週ごろまでは正常にできます。そこから急速に<strong>線維化</strong>が進み、卵母細胞が失われて<strong>索状性腺</strong>になっていきます。思春期前にすべて失われれば原発性無月経、思春期のあとで失われれば続発性無月経です。</p>\n<h3>FSHは「谷」で測らない</h3>\n<p>卵巣が働かないので、FSH・LHは<strong>乳幼児期に高く、6歳ごろまでいったん下がり、思春期年齢で再び上がります</strong>。思春期の章の第2話で見たミニ思春期と静止期の波が、Turnerでは大きく出るのです。だから<strong>谷の時期に測って正常だったから否定、とはできません</strong>。</p>\n<p>冒頭の女の子の染色体は、45,Xでした。首の輪郭の線は、正面から見るとはっきり分かりました。「元気なのは本当です。そのうえで、背と、心臓と、これからの思春期を一緒に見ていきましょう」。次の回は、その「これから」の話です。</p>", "keys": ["女性2,000人に1人。新生児はリンパ浮腫・翼状頸、幼児期以降は低身長が入り口", "翼状頸は正面か背面から輪郭の線で見る（引っぱらない）", "低身長はSHOXハプロ不全。45,Xは40〜50%、Y成分10〜12%", "心血管異常30〜50%、腎形成異常30〜40%、自然思春期約50%", "FSHは乳幼児期高値→谷→思春期で再上昇。谷で測って否定しない"], "upd": null, "quiz": [{"v": "", "q": "翼状頸の評価方法として本書が推奨するのは。", "o": ["首の皮膚を指でつまんで引っ張り、伸展の程度で判断する", "正面あるいは背面から、輪郭の線がみえるかで判断する", "つまんで厚みを測る", "年長になるまで判断しない"], "a": 1, "e": "引っ張ると皮膚の伸展性のある症例で偽陽性になる。乳幼児は首が相対的に短く判断しにくいが、重度の症例なら寝かせた状態でも分かる。", "r": "図4 p.342-343"}, {"v": "", "q": "Turner症候群の診断から除外されるものと、核型の内訳として正しいのは。", "o": ["45,X/46,XY（MGD）やSHOX異常による低身長のみの例は除外する。45,Xが40〜50%、残りはモザイクや構造異常で、10〜12%にY染色体成分を認める", "モザイクはTurner症候群に含めず、Y染色体成分を認めれば必ず除外し、45,Xが90%以上を占めるため染色体検査は45,Xの確認で足りる", "Y染色体成分を認めれば必ず除外する", "45,Xが90%以上を占める"], "a": 0, "e": "頻度は女性2,000人に1人。残るX染色体は60〜80%が母由来。Y成分があれば性腺芽腫のリスクのため性腺摘出を考える。", "r": "小児内分泌学 p.353"}, {"v": "", "q": "Turner症候群の症状とおおよその有病率の組み合わせとして正しいのは。", "o": ["低身長95〜100%、性腺機能低下90〜95%、自然発来する思春期約50%、心血管異常（大動脈二尖弁・縮窄）約30〜50%、腎奇形（馬蹄腎など）約30〜40%", "低身長50%、性腺機能低下20%、心血管異常は5%未満、自然発来する思春期は5%未満で、腎奇形はまれ", "心血管異常は5%未満", "自然発来する思春期は5%未満"], "a": 0, "e": "ほかに耐糖能異常、甲状腺機能低下症、セリアック病、肝酵素上昇、難聴、外反肘、翼状頸、リンパ浮腫、多発性色素性母斑。骨年齢の遅れ、脊柱側弯も。", "r": "小児内分泌学 p.354-355"}]}, {"id": "x7", "lv": 2, "t": "Turner症候群：エストロゲンと大動脈", "min": 7, "cats": "Turner症候群", "src": "p.343-348 ／ 小児内分泌学 p.356 ／ 治療 p.86-88", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>前の回の女の子は12歳になりました。GH治療で身長は138 cm。「胸がまだなんです。友達はもう…」と小さな声。そして循環器の先生から、上行大動脈の径が少し太いという連絡も来ています。</div><p>Turner症候群の子を長く診ていくとき、思春期に向けて考えることは二つあります。<strong>エストロゲンをいつ、どう始めるか</strong>。そして、<strong>大動脈をどう見守るか</strong>です。</p>\n<h3>いつ始めるか：140 cmと、骨</h3>\n<p>わが国のガイドラインでは、GH治療をしながら<strong>12歳以降、遅くとも15歳までに140 cmに達した時点</strong>で、少量のエストロゲンを始めるのが目安です。もともと背がとても低い子では、140 cmに届かなくても本人と相談して始めます。</p>\n<p>以前は、エストロゲンが骨端線を閉じてしまうので、身長のために開始を遅らせるのがよいとされていました。けれども、<strong>成長スパートの時期にエストロゲンが足りないと骨密度が十分に獲得できず</strong>、大人になってから骨粗鬆症や骨折が増えます。Turnerの子は、補充を始める前から腰椎の骨密度が<strong>−2 SD以下</strong>のことが多いのです。少量のエストロゲンは骨年齢をそれほど進めないことも分かってきました。</p>\n<p>国際ガイドラインは、LHとFSHを11歳より前から毎年測り、正常範囲なら自然な思春期を待ち、11〜12歳でゴナドトロピンが上がってきたら始めることを勧めています。</p>\n<h3>どう始めるか：ごく少量から、2年かけて</h3>\n<p>原則は<strong>ごく微量から</strong>です。急に立ち上げると骨端線が早く閉じます。推奨される製剤は<strong>経皮のエストラジオール（エストラーナ®）</strong>。生理的で、肝臓の初回通過がなく、血栓のリスクが低いからです。</p>\n<div class=\"formula\">エストラーナ® 0.09 mg → 0.18 → 0.36 → 0.72 mg（各6〜12か月、最後は6か月）<br>プレマリン® 1/10錠 → 1/4 → 1/2 → 1錠</div>\n<p>どちらも約2年で成人量にし、成人量で6か月たつか途中で出血があれば、プロゲスチンを加える<strong>Kaufmann療法</strong>に移ります。思春期の章の第14話で見た流れと同じです。乳房の発育は、ふつう始めて6か月以内に見られます。</p>\n<h3>大動脈：静かに太くなる</h3>\n<p>Turner症候群で、いちばん重い長期の合併症は<strong>大動脈の拡張と解離</strong>です。大動脈二尖弁や縮窄があると拡張を伴いやすく、高血圧やQT延長も起こりやすくなります。</p>\n<p>大動脈の太さは、体の大きさで補正して読みます。<strong>aortic size index（ASI）</strong>です。</p>\n<div class=\"formula\">予防手術を考える目安：16歳以上で 上行大動脈径 4 cm以上 または ASI 2.5 cm/m²以上</div>\n<p>拡張の程度によっては運動の制限も必要になります。妊娠を考えるときには、<strong>妊娠前の心血管評価が必須</strong>です（次の回）。</p>\n<h3>定期的に見るもの</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>項目</th><th>間隔</th></tr>\n<tr><td>血圧・甲状腺機能</td><td>1年ごと</td></tr>\n<tr><td>HbA1c・血糖・肝機能</td><td>10歳以降で1年ごと</td></tr>\n<tr><td>25(OH)D・セリアック病</td><td>10歳以降で2年ごと</td></tr>\n<tr><td>心エコー／大動脈MRI</td><td>問題なければ5年ごと（リスクがあれば短く）</td></tr>\n<tr><td>聴力</td><td>3年ごと</td></tr>\n<tr><td>骨密度</td><td>エストロゲン補充の節目に</td></tr></table></div>\n<p>甲状腺の抗体は半数以上で陽性になるという自験データもあります。甲状腺の章の第10話の橋本病を、ここでも思い出してください。</p>\n<p>12歳の彼女は、エストラーナ®のごく少量のテープから始めることになりました。「ゆっくり始めるのは、背と骨の両方を守るためだよ」。大動脈は、次の検査を1年後に早めました。</p>", "keys": ["少量エストロゲンは12歳以降・遅くとも15歳までに140 cmで開始（GH併用時）", "遅らせすぎると骨密度が獲得できない。補充前から骨密度低値が多い", "経皮E₂を原則に、ごく微量から約2年で成人量→Kaufmann療法", "最重要の長期合併症は大動脈拡張・解離。手術目安は径4 cmまたはASI 2.5", "甲状腺・肝・血糖は年1回、心エコー/MRIは5年ごと（リスクで短縮）"], "upd": null, "quiz": [{"v": "", "q": "わが国のガイドラインでTurner症候群の少量エストロゲン療法を開始する目安は。", "o": ["GH治療で12歳以降、遅くとも15歳までに140 cmに達した時点", "11〜12歳でゴナドトロピンの上昇を認めた時点（身長は問わない）", "骨端線が閉鎖し身長の伸びが止まった時点（年齢は問わない）", "診断時から年齢・身長によらず、GH治療と同時に開始"], "a": 0, "e": "もともと身長が低いケースでは身長が140 cm以下であっても患者と相談して治療開始などの選択が必要。国際ガイドラインでは11〜12歳の間にゴナドトロピンの上昇を認める場合にエストロゲン治療を開始し2〜3年で成人量に増やしKaufmann療法へ移行していくことが推奨される。LHとFSHは11歳以前より毎年測定し、これらが年齢正常範囲内であれば思春期の自然発生を期待して経過観察する。エストロゲンにより骨端線の閉鎖が引き起こされることから以前は成人身長改善のために開始を遅らせることが推奨されたが、成長スパートの時期にエストロゲンが欠乏すると骨密度の獲得が不十分となって成人期以降の骨粗鬆症や骨折のリスクが上昇することや、少量エストロゲン投与は骨年齢をあまり促進せず成長の促進が期待できることから、なるべく健常小児と遅れることなく緩徐に思春期を進行させることが推奨される。思春期に対するTurner症候群の影響について9〜11歳までに患者本人に理解できる言葉で説明し、思春期にも説明を追加する。", "r": "治療 p.86-87"}, {"v": "", "q": "Turner症候群のエストロゲン製剤で、原則として推奨される製剤と理由は。", "o": ["E₂経皮製剤（エストラーナ®）：生理的で肝初回通過効果がなく血栓症リスクが低い", "結合型エストロゲン（プレマリン®）：乳房発育が早く安価で、血栓症リスクが最も低いため第一選択", "E₂経口製剤（ジュリナ®）：用量調整が容易で皮膚刺激がなく、肝初回通過効果がないため推奨", "エストラジオール吉草酸エステル筋注：コンプライアンスが良く、脂質代謝への影響が少ない"], "a": 0, "e": "皮膚のかぶれなどで使用できない場合、成人ではE₂経口製剤を用いることが推奨されているが、Turner女性の思春期誘発ではガイドラインに従って結合型エストロゲン（プレマリン®）が一般的に用いられ、通常治療開始6か月以内に乳房発育を認める。処方例（わが国のガイドライン）：エストラーナ®テープ0.09 mg製剤1枚（0.72 mg製剤1/8枚）2日ごと貼り替え6〜12か月→0.18 mg（1/4枚）→0.36 mg（1/2枚）各6〜12か月→0.72 mg 1枚6か月。プレマリン®錠1/10錠→1/4錠→1/2錠（各1日1回6〜12か月）→1錠6か月。どちらの製剤の場合も段階的に増量し約2年後に成人量に増量する。Kaufmann療法への移行は成人量となり6か月を経過するか、途中で消退出血が起こるかしたとき。現在のガイドラインよりも早期からより少量のエストロゲン投与を開始する治療が一部専門家より提言されているが、現時点では推奨できるだけのエビデンスの蓄積が不十分。", "r": "治療 p.87"}, {"v": "", "q": "Turner症候群で大動脈解離の予防手術が推奨される基準は。", "o": ["16歳以上で上行大動脈径4 cm以上またはASI 2.5 cm/m²以上", "全年齢で上行大動脈径3 cm以上", "16歳以上で上行大動脈径5 cm以上、またはASI 3.5 cm/m²以上", "大動脈二尖弁があれば径にかかわらず"], "a": 0, "e": "aortic size index（ASI）。大動脈拡張も進行すると大動脈解離のリスクとなる。Y染色体成分を有するTurner症候群における性腺芽腫の発生率は約10%で、思春期年齢から性腺芽腫を発生しやすいため思春期前に性腺摘出術を要するが、早期に診断がなされている場合には1〜2歳で性腺摘出を行うことが推奨されている。糖尿病や高血圧の発症リスクが高いため成人期では体重管理が重要視される。大動脈拡張の程度によっては運動制限が必要となる。手足のリンパ浮腫は爪や四肢の皮膚に重篤な障害がある場合は浮腫治療専門家による治療が推奨される。神経発達機能は発達の過程で動的に変化するため適切な介入で有意に改善する可能性がある。", "r": "治療 p.87-88"}]}, {"id": "x8", "lv": 2, "t": "Turner症候群：大人になるまで", "min": 5, "cats": "Turner症候群", "src": "p.341 ／ 小児内分泌学 p.355-356 ／ 治療 p.85-88", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>15歳。月経が自然に来ている、モザイクのTurner症候群の女の子。「月経があるなら、将来赤ちゃんも産めるんですよね？」と、本人がまっすぐ聞いてきました。</div><p>Turner症候群の子どもを、小児科から大人の診療へ送り出すまでに、話しておきたいことがあります。月経、妊孕性、妊娠のリスク、そして病気そのものの説明です。</p>\n<h3>月経があっても</h3>\n<p>Turner症候群の<strong>20〜30%</strong>で月経を見ます。けれども、周期的に来ている子でも、<strong>多くは排卵していない</strong>と考えられています。また思春期が自然に来た子でも、<strong>早発卵巣不全</strong>になりやすく、適切なタイミングでKaufmann療法に切り替えられるよう、慎重に見ていきます。</p>\n<p>「月経がある＝Turnerではない」とも、「月経がある＝妊娠できる」とも言えない。両方の意味で、月経は診断の否定にも保証にもなりません。</p>\n<h3>卵子を残すという選択</h3>\n<p>Turnerの卵巣は、幼いころから<strong>卵の残り（卵巣予備能）が急速に減っていきます</strong>。だから、卵巣の働きが続いているモザイクの女の子には、<strong>12歳以降での卵子凍結保存</strong>という選択肢を示すことが勧められています。不必要に遅らせないことが大事です。</p>\n<p>卵巣組織の凍結は、有効性も安全性もまだ十分に確かめられていません。日常診療として行う前に、十分な説明と同意のうえで、管理された研究の場で行うべきとされています。海外では卵子提供による妊娠もありますが、女性ホルモンの補充が足りないと流産が増えます。</p>\n<h3>妊娠は「心臓から」</h3>\n<p>自然妊娠の報告もあります。ただしTurnerの女性の妊娠は、<strong>大動脈解離</strong>のリスクを伴います。子癇前症、胎児機能不全、児頭骨盤不均衡、帝王切開も一般より多くなります。妊娠を希望したら、<strong>まず心血管の評価</strong>。前の回の大動脈の話が、ここにつながります。</p>\n<h3>Y成分があったら</h3>\n<p>第6話で見た<strong>Y染色体成分</strong>をもつ子では、<strong>性腺芽腫が約10%</strong>に起きます。思春期年齢から起きやすくなるので、思春期前に性腺を摘出します。早く診断されていれば<strong>1〜2歳での摘出</strong>が勧められています。</p>\n<h3>大人に向けて</h3>\n<p>成人期は、糖尿病や高血圧が増えるので<strong>体重の管理</strong>が大事になります。脳卒中や虚血性心疾患のリスクも上がります。神経発達の特徴は成長とともに変わり、適切な支援でかなり良くなる可能性があります。</p>\n<p>そして、小児内分泌医の役目は、本人に<strong>病気のこと、治療の目的、これから起こりうること</strong>を、年齢と理解に合わせて段階的に伝えることです。妊孕性についても、隠さずに、しかし年齢に応じて話します。</p>\n<p>15歳の彼女には、こう答えました。「月経があるのは、いま卵巣が頑張っている証拠。でも、ずっと続くとは限らないんだ。だから、いまのうちにできることがある。卵子を残すという方法を、一度一緒に聞きに行かない？」。</p>", "keys": ["月経は20〜30%に見られるが多くは無排卵。自然思春期でも早発卵巣不全が多い", "卵巣予備能は幼少期から急減。モザイク例に12歳以降の卵子凍結保存を示す", "妊娠は大動脈解離・周産期合併症のリスク。妊娠前に心血管評価", "Y成分があれば性腺芽腫約10%。早期診断なら1〜2歳で摘出", "病態・治療目的・将来を年齢に応じて段階的に本人に伝える"], "upd": null, "quiz": [{"v": "", "q": "卵巣機能が持続するモザイクTurner女性に生殖能力温存の選択肢として提示が推奨されるのは。", "o": ["12歳以降での卵子凍結保存", "幼少期からの卵巣組織凍結保存", "成人期以降の卵子提供", "思春期前の卵巣摘出と凍結"], "a": 0, "e": "幼少期から卵巣予備能が急速に低下しているため不必要に遅らせないようにする。片側卵巣組織をいくつかの切片に分けて凍結保存する卵巣凍結保存は有効性や安全性が十分に確認されておらず、若年Turner女性に対しては日常診療として行う前に適切なカウンセリングとインフォームドコンセントを行ったうえで安全に管理された研究環境で行われるべき。諸外国では卵子提供による妊娠もあるが、女性ホルモン補充が不十分な場合は流産率が上昇する。思春期が自然に発来した場合でも早発卵巣不全をきたす可能性が高く、適切な時期でKaufmann療法が開始できるように慎重に経過観察する。自然妊娠例は大動脈解離のリスク評価が必要で、子癇前症や胎児機能不全、児頭骨盤不均衡、分娩時の帝王切開のリスクが一般集団より高い。医療のトランジションが予後に与える影響は大きく、移行時期に多くの患者の受診が途絶え年齢に適切なスクリーニングが受けられず健康に影響がでることが報告されている。", "r": "治療 p.88"}, {"v": "", "q": "Turner症候群の月経について正しいのは。", "o": ["全例が無月経で、自然月経をみることはない", "20〜30%で月経をみるが、周期的に生じる症例でも多くは排卵していないと予測される", "多くが無月経で、自然月経をみるのは5%程度", "モザイクであれば初経は正常に来ることが多い"], "a": 1, "e": "月経があることは診断の否定にならない。妊孕性についての説明は、隠さずに、しかし年齢に応じて行うことが強調されている。", "r": "p.341"}, {"v": "", "q": "Turner症候群の成人期を含む定期評価（国際ガイドライン2016）で示されている項目と間隔は。", "o": ["甲状腺機能・肝酵素・脂質・血糖は年1回、セリアック病スクリーニングと25(OH)Dは数年ごと、心エコー/MRIと聴力は5年ごと（リスクがあれば短縮）、骨密度は補充の節目に", "すべての検査を毎月行う", "成人後は検査を要さない", "心臓の評価は診断時の1回のみでよく、成人後は甲状腺機能と肝酵素を5年ごとに測れば十分で、妊娠前の評価は要さない"], "a": 0, "e": "大動脈拡張（大動脈径の体表面積補正）が解離のリスク。妊娠を希望する場合は妊娠前に心血管評価を必ず行う。", "r": "小児内分泌学 p.356"}]}, {"id": "x9", "lv": 1, "t": "Klinefelter症候群：見つけにくい、いちばん多い", "min": 6, "cats": "Klinefelter症候群・性染色体異常・MGD", "src": "p.333 ／ 小児内分泌学 p.358-359 ／ 治療 p.88-91", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>14歳の男の子が、児童精神科から紹介されてきました。学校での学習の困難で通院中です。紹介状には一行、「ひげが薄いことを本人が気にしています」。診察すると、背が高く、精巣は3 mLほどでした。</div><p>Klinefelter症候群（47,XXY）は、<strong>男性500〜1,000人に1人</strong>。男性の性染色体異常としても、原発性性腺機能低下症としても<strong>いちばん多い</strong>病気です。それなのに外来で出会う数はTurner症候群の1/10以下。<strong>多くの人が診断されないまま</strong>過ごしていると考えられています。</p>\n<h3>なぜ見つかりにくいか</h3>\n<p>理由は、<strong>思春期が始まる</strong>からです。テストステロンが下がり、ゴナドトロピンが上がってくるのは<strong>15歳以降</strong>。それまではホルモン値が正常範囲のことが多く、思春期前に測って正常でも否定できません。診断は<strong>身体所見と染色体</strong>でつけます。</p>\n<p>思春期は来ても、精巣は育ちません。成人でも<strong>10 mL未満</strong>、ふつうは6 mL前後です。テストステロンが少しずつ下がるので、二次性徴は不完全になります。</p>\n<h3>見つかるきっかけ</h3>\n<p>女性化乳房、停留精巣、尿道下裂、小精巣、小陰茎。そして<strong>行動や学習の問題</strong>です。本書の症例も、冒頭の子と同じく児童精神科がきっかけでした。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>所見</th><th>頻度</th></tr>\n<tr><td>不妊・無精子症</td><td>&gt;95〜99%</td></tr>\n<tr><td>小精巣</td><td>&gt;95%</td></tr>\n<tr><td>学習障害</td><td>&gt;75%</td></tr>\n<tr><td>女性化乳房</td><td>28〜75%</td></tr>\n<tr><td>停留精巣</td><td>27〜37%</td></tr>\n<tr><td>高身長</td><td>&gt;30%</td></tr></table></div>\n<p>体つきは、比較的背が高く、やせ型で、脚と指が長い。知能は多くが正常かやや低めで、<strong>言語性IQが動作性IQより低い</strong>のが特徴です。言葉の発達の遅れを中心とした学習の困難があり、言語聴覚療法や学習支援が役に立ちます。</p>\n<h3>どこから来たX</h3>\n<p>余分なXは、<strong>約半分が母、半分が父</strong>に由来します。減数分裂のときの分離の誤りです。家族の中でくり返すことはほぼありません。モザイクの人は軽いことが多く、Xの数が多いほど知的障害や合併症が重くなります。</p>\n<h3>大人になってからの合併症</h3>\n<p>内臓脂肪が増えて<strong>2型糖尿病・メタボリックシンドローム</strong>、骨粗鬆症、静脈血栓、<strong>乳がん</strong>（20〜50倍）、縦隔などの<strong>性腺外胚細胞腫瘍</strong>、SLEや関節リウマチなどの自己免疫疾患。平均余命は5〜6年短いとされます。</p>\n<h3>テストステロン補充</h3>\n<p><strong>13歳以降</strong>で適応を判断し、エナルモンデポー® <strong>1回25 mg</strong>から始めます。</p>\n<div class=\"formula\">25 mg/3〜4週（3〜6か月）→ 50〜75 mg（3〜6か月）→ 125 mg（6か月〜2年）→ 125 mg/2週 または 250 mg/3〜4週</div>\n<p>補充は二次性徴のためだけでなく、成人身長の正常化、筋肉量、骨密度のためにも大事です。乳幼児期の小陰茎には、25 mgを4週ごとに2〜3回使います（第14話）。</p>\n<h3>妊孕性：早く知るほど選択肢がある</h3>\n<p>不妊の原因は、<strong>精母細胞が年齢とともに急速に減っていく</strong>ことです。思春期前は精細管が保たれていますが、大人の精巣は広く線維化し、精子をつくる場所がほとんど残りません。それでも<strong>顕微鏡下精巣内精子採取術（micro-TESE）と顕微授精</strong>で、30〜50%で精子が見つかり、子どもを授かれる可能性があります。若いほど成功率が高いので、<strong>早い診断に意味があります</strong>。</p>\n<p>病名をいつ本人に伝えるかは、両親と十分に相談して決めます。ただ、<strong>結婚を考える年齢の前には</strong>、生殖のことを伝える必要があります。</p>\n<p>冒頭の男の子の染色体は47,XXYでした。「学校で苦労してきたことにも、体の理由があったのかもしれない」。お母さんの表情が少しゆるみました。テストステロンは25 mgから、精子の保存については泌尿器科と一緒に話を始めることになりました。</p>", "keys": ["男性500〜1,000人に1人で最多だが、多くは未診断", "思春期は来るが精巣は育たない（成人でも10 mL未満）。Tが下がるのは15歳以降", "きっかけは女性化乳房・停留精巣・小精巣・学習や行動の問題。言語性IQ＜動作性IQ", "合併症：2型糖尿病・骨粗鬆症・血栓・乳がん・縦隔胚細胞腫瘍・自己免疫疾患", "T補充は13歳以降25 mgから。micro-TESEで30〜50%、若いほど有利"], "upd": null, "quiz": [{"v": "", "q": "Klinefelter症候群の臨床症候の頻度（表2）で正しいのは。", "o": ["不妊>99%、小精巣>95%、女性化乳房28〜75%、停留精巣27〜37%", "不妊50%、小精巣70%、女性化乳房10%、停留精巣5%", "不妊>99%、小精巣50%、女性化乳房90%、停留精巣60%", "不妊80%、小精巣>95%、女性化乳房10%、停留精巣27〜37%"], "a": 0, "e": "無精子症>95%、精巣内精子採取術による精子確認30〜50%、髭の成長鈍化60〜80%、陰毛の減少30〜60%、メタボリックシンドローム46%、2型糖尿病10〜39%、骨粗鬆症5〜10%、深部静脈血栓症・肺塞栓症リスク3〜6倍、乳癌リスク20〜50倍、変形性膝関節症4倍、骨折2〜40倍、学習障害>75%、言語発達遅滞>40%、小陰茎10〜25%、ゴナドトロピン上昇>75%、テストステロン低下>75%、高身長>30%、ASD 30〜50%。比較的高身長、やせ型体型、下肢長増加が認められ指が長い例が多い。思春期発来はほぼ正常だが血中テストステロンが次第に低下するために二次性徴の発達が不完全で、精巣サイズは小さいままで成人でも6 mLを超えることはまれ。", "r": "治療 表2 p.90"}, {"v": "", "q": "Klinefelter症候群でテストステロンが低下しゴナドトロピンが上昇しはじめる時期は。", "o": ["乳児期", "思春期前", "15歳以上", "成人後期のみ"], "a": 2, "e": "それ以前は正常範囲のことが多い。だから思春期前にホルモン値が正常でも否定できず、身体所見と染色体で診断する。", "r": "p.333"}, {"v": "", "q": "Klinefelter症候群の思春期以降のテストステロン補充で、治療適応を判断する年齢と開始量は。", "o": ["13歳以降、1回25 mgから開始", "10歳以降、1回125 mgから開始", "15歳以降、1回250 mgから開始", "診断時から、1回50 mgから開始"], "a": 0, "e": "処方例：エナルモンデポー®25 mg/回、3〜4週ごと筋注、3〜6か月継続→50〜75 mgに増量して3〜6か月→125 mgに増量して6か月〜2年→身体的に思春期後期まで達したら125 mg/回を2週ごとまたは250 mg/回を3〜4週ごと。乳幼児期の小陰茎には25 mg/回を4週ごとに2〜3回筋注。根本的治療はなくすべて対症療法にとどまる。小児期からの治療は二次性徴の発現・成熟のみならず成人身長の正常化にも重要。筋肉量維持や骨密度増加のためにもテストステロン補充は重要。不妊治療として造精能を回復させる治療法はないが、顕微鏡下精巣内精子採取術・顕微授精により妊娠成立が可能となっている。停留精巣や尿道下裂に対しては外陰形成術を行うが、gender identity確立の観点から1〜2歳までに行うことが推奨されている。女性化乳房は男性ホルモン補充を行っても必ずしも軽快せずアロマターゼ阻害薬やエストロゲン受容体遮断薬は有効ではなく、乳腺組織の発達が高度の場合は乳癌の発症リスクを考慮し摘出する。", "r": "治療 p.90-91"}]}, {"id": "x10", "lv": 2, "t": "モザイクとキメラ：MGDと卵精巣性DSD", "min": 6, "cats": "性染色体異常・MGD・卵精巣性DSD", "src": "症例1 p.327-331, 391-393 ／ 小児内分泌学 p.360", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>女の子として育ってきた子。陰嚢のような部分に性腺は触れません。血液の染色体は45,X/46,XY。お母さんが聞きます。「XYが混じっているなら、男の子だったということですか」</div><p>今日は、一人の体の中に<strong>違う染色体の細胞が混ざっている</strong>二つの病気を見ます。左右の性腺が違う形をしていて、外性器の見た目も一人ひとり違う。だからこそ、決まった答えではなく、その子に合った方針を考える必要があります。</p>\n<h3>混合型性腺形成不全（MGD）：45,X/46,XY</h3>\n<p>典型的には、<strong>片側が索状性腺、反対側が精巣のような組織</strong>です。左右で分化の程度が違うので、外性器の男性化の程度もさまざまです。</p>\n<p>ここで大事なのは、<strong>モザイクの割合は組織ごとに違う</strong>ということです。血液での45,Xと46,XYの比率が、性腺での比率と一致するとは限りません。だから血液の結果だけで、その子の体を予測することはできません。<strong>頬の粘膜や皮膚の線維芽細胞</strong>の核型、FISHも参考にし、骨盤の造影MRIと性腺の生検で評価します。</p>\n<h3>MGDで性腺を摘る理由</h3>\n<p>Y染色体をもつ未熟な性腺には、<strong>性腺芽腫（gonadoblastoma）</strong>ができます。性腺芽腫そのものは良性ですが、<strong>dysgerminoma</strong>へ悪性化することがあります。だから索状性腺は摘出します。</p>\n<p>また、MGDの性腺から<strong>女性ホルモンが出ることは理論上ありません</strong>。女の子として育つなら、思春期には補充が必要になります（第16話）。そして男女どちらで育っても、<strong>Turner症候群に準じた生涯のモニタリング</strong>（心臓、腎、身長、甲状腺など）を続けます。</p>\n<h3>養育する性は、何で決めるか</h3>\n<p>MGDでは、養育性は主に<strong>外性器の形と、手術でどこまで整えられるか</strong>から考えます。染色体にYがあるかどうかだけでは決めません。</p>\n<h3>卵精巣性DSD：一人に卵巣と精巣</h3>\n<p>同じ人の中に<strong>卵巣の組織と精巣の組織が両方ある</strong>状態です。性腺の組み合わせは三つの型があります。</p>\n<ul>\n<li>片側が精巣、反対側が卵巣</li>\n<li>片側が卵精巣（ovotestis）</li>\n<li>両側が卵精巣</li>\n</ul>\n<p>核型は意外にも<strong>46,XXがいちばん多く</strong>、46,XYの3〜4倍です。ほかに46,XX/46,XYの<strong>キメラ</strong>（二つの受精卵に由来するゲノムをもつ）、45,X/46,XXのモザイクなども報告されています。核型は一つに定まりません。</p>\n<p>外性器の男性化が十分に進んでいると、生まれたときには気づかれにくく、<strong>思春期に女性化乳房や小さな精巣</strong>をきっかけに見つかることがあります。男の子として育っている子に女性化乳房が出るのは、<strong>残っている卵巣組織がエストロゲンを作る</strong>からです。男性として生活する子にとっては、これは大きな問題になります。</p>\n<p>冒頭のお母さんには、こう伝えました。「XYの細胞が混じっていることと、お子さんが女の子として育ってきたことは、矛盾しません。血液の割合は、体の他の場所と同じとは限らないんです。性腺には将来腫瘍ができる心配があるので、その相談をしましょう。そして思春期には、女の子の体に必要なホルモンを補う準備をしていきます」。</p>", "keys": ["MGD（45,X/46,XY）：片側索状性腺＋対側精巣様。モザイク比は組織で異なる", "血液だけで予測しない。頬粘膜・皮膚線維芽細胞、MRI、生検", "索状性腺は性腺芽腫→dysgerminomaのリスクで摘出。女性ホルモンは出ない", "MGDは男女ともTurnerに準じた生涯モニタリング", "卵精巣性DSDは46,XXが最多。3つの性腺型。男性例は思春期に女性化乳房"], "upd": null, "quiz": [{"v": "", "q": "MGDにおける45,X/46,XYのモザイク比について正しいのは。", "o": ["末梢血の比率が性腺を含む全身の比率を正確に反映するため、血液検査のみで性腺の構成を推定できる", "組織によりモザイク比が異なり、末梢血の比率と性腺の比率は一致しないことがある", "健常男性でも45,X細胞が数%みられ、診断的意義は乏しい", "モザイク比は年齢とともに46,XY優位に変化する"], "a": 1, "e": "だから末梢血だけで表現型を予測できない。性腺組織や口腔粘膜細胞でのFISH解析が有用になる。", "r": "p.329-331"}, {"v": "", "q": "卵精巣性DSDの性腺の組み合わせとして知られている3つの型は。", "o": ["一側が精巣で対側が卵巣／一側がovotestis／両側がovotestis", "両側が精巣／両側が卵巣／両側が索状性腺", "一側が精巣で対側が索状性腺／一側がovotestis／両側が卵巣の3型に分けられる", "一側が卵巣で対側が索状性腺／両側が精巣／両側がovotestis"], "a": 0, "e": "卵巣成分と精巣成分の分布が症例ごとに違う。だから外性器の所見も内性器の所見も一様にならない。", "r": "p.391"}, {"v": "", "q": "MGDで性腺摘出が必要とされる理由は。", "o": ["精巣からの過剰なテストステロンで骨年齢が進むから", "性腺芽腫（gonadoblastoma）が生じ、そこから悪性転化しうるから", "索状性腺からの過剰なテストステロンで骨年齢が進み、成人身長が低くなるうえ女性化乳房を来すから", "性腺からのエストロゲン産生で女性化乳房を来すから"], "a": 1, "e": "性腺芽腫自体は良性だが、dysgerminomaへの悪性転化がある。またMGDでは性腺から女性ホルモンが分泌される可能性は理論的にないため、思春期には補充が必要になる。", "r": "p.329"}]}, {"id": "x11", "lv": 3, "t": "46,XY：精巣ができない、消えた", "min": 7, "cats": "46,XY DSD・性染色体異常・MGD", "src": "症例1 p.357-373 ／ 小児内分泌学 p.334, 339, 342 ／ 治療 p.694, 731-735", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>外性器は完全に男の子なのに、両側とも陰嚢に精巣が触れない2歳の男の子。LHRH負荷でLH・FSHは著明高値、hCG負荷でテストステロンはまったく上がらず、超音波では子宮も卵巣もありません。</div><p>今日からは46,XY DSDです。第4話の地図でいう「精巣の形成の障害」から入ります。精巣がはじめからできなかったのか、途中で消えたのか。その違いは、体の形が教えてくれます。</p>\n<h3>無精巣症：「はじめから無かった」のではない</h3>\n<p>冒頭の子を考えます。精巣は今はありません。でも、<strong>子宮がない</strong>ということはAMHが働いてMüller管を退縮させた。<strong>外性器が完全に男性型</strong>ということはテストステロンとDHTが十分に働いた。つまり、<strong>男性分化の早い時期には精巣が存在していて、そのあとで消えた</strong>のです。</p>\n<p>精巣が触れない子で、精巣が本当にないのかを調べるとき、まず役に立つのが血液の<strong>AMH</strong>です。精巣があればAMHは検出されます。手術で探しに行く前に、血液で一つ絞り込めます。</p>\n<h3>完全型の性腺形成不全（Swyer症候群）</h3>\n<p>46,XYで、精巣がまったくできなかったらどうなるか。AMHが出ないのでMüller管が残り、<strong>子宮があります</strong>。テストステロンも出ないので外性器は女性型です。ここが、同じく外性器が女性型の<strong>完全型アンドロゲン不応症</strong>（子宮がない、次の回）との分かれ道です。</p>\n<h3>同じ遺伝子、違う顔：WT1</h3>\n<p>WT1は、腎臓と性腺の両方の発生に関わる遺伝子です。変異の場所によって、二つの病気に分かれます。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>Frasier症候群</th><th>Denys-Drash症候群</th></tr>\n<tr><td>変異</td><td>イントロン9のスプライス異常（+KTSが作れない）</td><td>エクソン7〜9のミスセンス変異</td></tr>\n<tr><td>腎</td><td>FSGS、腎不全は比較的遅い</td><td>腎不全が早い</td></tr>\n<tr><td>腫瘍</td><td>性腺芽腫（約60%）</td><td>Wilms腫瘍が多い</td></tr></table></div>\n<p>尿道下裂の子で<strong>尿蛋白が陽性</strong>なら、Denys-Drash症候群を念頭に置きます。Frasier症候群の索状性腺は腫瘍の頻度が高いので、摘出が勧められます。</p>\n<h3>骨と精巣：SOX9</h3>\n<p>第1話で予告した<strong>campomelic dysplasia</strong>です。四肢の短縮と弯曲、側弯、喉頭軟化症による呼吸障害。46,XYでも外性器が女性型になることがあります。SOX9が骨格と精巣の両方に必要だからです。10万〜20万人に1人、常染色体優性です。</p>\n<h3>家族に手がかり：SF1</h3>\n<p><strong>NR5A1（SF1）</strong>の異常は、副腎の章の第12話でも出てきました。46,XY DSDの子にSF1異常が見つかったとき、<strong>お母さんに早発卵巣不全</strong>があることがあります。ヘテロの女性では、卵巣機能の低下として現れるのです。子どもの診断から、家族全体の情報が見えてきます。</p>\n<h3>副腎の章で出会った症候群</h3>\n<ul>\n<li><strong>IMAGe症候群</strong>：子宮内発育遅延、骨幹端異形成、先天性副腎低形成、性器異常。CDKN1C（母由来アリル）の機能獲得変異。</li>\n<li><strong>MIRAGE症候群</strong>：骨髄異形成、感染症、成長障害、副腎低形成、性腺の症状、腸症。SAMD9の機能獲得変異。46,XYでも女性が選ばれることが多く、経過中に<strong>モノソミー7</strong>が出てくることがあります。</li>\n<li><strong>SGPL1欠損症</strong>：ステロイド抵抗性ネフローゼ、副腎の石灰化、男の子では停留精巣・小精巣。</li>\n</ul>\n<h3>索状性腺と腫瘍</h3>\n<p>46,XY DSDで性腺が索状性腺のとき、摘出が勧められる最大の理由は<strong>腫瘍の頻度が高い</strong>ことです。摘出すれば、ホルモン補充が必要になります。遺伝子診断で確定できるのは30〜40%ですが、分かれば腫瘍のリスクや方針の見通しが立てやすくなります。</p>\n<p>冒頭の男の子は、無精巣症でした。お父さんに伝えたのはこうです。「赤ちゃんのころ、精巣はちゃんと働いて、体を男の子に作り上げてくれました。そのあとで消えてしまった。だから思春期には、精巣の代わりにテストステロンを補えば、ほかの男の子と同じように大人になっていけます」。</p>", "keys": ["無精巣症：子宮なし＋外性器男性型＝早期には精巣があった。精巣の有無はAMHで", "Swyer（完全型性腺形成不全）は子宮がある。CAISは子宮がない", "WT1：Frasier（イントロン9、FSGS、性腺芽腫約60%）とDenys-Drash（早い腎不全、Wilms）", "campomelic dysplasia＝SOX9。SF1異常では母に早発卵巣不全", "IMAGe（CDKN1C）・MIRAGE（SAMD9）・SGPL1。46,XY DSDの遺伝子診断は30〜40%"], "upd": null, "quiz": [{"v": "", "q": "46,XY complete gonadal dysgenesis（Swyer症候群）で認められるのは。", "o": ["子宮が存在する", "子宮は存在しない", "精巣が正常に発達する", "外性器が男性型である"], "a": 0, "e": "精巣が分化しないためAMHが出ず、Müller管が退縮しない。だから完全型アンドロゲン不応症とはここで分かれる。", "r": "p.369-370"}, {"v": "両側の精巣を陰嚢内に触れない男児。LHRH負荷でLH・FSHともに著明高値、hCG負荷でテストステロンは反応せず、子宮・卵巣も認めない。外性器は完全に男性型。", "q": "診断とその意味するところは。", "o": ["無精巣症。男性化が完了しているので、精巣は男性分化の早い時期には存在していた", "完全型アンドロゲン不応症。精巣はあるがアンドロゲンが作用しない", "混合型性腺形成不全。索状性腺のため触知できない", "両側停留精巣。精巣は腹腔内にあり、hCG負荷で反応しないのは未熟なためで固定術を急ぐ"], "a": 0, "e": "AMHが働いてMüller管が退縮し、テストステロンで外性器が男性化した後に精巣が消えた。だから「はじめから無かった」のではない。", "r": "症例1 p.357-359"}, {"v": "", "q": "WT1異常症のうちFrasier症候群の特徴は。", "o": ["イントロン9のスプライシング異常による。FSGSで腎不全は比較的遅く、性腺芽腫のリスクがある", "エクソン8〜9のミスセンス変異による。早期に腎不全となり、Wilms腫瘍が高頻度で性腺芽腫はまれ", "イントロン9の変異によるが、腎障害は伴わず、性腺腫瘍のリスクもない", "WT1の完全欠失による。WAGR症候群の一部として無虹彩を伴う"], "a": 0, "e": "Denys-Drash症候群のほうが腎不全の発症が早く、Wilms腫瘍が多い。同じ遺伝子でも変異の場所で顔つきが変わる。", "r": "p.361-363 / 表 p.363"}]}, {"id": "x12", "lv": 2, "t": "アンドロゲンが効かない：受容体の病気", "min": 6, "cats": "アンドロゲン受容体異常症", "src": "症例1-4 p.375-383 ／ 小児内分泌学 p.340-341", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>外性器はまったく女の子の1歳の子。鼠径ヘルニアの手術で、外科の先生から「卵巣が脱出していました」と連絡がありました。手術記録には、こう書かれていました。「卵巣にしては硬く、精巣に似る」。</div><p>第4話の地図で、「AMHもテストステロンも正常〜高いのに男性化していない」という行がありました。作れているのに効かない。今日は、<strong>アンドロゲン受容体（AR）</strong>の病気です。</p>\n<h3>「卵巣ヘルニア」と言われたら</h3>\n<p>完全型アンドロゲン不応症（CAIS）は、<strong>女の子の鼠径ヘルニア</strong>で見つかることが典型的です。だから「卵巣ヘルニア」と言われたら、<strong>触れているのは精巣ではないか</strong>と考えて触診します。染色体は46,XYです。</p>\n<p>CAISでは、精巣のSertoli細胞はAMHを出すので、<strong>子宮はありません</strong>。腟は盲端です。第11話で見たSwyer症候群（子宮がある）との違いが、ここに出ます。</p>\n<h3>数字は男性型、姿は女性型</h3>\n<p>受容体が効かないので、テストステロンの<strong>ネガティブフィードバックがかかりません</strong>。だから<strong>LHが高く、テストステロンも正常〜高値</strong>になります。数字は男性なのに、表現型は女性。この<strong>不一致</strong>が診断の核心です。</p>\n<h3>思春期に起きること</h3>\n<p>CAISの思春期には、<strong>乳房は発達するのに、陰毛は生えません</strong>。たくさん作られたテストステロンがアロマターゼで<strong>エストラジオールに変わり</strong>、乳房を育てます。一方、陰毛にはアンドロゲンの作用が要るので生えません。</p>\n<p>部分型（PAIS）では、外性器の男性化がさまざまな程度に起きます。そして思春期に<strong>女性化乳房</strong>が出ます。アンドロゲンの作用が弱いぶん、エストロゲンの作用が前に出るのです。男の子として育てられている子では、大きな悩みになります。</p>\n<p>軽症型（MAIS）は、男性への分化はふつうに進み、<strong>思春期以降に不妊</strong>で見つかります。ARのCAGリピートが伸びる<strong>Kennedy病（球脊髄性筋萎縮症）</strong>でも、アンドロゲンの効きにくさが見られます。</p>\n<h3>受容体の働きを調べる</h3>\n<p>昔ながらの方法は、<strong>皮膚の線維芽細胞</strong>で受容体の親和性、数、温度不安定性を調べることです。本書には、親和性も数も正常なのに<strong>温度不安定性だけが異常</strong>という子が出てきます。数が足りていても、働きが保たれているとは限りません。</p>\n<p>いまは遺伝子解析が中心です。CAISでは臨床診断の<strong>90〜95%</strong>で変異が見つかりますが、PAISでは1/3に届きません。同じ家系で同じ変異でも、表現型が一致しないことがあります。</p>\n<h3>性腺をどうするか</h3>\n<p>AR異常症で性腺を摘る主な理由は<strong>腫瘍化のリスク</strong>です。ただCAISでは、<strong>精巣を思春期まで残して、自然に二次性徴を迎える</strong>方法を選ぶこともあります。乳房は自分のホルモンで育つからです。この場合、女性ホルモンの補充は摘出のあとから必要になります。</p>\n<p>CAISの性自認は、原則として女性です。いつ、どこまで本人に話すか。それは摘出の時期と切り離せない問題として、チームで考えます（第16話）。</p>\n<p>冒頭の子は、触診し直すと反対側の鼠径部にも同じ硬さの性腺が触れました。染色体は46,XY、LHとテストステロンは高め。外科の先生と一緒に、家族へ説明する場を設けることにしました。最初のひとことは、第3話と同じです。急がず、正直に。</p>", "keys": ["CAISは女児の鼠径ヘルニア（「卵巣ヘルニア」）で見つかる。子宮なし、腟は盲端", "LH高値・T正常〜高値なのに女性型。この不一致が核心", "CAISの思春期：Tがエストラジオールに変わり乳房発達、陰毛は生えない", "PAISは思春期に女性化乳房。MAISは不妊、Kennedy病もAR異常", "CAISで変異同定90〜95%（PAISは1/3未満）。摘出は腫瘍リスク、思春期まで温存も選択肢"], "upd": null, "quiz": [{"v": "外性器は完全な女性型の乳児。鼠径部の腫瘤に対し「卵巣ヘルニア」と診断されていたが、内容は精巣であった。染色体は46,XY。", "q": "この症例で最も重要な教訓は。", "o": ["卵巣ヘルニアと言われたら、触れているものが精巣ではないかを想定して触診する", "卵巣ヘルニアは整復が困難なため、速やかに摘出する", "外性器が女性型であれば、染色体検査は要さない", "鼠径ヘルニアの内容が卵巣なら、両側の卵巣を確認すれば十分で染色体検査は要さない"], "a": 0, "e": "完全型アンドロゲン不応症はこの経路で見つかることが典型的。膣は盲端で、AMHが働いているため子宮はない。", "r": "症例4 p.379-381 / p.381"}, {"v": "", "q": "アンドロゲン受容体異常症のホルモンパターンは。", "o": ["LH高値、テストステロン正常〜高値", "LH低値、テストステロン低値、FSH高値", "LH高値、テストステロン低値", "すべて正常"], "a": 0, "e": "受容体が効かないためネガティブフィードバックがかからず、LHが上がりテストステロンも上がる。数字は男性型なのに表現型は女性型、という不一致が診断の核心。", "r": "p.375-377"}, {"v": "", "q": "完全型アンドロゲン不応症の思春期に起こることは。", "o": ["陰毛が発生し、乳腺は発達しない", "乳腺は発達するが陰毛は生じない", "男性化が進む", "何も起こらない"], "a": 1, "e": "テストステロンがアロマターゼでエストラジオールに変換されるため乳腺は発達する。一方、アンドロゲン作用が働かないので陰毛は生じない。", "r": "p.381 / p.383"}]}, {"id": "x13", "lv": 3, "t": "DHTが作れない：5α還元酵素欠損症", "min": 6, "cats": "5α還元酵素欠損症・DSDのホルモン療法・外科", "src": "症例1 p.385-395 ／ 小児内分泌学 p.341 ／ 治療 p.76-77", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>第2話の研修医が首をひねっていた子です。精巣はあり、テストステロンも出ている。でも外性器は女の子に近い。hCG負荷のあとで測ると、テストステロンはよく上がったのに、DHTはほとんど上がっていませんでした。</div><p>第2話で、「外性器を男性化するのはテストステロンではなくDHT」と見ました。今日はその変換ができない病気、<strong>5α還元酵素2型（SRD5A2）欠損症</strong>です。そして、似た顔をした17βHSD3欠損症との見分けも押さえます。</p>\n<h3>鍵は「比」で読むこと</h3>\n<p>テストステロンは作れるのにDHTに変えられない。だから<strong>T/DHT比が上がります</strong>。hCG負荷のあとで評価します。</p>\n<div class=\"formula\">hCG負荷後　T/DHT比 ≥ 10 → 5α還元酵素欠損症<br>T/アンドロステンジオン比 &lt; 0.8 → 17βHSD3欠損症</div>\n<p>血中テストステロンは、ほかのステロイドとの交差反応が大きく、単独の値だけでは診断の力が限られます。だから<strong>比で読む</strong>のです。17βHSD3はアンドロステンジオンをテストステロンに変える酵素なので、その手前が溜まります。ただ、値は他の病気と重なりうるので、最後は遺伝子で確定します。</p>\n<p>第2話で見た<strong>backdoor pathway</strong>も、最後は5α還元を通ります。だからこの病気では、表の道も裏道も両方止まり、代わりの道が救いになりません。</p>\n<h3>思春期に起きること</h3>\n<p>この病気でいちばん大事なのは、思春期の経過です。外性器の男性化にはDHTが要りますが、<strong>思春期の体の男性化はテストステロンでかなり進みます</strong>。声変わりし、筋肉がつく。けれども、DHTが要る<strong>頭髪の後退（はげ上がり）は起きません</strong>。担当するホルモンの違いが、そのまま経過の違いになります。</p>\n<p>そして、女の子として育てられた子のうち、<strong>25〜30%以上が思春期以降に男性へ移行</strong>すると報告されています。思春期の体の変化が、性自認に影響しうることを示しています。だから幼いころの性別の決定を、一度きりのものとして扱わないことが大切です（第17話）。</p>\n<h3>治療の反応が診断になる</h3>\n<p>DHTを直接塗る<strong>DHTクリーム</strong>は、5α還元酵素欠損症によく効きます。テストステロンが効かなかった子の、いちばんのよい適応です。一方、アンドロゲン受容体の病気では反応が乏しい。<strong>受容体が壊れていれば、DHTを入れても届かない</strong>からです。治療への反応そのものが、診断の情報になります。</p>\n<p>DHTクリームには利点があります。テストステロンより作用が強く、局所に塗れて、<strong>エストロゲンに変わらない</strong>ので女性化乳房や骨年齢の進行が起きにくい。欠点は、毎日塗る必要があることと、塗った場所の発疹や色素沈着です。日本では未承認なので、院内調剤か個人輸入になります。10歳未満で12.5 mg、10歳以上で25 mg、あるいは0.2〜0.3 mg/kgを1日1回という報告がありますが、至適量は分かっていません。3〜4か月で効果が頭打ちになれば止めます。</p>\n<p>冒頭の子のT/DHT比は18。遺伝子解析でSRD5A2の変異が見つかりました。研修医は言いました。「テストステロンが出ていても、DHTにならなければ外性器は変わらない。第2話の表、そのままでしたね」。DHTクリームを始め、家族とは思春期に起こりうることを、今から少しずつ話していくことにしました。</p>", "keys": ["SRD5A2欠損症はTをDHTに変えられない。hCG負荷後T/DHT比≥10", "T/アンドロステンジオン比＜0.8は17βHSD3欠損症。Tは単独でなく比で読む", "frontdoorもbackdoorも最後は5α還元＝両方止まる", "思春期はTで男性化が進むが、はげ上がりはない。女性養育の25〜30%以上が男性へ移行", "DHTクリームに反応すれば5α還元酵素欠損症、AR異常症は反応が乏しい"], "upd": null, "quiz": [{"v": "", "q": "5α還元酵素欠損症とアンドロゲン合成障害を分ける検査指標として示されているのは。", "o": ["hCG負荷後のT/DHT比 10以上（T/アンドロステンジオン比 0.8未満は17β-HSD3欠損）", "hCG負荷後のT/DHT比 3未満（T/アンドロステンジオン比 0.8以上は17β-HSD3欠損）という逆の組み合わせ", "基礎テストステロンの低値と、hCG負荷への反応不良", "LHRH負荷後のLH/FSH比の上昇"], "a": 0, "e": "血中テストステロンは他のステロイドとの交差性が大きく、単独測定の診断的価値は限られる。比で読む。", "r": "小児内分泌学 p.341"}, {"v": "", "q": "5α還元酵素欠損症の思春期に起こる特徴的な変化は。", "o": ["男性化は進まず、乳房が発育して女性化が進む", "男性化（変声、筋肉の発達）が進むが、頭部がはげ上がることはない", "男性化が進み、頭部のはげ上がりと痤瘡、前立腺の腫大も目立つようになる", "変声は起こるが、筋肉の発達や陰茎の増大はない"], "a": 1, "e": "外性器の男性化にはDHTが要るが、思春期の体の男性化はテストステロンでかなり進む。担当ホルモンの違いがそのまま経過の違いになる。", "r": "p.395"}, {"v": "", "q": "5α還元酵素欠損症とアンドロゲン受容体異常症を治療反応で分ける点は。", "o": ["5α還元酵素欠損症ではDHTクリームに反応するが、受容体異常症では反応が乏しい", "受容体異常症ではDHTクリームに反応するが、5α還元酵素欠損症では反応が乏しい", "テストステロン注射に5α還元酵素欠損症は反応せず、受容体異常症は反応する", "両者ともDHTクリームによく反応し、治療反応では分けられない"], "a": 0, "e": "受容体が壊れていればDHTを入れても届かない。治療反応そのものが診断情報になる、という関係。", "r": "p.387"}]}, {"id": "x14", "lv": 2, "t": "小陰茎と尿道下裂", "min": 6, "cats": "DSDのホルモン療法・外科", "src": "治療 p.76-83", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>生後4か月の男の子。お母さんが心配そうに言います。「おちんちんが小さい気がして…。おしっこの出口も、少し下にあるみたいなんです」</div><p>今日は、外来でもっとも出会うことの多い二つ、<strong>小陰茎</strong>と<strong>尿道下裂</strong>です。測り方、ホルモン治療、そして手術の時期を押さえます。</p>\n<h3>小陰茎は「伸展陰茎長」で測る</h3>\n<p>陰茎を軽く引っぱって伸ばした長さ（<strong>伸展陰茎長</strong>）を測ります。同じ人種・年齢の基準で<strong>−2.5 SD未満</strong>で、尿道下裂などの形の異常がないものを<strong>小陰茎</strong>、形の異常を伴うものを<strong>ミクロファルス</strong>と呼びます。日本人の−2.5 SDは次のとおりです。</p>\n<div class=\"formula\">新生児 2.4 cm ／ 生後6か月 2.6 cm ／ 1歳6か月 2.8 cm ／ 3〜7歳 3.0 cm</div>\n<h3>思春期前のテストステロン治療</h3>\n<p>目的は、陰茎を大きくして<strong>立って排尿できる</strong>ようにすること、男の子としての自己像を揺るがせないこと、そして尿道下裂の手術に必要な大きさを得ることです。</p>\n<div class=\"formula\">エナルモンデポー® 25（〜50）mg/回、4週ごと、1〜3回、筋注</div>\n<p>伸展陰茎長は1回あたり平均<strong>約0.5 cm</strong>伸びます（1回目0.64、2回目0.43、3回目0.36 cm）。<strong>4回以上打っても、それ以上の効果はありません</strong>。−2.0 SD（おおむね3 cm）を超えたら止める目安です。始める時期は、ミニ思春期（生後2〜6か月）がよいという意見もありますが、年齢を問わず効果はあります。1歳未満では骨年齢の促進はふつう見られません。</p>\n<p>反応が悪いときは、立ち止まります。<strong>5α還元酵素欠損症やアンドロゲン不応症</strong>が隠れているかもしれません。前の回のDHTクリームが選択肢になる子もいます。1 cm未満の重い小陰茎は、反応が悪いと報告されています。</p>\n<h3>尿道下裂</h3>\n<p>日本では<strong>男の子約2,500人に1人</strong>（欧米では150〜300人に1人）。多因子で、早産や低出生体重の子に多く見られます。立って排尿できない、陰茎が曲がる、将来の性交や腟内射精が難しくなる。成長しても自然には治らないので、<strong>手術</strong>が必要です。</p>\n<p>精査が必要な子もいます。高度の尿道下裂で<strong>停留精巣を伴う</strong>子は、染色体や性腺の異常が隠れていることがあるので、内分泌の精査をします。<strong>尿蛋白が陽性</strong>なら、第11話のDenys-Drash症候群も考えます。</p>\n<h3>手術の時期と方法</h3>\n<p>修復術は<strong>生後6か月から1歳6か月</strong>ごろに行います。亀頭や陰茎が小さい子（亀頭幅14 mm未満）では、手術の前にテストステロンを月1回、2〜3回打って、大きさと血流を良くしておきます。</p>\n<p>尿道板を残す術式には<strong>MAGPI法、TIP法、DIG法</strong>があります。DIG法は、包皮から取った移植片を縦に切った尿道板に縫いつけ、広くてスリット状の尿道口を作る汎用の術式です。人工勃起で曲がりを確かめ、曲がりが残れば尿道板を切って伸ばし、別の方法で尿道を作ります。高度な例では、曲がりを直す手術と尿道を作る手術を<strong>6か月あけて二期的に</strong>行います。</p>\n<p>合併症（尿道皮膚瘻、尿道狭窄、離開）は、尿道板を残せた例で<strong>約5%</strong>、尿道板を切って長い尿道を作った例では<strong>20%以上</strong>です。瘻孔は術後6か月以降に閉じます。思春期以降、性生活や父親になるまで、長く見守るのが望ましいとされます。</p>\n<p>冒頭の男の子の伸展陰茎長は2.3 cm、尿道口は冠状溝のすぐ下でした。精巣は両側とも陰嚢内に触れます。テストステロンを3回打って3.6 cmになり、1歳で尿道下裂の手術を受けることになりました。</p>", "keys": ["小陰茎は伸展陰茎長−2.5 SD未満（新生児2.4、6か月2.6、1歳半2.8、3〜7歳3.0 cm）", "T 25 mg/4週×1〜3回で1回約0.5 cm。4回以上は無効。反応不良なら5ARD・AISを疑う", "尿道下裂は日本で男児約2,500人に1人。停留精巣合併は精査、尿蛋白陽性ならDenys-Drash", "修復術は生後6か月〜1歳6か月。亀頭幅14 mm未満は術前T", "合併症は尿道板温存で約5%、離断例で20%以上"], "upd": null, "quiz": [{"v": "", "q": "日本人の伸展陰茎長で、生後6か月の−2.5 SDの値は。", "o": ["2.6 cm", "2.4 cm", "2.8 cm", "3.0 cm"], "a": 0, "e": "日齢1以降の新生児2.4 cm、生後6か月2.6 cm、1歳6か月2.8 cm、3〜7歳3.0 cm。同人種同年齢の基準値と比較したSD値が−2.5未満で尿道下裂など解剖学的異常を伴わないものを小陰茎、伴うものをミクロファルスと定義。思春期前の男性ホルモン治療の目的は陰茎サイズを増大させ立位排尿を可能にし、男性としての性自認を揺るがせないこと、尿道下裂修復術に必要な陰茎増大を目指すこと。思春期以降は年齢相応に二次性徴を発現させ完成させること、除脂肪組織の増加、骨量や骨密度の増加、QOL向上などを目的とする。", "r": "治療 p.76"}, {"v": "", "q": "小陰茎に対するテストステロン療法（エナルモンデポー®）の処方例として正しいのは。", "o": ["25〜（50）mg/回、4週ごと、1〜3回、筋注", "125 mg/回、4週ごと、6回、筋注", "12.5 mg/回、2週ごと、12回、筋注", "250 mg/回、単回、効果不十分なら3か月後再投与"], "a": 0, "e": "伸展陰茎長は1回の投与（25 mg/回）当たり平均0.5 cmほど増加し（1回目0.64、2回目0.43、3回目0.36 cm）、4回以上投与してもそれ以上の効果は得られない。治療中止基準は伸展陰茎長−2.0 SD（おおむね3 cm）以上を目安とすることが多い。重度の小陰茎（1 cm未満）では治療反応が悪いと報告があり、治療効果が悪い場合には5α還元酵素欠損症やアンドロゲン不応症などの鑑別も考慮する（治療反応不良例85例中8例のうち半数が5α還元酵素欠損症3例とアンドロゲン不応症1例）。治療開始時期はmini-puberty期（生後2〜6か月）が望ましいとの意見もあるが年齢を問わず治療効果は認められる。副作用として骨年齢促進（1歳未満では通常認めない）、肝機能障害、女性化乳房、外陰部発毛など。", "r": "治療 p.76"}, {"v": "", "q": "尿道下裂修復術の一般的な施行時期は。", "o": ["生後6か月から1歳6か月程度", "新生児期（生後1か月以内）", "3歳から就学前（3〜6歳）", "思春期以降（12歳以降）"], "a": 0, "e": "亀頭・陰茎が未発達な症例（亀頭幅14 mm未満）では術前にテストステロンエナント酸エステル（エナルモンデポー®筋注25 mg×1/月、2〜3回）を投与して陰部の発達と血流増強を図る。治療目的は尿道口を亀頭先端部に開口させ尿流の良好な立位排尿と腟内射精を可能にし、陰茎屈曲を解消することにより性交に支障をきたさないようにすること。近年では正常に近い整容性を達成することも求められる。包皮の形成不全がなく陰茎屈曲を伴わない一部の亀頭型尿道下裂症例を除いて原則的に手術適応。精緻な手術操作が必要となるため通常は2.5倍以上の手術用拡大鏡を使用する。", "r": "治療 p.80"}]}, {"id": "x15", "lv": 3, "t": "女性外陰部の手術：急がないという選択", "min": 6, "cats": "DSDのホルモン療法・外科", "src": "治療 p.83-85", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>21水酸化酵素欠損症の46,XXの女の子、1歳。陰核がやや大きく、ご両親が手術について相談に来ました。「早く手術してあげたほうが、この子のためなんでしょうか」</div><p>この手術ほど、ここ数十年で考え方が大きく変わった領域は少ないかもしれません。今日は、何をする手術なのか、そして<strong>なぜ「急がない」選択肢が重くなってきたのか</strong>を見ます。</p>\n<h3>手術の目的は三つ</h3>\n<ul>\n<li>性に一致した外陰部の外観を確保すること</li>\n<li>大人になってからの<strong>性機能と生殖機能を保つ</strong>こと</li>\n<li>手術による性機能・排尿機能の合併症を最小にすること</li>\n</ul>\n<h3>過去から学んだこと</h3>\n<p>1970年より前には、<strong>陰核切断術</strong>が行われていました。「性機能に陰核は要らない」という誤解に基づいたものです。小児期に陰核形成術を受けた大人の女性で、<strong>陰核の知覚やオーガズムが低下</strong>していることが報告されました。</p>\n<p>2006年の性分化疾患のコンセンサスステートメント以降、治療の選択に<strong>患者と家族が参加する</strong>ことが勧められるようになりました。患者会からは、「<strong>本人が手術の選択に参加したい</strong>」という声が世界中から上がっています。欧米では、本人が選べる年齢まで待ってから手術することが勧められるようになってきました。</p>\n<h3>ガイドラインの推奨</h3>\n<p>アメリカ内分泌学会のガイドラインは、<strong>軽い陰核肥大では手術を延期</strong>し、中等度から高度では<strong>経験の豊富な手術チーム</strong>が行うことを考慮する、としています。日本では、いまも生後6か月から2歳ごろに行うのが一般的です。</p>\n<h3>いまの陰核形成術</h3>\n<p>現在の標準は、<strong>神経血管束を温存</strong>して、大きくなった陰核海綿体を切除する<strong>陰核縫縮術</strong>です。海綿体を切除せず、大陰唇の下に<strong>埋め込む</strong>術式も報告されています。本人が将来、男性化手術を望む可能性を考えたものです。陰嚢のような皮膚は、体が育つにつれて相対的に小さくなり、思春期には陰毛に隠れるので、必ずしも形成は要りません。</p>\n<h3>腟の形成は、泌尿生殖洞の長さで決まる</h3>\n<p>内視鏡で泌尿生殖洞と固有尿道の長さを測り、術式を選びます。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>泌尿生殖洞</th><th>術式</th></tr>\n<tr><td>ごく浅い</td><td>カットバック</td></tr>\n<tr><td>1〜2 cm</td><td>逆U字皮弁、オメガ型皮弁による腟口形成</td></tr>\n<tr><td>2〜3 cm</td><td>PUM（partial urogenital mobilization）</td></tr>\n<tr><td>3 cm以上で固有尿道が短い</td><td>代用腟による造腟術</td></tr></table></div>\n<p>腟口の狭窄や泌尿生殖洞の遺残は少なくありません。でも、腟口が狭くても月経血の流出に困ることはまれです。だから<strong>小児期に定期的な腟口拡張をすることは、体と心の負担から行うべきではない</strong>とされています。性的な活動を始める時期に困難があれば、そのときに拡張や再形成を考えます。</p>\n<p>ご両親には、こう伝えました。「急いで手術をしなければ、お子さんの体に悪いことが起きる、ということはありません。軽い場合は、本人が自分で考えられる年齢まで待つという選択肢もあります。どちらを選んでも、私たちのチームが一緒に考えます」。ご両親は、もう少し考えて、泌尿器科の先生の話も聞いてから決めることにしました。</p>", "keys": ["目的：性に一致した外観、成人の性機能・生殖機能の保持、合併症の最小化", "1970年以前の陰核切断術は誤解に基づく。小児期手術後の知覚低下が報告", "2006年以降は患者家族が参加。欧米では本人が選べる晩期手術へ。日本は6か月〜2歳が一般的", "米内分泌学会：軽度肥大は延期、中等〜高度は経験豊富なチーム。標準は神経血管束温存の陰核縫縮術", "腟形成は泌尿生殖洞の長さで術式選択。小児期の定期的な腟口拡張は行わない"], "upd": null, "quiz": [{"v": "", "q": "アメリカ内分泌学会ガイドラインの陰核形成術の推奨として正しいのは。", "o": ["軽度の陰核肥大では延期、中等〜高度では経験豊富なチームが行うことを考慮", "全ての陰核肥大に対して生後6か月以内の陰核形成術を行うことを推奨", "程度によらず患者本人が手術を選択できる成人期まで延期することを推奨", "陰核形成術は性機能障害のリスクから程度によらず全例で禁忌としている"], "a": 0, "e": "女性外陰部形成術の目的は①性に一致した外陰部外観を確保、②成人期の性機能・生殖機能を保持、③手術に関連する性機能・排尿機能合併症を最小限にすること。2006年の性分化疾患コンセンサスステートメント以降、治療の選択に患者家族の参加が推奨され、患者本人が手術の選択に参加したいという要望が世界的に患者会から出されている。欧米では患者本人が手術治療を選択できる晩期に女性外陰部形成術を行うことが推奨されるようになってきた。日本では現在でも女性外陰部形成術を生後6か月以降から2歳頃までに行うのが一般的。1970年以前に行われた陰核切断術は性機能には陰核不要という誤解に基づいており、小児期に陰核形成術を受けた成人女性は陰核の知覚やorgasmの低下があることが2000年代に報告された。", "r": "治療 p.83"}, {"v": "", "q": "現在の標準的な陰核形成術の術式は。", "o": ["神経血管束を温存して肥大した陰核海綿体を切除する陰核縫縮術", "陰核海綿体を温存して肥大した陰核亀頭を切除する陰核切断術", "陰核海綿体を切除せず神経血管束ごと大陰唇下に埋没させる術式", "陰核包皮のみを切除し陰核亀頭を露出させる陰核包皮切除術"], "a": 0, "e": "陰核亀頭は恥骨骨膜下端または切除した海綿体断端に固定する。陰核亀頭が大きい場合には亀頭を一部切除して形成する方法も報告。陰核海綿体の形成をしなくても陰核を深く埋め込むことで違和感のない外観にすることは可能であり、患児本人が将来性的違和を感じて男性化手術を希望することもありうる点を考慮して、陰核海綿体を切除するのではなく大陰唇下に埋没させる術式も報告されている（残った海綿体から陰茎形成を行った報告はまだない）。余剰になった陰核包皮は背側正中で二分し陰核亀頭を覆うフード状に形成し残りは小陰唇として利用。陰囊様の皮膚は身体発育とともに相対的に小さくなり思春期には陰毛に隠れることから必ずしも形成の必要はない。術後合併症として感染・出血のほか、陰唇癒合・瘢痕・陰核萎縮などが報告されている。", "r": "治療 p.83-84"}, {"v": "", "q": "腟形成術後の腟口狭窄に対する対応として述べられているのは。", "o": ["性的活動期に性交困難があれば腟口拡張や再形成を行う", "小児期から定期的に腟口拡張を行って狭窄を予防する", "月経血の流出障害が必発のため思春期前に腟口再形成を行う", "腟口狭窄は成長に伴い自然に改善するため経過観察のみ"], "a": 0, "e": "腟口狭窄や尿生殖洞遺残の頻度は高いが、腟口狭窄があっても月経血の流出で困ることはまれであり、小児期に定期的な腟口拡張を行うことは身体的・精神的負担から行うべきではない。長期合併症として尿路感染、下部尿路機能障害、腟狭窄、性機能低下が報告され、術式によりリスクに差がある。短期合併症としては出血、皮弁壊死、創部感染、下肢神経麻痺など。術後性機能に関して性的欲求・性的刺激・絶頂感などは低くなく多くの症例で定期的な性交渉がある。", "r": "治療 p.84-85"}]}, {"id": "x16", "lv": 2, "t": "性腺を摘る、ホルモンを補う", "min": 6, "cats": "DSDのホルモン療法・外科・性分化の基本と説明・46,XY DSD", "src": "p.383, 390 ／ 小児内分泌学 p.342 ／ 治療 p.77-79", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>小さいころに性腺を摘出した、46,XYの女の子。中学1年生になりました。「どうして私だけ、毎日テープを貼らなきゃいけないの？」と、診察室で初めて聞いてきました。</div><p>DSDの子の思春期を支えるのは、多くの場合<strong>ホルモン補充</strong>です。その前段にある<strong>性腺摘出</strong>の考え方と、男性ホルモン・女性ホルモンそれぞれの補充、そして本人への説明を見ます。</p>\n<h3>性腺腫瘍のリスクを決めるもの</h3>\n<p>リスクを上げる大きな因子は二つ。<strong>Y染色体（GBY領域）をもつこと</strong>と、<strong>性腺がお腹の中にあること</strong>です。性腺芽腫などを高い頻度で合併するので、腫瘍のリスクと性腺の働きの両方を考えて、摘出を検討します。リスクは病気ごとに違います（Frasier症候群で約60%、Y成分のあるTurnerで約10%）。</p>\n<h3>男性ホルモンの補充</h3>\n<p>自然に思春期が来ないと考えられる子では、平均的な二次性徴の年齢に近い<strong>12歳ごろ</strong>から始めます。自分のテストステロンが期待できる子では、14〜15歳まで待つこともあります。</p>\n<div class=\"formula\">エナルモンデポー® 25〜50 mg/4週 → 6か月後 50〜100 → 1年後 75〜150 → 1年半後 125〜200 → 2年後 〜250 mg/2〜4週</div>\n<p>この方法での成人身長までの伸びは<strong>10〜15 cm</strong>ほどで、ふつうの思春期（25〜30 cm）より少なくなります。そのため150〜155 cmに届くまで待つ、という先生もいます。3〜6か月ごとに身長・体重・精巣容量・Tanner・テストステロン・血算・肝機能・脂質を、1年ごとに骨年齢と骨密度を見ます。大人では、テストステロンが<strong>600 ng/dLを超えるか350 ng/dLを下回れば</strong>量を調整します。副作用は、にきび、赤血球増多、肝酵素上昇、HDL低下、気分の変化、女性化乳房（PAISで悪化しやすい）などです。</p>\n<h3>女性ホルモンの補充</h3>\n<p>女性ホルモンが必要なのは、<strong>社会的に女性で、卵巣が働いていない</strong>子です。46,XY DSDで性腺を摘った子、45,X/46,XYなどで女性として育つ子。一方、21水酸化酵素欠損症やアロマターゼ欠損症の46,XXの女の子は、卵巣が働くので補充は要りません。</p>\n<p>製剤と増やし方は、第7話のTurner症候群と同じです。エストラーナ® 0.09 mgから約2年で成人量へ。最近は肝臓への負担が少ない経皮製剤が増えています。</p>\n<p>ここで一つ、大事な違いがあります。</p>\n<div class=\"formula\">子宮あり → 成人量で6か月 or 出血があれば Kaufmann療法へ<br>子宮なし → Kaufmannに移らず、エストロゲン単独を成人量で継続</div>\n<p>プロゲスチンを足すのは、子宮内膜を守るためです。子宮がなければ要りません。46,XY DSDの女の子では<strong>高身長</strong>が問題になることがあり、9〜11歳と遅らせずに始め、はじめから多めのエストロゲンで骨端を早めに閉じる方法も選択肢です。</p>\n<h3>始める前に確かめること</h3>\n<p>女性ホルモンを始める前に、<strong>性自認を慎重に確かめる</strong>必要がある病気があります。<strong>5α還元酵素欠損症と17βHSD欠損症</strong>です。第13話で見たように、思春期の前後に性自認が男性だと分かることがあるからです。CAISは原則として女性の性自認です。</p>\n<p>非典型的な二次性徴をきっかけに思春期に診断された子では、<strong>GnRHアナログで一時的に二次性徴を止める</strong>選択肢もあります（保険適用外）。検査、本人への説明、心の準備のための時間を稼ぐためです。</p>\n<h3>本人への説明：三つのこと</h3>\n<p>性腺を摘った子への説明として、本書は三つの要素を挙げています。</p>\n<ul>\n<li><strong>何が起きたか</strong>：未熟な性腺があったので、摘出したこと</li>\n<li><strong>これから何が必要か</strong>：そのためにホルモンの補充が必要なこと</li>\n<li><strong>何が起こらないか</strong>：月経は来ないこと</li>\n</ul>\n<p>この三つを、本人が自分の言葉で受け取れる形で、年齢に合わせて伝えていきます。</p>\n<p>中学1年生の彼女には、こう話しました。「小さいころ、あなたのお腹の中にあった性腺は、将来病気になるかもしれない未熟なものだったから、取ったんだ。だから、体が大人の女性になるためのホルモンを、テープで補っている。生理は来ないけれど、テープを続ければ、胸もふくらんで、骨も強くなる」。彼女はしばらく黙ってから、「ほかにもそういう子っているの？」と聞きました。「いるよ。違うだけで、おかしいことじゃない」。</p>", "keys": ["腫瘍リスク因子はY染色体（GBY）と腹腔内性腺。リスクは疾患ごとに違う", "男性ホルモン補充は12歳ごろ25〜50 mgから2年で成人量。伸びは10〜15 cm", "女性ホルモン補充は社会的女性で卵巣機能がない場合。46,XXのCAHやアロマターゼ欠損症では不要", "子宮がなければKaufmannに移らずエストロゲン単独", "5ARD・17βHSD欠損症は補充前に性自認を確認。説明は「何が起きたか・何が必要か・何が起こらないか」"], "upd": null, "quiz": [{"v": "", "q": "性腺腫瘍のリスク評価で重要とされる因子は。", "o": ["Y染色体（GBY領域）を有することと、腹腔内性腺であること", "年齢（思春期以降にのみ発生する）", "外性器の形態（男性化が強いほど高リスク）と年齢、血中テストステロン", "血中テストステロン値（高いほど高リスク）"], "a": 0, "e": "gonadoblastomaなどを高頻度に合併するため、腫瘍リスクと性腺機能をふまえて摘出を検討する。リスクは疾患ごとに異なる。", "r": "小児内分泌学 p.342"}, {"v": "", "q": "DSDの女性ホルモン補充療法で、子宮がない場合のKaufmann療法の扱いは。", "o": ["移行せず、エストロゲン製剤単独を最大量のまま継続", "子宮の有無にかかわらず成人量で6か月後に移行", "黄体ホルモンのみを周期的に投与して骨密度を維持", "エストロゲンを中止し、黄体ホルモン単独に切り替え"], "a": 0, "e": "子宮があり性器出血が期待できる場合には、プロゲステロンを併用し定期的に性器出血を起こさせるKaufmann療法に移行する。移行時期は成人量で6か月を経過するか、途中で消退出血が起こるか、いずれか早い時点。長期的なエストロゲン治療による子宮癌などのリスクを軽減させる。処方例：エストラーナ®テープ下腹部や臀部に貼付、0.09 mg製剤1枚（もしくは0.72 mg製剤1/8枚）2日ごと貼り替え6〜12か月→0.18 mg（1/4枚）6〜12か月→0.36 mg（1/2枚）6〜12か月→0.72 mg 1枚6か月。プレマリン®錠は1/10錠→1/4錠→1/2錠（各1日1回経口6〜12か月）→1錠6か月。生殖能力の獲得は、女性ホルモン補充を要するDSDの場合、性腺機能が廃絶、あるいは摘出後である場合が多く困難。", "r": "治療 p.79"}, {"v": "", "q": "DSDの社会的女性への女性ホルモン補充療法で、治療開始前に性自認の慎重な評価が必要とされる疾患は。", "o": ["5α還元酵素欠損症や17β-HSD欠損症の例", "完全型アンドロゲン不応症（CAIS）", "21水酸化酵素欠損症", "Turner症候群"], "a": 0, "e": "これらでは二次性徴期前後に性自認が男性であることが明らかになる場合があるため。一方、CAISでは性自認は原則女性であり、女性ホルモンを補充するとともに女性としての性に対し心理的な支援を併せて行う。CAISでは精巣を二次性徴期まで温存し二次性徴を自然に発来させる方法をとることもあり、この場合女性ホルモン補充は性腺摘出後より必要となる。女性ホルモン補充療法は選択された社会的性が女性でかつ卵巣の機能が保たれていない場合に必要となる（46,XY DSDで性腺摘出を受けた例、45,X/46,XYなど非典型的な染色体に起因する社会的女性のケース）。46,XX DSDで社会的女性の場合（21OHD、アロマターゼ欠損症）は卵巣機能が保たれており女性ホルモン補充療法は不要なことが多い。治療の原則は通常の性腺機能低下症の患者と同様に少量から開始し2年ほどかけて成人量まで増量する。", "r": "治療 p.78-79"}]}, {"id": "x17", "lv": 3, "t": "性自認と性別違和：決めて終わりにしない", "min": 7, "cats": "性分化の基本と説明・性別違和のホルモン治療", "src": "p.327, 383 ／ 小児内分泌学 p.342, 352, 369-371 ／ 治療 p.75-76, 99-101", "vol": "巻の七 性分化疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>この章の最初の分娩室で生まれた赤ちゃんは、10歳になりました。女の子として育ち、定期的に通院しています。ある日、お母さんが診察室の外で、そっと言いました。「最近、自分のことを『おれ』って言うんです。ただの真似なのか、それとも…」</div><p>この章の最後は、<strong>性自認</strong>の話です。第3話で、社会的な性を生後2週を目安に決めると見ました。でもそれは<strong>出発点</strong>であって、終着点ではありません。</p>\n<h3>いちばん大事な情報は、まだ手に入らない</h3>\n<p>法律上の性を決めるうえで最も重要な情報は、<strong>その子が大人になったときの性自認（gender identity）</strong>だとされています。ところが、それを生まれたときに予測するのはとても難しい。いくつもの因子が関わります。</p>\n<ul>\n<li><strong>胎児期のアンドロゲンへの曝露</strong>：膀胱外反で女性として育てられた子の57%が、のちに男性へ変更したという報告があります。</li>\n<li><strong>思春期の、反対の性の二次性徴</strong>：5α還元酵素欠損症で女性として育てた子の12%に性別違和があったという報告。第13話で見た25〜30%以上の性別の移行とも重なります。</li>\n<li><strong>育つ環境</strong>：思春期前の性別違和のうち、思春期以降も続くのは一部だけです。</li>\n</ul>\n<p>だから、医療チームと両親が診断、生殖の見通し、合併症の情報を共有し、<strong>子の代わりに両親が自分たちで決める</strong>のが妥当とされています。そして、決めたあとも聞き続けます。</p>\n<h3>聞く場を、先に作っておく</h3>\n<p>DSDの子の心理社会的な経過を調べた研究では、社会的男性で<strong>抑うつや不安が健常の人より有意に高い</strong>という結果がありました。性別違和がいつ起きるかを前もって予測することは難しい、とも書かれています。</p>\n<p>だから、性別違和の有無は<strong>思春期の前から確かめておく</strong>。後から聞いたのでは遅いのです。診療のどこかで、本人が自分の体と性別をどう感じているかを話せる場を用意しておきます。長期の心理的な支援と、適切な説明が、心の経過を左右します。</p>\n<h3>性別違和のある子への二次性徴抑制</h3>\n<p>DSDに限らず、性別違和のある子どもへの治療も、小児内分泌医の仕事に含まれます。わが国のガイドラインの要点です。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>段階</th><th>条件</th></tr>\n<tr><td>二次性徴の抑制（GnRHアゴニスト）</td><td>Tanner 2度以上で著しい違和感。12歳未満は特に慎重。精神科医の診断と本人・保護者の同意</td></tr>\n<tr><td>望む性の性ホルモン</td><td>原則18歳以上。1年以上の経過観察のうえ、特に必要な例では15歳以上（2名の精神科医の同意）</td></tr></table></div>\n<p>二次性徴が来る前には使いません。思春期が始まると性別違和がおさまる子も少なくないので、<strong>思春期の最初の体の変化を経験して、その気持ちを確かめること</strong>自体に診断的な意味があります。Tanner 4度以降は抑制の目的では使えませんが、FTMの月経を止める目的には使えます。治療の前には、DSDを含むほかの病気がないことを、染色体も含めて確かめます。</p>\n<p>リュープリン®（適応外）は30 μg/kgを4週ごと、効果が足りなければ180 μg/kgまで。ホルモン検査は6〜12か月ごと、骨年齢・骨密度は1〜2年ごとに見ます。思春期の章の第8話のGnRHアナログ治療と、道具は同じです。</p>\n<h3>可逆と不可逆</h3>\n<p><strong>GnRHアナログは可逆的</strong>です。止めれば思春期は再開します。けれども、<strong>反対の性ホルモンを続けると、性腺の働きに不可逆的な障害</strong>が残ります。この違いを、本人と家族にきちんと伝えます。</p>\n<p>抑制は2年程度を目安に、望む性のホルモンへ移るか、抑制をやめるかを考えます。骨量がピークを迎える時期に長く抑えることは、将来の骨密度の低下につながるからです。望む性のホルモンは、GnRHアナログを続けながら少量から段階的に増やします。MTFではエストラーナ® 0.09 mgから6か月ごとに倍量、FTMではエナルモンデポー® 25 mg/m²を2週ごとから。成人期以降は血栓症、耐糖能異常、肝機能異常、乳がん（MTF）や卵巣がん（FTM）に気をつけます。</p>\n<h3>この章のおわりに</h3>\n<p>第1話で、性の決まり方はスイッチ一つではなく、いくつもの段階の積み重ねだと見ました。性自認も同じで、一度の決定ではなく、<strong>本人が育っていく中で見えてくるもの</strong>です。私たちにできるのは、早い時期に正確な診断をつけ、体を守り、そして本人の言葉を聞き続ける場を用意しておくことです。</p>\n<p>10歳の子のお母さんには、こう答えました。「真似かもしれないし、そうでないかもしれない。どちらでも大丈夫です。次の診察から、本人と少し二人で話す時間を作りますね。焦って決めなくていいし、どちらになっても、私たちはずっと一緒に考えます」。次の診察で、その子は少し照れながら、好きなサッカー選手の話をしてくれました。</p>", "keys": ["法律上の性で最も重要なのは成人後の性自認。予測は難しい（胎児期アンドロゲン・思春期の変化・環境）", "社会的性の決定は出発点。性別違和の有無は思春期前から確認し、聞く場を用意", "二次性徴抑制はTanner 2度以上、12歳未満は特に慎重。望む性のホルモンは原則18歳、特例15歳", "GnRHアナログは可逆的、反対の性ホルモンの継続は性腺に不可逆的障害", "抑制は2年程度を目安に移行か中止を検討（骨密度）。成人期は血栓・乳がん・卵巣がんに注意"], "upd": null, "quiz": [{"v": "", "q": "法律上の性を決定するために最も重要な情報として述べられているのは。", "o": ["児が成人したときのgender identity", "出生時の外性器の男性化の程度（Prader分類）", "染色体核型と性腺の組織型の組み合わせ", "両親が希望する養育の性と家族構成"], "a": 0, "e": "gender identityの予測は難しく、少なくとも複数の因子の影響を受ける。第1は胎生期のアンドロゲン曝露（膀胱外反で女性として養育した場合に57%がその後に男性に変更していた報告）、第2は思春期のcontrasexualな二次性徴発現（5α還元酵素欠損症で女性として養育した場合にテストステロン作用による男性としての二次性徴発現の影響を受け12%が性別違和をもつ報告）、第3は養育環境（思春期前の性別違和のうち思春期以降に持続するのは一部のみ）。医療チームと患者両親との間で診断、生殖予後、合併症の情報を共有して、児の代諾者として両親が法律上の性を自律的に決定するのが妥当。両親が児の性別に確信をもてずに養育した場合や別の性別を望んでいる場合には、児のgender identityが揺らぎうる。", "r": "治療 p.75-76"}, {"v": "", "q": "性別違和における望む性別の性ホルモン治療の開始年齢について、わが国のガイドラインで正しいのは。", "o": ["原則18歳以上。1年以上経過観察し特に必要な例では15歳以上", "原則20歳以上。医療チームの判断による例外は認められない", "原則16歳以上。医師の判断で12歳以上でも開始が可能", "年齢制限はなく、本人と保護者の希望があればいつでも開始可能"], "a": 0, "e": "二次性徴抑制療法の治療開始後2年程度を目処に望む性別の性ホルモンによる治療への移行か二次性徴抑制療法の中止を検討すべきとされる。MTF・FTMいずれにおいてもGnRHaを継続併用したうえで望む性の性ホルモンを少量から段階的に増量する。MTFの治療に関しては経口結合型エストロゲン製剤（プレマリン®）より経皮吸収型エストラジオール貼付剤（エストラーナ®）や天然型経口エストロゲン製剤（ジュリナ®）のほうが副作用の発生頻度が低い可能性があるが、自由診療となるためより安価なプレマリン®が選択される場合もある。成人期以降はエストラジオール吉草酸エステル（ペラニン®デポー筋注）を2週間ごとに10〜20 mgないし毎週5〜10 mg筋注なども選択肢となる。", "r": "治療 p.100"}, {"v": "", "q": "性別違和の治療の予後に関する注意点として述べられているのは。", "o": ["GnRHaは可逆的だが、反対の性ホルモンの継続は性腺機能に不可逆的障害をきたす", "GnRHa治療は不可逆的で性腺機能は回復しないが、性ホルモン治療は中止すれば可逆的", "GnRHa治療も性ホルモン治療も完全に可逆的で、中止すれば生殖能力は保たれる", "骨密度への影響はなく骨密度検査は不要で、血栓症や耐糖能異常のリスクも上昇しない"], "a": 0, "e": "思春期および若年成人期に性ホルモンの影響により骨塩量がピークとなるため、その時期にGnRHaによる二次性徴抑制療法が長期にわたって施行されることは将来的な骨密度の低下のリスクとなることが推察される。成人期以降もホルモン療法が継続されることにより、血栓症、耐糖能異常、肝機能異常、乳癌（MTF）や卵巣癌（FTM）の発生などの副作用に注意が必要。治療には倫理的配慮とともに当事者や家族への十分なインフォームドコンセントを要する。アメリカ内分泌学会がヨーロッパ内分泌学会などとともに2017年に性別違和の小児に対する治療ガイドラインを発表し、GnRHaによる二次性徴抑制療法と成人期治療へのトランジションに関する具体的な治療・管理指針が示されている。", "r": "治療 p.101"}]}];
const TUM = [{"id": "m1", "lv": 1, "t": "成長曲線が見つける脳腫瘍", "min": 5, "cats": "下垂体・鞍上部腫瘍", "src": "p.433, 443 ／ 小児内分泌学 p.249", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>9歳の男の子。この2年で身長のSDが−0.5から−1.8まで下がってきました。体重はむしろ増えています。最近、よく水を飲むようになったと、お母さん。眼科で「視野が少し欠けている」とも言われていました。</div><p>この章は、内分泌の腫瘍と、がんの治療のあとに残る内分泌の問題を扱います。はじめの数話は、小児内分泌医が最も多く出会う腫瘍、<strong>下垂体と鞍上部の腫瘍</strong>です。</p>\n<h3>成長は、視床下部・下垂体の窓</h3>\n<p>本書は、成長率の低下や低身長を見たら<strong>一度はMRIで脳腫瘍を否定する</strong>ことを求めています。成長障害の章の第3話でも、検査の組み立ての中にMRIを入れました。逆に言えば、<strong>成長曲線の変化が、脳腫瘍を見つけるきっかけ</strong>になることがあります。成長は、外から見える視床下部・下垂体の窓なのです。</p>\n<h3>頭蓋咽頭腫の三つの顔</h3>\n<p>鞍上部の代表的な腫瘍が<strong>頭蓋咽頭腫</strong>です。Rathke嚢の遺残から生まれる腫瘍で、主訴になりやすいのは三つ。</p>\n<ul>\n<li><strong>低身長</strong>（GH分泌不全）</li>\n<li><strong>尿崩症</strong>（多飲・多尿）</li>\n<li><strong>視野の異常</strong>（視交叉の圧迫、典型は両耳側半盲）</li>\n</ul>\n<p>おもしろい現象があります。頭蓋咽頭腫では、GHが出ていないのに背が伸びる「<strong>growth without GH</strong>」が見られることがあります。視床下部の障害による肥満と、それに伴う<strong>高インスリン血症</strong>が関わっていると考えられています。だから「背が伸びているからGHは大丈夫」とは言えません。</p>\n<h3>下垂体茎が太いとき</h3>\n<p>MRIで<strong>下垂体茎の腫脹</strong>と中枢性尿崩症があれば、まず二つを考えます。<strong>胚細胞腫瘍</strong>と、腫瘍ではない<strong>Langerhans細胞組織球症（LCH）</strong>です。水の章の第4話で見たとおり、最初のMRIで見えなくても、あとから病変が出てくることがあります。LCHは生検で診断できます。</p>\n<p>そして、腫瘍やリンパ球性漏斗下垂体後葉炎による中枢性尿崩症は、一過性のものを除いて、<strong>ほとんど改善しません</strong>。前葉の機能は治療で動くことがあっても、後葉は戻らない。長く補充することを前提に、家族に説明します。</p>\n<p>冒頭の男の子のMRIには、石灰化を伴う嚢胞性の腫瘤が鞍上部に写っていました。頭蓋咽頭腫です。成長曲線を毎回つけていたかかりつけの先生が、SDの下がり方に気づいて紹介してくれたのでした。次の回は、彼の手術のあとの話です。</p>", "keys": ["成長率低下・低身長では一度はMRIで脳腫瘍を否定する", "頭蓋咽頭腫の主訴：低身長・尿崩症・視野異常", "頭蓋咽頭腫ではgrowth without GH（肥満・高インスリン血症）がある", "下垂体茎腫脹＋尿崩症は胚細胞腫瘍とLCHを考える", "腫瘍・炎症による中枢性尿崩症はほとんど戻らない"], "upd": null, "quiz": [{"v": "", "q": "成長率の低下や低身長を診たときに本書が求めているのは。", "o": ["まず経過観察する", "一度はMRIで脳腫瘍を否定する", "骨年齢とIGF-1だけで判断し、画像は刺激試験が低値のときのみ行う", "GH治療を開始する"], "a": 1, "e": "逆に、成長曲線の変化が脳腫瘍発見のきっかけになることもある。成長は視床下部下垂体の窓になっている。", "r": "p.433"}, {"v": "", "q": "鞍上部腫瘍で「growth without GH」がみられることがあるのはどの腫瘍か。", "o": ["頭蓋咽頭腫", "胚細胞腫瘍", "視神経膠腫", "下垂体腺腫"], "a": 0, "e": "GH分泌不全があるにもかかわらず身長が伸びる現象。肥満に伴う高インスリン血症の関与が推定されている。尿崩症や視野異常、低身長が主訴になりやすい。", "r": "小児内分泌学 p.249"}, {"v": "", "q": "下垂体茎の腫脹と中枢性尿崩症を認めたときに鑑別すべき非腫瘍性疾患は。", "o": ["Langerhans細胞組織球症", "結核", "サルコイドーシスと結核（肉芽腫性疾患）のみ", "川崎病"], "a": 0, "e": "胚細胞腫瘍と並んで、この部位の代表的な原因。生検で診断可能とされている。", "r": "p.443 / 文献2"}]}, {"id": "m2", "lv": 2, "t": "術後の下垂体：補充の順序と三相性反応", "min": 6, "cats": "下垂体・鞍上部腫瘍", "src": "p.439-443 ／ 治療 p.1064-1065", "vol": "巻の八 腫瘍性疾患", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>前の回の男の子、頭蓋咽頭腫の摘出術から3日目。尿量が多くDDAVPを始めました。5日目、急に尿が減り、Naが128まで下がっています。病棟の先生が言います。「尿崩症、治ってきたんじゃないですか？」</div><p>下垂体・鞍上部の手術のあとは、水と、副腎と、甲状腺が同時に動きます。今日は術後の数日から数週間で起きることを、順番に見ていきます。</p>\n<h3>三相性反応：治ったように見える第2相</h3>\n<div class=\"formula\">第1相 尿崩症（4〜5日）→ 第2相 抗利尿相（5〜7日）→ 第3相 永続的な尿崩症</div>\n<p>第1相は、傷ついた神経が働かなくなって起きる尿崩症です。第2相は、壊れた神経終末から<strong>蓄えられていたAVPが漏れ出す</strong>時期。そして蓄えが尽きると、第3相の永続的な尿崩症が来ます。</p>\n<p>危ないのは第2相です。ここでDDAVPを続けると、AVPの漏れと重なって<strong>水中毒</strong>になります。反対に、第2相を見て「治った」と判断しても、第3相が来ます。冒頭の病棟の先生の判断は、ちょうどこの落とし穴でした。</p>\n<h3>補充の順序：ステロイドが先</h3>\n<p>下垂体の術後に、副腎皮質と甲状腺の両方の補充が必要なとき、<strong>ヒドロコルチゾンを先に</strong>入れます。甲状腺ホルモンはコルチゾールの代謝を速めるので、副腎不全があるところに先に甲状腺ホルモンを入れると、<strong>副腎クリーゼ</strong>を招きます。甲状腺の章の第8話、副腎の章の第7話でも出てきた、章をまたいで何度も出てくる原則です。</p>\n<p>中枢性の甲状腺機能低下では、<strong>TSHは指標になりません</strong>。<strong>FT4を基準範囲の高め</strong>に保つように調整します。</p>\n<h3>masked DI：補充したら多尿が出た</h3>\n<p>副腎と甲状腺の機能が低下している子に補充を始めたら、それまでなかった多尿が出てきた。これを<strong>masked DI</strong>（隠れていた尿崩症）と呼びます。コルチゾールが足りないあいだは、腎臓が<strong>自由水をうまく捨てられない</strong>ので、尿崩症があっても多尿が目立たないのです。補充でそれが外れて、本来の尿崩症が顔を出します。補充の副作用ではありません。</p>\n<h3>GHを補うと、変わること</h3>\n<p>複合型の下垂体機能低下症では、GHの補充も考えます。ACTH分泌不全でヒドロコルチゾンを標準量入れていても低血糖が続いていた子が、GHを補うと落ち着くことがあります。逆に、GHを入れても低血糖が続くなら、ステロイドの量を見直します。</p>\n<p>そして、小児期のGH治療が終わっても、軸の異常は続きます。成人期に向けて、<strong>成人GH分泌不全症としての再評価</strong>と、必要なら治療の継続へつなぎます。</p>\n<p>冒頭の男の子は、DDAVPをいったん止め、水分を制限しました。8日目にふたたび尿が増え、そこからはずっとDDAVPが必要になりました。第3相です。ヒドロコルチゾンを先に始め、2日後にLT4を加えました。</p>", "keys": ["三相性反応：尿崩症（4〜5日）→抗利尿相（5〜7日）→永続的尿崩症", "第2相でDDA
