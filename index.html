<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="アカデミー"><meta name="theme-color" content="#0f0b1a"><style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<title>内分泌アカデミー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Unbounded:wght@500;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: phone-first app shell — header, scrolling screens, fixed bottom nav. Single dark world by choice. */
:root{
  color-scheme: dark;
  --ink:#0f0b1a;        /* page ground: plum-black */
  --panel:#1a1328;      /* cards */
  --panel-2:#231a36;    /* raised */
  --line:#33274a;
  --fg:#f1ecf8;
  --muted:#a69bbd;
  --dim:#6d6386;
  --hot:#ff4fa3;        /* magenta */
  --amber:#ffb547;      /* hormone gold */
  --mint:#5ee6c8;       /* done / correct */
  --bad:#ff7a7a;
  --grad:linear-gradient(120deg,#ff4fa3 0%,#ff7d6b 55%,#ffb547 100%);
  --f-display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-num:"Unbounded","Zen Kaku Gothic New",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding-block:14px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.brand{min-width:0}
.brand b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.2;letter-spacing:.02em}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.12em}
.stat{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--f-num);font-size:12px;white-space:nowrap}
.lv{background:var(--hot);color:#1a0612;border-radius:999px;padding:3px 9px;font-weight:700}
.xp{color:var(--amber)}

h1,h2,h3{text-wrap:balance;margin:0}
.screen{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted)}
.title{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.35}

/* hero card */
.today{position:relative;overflow:hidden;border-radius:20px;padding:20px;background:
  radial-gradient(120% 90% at 100% 0%,rgba(255,79,163,.35),transparent 60%),
  radial-gradient(80% 70% at 0% 100%,rgba(255,181,71,.18),transparent 60%),var(--panel);border:1px solid var(--line)}
.today .title{font-size:21px;margin:6px 0 4px}
.today p{margin:0 0 14px;color:var(--muted);font-size:13px}
.axis{position:absolute;right:-6px;top:10px;width:120px;opacity:.55;pointer-events:none}
.cta{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;background:var(--grad);color:#1a0612;font-weight:700;cursor:pointer}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1.3;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--dim);font-weight:500}
.tile.streak{background:var(--grad);border:0;color:#1a0612}
.tile.streak .k{color:#3a0f22}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}

/* chapters */
.chap{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chap-h{display:flex;align-items:center;gap:12px;padding:14px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.chap-n{font-family:var(--f-num);font-size:11px;color:var(--amber);width:28px;flex:none}
.chap-t{min-width:0;flex:1}
.chap-t b{display:block;font-weight:700;font-size:15px}
.chap-t span{font-size:12px;color:var(--muted)}
.pct{font-family:var(--f-num);font-weight:700;font-size:16px;text-align:right}
.pct small{display:block;font-family:var(--f-body);font-size:10px;color:var(--dim);font-weight:400}
.chap.soon{opacity:.55}
.lessons{border-top:1px solid var(--line)}
.les{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.les:first-child{border-top:0}
.les[disabled]{cursor:default;opacity:.4}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-num);font-size:12px;background:var(--panel-2);border:1px solid var(--line)}
.dot.done{background:rgba(94,230,200,.14);border-color:var(--mint);color:var(--mint)}
.dot.next{border-color:var(--hot);color:var(--hot)}
.les b{display:block;font-weight:500;font-size:14px}
.tags{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.tag{border-radius:6px;padding:1px 7px;font-size:11px}
.t1{background:rgba(94,230,200,.14);color:var(--mint)}
.t2{background:rgba(255,79,163,.15);color:var(--hot)}
.t3{background:rgba(255,181,71,.15);color:var(--amber)}

/* reader */
.reader{display:flex;flex-direction:column;gap:16px;padding-top:12px}
.back{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--muted);cursor:pointer;font-size:13px}
.prose{max-width:62ch}
.prose h3{font-family:var(--f-display);font-weight:400;font-size:17px;margin:22px 0 6px;color:var(--amber)}
.prose p{margin:0 0 12px}
.prose strong{color:#fff;background:linear-gradient(transparent 62%,rgba(255,79,163,.35) 62%)}
.figure{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;overflow-x:auto}
.figure svg{display:block;width:100%;min-width:300px;height:auto}
.box{border-radius:14px;padding:14px 16px;font-size:14px}
.box h4{margin:0 0 6px;font-size:12px;letter-spacing:.14em}
.box ul{margin:0;padding-left:1.2em}
.box li{margin:2px 0}
.key{background:var(--panel-2);border:1px solid var(--line)}
.key h4{color:var(--mint)}
.upd{background:rgba(255,181,71,.08);border:1px dashed rgba(255,181,71,.5)}
.upd h4{color:var(--amber)}
.formula{font-family:var(--f-num);font-size:13px;background:var(--ink);border-radius:10px;padding:10px 12px;margin:8px 0 12px;overflow-x:auto;white-space:nowrap}

/* quiz */
.q{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q .qn{font-family:var(--f-num);font-size:11px;color:var(--hot)}
.q p{margin:0;font-weight:500}
.opt{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt.ok{border-color:var(--mint);background:rgba(94,230,200,.12)}
.opt.ng{border-color:var(--bad);background:rgba(255,122,122,.1)}
.opt[disabled]{cursor:default}
.exp{font-size:13px;color:var(--muted);border-left:3px solid var(--amber);padding-left:10px}
.finish{text-align:center;padding:22px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.finish .big{font-family:var(--f-num);font-weight:700;font-size:34px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* glossary */
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--fg);font:inherit}
.term{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.term b{font-size:15px}
.term .en{font-family:var(--f-num);font-size:10px;color:var(--amber);margin-left:6px;letter-spacing:.04em}
.term p{margin:4px 0 0;font-size:13px;color:var(--muted)}

/* roadmap */
.road{display:flex;flex-direction:column;gap:0}
.stop{display:grid;grid-template-columns:34px 1fr;gap:12px}
.stop .rail{display:flex;flex-direction:column;align-items:center}
.stop .rail i{flex:1;width:2px;background:var(--line)}
.stop .pin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--ink);margin-top:6px}
.stop.on .pin{border-color:var(--hot);background:var(--hot);box-shadow:0 0 12px var(--hot)}
.stop.past .pin{border-color:var(--mint);background:var(--mint)}
.stop .body{padding-bottom:18px}
.stop .body b{display:block}
.stop .body span{font-size:12px;color:var(--muted)}
.note{font-size:11px;color:var(--dim);text-align:center;padding-top:10px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:10px 0 12px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--hot)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--grad);color:#1a0612;font-weight:700;padding:10px 18px;border-radius:999px;font-size:13px;z-index:9}
@media (prefers-reduced-motion:no-preference){.screen,.reader{animation:in .28s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}

/* ===== Cyber layer: neon lime + cyan over the plum/magenta base, cut corners, HUD details ===== */
:root{
  --lime:#d4ff3a; --cyan:#3ee8ff; --mint:#3ee8ff;
  --f-num:"Chakra Petch","Zen Kaku Gothic New",sans-serif;
  --cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  --cut-s:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));
}
body{background:
  linear-gradient(rgba(62,232,255,.035) 1px,transparent 1px) 0 0/100% 28px,
  linear-gradient(90deg,rgba(62,232,255,.035) 1px,transparent 1px) 0 0/28px 100%,
  var(--ink)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.top{border-bottom:0;box-shadow:0 1px 0 0 transparent}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--hot),var(--cyan) 60%,var(--lime))}
.logo{border-radius:0;clip-path:var(--cut-s)}
.lv{background:var(--lime);color:#121400;border-radius:0;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:3px 12px}
.xp{color:var(--cyan)}
.eyebrow{font-family:var(--f-num);color:var(--cyan);letter-spacing:.2em;text-transform:uppercase}
.eyebrow::before{content:"// ";color:var(--hot)}
.title{text-shadow:2px 0 rgba(255,79,163,.55),-2px 0 rgba(62,232,255,.45)}
.today,.tile,.chap,.q,.term,.finish,.figure,.key,.upd{border-radius:0;clip-path:var(--cut)}
.today{border:1px solid rgba(62,232,255,.35);background:
  radial-gradient(120% 90% at 100% 0%,rgba(255,79,163,.35),transparent 60%),
  radial-gradient(80% 70% at 0% 100%,rgba(62,232,255,.18),transparent 60%),var(--panel);padding-bottom:28px}
.today::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(-45deg,var(--lime) 0 8px,transparent 8px 16px);opacity:.85}
.cta{border-radius:0;background:var(--lime);color:#121400;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding:10px 24px;letter-spacing:.04em}
.cta:hover{background:var(--cyan)}
.tile .v,.pct,.finish .big{font-family:var(--f-num)}
.tile.streak{background:linear-gradient(120deg,var(--hot),#ff7d6b 60%,var(--lime))}
.bar{border-radius:0;height:5px}
.bar i{border-radius:0;background:linear-gradient(90deg,var(--hot),var(--cyan))}
.chap-n{color:var(--lime);font-family:var(--f-num);font-weight:700}
.dot{border-radius:0;clip-path:var(--cut-s)}
.dot.next{border-color:var(--lime);color:var(--lime);background:rgba(212,255,58,.08)}
.tag{border-radius:0;font-family:var(--f-num);letter-spacing:.06em}
.t1{background:rgba(62,232,255,.14);color:var(--cyan)}
.t3{background:rgba(212,255,58,.14);color:var(--lime)}
.prose h3{color:var(--lime)}
.prose h3::before{content:"▍";color:var(--hot);margin-right:4px}
.prose strong{background:linear-gradient(transparent 62%,rgba(62,232,255,.3) 62%)}
.formula{border-left:3px solid var(--lime);border-radius:0;font-family:var(--f-num)}
.key h4{color:var(--cyan)}
.upd{border:1px dashed rgba(212,255,58,.55);background:rgba(212,255,58,.06)}
.upd h4{color:var(--lime)}
.opt{border-radius:0;clip-path:var(--cut-s)}
.opt.ok{border-color:var(--cyan);background:rgba(62,232,255,.12)}
.exp{border-left-color:var(--lime)}
.finish .big{background:linear-gradient(90deg,var(--hot),var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text}
.search{border-radius:0;border-color:rgba(62,232,255,.4)}
.term .en{color:var(--cyan)}
.stop.on .pin{border-color:var(--lime);background:var(--lime);box-shadow:0 0 12px var(--lime)}
.stop.past .pin{border-color:var(--cyan);background:var(--cyan)}
.stop .pin{border-radius:0;transform:rotate(45deg)}
nav{border-top:0}
nav::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--lime),var(--cyan) 40%,var(--hot))}
nav button.on{color:var(--lime);text-shadow:0 0 10px rgba(212,255,58,.6)}
/* hamburger + drawer */
.menu-btn{width:34px;height:34px;flex:none;display:flex;flex-direction:column;justify-content:center;gap:5px;background:none;border:0;padding:6px;cursor:pointer}
.menu-btn span{display:block;height:2px;background:var(--fg)}
.menu-btn span:nth-child(2){width:70%;background:var(--cyan)}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(8,4,14,.6);backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:31;width:min(84vw,340px);background:
  linear-gradient(rgba(62,232,255,.04) 1px,transparent 1px) 0 0/100% 28px,var(--panel);
  border-right:2px solid var(--cyan);box-shadow:8px 0 40px rgba(255,79,163,.18);transform:translateX(-102%);transition:transform .28s ease;overflow-y:auto}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.dr-in{padding-inline:22px;padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.avatar{width:84px;height:84px;display:grid;place-items:center;cursor:pointer;background:linear-gradient(135deg,var(--hot),var(--cyan));clip-path:var(--cut);position:relative;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar span{font-family:var(--f-num);font-weight:700;font-size:26px;color:#120a1c}
.avatar::after{content:"＋";position:absolute;right:4px;bottom:2px;font-size:12px;color:#120a1c;background:var(--lime);padding:0 4px}
.name{margin-top:10px;background:none;border:0;border-bottom:1px dashed var(--line);color:var(--fg);font-family:var(--f-display);font-size:24px;padding:2px 0;width:100%}
.name:focus{outline:none;border-bottom-color:var(--lime)}
.since{font-size:12px;color:var(--muted)}
.total{font-size:13px;color:var(--muted)}
.total b{font-family:var(--f-num);color:var(--fg);font-size:17px;margin-left:6px}
.month{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.m-cap{font-size:11px;color:var(--muted);letter-spacing:.1em}
.m-row{display:grid;grid-template-columns:96px 1fr;background:var(--ink);clip-path:var(--cut-s)}
.m-k{background:linear-gradient(90deg,var(--hot),#c43a8a);color:#fff;font-weight:700;font-size:13px;padding:6px 10px}
.m-v{padding:6px 12px;font-family:var(--f-num);font-weight:700;text-align:center}
.stars{letter-spacing:.18em;color:var(--dim)}
.stars b{color:var(--lime);text-shadow:0 0 8px rgba(212,255,58,.6);font-weight:700}
.m-hint{font-size:11px;color:var(--cyan)}
.dr-menu{margin-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column}
.dr-menu button{display:flex;align-items:center;gap:14px;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 4px;font-size:16px;font-weight:700;text-align:left;cursor:pointer}
.dr-menu button svg{width:22px;height:22px;color:var(--cyan);flex:none}
.dr-menu button:hover{color:var(--lime)}
.dr-foot{margin-top:18px;font-size:11px;color:var(--dim)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid3 .tile{padding:12px 10px}
.grid3 .tile .v{font-size:22px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-num)}
.cal-nav .back{padding:4px 14px}
.cal-nav .back[disabled]{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.ch{text-align:center;font-size:11px;color:var(--muted)}
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--panel);color:var(--dim);font-family:var(--f-num);font-size:12px;min-width:0;clip-path:var(--cut-s)}
.cd.empty{background:none}
.cd.on{background:var(--panel-2);color:var(--fg)}
.cd.is-today{outline:1px solid var(--lime);outline-offset:-1px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:6px;max-width:90%}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.alt{display:flex;flex-direction:column;gap:8px;margin-top:-4px}
.alt-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.alt-row::-webkit-scrollbar{display:none}
.alt-c{flex:0 0 auto;max-width:72%;text-align:left;background:var(--panel);border:1px solid var(--line);padding:10px 12px;cursor:pointer;clip-path:var(--cut-s);display:flex;flex-direction:column;gap:2px}
.alt-c span{font-family:var(--f-num);font-size:10px;letter-spacing:.08em;color:var(--cyan)}
.alt-c b{font-weight:500;font-size:13px;line-height:1.5}
.alt-c:hover{border-color:var(--hot)}
.home-cal{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.home-cal .hub-h .back{padding:3px 12px;font-size:12px}
.home-cal .cal{gap:4px}
.home-cal .cd{font-size:11px;gap:3px}
.home-cal .dots i{width:5px;height:5px}
.mini-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted)}
.mini-leg span{display:inline-flex;align-items:center;gap:5px}
.mini-leg i{width:7px;height:7px;border-radius:50%;display:inline-block}
.legend{display:flex;flex-direction:column;gap:6px}

const GROWTH = [{"id": "g1", "lv": 1, "t": "GH・IGF-1軸の基本", "min": 5, "cats": "総論・GH分泌不全症・IGF系", "src": "小児内分泌学 p.183-184 ／ レクチャー2 p.73-75", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>「背が伸びないので、成長ホルモンを測ってほしい」。日中の外来で一回採血して、GHが低かった。これでGH分泌不全と言えるでしょうか。</div>{{AXIS}}\n<p>答えは「言えない」です。その理由を知るには、身長を伸ばす仕組みを一本の軸として見る必要があります。<strong>視床下部 → 下垂体前葉 → 肝臓 → 成長板</strong>。この章のすべての病気は、この軸のどこかに置くことができます。</p>\n<h3>アクセルは2本、ブレーキは1本</h3>\n<p>視床下部は<strong>GHRH</strong>でアクセルを踏み、<strong>ソマトスタチン</strong>でブレーキをかけます。もう一本のアクセルが、胃から出る<strong>グレリン</strong>です。グレリンはGHS受容体の内因性リガンドで、3番目のセリンがオクタノイル化されていないと働きません。面白いのは、GHRH受容体が壊れた人にGHRP-6（グレリンと同じ受容体を刺激する薬）を入れてもGHが出ないことです。グレリンは単独で働くのではなく、<strong>GHRHの経路を借りてGHを出させている</strong>と分かります。</p>\n<h3>GHは「波」で出る</h3>\n<p>下垂体のGHは、一定の量ではなく<strong>パルス状</strong>に出ます。とくに大きな波は<strong>入眠後の深い睡眠</strong>のときです。日中の外来で1回採血すると、たまたま波の谷なら低く、山なら高く出ます。冒頭の「1回の低値」に意味がないのはこのためで、<strong>随時のGH1回では分泌不全かどうか決められません</strong>。だから薬で刺激して、出せる力を確かめる負荷試験が必要になります。</p>\n<h3>実際に骨を伸ばすのはIGF-1</h3>\n<p>GHは受容体を2分子つないで二量体にし、JAK-STATを動かして、主に<strong>肝臓でIGF-1</strong>を作らせます。そのIGF-1が成長板の軟骨細胞を増やして骨を伸ばします。</p>\n<p>血中のIGF-1は、<strong>8〜9割以上がIGF-1＋IGFBP-3＋ALSの三量体</strong>として蓄えられていて、自由に動ける遊離型は1%以下です。この大きな「貯蔵庫」があるおかげで、IGF-1は1日の中であまり変動しません。GHと違って<strong>採血の時刻を選ばずに使える</strong>のはこのためで、GHの働きをまとめて映すスクリーニング指標になります。</p>\n<h3>ブレーキの仕組み</h3>\n<p>IGF-1が増えると、視床下部のソマトスタチンを増やし、下垂体にも直接働いてGHを抑えます（負のフィードバック）。ですから、GHが高くてIGF-1が低ければ「下流が応じていない」、GHもIGF-1も低ければ「上流が出していない」と読めます。この<strong>「どこで止まっているか」を軸の上で考える癖</strong>が、この先のすべての回の土台になります。</p>", "keys": ["アクセルはGHRHとグレリン（グレリンはGHRH経路を借りる）、ブレーキはソマトスタチン", "GHはパルス分泌。随時値1回では評価できない", "IGF-1の大半は三量体として貯蔵され、採血時刻を選ばない", "GHとIGF-1の組み合わせで「どこで止まっているか」を読む"], "upd": null, "quiz": [{"v": "", "q": "グレリンについて正しいのは。", "o": ["GHS受容体の内因性リガンドで、3番目のセリンがオクタノイル化修飾を受けている", "GHRH受容体の内因性リガンドで、視床下部弓状核で産生されGH分泌を促す", "GHRH受容体の内因性リガンドで、視床下部弓状核で産生されGHRHと同じ受容体を介してGH分泌を促す", "GHS受容体のリガンドだが、オクタノイル化は活性に不要"], "a": 0, "e": "GHS受容体はGHRH受容体とは別の受容体。GHRH受容体異常症ではGHRP-6を投与してもGH分泌は促進されないことから、グレリンはGHRHを介してGH分泌を促進すると分かる。", "r": "小児内分泌学 p.183"}, {"v": "", "q": "IGF-IがGH分泌をネガティブフィードバックする機序は。", "o": ["GHRHの分泌を直接抑制する", "ソマトスタチン（SRIF）の分泌を促進する", "GHRHの分泌を直接抑制し、GH遺伝子の転写も止める", "下垂体のGH受容体を減少させ、自己分泌を抑える"], "a": 1, "e": "加えて下垂体への直接作用もある。IGF-I投与で内因性GH分泌が大きく抑制される。", "r": "小児内分泌学 p.183"}, {"v": "", "q": "血中IGF-1の大部分が存在する形は。", "o": ["遊離型（約半分）と IGFBP-1 結合型", "IGF-1＋IGFBP-3 の二量体（ALSは結合しない）", "IGF-1＋IGFBP-3＋ALS の三量体", "IGF-1＋IGFBP-2 の複合体"], "a": 2, "e": "遊離は1%以下、二量体が10〜20%以下、三量体が80〜90%以上。三量体は半減期が長く、リザーバーとして働く。", "r": "レクチャー2 p.73-75"}]}, {"id": "g2", "lv": 1, "t": "低身長の定義と、拾い方", "min": 5, "cats": "評価の基本", "src": "臨床Tips p.77-79 ／ 小児内分泌学 p.184-185", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>7歳の男の子。身長は −1.2 SDで正常範囲。でも1年間で3.8 cmしか伸びていません。お母さんは「平均くらいだから大丈夫ですよね」と言います。</div><p>教科書の定義では、低身長は<strong>−2.0 SD以下（3パーセンタイル以下）</strong>です。この子は当てはまりません。それでも、この子は精査に進むべきです。今日はその理由の話です。</p>\n<h3>線は人が引いたもの</h3>\n<p>身長は連続量です。−2.0 SDという線は、便宜上そこに引いたにすぎません。本当に見たいのは「線を割ったかどうか」ではなく、<strong>その子の成長曲線がどう動いているか</strong>です。</p>\n<h3>精査の目安は二本立て</h3>\n<p>精査や治療を考える目安は、<strong>身長が −2.5 SD以下</strong>、または<strong>身長の伸び（成長率）が −1.5 SD以下</strong>です。どちらか一方を満たせば動きます。そして、<strong>身長の絶対値が正常範囲でも、成長率が落ちていれば精査する</strong>と明記されています。冒頭の子は、まさにここに当たります。数字の線だけで拾おうとすると、いちばん拾いたい「これから落ちていく子」を取りこぼします。</p>\n<h3>曲線を「横切る」ことの意味</h3>\n<p>標準成長曲線は7本の線でできています。子どもはふつう、どれか1本の線に沿って伸びていきます。<strong>下へ1本を超えて移ったら病的</strong>なことを考えます。成長率を出すときは、1回の外来で2〜3回測り、そのうえで間をあけた2点の身長を使います。見た目で判断せず、必ず数字にします。</p>\n<h3>家族の身長を入れる</h3>\n<p>同じ低身長でも、両親が小柄なら自然な範囲かもしれません。そこで両親の身長から目標身長を出します。</p>\n<div class=\"formula\">男児 ＝（父＋母＋13）÷ 2 ± 9 cm　／　女児 ＝（父＋母−13）÷ 2 ± 8 cm</div>\n<p>±の幅が「目標範囲」です。この子の予測成人身長がこの範囲を<strong>下回る</strong>なら、身長が −2 SD以上でも、何か病的な背景を考えます。逆に、範囲の中に収まっていれば、家族の体格として説明しやすくなります。</p>\n<h3>女の子なら、もう一つ</h3>\n<p>女児の低身長では、ほかに何も所見がなくても<strong>染色体分析</strong>を行います。Turner症候群は、顔つきや体つきの特徴がはっきりしないことがまれではないからです。「特徴がないから違う」とは言えない病気だということを覚えておきます。</p>", "keys": ["定義は −2.0 SD以下。でも見るのは曲線の動き", "精査の目安：身長 −2.5 SD以下 または 成長率 −1.5 SD以下", "身長が正常範囲でも成長率が落ちていれば精査", "曲線を1本超えて下にシフトしたら病的を考える", "目標範囲は男児±9 cm、女児±8 cm", "女児の低身長は所見がなくても染色体分析"], "upd": null, "quiz": [{"v": "", "q": "低身長の一般的な定義は。", "o": ["−2.0 SD 以下（10パーセンタイル以下）", "−2.0 SD 以下（3パーセンタイル以下）", "−1.5 SD 以下（7パーセンタイル以下）", "−2.5 SD 以下（1パーセンタイル以下）"], "a": 1, "e": "−2.0 SD 以下、または3パーセンタイル以下。ただしこれは人為的に引いた線であり、身長は連続量。「基準を満たすか」ではなく「この子の成長曲線がどう動いたか」を見る。", "r": "臨床Tips p.77"}, {"v": "7歳男児。身長は −1.2 SD で正常範囲内。ただし1年間の身長増加は3.8 cm。", "q": "次の一手として最も適切なのは。", "o": ["正常範囲内なので経過観察のみ", "成長率は季節変動が大きいので、2年分のデータが揃うまで判断しない", "身長絶対値が正常でも成長率低下として精査を進める", "身長が −2 SD を下回っていないので、精査は1年後の再測定まで保留する"], "a": 2, "e": "成長率の低下を認めた場合は、身長絶対値が正常範囲内であっても精査を行うべき、と明記されている。低身長を「数字が線を割ったか」で拾うと、いちばん拾いたい症例を落とす。", "r": "臨床Tips p.77"}, {"v": "", "q": "目標身長（target height）の計算式で正しいのは。", "o": ["男児＝(父＋母＋13)/2、女児＝(父＋母−13)/2", "男児＝(父＋母−13)/2、女児＝(父＋母＋13)/2", "男女とも(父＋母)/2", "父の身長のみで決まる"], "a": 0, "e": "目標範囲（target range）は男児 TH±9 cm、女児 TH±8 cm。子の予測成人身長がこの範囲を外れるときは、何らかの病的背景を考える。", "r": "小児内分泌学 p.184"}]}, {"id": "gB", "lv": 1, "t": "低身長の検査を組み立てる", "min": 6, "cats": "評価の基本・GH治療の実際", "src": "臨床Tips p.79-81 ／ 小児内分泌学 p.82-83 ／ 治療 p.1060", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>「血液検査、全部やってください」。低身長で紹介された小学2年の女の子のお母さん。全部、とはどこまででしょうか。</div><p>低身長の検査は、闇雲に並べるより、<strong>「何を見つけたいか」から逆算して組み立てる</strong>ほうが、取りこぼしも無駄も減ります。今日は、その組み立て方です。</p>\n<h3>低身長は内分泌全体の窓口</h3>\n<p>成長率を落とすのは、GH・IGF-1の軸だけではありません。</p>\n<ul><li><strong>甲状腺</strong>（TRH-TSH-T4）：機能低下で伸びが止まる</li>\n<li><strong>副腎</strong>（ACTH-コルチゾール）：コルチゾールが<strong>多すぎる</strong>と伸びが止まる。ステロイドを飲んでいる子も同じ</li>\n<li><strong>性腺</strong>（LHRH-LH/FSH-性ステロイド）：思春期の伸びを担う</li>\n<li><strong>AVP</strong>：中枢性尿崩症でも成長率は落ちる</li></ul>\n<p>低身長は、内分泌全体を見渡す入り口です。</p>\n<h3>最初の一式</h3>\n<ul><li><strong>IGF-1</strong>（とIGFBP-3）：採血の時間を選ばない。ただし栄養・思春期・甲状腺・年齢の影響を強く受けるので、<strong>低いからといってすぐGHDとは読まない</strong></li>\n<li><strong>甲状腺機能</strong>（TSH・FT4）</li>\n<li>栄養や慢性疾患の手がかり（血算、生化学、炎症反応、腎機能など）</li>\n<li><strong>骨年齢</strong></li>\n<li><strong>女児は染色体</strong>：ほかに所見がなくても</li></ul>\n<h3>使わない検査</h3>\n<p><strong>尿中GH</strong>は、血中GHのごく一部（0.01%ほど）しか尿に出ず、低身長の子でも重なりが大きいので、分泌の指標としては<strong>使いません</strong>。古い本や紹介状に出てくることがあるので、知っておくと戸惑いません。</p>\n<h3>遺伝の検査</h3>\n<p>FISH法では、<strong>SHOX異常症</strong>や<strong>22q11.2欠失症候群</strong>が保険で調べられます。SHOXの異常は欠失が多いので、確認には別の方法も組み合わせます（第11話）。</p>\n<h3>画像に進むとき</h3>\n<p>脳腫瘍の中には、<strong>低身長以外の症状がまったくない</strong>ものがあります。だから、<strong>成長率の低下を確認したら、ほかに症状がなくても頭部MRIを考えます</strong>。下垂体茎が見えないといった所見は、MRIで初めて分かります。順番は「成長率の低下を確かめてから画像へ」です。</p>\n<h3>冒頭の「全部」への答え</h3>\n<p>「全部」ではなく、「成長の記録から、どの時期にどの軸が疑わしいか」を考えて、この一式から始め、必要に応じて負荷試験やMRIへ進む、と説明します。成長曲線こそが、いちばん大事な「検査」です。</p>", "keys": ["低身長は内分泌全体の窓口：甲状腺・副腎（過剰）・性腺・AVPも", "最初の一式：IGF-1・甲状腺・栄養と慢性疾患・骨年齢・女児の染色体", "IGF-1は栄養・思春期・甲状腺で動く。低値＝GHDではない", "尿中GHは使わない", "成長率低下があれば症状がなくても頭部MRIを考える"], "upd": null, "quiz": [{"v": "", "q": "低身長の鑑別として、GH-IGF軸以外に成長率を落とすものは。", "o": ["甲状腺機能低下症、コルチゾール過剰、性腺機能低下、中枢性尿崩症", "鉄欠乏性貧血、ビタミンD欠乏、反復性中耳炎、アレルギー性鼻炎", "甲状腺機能亢進症、コルチゾール欠乏、思春期早発症、腎性尿崩症", "甲状腺機能低下症、コルチゾール過剰、思春期早発症"], "a": 0, "e": "TRH-TSH-T4、ACTH-コルチゾール、LHRH-LH/FSH-性ステロイド、AVP のいずれの異常でも成長率は落ちる。ステロイド投与中も同様。低身長は内分泌全体の窓口。", "r": "臨床Tips p.81"}, {"v": "", "q": "尿中GH測定について正しいのは。", "o": ["GH分泌能の指標として推奨される", "分泌能の指標としては有用でなく、通常は用いない", "24時間蓄尿でGHを測れば、GH分泌の日内総量を正確に反映する", "早朝第一尿なら血中GHと相関し、刺激試験の代わりになる"], "a": 1, "e": "血中GHのごく一部（0.01%程度）しか尿中に出ず、実際に低身長児でも重複が大きい。分泌能の指標としては使わない。", "r": "臨床Tips p.79"}, {"v": "", "q": "低身長の精査で「脳腫瘍でも低身長以外の症状を認めない症例がある」ことから求められるのは。", "o": ["身長増加率の低下があれば、他に症状がなくても頭部MRIを検討する", "症状がなければ頭部MRIは要さず、骨年齢で経過をみる", "頭痛や嘔吐が出てから頭部MRIを行えば十分で、それまでは骨年齢と成長曲線で経過をみる", "invisible stalk は画像で判定できないため、MRIの意義は乏しい"], "a": 0, "e": "下垂体茎の描出不良（invisible stalk）など、MRIで初めて分かる所見がある。身長増加率の低下を確認してから画像に進む。", "r": "小児内分泌学 p.82"}]}, {"id": "g3", "lv": 1, "t": "骨年齢と、家族性・体質性", "min": 5, "cats": "評価の基本", "src": "臨床Tips p.77-83 ／ 小児内分泌学 p.83, 186, 191, 237", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>中学1年の男の子。クラスでいちばん小さく、声変わりもまだ。お父さんは「自分も中学のころは小さくて、高校で一気に伸びた」と話します。</div>{{BONE}}\n<p>このお父さんの一言は、診断にとても役立ちます。今日は、低身長の大半を占める<strong>家族性低身長</strong>と<strong>体質性思春期遅発症</strong>を、骨年齢という物差しで見分ける話です。</p>\n<h3>骨年齢は「残りの伸びしろ」</h3>\n<p>骨年齢は、成長板にあとどれくらい伸びる余地が残っているかの目安です。ふつうは左手と手根部のX線で、GP法かTW2法で判定します。手根骨がまだ出てこない<strong>乳児期は膝</strong>を撮ります。</p>\n<p>TW2法では、個人差の大きい手根骨よりも<strong>橈骨・尺骨・中手骨・指骨（RUS）</strong>を重視します。GP法はアメリカ人の子どもが基準なので、日本人では少しずれることがあります。TW2法には日本人用に標準化された版があり、こちらが勧められています。</p>\n<h3>家族性低身長：低い線を、まっすぐ</h3>\n<p>骨年齢は<strong>ほぼ暦年齢どおり</strong>で、成長曲線は低い位置を<strong>平行に</strong>進みます。伸びる速さは正常で、もともとの体格が小さい、という姿です。学術的には、両親のどちらかが −1.5 SD未満、という定義が使われます。</p>\n<h3>体質性思春期遅発症：遅れて、追いつく</h3>\n<p>こちらは<strong>骨年齢が遅れていて</strong>、思春期も遅れてやってきます。暦年齢で見ると伸びが落ちて見えますが、<strong>骨年齢あたりで見ると成長率は保たれています</strong>。つまり「遅れているだけ」で、伸びしろはまだ残っています。家族歴が60〜70%にあるので、冒頭のお父さんのような話を聞き出せるかが鍵です。親の声変わりや初経の時期を、ぜひ聞いてください。</p>\n<h3>時期ごとに主役が変わる</h3>\n<p>Karlbergのモデルでは、成長の主役は時期で入れ替わります。<strong>乳児期は栄養とIGF</strong>、<strong>小児期はGHと甲状腺ホルモン</strong>、<strong>思春期は性ステロイドとGH</strong>。成長率は乳児期に大きく伸び、3歳までに年7 cmほどに落ち、思春期前には年5〜5.5 cmになります。どの時期に伸びが落ちたかで、疑う軸が変わります。</p>\n<h3>「特発性」に安住しない</h3>\n<p>家族性と体質性、その両方をまとめて<strong>特発性低身長（ISS）</strong>と呼びます。ただしISSは除外診断で、実際には調べが足りないだけのこともあります。最近は遺伝子解析で、ISSの一部に<strong>ACAN、NPR2、SHOX、IHH</strong>など成長板に関わる遺伝子の変異が見つかっています。たとえばACAN変異は、骨年齢が進んで早く伸びが止まる家族性低身長として現れます。「家族みんな小さいから」で終わらせず、骨年齢が進んでいるのに小さい、といった違和感を拾うことが大切です。</p>", "keys": ["骨年齢は伸びしろの目安。乳児は膝、それ以降は左手", "TW2法はRUSを重視し、日本人版がある", "家族性：骨年齢≒暦年齢、低い線を平行に進む", "体質性：骨年齢が遅れ、骨年齢あたりの成長率は保たれる。家族歴60〜70%", "成長の主役は乳児期IGF・小児期GH・思春期性ステロイド", "ISSは除外診断。ACANなどの単一遺伝子も"], "upd": null, "quiz": [{"v": "", "q": "家族性低身長の典型的な所見は。", "o": ["骨年齢が2年以上遅延し、思春期が遅れて成人身長は正常域に届く", "骨年齢はほぼ暦年齢どおりで、成長曲線が低い位置を平行に進む", "成長曲線は正常域だが、思春期スパートが小さく最終身長が低い", "骨年齢は暦年齢どおりだが、成長率が年々低下して曲線を横切る"], "a": 1, "e": "骨年齢≒暦年齢、低い位置で曲線に平行。両親のいずれかが −1.5 SD 未満、という定義が学術的には用いられる。", "r": "臨床Tips p.77"}, {"v": "", "q": "体質性思春期遅発症の特徴として正しいのは。", "o": ["骨年齢は暦年齢どおりで、成長曲線が低い位置を平行に進む", "骨年齢は遅延するが、骨年齢あたりの成長率は保たれる", "骨年齢は遅延し、骨年齢あたりの成長率も低下する", "骨年齢は進み、思春期スパートが早く来て最終身長が低い"], "a": 1, "e": "骨年齢が遅れ、思春期発来も遅い。暦年齢あたりの成長率は落ちて見えるが、骨年齢あたりでは保たれる。家族歴は60〜70%程度に認められ、聴取が診断に有用。", "r": "臨床Tips p.77-79"}, {"v": "", "q": "乳児期の骨年齢評価で撮影すべき部位は。", "o": ["手・手根部", "膝", "脊椎", "骨盤"], "a": 1, "e": "手根骨がまだ出ていない乳児期は膝のX線を用いる。それ以降は左手・手根部で GP法・TW2法。", "r": "臨床Tips p.83"}]}, {"id": "gF", "lv": 1, "t": "背を止めるもの：栄養・慢性疾患・ステロイド", "min": 6, "cats": "評価の基本・GH治療の実際", "src": "小児内分泌学 p.81, 87-89 ／ 治療 p.1057", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>1歳の男の子。体重が増えず、身長もじわじわと曲線を下っています。お母さんは「よく食べているのに」と言います。</div><p>成長は、ホルモンだけで決まるわけではありません。<strong>材料（栄養）と、それを邪魔するもの</strong>があります。今日は、内分泌の外側から成長を止めるものの話です。</p>\n<h3>成長を4つの層で見る</h3>\n<p>成長板の軟骨細胞に働くものを、4つの層で整理する考え方があります。</p>\n<ul><li><strong>全身性の因子</strong>：GH・IGF-1、甲状腺ホルモン、グルココルチコイドの過剰、<strong>栄養</strong>、<strong>炎症性サイトカイン</strong>、細胞外液（腎性アシドーシスなど）</li>\n<li>成長板での近くの細胞同士のやり取り（傍分泌）</li>\n<li>細胞の中の仕組み</li>\n<li>骨の基質そのもの</li></ul>\n<p>内分泌の病気は、この中の一部にすぎません。</p>\n<h3>体重が増えない子（FTT）</h3>\n<p>成長曲線で<strong>2本以上下へずれたら明らかな異常</strong>、1本でも要注意です。国際的にはFTTを「低栄養」と言い換え、Zスコアで重症度を分ける流れがあります。原因は、</p>\n<ul><li><strong>入ってこない</strong>：摂取不足（口や食道の問題、神経性食欲不振症など）</li>\n<li><strong>吸収できない</strong>：嚢胞性線維症、炎症性腸疾患、アレルギー</li>\n<li><strong>使いすぎる</strong>：先天性心疾患、慢性の感染</li>\n<li><strong>内分泌</strong>：甲状腺機能亢進症、GH分泌不全、副腎不全、糖尿病</li></ul>\n<p>と順に考えます。冒頭の子では、「よく食べている」の中身（量、回数、吐いていないか）を具体的に聞くことから始めます。</p>\n<h3>体重と身長、どちらが先に落ちたか</h3>\n<p>ここが内分泌の外来で役立つ見方です。<strong>体重が先に落ち、あとから身長がついてくる</strong>なら、栄養や慢性疾患を考えます。逆に、<strong>体重は増えているのに身長が伸びない</strong>なら、内分泌の病気を疑います（甲状腺機能低下、コルチゾール過剰、GH分泌不全）。巻の三の「1年で伸びが止まって体重が増えた子」は、まさに後者でした。</p>\n<h3>慢性腎臓病（CKD）</h3>\n<p>CKDの子の成長障害では、<strong>GHより先に、CKDそのものの管理</strong>を優先します。先天性の腎尿路の異常ではNaと水を大量に失うので、十分な水分やNaの補充、腎不全用の特殊ミルクを考えます。栄養、腎性貧血、そして<strong>CKD-MBD</strong>（Ca・Pを年齢相当に保つ）をきちんと整えることが、伸びの土台になります。</p>\n<h3>ステロイド</h3>\n<p>グルココルチコイドは成長を強く抑えます。ステロイドを飲んでいる子、そしてCushing症候群の子は伸びが止まります。下垂体機能低下症でヒドロコルチゾンを補充するときも、<strong>必要最小量</strong>にとどめるのはこのためです。</p>", "keys": ["成長を止めるのは内分泌だけではない（栄養・炎症・腎など）", "曲線を2本下にずれたら明らかな異常", "体重が先に落ちる→栄養・慢性疾患、体重は増えて身長だけ→内分泌", "CKDはGHより先にCKDの管理（水・Na・栄養・貧血・CKD-MBD）", "ステロイドは成長を抑える。補充は必要最小量"], "upd": null, "quiz": [{"v": "", "q": "やせ・体重増加不良の評価で、成長曲線のシフトダウンをどう判定するか。", "o": ["2チャネル以上のシフトダウンは明らかな異常、1チャネル以上は要注意", "1チャネルのシフトダウンでも明らかな異常", "3チャネル以上のシフトダウンで初めて異常とする", "シフトダウンの幅より、体重の絶対値が−2 SDを切るかどうかで判定する"], "a": 0, "e": "国際的にはfailure to thrive（FTT）の用語を malnutrition（低栄養）に統一し、Zスコアで重症度を段階化する流れがある。", "r": "小児内分泌学 p.87"}, {"v": "", "q": "体重増加不良（FTT）の鑑別で、内分泌疾患として挙げられるのは。", "o": ["甲状腺機能亢進症、GH分泌不全症、副腎不全、糖尿病", "甲状腺機能低下症、Cushing症候群、PCOS、高プロラクチン血症", "高プロラクチン血症、SIADH", "原発性副甲状腺機能亢進症、Basedow眼症"], "a": 0, "e": "内分泌以外では摂取不足（神経性食欲不振症、口腔・食道の問題）、吸収障害（嚢胞性線維症、炎症性腸疾患、アレルギー）、消費亢進（先天性心疾患、慢性感染）を順に除外する。", "r": "小児内分泌学 p.88-89"}, {"v": "", "q": "慢性腎臓病（CKD）に伴う成長障害の治療で、GHより優先されるのは。", "o": ["CKDそのものの管理", "ただちにGHを開始し、CKDの管理は並行して行う", "性ホルモン補充で思春期を誘導し、成長スパートを得る", "輸血で貧血を補正すれば、成長は回復する"], "a": 0, "e": "先天性腎尿路異常ではNaと水の喪失が大きく、十分な水分摂取や腎不全用特殊ミルクを考慮する。CKD-MBDでは血清CaとPを全ステージで年齢相当の基準範囲に保つことを目標にする。 水分・Na補充、栄養、腎性貧血、CKD-MBDのコントロール。", "r": "治療 p.1057"}]}, {"id": "g4", "lv": 2, "t": "GH分泌不全症の診断", "min": 6, "cats": "GH分泌不全症", "src": "レクチャー2 p.68-69 ／ 臨床Tips p.79-81 ／ 症例 p.87-90 ／ 治療 p.1043", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>負荷試験を2種類行い、GHの頂値は4.8と5.5 ng/mL。どちらも6以下です。これでGH分泌不全症と確定してよいでしょうか。</div><p>GH分泌不全症（GHD）の診断には、<strong>成長のデータ</strong>（低身長や成長率の低下）と、<strong>GH分泌の低下</strong>の両方が必要です。どちらも連続量に人が線を引いたものです。ここに、GHD診断のいちばんの難しさがあります。</p>\n<h3>押さえておく数字</h3>\n<p>手引きの成長の条件は、身長 −2.0 SD以下、または<strong>成長速度が2年以上にわたって −1.5 SD以下</strong>です。そのうえで、<strong>2種類以上</strong>の刺激試験でGHの出が悪いことを確かめます。</p>\n<div class=\"formula\">頂値 6 ng/mL以下（3以下は重症）／ GHRP-2のみ 16 ng/mL以下</div>\n<p>GHRP-2は刺激が強いので、基準が高く設定されています。</p>\n<h3>冒頭の問い：中等度はグレーゾーン</h3>\n<p>頂値が3〜6の<strong>中等度</strong>では、<strong>偽陽性が少なくありません</strong>。1つの負荷試験の偽陽性率は無視できない大きさで、2種類とも6以下でも偽陽性は残ります。重症例とは違い、中等度は「数字が線を割ったから確定」とはせず、成長のデータや画像とあわせて慎重に判断します。</p>\n<p>古いカルテにも罠があります。1980年代のRIA法では基準が<strong>10 ng/mL</strong>でした。当時「正常」とされた値を今の6で読み直すと、話が変わることがあります。測定法と基準はセットで読みます。</p>\n<h3>見かけ上GHが低い子</h3>\n<p><strong>肥満そのものがGHの分泌を下げます</strong>。でも肥満児は高インスリン状態でIGF-1が上がり、むしろよく伸びていることが多いのです。<strong>伸びている肥満児をGHDと読まない</strong>。これは外来でとても大事な一言です。IGF-1も、低栄養や全身の病気で下がるので、単独では決め手になりません。</p>\n<h3>検査だけでは区別できないもの</h3>\n<p><strong>愛情遮断性低身長</strong>では、GH・TSH・LH/FSH・ACTHが軒並み下がることがあり、検査だけでは器質性の下垂体機能低下と見分けられません。家庭から離れて（入院や施設入所で）<strong>2〜4週でホルモンが改善し、成長率が戻れば</strong>確定です。家庭の問題は表に出ないことが多く、疑う目を持っていることが大切です。</p>\n<h3>並んだら腫瘍を疑う組み合わせ</h3>\n<p><strong>中枢性尿崩症と低身長</strong>が並んだら、<strong>鞍上部の胚細胞腫瘍</strong>を疑います。器質性の病変がなければ、尿崩症にGH分泌不全が合併することはまれだからです。初回のMRIが正常でも否定できないので、追跡します。また、成長率が落ちていれば、ほかに症状がなくても頭部MRIを考えます。下垂体茎が見えないなど、MRIで初めて分かる所見があるからです。</p>", "keys": ["診断は「成長のデータ」と「GH分泌低下」の両方", "頂値6 ng/mL以下（重症3以下）、GHRP-2は16以下。2種類以上", "中等度（3〜6）は偽陽性が多い。古いRIAの基準は10", "肥満は見かけ上GHが低い。伸びている肥満児はGHDではない", "愛情遮断は分離で改善。尿崩症＋低身長は腫瘍を疑う"], "upd": null, "quiz": [{"v": "", "q": "GH刺激試験の頂値のカットオフ（リコンビナント標準品）は。", "o": ["3 ng/mL", "6 ng/mL", "10 ng/mL", "20 ng/mL"], "a": 1, "e": "6 ng/mL 以下を分泌不全とする。うち 3 ng/mL 以下が重症。", "r": "臨床Tips p.79"}, {"v": "", "q": "GH頂値が3〜6 ng/mL の「中等度GH分泌不全」で最大の問題は。", "o": ["器質性疾患の合併率が高く、全例に造影MRIと遺伝子検査が要る", "偽陽性が少なくなく、真の分泌不全と区別しにくい", "GH治療の効果が乏しく、適応から外れている", "器質性疾患の合併率が高く、MRIが必須になる"], "a": 1, "e": "1つの負荷試験の偽陽性率は無視できず、2種類とも6以下でも偽陽性が残る。逆に「1つでも6を超えていれば」分泌不全とは言いにくい。重症例と違い、中等度は慎重に扱う。", "r": "レクチャー2 p.68-69 / 臨床Tips p.81"}, {"v": "", "q": "GH分泌不全性低身長症の医療費助成の判定で、GH刺激試験の頂値の基準は。", "o": ["すべての負荷で10 ng/mL以下（1980年代のRIA法の基準をそのまま用いる）", "GHRP-2負荷では16 ng/mL以下、それ以外の負荷では6 ng/mL以下", "すべての負荷で16 ng/mL以下", "GHRP-2負荷では10 ng/mL以下、それ以外の負荷では16 ng/mL以下（逆の組み合わせ）"], "a": 1, "e": "負荷の種類で基準が違う。GHRP-2は強い刺激なので閾値が高く設定されている。2種類以上の負荷が必要。", "r": "治療 表3 p.1043"}]}, {"id": "g5", "lv": 2, "t": "先天性・遺伝性GHDと新生児", "min": 6, "cats": "GH分泌不全症・先天性・遺伝性GHD", "src": "レクチャー1 p.50-52 ／ レクチャー2 p.68-73", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>日齢5の男の子。低血糖がなかなか治まらず、黄疸も長引いています。診察すると陰茎が小さい。</div><p>この三つの組み合わせ、<strong>低血糖・遷延性黄疸・小陰茎</strong>を見たら、まず<strong>先天性の下垂体機能低下症</strong>（GHとACTHの分泌不全）を考えます。新生児の内分泌で、絶対に見逃したくないパターンです。</p>\n<h3>三つの所見の意味</h3>\n<p>低血糖は、GHとコルチゾールの両方が足りないことで起こります。小陰茎は、胎児期のゴナドトロピン不足のサインです。黄疸の機序ははっきりしないものの、<strong>ACTH分泌不全によるコルチゾール不足</strong>が関わると考えられています。だから黄疸を見たら、GHだけでなくACTH系も評価します。</p>\n<h3>新生児は「随時値」が使える</h3>\n<p>第1回で、GHの随時値は使えないと書きました。新生児は例外です。この時期はGHの分泌が生理的にとても高いので、<strong>随時採血でGHが低いこと自体に意味があります</strong>（GH 7 ng/mL未満など）。重症例ではIGF-1が10 ng/mLを超えることは例外的で、逆にIGF-1がそれなりに出ていれば重症GHDという診断自体を疑います。低血糖を起こすインスリン負荷は、乳児やACTH分泌不全が疑われる子では避けます。</p>\n<h3>画像で探すもの</h3>\n<p>正中構造の小さな奇形（口唇口蓋裂など）は、下垂体の形成異常のサインです。MRIでは<strong>invisible stalk症候群</strong>（前葉が小さい・下垂体茎が見えない・後葉が異所性）を探します。周産期からの視床下部性下垂体機能低下の代表で、多くは複数のホルモンが欠ける複合型です。</p>\n<h3>遺伝子ごとの「くせ」</h3>\n<ul><li><strong>PROP1</strong>：GH・TSH・PRL・ゴナドトロピンが先に欠け、<strong>ACTH分泌不全が遅れて出てくる</strong>。診断時に副腎が保たれていても、追跡をやめない</li>\n<li><strong>POU1F1（PIT1）</strong>：GH・PRLが重度、TSHも中等度〜重度。系統の違うゴナドトロピンとACTHは保たれる</li>\n<li><strong>LHX3</strong>：頸の回旋制限と難聴。「頸が回らない低身長」</li>\n<li><strong>HESX1</strong>：視神経低形成と透明中隔の異常（septo-optic dysplasia）。目の見えにくい子の低身長を「目のせい」で終わらせない</li>\n<li><strong>OTX2・SOX2</strong>：小眼球などの眼の形成異常。SOX2では低ゴナドトロピン性性腺機能低下が目立つ</li></ul>\n<h3>GH遺伝子そのものの異常</h3>\n<p><strong>GH1 typeII</strong>では、エクソン3が飛ばされた異常なGHが小胞体にとどまり、正常なGHの分泌を邪魔します（優性遺伝）。<strong>完全欠失（type IA）</strong>では、生まれてから一度も自分のGHを作ったことがないので、補充したGHが「異物」とみなされて抗GH抗体ができることがあります。</p>\n<p>先天性・遺伝性のGHDは、成長率・GH・IGF-1・画像のどれで見ても重度に揃うので、診断は比較的やさしいとされます。逆に、所見がばらばらな症例は、むしろ慎重に扱うべきだということです。</p>", "keys": ["新生児の三つ組：低血糖・遷延性黄疸・小陰茎", "新生児はGH随時低値に意味がある。乳児のインスリン負荷は避ける", "invisible stalk：前葉低形成・茎が見えない・異所性後葉", "PROP1は遅れてACTH分泌不全。PIT1はゴナドトロピン・ACTHが残る", "LHX3は頸、HESX1は視神経、OTX2・SOX2は眼"], "upd": null, "quiz": [{"v": "日齢5の男児。低血糖の遷延、直接ビリルビン優位でない遷延性黄疸、小陰茎。", "q": "まず疑うべきは。", "o": ["先天性甲状腺機能低下症（TSH高値で遷延性黄疸を来す）", "先天性の下垂体機能低下症（GH・ACTH分泌不全）", "高インスリン血症性低血糖（KATPチャネル異常）", "ガラクトース血症（直接ビリルビン優位の黄疸を来す）"], "a": 1, "e": "新生児期の GH／ACTH 分泌不全は、低血糖・遷延性黄疸・小陰茎という組で出てくる。正中構造異常や視神経低形成の合併も探し、頭部MRIへ。", "r": "レクチャー2 p.71-73"}, {"v": "", "q": "PROP1変異で経過中に注意すべきことは。", "o": ["ACTH分泌不全が遅れて出現しうる", "GH分泌が自然に回復する", "TSH分泌不全が思春期以降に軽快し、LT4を減量できる", "GH分泌が思春期に自然回復し、治療を中止できることがある"], "a": 0, "e": "GH/TSH/PRL/Gn で始まり、late onset の ACTH分泌不全が後から来る。診断時点で副腎が保たれていても追跡をやめない。", "r": "レクチャー2 表1 p.68"}, {"v": "", "q": "POU1F1（PIT1）変異のホルモン欠損パターンは。", "o": ["GHとPRLが重度、TSHは中等度〜重度。Gn・ACTHは保たれる", "GH・TSH・PRL に加えて Gn も欠損する（PROP1型）", "GHとACTHが重度、TSH・PRLは保たれる", "GH・TSH・PRLが重度で、Gnも思春期に欠損する（PROP1型と同じ経過）"], "a": 0, "e": "PIT1系統の細胞（somatotroph・lactotroph・thyrotroph）が育たない。ゴナドトロピンと副腎系は別系統なので残る。", "r": "レクチャー2 p.71-73"}]}, {"id": "gC", "lv": 3, "t": "GHとIGFを分子で読む", "min": 6, "cats": "GH分泌不全症・先天性・遺伝性GHD・GH不応症・IGF系・評価の基本", "src": "小児内分泌学 p.84, 183-192", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>学会で「PAPP-A」「STC2」という言葉を聞いて、ぽかんとしてしまった。分子の名前は、軸の上に置けば怖くありません。</div><p>今日は少しだけ深く、分子のレベルでGH・IGFの軸を見ます。暗記ではなく、<strong>「この分子が壊れたら、どこで軸が止まるか」</strong>を考える練習です。</p>\n<h3>GHという分子</h3>\n<p>GH遺伝子（GH1）は<strong>17番染色体の長腕</strong>にあり、5つのエクソンでできています。近くに胎盤性GH（GH2）など似た遺伝子が並んでいて、この似ていることが、<strong>欠失</strong>の起こりやすさの背景になっています。血中のGHの大部分は191アミノ酸の<strong>22 kDa型</strong>で、残りはスプライシングの違いで作られる20 kDa型です。</p>\n<p>第7話で出てきた<strong>GH1 type II</strong>は、エクソン3が飛ばされた17.5 kDaの異常なGHが小胞体に残り、正常なGHの分泌を邪魔するものでした（優性）。欠失型（type IA）とは機序が違います。</p>\n<h3>受容体は「2つでひと組」</h3>\n<p>GHには受容体と結合する部分が2か所あり、<strong>1分子のGHが2分子の受容体をつないで</strong>二量体にします。二量体になって初めてJAK-STATの信号が流れます。だから、受容体の外側（細胞外ドメイン）が壊れても、内側（細胞内ドメイン）が壊れても、GH不応症になりえます。第9話のGHBPの話は、ここにつながっています。</p>\n<h3>IGFの受け手</h3>\n<p><strong>IGF1R（IGF-1受容体）異常症</strong>は、低身長の約1%、またはSGA性低身長の一部を占めると報告されています。受け手の障害なので、IGF-1は<strong>むしろ高め</strong>に出ます。GHの効果は弱いものの、中くらいの伸びは得られます。</p>\n<p>胎内の成長には<strong>IGF-1とIGF-2の両方</strong>が大事で、GHに依存するのはIGF-1だけでした。IGF2はインプリンティングを受け、Silver-Russell症候群の背景にもなります。</p>\n<h3>IGFを「自由にする」仕組み：PAPP-AとSTC2</h3>\n<p>IGFは結合蛋白（IGFBP）にくっついていると働けません。<strong>PAPP-A</strong>という酵素がIGFBP-4を分解すると、IGFが自由になって働けるようになります。</p>\n<p><strong>STC2</strong>は、そのPAPP-Aを<strong>邪魔する</strong>分子です。STC2の機能が失われると、PAPP-Aへのブレーキが外れて自由なIGFが増え、<strong>背が高く</strong>なります。背を高くする方向の遺伝子を知ると、軸の理解がぐっと立体的になります。</p>\n<h3>成長板の奥：CNPとNPR2</h3>\n<p>成長板の中では、<strong>CNP</strong>がNPR2という受容体を介してcGMPを作り、軟骨の分化と増殖を促します。NPR2の機能が<strong>失われると低身長</strong>、<strong>高まると高身長</strong>になります。第11話の軟骨無形成症の新薬（CNPアナログ）は、この経路を使っています。</p>", "keys": ["GH1は17番長腕。似た遺伝子が並ぶことが欠失の背景", "1分子のGHが2分子の受容体をつなぐ（細胞外・細胞内どちらの異常でも不応症）", "IGF1R異常はIGF-1高め、SGAの一部", "PAPP-AがIGFを自由にし、STC2がそれを抑える（STC2喪失で高身長）", "CNP-NPR2：機能喪失で低身長、機能獲得で高身長"], "upd": null, "quiz": [{"v": "", "q": "GHが受容体を活性化する仕組みは。", "o": ["結合部位が2か所（site 1・site 2）あり、1分子のGHが2分子の受容体を架橋して二量体化させる", "GH1分子が受容体1分子に結合し、受容体が単量体のまま活性化する", "GH1分子が受容体1分子に結合し、受容体が単量体のままJAK2をリン酸化して活性化する", "GH1分子が受容体1分子に結合し、受容体が単量体のまま細胞内へ取り込まれてJAK2をリン酸化し核内で転写を調節する"], "a": 0, "e": "二量体化によりJAK-STAT経路が動く。だから受容体の細胞外ドメインの異常でも細胞内ドメインの異常でも不応症になりうる。", "r": "小児内分泌学 図7 p.184"}, {"v": "", "q": "IGF1R（IGF-I受容体）異常症について正しいのは。", "o": ["低身長の約1%、またはSGA性低身長の一部を占めると報告されている", "きわめてまれで低身長の0.1%未満にすぎず、SGAとの関連も報告されていない", "IGF-Iが低値となり、GH治療によく反応する", "GHが低値となり、GHDと区別がつかない"], "a": 0, "e": "受容体側の障害なのでIGF-Iはむしろ高めに出る。GH治療の効果は低いとされるが、中程度の身長増加は得られる。", "r": "小児内分泌学 p.192"}, {"v": "", "q": "身長を増加させる方向に働く遺伝子として近年注目されているのは。", "o": ["STC2（スタニオカルシン2）― PAPP-Aを阻害してIGFBP-4の分解を抑え、遊離IGFを減らす", "SHOX ― PAR1にあり、ハプロ不全で低身長", "NPR2 ― CNPの受容体で、機能喪失でacromesomelic dysplasiaの低身長を来す", "FGFR3 ― 機能獲得で軟骨無形成症"], "a": 0, "e": "STC2の機能喪失変異はPAPP-Aの阻害が外れて遊離IGFが増え、高身長になる。逆方向の遺伝子を知ると軸の理解が深まる。", "r": "小児内分泌学 p.84"}]}, {"id": "g6", "lv": 2, "t": "GH不応症とIGF系", "min": 6, "cats": "GH不応症・IGF系", "src": "レクチャー p.47-49, 63-64, 73-75 ／ 臨床Tips p.80 ／ 小児内分泌学 p.184-192", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>著しい低身長の子。GHは高いのに、IGF-1はとても低い。GHを補充しても、まったく伸びません。</div><p>GHは十分に出ているのに、その先が動かない。これが<strong>GH不応症</strong>（Laron型）です。<strong>GHは高値（または正常〜高値）、IGF-1は低値</strong>。外から入れたGHにも反応しないので、GH治療の適応になりません。第1回の「どこで止まっているか」で言えば、軸の下流で止まっている状態です。</p>\n<h3>GHBPで受容体を推し量る</h3>\n<p>GHBPは、GH受容体の外側の部分（細胞外ドメイン）が切り離されて血中に出てきたものです。だから、受容体の<strong>細胞外ドメインが壊れていればGHBPは低く</strong>なります。ただし、壊れているのが細胞の内側の部分なら、GHBPは正常か高いこともあります。<strong>GHBPが低くないからといって、不応症を否定できない</strong>のはこのためです。診断には、身長、GH、IGF-1、IGFBP-3、GHBPなどを点数化したスコアを使い、骨年齢は入りません。</p>\n<h3>胎児期はIGFが主役</h3>\n<p>ここで、とても示唆に富む事実があります。GH分泌不全の子は、生まれたときの身長は<strong>ほぼ正常</strong>です。ところがIGF-1が欠けた子は、<strong>おなかの中から小さい</strong>のです。つまり、胎児期の成長を支えているのはIGFで、GHの役割は小さいということです。IGF-1とIGF-2はどちらも胎内での成長に大切ですが、GHに依存しているのはIGF-1だけです。IGF-2はインプリンティングを受ける遺伝子で、Silver-Russell症候群の背景にもなります。</p>\n<h3>三量体が作れなくても</h3>\n<p>第1回で、IGF-1の大半は<strong>IGF-1＋IGFBP-3＋ALSの三量体</strong>として蓄えられていると書きました。そのALSが欠けた<strong>ALS欠損症</strong>では、IGF-1もIGFBP-3もとても低くなります。それなのに、<strong>低身長は比較的軽い</strong>のです。貯蔵庫が作れなくても、組織に届く二量体や遊離型のIGF-1が保たれていれば、成長は大きくは崩れません。血中の数値と、組織で実際に働く量は別物だということを教えてくれる病気です。</p>\n<h3>下流のいろいろな異常</h3>\n<ul><li><strong>STAT5B異常症</strong>：STAT5BはGHの信号を伝える役と、免疫での役の両方を持つ。<strong>低身長に免疫異常</strong>が並んだら思い出す</li>\n<li><strong>IGF1R異常症</strong>：受容体側の障害なので、IGF-1はむしろ高め。SGA性低身長の一部を占める。GHの効果は弱いが、中くらいの伸びは得られる</li>\n<li><strong>SHORT症候群</strong>：PIK3R1の異常。低身長、関節の過伸展、目のくぼみなどの頭文字</li></ul>\n<p>IGF-1そのものが作れない不応症には、IGF-1製剤のメカセルミンを使います。</p>", "keys": ["Laron型：GH高値・IGF-1低値。GH治療は効かない", "GHBP低値は受容体の細胞外ドメイン異常。低値でなくても否定できない", "GH分泌不全児は出生時ほぼ正常、IGF欠損は胎内から小さい", "ALS欠損：IGF-1は著明低値でも低身長は軽い", "STAT5Bは低身長＋免疫異常、IGF1RはIGF-1高め"], "upd": null, "quiz": [{"v": "", "q": "GH不応症（Laron型）の典型的なホルモンパターンは。", "o": ["GH低値・IGF-1低値（分泌不全型）", "GH高値（または正常〜高値）・IGF-1低値", "GH高値・IGF-1高値（受容体過剰型）", "GH正常・IGF-1正常・IGFBP-3のみ低値"], "a": 1, "e": "GHは出ているのに下流が動かない。外因性GHにも反応しないため、GH治療の適応にならない。", "r": "レクチャー p.63-64"}, {"v": "", "q": "血中GHBPが低値になるのはどの病態か。", "o": ["IGF1遺伝子欠損（フィードバックでGHBPが減る）", "GH受容体の細胞外ドメインの異常", "ALS欠損（三量体が作れずGHBPが消費される）", "GH1遺伝子欠失（GHがないためGHBPも作られない）"], "a": 1, "e": "GHBPは GH受容体細胞外ドメインの分解産物。受容体の細胞外部分が壊れていれば低値になる。ただし細胞内ドメイン側の異常では高値をとる例もあり、低値でないことは否定材料にならない。", "r": "臨床Tips p.80"}, {"v": "", "q": "ALS（IGFALS）欠損症で特徴的なのは。", "o": ["IGF-1・IGFBP-3が著明低値なのに低身長は比較的軽度", "IGF-1・IGFBP-3が著明低値で、低身長も −4 SD 以下と重度", "IGF-1は正常だがIGFBP-3のみ低値", "GHが測定感度以下で、IGF-1は保たれる"], "a": 0, "e": "総IGF-1の大部分は150 kDa三量体（IGF-1＋IGFBP-3＋ALS）として貯蔵されている。三量体が作れなくても、組織に届く二量体・遊離IGF-1が保たれれば成長は大きく崩れない。", "r": "レクチャー2 p.75"}]}, {"id": "g7", "lv": 2, "t": "SGA性低身長", "min": 6, "cats": "SGA性低身長", "src": "症例2 p.51-55 ／ 小児内分泌学 p.209-210, 227-228", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>在胎39週、2,100 gで生まれた子が3歳になりました。身長は −2.8 SD。お母さんは「小さく生まれたけど、そのうち追いつくと言われた」と話します。</div><p>小さく生まれた子の多くは、本当に追いつきます。でも追いつかない子もいます。今日は、その境目と、追いつかなかった子への治療の話です。</p>\n<h3>SGAの定義</h3>\n<p>SGAは、<strong>出生時の身長と体重がともに</strong>在胎週数相当の10パーセンタイル未満です。体重だけでなく<strong>身長も</strong>条件に入るのがポイントで、低出生体重＝SGAではありません。GH治療の適応を考えるときは、さらに身長か体重が −2.0 SD未満という条件が加わります。</p>\n<h3>9割は追いつく、1割が残る</h3>\n<p>SGAで生まれた子の<strong>約90%は2歳ごろまでに −2.0 SD以上へ追いつきます</strong>（早産児では3歳ごろまで続くことも）。残る<strong>約10%</strong>が治療の対象です。割合は小さく見えますが、SGAで生まれる子の数が多いので、実際の人数は決して少なくありません。冒頭の子は、3歳で −2.8 SD。「そのうち追いつく」時期はもう過ぎています。</p>\n<h3>GH治療の適応（3歳以上）</h3>\n<div class=\"formula\">身長SDS −2.5 未満　かつ　成長率SDS 0 未満</div>\n<p>GHDの基準とは別物として覚えます。開始量は<strong>0.23 mg/kg/週</strong>で、効果が足りなければ<strong>0.47 mg/kg/週</strong>まで増やせます。GHDの標準量0.175とは違う数字です。</p>\n<h3>効いているかを数字で見る</h3>\n<p>身長SDSの改善が、<strong>1年目0.5 SD未満、2年目0.25 SD未満、3年目0.15 SD未満</strong>なら反応不良の目安です。判断の節目を数字で持っておくと、漫然と続けずにすみます。反応が悪ければ増量を考えます。</p>\n<p>SGAの子は将来の糖代謝異常のリスクがあるので、治療中は<strong>血糖とHbA1c</strong>も追います。胎内での低栄養が、大人になってからの代謝の病気につながる（DOHaD）という考え方の、具体的な現場です。日本では若い女性のやせとSGA児の増加が重なっていることも指摘されています。</p>\n<h3>思春期を見張る</h3>\n<p>SGAの子の思春期は、正常か<strong>やや早め</strong>です。追いつき成長のあとに思春期が早く来ると、伸びる期間が短くなり、最終身長を損ないます。GH治療中は、ここを見張ります。</p>\n<h3>背景に隠れた症候群</h3>\n<p>体の左右差、相対的に大きな頭、逆三角形の顔。これらがあれば<strong>Silver-Russell症候群</strong>を考えます。11p15のメチル化異常や7番染色体の母性ダイソミーが知られていて、SGA性低身長の背景として重要です。</p>", "keys": ["SGAは身長・体重ともに10パーセンタイル未満", "約90%は2歳までに追いつく。残る約10%が対象", "適応：3歳以上、身長SDS −2.5未満かつ成長率SDS 0未満", "0.23 mg/kg/週で開始、0.47まで。1年目+0.5 SD未満は反応不良", "糖代謝と思春期の早さに注意。Silver-Russellを見逃さない"], "upd": null, "quiz": [{"v": "", "q": "SGAの定義として用いられるのは。", "o": ["出生体重が在胎週数相当の10パーセンタイル未満（身長は問わない）", "出生時の身長・体重がともに在胎週数相当の10パーセンタイル未満", "出生時の身長・体重がともに −2.0 SD 未満", "在胎37週未満かつ出生体重2,500 g未満"], "a": 1, "e": "体重だけでなく身長も条件に入る点が要。低出生体重＝SGAではない。", "r": "症例2 p.51-53"}, {"v": "", "q": "SGA性低身長症に対するGH治療の適応（3歳以上）として正しい組み合わせは。", "o": ["成長率SDSが0 SD未満、かつ身長SDSが −2.5 SD未満", "身長SDSが −2.0 SD未満、かつ成長率SDSが −1.5 SD未満", "身長SDSが −2.5 SD未満のみ（成長率は問わない）", "成長率SDSが −1.0 SD未満、かつ骨年齢の遅延"], "a": 0, "e": "3歳までに −2.0 SD以上にキャッチアップしなかったことが前提。GHDの基準とは別物として覚える。", "r": "小児内分泌学 p.209-210"}, {"v": "", "q": "SGA性低身長症に対するGHの開始量は。", "o": ["0.175 mg/kg/週（GHDと同量。SGAでは効果が同等のため）", "0.23 mg/kg/週（0.033 mg/kg/日）", "0.35 mg/kg/週（Turnerと同じ）", "0.47 mg/kg/週（増量後の最大量から）"], "a": 1, "e": "効果不十分なら 0.47 mg/kg/週（0.067 mg/kg/日）へ増量しうる。GHD標準量 0.175 とは別物として覚える。", "r": "症例2 p.53-55"}]}, {"id": "g8", "lv": 2, "t": "骨系統疾患と症候群性低身長", "min": 7, "cats": "骨系統疾患・症候群性低身長", "src": "症例 p.56-67 ／ 小児内分泌学 p.194, 216-222", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>低身長で紹介された女の子。よく見ると、前腕と下腿が短く、手首の形が少し変わっています。お母さんも小柄です。</div><p>低身長の子を診るとき、身長の数字だけでなく<strong>手足と体の比率</strong>を見てください。<strong>どこが短いか</strong>で、疑う病気がはっきり変わります。冒頭の子は、前腕と下腿という「真ん中の部分」が短い。これが手がかりです。</p>\n<h3>SHOX異常症：真ん中が短い</h3>\n<p>SHOXは、X染色体とY染色体の両方の端（偽常染色体領域、PAR1）にある遺伝子です。男女とも2コピー必要で、<strong>1コピーになると低身長</strong>になります。中節（前腕・下腿）優位の短縮と、手首の<strong>Madelung変形</strong>が手がかりで、<strong>女性のほうが重い</strong>のが特徴です。Turner症候群の低身長の大部分も、X染色体が1本でSHOXが1コピーになることで説明されます。</p>\n<p>注意したいのは、年齢とともにはっきりしてくることです。幼児期に −2 SD未満でなくても、除外はできません。無治療の成人身長は約 −2.2 SD。検査は、点変異より欠失が主体なので、MLPAなどで欠失を探すのが中心です。</p>\n<h3>軟骨無形成症：根もとが短い</h3>\n<p>こちらは<strong>四肢の根もと（近位）</strong>が短くなります。原因は<strong>FGFR3の機能獲得変異</strong>です。FGFR3は軟骨内骨化のブレーキ役で、それが踏まれっぱなしになるイメージです。ほぼ全例が<strong>Gly380Arg</strong>で、大多数は新しく起きた変異（親は正常）です。</p>\n<p>乳児期にいちばん警戒するのは<strong>大後頭孔狭窄による頸髄の圧迫</strong>で、呼吸障害や突然死につながります。この時期の呼吸の症状は、必ずここを疑います。年長になると、いびきや睡眠時無呼吸（扁桃・アデノイド摘出を考える）、中耳炎・難聴が問題になります。無治療の成人身長は男性約130 cm、女性約124 cm。GHは<strong>0.35 mg/kg/週</strong>で、上乗せは数cm規模です。新しくCNPアナログの<strong>ボソリチド</strong>が承認され、FGFR3の下流を抑えて軟骨の伸びを促します。</p>\n<p>より軽い<strong>軟骨低形成症</strong>はAsn540Lysが多く、症状が軽いので特発性低身長として扱われていることがあります。</p>\n<h3>Noonan症候群</h3>\n<p>RAS/MAPK経路の異常（RASopathy）で、<strong>PTPN11</strong>がいちばん多い原因です。心臓では<strong>肺動脈弁狭窄</strong>が最も多く、肥大型心筋症もあります。見落としやすいのが<strong>凝固異常による出血傾向</strong>で、手術や処置の前に確認しておきます。翼状頸、眼間の開き、眼瞼下垂、耳介低位、盾状胸、停留精巣なども手がかりです。GH治療の前には心エコーを行い、治療中も心臓を追います。</p>\n<p>身長の数字の裏に、どんな体つきが隠れているか。それを見る目を持つと、低身長の外来はぐっと面白くなります。</p>", "keys": ["どこが短いかで疑う病気が変わる", "SHOX：PAR1のハプロ不全。中節短縮・Madelung、女性が重い", "軟骨無形成症：FGFR3機能獲得、Gly380Arg。乳児は大後頭孔狭窄", "GHは0.35 mg/kg/週、ボソリチドが承認", "Noonan：PTPN11、肺動脈弁狭窄、出血傾向"], "upd": null, "quiz": [{"v": "", "q": "軟骨無形成症の原因遺伝子と変異の性質は。", "o": ["FGFR3の機能喪失変異", "FGFR3の機能獲得変異", "SHOXのハプロ不全", "COL2A1の変異"], "a": 1, "e": "FGFR3は軟骨内骨化のブレーキ役。機能獲得＝ブレーキが踏まれっぱなしになる。常染色体優性だが、大多数は新生突然変異。", "r": "症例 p.56-59"}, {"v": "生後2か月の軟骨無形成症児。哺乳中の無呼吸と、覚醒時の呼吸障害が増悪してきた。", "q": "最も警戒すべき合併症は。", "o": ["アデノイド肥大による閉塞性睡眠時無呼吸", "大後頭孔狭窄による頸髄圧迫", "胃食道逆流による誤嚥性肺炎", "気管軟化症による呼気性喘鳴"], "a": 1, "e": "乳児期の最重大合併症。呼吸障害・突然死につながるため、この時期の呼吸症状は必ずここを疑う。", "r": "症例 p.57-59"}, {"v": "", "q": "SHOX異常症について正しいのは。", "o": ["男性のほうが重篤である", "女性のほうが重篤である", "性差はない", "思春期以降に発症する"], "a": 1, "e": "女性のほうが低身長は重い。また年齢とともに低身長がはっきりしてくるため、幼児期に −2 SD 未満でなくても除外できない。", "r": "症例 p.67"}]}, {"id": "gD", "lv": 2, "t": "症候群性低身長を長く診る", "min": 6, "cats": "症候群性低身長", "src": "治療 p.1055-1056 ／ 小児内分泌学 p.220-222", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>Noonan症候群と診断された5歳の男の子。お父さんが「GHを打てば、普通の背になりますか。心臓は大丈夫ですか」と聞きます。</div><p>第11話で、症候群を「体つき」で見分ける話をしました。今日は、診断のあと、<strong>症候群の子をどう長く診ていくか</strong>の話です。数字を知っていると、家族への説明が具体的になります。</p>\n<h3>Noonan症候群の伸び方</h3>\n<p>日本人の成人身長は<strong>男性157 cm（−2.3 SD）、女性147 cm（−2.1 SD）</strong>ほどと報告されています。生まれたときはやや小さい程度で、<strong>乳児期の後半に −2.5 SDあたりへ落ちる</strong>のが典型です。Noonan症候群用の成長曲線があるので、それで追います。</p>\n<p>診断は、特徴的な顔があれば身長や心疾患などの項目（A項目）1つ、顔が「らしい」程度なら別の項目（B項目）2つ、という考え方です。似た病気（RASopathy）との区別が大切です。</p>\n<h3>Noonan症候群のGH治療</h3>\n<p>多くはGH分泌不全を伴いませんが、GH治療で成人身長は<strong>1.4 SD（9.5 cm）ほど</strong>改善すると報告されています。冒頭のお父さんには、「普通の背」ではなく「平均で10 cm近く」という見通しを伝えられます。</p>\n<p>そして心臓です。<strong>GH治療の前に心エコー</strong>を行い、治療中も心臓を定期的に（5年ごとなど）評価し、とくに<strong>肥大型心筋症の悪化</strong>に注意します。</p>\n<h3>Prader-Willi症候群のGH治療</h3>\n<p>巻の五で詳しく見ましたが、GHの効果だけおさらいします。治療前 −3.0 SDから −1.2 SDへ改善した報告があり、用量は0.23〜0.47 mg/kg/週です。骨年齢は進めないと報告されていますが、インスリンは上がります。そして<strong>GHをやめると、伸びが落ちる（catch-down）</strong>ことがあります。開始前の無呼吸と副腎の評価を忘れないことも、あらためて。</p>\n<h3>SHOX異常症の大人の身長</h3>\n<p>無治療の成人身長は<strong>約 −2.2 SD</strong>。Turner症候群と共通の骨の所見（Madelung変形など）を持ち、特発性低身長の一因としても重要です。</p>\n<h3>長く診るときの心構え</h3>\n<p>症候群の子の低身長は、伸ばすことだけが目的ではありません。心臓、代謝、発達、そして本人が自分の体をどう受け止めていくか。GH治療は、その長い付き合いの一部です。数字の見通しを正直に示しつつ、伸び以外の大事なことも一緒に見ていく、という姿勢を家族と共有します。</p>", "keys": ["Noonan：成人身長は男157・女147 cmほど。乳児期後半に落ちる", "Noonan専用の成長曲線で追う", "NoonanのGH治療で約1.4 SD（9.5 cm）改善。開始前と治療中に心エコー（肥大型心筋症）", "PWSのGHは中止でcatch-downしうる", "SHOXの無治療成人身長は約 −2.2 SD"], "upd": null, "quiz": [{"v": "", "q": "Noonan症候群の成人身長（日本人）として報告されているのは。", "o": ["男性157.3±7.4 cm（−2.3 SD）、女性146.8±6.9 cm（−2.1 SD）。出生時はやや小さく、乳児期後半に−2.5 SD付近へ落ちる", "男女とも正常範囲で低身長は伴わず、出生時のみ小さい", "男性140 cm、女性130 cm程度", "出生時から−4 SD以下で、成人まで変わらない"], "a": 0, "e": "Noonan症候群用の成長曲線がある。GH治療は2007年に米国で承認され、成人身長の改善は1.4±0.8 SD（9.5±5.4 cm）程度。多くはGH分泌不全を伴わない。", "r": "小児内分泌学 p.220-222"}, {"v": "", "q": "Noonan症候群の診断基準（van der Burgt）の考え方として正しいのは。", "o": ["特徴的顔貌があればA項目（身長・心疾患など）1つ、顔貌が示唆的ならB項目2つで診断する。類縁疾患（RASopathy）との鑑別が重要", "顔貌のみで診断し、他の所見は要さない", "PTPN11変異が陽性でなければ診断できず、顔貌や心疾患は参考所見にとどまる", "心疾患がなければ除外できる"], "a": 0, "e": "身長は3パーセンタイル（−1.88 SD）以下がA、10パーセンタイル（−1.33 SD）以下がB。GH治療前に心エコーと、治療中は5年ごとの心臓評価、肥大型心筋症の増悪に注意。", "r": "小児内分泌学 p.221-222"}, {"v": "", "q": "Prader-Willi症候群に対するGH治療の成績として報告されているのは。", "o": ["治療前 −3.02±0.65 SD から −1.23±0.91 SD へ改善した", "身長SDスコアはほぼ変化せず、体組成のみが改善する", "治療中は伸びるが、成人身長は無治療例と変わらない", "治療前 −3.02±0.65 SD から −2.80±0.70 SD への改善にとどまり、効果は限定的"], "a": 0, "e": "用量は0.23〜0.47 mg/kg/週、週7回。ブドウ糖負荷でインスリン濃度の上昇を認めるが、骨年齢の促進は認めないと報告されている。GHを中止するとcatch-downが起こりうる。", "r": "治療 p.1055-1056"}]}, {"id": "gA", "lv": 2, "t": "背が高すぎる子と、過成長", "min": 6, "cats": "症候群性低身長・評価の基本", "src": "小児内分泌学 p.85-86, 238-239 ／ 治療 p.1063", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>小学4年の女の子。クラスでいちばん背が高く、この1年でぐんと伸びました。お母さんは「背が高いのはいいことですよね」と言います。</div><p>高身長は、低身長に比べて相談されることが少なく、見過ごされがちです。でも、<strong>背が高くなる病気</strong>の中には、早く見つけたいものがあります。</p>\n<h3>高身長の定義</h3>\n<p>両親から出した目標身長より<strong>+2.0 SD以上</strong>高いことです。多くは家族性や体質性の正常なばらつきですが、病的なものを除外します。</p>\n<h3>内分泌の高身長：最終身長はどうなるか</h3>\n<p>同じ「今、背が高い」でも、大人になったときの身長はまったく違います。</p>\n<ul><li><strong>GH過剰（巨人症）</strong>：成人でも高身長。ブドウ糖を飲んでもGHが下がらないことで診断する</li>\n<li><strong>思春期早発症</strong>：今は高いが、<strong>骨端線が早く閉じて最終身長は低くなる</strong></li>\n<li><strong>甲状腺機能亢進症</strong>：治療すれば正常範囲に収まる</li>\n<li><strong>アロマターゼ欠損症・エストロゲン受容体異常症</strong>：エストロゲンが働かないので骨端線が閉じず、<strong>大人になっても伸び続けて</strong>高身長になる</li></ul>\n<p>冒頭の女の子が急に伸びているなら、まず<strong>思春期早発症</strong>を考えて、乳房の発育と骨年齢を確かめます。「今高い」は、将来も高いとは限らないのです。</p>\n<h3>過成長の症候群</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>症候群</th><th>遺伝子</th></tr>\n<tr><td>Sotos</td><td>NSD1</td></tr>\n<tr><td>Weaver</td><td>EZH2</td></tr>\n<tr><td>Marfan</td><td>FBN1</td></tr>\n<tr><td>Beckwith-Wiedemann</td><td>IGF2のインプリンティング</td></tr>\n<tr><td>Simpson-Golabi-Behmel</td><td>GPC3（X連鎖）</td></tr></table></div>\n<p><strong>Sotos症候群</strong>は骨年齢が進み、幼児期の高身長が大人になると目立たなくなります（成人身長は90パーセンタイル以内に収まることが多い）。ほかにLoeys-Dietz（TGFBR1/2）、ホモシスチン尿症（CBS）なども背が高くなります。</p>\n<h3>軸から見た高身長</h3>\n<p>第8話で見たように、<strong>STC2の機能喪失</strong>やNPR2の<strong>機能獲得</strong>でも背は高くなります。低身長の裏返しとして高身長を見ると、同じ軸の上で理解できます。</p>\n<p>Marfan症候群やホモシスチン尿症は、背の高さそのものより、<strong>心臓・血管・目</strong>の合併症が問題になります。「背が高い」の相談は、こうした病気を見つける貴重な機会です。</p>", "keys": ["高身長は目標身長の+2.0 SD以上。多くは正常のばらつき", "GH過剰は成人も高い、思春期早発は最終身長が低くなる", "アロマターゼ欠損・ER異常は骨端線が閉じず伸び続ける", "Sotos（NSD1）・Weaver（EZH2）・Marfan（FBN1）・BWS（IGF2）", "Marfanなどは心血管・眼の合併症が問題"], "upd": null, "quiz": [{"v": "", "q": "内分泌性の高身長の原因と、成人身長への影響として正しいのは。", "o": ["GH過剰（巨人症）は成人高身長となるが、思春期早発症は骨端線早期閉鎖で成人身長は低下、甲状腺機能亢進症は治療すれば正常範囲に収まる", "いずれも成人高身長となる", "思春期早発症は成人身長が高くなり、甲状腺機能亢進症は治療後も高身長が続く", "甲状腺機能亢進症は治療後も高身長が続く"], "a": 0, "e": "巨人症はOGTTでGHが抑制されないことで診断。アロマターゼ欠損症・エストロゲン受容体異常症は骨端線が閉じず成人で高身長になる。家族性グルココルチコイド欠損症でも成長率増加を認める。", "r": "小児内分泌学 p.239"}, {"v": "", "q": "高身長を伴う疾患で、原因遺伝子の組み合わせとして正しいのは。", "o": ["Sotos＝NSD1、Weaver＝EZH2、Marfan＝FBN1、Beckwith-Wiedemann＝IGF2インプリンティング", "Sotos＝FBN1、Weaver＝NSD1、Marfan＝EZH2", "Sotos＝IGF2、Beckwith-Wiedemann＝NSD1", "Marfan＝NSD1、Weaver＝FBN1"], "a": 0, "e": "ほかにLoeys-Dietz＝TGFBR1/2、Tatton-Brown-Rahman＝DNMT3A、ホモシスチン尿症＝CBS。内分泌性ではGH産生腫瘍、思春期早発症（成長途中）、甲状腺機能亢進症。", "r": "小児内分泌学 p.86"}, {"v": "", "q": "Beckwith-Wiedemann症候群以外の過成長症候群について正しいのは。", "o": ["Simpson-Golabi-Behmel（GPC3、X連鎖、副乳）、Sotos（NSD1、成人身長は90パーセンタイル内に収まる）、Weaver（EZH2、PRC2の構成因子）", "Sotosは成人期も著明な高身長が続き、Weaverは常染色体潜性でEZH2は関与しない", "Weaverは常染色体潜性で、EZH2は関与しない", "Simpson-Golabi-Behmelは11p15のメチル化異常による"], "a": 0, "e": "Sotos症候群は骨年齢が促進し、幼児期の高身長が成人では目立たなくなる。EZH2はヒストンH3K27のメチル化を触媒する。Kosaki overgrowth症候群（PDGFRB）も新しく同定された。", "r": "小児内分泌学 p.238"}]}, {"id": "gE", "lv": 3, "t": "GH治療の毎日：注射と測定と伝え方", "min": 6, "cats": "GH治療の実際", "src": "症例 p.41-43 ／ 治療 p.1040-1047", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>GH治療を始めることになった6歳の子と家族。ペン型の注射器を手にしたお母さんが「毎日、どこに打てばいいんですか。旅行のときは？」。</div><p>第15話の前に、GH治療の<strong>毎日の実務</strong>をまとめます。治療の成否は、外来の判断だけでなく、家庭で毎日きちんと打てるかに大きく左右されるからです。</p>\n<h3>打ち方の基本</h3>\n<ul><li><strong>週6〜7回</strong>に分けて皮下注。回数が多いほど効果が高い</li>\n<li>部位は臀部・大腿・腹部・上腕の背側から選び、<strong>毎日場所を変える</strong>。同じ場所に打ち続けると脂肪萎縮を起こす。ノートや手帳に記録して回す</li></ul>\n<h3>デバイスの落とし穴</h3>\n<p>GH製剤は、製剤ごとに<strong>1回に打てる最大量と、目盛りの刻み</strong>が違います。体重から計算した量が目盛りで割り切れないときは、2種類の量を組み合わせて、<strong>週あたりの量が下回らない</strong>ようにします。液状か凍結乾燥か、保存の条件も製剤で違います。旅行のときの保存（冷蔵が必要か）も、製剤に合わせて伝えます。</p>\n<p>連日の注射がどうしてもつらい子には、<strong>週1回の製剤（ソマプシタン、ソムアトロゴン）</strong>も選べるようになりました。</p>\n<h3>身長の測り方をそろえる</h3>\n<p>身長は<strong>1日のうちに2 cmほど縮みます</strong>。測る人によっても差が出ます。毎回同じ時間帯・同じ条件で測らないと、治療の効果判定そのものがぶれてしまいます。地味ですが、とても大事なことです。</p>\n<h3>重症例と思春期の工夫</h3>\n<ul><li><strong>重症GHDで著しい低身長</strong>の子では、より多い量を使う考え方もある（−2.5〜−3.5 SDで0.25、−3.5 SD未満で0.35 mg/kg/週）。ただしエビデンスの乏しい領域</li>\n<li>思春期に入ったGHDの子では、<strong>LHRHアナログを併用</strong>すると成人身長が改善したという対照試験がある（伸びる期間を削られない工夫）</li>\n<li>メテノロン（蛋白同化ホルモン）の併用で成人身長が増えた報告もあるが、骨年齢を進める副作用を考えて判断する</li></ul>\n<h3>見通しを伝える</h3>\n<p>成人身長の予測には、TW2法の骨年齢を使う方法や、骨年齢の自動判定（BoneXpert）があります。予測値は家族への説明に役立ちますが、<strong>あくまで推定</strong>であることも一緒に伝えます。長期の安全性については、欧州の大規模調査（SAGhE）で、リスクのある子では注意が要るものの、全体としては安全性が示されています。</p>\n<p>冒頭のお母さんには、打つ場所の回し方と記録、製剤ごとの保存方法、そして「毎日の積み重ねがいちばん効く」ことを伝えます。</p>", "keys": ["週6〜7回、部位を毎日変えて記録する", "製剤ごとに最大量と目盛りが違う。週量を下回らないよう組み合わせる", "身長は1日で2 cm縮む。測定条件をそろえる", "思春期のGHDでLHRHアナログ併用の試みがある", "予測身長は推定であることも伝える"], "upd": "GH製剤のラインナップや週1回製剤の適応は変わることがあります。最新の添付文書で確認してください。", "quiz": [{"v": "", "q": "GH製剤のデバイスについて注意すべきことは。", "o": ["多くは同一規格で、1回最大投与量と目盛りの刻みが共通している", "製剤ごとに1回最大投与量と目盛りの刻みが異なる", "目盛りは多くが0.1 mg刻みである", "溶解操作はすべて不要である"], "a": 1, "e": "目盛りで割り切れないときは2種類の投与量を組み合わせ、0.175 mg/kg/週を下回らないようにする。液状品と凍結乾燥品の別、保存条件も製剤ごとに違う。", "r": "治療 表1・2 p.1041-1042"}, {"v": "", "q": "GH治療のモニタリングで身長を測るときの注意は。", "o": ["午後のほうが姿勢が安定するため、午後に測るのが望ましい", "日中の経過で2 cm程度縮むため、測定条件をそろえる", "日内変動は0.5 cm以内なので、時刻は問わない", "年1回の測定で、年間成長率を評価すれば十分"], "a": 1, "e": "測定者による差も出る。条件をそろえないと、治療効果の判定そのものがぶれる。", "r": "治療 p.1044"}, {"v": "", "q": "思春期のGH分泌不全症例で成人身長を改善しうるとされる併用は。", "o": ["アロマターゼ阻害薬", "LHRHアナログ", "経口エストロゲン", "甲状腺ホルモン"], "a": 1, "e": "GH単独に対し、LHRHアナログ併用が成人身長を改善することが対照試験で示されている。思春期の伸びしろを削られないようにする発想。", "r": "症例 p.41"}]}, {"id": "g9", "lv": 3, "t": "GH治療の実際", "min": 7, "cats": "GH治療の実際", "src": "レクチャー2 p.75 ／ 治療 p.1040-1047 ／ 小児内分泌学 p.195", "vol": "巻の一 成長障害", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>GH治療を始めて1年。身長SDSの改善は +0.2 SDだけでした。お母さんは「量を増やせば伸びますか」と聞きます。</div><p>増やす前に、確かめることがあります。今日はGH治療を「始める・続ける・やめる」までの流れを、外来で迷わないように整理します。</p>\n<h3>用量は適応ごとに違う</h3>\n<div class=\"formula\">GHD 0.175 ／ SGA 0.23〜0.47 ／ 軟骨無形成症 0.35　［mg/kg/週］</div>\n<p>同じGHでも、適応で数字が違います。混ぜないように、適応名とセットで覚えます。週6〜7回に分けて皮下注し、分割が多いほど効くので、最初から週7回で始める考え方もあります。注射部位は毎日変え、記録して回します（同じ場所は脂肪萎縮のもと）。連日の注射がつらい子には、週1回の製剤（ソマプシタン、ソムアトロゴン）も選べるようになりました。</p>\n<h3>始める前の順番</h3>\n<p>汎下垂体機能低下があるときは、<strong>副腎皮質ホルモンと甲状腺ホルモンを先に補ってから</strong>GHを始めます。甲状腺が低いままだとGHは効かず、副腎不全があれば危険です。グルココルチコイドは成長を抑えるので、ヒドロコルチゾンは必要最小限にします。</p>\n<h3>冒頭の問い：反応が悪いとき</h3>\n<p>1年目に期待できる改善は、<strong>身長SDSで +0.5〜0.6 SD</strong>です。届かなければ、次の順に確認します。</p>\n<ul><li>① 投与量が少なくないか（体重が増えて相対的に減っていないか）</li>\n<li>② きちんと打てているか（アドヒアランス）</li>\n<li>③ 栄養状態（IGF-1、亜鉛）</li>\n<li>④ 最後に、診断そのものを見直す</li></ul>\n<p>いきなり倍量にはしません。GH不応症なら、いくら増やしても伸びないからです。IGF-1 SDSの上昇は身長の改善と相関するので、効いているかの手がかりにも、上がりすぎていないかの安全確認にも使えます。なお身長は1日のうちに2 cmほど縮むので、測る時間や条件をそろえないと、効果の判定そのものがぶれます。</p>\n<h3>副作用</h3>\n<p><strong>大腿骨頭すべり症</strong>、<strong>側弯の悪化</strong>、頭蓋内圧亢進による<strong>頭痛</strong>、インスリン感受性の低下があります。歩くときの痛みや足を引きずる様子があれば、整形外科へ紹介します。耐糖能は、リスクのない特発性GHDで糖尿病が明らかに増えることはありませんが、リスクのある子では追います。</p>\n<h3>助成と、終わり方</h3>\n<p>医療費助成の開始基準は身長 −2.5 SD以下で、診断基準（−2.0 SD）より厳しい点は知っておきます。治療をやめる目安は<strong>年間の伸びが1 cm以下</strong>になったときです。</p>\n<p>そして大切なのが<strong>終わり方</strong>です。軽症の子は終了時に分泌が正常とみなされることが多いですが、<strong>重症GHDの子は大人になっても欠乏が続きます</strong>。終了時にGH分泌を再評価し、必要なら<strong>成人のGH治療へ途切れずに移行</strong>します。放っておくと、代謝の異常や筋肉量の低下で生活の質が下がるからです。小児科の治療の「出口」を、成人の医療につなぐところまでが仕事です。</p>", "keys": ["用量：GHD 0.175／SGA 0.23〜0.47／軟骨無形成症 0.35 mg/kg/週", "副腎と甲状腺を先に補充してからGH", "1年目の目標は +0.5〜0.6 SD。届かなければ量→アドヒアランス→栄養→診断", "副作用：大腿骨頭すべり症・側弯・頭痛", "終了は年間1 cm以下。重症例は再評価して成人治療へ移行"], "upd": "GH治療の助成基準や週1回製剤の適応は改訂されることがあります。実際に始めるときは最新の手引きと添付文書で確認してください。", "quiz": [{"v": "", "q": "GH分泌不全性低身長症に対するGHの標準的な投与量は。", "o": ["0.175 mg/kg/週", "0.35 mg/kg/週（Turner症候群と同じ）", "0.35 mg/kg/週", "0.23 mg/kg/週（SGA性低身長症と同じ）"], "a": 0, "e": "これが基準線。SGA性低身長 0.23、軟骨無形成症 0.35 と、適応ごとに別の数字が並ぶので混ぜない。", "r": "レクチャー2 p.75 / 症例 p.43"}, {"v": "複合型下垂体機能低下症の児。ACTHとTSHの分泌不全があり、これからGH治療を始める。", "q": "補充の順序として正しいのは。", "o": ["GHを先に始め、反応をみてから副腎と甲状腺を補う", "副腎皮質ホルモンと甲状腺ホルモンを補充してからGHを投与する", "甲状腺ホルモンを先に始め、次に副腎皮質ホルモン、最後にGH", "3つを同時に開始し、それぞれ少量から増やして副作用をみながら調節する"], "a": 1, "e": "甲状腺機能が低いままではGHの効果が出ず、副腎不全があれば危険。なおグルココルチコイドは成長を抑制するので、ヒドロコルチゾンは必要最小量にとどめる。", "r": "治療 p.1045"}, {"v": "", "q": "GH治療を終了する目安は。", "o": ["年間の身長増加が1 cm以下となった時点", "医療費助成の基準を外れた時点で必ず中止する", "助成基準を外れた時点で必ず中止", "骨年齢が男子14歳・女子12歳に達した時点で一律に終了する"], "a": 0, "e": "骨端線閉鎖後も身長は伸びうる。助成の対象から外れる身長に達しても、臨床的にはそこで即終了とは限らない。", "r": "治療 p.1046"}]}];
const WATER = [{"id": "w1", "lv": 1, "t": "水の司令塔：AVPと浸透圧", "min": 5, "cats": "中枢性尿崩症・診断と負荷試験", "src": "症例1 p.87 ／ 小児内分泌学 p.260-261", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>嘔吐が続く胃腸炎の3歳児。脱水は軽いのに、点滴を始めて半日でNaが128まで下がった。入れたのは、ごく普通の維持液です。</div><p>この子に何が起きたのかを理解するには、体の水の司令塔を知る必要があります。体の水を決めているのは、下垂体後葉から出る<strong>AVP（バソプレシン）</strong>です。AVPは集合管の<strong>V2受容体</strong>に結合し、水チャネルの<strong>AQP2</strong>を作らせて管腔側の膜へ運ばせます。取り込まれた水は基底膜側から血中へ戻ります。</p>\n<h3>上流と下流で分ける</h3>\n<p>AVPが出ないのが<strong>中枢性</strong>、出ているのに受容体やチャネルが応じないのが<strong>腎性</strong>です。この章は全部この「上流か下流か」で整理できます。</p>\n<h3>AVPは浸透圧と「対」で読む</h3>\n<p>AVPは血漿浸透圧がおよそ<strong>283 mOsm/kg</strong>を超えたところから、直線的に上がります。</p>\n<div class=\"formula\">AVP ≒ 0.4 ×（血漿浸透圧 − 283）</div>\n<p>だから「AVPがいくつか」だけでは意味がなく、<strong>そのときの血漿浸透圧</strong>と並べて読みます。正常者と尿崩症の値は重なるので、単独の測定では診断できません。AVPは半減期が短く測りにくいので、海外では等モルに出て安定なcopeptinが使われています。</p>\n<h3>口渇は最後の楯</h3>\n<p>口渇が出はじめる浸透圧は、AVPの閾値より<strong>高い</strong>ところにあります。まずAVPで水を出さないようにし、それでも足りないときに飲水が加わる、という順番です。</p>\n<h3>輸液の落とし穴</h3>\n<p>ここで冒頭の子に戻ります。<strong>悪心は、それだけでAVPを強く上げます</strong>。嘔吐が始まる前から、脱水がなくても、です。AVPが高い状態で低張液を入れると、入れた水が尿に出ていかず体にたまり、Naが薄まります。「脱水が軽いのにNaが下がった」のは、浸透圧ではなく悪心がAVPを出させていたからです。小児の輸液でいちばん実務的な落とし穴で、嘔吐の強い子の輸液では、張度とNaの推移に気を配ります。</p>", "keys": ["AVP→V2受容体→AQP2の合成と膜移送で水を戻す", "中枢性は上流（AVPが出ない）、腎性は下流（応じない）", "AVPは約283 mOsm/kgから直線的に上がる。浸透圧と対で読む", "口渇の閾値はAVPより高い", "悪心だけでAVPは上がる。低張液で低Naになる"], "upd": null, "quiz": [{"v": "", "q": "AVPが集合管で水再吸収を起こす経路として正しいのは。", "o": ["V1受容体を介してAQP1を活性化する", "V2受容体を介してAQP2の合成と管腔側膜への移送を促進する", "V1a受容体を介してホスホリパーゼCを活性化し、AQP1を管腔側膜へ移送する", "基底膜側のAQP3・AQP4を直接開口させ、管腔側のAQP2は関与しない"], "a": 1, "e": "AVP→V2受容体→AQP2の合成と膜移送。管腔側から取り込まれた水は基底膜側の水チャネルから血中へ戻る。中枢性は上流（AVPが出ない）、腎性は下流（受容体・チャネルが応じない）と整理する。", "r": "症例1 p.87"}, {"v": "", "q": "血漿浸透圧とAVP分泌の関係を表す近似式は。", "o": ["AVP = 0.4 ×（血漿浸透圧 − 283）", "AVP = 血漿浸透圧 × 0.1 − 28", "AVP = 2 ×（Na − 140）", "AVP = 2 ×（血清Na − 140）/ 10"], "a": 0, "e": "およそ283 mOsm/kgを閾値として、そこから直線的に上がる。だから「血漿浸透圧がいくつのときのAVPか」を対で読む。単独の値では判断できない。", "r": "小児内分泌学 図3 p.260"}, {"v": "急性胃腸炎で悪心・嘔吐の強い小児。低張液を輸液したところ、血清Naが低下した。", "q": "この機序として最も適切なのは。", "o": ["下痢による腎外性のNa喪失に、輸液のNaが追いつかなかった", "悪心とストレスによりAVPが高値となり、低張液負荷が低Na血症を招いた", "副腎不全の顕在化によるNa喪失と、コルチゾール欠乏による自由水排泄障害", "CSWSによる腎からのNa喪失"], "a": 1, "e": "悪心は嘔吐が始まる前からAVP分泌を強く刺激する。脱水がなくてもAVPが上がるため、低張液を入れると水が抜けない。小児の輸液でもっとも実務的な落とし穴。", "r": "小児内分泌学 p.260"}]}, {"id": "w2", "lv": 1, "t": "多尿を見たら：尿崩症の診断", "min": 6, "cats": "中枢性尿崩症・診断と負荷試験", "src": "症例1 p.86-89 ／ 習慣性多飲 p.93 ／ 治療 p.1078-1083", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>「水ばかり飲んで、おしっこが多いんです」。小学2年の男の子とお母さん。夜も起きてトイレに行くのか、まだ聞いていません。</div><p>多尿・多飲の相談で、まず聞きたいのは<strong>夜中に起きて排尿するかどうか</strong>です。真の多尿は、眠っていても尿が作られ続けるので夜も止まりません。昼間だけ習慣的にたくさん飲んでいる子とは、ここで分かれます。逆に、知的障害のある子では口渇を訴えられず、多飲を伴わない多尿になることもあるので、「飲んでいないから違う」とは言えません。</p>\n<h3>数字の目安</h3>\n<p>多尿は体表面積あたりで見ます。<strong>2,000 mL/m²/日を超える</strong>（強い尿崩症では3,000超）が目安です。乳児はもともと尿が多いので、絶対量では判断しません。新生児は、不感蒸泄（約600 mL/m²）と哺乳量から予想尿量を出して、実際の尿量と比べます。</p>\n<p>外来で最初に確かめる一組があります。<strong>随意尿の浸透圧が600 mOsm/L以上なら、尿崩症は考えにくい</strong>。逆に血清浸透圧300以上なのに尿がそれより薄ければ、尿崩症を疑います。</p>\n<h3>水制限試験とバソプレシン負荷</h3>\n<p>水を止めて、尿浸透圧が頭打ち（プラトー）になるのを見ます。尿浸透圧が血漿を超えて<strong>700 mOsm/kgに達すれば正常</strong>です。低張尿が続けば、水溶性ピトレシン5 U/m²を皮下注します。</p>\n<ul><li>負荷後に尿浸透圧が<strong>100 mOsm/kg以上</strong>上がれば有意。外から入れれば濃縮できる＝<strong>中枢性</strong></li>\n<li>入れてもほとんど上がらない＝<strong>腎性</strong></li></ul>\n<p>この試験のいちばんの弱点は、<strong>プラトーをどこで切るか</strong>です。そこで結論が変わることを意識しておきます。水制限で診断がつけば、高張食塩水負荷は要りません。侵襲の少ない順に積みます。</p>\n<h3>心因性（習慣性）多飲</h3>\n<p>一度に大量ではなく少しずつ何度も飲み、遊びに夢中だと飲まなくなる、という特徴があります。浸透圧が上がりきらないのでAVPも上がらず、中枢性と間違えられやすいです。</p>", "keys": ["夜間に起きて排尿するかを聞く", "多尿は2,000 mL/m²/日超。随意尿600以上なら尿崩症は考えにくい", "水制限で700に達すれば正常。負荷で100以上上がれば中枢性", "弱点はプラトーの取り方。侵襲の少ない順に", "習慣性多飲は少量頻回で、遊ぶと途切れる"], "upd": null, "quiz": [{"v": "", "q": "病歴聴取で尿崩症を疑う手がかりとして最も有用なのは。", "o": ["日中の飲水量だけを聞く", "夜間に起きて排尿するかどうかを聞く", "口渇の有無と、冷水を好むかどうかを聞く", "日中の飲水量が1日2 Lを超えるかどうかを聞く"], "a": 1, "e": "夜間に起きて排尿するかは、真の多尿と昼間の習慣的な多飲を分ける。逆に精神発達遅滞のある児では、口渇を訴えられず多飲を伴わない多尿となることがある。", "r": "症例1 p.88-89"}, {"v": "多尿・多飲で受診。水制限試験でプラトーの尿浸透圧139 mOsm/kg、血漿浸透圧282 mOsm/kg。水性バソプレシン投与後、尿浸透圧は1,018 mOsm/kgまで上昇した。", "q": "診断は。", "o": ["腎性尿崩症（部分型）", "中枢性尿崩症", "習慣性多飲（心因性）", "浸透圧利尿（高血糖）"], "a": 1, "e": "濃縮できないが、外から入れれば濃縮できる＝上流の欠損。血漿浸透圧300 mOsm/kg以上でAVPが0.15 pg/mL未満であることも支持する。", "r": "症例1 p.86-87"}, {"v": "", "q": "水制限試験に続くバソプレシン負荷で、尿浸透圧の「有意な上昇」の目安は。", "o": ["20 mOsm/kg 以上", "50 mOsm/kg 以上", "100 mOsm/kg 以上", "500 mOsm/kg 以上"], "a": 2, "e": "100 mOsm/kg 以上の上昇を有意とする。これを満たさなければ中枢性の裏づけにならない。", "r": "習慣性多飲 症例 p.93"}]}, {"id": "wE", "lv": 1, "t": "飲みすぎの子：習慣性多飲と水中毒", "min": 5, "cats": "中枢性尿崩症・DDAVPの使いかた・低Na血症・SIADH・診断と負荷試験", "src": "習慣性多飲 症例 p.93 ／ p.104 ／ 治療 p.1086-1087", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>2歳の男の子。一日中マグを手放さず、おしっこもとても多い。前の病院では「尿崩症かもしれない」とDDAVPが出されていました。</div><p>多飲・多尿の子の中には、<strong>体が水を欲しがっているのではなく、飲む習慣が先にある</strong>子がいます。心因性（習慣性）多飲です。この子を尿崩症と間違えると、危険なことが起こります。</p>\n<h3>習慣性多飲の姿</h3>\n<ul><li><strong>1〜2歳まで</strong>に始まっていることが多い</li>\n<li>一度にたくさんではなく、<strong>少しずつ何度も</strong>飲む</li>\n<li><strong>遊びに夢中になると、飲むのが途切れる</strong></li>\n<li>夜に起きてまで飲んだり、排尿したりはしにくい（第2話の「夜の排尿」の問いが効く）</li></ul>\n<h3>なぜ尿崩症と間違えやすいか</h3>\n<p>たくさん飲んでいるので、血漿浸透圧が<strong>上がりきらず</strong>、AVPも上がりません。「浸透圧が高くないのにAVPが低い」は一見、中枢性尿崩症のようにも見えます。でもこれは、薄まった体がAVPを出す必要がないだけです。</p>\n<p>見分けるには、<strong>浸透圧を本当に上げてみて</strong>、AVPがきちんと出るかを確かめます。多くは水制限とバソプレシン負荷で結論が出るので、高張食塩水負荷は要りません。それでも分からないときは、高張食塩水で血漿浸透圧を290〜295 mOsm/kgまで上げて確認します。侵襲の少ない順に積みます。</p>\n<h3>冒頭の子に起こりうること</h3>\n<p>習慣性多飲の子にDDAVPを使うと、<strong>飲むのはやめないのに、水を出せなくなります</strong>。体に水がたまり、<strong>低Na血症とけいれん</strong>を起こします。実際に、こうして低Naで運ばれてきた子が報告されています。多尿を心配してのDDAVPの使いすぎと合わせて、<strong>多飲の原因を確かめずにDDAVPを使わない</strong>。これがこの回のいちばんのメッセージです。</p>\n<h3>尿崩症の子が低Naで来たら</h3>\n<p>逆に、尿崩症でDDAVPを使っている子が<strong>低Na血症</strong>で運ばれてきたら、まず疑うのは<strong>医原性</strong>です。最初に確かめるのは、<strong>DDAVPの量</strong>と、<strong>効果が切れる時間があったか</strong>。第6話（DDAVPの使いかた）の原則がここで生きてきます。</p>", "keys": ["習慣性多飲：1〜2歳までに始まり、少量頻回、遊ぶと途切れる", "浸透圧が上がらずAVPも上がらないので中枢性と紛らわしい", "浸透圧を上げてAVPが出るかで見分ける。侵襲の少ない順に", "習慣性多飲にDDAVPを使うと低Na・けいれん", "DDAVP使用中の低Naは、まず量と切れる時間を確認"], "upd": null, "quiz": [{"v": "", "q": "心因性多飲症の児の特徴として本書が挙げているのは。", "o": ["一度に大量を飲まず少量頻回に飲み、遊びに夢中になっていると多飲が途切れることがある", "家族歴が濃厚で、同様の症状をもつ血縁者がいる", "夜間に必ず起きて飲み、一度に大量を飲んで飲水の間隔が長く、遊びに夢中でも飲水が途切れない", "日中は飲まず、夜間に集中して飲む"], "a": 0, "e": "1〜2歳までに発症していることが多い。血漿浸透圧が上がりきらないためAVPも上昇せず、中枢性尿崩症と誤解されやすい。高張食塩水負荷で血漿浸透圧を290〜295 mOsm/kgまで上げて確認する。", "r": "治療 p.1086-1087"}, {"v": "習慣性多飲と判明した児に、以前の医療機関でDDAVPが投与されていた。", "q": "起こりうる合併症は。", "o": ["高ナトリウム血症による高張性脱水と、それに伴うけいれん", "水中毒による低ナトリウム血症とけいれん", "高カリウム血症による不整脈", "高ナトリウム血症による脱水とけいれん"], "a": 1, "e": "飲水は続くのに自由水が出せなくなる。多尿を心配してのDDAVP過剰投与とあわせて、実際に低Na血症を来した症例が報告されている。多飲の原因を確かめずに投与しない。", "r": "p.104"}, {"v": "", "q": "中枢性尿崩症の患者が低ナトリウム血症で搬送されたとき、最初に確認すべきなのは。", "o": ["コルチゾール補充が足りているか（副腎不全による低Na）", "DDAVPの投与量と、効果が切れる時間があったか", "甲状腺機能が低下していないか", "腎機能が悪化していないか"], "a": 1, "e": "医原性がまず疑わしい。低Na血症で見つかった症例には、DDAVP過剰投与と、習慣性多飲へのDDAVP投与が含まれていた。", "r": "p.104 / p.96"}]}, {"id": "w3", "lv": 2, "t": "中枢性尿崩症の原因を追う", "min": 6, "cats": "中枢性尿崩症", "src": "症例1 p.87-90 ／ 小児内分泌学 p.264-269", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>2年前に「特発性」の中枢性尿崩症と診断された9歳の子。DDAVPでよく落ち着いていて、初診時のMRIは正常でした。今日の外来、何をしますか。</div><p>答えは、<strong>原因を追い続けること</strong>です。症状が落ち着いていても、初回のMRIが正常でも、「特発性」はこの章でいちばん慎重に扱うべき診断名です。数か月〜数年たってから、隠れていた原因が姿を現すことがあるからです。</p>\n<h3>初回のMRIが正常でも終わらない</h3>\n<p>特発性とされた子から、あとで<strong>胚細胞腫瘍</strong>や<strong>リンパ球性漏斗下垂体炎</strong>が見つかることがあります。漏斗下垂体炎は初期の茎の腫大が消えていくので、時期を逃すと診断できません。画像と腫瘍マーカーの追跡を続けます。</p>\n<p>マーカーは、絨毛癌や卵黄嚢腫瘍の成分があればhCGやAFPが上がりますが、純粋なジャーミノーマでは陰性です。<strong>髄液の胎盤性アルカリホスファターゼ（PLAP）</strong>が役に立ちます。</p>\n<h3>並んだら器質性を疑う組み合わせ</h3>\n<p>器質性の病変がなければ、中枢性尿崩症に<strong>GH分泌不全が合併することはまれ</strong>です。両方そろったら、視床下部・下垂体の器質性病変を探します。</p>\n<h3>画像のbright spot</h3>\n<p>後葉のT1高信号はAVPの貯留を映しています。尿崩症ではこれが消えます。ただし家族性では残っていることもあるので、消えていないことは否定になりません。</p>\n<h3>家族性（AVP遺伝子異常）</h3>\n<p>常染色体優性で、<strong>生まれたときは正常、乳幼児期以降に発症</strong>します。異常な蛋白が小胞体で折りたためずにストレスを起こし、AVP細胞が少しずつ脱落していくためです。</p>\n<h3>隠れていた尿崩症</h3>\n<p>ACTH分泌不全があると、コルチゾール不足で自由水が出せず、多尿が目立ちません。<strong>ヒドロコルチゾンを始めると多尿が出てきます</strong>（仮面尿崩症）。補充の前に家族へ伝えておくと慌てずにすみます。</p>\n<h3>手術のあとの三相性</h3>\n<p>下垂体手術後は、①尿崩症が数日、②5〜7日目に<strong>AVPが漏れ出してSIADH様</strong>になり、③永続的な尿崩症、と進むことがあります。②で治ったと思ってDDAVPを続けると水中毒になります。</p>", "keys": ["特発性に安住しない。胚細胞腫瘍・漏斗下垂体炎を追跡", "ジャーミノーマは髄液PLAPが手がかり", "尿崩症＋GH分泌不全なら器質性を疑う", "家族性は優性で、乳幼児期以降に発症", "コルチゾール補充で隠れた尿崩症が出てくる", "術後の三相性：第2相はSIADH様"], "upd": null, "quiz": [{"v": "9歳男児。特発性中枢性尿崩症としてDDAVPで加療中。頭部MRIは初診時正常だった。", "q": "経過観察で最も重要なのは。", "o": ["初回MRIが正常なら器質性は否定でき、以後の画像は要さない", "胚細胞腫瘍が後から顕在化しうるため、画像と腫瘍マーカーの追跡を続ける", "初回MRIが正常であれば器質性病変は否定でき、以後の画像検査は3年ごとで十分である", "DDAVP量が安定していれば、受診は年1回でよい"], "a": 1, "e": "特発性と診断された症例から後に胚細胞腫瘍やリンパ球性漏斗下垂体炎が判明することがある。初回画像の正常は除外にならない。髄液の胎盤性アルカリホスファターゼが診断に有用とされる。", "r": "症例d p.90 / p.88"}, {"v": "中枢性尿崩症の児。ACTH分泌不全を合併しており、多尿が目立たなかった。", "q": "ヒドロコルチゾンを開始したときに起こるのは。", "o": ["血糖が低下し、低血糖発作を起こす", "仮面尿崩症が解けて多尿が顕在化する", "低カリウム血症と高血圧が出現する", "多尿が軽快し、DDAVPを減量できる"], "a": 1, "e": "コルチゾール不足では自由水が排泄できないため多尿にならない。補充の前にこの可能性を家族へ伝えておくと、慌てずにすむ。", "r": "小児内分泌学 p.265 / 治療 p.1078"}, {"v": "", "q": "下垂体手術後にみられる三相性反応の第2相の機序は。", "o": ["残存した神経下垂体細胞からのAVP分泌が一時的に回復する", "変性した神経下垂体細胞からAVPが漏出し、SIADH様の抗利尿相となる", "腎のV2受容体の感受性が代償的に亢進し、尿が濃縮される", "術後の輸液過剰による希釈性低Na血症で、AVPは関与しない"], "a": 1, "e": "第1相の尿崩症が数日続いたのち、5〜7日で尿量が減り尿浸透圧が上がる。ここで治ったと誤解してDDAVPを続けると水中毒になる。その後に第3相の永続的尿崩症が来る。", "r": "小児内分泌学 p.264 / 治療 p.1077"}]}, {"id": "wC", "lv": 2, "t": "知っておきたい尿崩症：症候群と妊娠", "min": 5, "cats": "中枢性尿崩症・診断と負荷試験・DDAVPの使いかた", "src": "p.94 ／ 小児内分泌学 p.167-168, 268-269 ／ 治療 p.1081", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>尿崩症で通院している10歳の子。最近、目が見えにくいと言い、糖尿病も指摘されました。</div><p>今日は、まれだけれど知っていると見逃さない尿崩症を3つ取り上げます。</p>\n<h3>Wolfram症候群（DIDMOAD）</h3>\n<p>冒頭の子です。<strong>尿崩症（DI）・糖尿病（DM）・視神経萎縮（OA）・難聴（D）</strong>の頭文字をとってDIDMOADと呼ばれます。日本人では約70%で<strong>WFS1</strong>（4番染色体短腕）に変異が見つかります。WFS1が壊れると<strong>小胞体ストレス</strong>で細胞が変性していく、という機序です。</p>\n<p>家族性の中枢性尿崩症（AVP遺伝子異常）も、小胞体で蛋白が折りたためずに細胞が脱落していく病気でした（第4話）。<strong>小胞体のストレスで細胞が少しずつ失われる</strong>という共通の筋道があります。Wolfram症候群は複数の項目のうち2つ以上で診断し、予後は不良で、腎不全に至ることが多いとされます。尿崩症の子に糖尿病や視力の低下が加わったら、思い出します。</p>\n<h3>全前脳胞症</h3>\n<p>脳の正中の形成異常に、視床下部・下垂体の異常が並ぶことがあります。全前脳胞症では、<strong>尿崩症とSIADHのどちらも</strong>起こりえます。巻の一で「正中構造の異常は下垂体の形成異常のサイン」と見ましたが、水の調節にも同じことが言えます。</p>\n<h3>妊娠中の尿崩症</h3>\n<p>思春期の患者が大人になったときのために、知っておきたい話です。胎盤は<strong>バソプレシナーゼ</strong>という酵素を出して、AVPを分解します。もともとAVPの分泌が少し足りない人は、妊娠中にそれが表に出て、<strong>一過性の尿崩症</strong>になることがあります。分娩後によくなりますが、次の妊娠でまた起こりえます。</p>\n<p>妊娠中は、ほかにも腎血流が増え、浸透圧の閾値が約10 mOsm/kg下がるので、多飲多尿になりやすい時期です。</p>\n<h3>DDAVPは妊娠中も使える</h3>\n<p>DDAVPは、N末端が化学的に変えてあるので<strong>バソプレシナーゼに分解されにくい</strong>のです。だから妊娠中も治療に使えます。もともと中枢性尿崩症の人が妊娠したら、血漿浸透圧が下がることを踏まえて必要に応じて量を調節し、水中毒を避けるために意識的な多飲は控えるよう伝えます。</p>\n<p>尿崩症の子が大きくなって、妊娠を考える年齢になったとき、先にこの話をしておくと安心につながります。</p>", "keys": ["Wolfram（DIDMOAD）：尿崩症・糖尿病・視神経萎縮・難聴、WFS1", "小胞体ストレスで細胞が失われる筋道は家族性尿崩症と共通", "全前脳胞症では尿崩症もSIADHも起こりうる", "妊娠中は胎盤のバソプレシナーゼでAVPが分解され、一過性尿崩症が出る", "DDAVPは分解されにくく妊娠中も使える"], "upd": null, "quiz": [{"v": "", "q": "Wolfram症候群（DIDMOAD）の責任遺伝子と病態は。", "o": ["WFS1（4番染色体短腕）、小胞体ストレスによる細胞変性", "WFS1（4番染色体）、ミトコンドリアDNAの欠失による細胞変性", "WFS1（4番染色体）、ミトコンドリア機能異常", "AVP遺伝子（20番染色体）、神経下垂体の変性"], "a": 0, "e": "日本人では約70%でWFS1に変異が同定される。尿崩症・糖尿病・視神経萎縮・難聴の4徴で、診断基準は複数項目のうち2つ以上を満たすこと。予後は不良で腎不全に至ることが多い。", "r": "小児内分泌学 p.268-269"}, {"v": "", "q": "全前脳胞症（holoprosencephaly）に合併しうる水代謝異常は。", "o": ["尿崩症およびSIADH", "腎性尿崩症のみ（視床下部は保たれる）", "低カリウム血症と代謝性アルカローシス", "高カルシウム血症と腎石灰化"], "a": 0, "e": "正中構造の形成異常に視床下部下垂体系の異常が並ぶ。尿崩症とSIADHのどちらも起こしうる。", "r": "p.94 / 文献7"}, {"v": "", "q": "妊娠中に一過性尿崩症が生じる機序は。", "o": ["胎盤由来のバゾプレシナーゼ（シスチンアミノペプチダーゼ）がAVPを分解し、潜在的なAVP分泌不全が顕在化する", "妊娠で血漿浸透圧の閾値が上がってAVP分泌が抑えられ、胎児のAVPが母体に移行して受容体を脱感作する", "胎児のAVPが母体に移行して受容体を脱感作する", "妊娠でGFRが低下し、尿量が減る"], "a": 0, "e": "妊娠中はGFRが増え、浸透圧閾値が約10 mOsm/kg下がって多飲多尿になりやすい。DDAVPはバゾプレシナーゼに分解されないため治療に使える。分娩後に軽快するが、次の妊娠で再発しうる。", "r": "小児内分泌学 p.167-168"}]}, {"id": "w4", "lv": 2, "t": "DDAVPの使いかた", "min": 5, "cats": "DDAVPの使いかた・新生児・複合型", "src": "症例1 p.91 ／ 小児内分泌学 p.266-267 ／ 治療 p.1079-1081", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>DDAVPを点鼻している子のお母さん。「おしっこが出始めたら次をさしているので、ずっと効いています」。一見よさそうなこの使い方、実は危ういのです。</div><p>このお母さんの使い方では、DDAVPが一日中切れません。DDAVPでいちばん大事な原則は一つです。<strong>少なくとも1日1回は、効果が切れる時間をつくる</strong>。切れる時間がないと、飲んだ水が自由水として抜ける時間がなくなり、少しずつ体に水がたまって水中毒（低Na血症）に向かいます。内因性のAVPがほとんどなく、外から入れたDDAVPに完全に頼っている子ほど、この原則が命綱になります。</p>\n<h3>「切れた」は排尿で判断する</h3>\n<p>感覚ではなく、<strong>2〜3秒で終わらない、しっかり続く排尿</strong>が出たら切れたサインです。切れたのを確認してから次を使う、というルールにします。</p>\n<h3>増やしても効きは強くならない</h3>\n<p>DDAVPの効果は一定量で頭打ちになり、それ以上は<strong>作用時間が延びるだけ</strong>です。効きが足りないと思って漫然と増やすと、切れる時間が消えて水中毒に近づきます。必要量は子どもによって大きく違います。</p>\n<h3>剤形の使い分け</h3>\n<ul><li><strong>点鼻スプレー</strong>：2.5 μg/0.1 mL、0.5〜10 μg/回を1日1〜3回。風邪や鼻閉で吸収が変わる。1噴霧の量が多いので、1回5 μg以上は咽頭に流れてしまい向かない。</li>\n<li><strong>口腔内崩壊錠（ミニリンメルト）</strong>：60・120・240 μg。水なしで飲め、鼻の影響を受けない。嚥下が難しい子は直前に1/2〜1/4に切る。</li></ul>\n<h3>乳児と周術期</h3>\n<p>新生児・乳児は自分で飲む量を調節できないので、<strong>Naの日内変動が大きくなります</strong>。分割投与やミルク量の調整、体重とNaの推移で詰めていきます。周術期のように体液が大きく動く場面では、半減期が数分のAVP持続点滴で尿量を見ながら調節します。</p>\n<h3>使ってはいけない相手</h3>\n<p>習慣性多飲の子にDDAVPを使うと、飲み続けるのに水が出せず、<strong>低Na血症とけいれん</strong>を起こします。多飲の原因を確かめずに使わないことです。</p>", "keys": ["1日1回は必ず切れる時間をつくる", "切れたサインは、しっかり続く排尿", "増量で効きは強くならず、作用が長くなるだけ", "点鼻は鼻閉に弱く、5 μg以上は不向き。OD錠は安定", "習慣性多飲に使うと低Na・けいれん"], "upd": null, "quiz": [{"v": "", "q": "DDAVP治療の原則として本書が強調しているのは。", "o": ["夜間のみ投与し、日中は自由飲水で対応する", "少なくとも1日1回は効果が切れる時間をつくる", "効果が切れたら直ちに追加し、常時効いている状態を保つ", "効果が切れたら直ちに追加する"], "a": 1, "e": "切れる時間がないと自由水が抜けず水中毒に向かう。とくに内因性AVP分泌不全が重度で外因性に完全依存している症例で重要。", "r": "症例1 p.91"}, {"v": "", "q": "DDAVPが「切れた」と患者・家族に判断させるサインは。", "o": ["体重が前日より1 kg以上増えていること", "2〜3秒で終わらない、数秒続く排尿や一定量以上の尿が出ること", "口渇を強く感じ、冷たい水を欲しがるようになること", "尿の色が濃くなって量が減り、体重が前日より1 kg以上増えていること"], "a": 1, "e": "感覚ではなく排尿の実際で判断させる。切れたのを確認してから次を打つ、というルールにする。", "r": "症例1 p.91"}, {"v": "", "q": "デスモプレシンの用量反応について正しいのは。", "o": ["用量を増やすと効果の強さが際限なく増す", "一定量でプラトーとなり、それ以上は作用時間が長くなる", "用量を増やすと効果の強さが際限なく増し、作用時間は変わらない", "少量では無効で、閾値を超えると急に効く"], "a": 1, "e": "効きが足りないときに漫然と増やしても、切れる時間が消えるだけで水中毒に近づく。必要量は症例ごとに大きく異なる。", "r": "小児内分泌学 p.266"}]}, {"id": "w8", "lv": 1, "t": "夜尿症とデスモプレシン", "min": 5, "cats": "中枢性尿崩症・DDAVPの使いかた", "src": "治療 p.54-56 ／ 小児内分泌学 p.293-294", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>小学3年の子の夜尿。「そのうち治るよ」と言いそうになったとき、ちょっと待ってください。</div><p>夜尿は多くの家族にとって切実な悩みで、本人の自信にも関わります。「そのうち治る」と流さず、きちんと治療の道筋を示すことが大切です。夜尿症でもデスモプレシンを使いますが、位置づけは尿崩症とまったく違います。中枢性尿崩症では<strong>補充療法</strong>、夜尿症では<strong>薬理学的な対症療法</strong>です。</p>\n<h3>治療の組み立て</h3>\n<p>まず生活指導（夕方以降の水分を控える、寝る前の排尿、冷えを避ける）。改善しなければ<strong>デスモプレシンか夜尿アラーム</strong>で始め、効果が少なければもう一方へ替え、それでも足りなければ併用します。三環系抗うつ薬は心毒性があり、第一選択ではありません。</p>\n<h3>デスモプレシンの使い方</h3>\n<p>ミニリンメルトOD錠<strong>120 μgを就寝30〜60分前</strong>に4週、改善がなければ240 μgを3か月。夕食から朝までの飲水はコップ1杯程度にし、飲水が多い日や夕食後すぐ寝る日は使いません。まれに水中毒が起きるからです。</p>\n<h3>アラームの本当の効き方</h3>\n<p>鳴って起きることを学ぶ、と考えがちですが、実際は多くの子で<strong>夜の膀胱容量が増えて</strong>、朝まで出なくなります。本人と家族のやる気が要ります。</p>\n<h3>説明の仕方</h3>\n<p>「そのうち治る」と安易に言いません。有効性は30〜70%で、軽症で3〜6か月、中等症以上では1〜3年かかることもあります。効いてもすぐやめず、同じ量で続けてから漸減します。</p>\n<h3>見逃してはいけないもの</h3>\n<p>夜尿の裏に<strong>中枢性尿崩症</strong>が隠れていることがあります。視床下部・下垂体茎の胚細胞腫瘍などでは、尿崩症が出てから数か月〜数年たって病変が見えることがあるので、<strong>最初のMRIが正常でも繰り返し撮ります</strong>。胚腫は放射線感受性が高く、CTの被曝で小さな病変が消えてしまうこともあります。</p>", "keys": ["夜尿症のデスモプレシンは対症療法", "生活指導の上でデスモプレシンかアラーム、だめなら交代・併用", "120 μgを就寝30〜60分前、夜の飲水はコップ1杯", "アラームは膀胱容量を増やして効く", "尿崩症（胚細胞腫瘍）を疑えばMRIを繰り返す"], "upd": null, "quiz": [{"v": "", "q": "夜尿症の治療アルゴリズムで、第一選択として位置づけられているのは。", "o": ["生活指導（夕方以降の水分制限、就寝前排尿、冷えの回避）のうえで、夜尿アラーム療法またはデスモプレシン（ミニリンメルトOD錠）", "三環系抗うつ薬の単独投与（心毒性はまれで、アラームより確実に効くため）", "抗コリン薬の単独投与", "膀胱訓練のみで薬物は用いない"], "a": 0, "e": "アラームは覚醒を促して朝まで排尿しないよう学習させるもので、本人・家族のモチベーションが要る。効果不十分なら両者の併用。三環系抗うつ薬は心毒性があり第一選択ではない。下部尿路症状を伴う例は抗コリン薬や専門医へ。", "r": "小児内分泌学 p.293-294"}, {"v": "", "q": "夜尿症に対するミニリンメルト®OD錠の処方例として正しいのは。", "o": ["120 μgを就寝30〜60分前に4週、改善傾向がなければ240 μgを3か月", "60 μgを朝食後に4週→無効なら点鼻スプレー2.5協和に切り替え3か月→無効ならアラーム", "240 μgを就寝直前に投与し飲水制限は不要→無効なら三環系抗うつ薬を追加し6か月", "120 μgを1日2回（朝・就寝前）、6か月継続後に3か月かけて漸減中止→再発なら再開"], "a": 0, "e": "240 μgで改善傾向があればさらに3か月くらい使用し、改善傾向のない場合にはアラーム療法に切り替える。添付文書には就寝前投与と記載されているが最近では使用後の血中濃度上昇時間を考慮して就寝30〜60分前に投与する傾向にある。添付文書には尿浸透圧あるいは尿比重の低下（起床時尿浸透圧の平均値800 mOsm/L以下あるいは尿比重の平均値1.022以下）に伴う夜尿症に対して使用すると記載されているが海外では考慮せずに使用されている。ごくまれに水中毒（低Na血症、頭痛、浮腫など）があるので、夕食時から朝起きるまではコップ1杯程度の飲水にし、夕食後すぐに寝るときや飲水量が多いときには使用を控える。ミニリンメルト®OD錠60 μgとデスモプレシン・スプレー2.5協和の保険適用は中枢性尿崩症のみ。夜尿症への使用は補充療法ではなく薬理学的療法。", "r": "治療 p.54-55"}, {"v": "", "q": "夜尿症で中枢性尿崩症の原因腫瘍（胚腫など）を疑う場合の画像検査の注意点として正しいのは。", "o": ["最初のMRIで異常なしでも年余にわたり繰り返しMRIを実施する", "最初のMRIで異常なしなら以後の画像検査は不要で、尿崩症の治療のみ継続", "胚腫は放射線感受性が低いため造影CTで十分で、MRIは不要とされる", "造影CTを年1回行い、異常があればMRIを追加して経過をみる"], "a": 0, "e": "視床下部-下垂体茎-下垂体部の腫瘍（germ cell tumor・germinoma、胚細胞腫の約70%が胚腫、頭蓋咽頭腫など）、リンパ球性漏斗下垂体炎などが疑われる場合、尿崩症の出現から数か月〜数年後に病変が明らかになる場合もある。胚腫は放射線感受性が非常に高いので微細な病変（occult germinoma）はCT検査で消失する。安易に「そのうちに治るから様子をみましょう」と言わない。効果があってもすぐに終了するのではなく一定期間は同剤・同量の治療を継続しその後に漸減し終了する。3〜6か月間治療しても改善傾向がないようなら夜尿症専門医に相談。ほかには軽度の部分型尿崩症、心因性多飲症、腎性尿崩症、糖尿病、Basedow病、慢性腎不全、慢性便秘、尿管異所開口（特に女児の尿管腟開口：尿意を感じての排尿はあるが毎日の持続性夜尿と昼間遺尿、重複腎盂尿管、片方の腎低形成などを伴う）なども鑑別する。", "r": "治療 p.55-56"}]}, {"id": "w5", "lv": 2, "t": "腎性尿崩症", "min": 6, "cats": "腎性尿崩症", "src": "症例a・b p.98-105 ／ 小児内分泌学 p.272-275 ／ 治療 p.1083-1085", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>日齢22の男の子が発熱で入院。Naは156、血漿浸透圧304なのに、尿浸透圧は118〜158と薄い。AVPを測ると55 pg/mLと高値でした。</div><p>冒頭の数字を並べ直すと、病態が見えてきます。血漿は濃いのに尿は薄い、つまり濃縮できていません。そしてAVPは高い。<strong>上流は必死にAVPを出しているのに、下流の腎が応じていない</strong>。腎性尿崩症です。新生児期の<strong>原因のはっきりしない発熱と高Na血症</strong>は、腎性尿崩症の典型的な入り口です。赤ちゃんは口渇を訴えられないので、気づいたときには高Naになっています。</p>\n<h3>原因と遺伝</h3>\n<p>最も多いのは<strong>X連鎖のAVPR2（V2受容体）異常</strong>で、AQP2の異常は少数です。V2受容体の変異の多くは、小胞体で正しく折りたためずに膜まで届かない、という機序です。X連鎖でも、X不活化の偏りで<strong>女性に症状が出ることがあります</strong>。女性だから否定、はできません。</p>\n<h3>負荷試験</h3>\n<p>水溶性バソプレシン0.1 U/kgを皮下注しても、尿浸透圧が<strong>300 mOsm/kgを超えない</strong>のが腎性です。部分型で一定の上昇があれば、DDAVPが効く見込みがあります。負荷試験は治療の見通しにも使えます。</p>\n<h3>治療は「水を確保して、溶質を減らす」</h3>\n<p>十分な水分、<strong>塩分制限</strong>、<strong>サイアザイド</strong>（ヒドロクロロチアジド2〜4 mg/kg/日）が基本です。インドメタシンは2018年に保険適用になり、サイアザイドとの併用で尿量を減らせます。溶質が減れば、同じ最大尿浸透圧でも必要な尿量が減る、という理屈です。ただし小児で極端な制限は発育を損ねます。</p>\n<h3>救急で間違えない</h3>\n<p>高Na性脱水で運ばれてきても、<strong>生理食塩水は入れません</strong>。最大尿浸透圧100の子に生食1 Lを入れると、その溶質を捨てるのに3 L以上の尿が要り、脱水が悪化します。必要なのは自由水で、<strong>5%ブドウ糖液</strong>を尿量をわずかに上回る速さで入れます。濃縮できないので、脱水でも尿は減りません。<strong>尿が出ているから大丈夫、とは読めません</strong>。</p>\n<p>診断がついたあと、何年も付き合っていく中でいちばん守るべきものは、意外にも腎臓ではなく<strong>膀胱</strong>です。それは次の回で。家族には「夜に具合が悪くなったら朝まで待たずに受診」と、具体的に伝えておきます。</p>", "keys": ["新生児の発熱＋高Na、AVP高値なら腎性を考える", "最多はX連鎖AVPR2。女性にも出うる", "バソプレシン0.1 U/kgで300を超えなければ腎性", "治療は水・塩分制限・サイアザイド", "高Na性脱水には生食ではなく5%ブドウ糖", "尿量で脱水を判断できない"], "upd": null, "quiz": [{"v": "日齢22の男児。発熱で入院。Na 156 mEq/L、血漿浸透圧304 mOsm/kg、尿浸透圧118〜158 mOsm/kg、AVP 55.3 pg/mL。", "q": "診断は。", "o": ["中枢性尿崩症", "腎性尿崩症", "習慣性多飲", "SIADH"], "a": 1, "e": "高張なのに希釈尿、しかもAVPは高い。上流は働いていて下流が応じていない。新生児期の原因不明の発熱と高Na血症は、腎性尿崩症の典型的な入り口。", "r": "症例a p.98-99"}, {"v": "", "q": "腎性尿崩症の治療として適切な組み合わせは。", "o": ["高用量DDAVP・塩分負荷・ループ利尿薬", "十分な水分投与・塩分制限・サイアザイド系利尿薬", "水分制限・塩分制限・サイアザイド系利尿薬", "高用量DDAVP・塩分負荷・ループ利尿薬（フロセミド）"], "a": 1, "e": "入れる水を確保し、溶質負荷を減らす。症例では200〜300 mL/kg/日の水分投与を要した。", "r": "症例a・b p.98-101 / p.105"}, {"v": "最大尿浸透圧100 mOsm/Lの腎性尿崩症の乳児が、高ナトリウム性脱水で搬送された。", "q": "輸液として選ぶべきなのは。", "o": ["生理食塩液（循環血液量を速やかに戻すため）", "5%ブドウ糖液（尿量をわずかに超える速度で）", "1/2生理食塩液（Naを緩やかに下げるため）", "乳酸リンゲル液（アシドーシスも同時に補正できるため）"], "a": 1, "e": "生理食塩液（308 mOsm/L）1,000 mLを入れると、その溶質を捨てるのに3,000 mL以上の排尿が要り、脱水が悪化する。必要なのは自由水。血清Naは1時間あたり0.5 mEq/Lを上回らない速度で下げる。", "r": "治療 p.1084-1085"}]}, {"id": "wD", "lv": 2, "t": "腎性尿崩症を長く診る", "min": 6, "cats": "腎性尿崩症", "src": "症例b p.100-105 ／ 小児内分泌学 p.272-275 ／ 治療 p.1083-1085", "vol": "巻の二 水代謝異常", "body": "<div class=\"scene\"><span class=\"scene-tag\">外来の一場面</span>腎性尿崩症の12歳の男の子。最近、学校でトイレに行くのをがまんしているらしい。超音波を撮ると、膀胱が大きく広がり、腎盂も少し拡張していました。</div><p>前の回で、腎性尿崩症の診断と救急の対応を見ました。今日は、<strong>何年も付き合っていく中で守るもの</strong>の話です。腎性尿崩症で腎不全に至る、いちばん大事な経路は、腎臓そのものではなく<strong>膀胱</strong>にあります。</p>\n<h3>ため込むと、腎が壊れる</h3>\n<p>毎日大量の尿が出るのに、<strong>排尿の回数が少ない</stro
