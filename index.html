095、<strong>90%</strong>信頼区間 (−0.027, 0.287)。やはり0を含むので、抗凝固薬に効果があるとも害があるとも言えない、という結論です。</p>\n<p>2つの例に共通するのは、<strong>1群40人前後では、10%台の差を確定させるのは難しい</strong>ということ。これが第44話の伏線です。</p>", "keys": ["2群の差の点推定はp̂₁−p̂₂", "条件：群内・群間の独立性（ランダム化で満たす）と、両群それぞれの成功・失敗条件", "SE＝√(p₁(1−p₁)/n₁＋p₂(1−p₂)/n₂)。分散を足してルート", "先輩の研究：差0.119、SE 0.132、95% CI (−0.14, 0.38)。0を含む", "比較群の揺れが加わるので、1群だけのSEより大きくなる"], "upd": null, "quiz": [{"v": "", "q": "2群の割合の差の標準誤差の作り方として正しいのは。", "o": ["各群のSEを足す", "各群のSEを引く", "各群のSEの二乗を足してルートをとる", "大きい方のSEを使う"], "a": 2, "e": "差の分散は各分散の和（第24話）。SEは足さず、二乗して足してルート。", "r": "OpenIntro 6章"}, {"v": "", "q": "差の95%信頼区間が (−0.14, 0.38) だった。結論は。", "o": ["治療群が有意に良い", "比較群が有意に良い", "0を含むので、どちらが良いとも言えない", "差は0である"], "a": 2, "e": "区間が0をまたぐので、差がプラスともマイナスとも言えない。差が0だとも言っていない。", "r": "OpenIntro 6章"}, {"v": "", "q": "2群の割合の差に正規分布を使う条件で、成功・失敗条件の確認方法は。", "o": ["2群を合わせて10以上", "両群それぞれで成功・失敗が10以上", "大きい方の群だけ確認", "確認不要"], "a": 1, "e": "各群で別々に成功と失敗の数を確認する。", "r": "OpenIntro 6章"}], "course": "stat"}, {"id": "s43", "lv": 2, "t": "2群の割合の差：検定とプール比率", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §6.2.3", "vol": "統計 第6章 割合の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>教授：「で、p値は？」。第5章では比較群を固定の値として扱いました。今度は正式に2群を比べます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>2群を比べる検定では、比較群の揺れも入れる。先輩の研究を正しく計算すると<strong>p＝0.37</strong>。</div><h3>仮説</h3>\n<div class=\"formula\">H₀：p₁ − p₂ ＝ 0　　Hₐ：p₁ − p₂ ≠ 0</div>\n<h3>プール比率</h3>\n<p>H₀ が真なら2群の割合は<strong>同じ</strong>です。その共通の割合の一番よい推定は、<strong>2群を合わせた割合</strong>。これを<strong>プール比率</strong>と呼びます。</p>\n<div class=\"formula\">p̂pool ＝ (両群の成功数の合計) ／ (両群の人数の合計)</div>\n<p>第5章で「検定では p̂ ではなく p₀ を使う」と学んだのと同じ理屈です。H₀ の下で計算するので、成功・失敗条件の確認にも SE の計算にも <strong>p̂pool</strong> を使います。</p>\n<div class=\"formula\">SE ＝ √( p̂pool(1−p̂pool) × (1／n₁ ＋ 1／n₂) )</div>\n<h3>先輩の研究で計算する</h3>\n<ul><li>p̂pool ＝ (18＋12)／(31＋26) ＝ 30／57 ≈ <strong>0.526</strong></li>\n<li>SE ＝ √(0.526×0.474×(1/31＋1/26)) ≈ <strong>0.133</strong></li>\n<li>Z ＝ 0.119／0.133 ≈ <strong>0.90</strong></li>\n<li>両側 p値 ≈ <strong>0.37</strong></li></ul>\n<p>第5章で比較群を固定値として計算したときは p≈0.18 でした。比較群の不確かさを正しく入れると、<strong>p値は約2倍</strong>になります。固定値扱いは、不確かさを<strong>過小評価</strong>していたわけです。教授への正式な答えは「p＝0.37。偶然で十分説明できる差です」。</p>\n<h3>教科書のマンモグラフィ研究</h3>\n<p>約9万人の女性を、マンモグラフィ群と非マンモグラフィの検診群に<strong>ランダムに</strong>割り付け、30年間の乳がん死亡を比較した研究です。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>乳がん死亡</th><th>総数</th></tr>\n<tr><td>マンモグラフィ</td><td>500</td><td>44,925</td></tr>\n<tr><td>対照</td><td>505</td><td>44,910</td></tr></table></div>\n<p>p̂pool＝0.0112、差＝−0.00012、SE＝0.00070、Z＝−0.17、<strong>p＝0.87</strong>。死亡率の差は偶然で十分に説明できます。</p>\n<p>教科書はここで、結論の読み方を丁寧に添えています。</p>\n<ul><li>棄却できない＝益とも害とも言える十分な証拠がない</li>\n<li>仮に益や害があっても、データは<strong>その効果は大きくない</strong>ことを示唆している</li>\n<li><strong>費用</strong>の違いも判断材料になる</li>\n<li>著者らは<strong>過剰診断</strong>（一生症状を出さないがんを見つけて治療してしまう）も報告している</li></ul>\n<p>統計の結論は出発点で、医療の判断は<strong>費用、害、最新のエビデンス</strong>を合わせて行う、という締めくくりです。</p>", "keys": ["H₀：p₁−p₂＝0 の検定では、2群を合わせたプール比率を使う", "p̂pool＝成功数の合計／人数の合計。条件確認とSEの両方に使う", "SE＝√(p̂pool(1−p̂pool)(1/n₁＋1/n₂))", "先輩の研究：Z≈0.90、p≈0.37。比較群を固定値扱いしたp≈0.18は不確かさの過小評価", "有意でない結果は、効果が大きくないことの示唆でもある。費用や害と合わせて判断"], "upd": null, "quiz": [{"v": "", "q": "H₀：p₁＝p₂ の検定で標準誤差に使う割合は。", "o": ["p̂₁ と p̂₂ それぞれ", "2群を合わせたプール比率", "0.5", "大きい方の p̂"], "a": 1, "e": "H₀の下では2群は同じ割合なので、その最良の推定であるプール比率を使う。", "r": "OpenIntro 6章"}, {"v": "", "q": "治療群18/31、比較群12/26 のプール比率は。", "o": ["0.462", "0.526", "0.581", "0.5"], "a": 1, "e": "(18＋12)／(31＋26)＝30/57≈0.526。", "r": "OpenIntro 6章"}, {"v": "", "q": "比較群の割合を固定値として扱った検定の問題点は。", "o": ["p値が大きくなりすぎる", "比較群のばらつきを無視し、不確かさを過小評価する", "検定ができない", "問題はない"], "a": 1, "e": "比較群の揺れを入れるとSEが大きくなり、p値も大きくなる。", "r": "OpenIntro 6章"}], "course": "stat"}, {"id": "s44", "lv": 3, "t": "差の大きさを読む：リスク差・NNT・検出力", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §6.2（確認問題6.13）", "vol": "統計 第6章 割合の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「p＝0.37か…。じゃあ、何人おったら差が出たん？」。そして、有意な結果が出たときにも見るべきものがあります。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>「リスク28%減」と「<strong>233人に1人</strong>を救う（NNT）」は同じデータ。少人数の研究は差があっても見逃しやすい（検出力が低い）。</div><h3>有意でも「どれくらい」を見る：魚油の研究</h3>\n<p>教科書の確認問題。大規模な5年間のランダム化試験で、心臓発作は魚油群 <strong>1.12%</strong>、プラセボ群 <strong>1.55%</strong>。差は −0.43%、95% CI は (−0.71%, −0.15%)。0 を含まないので、<strong>魚油が心臓発作のリスクを下げる強い証拠</strong>がある、と教科書は結論します。</p>\n<p>では、どれくらい下げるのか。同じ結果でも言い方がいくつかあります。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>指標</th><th>計算</th><th>値</th></tr>\n<tr><td>絶対リスク差</td><td>1.55% − 1.12%</td><td><strong>0.43%</strong></td></tr>\n<tr><td>相対リスク</td><td>1.12 ／ 1.55</td><td>0.72（<strong>28%減</strong>）</td></tr>\n<tr><td>NNT</td><td>1 ／ 0.0043</td><td>約<strong>233人</strong></td></tr></table></div>\n<p><strong>NNT（治療必要数）</strong>は「1人の発作を防ぐのに、何人に5年間飲んでもらう必要があるか」。「リスク28%減」と「233人に1人」は同じデータですが、受ける印象はかなり違います。製薬会社の資料は相対リスクを、慎重な臨床医は絶対リスク差とNNTを見ます。<strong>両方を並べて読む</strong>のが第40話の「統計的有意 ≠ 臨床的有意」の実践です。</p>\n<h3>検出力：差を見抜ける確率</h3>\n<p>第38話で、第2種の過誤（見逃し）を学びました。その裏返し、</p>\n<div class=\"formula\">検出力（power）＝ 本当に差があるとき、それを有意と判定できる確率 ＝ 1 − β</div>\n<p>先輩の研究で、<strong>仮に本当の反応率が58%と46%だったとしても</strong>、31人と26人でα＝0.05の検定をすると、有意になる確率（検出力）は約<strong>15%</strong>しかありません。8割以上の確率で「有意差なし」になる研究設計だったのです。</p>\n<h3>必要な症例数</h3>\n<p>臨床研究では、検出力 <strong>80%</strong>、α＝0.05 で設計するのが標準的です。58% vs 46% の差（12%）を検出するのに必要な数を計算すると、</p>\n<div class=\"formula\">1群あたり 約<strong>271人</strong>、合計 約540人</div>\n<p>先輩の57人の<strong>約10倍</strong>です。単施設の後ろ向き研究で、反応率の12%の差を証明するのは、そもそも無理があった。これは研究が失敗だったということではなく、<strong>何が言えて何が言えないか</strong>を計画段階で知っておくべきだった、ということです。</p>\n<p>先輩：「じゃあ、この57人のデータは無駄？」「無駄じゃない。<strong>効果量と信頼区間</strong>（＋12%、−14〜＋38%）を報告すれば、将来のメタ解析の材料になる。p値だけを書いて『差なし』で終わらせるのが一番もったいない」。</p>", "keys": ["有意な結果でも効果の大きさを見る：絶対リスク差・相対リスク・NNT", "魚油の例：絶対差0.43%、相対28%減、NNT約233。同じデータでも印象が違う", "検出力＝本当に差があるとき有意と判定できる確率（1−β）", "先輩の研究の検出力は約15%。58% vs 46%を80%の検出力で示すには1群約271人", "有意でない研究も、効果量と信頼区間を報告すれば価値がある"], "upd": null, "quiz": [{"v": "", "q": "対照群1.55%、治療群1.12%。NNT は約。", "o": ["28人", "72人", "233人", "1000人"], "a": 2, "e": "NNT＝1／絶対リスク差＝1／0.0043≈233。", "r": "OpenIntro 6章"}, {"v": "", "q": "検出力の定義は。", "o": ["H₀が真のとき棄却しない確率", "本当に差があるとき、それを有意と判定できる確率", "p値が0.05以下になる確率", "第1種の過誤の確率"], "a": 1, "e": "検出力＝1−β。βは第2種の過誤の確率。", "r": "OpenIntro 6章"}, {"v": "", "q": "検出力約15%の研究で「有意差なし」となった。最も適切な解釈は。", "o": ["効果がないことが示された", "研究の設計上、差があっても見抜ける可能性が低かった", "第1種の過誤が起きた", "p値の計算が誤っている"], "a": 1, "e": "検出力が低い研究の『有意差なし』は、効果がない証拠にはならない。", "r": "OpenIntro 6章"}], "course": "stat"}, {"id": "s45", "lv": 2, "t": "カイ二乗検定の考え方：多くのカテゴリを一度に", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §6.3.1–6.3.2", "vol": "統計 第6章 割合の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「反応あり／なし」の2択なら割合の差で比べられる。では「白人／黒人／ヒスパニック／その他」の4つを一度に比べたいときは？</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>カテゴリーが3つ以上でも、<strong>期待される数と実際の数のずれ</strong>をまとめて1つの数（カイ二乗）にできる。</div><h3>教科書の例：陪審員の人種構成</h3>\n<p>ある市で選ばれた陪審員275人の人種構成が、市の人口構成と合っているか。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>白人</th><th>黒人</th><th>ヒスパニック</th><th>その他</th></tr>\n<tr><td>人口構成</td><td>72%</td><td>7%</td><td>12%</td><td>9%</td></tr>\n<tr><td>観測度数 O</td><td>205</td><td>26</td><td>25</td><td>19</td></tr>\n<tr><td>期待度数 E</td><td>198</td><td>19.25</td><td>33</td><td>24.75</td></tr></table></div>\n<p>期待度数は「H₀ が正しければ何人のはずか」＝ 割合 × 275。</p>\n<ul><li>H₀：陪審員は無作為に選ばれている。ずれは標本の自然な変動</li>\n<li>Hₐ：陪審員の選び方に人種的な偏りがある</li></ul>\n<p>1つの割合を見るのではなく、<strong>4つ全部を同時に</strong>評価したい。そのための新しい統計量を作ります。</p>\n<h3>Zスコアを4つ作って、まとめる</h3>\n<p>これまでの検定統計量は「(観測 − 期待) ／ SE」でした。度数の場合、SE は<strong>期待度数の平方根</strong>を使います。</p>\n<ul><li>白人：(205−198)／√198 ＝ 0.50</li>\n<li>黒人：(26−19.25)／√19.25 ＝ 1.54</li>\n<li>ヒスパニック：(25−33)／√33 ＝ −1.39</li>\n<li>その他：(19−24.75)／√24.75 ＝ −1.16</li></ul>\n<p>この4つをどうまとめるか。絶対値の和も考えられますが、普通は<strong>二乗して足します</strong>。</p>\n<div class=\"formula\">0.50² ＋ 1.54² ＋ 1.39² ＋ 1.16² ≈ <strong>5.89</strong></div>\n<p>二乗する理由は2つ。符号が消えて全部正になる。そして<strong>普通でない大きなずれが、より大きく効く</strong>。</p>\n<h3>カイ二乗統計量</h3>\n<div class=\"formula\">X² ＝ Σ (観測度数 − 期待度数)² ／ 期待度数</div>\n<p>各カテゴリの「ずれの二乗を期待度数で割ったもの」を全部足す。X² が大きいほど、観測が期待から離れている＝H₀ に反する証拠です。</p>\n<p>さて、5.89 は大きいのか小さいのか。H₀ が正しくても、偶然でこれくらいの値は出るかもしれない。それを判断するには、X² が H₀ の下で<strong>どんな分布に従うか</strong>を知る必要があります。次の話で。</p>", "keys": ["3つ以上のカテゴリを一度に評価するのがカイ二乗検定", "期待度数E＝H₀の下での割合×総数", "各カテゴリで(O−E)/√Eを作り、二乗して足す", "X²＝Σ(O−E)²/E。大きいほどH₀に反する", "二乗の理由：符号を消す、大きなずれを強調する"], "upd": null, "quiz": [{"v": "", "q": "人口の12%がヒスパニック、陪審員275人。ヒスパニックの期待度数は。", "o": ["12", "25", "33", "275"], "a": 2, "e": "0.12×275＝33。", "r": "OpenIntro 6章"}, {"v": "", "q": "カイ二乗統計量の各項の形は。", "o": ["(O−E)／E", "(O−E)²／E", "(O−E)²／O", "|O−E|"], "a": 1, "e": "ずれの二乗を期待度数で割ったものを、全カテゴリで足す。", "r": "OpenIntro 6章"}, {"v": "", "q": "カイ二乗統計量が大きいことが意味するのは。", "o": ["観測が期待によく一致している", "観測が期待から大きく離れ、H₀に反する証拠", "標本が大きい", "自由度が大きい"], "a": 1, "e": "ずれが大きいほどX²は大きくなる。", "r": "OpenIntro 6章"}], "course": "stat"}, {"id": "s46", "lv": 2, "t": "カイ二乗分布と適合度検定", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §6.3.3–6.3.5", "vol": "統計 第6章 割合の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>X²＝5.89。これを p値に変えるための分布を見ます。教科書の後半には、株価が「独立に動いているか」を調べる例も出てきます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>カイ二乗の値を<strong>p値に変えて</strong>判定する。各マスの期待される数が5以上あることが条件。</div><h3>カイ二乗分布</h3>\n<p>X² のように<strong>常に正で、右に歪んだ</strong>統計量を表すのが<strong>カイ二乗分布</strong>です。パラメータは<strong>自由度（df）</strong>の1つだけ。</p>\n<ul><li>自由度が大きくなると、<strong>中心が右へ</strong>移る（平均＝自由度）</li>\n<li><strong>ばらつきが大きく</strong>なる</li>\n<li>形は<strong>対称に近づく</strong>（df＝2 では強く歪み、df＝9 ではかなり対称）</li></ul>\n<h3>適合度検定の自由度と p値</h3>\n<div class=\"formula\">カテゴリ数 k のとき、自由度 df ＝ k − 1</div>\n<p>陪審員の例は4カテゴリなので df＝3。p値は、X² が大きいほど H₀ に反するので、<strong>上側の裾</strong>の面積です。</p>\n<div class=\"formula\">df＝3 で X² ≥ 5.89 となる確率 ＝ <strong>0.117</strong></div>\n<p>0.05 より大きいので H₀ を棄却しない。陪審員の選び方に人種的偏りがあるという<strong>十分な証拠はない</strong>。（偏りがないと証明されたわけではない、は第37話のとおり。）</p>\n<p>Rなら <code>pchisq(5.89, 3, lower.tail=FALSE)</code>、Excel なら <code>=CHISQ.DIST.RT(5.89,3)</code>。</p>\n<h3>使える条件</h3>\n<ol><li><strong>独立性</strong>：各度数は独立に得られている</li>\n<li><strong>標本サイズ</strong>：各セルの<strong>期待度数が5以上</strong></li></ol>\n<p>陪審員の例は 198、19.25、33、24.75 で全部5以上。条件を満たさないと、検定の誤り率が狂います。カテゴリが2つしかないなら、第5章の割合の方法で十分です。</p>\n<h3>分布への当てはまりを調べる：株価の例</h3>\n<p>教科書はカイ二乗検定の別の使い方として、<strong>データが特定の分布に従うか</strong>（適合度）を調べます。</p>\n<p>S&amp;P500 の10年分の日次データで、上がった日は54.5%。もし毎日の上げ下げが<strong>前日と独立</strong>なら、「次に上がる日までの日数」は<strong>幾何分布</strong>（第30話）に従うはず。観測された待ち日数（1日：717回、2日：369回…）と、幾何分布からの期待度数（743、338…）を比べます。</p>\n<ul><li>7カテゴリ（期待度数5以上になるよう7日以上はまとめる）→ df＝6</li>\n<li>X²＝4.61、<strong>p＝0.60</strong></li></ul>\n<p>日々の変動が独立だという仮説を棄却できない。「下げが続いたから、そろそろ反発するはず」という考えを支持する強い証拠は見当たらない、と教科書は述べます。第21話の<strong>ギャンブラーの誤り</strong>と同じ構図です。</p>", "keys": ["カイ二乗分布：常に正で右に歪む。パラメータは自由度のみ。平均＝自由度", "適合度検定の自由度はカテゴリ数−1。p値は上側の裾", "陪審員の例：X²＝5.89、df＝3、p＝0.117で棄却しない", "条件：独立性と、各セルの期待度数が5以上", "データが特定の分布に従うかの検定にも使える（株価の待ち日数と幾何分布、p＝0.60）"], "upd": null, "quiz": [{"v": "", "q": "5カテゴリの適合度検定の自由度は。", "o": ["3", "4", "5", "6"], "a": 1, "e": "df＝k−1＝4。", "r": "OpenIntro 6章"}, {"v": "", "q": "カイ二乗検定を使う条件として正しいのは。", "o": ["各セルの観測度数が10以上", "各セルの期待度数が5以上", "総数が30以上", "データが正規分布"], "a": 1, "e": "期待度数が5以上であることを確認する。", "r": "OpenIntro 6章"}, {"v": "", "q": "自由度が大きくなるとカイ二乗分布はどう変わるか。", "o": ["中心が左へ移り、ばらつきが小さくなる", "中心が右へ移り、ばらつきが大きくなり、対称に近づく", "形は変わらない", "左に歪む"], "a": 1, "e": "平均＝自由度なので中心は右へ。広がりも大きくなり、より対称になる。", "r": "OpenIntro 6章"}], "course": "stat"}, {"id": "s47", "lv": 3, "t": "分割表の独立性検定：質問の仕方で答えは変わるか", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §6.4.1", "vol": "統計 第6章 割合の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>問診のコツ。「何か困ったことはありましたか？」と「困ったことはなかったですよね？」では、引き出せる答えが違う気がする。教科書にまさにその実験があります。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>2つのカテゴリー変数が<strong>関係しているか</strong>を、分割表のカイ二乗検定で調べる。質問の仕方で答えは変わる。</div><h3>iPod 実験</h3>\n<p>過去に2回フリーズしたことのある中古iPodを売る役の参加者219人に、買い手役が3種類の質問のどれか1つをします。</p>\n<ul><li>一般的：「iPodについて何か言っておくことはありますか？」</li>\n<li>肯定的な仮定：「何も困った問題はなかったですよね？」</li>\n<li>否定的な仮定：「どんな問題がありましたか？」</li></ul>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>一般的</th><th>肯定的</th><th>否定的</th><th>計</th></tr>\n<tr><td>問題を打ち明けた</td><td>2</td><td>23</td><td>36</td><td>61</td></tr>\n<tr><td>隠した</td><td>71</td><td>50</td><td>37</td><td>158</td></tr>\n<tr><td>計</td><td>73</td><td>73</td><td>73</td><td>219</td></tr></table></div>\n<p>否定的な仮定を含む質問で、打ち明ける人が多く見えます。偶然か、本物か。</p>\n<h3>一元表と二元表</h3>\n<p>陪審員の例は1つの変数の度数（<strong>一元表</strong>）でした。今回は2つの変数の組み合わせ（<strong>二元表</strong>、分割表）。知りたいのは、<strong>2つの変数が独立か、関連しているか</strong>です。</p>\n<ul><li>H₀：質問の種類と、打ち明けるかどうかは<strong>独立</strong></li>\n<li>Hₐ：関連がある</li></ul>\n<h3>二元表の期待度数</h3>\n<p>H₀ が正しければ、どの質問でも打ち明ける割合は全体と同じ 61／219＝27.85% のはず。一般的質問の73人なら 0.2785×73＝<strong>20.33人</strong>。これを公式にすると、</p>\n<div class=\"formula\">期待度数（i行 j列）＝ (i行の合計) × (j列の合計) ／ 総合計</div>\n<p>打ち明けた行は各列20.33、隠した行は各列52.67です。</p>\n<h3>X² と自由度</h3>\n<p>計算は一元表と同じで、全セルの (O−E)²／E を足します。一般的×打ち明けた のセルだけで (2−20.33)²／20.33 ≈ 16.5。全部足すと <strong>X²＝40.13</strong>。</p>\n<div class=\"formula\">二元表の自由度 df ＝ (行数 − 1) × (列数 − 1)</div>\n<p>2行3列なので df＝1×2＝2。p値は約 <strong>0.000000002</strong>（5億分の1）。H₀ を棄却し、<strong>質問の仕方が、売り手が問題を打ち明けるかどうかに影響する</strong>と結論します。</p>\n<h3>外来への応用</h3>\n<p>これはランダムに割り付けた<strong>実験</strong>なので、因果的な結論が言えます（第7話）。「何か困っていることはありませんか？」より「<strong>どんなことで困っていますか？</strong>」。服薬の飲み忘れ、GH注射のスキップ、低血糖のエピソード。問題がある<strong>前提</strong>で尋ねる方が、本当のことを話してもらいやすい可能性があります。</p>", "keys": ["二元表（分割表）の独立性検定：2つのカテゴリ変数が関連しているかを調べる", "期待度数＝行の合計×列の合計／総合計", "X²は全セルの(O−E)²/Eの和", "自由度＝(行数−1)×(列数−1)", "iPod実験：X²＝40.13、df＝2で、質問の仕方が打ち明けやすさに影響"], "upd": null, "quiz": [{"v": "", "q": "行合計61、列合計73、総合計219のセルの期待度数は。", "o": ["20.33", "27.85", "52.67", "61"], "a": 0, "e": "61×73／219≈20.33。", "r": "OpenIntro 6章"}, {"v": "", "q": "3行4列の分割表の独立性検定の自由度は。", "o": ["6", "7", "11", "12"], "a": 0, "e": "(3−1)×(4−1)＝6。", "r": "OpenIntro 6章"}, {"v": "", "q": "iPod実験で因果的な結論が言える理由は。", "o": ["標本が大きいから", "p値が非常に小さいから", "質問の種類を無作為に割り付けた実験だから", "カイ二乗検定を使ったから"], "a": 2, "e": "ランダム割付の実験だから、質問の違いが原因と言える。", "r": "OpenIntro 6章"}], "course": "stat"}, {"id": "s48", "lv": 3, "t": "小児2型糖尿病のTODAY研究を検定する", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §6.4.2", "vol": "統計 第6章 割合の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>教科書の第6章の最後に、小児内分泌の私たちにはおなじみの研究が出てきます。10〜17歳の2型糖尿病の治療比較です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>カイ二乗検定が教えるのは「<strong>どこかに差がある</strong>」まで。どの群とどの群かは別に調べる。</div><h3>3つの治療</h3>\n<p>メトホルミンで治療中の10〜17歳の2型糖尿病患者を、3つの治療に<strong>ランダムに</strong>割り付けた実験です。主要評価項目は血糖コントロールの<strong>失敗／成功</strong>。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>失敗</th><th>成功</th><th>計</th><th>失敗率</th></tr>\n<tr><td>生活習慣プログラム</td><td>109</td><td>125</td><td>234</td><td>46.6%</td></tr>\n<tr><td>メトホルミン単独</td><td>120</td><td>112</td><td>232</td><td>51.7%</td></tr>\n<tr><td>メトホルミン＋ロシグリタゾン</td><td>90</td><td>143</td><td>233</td><td>38.6%</td></tr>\n<tr><td>計</td><td>319</td><td>380</td><td>699</td><td></td></tr></table></div>\n<ul><li>H₀：3つの治療の効果に差はない</li>\n<li>Hₐ：差がある</li></ul>\n<h3>計算</h3>\n<p>期待度数：生活習慣×失敗 ＝ 234×319／699 ≈ <strong>106.8</strong>。同様に全セルを出すと、どれも100以上で条件を満たします。</p>\n<p>(109−106.8)²／106.8 ≈ 0.05 から始めて全6セルを足すと <strong>X²＝8.16</strong>。3行2列なので df＝2×1＝2。</p>\n<div class=\"formula\">p値 ＝ <strong>0.017</strong> ＜ 0.05 → H₀ を棄却</div>\n<p>「少なくとも1つの治療は、他と効果が違う」と結論します。</p>\n<h3>カイ二乗検定が言わないこと</h3>\n<p>ここが大事です。カイ二乗検定が教えてくれるのは「<strong>どこかに差がある</strong>」まで。<strong>どの治療とどの治療の間に差があるか</strong>は言いません。失敗率を見ると併用療法が一番低そうですが、それを主張するには<strong>2群ずつの比較</strong>が必要で、そのとき比較の回数が増える分の補正（多重比較）も考えなければなりません。この考え方は第7章の分散分析で詳しく扱います。</p>\n<h3>2×2表とZ検定は同じもの</h3>\n<p>教科書は、2×2表なら第6.2節の2群の割合の方法が有効だと述べています。実は、先輩の研究を2×2表にしてカイ二乗検定をすると X²＝0.80、p＝0.37。第43話の Z（正確には0.897）を二乗すると 0.80。<strong>2×2表のカイ二乗検定と、2群の割合のZ検定は同じ</strong>です。</p>\n<p>期待度数が5未満のセルがある小さな表では、カイ二乗分布の近似が使えません。その場合は<strong>Fisherの正確検定</strong>などを使います（教科書では第2章のランダム化の方法を参照としています）。</p>\n<h3>第6章の地図</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>話</th><th>覚えておくこと</th></tr>\n<tr><td>41</td><td>n ＞ z*²p(1−p)/m²。見当がなければp＝0.5</td></tr>\n<tr><td>42</td><td>差のSEは分散を足してルート。先輩の研究はCIが0をまたぐ</td></tr>\n<tr><td>43</td><td>差の検定はプール比率。p＝0.37</td></tr>\n<tr><td>44</td><td>リスク差・相対リスク・NNT。検出力15%、必要数1群271人</td></tr>\n<tr><td>45</td><td>X²＝Σ(O−E)²/E</td></tr>\n<tr><td>46</td><td>df＝k−1。期待度数5以上</td></tr>\n<tr><td>47</td><td>二元表は行計×列計/総計、df＝(R−1)(C−1)</td></tr>\n<tr><td>48</td><td>カイ二乗は「どこかに差」まで。2×2ではZ²＝X²</td></tr></table></div>\n<p>先輩：「反応率じゃなくて、<strong>身長SDSの伸び</strong>そのものの平均で比べたら？」「それが次の第7章<strong>平均の推測</strong>。t検定、対応のあるデータ、分散分析」。</p>", "keys": ["TODAY研究（小児2型糖尿病の3治療）：X²＝8.16、df＝2、p＝0.017で「少なくとも1つは違う」", "カイ二乗検定は「どこかに差がある」まで。どの群間かは別に比較し、多重比較に注意", "2×2表のカイ二乗検定は2群の割合のZ検定と同じ（Z²＝X²）", "期待度数5未満のセルがあればFisherの正確検定など", "次は平均の推測（t検定・対応あり・分散分析）"], "upd": null, "quiz": [{"v": "", "q": "TODAY研究でカイ二乗検定が有意（p＝0.017）だったときに言えることは。", "o": ["併用療法が最も優れている", "3つの治療のうち少なくとも1つは他と効果が違う", "3つすべてが互いに異なる", "生活習慣プログラムが最も劣る"], "a": 1, "e": "カイ二乗検定はどこかに差があることまで。どこかは別の比較が必要。", "r": "OpenIntro 6章"}, {"v": "", "q": "2×2表で Z検定の Z＝0.90 だった。同じデータのカイ二乗統計量は。", "o": ["0.45", "0.81", "0.95", "1.80"], "a": 1, "e": "2×2表ではX²＝Z²。0.90²≈0.81。", "r": "OpenIntro 6章"}, {"v": "", "q": "期待度数が5未満のセルがある小さな2×2表で使うべき方法は。", "o": ["そのままカイ二乗検定", "Fisherの正確検定など", "t検定", "検定はできない"], "a": 1, "e": "カイ二乗分布の近似が成り立たないので、正確検定などを使う。", "r": "OpenIntro 6章"}], "course": "stat"}];
const ST7 = [{"id": "s49", "lv": 1, "t": "平均を推測する：t分布の登場", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §7.1.1–7.1.3", "vol": "統計 第7章 平均の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「反応あり／なしで切るんじゃなくて、身長SDSがどれだけ伸びたか、その平均で比べたい」。第7章は、割合ではなく<strong>平均</strong>の推測です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>平均を扱うときは、少人数の不確かさを織り込んだ<strong>t分布</strong>を使う。正規分布より裾が厚い。</div><p>教科書は章の冒頭でこう言います。点推定値と分布は変わっても、<strong>推測の考え方は同じ</strong>。何を推定するか決め、その分布を求め、信頼区間と検定の枠組みを当てはめる。</p>\n<h3>平均の中心極限定理</h3>\n<p>平均 μ、標準偏差 σ の母集団から、独立な観測値 n 個を取ると、標本平均 x̄ はおよそ</p>\n<div class=\"formula\">平均 ＝ μ　　SE ＝ σ ／ √n</div>\n<p>の正規分布に従います。割合のときの √(p(1−p)/n) が、σ/√n に置き換わっただけです。</p>\n<h3>2つの条件</h3>\n<p><strong>1. 独立性</strong>：単純無作為抽出や、ランダムな過程からのデータ。</p>\n<p><strong>2. 正規性</strong>：完全に確かめる方法はないので、教科書は経験則を使います。</p>\n<ul><li><strong>n ＜ 30</strong>：<strong>明らかな外れ値がなければ</strong>、正規に近い分布からと考えてよい</li>\n<li><strong>n ≥ 30</strong>：母集団が正規でなくても、<strong>極端な外れ値がなければ</strong> x̄ はほぼ正規</li></ul>\n<p>どちらも鍵は<strong>外れ値</strong>。第13話で見たように、平均は外れ値に引っ張られます。まずヒストグラムを描く習慣はここでも生きます。</p>\n<h3>σ が分からない問題と t分布</h3>\n<p>SE の式には母集団の σ が入っていますが、普通 σ は分からない。そこで標本の標準偏差 s で代用します。ところが <strong>s 自体が推定値</strong>なので、その分の不確かさが加わる。特に n が小さいと、s が σ からずれやすい。</p>\n<p>この追加の不確かさを織り込んだのが <strong>t分布</strong>です。</p>\n<ul><li>0を中心とした釣り鐘型で、正規分布に似ている</li>\n<li>ただし<strong>裾が厚い</strong>：平均から遠い値が出やすい</li>\n<li>パラメータは<strong>自由度 df</strong> ひとつ。平均を扱うときは <strong>df ＝ n − 1</strong></li>\n<li>df が大きいほど標準正規分布に近づく</li></ul>\n<h3>裾の厚さを数字で</h3>\n<p>平均から3単位以上離れる確率は、標準正規分布なら 0.003（68-95-99.7ルール）。df＝2 の t分布では約 <strong>0.095</strong>、30倍以上です。小さな標本で正規分布を使うと、極端な値を「ありえない」と過小評価してしまいます。</p>\n<p>95%の臨界値で比べると違いがよく見えます。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>分布</th><th>95%の臨界値</th></tr>\n<tr><td>t（df＝8）</td><td>2.31</td></tr>\n<tr><td>t（df＝18）</td><td>2.10</td></tr>\n<tr><td>t（df＝30）</td><td>2.04</td></tr>\n<tr><td>標準正規</td><td>1.96</td></tr></table></div>\n<p>症例数の少ない小児の研究ほど、1.96 ではなく<strong>もう少し大きい t*</strong> を使うことになります。</p>", "keys": ["標本平均の中心極限定理：x̄は平均μ、SE＝σ/√nのほぼ正規分布", "条件：独立性と正規性（n＜30は明らかな外れ値なし、n≥30は極端な外れ値なし）", "σは未知なのでsで代用。その不確かさを織り込むのがt分布", "t分布は裾が厚く、自由度df＝n−1で形が決まる。dfが大きいほど正規に近い", "95%の臨界値はdf＝8で2.31、df＝18で2.10。小標本ほど1.96より大きい"], "upd": null, "quiz": [{"v": "", "q": "標本平均の標準誤差は。", "o": ["σ", "σ／n", "σ／√n", "√(p(1−p)/n)"], "a": 2, "e": "SE＝σ/√n。実際にはσの代わりに標本SDのsを使う。", "r": "OpenIntro 7章"}, {"v": "", "q": "n＝19 の標本平均を t分布でモデル化するときの自由度は。", "o": ["17", "18", "19", "20"], "a": 1, "e": "df＝n−1＝18。", "r": "OpenIntro 7章"}, {"v": "", "q": "t分布が標準正規分布と違う点は。", "o": ["中心が0でない", "裾が厚く、極端な値が出やすい", "左右非対称", "自由度が大きいほど裾が厚い"], "a": 1, "e": "sでσを代用する不確かさの分、裾が厚い。自由度が大きいほど正規に近づく。", "r": "OpenIntro 7章"}], "course": "stat"}, {"id": "s50", "lv": 1, "t": "1つの平均の信頼区間：太地のイルカの水銀", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §7.1.4", "vol": "統計 第7章 平均の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>教科書の例題に、和歌山県の太地町が出てきます。ハナゴンドウ（イルカの一種）19頭の筋肉中の水銀濃度です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>平均の信頼区間は<strong>平均±t×SE</strong>。SDは個人差、SEは平均の推定の揺れ。</div><h3>データ</h3>\n<p>n＝19、平均 x̄＝<strong>4.4</strong> μg/g（湿重量）、標準偏差 s＝2.3。最小1.7、最大9.2。</p>\n<p>条件の確認：独立性は、無作為標本とみなせるとします。正規性は、n＜30 で<strong>明らかな外れ値がない</strong>ので満たすと判断します。</p>\n<h3>信頼区間の式</h3>\n<div class=\"formula\">x̄ ± t*df × s／√n</div>\n<p>第35話の「点推定値 ± z* × SE」の z* が <strong>t*</strong> に変わっただけです。</p>\n<h3>計算</h3>\n<ol><li>SE ＝ 2.3／√19 ＝ <strong>0.528</strong></li>\n<li>df ＝ 19 − 1 ＝ 18、95%なので t*₁₈ ＝ <strong>2.10</strong>（Rなら <code>qt(0.975, 18)</code>、Excel なら <code>=T.INV.2T(0.05,18)</code>）</li>\n<li>4.4 ± 2.10 × 0.528 → <strong>(3.29, 5.51)</strong></li></ol>\n<p>「太地地方のハナゴンドウの筋肉中の平均水銀濃度は、3.29〜5.51 μg/g の間と95%の信頼で言える」。</p>\n<h3>4つのステップ（いつもの型）</h3>\n<ol><li><strong>準備</strong>：x̄、s、n を確認し、信頼水準を決める</li>\n<li><strong>確認</strong>：独立性と正規性（外れ値）</li>\n<li><strong>計算</strong>：SE、df、t* を出して区間を作る</li>\n<li><strong>結論</strong>：状況に即して解釈する</li></ol>\n<h3>小児内分泌で使う</h3>\n<p>先輩の研究で、GH治療群31人の1年後の身長SDSの伸び（ΔSDS）が、平均 <strong>0.62</strong>、SD <strong>0.45</strong> だったとします（物語用の数値です）。</p>\n<ul><li>SE ＝ 0.45／√31 ≈ 0.081</li>\n<li>df＝30、t*＝2.04</li>\n<li>0.62 ± 2.04 × 0.081 → <strong>(0.45, 0.79)</strong></li></ul>\n<p>「GH治療1年でのSDSの平均的な伸びは0.45〜0.79」。反応あり／なしで切ったときの「41〜75%」より、ずっと<strong>具体的な情報</strong>になっています。</p>\n<h3>SD と SE をもう一度</h3>\n<p>SD 0.45 は「子どもによって伸びがこれくらいばらつく」、SE 0.081 は「平均の推定がこれくらい揺れる」。患者さんへの説明で使うのは前者（「伸びには個人差があって…」）、論文の信頼区間に使うのは後者です。</p>", "keys": ["1つの平均の信頼区間：x̄ ± t*df × s/√n（df＝n−1）", "イルカの例：4.4 ± 2.10×0.528 → (3.29, 5.51)", "手順は準備・確認・計算・結論の4ステップ", "連続値で評価すると、割合で切るより具体的な情報が得られる", "SDは個人差、SEは平均の推定の揺れ。説明の目的で使い分ける"], "upd": null, "quiz": [{"v": "", "q": "n＝19、x̄＝4.4、s＝2.3 のときの標準誤差は約。", "o": ["0.12", "0.53", "2.3", "4.4"], "a": 1, "e": "2.3/√19≈0.528。", "r": "OpenIntro 7章"}, {"v": "", "q": "n＝19 で95%信頼区間を作るときの t* は約。", "o": ["1.96", "2.10", "2.31", "2.58"], "a": 1, "e": "df＝18 の t分布の97.5パーセンタイル＝2.10。", "r": "OpenIntro 7章"}, {"v": "", "q": "患者家族に「伸びには個人差がある」と説明するときに参考にすべきなのは。", "o": ["標準誤差", "標準偏差", "信頼区間", "p値"], "a": 1, "e": "SDは一人ひとりのばらつき。SEは平均の推定の不確かさ。", "r": "OpenIntro 7章"}], "course": "stat"}, {"id": "s51", "lv": 2, "t": "対応のあるデータ：同じ子の前と後", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §7.2", "vol": "統計 第7章 平均の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「GHを始めた10人の子、開始時と1年後のSDSを比べたい。2群のt検定でいい？」「その10人、<strong>同じ子</strong>やろ？」</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>同じ人の前後を比べるときは<strong>差をとってから</strong>分析する。個人差が消えて、変化が見えやすくなる。</div><h3>対応のあるデータ</h3>\n<p>2つのデータセットの観測値が<strong>1対1で特別な対応</strong>を持つとき、<strong>対応のあるデータ（paired data）</strong>と呼びます。</p>\n<ul><li>同じ患者の治療前と治療後</li>\n<li>同じ子の右手と左手</li>\n<li>双子の片方ずつ</li>\n<li>教科書の例：同じ教科書の、大学書店の価格とAmazonの価格</li></ul>\n<h3>差をとれば、1標本の問題になる</h3>\n<p>対応のあるデータは、<strong>ペアごとの差</strong>を計算して、その差を1つのデータとして扱います。</p>\n<div class=\"formula\">H₀：μdiff ＝ 0　　T ＝ (x̄diff − 0) ／ (sdiff／√n)、df ＝ n − 1</div>\n<p>教科書の例：68冊の教科書で、書店とAmazonの価格差の平均 $3.58、SD $13.42。T＝3.58／(13.42/√68)＝<strong>2.20</strong>、df＝67、p＝<strong>0.03</strong>。書店の方が平均的に高い、と結論します。</p>\n<h3>対応を無視すると何が起こるか</h3>\n<p>GHを始めた10人（物語用の数値）。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>平均SDS</th><th>SD</th></tr>\n<tr><td>開始時</td><td>−2.48</td><td>0.45</td></tr>\n<tr><td>1年後</td><td>−2.25</td><td>0.31</td></tr>\n<tr><td>差（後−前）</td><td><strong>＋0.23</strong></td><td><strong>0.15</strong></td></tr></table></div>\n<ul><li><strong>対応ありのt検定</strong>（差を使う）：T＝0.23／(0.15/√10)≈4.9、<strong>p＝0.0009</strong></li>\n<li><strong>対応を無視して2群のt検定</strong>：p＝<strong>0.20</strong></li></ul>\n<p>同じデータなのに結論が逆になります。理由は<strong>ばらつきの源</strong>です。開始時のSDSは子どもによって−3.3〜−1.9と大きくばらつく（SD 0.45）。でも一人ひとりの「伸び」はそろっている（SD 0.15）。差をとると、<strong>子ども同士の個人差が打ち消され</strong>、治療による変化だけが残ります。</p>\n<div class=\"formula\">対応のあるデザインは、個人差という雑音を消して、変化を見えやすくする</div>\n<h3>注意：前後比較の限界</h3>\n<p>対応のあるt検定が有意でも、「GHが効いた」とまでは言えません。対照群がないので、<strong>自然経過</strong>や<strong>平均への回帰</strong>（極端に低い時期に受診した子は、次の測定で少し戻りやすい）と区別できないからです。前後比較は強力ですが、因果を言うには第1章の<strong>比較対照</strong>が必要です。</p>", "keys": ["対応のあるデータ：観測値が1対1で対応（同じ人の前後、双子、左右など）", "ペアごとの差をとり、1標本のt検定として扱う（df＝n−1）", "対応を無視すると個人差が雑音として残り、検出力が大きく落ちる", "例：同じ10人で対応ありp＝0.0009、無視するとp＝0.20", "前後比較だけでは自然経過や平均への回帰と区別できない"], "upd": null, "quiz": [{"v": "", "q": "対応のあるデータの例として正しいのは。", "o": ["男児群と女児群の身長", "同じ患者の治療前と治療後のHbA1c", "A病院とB病院の患者の体重", "2つの別々の学年の成績"], "a": 1, "e": "同じ人の前後は1対1で対応している。", "r": "OpenIntro 7章"}, {"v": "", "q": "対応のあるデータの分析方法は。", "o": ["2群の平均の差のt検定", "ペアごとの差をとり、その平均を1標本のt検定で調べる", "カイ二乗検定", "分散分析"], "a": 1, "e": "差を1つのデータとして扱う。", "r": "OpenIntro 7章"}, {"v": "", "q": "対応を無視して2群のt検定をすると、一般に何が起こるか。", "o": ["p値が小さくなりすぎる", "個人差が雑音として残り、差を見抜きにくくなる", "自由度が小さくなる", "結果は変わらない"], "a": 1, "e": "差をとることで消えていた個人差が、SEを大きくする。", "r": "OpenIntro 7章"}], "course": "stat"}, {"id": "s52", "lv": 2, "t": "2群の平均の差：t検定", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §7.3.1–7.3.2", "vol": "統計 第7章 平均の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>今度は別々の子ども同士の比較。対応のない2群の平均を比べます。教科書の例は、心筋梗塞を起こした羊への幹細胞治療と、妊婦の喫煙と出生体重です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>2群の平均の比較は<strong>t検定</strong>。有意でなくても「影響しない」とは言えない。</div><h3>2群の平均の差の推測</h3>\n<p>点推定は x̄₁ − x̄₂。第42話の割合の差と同じ発想で、SE は<strong>分散を足してルート</strong>。</p>\n<div class=\"formula\">SE ＝ √( s₁²／n₁ ＋ s₂²／n₂ )</div>\n<p>条件は、<strong>各群内・群間の独立性</strong>と、<strong>各群の正規性</strong>（外れ値チェック）。</p>\n<h3>自由度</h3>\n<p>正式な自由度の式（Welch）は複雑なので、普通は統計ソフトに任せます。手計算なら、教科書は安全側として</p>\n<div class=\"formula\">df ＝ (n₁ − 1) と (n₂ − 1) の<strong>小さい方</strong></div>\n<p>を使ってよいとしています。</p>\n<h3>例1：羊の胚性幹細胞（ESC）</h3>\n<p>心筋梗塞を起こした羊18頭を、ESC群9頭と対照群9頭に<strong>無作為に</strong>割り付け、心臓のポンプ機能の変化を比較。差 7.83%、SE 1.95、df＝8、t*＝2.31。</p>\n<div class=\"formula\">7.83 ± 2.31 × 1.95 → <strong>(3.3%, 12.3%)</strong></div>\n<p>0を含まないので、ESCはポンプ機能を改善すると言えます。ランダム化実験なので因果的な結論が可能です。</p>\n<h3>例2：妊婦の喫煙と出生体重</h3>\n<p>ノースカロライナ州の新生児150人（非喫煙の母親100人、喫煙の母親50人）。平均体重の差 0.40ポンド、SE 0.26。</p>\n<ul><li>T ＝ 0.40／0.26 ≈ 1.54、df＝49</li>\n<li>両側 p ＝ <strong>0.135</strong> → H₀ を棄却しない</li></ul>\n<p>ここで教科書は大事な注意を加えます。<strong>喫煙が出生体重に影響しないと結論してはいけない</strong>。もっと大きなデータセットでは、喫煙する母親の子は体重が小さい傾向が示されています。150人では<strong>第2種の過誤</strong>を犯したかもしれない。</p>\n<p>さらに教科書は、たばこ産業がかつて「喫煙者の子は小さいが、同じくらい健康だ」と主張していた事実と、それが<strong>事実と異なる</strong>ことを紹介しています。有意でない結果が、都合よく「害がない証拠」として使われる危険の実例です。</p>\n<h3>プールした標準偏差</h3>\n<p>2群の母標準偏差がほぼ等しいと考える<strong>強い理由</strong>があるときだけ、2群をまとめた s_pooled を使い、df＝n₁＋n₂−2 とできます。ただし教科書は「慎重に考えた後でのみプールせよ」と言っています。標本が大きければプールの利点はほとんどありません。現在のソフトの既定値（Welchのt検定）で困ることはまずありません。</p>", "keys": ["2群の平均の差：点推定x̄₁−x̄₂、SE＝√(s₁²/n₁＋s₂²/n₂)", "手計算のdfはn₁−1とn₂−1の小さい方（ソフトはWelchの式）", "羊のESC：7.83±2.31×1.95→(3.3, 12.3)。ランダム化なので因果", "喫煙と出生体重：p＝0.135でも『影響しない』とは言えない（第2種の過誤）", "プールしたSDは母SDがほぼ等しいと考える強い理由があるときだけ"], "upd": null, "quiz": [{"v": "", "q": "2群の平均の差の標準誤差は。", "o": ["s₁／√n₁ ＋ s₂／√n₂", "√(s₁²／n₁ ＋ s₂²／n₂)", "(s₁＋s₂)／√(n₁＋n₂)", "s₁ − s₂"], "a": 1, "e": "分散を足してルート。割合の差と同じ構造。", "r": "OpenIntro 7章"}, {"v": "", "q": "n₁＝100、n₂＝50 のとき、手計算で安全側に使う自由度は。", "o": ["49", "99", "148", "150"], "a": 0, "e": "n₁−1とn₂−1の小さい方＝49。", "r": "OpenIntro 7章"}, {"v": "", "q": "喫煙群と非喫煙群で出生体重に有意差がなかった（p＝0.135）。正しい解釈は。", "o": ["喫煙は出生体重に影響しない", "この標本では差を示す十分な証拠がなかった。第2種の過誤の可能性がある", "喫煙は出生体重を増やす", "研究デザインが誤っている"], "a": 1, "e": "有意でないことは影響がない証拠ではない。", "r": "OpenIntro 7章"}], "course": "stat"}, {"id": "s53", "lv": 3, "t": "先輩の研究をΔSDSで解析し直す", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §7.3（応用）", "vol": "統計 第7章 平均の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「反応率で比べたらp＝0.37やった。ΔSDSの平均で比べたらどうなる？」。ここには大事な落とし穴も潜んでいます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>「あり／なし」に切ると情報が減って差を見抜きにくくなる。でも<strong>結果を見てから評価項目を選ぶのは反則</strong>。</div><h3>データ（物語用の数値）</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th></th><th>n</th><th>ΔSDS 平均</th><th>SD</th></tr>\n<tr><td>GH治療群</td><td>31</td><td>0.62</td><td>0.45</td></tr>\n<tr><td>比較群</td><td>26</td><td>0.38</td><td>0.40</td></tr></table></div>\n<h3>計算</h3>\n<ul><li>差 ＝ 0.62 − 0.38 ＝ <strong>0.24</strong></li>\n<li>SE ＝ √(0.45²／31 ＋ 0.40²／26) ≈ <strong>0.113</strong></li>\n<li>T ＝ 0.24／0.113 ≈ <strong>2.13</strong></li>\n<li>df：小さい方なら25（Welchなら約55）</li>\n<li>p ＝ <strong>0.043</strong>（df＝25）／0.038（Welch）</li>\n<li>95% CI（df＝25、t*＝2.06）：0.24 ± 2.06×0.113 → <strong>(0.01, 0.47)</strong></li></ul>\n<p>同じ57人で、反応率（2値）では p＝0.37、ΔSDS（連続値）では p≈0.04。</p>\n<h3>なぜこんなに違うのか</h3>\n<p><strong>連続値を2値に切ると情報が捨てられる</strong>からです。「+0.5以上なら反応あり」と決めると、+0.49 の子と −0.2 の子が同じ「反応なし」になり、+0.51 の子と +1.5 の子が同じ「反応あり」になる。せっかく測った差の大きさが消えてしまいます。一般に、<strong>連続値のまま解析する方が検出力は高い</strong>。研究を計画するときは、主要評価項目を安易に2値化しないことが大切です。</p>\n<h3>しかし、ここが落とし穴</h3>\n<p>先輩：「よし、ΔSDSで有意やったから、こっちで論文書こう！」</p>\n<p>これは<strong>やってはいけない</strong>ことです。結果を見てから「有意になる評価項目」を選ぶと、第40話の「データを見てから片側検定を選ぶ」と同じ問題が起こります。評価項目を2つ試して、有意な方を報告すれば、実際の第1種の過誤は5%を超える。試す項目が増えるほど、偶然の「有意」は必ず見つかります。これを<strong>p-hacking</strong>と呼びます。</p>\n<div class=\"formula\">主要評価項目は、データを見る<strong>前に</strong>決めて記録しておく</div>\n<p>臨床試験の事前登録（UMIN-CTR、jRCT、ClinicalTrials.gov など）は、まさにこのためにあります。後ろ向き研究でも、解析計画を先に書いておくのが誠実なやり方です。</p>\n<p>正しい書き方は、事前に決めた主要評価項目の結果を報告し、もう一方は<strong>探索的な解析</strong>と明記すること。「ΔSDSでは差が示唆されたが、探索的であり、前向き研究での検証が必要」。この先輩の57人は、次の研究の<strong>仮説を作るデータ</strong>として価値があります。</p>", "keys": ["ΔSDS（連続値）での比較：差0.24、SE 0.113、T≈2.13、p≈0.04、95% CI (0.01, 0.47)", "同じデータでも2値化（反応率）するとp＝0.37。2値化は情報を捨て検出力を下げる", "結果を見てから有意な評価項目を選ぶのはp-hacking。第1種の過誤が5%を超える", "主要評価項目はデータを見る前に決めて記録する（事前登録）", "事後に選んだ解析は『探索的』と明記し、仮説生成として扱う"], "upd": null, "quiz": [{"v": "", "q": "連続値の評価項目を「反応あり／なし」に2値化すると一般にどうなるか。", "o": ["検出力が上がる", "情報が失われ、検出力が下がる", "p値は変わらない", "第1種の過誤が減る"], "a": 1, "e": "差の大きさの情報が消えるため、連続値で解析した方が検出力が高い。", "r": "OpenIntro 7章"}, {"v": "", "q": "複数の評価項目を試し、有意になったものだけを報告することの問題は。", "o": ["検出力が下がる", "実際の第1種の過誤が名目の5%を超える", "標本サイズが減る", "問題はない"], "a": 1, "e": "試す回数が増えるほど偶然の有意が見つかりやすくなる（p-hacking）。", "r": "OpenIntro 7章"}, {"v": "", "q": "後から選んだ解析で有意差が出たときの適切な扱いは。", "o": ["主要な結果として報告する", "探索的解析と明記し、検証が必要と述べる", "報告しない", "p値を2倍して報告する"], "a": 1, "e": "事前に決めていない解析は仮説生成として扱う。", "r": "OpenIntro 7章"}], "course": "stat"}, {"id": "s54", "lv": 3, "t": "検出力と症例数：研究前の計算", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §7.4", "vol": "統計 第7章 平均の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「次は前向きにやる。主要評価項目はΔSDS。何人要る？」。第44話の検出力を、平均の差で、教科書の手順どおりに計算します。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>必要な人数は「<strong>どれくらいの差を見つけたいか</strong>」で決まる。その差を決めるのは臨床医。</div><h3>教科書の例：降圧薬の臨床試験</h3>\n<p>新しい降圧薬と標準薬を比べる両側検定。過去の研究から血圧変化のSDは約 <strong>12 mmHg</strong>。研究者が「実質的に重要」と考える最小の差は <strong>3 mmHg</strong>。</p>\n<h3>「検定をするつもり」で考える</h3>\n<p><strong>1. 帰無分布と棄却域</strong>：各群100人なら SE＝√(12²/100＋12²/100)＝<strong>1.70</strong>。差が ±1.96×1.70＝<strong>±3.33</strong> を超えたら H₀ を棄却。</p>\n<p>ここで気づくことがあります。本当の差が −3 mmHg でも、観測される差が −3.33 を超えなければ有意にならない。<strong>あまりよい兆候ではない</strong>、と教科書も言います。</p>\n<p><strong>2. 本当の差が −3 のときの分布</strong>：帰無分布を左に3ずらした正規分布。</p>\n<p><strong>3. その分布が棄却域に落ちる確率</strong>：Z＝(−3.33−(−3))／1.70＝−0.20 → <strong>約42%</strong>。</p>\n<p>各群100人では、本当に意味のある差があっても<strong>半分以上の確率で見逃す</strong>。</p>\n<h3>多すぎても問題</h3>\n<p>各群500人にすると SE＝0.76、検出力は約 <strong>97.7%</strong>。でも今度は、必要以上の患者を<strong>新薬に曝す</strong>ことになり、倫理的にも費用的にも問題です。慣習的な目標は<strong>検出力80%</strong>（場合によって90%）です。</p>\n<h3>逆算する式</h3>\n<div class=\"formula\">1群あたり n ＝ (z_α/2 ＋ z_β)² × (σ₁² ＋ σ₂²) ／ δ²</div>\n<p>α＝0.05（両側）なら z＝1.96、検出力80%なら z＝0.84。<strong>(1.96＋0.84)² ＝ 7.84</strong> は覚えておくと便利です。</p>\n<p>降圧薬の例：7.84 × (144＋144)／9 ≈ <strong>251人／群</strong>。</p>\n<h3>先輩の次の研究</h3>\n<p>ΔSDS の SD を約0.45、臨床的に意味のある最小の差を <strong>0.25 SD</strong> とすると、</p>\n<div class=\"formula\">7.84 × (0.45² ＋ 0.45²)／0.25² ≈ <strong>51人／群</strong></div>\n<p>反応率で12%の差を検出するには1群271人でした（第44話）。<strong>連続値で設計すれば約5分の1</strong>。多施設共同なら現実的な数字です。脱落を見込んで、実際には1〜2割多めに集めます。</p>\n<h3>計算の材料はどこから来るか</h3>\n<ul><li><strong>σ</strong>：先行研究、パイロット研究、自施設の過去データ</li>\n<li><strong>δ</strong>：統計ではなく<strong>臨床の判断</strong>。「この差なら治療方針が変わる」という最小の差</li></ul>\n<p>δ を小さくするほど必要数は二乗で増えます。δ を決めるのは統計家ではなく、<strong>臨床医の仕事</strong>です。</p>", "keys": ["検出力の計算：帰無分布の棄却域を決め、真の差の下で棄却域に落ちる確率を求める", "降圧薬の例：各群100人で検出力42%、500人で97.7%（多すぎも倫理的に問題）", "目標は検出力80%（または90%）", "1群あたりn＝(z_α/2＋z_β)²(σ₁²＋σ₂²)/δ²。α＝0.05・検出力80%なら(1.96＋0.84)²＝7.84", "δ（意味のある最小の差）は臨床判断で決める。連続値の設計は必要数を大きく減らす"], "upd": null, "quiz": [{"v": "", "q": "検出力80%、α＝0.05（両側）の症例数計算で使う (z_α/2＋z_β)² は約。", "o": ["3.84", "5.6", "7.84", "10.5"], "a": 2, "e": "(1.96＋0.84)²≈7.84。", "r": "OpenIntro 7章"}, {"v": "", "q": "SD 12、検出したい差3、検出力80%、α＝0.05 の2群比較。1群あたりの必要数は約。", "o": ["63人", "126人", "251人", "500人"], "a": 2, "e": "7.84×(144＋144)/9≈251。", "r": "OpenIntro 7章"}, {"v": "", "q": "検出したい最小の差 δ を半分にすると、必要な症例数は。", "o": ["半分", "2倍", "4倍", "変わらない"], "a": 2, "e": "nはδ²に反比例する。", "r": "OpenIntro 7章"}], "course": "stat"}, {"id": "s55", "lv": 3, "t": "分散分析（ANOVA）：3群以上の平均を比べる", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §7.5.1–7.5.3", "vol": "統計 第7章 平均の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「GH製剤が3種類ある。ΔSDSを比べたい。2群ずつ3回t検定すればいい？」。それをやると、第1種の過誤が膨らみます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>3群以上の平均を比べるときは、2群ずつ何度も検定せず、<strong>分散分析（ANOVA）で一度に</strong>比べる。</div><h3>なぜ一度に比べるのか</h3>\n<p>3群なら2群の組み合わせは3通り。α＝0.05で3回検定すると、どれか1つが偶然有意になる確率は5%より大きくなります。群が増えるほど、組み合わせは急増します（4群で6通り、8群で28通り）。</p>\n<p>さらに教科書は、もっと巧妙な落とし穴を指摘します。データを見て、<strong>平均が一番大きい群と一番小さい群</strong>を選んで検定する。これは「差が大きそうなペアを選んでから検定する」ことなので、実質的には<strong>全部の組み合わせを試したのと同じ</strong>です。教科書はこれを<strong>検察官の誤謬</strong>になぞらえています。</p>\n<h3>ANOVA の仮説</h3>\n<div class=\"formula\">H₀：μ₁ ＝ μ₂ ＝ … ＝ μk　　Hₐ：少なくとも1つの平均が違う</div>\n<h3>考え方：群間のばらつき vs 群内のばらつき</h3>\n<ul><li><strong>MSG</strong>（群間平均平方）：群の平均同士がどれくらい離れているか。自由度 k−1</li>\n<li><strong>MSE</strong>（平均平方誤差）：各群の中でのばらつき（プールした分散）。自由度 n−k</li></ul>\n<div class=\"formula\">F ＝ MSG ／ MSE</div>\n<p>H₀ が正しければ、群の平均の違いも群内のばらつき程度に収まるので、F は1前後。群の平均が本当に違えば MSG が大きくなり、F が大きくなる。p値は <strong>F分布</strong>（パラメータは df₁＝k−1、df₂＝n−k）の<strong>上側の裾</strong>です。</p>\n<h3>教科書の例：野球の出塁率</h3>\n<p>MLBの429選手の出塁率を、外野手・内野手・捕手の3群で比較。MSG＝0.00803、MSE＝0.00158、F＝<strong>5.08</strong>（df 2, 426）、p＝<strong>0.0066</strong>。少なくとも1つのポジションの平均出塁率が違う、と結論します。</p>\n<h3>ANOVA の3条件</h3>\n<ol><li><strong>独立性</strong>：群内・群間で独立（無作為抽出、無作為割付）</li>\n<li><strong>正規性</strong>：各群のデータがほぼ正規（外れ値チェック。各群のnが小さいときに特に重要）</li>\n<li><strong>分散一定</strong>：各群のばらつきがほぼ等しい（群のnが不揃いなときに特に重要）</li></ol>\n<p>第48話のTODAY研究は割合だったのでカイ二乗検定でしたが、HbA1c の<strong>値そのもの</strong>で3群を比べるなら ANOVA になります。どちらも「どこかに差がある」までしか言わない点は同じです。</p>", "keys": ["2群ずつ何度も検定すると第1種の過誤が膨らむ", "データを見て最大と最小の群を選んで検定するのは、全組み合わせを試したのと同じ", "ANOVA：H₀は全群の平均が等しい。F＝MSG/MSE（群間÷群内）", "p値はF分布（df₁＝k−1、df₂＝n−k）の上側の裾", "条件：独立性・各群の正規性・分散一定"], "upd": null, "quiz": [{"v": "", "q": "ANOVA の F統計量は。", "o": ["群内のばらつき÷群間のばらつき", "群間のばらつき（MSG）÷群内のばらつき（MSE）", "群の平均の差÷SE", "観測度数÷期待度数"], "a": 1, "e": "群の平均同士の離れ具合を、群内のばらつきと比べる。", "r": "OpenIntro 7章"}, {"v": "", "q": "4群、総数80人の ANOVA の自由度は。", "o": ["df₁＝3、df₂＝76", "df₁＝4、df₂＝80", "df₁＝3、df₂＝79", "df₁＝4、df₂＝76"], "a": 0, "e": "df₁＝k−1＝3、df₂＝n−k＝76。", "r": "OpenIntro 7章"}, {"v": "", "q": "データを見て平均が最大と最小の2群だけを選んでt検定する問題点は。", "o": ["検出力が下がる", "実質的に全組み合わせを試しているので第1種の過誤が膨らむ", "自由度が足りない", "問題はない"], "a": 1, "e": "差の大きいペアを選んでから検定すると、偶然の差を有意と判断しやすくなる。", "r": "OpenIntro 7章"}], "course": "stat"}, {"id": "s56", "lv": 3, "t": "多重比較とボンフェローニ補正", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §7.5.4–7.5.5", "vol": "統計 第7章 平均の推測", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>ANOVA で p＜0.05。先輩：「じゃあ、どの製剤とどの製剤が違うん？」。ここで初めて2群ずつ比べます。ただし、ルールつきで。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>何度も比べると偶然の「有意」が出やすい。<strong>比べる回数で有意水準を割る</strong>（ボンフェローニ補正）。</div><h3>ANOVA が有意だったら</h3>\n<p>ANOVA は「どこかに差がある」までしか言いません。どこかを知るには<strong>2群ずつの比較</strong>（多重比較）をしますが、比較の回数だけ有意水準を厳しくする必要があります。</p>\n<h3>ボンフェローニ補正</h3>\n<div class=\"formula\">α* ＝ α ／ K　（K＝比較の回数）</div>\n<p>k群のすべてのペアを比べるなら K＝k(k−1)/2。3群なら K＝3、α*＝0.05/3＝<strong>0.0167</strong>。各ペアの p値をこの α* と比べます。</p>\n<p>各ペアの t検定では、2群だけのSDではなく、ANOVA で得た<strong>プールしたSD（s_pooled）</strong>とその自由度を使います。</p>\n<h3>教科書の例：3つの統計学講義の中間試験</h3>\n<p>3講義（A、B、C）の中間試験の平均点を ANOVA で比較すると p＝<strong>0.033</strong>。少なくとも1つの講義の平均が違う。続けてボンフェローニ補正で3ペアを比較（s_pooled＝13.61、df＝161）：</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>ペア</th><th>p値</th><th>α*＝0.0167 と比べて</th></tr>\n<tr><td>A vs B</td><td>0.228</td><td>有意でない</td></tr>\n<tr><td>A vs C</td><td>0.146</td><td>有意でない</td></tr>\n<tr><td>B vs C</td><td>0.010</td><td><strong>有意</strong></td></tr></table></div>\n<p>B と C の間に差がある、という結論です。</p>\n<h3>ANOVA は有意なのに、どのペアも有意でないことがある</h3>\n<p>教科書は、この一見矛盾した状況も起こりうると述べています。ANOVA は全体として差を検出しても、ボンフェローニは保守的（厳しめ）なので、個々のペアでは届かないことがある。その場合は「差はどこかにあるが、どこかは特定できない」と報告します。</p>\n<h3>多重比較は研究のあちこちにある</h3>\n<ul><li>評価項目を複数見る（第53話のp-hacking）</li>\n<li>サブグループ解析（男児だけ、思春期前だけ…）</li>\n<li>中間解析を何度も行う</li></ul>\n<p>20個のサブグループを見れば、効果がなくても1つくらいは p＜0.05 になります（1−0.95²⁰≈64%、第29話の基準範囲と同じ計算）。論文で「○○のサブグループでのみ有意」とあったら、<strong>いくつ見た中の1つか</strong>を確認してください。</p>\n<h3>第7章の地図</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>話</th><th>覚えておくこと</th></tr>\n<tr><td>49</td><td>平均はt分布、df＝n−1。外れ値をチェック</td></tr>\n<tr><td>50</td><td>x̄ ± t*×s/√n。SDは個人差、SEは推定の揺れ</td></tr>\n<tr><td>51</td><td>対応ありは差をとる。個人差が消える</td></tr>\n<tr><td>52</td><td>2群の差のSEは分散を足してルート</td></tr>\n<tr><td>53</td><td>2値化は検出力を下げる。評価項目は事前に決める</td></tr>\n<tr><td>54</td><td>n＝7.84×(σ₁²＋σ₂²)/δ²</td></tr>\n<tr><td>55</td><td>3群以上はANOVA。F＝MSG/MSE</td></tr>\n<tr><td>56</td><td>多重比較はα/K。サブグループ解析に注意</td></tr></table></div>\n<p>先輩：「GHの効果、開始時の年齢や骨年齢でも違う気がする。そういうのはどうやって見るん？」「連続的な変数同士の関係を見るのが、次の第8章<strong>線形回帰</strong>」。</p>", "keys": ["ANOVAが有意なら2群ずつ比較するが、有意水準を補正する", "ボンフェローニ補正：α*＝α/K（Kは比較回数）。3群ならα*＝0.0167", "各ペアの比較にはANOVAのプールしたSDと自由度を使う", "ANOVAが有意でもどのペアも有意にならないことがある", "評価項目・サブグループ・中間解析も多重比較の問題。20個見れば約64%で1つは偶然有意"], "upd": null, "quiz": [{"v": "", "q": "4群のすべてのペアを比較するときのボンフェローニ補正後の有意水準は（α＝0.05）。", "o": ["0.0125", "0.0083", "0.0167", "0.05"], "a": 1, "e": "ペア数は4×3/2＝6。0.05/6≈0.0083。", "r": "OpenIntro 7章"}, {"v": "", "q": "3群の比較で α*＝0.0167。B vs C の p＝0.010、A vs B の p＝0.228。結論は。", "o": ["全ペアに差がある", "B と C の間に差がある", "A と B の間に差がある", "どのペアにも差はない"], "a": 1, "e": "0.010＜0.0167 なので B vs C のみ有意。", "r": "OpenIntro 7章"}, {"v": "", "q": "効果のない治療で、独立な20のサブグループ解析を行った。少なくとも1つで p＜0.05 になる確率は約。", "o": ["5%", "20%", "64%", "100%"], "a": 2, "e": "1−0.95²⁰≈0.64。", "r": "OpenIntro 7章"}], "course": "stat"}];
const ST8 = [{"id": "s57", "lv": 1, "t": "直線で関係を表す：回帰モデル", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §8.1.1–8.1.2", "vol": "統計 第8章 線形回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「GHの伸び、開始年齢が若い子ほど大きい気がする」。2群に分けるのではなく、<strong>年齢という連続的な変数</strong>との関係を見たい。第8章は線形回帰です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>2つの数値の関係を<strong>1本の直線</strong>で表すのが回帰。予測値は「その条件の人の平均」。</div><h3>完全な直線と、現実のデータ</h3>\n<p>株を買うときの総額は「株数×単価＋手数料」で、データは<strong>完全に直線</strong>に乗ります。でも医学のデータはそうはいきません。開始年齢が同じでも、伸びは子どもによって違う。データは直線の周りの<strong>点の雲</strong>になります。</p>\n<h3>線形回帰モデル</h3>\n<div class=\"formula\">y ＝ β₀ ＋ β₁x ＋ ε</div>\n<ul><li><strong>x</strong>：説明変数（予測変数）。例：GH開始年齢</li>\n<li><strong>y</strong>：反応変数（目的変数）。例：1年後のΔSDS</li>\n<li><strong>β₀</strong>（切片）と <strong>β₁</strong>（傾き）：モデルのパラメータ。データから推定した値を b₀、b₁ と書く</li>\n<li><strong>ε</strong>：誤差。直線では説明しきれない部分</li></ul>\n<p>予測値には帽子をつけて ŷ（ワイハット）と書きます。ε を書かないことが多いのは、関心が<strong>平均的な結果</strong>にあるからです。</p>\n<h3>教科書の例：フクロギツネ</h3>\n<p>オーストラリアの有袋類104匹の、体長（x, cm）と頭長（y, mm）。</p>\n<div class=\"formula\">ŷ ＝ 41 ＋ 0.59x</div>\n<p>体長80cmなら ŷ＝41＋0.59×80＝<strong>88.2mm</strong>。これは「体長80cmのフクロギツネの<strong>平均的な</strong>頭長」の推定です。1匹1匹はこの周りにばらつきます。</p>\n<h3>直線が役に立たないとき</h3>\n<p>関係がはっきりしていても、<strong>曲がった関係</strong>なら直線は役に立ちません。教科書の例では、斜面の角度と飛距離の関係が山なりで、最もよく当てはまる直線は<strong>水平線</strong>になってしまいます。</p>\n<p>小児で言えば、年齢と身長の関係は乳児期・前思春期・思春期で傾きが変わる<strong>曲線</strong>です。0〜18歳を1本の直線で表すのは無理があります。だからこそ、成長曲線は年齢ごとの平均とSDで描かれ、身長は<strong>SDSに変換してから</strong>解析することが多いのです。</p>\n<h3>まず散布図</h3>\n<p>回帰を始める前に、必ず散布図（第9話）を描きます。直線の周りに点が散らばっているか、曲がっていないか、飛び離れた点はないか。式を当てはめるのはその後です。</p>", "keys": ["線形回帰モデル：y＝β₀＋β₁x＋ε（xは説明変数、yは反応変数）", "データから推定した切片・傾きはb₀、b₁。予測値はŷ", "予測値は「そのxの人たちの平均的なy」の推定", "曲がった関係には直線は役に立たない。年齢と身長は曲線なのでSDSに変換して扱う", "回帰の前に必ず散布図を描く"], "upd": null, "quiz": [{"v": "", "q": "ŷ＝41＋0.59x で x＝80 のときの予測値は。", "o": ["47.2", "88.2", "121", "41"], "a": 1, "e": "41＋0.59×80＝88.2。", "r": "OpenIntro 8章"}, {"v": "", "q": "回帰モデル y＝β₀＋β₁x＋ε の ε は何を表すか。", "o": ["傾き", "切片", "直線で説明しきれない誤差", "予測値"], "a": 2, "e": "εは誤差。個々の観測値が直線からずれる部分。", "r": "OpenIntro 8章"}, {"v": "", "q": "0〜18歳の年齢と身長（cm）の関係を1本の直線で表すのが適切でない理由は。", "o": ["データが少ない", "関係が曲線で、時期によって傾きが変わる", "身長は連続変数でない", "相関がない"], "a": 1, "e": "成長は乳児期・思春期で速度が変わる曲線。直線は当てはまらない。", "r": "OpenIntro 8章"}], "course": "stat"}, {"id": "s58", "lv": 1, "t": "残差と相関係数", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §8.1.3–8.1.4", "vol": "統計 第8章 線形回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「この子は予測より0.3伸びた、あの子は予測より0.2足りなかった」。予測と実際のずれを数字にし、関係の強さを1つの数で表します。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>予測と実際のずれが<strong>残差</strong>。<strong>相関係数</strong>は直線的な関係の強さで、曲がった関係は測れない。</div><h3>残差</h3>\n<div class=\"formula\">残差 e ＝ 観測値 y − 予測値 ŷ</div>\n<p>フクロギツネの例：体長77.0cm、頭長85.3mm の個体。予測は 41＋0.59×77.0＝86.4、残差は 85.3−86.4＝<strong>−1.1</strong>。直線より下にある点は残差が負、上にある点は正です。</p>\n<h3>残差プロット</h3>\n<p>横軸に x（または ŷ）、縦軸に残差をとった図です。直線モデルが適切なら、残差は<strong>0の周りにでたらめに</strong>散らばります。</p>\n<ul><li>残差が<strong>U字やカーブ</strong>を描く → 関係は直線でない</li>\n<li>x が大きくなるほど残差の<strong>幅が広がる</strong> → ばらつきが一定でない</li></ul>\n<p>散布図では見えにくい「ずれのパターン」が、残差プロットだとはっきり見えます。</p>\n<h3>相関係数 R</h3>\n<p>2変数の<strong>直線的な</strong>関係の強さを表す数です。</p>\n<ul><li>−1 から ＋1 の値をとる</li>\n<li>＋1 に近い：強い正の直線関係、−1 に近い：強い負の直線関係</li>\n<li>0 に近い：直線的な関係が弱い</li>\n<li><strong>単位がない</strong>（cmでもインチでも同じ値）</li>\n<li>x と y を入れ替えても同じ値</li></ul>\n<h3>R の落とし穴</h3>\n<p><strong>R は直線的な関係しか測りません</strong>。教科書の図では、きれいな山なりの関係があるのに R はほぼ0、という例が示されています。「相関がない」と「関係がない」は別物です。</p>\n<p>小児内分泌で言えば、年齢とIGF-1の関係は思春期にピークを持つ山なりです。0〜18歳全体で相関係数を計算すると小さく出るかもしれませんが、関係がないわけではありません。<strong>R を見る前に、散布図を見る</strong>。第57話と同じ結論です。</p>\n<h3>相関は因果ではない</h3>\n<p>第3話でも見たとおり、R が大きくても因果関係の証拠にはなりません。観察データの R は「一緒に動く」ことを示すだけです。</p>", "keys": ["残差e＝y−ŷ。直線より上なら正、下なら負", "残差プロット：カーブや幅の広がりがあればモデルに問題", "相関係数R：−1〜＋1、単位なし、直線的な関係の強さ", "Rは直線的な関係しか測らない。山なりの強い関係でもR≈0になりうる", "相関は因果を意味しない"], "upd": null, "quiz": [{"v": "", "q": "予測値86.4、観測値85.3 のときの残差は。", "o": ["＋1.1", "−1.1", "85.3", "0"], "a": 1, "e": "e＝y−ŷ＝85.3−86.4＝−1.1。", "r": "OpenIntro 8章"}, {"v": "", "q": "相関係数 R＝0 のときに言えることは。", "o": ["2変数に関係がない", "直線的な関係がない（曲線的な関係はありうる）", "因果関係がない", "データが少ない"], "a": 1, "e": "Rは直線的な関係の強さ。山なりの関係ではR≈0になることがある。", "r": "OpenIntro 8章"}, {"v": "", "q": "残差プロットで、x が大きくなるにつれ残差の幅が広がっていた。示唆されることは。", "o": ["モデルは完璧", "ばらつきが一定という条件が満たされていない", "相関が強い", "外れ値がない"], "a": 1, "e": "残差のばらつきが一定でない（分散不均一）。", "r": "OpenIntro 8章"}], "course": "stat"}, {"id": "s59", "lv": 2, "t": "最小二乗法と係数の読み方", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §8.2.1–8.2.4", "vol": "統計 第8章 線形回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「直線って、どうやって1本に決めるん？　目分量？」。基準があります。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b><strong>ずれの二乗の合計が最小</strong>になる直線を選ぶ。傾きは「xが1違うとyが平均どれだけ違うか」。</div><h3>最小二乗法</h3>\n<p>最もよい直線とは、<strong>残差の二乗の合計が最小</strong>になる直線です。</p>\n<div class=\"formula\">e₁² ＋ e₂² ＋ … ＋ eₙ² を最小にする</div>\n<p>残差の絶対値の合計ではなく二乗を使う理由として、教科書は、最も一般的でソフトで簡単に計算できること、そして<strong>大きなずれを特に重く罰する</strong>ことを挙げています。4ずれる1点は、2ずれる2点より悪い、という考え方です（第45話のカイ二乗で二乗した理由と同じ）。</p>\n<h3>傾きと切片の求め方</h3>\n<div class=\"formula\">b₁ ＝ R × (s_y ／ s_x)　　直線は必ず (x̄, ȳ) を通る</div>\n<p>傾きは「相関 × yのSD ÷ xのSD」。切片は (x̄, ȳ) を通る条件から b₀＝ȳ−b₁x̄ で出ます。</p>\n<h3>4つの条件（LINE）</h3>\n<ol><li><strong>線形性</strong>：データに直線的な傾向がある</li>\n<li><strong>残差がほぼ正規分布</strong>：外れ値や影響点があると崩れやすい</li>\n<li><strong>ばらつきが一定</strong>：直線の周りの散らばりが x によらずほぼ同じ</li>\n<li><strong>独立な観測値</strong>：毎日の株価のような時系列データは独立でない</li></ol>\n<p>同じ子を何度も測ったデータ（成長曲線の経時データ）も独立ではありません。1人1点にするか、それを扱う専用の方法が要ります。</p>\n<h3>教科書の例：エルムハースト大学の奨学金</h3>\n<p>学生50人の、家計所得（x, 千ドル）と奨学金（y, 千ドル）。R＝−0.499。</p>\n<div class=\"formula\">ŷ ＝ 24.3 − 0.0431x</div>\n<ul><li><strong>傾き</strong>：家計所得が1,000ドル高いと、奨学金は<strong>平均して</strong>43.10ドル少ない</li>\n<li><strong>切片</strong>：家計所得0の学生の平均的な奨学金は約24,300ドル</li></ul>\n<h3>係数の読み方の注意</h3>\n<p>教科書は、これが<strong>観察データ</strong>なので因果的に解釈できないと強調します。「ある学生の家計所得が増えたら奨学金が減る」とは言えない。言えるのは「所得の高い家庭の学生は、平均的に奨学金が少ない」という<strong>集団の比較</strong>です。</p>\n<p>切片も、x＝0 がデータの範囲内にあるときだけ意味を持ちます。「開始年齢0歳のGH反応」は、0歳でGHを始めた子がデータにいなければ意味のない数字です。</p>", "keys": ["最小二乗法：残差の二乗和を最小にする直線。大きなずれを重く罰する", "b₁＝R×s_y/s_x。直線は(x̄, ȳ)を通る", "条件LINE：線形性・残差がほぼ正規・ばらつき一定・独立", "傾き＝xが1単位違うときのyの平均的な違い。観察データでは因果と読まない", "切片はx＝0がデータの範囲内のときだけ意味を持つ"], "upd": null, "quiz": [{"v": "", "q": "最小二乗法で最小にするのは。", "o": ["残差の合計", "残差の絶対値の合計", "残差の二乗の合計", "最大の残差"], "a": 2, "e": "残差の二乗和を最小にする。", "r": "OpenIntro 8章"}, {"v": "", "q": "R＝0.5、s_y＝10、s_x＝2 のときの傾きは。", "o": ["0.1", "1", "2.5", "5"], "a": 2, "e": "b₁＝R×s_y/s_x＝0.5×10/2＝2.5。", "r": "OpenIntro 8章"}, {"v": "", "q": "ŷ＝24.3−0.0431x（xは千ドル）の傾きの正しい解釈は。", "o": ["所得が1,000ドル増えると、その学生の奨学金は43ドル減る", "所得が1,000ドル高い学生は、平均して奨学金が43ドル少ない", "所得と奨学金に因果関係がある", "奨学金は所得の4.31%"], "a": 1, "e": "観察データなので集団の平均的な違いとして読む。", "r": "OpenIntro 8章"}], "course": "stat"}, {"id": "s60", "lv": 2, "t": "平均への回帰：ゴールトンと親子の身長", "min": 5, "cats": "", "src": "補足（OpenIntro §8.2 の傾きの式から）", "vol": "統計 第8章 線形回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「回帰」という変な名前。実は、小児内分泌医がいちばんよく知っている現象から生まれた言葉です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>極端な値で選んだ人は、次に測ると<strong>平均寄りに戻る</strong>。これが「回帰」という言葉の由来。</div><h3>ゴールトンの発見</h3>\n<p>19世紀、フランシス・ゴールトンは親子の身長を大量に集めました。そして、<strong>とても背の高い両親の子は背が高いが、両親ほど極端ではない</strong>ことに気づきます。背の低い両親の子も同様に、両親ほどは低くない。子の身長は集団の平均の方へ「戻る」。彼はこれを<strong>平均への回帰</strong>と呼び、ここから「回帰（regression）」という言葉が生まれました。<em>（この話は教科書の外の補足です）</em></p>\n<h3>傾きの式から説明できる</h3>\n<p>第59話の b₁＝R×s_y/s_x を、x と y を<strong>SDSに変換して</strong>から使うとどうなるか。SDSの標準偏差はどちらも1なので、</p>\n<div class=\"formula\">予測される y の SDS ＝ R × x の SDS</div>\n<p>相関 R が1より小さい限り、予測される y は x より<strong>必ず平均（0）寄り</strong>になります。たとえば親子の身長の相関が0.6なら、両親が＋2SDのとき子の予測は＋1.2SD。遺伝で説明できる部分（R）があり、それ以外の要因が平均の方へ引き戻す。<strong>R＜1 である限り、平均への回帰は必ず起こる</strong>。特別な生物学的な力ではなく、統計的な必然です。</p>\n<h3>臨床で出会う平均への回帰</h3>\n<p><strong>1. 目標身長</strong>：日本でよく使われる (父＋母＋13)／2（男児）、(父＋母−13)／2（女児）は両親の平均（性差を補正したもの）です。両親がとても高い／低い場合、実際の子の身長は目標身長より<strong>平均寄り</strong>になることが多い。目標身長の幅（±8〜9cm程度）が大きいのは、この不確かさを反映しています。</p>\n<p><strong>2. 低身長の初診</strong>：初診時にたまたま低く測れた子、成長がたまたま停滞した時期に受診した子は、何もしなくても次の測定で少し戻りやすい。第51話の「前後比較だけでは効果と言えない」理由の一つです。</p>\n<p><strong>3. 検査値の再検</strong>：TSHやIGF-1が1回目に異常値だった子は、2回目に正常範囲に戻ることがよくあります。異常値で選んだ集団は、再検で平均に寄る。基準範囲外の値は再検してから判断する、という臨床の習慣は統計的にも正しいのです。</p>\n<h3>介入研究で対照群が必要な理由</h3>\n<p>「身長SDSが−2.5以下の子を選んで治療したら、1年後に平均0.3改善した」。この0.3のうちどれだけが治療の効果で、どれだけが平均への回帰か。<strong>同じ基準で選んだ対照群</strong>がなければ区別できません。選択基準が極端であるほど、回帰の影響は大きくなります。</p>", "keys": ["平均への回帰：極端な値で選んだ集団は、次の測定で平均寄りになる", "SDSで考えると、予測されるyのSDS＝R×xのSDS。R＜1なら必ず平均寄り", "ゴールトンの親子の身長研究が「回帰」の語源", "目標身長、初診時の低身長、検査値の再検で臨床的に出会う", "極端な値で選んだ介入研究では、対照群がないと効果と回帰を区別できない"], "upd": null, "quiz": [{"v": "", "q": "親子の身長のSDSの相関が0.5。両親（中間値）が＋2SDのとき、子の予測SDSは。", "o": ["＋2.0", "＋1.0", "＋0.5", "0"], "a": 1, "e": "予測SDS＝R×xのSDS＝0.5×2＝1.0。", "r": "OpenIntro 8章"}, {"v": "", "q": "平均への回帰が起こる理由は。", "o": ["生物学的に平均へ戻る力が働く", "相関が1未満なので、予測値は必ず平均寄りになる", "測定ミスが多い", "標本が小さい"], "a": 1, "e": "統計的な必然。特別な力ではない。", "r": "OpenIntro 8章"}, {"v": "", "q": "初診時に身長SDS −2.5以下の子だけを選んで治療し、1年後に平均0.3改善した。正しい解釈は。", "o": ["治療効果は0.3", "改善の一部は平均への回帰の可能性があり、対照群なしでは区別できない", "治療は無効", "測定が誤っている"], "a": 1, "e": "極端な値で選んだ集団は、治療しなくても平均寄りになりやすい。", "r": "OpenIntro 8章"}], "course": "stat"}, {"id": "s61", "lv": 2, "t": "外挿の危険と決定係数R²", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §8.2.5–8.2.6", "vol": "統計 第8章 線形回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「開始年齢と伸びの回帰式、15歳で始めた子にも当てはめていい？」。ダメな理由がちゃんとあります。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>回帰式は<strong>データの範囲の外では使わない</strong>。R²は「yのばらつきの何割を説明できるか」。</div><h3>あてにならない外挿</h3>\n<p>エルムハースト大学の式 ŷ＝24,319−0.0431×(家計所得) に、所得100万ドルを入れると</p>\n<div class=\"formula\">24,319 − 0.0431 × 1,000,000 ＝ <strong>−18,781ドル</strong></div>\n<p>奨学金がマイナス、つまり大学に払うことになります。データにあった所得の範囲は100万ドルよりずっと下でした。</p>\n<p>データの範囲の外で予測することを<strong>外挿</strong>と呼びます。線形モデルは、あくまで<strong>データのある範囲での近似</strong>です。範囲の外で関係が直線のまま続く保証はありません。</p>\n<h3>先輩のデータで考える</h3>\n<p>開始年齢4〜10.5歳の31人で、1年後のΔSDSの回帰式が ŷ＝1.34−0.099×(開始年齢) になったとします（物語用のデータ）。</p>\n<ul><li>4歳：0.95</li><li>7歳：0.65</li><li>10歳：0.36</li><li><strong>15歳：−0.14</strong>（外挿）</li></ul>\n<p>15歳の予測は「GHを打つと身長SDSが下がる」になってしまいます。実際には、思春期は自前の成長スパートがあり、骨端線の閉鎖も近づくので、前思春期とは<strong>まったく別の関係</strong>です。教科書の練習問題にも、成人のデータの式を<strong>1歳児</strong>に当てはめてよいか問うものがあります。答えは同じく「範囲外なので不適切」です。</p>\n<h3>決定係数 R²</h3>\n<p>直線がデータのばらつきを<strong>どれだけ説明できるか</strong>を表す数です。</p>\n<div class=\"formula\">R² ＝ (yの分散 − 残差の分散) ／ yの分散</div>\n<p>単回帰では、相関係数を二乗したものに等しくなります。</p>\n<ul><li>エルムハースト：R＝−0.499 → R²＝<strong>0.25</strong>。奨学金のばらつきの25%を家計所得で説明できる</li>\n<li>先輩のデータ：R＝−0.47 → R²＝<strong>0.22</strong>。ΔSDSのばらつきの22%を開始年齢で説明できる</li></ul>\n<h3>R²の読み方</h3>\n<p>R²＝0.22 は「開始年齢は関係あるが、伸びの個人差の<strong>8割近くは別の要因</strong>」という意味です。骨年齢、GH分泌能、用量、アドヒアランス、遺伝的背景…。だから、1つの変数で個々の子の伸びを正確に予測するのは難しい。複数の変数を同時に使うのが、第9章の<strong>重回帰</strong>です。</p>\n<p>逆に R² が小さくても、関係が<strong>統計的に確か</strong>で臨床的に意味があることはあります（第64話）。「説明力が小さい」と「関係がない」は別物です。</p>", "keys": ["外挿：データの範囲外で予測すること。直線関係が続く保証はない", "エルムハーストの式に所得100万ドルを入れると奨学金がマイナスになる", "思春期は前思春期とまったく別の関係。範囲外への適用は不適切", "R²＝直線で説明できるyのばらつきの割合。単回帰ではR²＝相関係数²", "R²が小さいことは関係がないことを意味しない"], "upd": null, "quiz": [{"v": "", "q": "データの範囲外で回帰式を使って予測することを何と呼ぶか。", "o": ["内挿", "外挿", "残差", "回帰"], "a": 1, "e": "外挿。直線関係が範囲外でも続く保証はない。", "r": "OpenIntro 8章"}, {"v": "", "q": "相関係数 R＝−0.5 の単回帰の決定係数は。", "o": ["−0.25", "0.25", "0.5", "0.71"], "a": 1, "e": "R²＝(−0.5)²＝0.25。", "r": "OpenIntro 8章"}, {"v": "", "q": "R²＝0.22 の解釈として正しいのは。", "o": ["22人の予測が正しい", "yのばらつきの22%を説明変数で説明できる", "関係が22%の確率で本物", "相関が0.22"], "a": 1, "e": "R²は説明できるばらつきの割合。", "r": "OpenIntro 8章"}], "course": "stat"}, {"id": "s62", "lv": 2, "t": "カテゴリーの説明変数：ダミー変数", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §8.2.7", "vol": "統計 第8章 線形回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「説明変数が男女みたいなカテゴリーやったら、回帰は使えんの？」。0と1に置き換えれば使えます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>男女のようなカテゴリーも<strong>0と1に置き換えれば</strong>回帰に入れられる。傾き＝2群の平均の差。</div><h3>指示変数（ダミー変数）</h3>\n<p>2つの水準があるカテゴリー変数は、一方を0、他方を1にした<strong>指示変数</strong>（ダミー変数）にすれば回帰に入れられます。第30話のベルヌーイ変数と同じ発想です。</p>\n<h3>教科書の例：マリオカートの落札価格</h3>\n<p>eBayのオークションで、ゲームが新品（cond_new＝1）か中古（0）かで価格を予測。</p>\n<div class=\"formula\">価格 ＝ 42.87 ＋ 10.90 × cond_new</div>\n<ul><li><strong>切片 42.87</strong>：cond_new＝0、つまり<strong>中古の平均価格</strong></li>\n<li><strong>傾き 10.90</strong>：新品は中古より<strong>平均して10.90ドル高い</strong></li></ul>\n<p>x が0と1しかとらないので、「x が1単位増える」は「中古から新品に変わる」と同じ意味です。</p>\n<h3>2群の平均の差と同じもの</h3>\n<p>カテゴリー変数1つだけの回帰の傾きは、<strong>2群の平均の差</strong>そのものです。傾きの検定は、第52話の2群のt検定（分散が等しいと仮定したもの）と同じ結果になります。第48話で「2×2表のカイ二乗とZ検定は同じ」と見たのと同じで、統計の手法は別々の道具に見えて、根っこでつながっています。</p>\n<h3>条件</h3>\n<p>2水準の説明変数では、2点を結ぶだけなので<strong>線形性は常に満たされます</strong>。ただし、各群の残差がほぼ正規で、<strong>ばらつきがほぼ等しい</strong>かは確認が必要です。</p>\n<h3>医学での例</h3>\n<ul><li>ΔSDS ＝ b₀ ＋ b₁ × (男児＝1)：b₁ は男女の平均的な伸びの差</li>\n<li>HbA1c ＝ b₀ ＋ b₁ × (ポンプ使用＝1)：b₁ はポンプ群と注射群の平均の差</li></ul>\n<h3>なぜ回帰でやるのか</h3>\n<p>t検定で済むなら、なぜわざわざ回帰に入れるのか。理由は、<strong>他の変数と一緒に入れられる</strong>からです。「男女の差を、開始年齢の違いを考慮したうえで見たい」。これが第9章の重回帰で、ダミー変数はその入口です。3つ以上の水準（例：3種類のGH製剤）も、ダミー変数を複数作れば扱えます。</p>", "keys": ["2水準のカテゴリー変数は0/1の指示変数（ダミー変数）にして回帰に入れる", "切片＝0の群の平均、傾き＝1の群と0の群の平均の差", "マリオカート：中古42.87ドル、新品は平均10.90ドル高い", "ダミー変数1つの回帰の傾きの検定は2群のt検定と同じ", "回帰にする利点は、他の変数と同時にモデルに入れられること（重回帰へ）"], "upd": null, "quiz": [{"v": "", "q": "価格＝42.87＋10.90×cond_new（新品＝1）。新品の予測価格は。", "o": ["10.90", "42.87", "53.77", "32.0"], "a": 2, "e": "42.87＋10.90×1＝53.77。", "r": "OpenIntro 8章"}, {"v": "", "q": "ダミー変数1つだけの回帰で、切片が表すのは。", "o": ["全体の平均", "0の群の平均", "1の群の平均", "2群の差"], "a": 1, "e": "x＝0のときの予測値＝0の群の平均。", "r": "OpenIntro 8章"}, {"v": "", "q": "ダミー変数1つの回帰の傾きの検定と同等なのは。", "o": ["カイ二乗適合度検定", "2群の平均の差のt検定", "対応のあるt検定", "ANOVAの多重比較"], "a": 1, "e": "傾き＝2群の平均の差。その検定はt検定と同じ。", "r": "OpenIntro 8章"}], "course": "stat"}, {"id": "s63", "lv": 3, "t": "外れ値・てこ比・影響点", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §8.3", "vol": "統計 第8章 線形回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>散布図の右端に、ぽつんと1人。「この子だけ12歳開始で、伸びもすごく小さい。外す？」。その前に、その点がどんな種類の外れ値かを見ます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>外れ値には直線を<strong>大きく引っ張るもの</strong>とそうでないものがある。理由なく除いてはいけない。</div><h3>回帰における外れ値</h3>\n<p>直線の周りの雲から<strong>大きく外れた点</strong>が外れ値です。でも、外れ値がすべて同じように回帰直線に影響するわけではありません。</p>\n<h3>てこ比（レバレッジ）</h3>\n<p>x の方向で、データの中心から<strong>水平に遠く離れた</strong>点を<strong>高レバレッジ点</strong>と呼びます。シーソーの端に座る人のように、少しの重さで傾き（＝回帰直線の傾き）を大きく動かせる位置にいる点です。</p>\n<h3>影響点</h3>\n<p>高レバレッジ点のうち、実際に<strong>回帰直線の傾きを大きく変えている</strong>点を<strong>影響点</strong>と呼びます。見分け方は簡単で、<strong>その点を除いて直線を引き直すと、大きく変わるか</strong>。</p>\n<p>教科書の図では、いくつかのパターンが並べられています。</p>\n<ul><li>雲の真ん中あたりの高さで縦に外れた点：直線への影響は<strong>小さい</strong></li>\n<li>x の端にあって、直線の延長線上にある点：高レバレッジだが傾きは<strong>ほとんど変えない</strong></li>\n<li>x の端にあって、直線から外れた点：<strong>直線を引っ張り、影響点</strong>になる</li></ul>\n<h3>外していいか</h3>\n<p>教科書ははっきり言います。外れ値を除いて分析したい誘惑はあるが、<strong>正当な理由なく除いてはいけない</strong>。</p>\n<ul><li><strong>除く正当な理由</strong>：入力ミス、測定ミス、研究対象外（例：後から別の診断がついた）</li>\n<li><strong>除いてはいけない理由</strong>：「結果が悪くなるから」「直線に乗らないから」</li></ul>\n<p>本物の外れ値は、しばしば一番面白い情報を持っています。12歳開始で伸びが小さかったのは、すでに思春期に入っていたからかもしれない。それは「GHは思春期前に始めるべき」という臨床的な知見そのものです。</p>\n<h3>正直な報告の仕方</h3>\n<ul><li>影響点が疑われるときは、<strong>その点を含めた解析と除いた解析の両方</strong>を報告する（感度分析）</li>\n<li>除いた場合は、<strong>何を、なぜ</strong>除いたかを明記する</li></ul>\n<p>教科書の中間選挙の例（次の話）では、失業率が21%と18%だった大恐慌期の2回の選挙を除いています。極端な失業率の年は、少し失業率が高い普通の年について何も教えてくれない、という理由が明記されています。</p>", "keys": ["外れ値：直線の周りの雲から大きく外れた点", "高レバレッジ点：xの方向で中心から遠い点。傾きを動かす力がある", "影響点：実際に回帰直線を大きく変える点。除いて引き直すと分かる", "入力ミスなど正当な理由なく外れ値を除いてはいけない", "含めた解析と除いた解析の両方を報告し、除いた理由を明記する"], "upd": null, "quiz": [{"v": "", "q": "x の方向で他の点から水平に大きく離れた点を何と呼ぶか。", "o": ["残差", "高レバレッジ点", "中央値", "決定係数"], "a": 1, "e": "高レバレッジ点。回帰直線の傾きを動かす力がある。", "r": "OpenIntro 8章"}, {"v": "", "q": "ある点が影響点かどうかを確認する方法は。", "o": ["残差が正かどうか見る", "その点を除いて直線を引き直し、大きく変わるか見る", "R²が1に近いか見る", "p値を見る"], "a": 1, "e": "除いたときに傾きが大きく変わるなら影響点。", "r": "OpenIntro 8章"}, {"v": "", "q": "外れ値を除くことが正当化されるのは。", "o": ["結果が有意でなくなるとき", "入力ミスや研究対象外であることが分かったとき", "直線に乗らないとき", "p値が0.05を超えるとき"], "a": 1, "e": "データとして誤りがある、または対象外という理由が必要。", "r": "OpenIntro 8章"}], "course": "stat"}, {"id": "s64", "lv": 3, "t": "回帰係数の推測：傾きは0と違うか", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §8.4", "vol": "統計 第8章 線形回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「傾き −0.099。これって偶然じゃないって言える？」。第5〜7章の推測の枠組みを、回帰の傾きに当てはめます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>回帰の<strong>傾きが0と違うか</strong>も検定できる。有意でも、観察データなら交絡の可能性は残る。</div><h3>傾きの仮説検定</h3>\n<div class=\"formula\">H₀：β₁ ＝ 0（xとyに直線関係はない）　　Hₐ：β₁ ≠ 0</div>\n<div class=\"formula\">T ＝ (b₁ − 0) ／ SE(b₁)、自由度 df ＝ n − 2</div>\n<p>自由度が n−2 なのは、切片と傾きの2つを推定しているからです。実際には統計ソフトが、推定値・標準誤差・t値・p値を一覧表（回帰出力）で出してくれます。</p>\n<h3>例1：中間選挙と失業率（有意でない）</h3>\n<p>「失業率が高いと、大統領の政党は中間選挙で議席を失う」という政治理論。1898〜2018年の中間選挙（大恐慌期を除く）で回帰すると、</p>\n<div class=\"formula\">議席の変化(%) ＝ −7.36 − 0.89 × 失業率、p ＝ <strong>0.30</strong></div>\n<p>傾きは負ですが、0と区別できません。失業率が中間選挙の結果を説明するという<strong>強い証拠はない</strong>。散布図を見ると直線らしく見えても、検定してみると偶然で十分説明できる、という例です。</p>\n<h3>例2：エルムハースト大学（有意）</h3>\n<p>b₁＝−0.0431、SE＝0.0108、T＝<strong>−3.98</strong>、df＝48、p＝<strong>0.0002</strong>。家計所得と奨学金の間には確かな負の関係がある。</p>\n<h3>傾きの信頼区間</h3>\n<div class=\"formula\">b₁ ± t*df × SE(b₁)</div>\n<p>エルムハースト：−0.0431 ± 2.01×0.0108 → <strong>(−0.065, −0.021)</strong>。所得が1,000ドル高いと、奨学金は平均21〜65ドル少ない、と95%の信頼で言えます。</p>\n<h3>先輩のデータ</h3>\n<p>開始年齢とΔSDS（31人、物語用のデータ）：b₁＝−0.099、SE＝0.035。</p>\n<ul><li>T ＝ −0.099／0.035 ≈ <strong>−2.85</strong>、df＝29、p ≈ <strong>0.008</strong></li>\n<li>95% CI：−0.099 ± 2.05×0.035 → <strong>(−0.17, −0.03)</strong></li></ul>\n<p>「開始が1歳遅いと、1年後のΔSDSは平均0.03〜0.17小さい」。第61話で見たように R²＝0.22 と説明力は大きくありませんが、関係そのものは<strong>統計的に確か</strong>です。</p>\n<h3>傾きが有意でも</h3>\n<ul><li>これは<strong>観察データ</strong>。若く始めた子は、診断が早い＝症状が強い、家族の関心が高い、など他の違いも持っているかもしれない（第5話の交絡）</li>\n<li>4〜10.5歳の範囲での話。<strong>外挿しない</strong></li>\n<li>条件（LINE）を残差プロットで確認してから信じる</li></ul>\n<h3>第8章の地図</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>話</th><th>覚えておくこと</th></tr>\n<tr><td>57</td><td>y＝β₀＋β₁x＋ε。まず散布図</td></tr>\n<tr><td>58</td><td>残差＝y−ŷ。Rは直線関係のみ</td></tr>\n<tr><td>59</td><td>最小二乗、b₁＝R·s_y/s_x、条件LINE</td></tr>\n<tr><td>60</td><td>平均への回帰。予測SDS＝R×SDS</td></tr>\n<tr><td>61</td><td>外挿しない。R²＝説明できる割合</td></tr>\n<tr><td>62</td><td>ダミー変数。傾き＝群の平均の差</td></tr>\n<tr><td>63</td><td>レバレッジと影響点。理由なく除かない</td></tr>\n<tr><td>64</td><td>T＝b₁/SE、df＝n−2</td></tr></table></div>\n<p>先輩：「若く始めた子が、たまたま骨年齢も遅れとった、とかやったら？」「そう、年齢と骨年齢の<strong>両方を同時に</strong>モデルに入れて、それぞれの影響を分けて見たい。それが最終章、第9章<strong>重回帰とロジスティック回帰</strong>」。</p>", "keys": ["傾きの検定：H₀：β₁＝0、T＝b₁/SE、df＝n−2", "中間選挙と失業率：傾きは負でもp＝0.30で強い証拠なし", "傾きの信頼区間：b₁ ± t*×SE。エルムハースト (−0.065, −0.021)", "先輩のデータ：T≈−2.85、p≈0.008、R²は小さくても関係は確か", "有意でも観察データなら交絡に注意。外挿しない。残差で条件確認"], "upd": null, "quiz": [{"v": "", "q": "n＝31 の単回帰で傾きの検定に使う自由度は。", "o": ["29", "30", "31", "2"], "a": 0, "e": "切片と傾きを推定するのでdf＝n−2＝29。", "r": "OpenIntro 8章"}, {"v": "", "q": "b₁＝−0.0431、SE＝0.0108 のときの t値は約。", "o": ["−0.40", "−3.98", "−0.05", "2.01"], "a": 1, "e": "−0.0431/0.0108≈−3.99。", "r": "OpenIntro 8章"}, {"v": "", "q": "観察データで傾きが有意だったとき、正しい解釈は。", "o": ["xを変えればyが変わる（因果）", "xとyに統計的に確かな関連がある。交絡の可能性は残る", "R²が大きい", "外挿してもよい"], "a": 1, "e": "有意な傾きは関連の証拠。観察データでは因果までは言えない。", "r": "OpenIntro 8章"}], "course": "stat"}];
const ST9 = [{"id": "s65", "lv": 1, "t": "重回帰：複数の要因を同時に見る", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §9.1.1–9.1.2", "vol": "統計 第9章 重回帰とロジスティック回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「若く始めた子ほど伸びる。でも、若い子って骨年齢の遅れも大きいんよな。効いとるのは年齢？骨年齢？」。1本の直線では答えられない問いです。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>説明変数を<strong>2つ以上同時に</strong>入れると、「<strong>他の変数をそろえたうえで</strong>」それぞれがどれだけ効いているかを見られる。</div><h3>重回帰モデル</h3>\n<div class=\"formula\">y ＝ β₀ ＋ β₁x₁ ＋ β₂x₂ ＋ … ＋ βₖxₖ ＋ ε</div>\n<p>第8章の直線に、説明変数を足していくだけです。計算は統計ソフトが最小二乗法でやってくれます。読み手として大事なのは<strong>係数の意味</strong>です。</p>\n<div class=\"formula\">β₁ ＝ <strong>他の説明変数が同じ値なら</strong>、x₁ が1違うと y が平均どれだけ違うか</div>\n<h3>教科書の例：ローンの金利</h3>\n<p>個人向けローン1万件の金利を予測します。「過去に破産歴があるか」だけで回帰すると、破産歴ありは金利が<strong>0.74%</strong>高い。ところが、所得の証明、借入比率、信用枠の使用率など他の変数も一緒に入れると、破産歴の係数は<strong>0.39%</strong>に縮みます。</p>\n<p>なぜか。破産歴のある人は、借入比率が高いなど<strong>他の不利な条件も持っている</strong>ことが多い。単回帰の0.74には、それらの影響が混ざっていた。重回帰で他の変数をそろえると、破産歴<strong>そのもの</strong>の分だけが残ります。第5話の<strong>交絡</strong>を、統計的に調整しているのです。</p>\n<h3>先輩のデータで（物語用の数値）</h3>\n<p>GH治療31人。年齢と骨年齢の遅れ（暦年齢−骨年齢、年）は相関 −0.76 と強く、若い子ほど骨年齢が遅れています。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>モデル</th><th>開始年齢の係数</th><th>骨年齢の遅れの係数</th></tr>\n<tr><td>年齢だけ</td><td>−0.10（p＝0.002）</td><td>—</td></tr>\n<tr><td>年齢＋骨年齢の遅れ</td><td>＋0.01（p＝0.80）</td><td><strong>＋0.45</strong>（p＝0.001）</td></tr></table></div>\n<p>年齢だけで見ると「若いほど伸びる」。でも骨年齢の遅れをそろえると、年齢の効果は<strong>ほぼ消える</strong>。代わりに「骨年齢が1年遅れているごとに、ΔSDSが平均0.45大きい」。伸びしろ（骨端線が開いている度合い）が本体で、年齢はその<strong>代理</strong>だった、という解釈になります。</p>\n<h3>それでも残る限界</h3>\n<p>重回帰で調整できるのは、<strong>測ってモデルに入れた変数だけ</strong>です。GH分泌能やアドヒアランスなど、測っていない交絡はそのまま残ります。教科書も「他の潜在変数からの偏りは常に生じうる」と注意しています。だから、因果を言うにはやはりランダム化が最強です。</p>", "keys": ["重回帰：y＝β₀＋β₁x₁＋…＋βₖxₖ＋ε", "係数は「他の説明変数が同じ値なら」xが1違うときのyの平均的な違い", "単回帰の係数には他の変数の影響が混ざる。重回帰で交絡を統計的に調整できる", "例：破産歴の係数は単回帰0.74→重回帰0.39", "調整できるのはモデルに入れた変数だけ。測っていない交絡は残る"], "upd": null, "quiz": [{"v": "", "q": "重回帰での係数 β₁ の正しい解釈は。", "o": ["x₁ と y の相関係数", "他の説明変数が同じ値のとき、x₁ が1違うと y が平均どれだけ違うか", "x₁ だけで y を予測したときの傾き", "x₁ の重要度の順位"], "a": 1, "e": "「他をそろえたうえで」の効果。単回帰の傾きとは一般に違う。", "r": "OpenIntro 9章"}, {"v": "", "q": "年齢だけでは有意だった係数が、骨年齢の遅れを加えるとほぼ0になった。最も適切な解釈は。", "o": ["年齢は本当に重要", "計算ミス", "年齢の効果は骨年齢の遅れを通じたもの（代理）だった可能性が高い", "骨年齢は無関係"], "a": 2, "e": "骨年齢をそろえると年齢の効果が消える＝年齢は骨年齢の代理だった。", "r": "OpenIntro 9章"}, {"v": "", "q": "重回帰で調整できない交絡は。", "o": ["モデルに入れた変数による交絡", "測定していない変数による交絡", "カテゴリー変数による交絡", "すべて調整できる"], "a": 1, "e": "測っていない変数は調整できない。ランダム化が最強の理由。", "r": "OpenIntro 9章"}], "course": "stat"}, {"id": "s66", "lv": 2, "t": "係数の読み方と共線性", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §9.1.2, §9.4", "vol": "統計 第9章 重回帰とロジスティック回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「さっきの表、年齢の係数がマイナスからプラスに変わったんやけど、そんなことある？」。よくあります。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>説明変数同士が強く相関していると（<strong>共線性</strong>）、係数は入れる変数の組み合わせで大きく変わり、不安定になる。</div><h3>教科書の例：マリオカートの価格</h3>\n<p>第62話では、新品か中古かだけで回帰して「新品は10.90ドル高い」でした。重回帰で他の変数も入れると、</p>\n<div class=\"formula\">価格 ＝ 36.21 ＋ 5.13×新品 ＋ 1.08×写真あり − 0.03×出品日数 ＋ 7.29×ハンドル数</div>\n<p>新品の効果は<strong>10.90 → 5.13</strong>に半減。新品のゲームには<strong>Wiiハンドルが付いていることが多く</strong>、単回帰ではハンドルの価値まで「新品の効果」に含まれていたのです。</p>\n<p>ハンドル数の係数 7.29 の読み方：「新品か中古か、写真の有無、出品日数が<strong>同じなら</strong>、ハンドルが1個多いと平均7.29ドル高い」。</p>\n<h3>共線性</h3>\n<p>説明変数同士が相関していることを<strong>共線性</strong>と呼びます。観察データでは避けられません（年齢と骨年齢、身長と体重、BMIと腹囲…）。共線性が強いと、</p>\n<ul><li>係数の<strong>標準誤差が大きく</strong>なる（どちらの変数の効果か分けにくい）</li>\n<li>変数を足したり抜いたりすると係数が<strong>大きく変わる</strong>、符号が逆転することもある</li></ul>\n<p>先輩のデータで年齢の係数が −0.10 → ＋0.01 と変わったのは、年齢と骨年齢の遅れの相関が −0.76 と強かったからです。</p>\n<h3>実験なら避けられる</h3>\n<p>教科書は、観察データでは共線性を防げないが、<strong>実験</strong>なら説明変数同士が相関しないように設計できる、と述べています。ランダム化で治療を割り付ければ、治療と他の変数は（平均的に）無相関になります。</p>\n<h3>切片の意味</h3>\n<p>ローンの例の切片1.925は「所得証明なし、借入ゼロ、信用枠の使用ゼロ…」の人の金利。教科書は、全部の変数が0という人は現実的でないので、<strong>切片そのものに解釈の価値はあまりない</strong>と述べています。第59話と同じで、切片は「式を成り立たせる部品」と考えれば十分です。</p>\n<h3>予測は「平均」</h3>\n<p>重回帰の式で出るのは、その条件の人たちの<strong>平均的な</strong>値です。マリオカートの売り手が予測価格どおりに売れなくても驚くことはない、と教科書は言います。患者さんの予測身長も同じで、式から出る値はあくまで「同じ条件の子の平均」です。</p>", "keys": ["他の変数を加えると係数は変わる（マリオカートの新品効果10.90→5.13）", "係数は「他が同じなら」で読む", "共線性：説明変数同士の相関。SEが大きくなり、係数が不安定になる", "観察データでは共線性は避けられない。実験なら設計で防げる", "切片は全変数0の値で、解釈の価値が乏しいことが多い。予測は平均値"], "upd": null, "quiz": [{"v": "", "q": "説明変数同士が強く相関していることを何と呼ぶか。", "o": ["交互作用", "共線性", "外挿", "残差"], "a": 1, "e": "共線性（多重共線性）。係数が不安定になる。", "r": "OpenIntro 9章"}, {"v": "", "q": "共線性が強いときに起こりやすいことは。", "o": ["係数の標準誤差が小さくなる", "係数が変数の組み合わせで大きく変わり、符号が逆転することもある", "R²が必ず0になる", "予測ができなくなる"], "a": 1, "e": "どちらの変数の効果かを分けにくく、係数が不安定。", "r": "OpenIntro 9章"}, {"v": "", "q": "マリオカートで新品の効果が単回帰10.90から重回帰5.13に減った主な理由は。", "o": ["計算誤差", "新品にはハンドルが付いていることが多く、その価値が単回帰に混ざっていた", "中古の方が高いから", "標本が小さい"], "a": 1, "e": "ハンドル数という交絡が単回帰の係数に含まれていた。", "r": "OpenIntro 9章"}], "course": "stat"}, {"id": "s67", "lv": 2, "t": "自由度修正R²：変数を増やせば良いわけではない", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §9.1.3", "vol": "統計 第9章 重回帰とロジスティック回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「変数をいっぱい入れたらR²がどんどん上がる！全部入れよう」。それは罠です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>普通のR²は変数を足すだけで必ず上がる。<strong>余計な変数にペナルティをかけた修正R²</strong>でモデルの良さを比べる。</div><h3>R² は下がらない</h3>\n<p>R²＝1−(残差の分散／yの分散)。説明変数を1つ足すと、最小二乗法はその変数を「使える分だけ使う」ので、残差は<strong>必ず同じか小さく</strong>なります。たとえ<strong>サイコロの目</strong>のような無関係な変数でも、偶然の分だけR²は上がる。</p>\n<p>その結果、変数を詰め込んだモデルは、手元のデータにはよく当てはまるのに、<strong>新しいデータでは予測が外れる</strong>。これを<strong>過剰適合（オーバーフィッティング）</strong>と呼びます。</p>\n<h3>自由度修正 R²</h3>\n<div class=\"formula\">R²adj ＝ 1 − (残差の分散 ／ yの分散) × (n − 1) ／ (n − k − 1)</div>\n<p>k は説明変数の数。変数を増やすと (n−1)/(n−k−1) が大きくなり、<strong>ペナルティ</strong>がかかります。</p>\n<ul><li>役に立つ変数を足す → 残差の減りがペナルティを上回り、R²adj は上がる</li>\n<li>役に立たない変数を足す → R²adj は<strong>下がることがある</strong></li></ul>\n<p>R²adj は普通の R² より（多くは少しだけ）小さくなります。教科書は、新しいデータに当てはめたとき元の R² は楽観的すぎるが、修正 R² はその偏りを補正してくれる、と説明しています。</p>\n<h3>先輩のデータ</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>モデル</th><th>R²</th><th>R²adj</th></tr>\n<tr><td>年齢だけ</td><td>0.28</td><td>0.25</td></tr>\n<tr><td>年齢＋骨年齢の遅れ</td><td>0.51</td><td>0.48</td></tr></table></div>\n<p>骨年齢の遅れを足すと R²adj も大きく上がる。この変数は<strong>本当に役に立っている</strong>と言えます。</p>\n<h3>n が小さいときほど注意</h3>\n<p>n−k−1 が分母にあるので、n が小さいのに k が大きいと、ペナルティは急に大きくなります。極端な話、31人のデータに30個の変数を入れれば R² は1になりますが、何の意味もありません。</p>\n<p>教科書の外の目安として、医学研究ではよく「<strong>説明変数1個あたり10〜15人</strong>（ロジスティック回帰ならイベント10〜15件）」と言われます。31人なら変数は2〜3個が限度。先輩のモデルが2変数なのは、ちょうどよいところです。</p>", "keys": ["R²は変数を足すと必ず同じか大きくなる。無関係な変数でも上がる", "変数を詰め込むと手元のデータに過剰適合し、新しいデータで外れる", "修正R²＝変数の数にペナルティをかけたR²。役に立たない変数で下がることがある", "単回帰では修正R²とR²はほぼ同じ", "目安：説明変数1個あたり10〜15人（ロジスティックならイベント10〜15件）"], "upd": null, "quiz": [{"v": "", "q": "無関係な説明変数をモデルに加えたとき、普通の R² は。", "o": ["必ず下がる", "同じか上がる", "必ず0になる", "変わらない"], "a": 1, "e": "最小二乗法は偶然の分も使うので、R²は下がらない。", "r": "OpenIntro 9章"}, {"v": "", "q": "自由度修正 R² の特徴は。", "o": ["常にR²より大きい", "説明変数の数にペナルティをかける", "nが大きいほど小さくなる", "p値と同じ"], "a": 1, "e": "役に立たない変数を加えると下がることがある。", "r": "OpenIntro 9章"}, {"v": "", "q": "手元のデータにはよく当てはまるが新しいデータで予測が外れる状態は。", "o": ["共線性", "過剰適合", "外挿", "平均への回帰"], "a": 1, "e": "変数を詰め込みすぎたモデルで起こる。", "r": "OpenIntro 9章"}], "course": "stat"}, {"id": "s68", "lv": 3, "t": "モデル選択：どの変数を残すか", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §9.2", "vol": "統計 第9章 重回帰とロジスティック回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「候補の変数は10個ある。どれを入れる？」。教科書は2つの機械的な方法を紹介しています。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>変数を<strong>1つずつ抜く（後退）か、1つずつ足す（前進）</strong>して、修正R²やp値が改善しなくなったら止める。ただし機械任せにせず臨床の知識で判断する。</div><h3>後退消去法</h3>\n<ol><li>候補をすべて入れた<strong>フルモデル</strong>から始める</li>\n<li>1つずつ抜いたモデルを全部作り、修正R²を比べる</li>\n<li>抜いて<strong>一番改善する</strong>変数を抜く</li>\n<li>どれを抜いても改善しなくなったら止める</li></ol>\n<p>教科書のマリオカート：フルモデルの R²adj＝0.7108。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>抜く変数</th><th>R²adj</th></tr>\n<tr><td>新品</td><td>0.6626</td></tr>\n<tr><td>写真</td><td>0.7107</td></tr>\n<tr><td>出品日数</td><td><strong>0.7128</strong></td></tr>\n<tr><td>ハンドル数</td><td>0.3487</td></tr></table></div>\n<p>出品日数を抜くと改善するので抜く。残り3つはどれを抜いても下がるので、そこで終了。ハンドル数を抜くと 0.35 まで落ちるのを見ると、ハンドル数がいかに重要かも分かります。</p>\n<h3>前進選択法</h3>\n<p>逆に、変数なしから始めて、<strong>一番改善する変数を1つずつ足していく</strong>。改善しなくなったら止める。後退と前進で同じモデルに落ち着くことが多いですが、違うこともあります。</p>\n<h3>修正R²か、p値か</h3>\n<p>修正R²の代わりに、p値（例：0.05より大きい変数を抜く）で選ぶ方法もあります。教科書の整理は、</p>\n<ul><li><strong>予測の精度</strong>を上げたい → 修正R²</li>\n<li><strong>どの変数が統計的に重要か</strong>を知りたい → p値</li></ul>\n<h3>機械的な選択の注意（教科書の外の補足）</h3>\n<p>変数選択を機械任せにすると、第53話の p-hacking や第56話の多重比較と同じ問題が出ます。たくさんの候補から「データで有意だったもの」を選べば、偶然の関連を拾いやすい。医学研究では、</p>\n<ul><li>交絡因子は、<strong>先行研究や臨床的な知識に基づいて事前に</strong>決める</li>\n<li>主な関心の変数（例：治療群）は、有意でなくても<strong>モデルに残す</strong></li>\n<li>機械的な選択は、予測モデルを作るときや探索的な解析に限る</li></ul>\n<p>という考え方が一般的です。「骨年齢は成長の伸びしろを表す」という臨床の知識は、どんなアルゴリズムより先に立ちます。</p>", "keys": ["後退消去法：フルモデルから1つずつ抜き、修正R²が改善しなくなったら止める", "前進選択法：空のモデルから1つずつ足す", "予測が目的なら修正R²、変数の重要性を知りたいならp値", "機械的な選択は偶然の関連を拾いやすい（多重比較と同じ問題）", "医学研究では交絡因子を臨床知識に基づき事前に決めるのが基本"], "upd": null, "quiz": [{"v": "", "q": "後退消去法の進め方として正しいのは。", "o": ["変数なしから1つずつ足す", "全変数から始め、抜いて改善する変数を1つずつ抜く", "p値が一番小さい変数だけ残す", "ランダムに変数を選ぶ"], "a": 1, "e": "フルモデルから始め、改善しなくなったら止める。", "r": "OpenIntro 9章"}, {"v": "", "q": "マリオカートでハンドル数を抜くとR²adjが0.71→0.35に落ちた。意味することは。", "o": ["ハンドル数は不要", "ハンドル数は価格の説明に非常に重要", "モデルが過剰適合", "共線性がない"], "a": 1, "e": "抜くと説明力が大きく落ちる＝重要な変数。", "r": "OpenIntro 9章"}, {"v": "", "q": "医学研究で調整する交絡因子の選び方として推奨されるのは。", "o": ["データで有意だったものだけを選ぶ", "先行研究や臨床的知識に基づいて事前に決める", "できるだけ多く入れる", "R²が最大になる組み合わせを全探索する"], "a": 1, "e": "データ駆動の選択は偶然の関連を拾いやすい。", "r": "OpenIntro 9章"}], "course": "stat"}, {"id": "s69", "lv": 2, "t": "モデルの診断：残差を見る", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §9.3", "vol": "統計 第9章 重回帰とロジスティック回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>「重回帰の式ができた！完成！」。まだです。式が<strong>信用できるか</strong>を、残差で確認します。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>回帰の条件が満たされているかは、<strong>残差のグラフ</strong>で確かめる。式を出したら終わりではない。</div><h3>重回帰の4つの条件</h3>\n<ol><li>残差が<strong>ほぼ正規分布</strong>（特に外れ値がない）</li>\n<li>残差の<strong>ばらつきが一定</strong></li>\n<li>残差が<strong>独立</strong></li>\n<li>各説明変数と y の関係が<strong>直線的</strong></li></ol>\n<h3>4つのグラフ</h3>\n<p>教科書は、それぞれの条件を確認するグラフを紹介しています。</p>\n<ul><li><strong>残差のヒストグラム</strong>：大きな外れ値がないか。データが多ければ多少の歪みは問題にならない</li>\n<li><strong>残差の絶対値 vs 予測値</strong>：予測値が大きくなるほど残差が大きくなる、といったパターンがないか（ばらつき一定の確認）</li>\n<li><strong>データを集めた順番 vs 残差</strong>：時間とともに傾向があれば独立でない（測定機器の変更、季節など）</li>\n<li><strong>各説明変数 vs 残差</strong>：カーブがあれば、その変数との関係は直線でない</li></ul>\n<h3>マリオカートの診断結果</h3>\n<ul><li>ヒストグラム：大きな外れ値なし</li>\n<li>絶対値 vs 予測値：問題なし</li>\n<li>順番：問題なし</li>\n<li><strong>写真の有無</strong>：2群で残差のばらつきが違う（分散不均一）</li>\n<li><strong>ハンドル数</strong>：残差がカーブを描く → 価格とハンドル数の関係は直線でないかもしれない</li></ul>\n<p>教科書は、こうした問題を<strong>報告すること</strong>が大事だと言います。売り手や買い手が分析を読むとき、知っておくべき情報だからです。</p>\n<h3>完璧なモデルはない</h3>\n<p>教科書の締めの言葉は、統計学者ジョージ・ボックスの有名な一言です。</p>\n<div class=\"formula\">すべてのモデルは間違っている。しかし、いくつかは役に立つ。</div>\n<p>条件が少し崩れていても、それを理解し、報告したうえで使えば、モデルは役に立ちます。崩れていることを隠して、確かな結論のように見せることが問題なのです。</p>\n<h3>小児内分泌での例</h3>\n<p>ΔSDSを骨年齢の遅れで回帰したとき、骨年齢の遅れ vs 残差がカーブを描いていたら？　「遅れが大きいほど伸びる」が、ある程度で頭打ちになるのかもしれない。直線を無理に当てはめず、遅れを2乗した項を加えたり、区切って見たりする判断が必要になります。グラフを見なければ、この気づきは得られません。</p>", "keys": ["条件：残差がほぼ正規・ばらつき一定・独立・各変数と直線関係", "確認するグラフ：残差のヒストグラム、|残差| vs 予測値、順番 vs 残差、各変数 vs 残差", "マリオカート：写真で分散不均一、ハンドル数で非線形の可能性", "問題は隠さず報告する", "すべてのモデルは間違っているが、いくつかは役に立つ（Box）"], "upd": null, "quiz": [{"v": "", "q": "説明変数 vs 残差のグラフで残差がカーブを描いていた。示唆されることは。", "o": ["その変数とyの関係が直線でない", "外れ値がない", "残差が正規分布", "モデルは完璧"], "a": 0, "e": "直線では捉えきれない関係が残っている。", "r": "OpenIntro 9章"}, {"v": "", "q": "データを集めた順番 vs 残差のグラフで確認する条件は。", "o": ["正規性", "独立性", "線形性", "外れ値"], "a": 1, "e": "時間的な傾向があれば観測値が独立でない。", "r": "OpenIntro 9章"}, {"v": "", "q": "「すべてのモデルは間違っている。しかし、いくつかは役に立つ」の趣旨は。", "o": ["モデルは使うべきでない", "限界を理解し報告したうえで使えば役に立つ", "条件が崩れたら必ず捨てる", "R²が1なら正しい"], "a": 1, "e": "完璧なモデルはない。限界を知って使う。", "r": "OpenIntro 9章"}], "course": "stat"}, {"id": "s70", "lv": 2, "t": "ロジスティック回帰：はい／いいえを予測する", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §9.5.1–9.5.2", "vol": "統計 第9章 重回帰とロジスティック回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>先輩：「論文では結局、反応あり／なしで書けって教授が。年齢や骨年齢を調整して、反応する確率を比べたい」。yが2値のときの回帰です。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>yが「はい／いいえ」のときは、確率を直接ではなく<strong>ロジット（対数オッズ）</strong>に変換して直線で表す。これがロジスティック回帰。</div><h3>普通の回帰ではだめな理由</h3>\n<p>y が「反応あり＝1、なし＝0」のとき、知りたいのは<strong>反応する確率 p</strong>です。でも p は0〜1の範囲。右辺の β₀＋β₁x は、x によっていくらでも大きく／小さくなれる。そのまま「p＝β₀＋β₁x」とすると、確率が1.3や−0.2になってしまいます。</p>\n<h3>ロジット変換</h3>\n<div class=\"formula\">logit(p) ＝ log( p ／ (1−p) )</div>\n<p>p／(1−p) は<strong>オッズ</strong>（起こる確率÷起こらない確率）。その対数がロジットです。p が0〜1を動くと、ロジットは −∞〜＋∞ を動くので、右辺の直線とつなげられます。</p>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>ロジット</th><th>確率 p</th></tr>\n<tr><td>−3</td><td>0.05</td></tr><tr><td>−2</td><td>0.12</td></tr><tr><td>−1</td><td>0.27</td></tr>\n<tr><td>0</td><td>0.50</td></tr><tr><td>＋1</td><td>0.73</td></tr><tr><td>＋2</td><td>0.88</td></tr><tr><td>＋3</td><td>0.95</td></tr></table></div>\n<div class=\"formula\">log( p ／ (1−p) ) ＝ β₀ ＋ β₁x₁ ＋ … ＋ βₖxₖ</div>\n<h3>確率に戻す</h3>\n<div class=\"formula\">p ＝ e^(右辺) ／ (1 ＋ e^(右辺))</div>\n<h3>教科書の例：履歴書の実験</h3>\n<p>ボストンとシカゴの求人に、架空の履歴書を送って企業から連絡（コールバック）が来るかを調べた実験です。経験年数、学歴、名前などは<strong>ランダムに</strong>割り付けられています。</p>\n<p>まず「表彰歴（月間優秀賞など）の有無」だけでロジスティック回帰すると、</p>\n<div class=\"formula\">logit(p) ＝ −2.4998 ＋ 0.8668 × 表彰歴</div>\n<ul><li>表彰歴なし：logit＝−2.50 → p＝<strong>0.076</strong>（7.6%）</li>\n<li>表彰歴あり：logit＝−1.63 → p＝<strong>0.163</strong>（16.3%）</li></ul>\n<p>表彰歴があるとコールバック率は約2倍。上の表で −2.5 と −1.6 あたりを見れば、計算しなくてもおおよその確率がつかめます。</p>\n<h3>重回帰と同じところ、違うところ</h3>\n<ul><li>同じ：複数の説明変数を入れて「他をそろえたうえで」の効果を見る。モデル選択もできる（教科書は修正R²の代わりに <strong>AIC</strong> を使用）</li>\n<li>違う：係数は確率ではなく<strong>ロジットの単位</strong>。p値は t分布ではなく<strong>正規分布</strong>で計算</li></ul>", "keys": ["yが2値のとき、確率pを直接直線で表すと0〜1をはみ出す", "ロジット＝log(p/(1−p))＝対数オッズ。−∞〜＋∞を動く", "ロジスティック回帰：logit(p)＝β₀＋β₁x₁＋…", "確率に戻す：p＝e^(右辺)/(1＋e^(右辺))。logit 0→0.5、−2→0.12、＋2→0.88", "表彰歴の例：なし7.6%、あり16.3%"], "upd": null, "quiz": [{"v": "", "q": "ロジスティック回帰を使うのはどんなときか。", "o": ["yが連続値", "yが2値（はい／いいえ）", "xが2値", "データが正規分布"], "a": 1, "e": "反応変数が2水準のカテゴリーのとき。", "r": "OpenIntro 9章"}, {"v": "", "q": "logit(p)＝0 のときの確率 p は。", "o": ["0", "0.27", "0.5", "1"], "a": 2, "e": "オッズ1＝五分五分。p＝0.5。", "r": "OpenIntro 9章"}, {"v": "", "q": "p＝0.8 のときのオッズは。", "o": ["0.8", "0.2", "4", "1.25"], "a": 2, "e": "オッズ＝p/(1−p)＝0.8/0.2＝4。", "r": "OpenIntro 9章"}], "course": "stat"}, {"id": "s71", "lv": 3, "t": "オッズ比を読む：論文の表を前にして", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e §9.5.3（オッズ比は補足）", "vol": "統計 第9章 重回帰とロジスティック回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>医学論文のロジスティック回帰の表には、係数ではなく「OR（95% CI）」が並んでいます。それが何なのかを、教科書の例で確かめます。</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>ロジスティック回帰の係数 β を e^β にすると<strong>オッズ比</strong>になる。1より大きければ起こりやすく、1より小さければ起こりにくい。</div><h3>係数からオッズ比へ（教科書の外の補足）</h3>\n<p>係数 β₁ は「x₁ が1増えると<strong>ロジット（対数オッズ）</strong>が β₁ 増える」。対数のままでは分かりにくいので、e の β₁ 乗をとると、</p>\n<div class=\"formula\">オッズ比（OR）＝ e^β₁ ＝ x₁が1増えたときのオッズが何倍になるか</div>\n<ul><li>OR＝1：関係なし（係数0に対応）</li>\n<li>OR＞1：起こりやすくなる</li>\n<li>OR＜1：起こりにくくなる</li>\n<li>ORの95% CIが<strong>1をまたがなければ</strong>有意（係数のCIが0をまたがないのと同じ）</li></ul>\n<p>表彰歴の例：e^0.8668＝<strong>2.38</strong>。表彰歴があるとコールバックのオッズが2.38倍。</p>\n<h3>人種による差別の実験</h3>\n<p>履歴書の実験で全変数を入れたモデルでは、名前が白人と認識される場合の係数は <strong>0.4429</strong>（p＜0.0001）。OR＝e^0.4429≈<strong>1.56</strong>。教科書は、他の条件が<strong>まったく同じ</strong>履歴書で計算しています。</p>\n<ul><li>シカゴ、経験14年、メールアドレスあり、男性、<strong>白人と認識される名前</strong>：p＝<strong>8.35%</strong>（約12通に1回連絡が来る）</li>\n<li>同じ条件で<strong>黒人と認識される名前</strong>：p＝<strong>5.53%</strong>（約18通に1回）</li></ul>\n<p>黒人と認識される応募者は、連絡を1回もらうのに<strong>約50%多く</strong>応募しなければならない。これはランダム化された<strong>実験</strong>なので、名前が原因だと言えます。教科書は、この結果を「警告的で論争的」としつつ、どの企業が差別しているかまでは特定できない限界も述べています。</p>\n<h3>オッズ比は確率の比ではない</h3>\n<p>上の例で、確率の比は 8.35／5.53＝<strong>1.51</strong>、オッズ比は<strong>1.56</strong>。近いのは、コールバックが<strong>まれ</strong>（10%未満）だからです。</p>\n<div class=\"formula\">イベントがまれなら OR ≈ 相対リスク。よくあるイベントでは OR は相対リスクより極端になる</div>\n<p>GHの反応率のように50%前後のアウトカムでは、OR 2.0 は「反応率が2倍」ではありません。たとえば反応率40%→57%はオッズが0.67→1.33でOR 2.0ですが、確率では約1.4倍です。論文の「OR 2.0」を「2倍起こりやすい」と読むのは、まれなイベントのときだけです。</p>\n<h3>論文の表の読み方</h3>\n<p>「調整済みOR 0.70（95% CI 0.52–0.94）」なら、表に並んだ<strong>他の変数をそろえたうえで</strong>、その変数が1単位増えるとオッズが0.70倍（30%減）。CIが1をまたがないので有意。調整に使った変数が何か、それが妥当か（第68話）まで確認できれば十分です。</p>", "keys": ["オッズ比OR＝e^β。xが1増えたときのオッズの倍率", "OR＞1で起こりやすい、OR＜1で起こりにくい。95% CIが1をまたがなければ有意", "履歴書実験：白人と認識される名前のOR≈1.56、コールバック8.35% vs 5.53%", "まれなイベントならOR≈相対リスク。よくあるイベントではORは確率の比より極端", "調整済みORは表の他の変数をそろえたうえでの値"], "upd": null, "quiz": [{"v": "", "q": "ロジスティック回帰の係数が 0.69 のとき、オッズ比は約。", "o": ["0.69", "1.0", "2.0", "0.5"], "a": 2, "e": "e^0.69≈2.0。", "r": "OpenIntro 9章"}, {"v": "", "q": "オッズ比の95% CIが (0.52, 0.94) のときの解釈は。", "o": ["有意でない", "オッズを下げる方向に有意", "オッズを上げる方向に有意", "確率が半分になる"], "a": 1, "e": "CIが1をまたがず、1より小さい。", "r": "OpenIntro 9章"}, {"v": "", "q": "オッズ比が相対リスク（確率の比）とほぼ等しくなるのは。", "o": ["イベントが50%前後のとき", "イベントがまれなとき", "標本が大きいとき", "常に等しい"], "a": 1, "e": "まれなイベントではオッズ≈確率なので、OR≈RR。", "r": "OpenIntro 9章"}], "course": "stat"}, {"id": "s72", "lv": 3, "t": "総まとめ：論文を読むための9章", "min": 5, "cats": "", "src": "OpenIntro Statistics 4e 全章の振り返り", "vol": "統計 第9章 重回帰とロジスティック回帰", "body": "<div class=\"scene\"><span class=\"scene-tag\">研究室の一場面</span>最終話。先輩の57人の研究は、ここまでで何度も解析し直されてきました。先輩：「結局、俺の研究から何が言えるん？」</div><div class=\"gist\"><b class=\"gl\">ひとことで</b>統計の目的は「有意かどうか」の判定ではなく、<strong>何がどれだけ確かに言えて、何が言えないか</strong>を正直に示すこと。</div><h3>先輩の研究で学んだこと</h3>\n<div class=\"tblwrap\"><table class=\"cmp\"><tr><th>章</th><th>先輩の研究で見えたこと</th></tr>\n<tr><td>1</td><td>観察研究。治療群と比較群は無作為に分けられていない</td></tr>\n<tr><td>2</td><td>58% vs 46%。カードの並べ替えで「偶然でも4回に1回」</td></tr>\n<tr><td>4</td><td>二項分布で、効果なしでも18人以上の反応は8回に1回</td></tr>\n<tr><td>5</td><td>反応率の95% CI 41〜75%。31人では幅が広い</td></tr>\n<tr><td>6</td><td>差の検定 p＝0.37、検出力約15%。必要数は1群271人</td></tr>\n<tr><td>7</td><td>ΔSDSならp≈0.04。ただし事後に選んだ評価項目は探索的</td></tr>\n<tr><td>8</td><td>若く始めるほど伸びる（p≈0.008、R²＝0.22）</td></tr>\n<tr><td>9</td><td>骨年齢の遅れを調整すると年齢の効果は消える</td></tr></table></div>\n<p>正直なまとめはこうです。「この57人の後ろ向きデータでは、GHの反応率に有意差は示されなかったが、検出力は低かった。探索的には、ΔSDSと骨年齢の遅れに関連が示唆された。前向き研究（ΔSDSを主要評価項目、1群約50人）での検証が必要」。<strong>有意でなかった研究にも、次の研究を設計するための価値がある</strong>。</p>\n<h3>論文を読むときのチェックリスト</h3>\n<ol><li><strong>デザイン</strong>：ランダム化か観察か。観察なら交絡を何で調整したか（1・9章）</li>\n<li><strong>対象</strong>：誰から集めたか。自分の患者に当てはまるか（1章）</li>\n<li><strong>主要評価項目</strong>：事前に決められていたか。登録はあるか（7章）</li>\n<li><strong>効果の大きさ</strong>：差、RR、OR、NNT。p値だけで判断しない（5・6章）</li>\n<li><strong>信頼区間</strong>：幅は広すぎないか。臨床的に意味のある差を含むか（5章）</li>\n<li><strong>症例数と検出力</strong>：「有意差なし」が「効果なし」を意味しうる設計か（6・7章）</li>\n<li><strong>多重性</strong>：サブグループ解析や多数の評価項目の中の一つではないか（7章）</li>\n<li><strong>外挿</strong>：研究の範囲外の患者に当てはめていないか（8章）</li></ol>\n<h3>この先に</h3>\n<p>このコースでは OpenIntro Statistics の9章を、小児内分泌の文脈で読んできました。この先には、生存時間解析（Kaplan–Meier、Cox回帰）、混合効果モデル（同じ子の繰り返し測定）、ベイズ統計などがあります。どれも、ここで学んだ<strong>標本分布・標準誤差・信頼区間・検定・回帰</strong>の上に積み上がっています。</p>\n<p>先輩：「最初は『58%と46%、差があるやん』で終わっとった。今は、その差がどれくらい確かかを言える」。それが、このコースの到達点です。全72話、おつかれさまでした。</p>", "keys": ["統計の目的は有意かどうかではなく、何がどれだけ確かに言えるかを示すこと", "有意でない研究も、効果量と信頼区間を報告すれば次の研究の設計に役立つ", "論文チェック：デザイン・対象・主要評価項目・効果の大きさ・信頼区間・検出力・多重性・外挿", "この先：生存時間解析、混合効果モデル、ベイズ統計", "すべては標本分布・SE・信頼区間・検定・回帰の上に積み上がる"], "upd": null, "quiz": [{"v": "", "q": "「有意差なし」の論文を読むとき、まず確認すべきことは。", "o": ["著者の所属", "症例数と検出力、効果量の信頼区間", "p値の小数点以下の桁", "図の色"], "a": 1, "e": "検出力が低ければ有意差なしは効果なしを意味しない。CIで差の大きさの範囲を見る。", "r": "OpenIntro 9章"}, {"v": "", "q": "「サブグループAでのみ有意」という結果を読むときの注意点は。", "o": ["最も信頼できる結果", "いくつのサブグループを見た中の1つかを確認する", "サブグループは必ず誤り", "p値を半分にして読む"], "a": 1, "e": "多数のサブグループを見れば偶然の有意が出やすい（多重比較）。", "r": "OpenIntro 9章"}, {"v": "", "q": "観察研究で調整済みORが有意だったとき、言えることは。", "o": ["因果関係が証明された", "調整した変数をそろえたうえでの関連がある。測っていない交絡は残りうる", "交絡は完全に除かれた", "ランダム化試験と同等"], "a": 1, "e": "調整できるのはモデルに入れた変数のみ。", "r": "OpenIntro 9章"}], "course": "stat"}];
const STAT_CH = [
  {id:"st1", n:"01", t:"データ入門", s:"研究の問い・変数・サンプリング・実験計画", lessons:ST1.map(prepLesson)},
